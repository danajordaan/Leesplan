ees en weduwee (24:19–22; vgl. Rut). Eerlike gewigte (25:13–16). Die eerste vrugte en die belydenis: \"My vader was 'n swerwende Arameër...\" (26:5–10). Jy moet bly wees oor al die goeie (26:11).","bid":"Bid vir eerlikheid in alles. Bid dat ons die mense wat vir ons werk, regverdig en vriendelik sal behandel. Dank God vir die \"eerste vrugte\" in ons lewe en bid vir 'n vrygewige hart.","vraag":"Waarom dink jy moes die boer die geskiedenis van God se verlossing hardop sê wanneer hy sy oes bring?","hoofstukke":[["Deuteronomium","DEU",24],["Deuteronomium","DEU",25],["Deuteronomium","DEU",26]]},{"dag":78,"ref":"Deuteronomium 27 – 28","titel":"Seëninge en Vloeke van die Verbond","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, met die opdrag vir 'n seremonie by die berge Ebal en Gerisim (uitgevoer in Josua 8:30–35).","agtergrond":"Die volk moes, wanneer hulle in die land kom, die wet op gepleisterde klippe skryf en die vloeke en seëninge hardop uitroep, met die volk wat telkens \"Amen\" antwoord. Hoofstuk 28 is lank (68 verse): die seëninge vir gehoorsaamheid word gevolg deur baie meer vloeke vir ongehoorsaamheid – oorlog, honger, siekte en uiteindelik ballingskap onder die nasies. Hierdie waarskuwings is in 722 v.C. en 586 v.C. letterlik vervul.","leer":"God se woord is ernstig; Hy meen wat Hy belowe – seën én oordeel. Ongehoorsaamheid aan God lei tot 'n lewe wat stukkend val. Maar die Nuwe Testament verkondig die goeie nuus: Christus het ons losgekoop van die vloek van die wet deur vir ons 'n vloek te word (Galasiërs 3:13), sodat die seën van Abraham na ons kan kom.","skrif":"Die volk sê \"Amen\" op elke vloek (27:15–26). \"Vervloek is hy wat die woorde van hierdie wet nie in stand hou nie\" (27:26; aangehaal in Galasiërs 3:10). \"As jy getrou luister na die stem van die Here jou God... sal al hierdie seëninge oor jou kom\" (28:1–2). \"Die Here sal jou maak tot die hoof en nie tot die stert nie\" (28:13). Die vloeke (28:15–68), insluitend ballingskap onder al die volke (28:64).","bid":"Dank Jesus dat Hy die vloek van ons sonde gedra het sodat ons geseën kan word. Bid vir gehoorsame harte. Bid vir ons land, wat ook die gevolge van ongehoorsaamheid aan God ervaar.","vraag":"As Jesus die vloek vir ons gedra het, waarom is gehoorsaamheid steeds belangrik?","hoofstukke":[["Deuteronomium","DEU",27],["Deuteronomium","DEU",28]]},{"dag":79,"ref":"Deuteronomium 29 – 31","titel":"Kies die Lewe!","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, Moses is 120 jaar oud (31:2).","agtergrond":"Moses hernu die verbond met die nuwe geslag en ook met die toekomstige geslagte (29:14–15). Hoofstuk 30 kyk vorentoe na ná die ballingskap: God sal die harte van Sy volk besny sodat hulle Hom kan liefhê. Paulus pas 30:11–14 op die evangelie toe (Romeine 10:6–8). Josua word amptelik as leier aangestel. Elke sewe jaar moes die hele wet by die Huttefees voor die hele volk, insluitend die kinders, gelees word.","leer":"God stel ons voor 'n keuse: lewe of dood, seën of vloek – en Hy smeek ons om die lewe te kies. Om die Here lief te hê, is self die lewe. Sommige dinge bly vir ons verborge, maar wat God geopenbaar het, behoort aan ons en ons kinders om te doen. God belowe: \"Ek sal jou nie begewe en jou nie verlaat nie.\"","skrif":"\"Die verborge dinge is vir die Here onse God; maar die geopenbaarde dinge is vir ons en ons kinders tot in ewigheid\" (29:29). \"Die Here jou God sal jou hart besny... sodat jy die Here jou God kan liefhê\" (30:6). \"Hierdie gebod... is vir jou nie te wonderlik nie... die woord is baie naby jou\" (30:11–14). \"Kies dan die lewe, sodat jy kan lewe, jy en jou nageslag, deur die Here jou God lief te hê\" (30:19–20). \"Wees sterk en moedig... want die Here jou God, Hy is dit wat met jou saamgaan; Hy sal jou nie begewe en jou nie verlaat nie\" (31:6). Lees die wet voor die mans, vroue, kinders en vreemdelinge (31:12–13).","bid":"Bid dat elkeen van ons die lewe sal kies – Jesus, wat die Lewe is. Bid dat God ons harte sal \"besny\" sodat ons Hom kan liefhê. Dank Hom vir die belofte dat Hy ons nie sal verlaat nie.","vraag":"Moses sê: \"Kies dan die lewe.\" Watter keuses maak 'n tiener wat \"die lewe kies\"?","hoofstukke":[["Deuteronomium","DEU",29],["Deuteronomium","DEU",30],["Deuteronomium","DEU",31]]},{"dag":80,"ref":"Deuteronomium 32 – 34","titel":"Die Lied van Moses en sy Dood","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die berg Nebo (Pisga) in Moab, met 'n uitsig oor die hele beloofde land.","agtergrond":"Die lied van Moses (hoofstuk 32) is 'n \"getuie\" in poësievorm wat die volk sou onthou – liedjies word makliker onthou as wette. God word \"die Rots\" genoem. In hoofstuk 33 seën Moses die stamme. Hoofstuk 34 vertel van Moses se dood en is waarskynlik deur iemand anders (bv. Josua) bygevoeg. God het Moses self begrawe, en niemand ken sy graf nie. Moses verskyn later saam met Elia op die berg van die verheerliking (Markus 9:4) – in die beloofde land, saam met Jesus.","leer":"God is ons Rots: volkome, getrou en regverdig. Sy Woord is nie 'n leë woord nie – dit is ons lewe. Selfs die grootste leier sterf, maar God bly. Die ewige God is ons toevlug, en Sy arms dra ons. Moses wys vorentoe na 'n groter Profeet wat ons wel in die ware beloofde land sal bring.","skrif":"\"Hy is die Rots wie se werk volkome is, want al sy weë is reg\" (32:4). God het Israel bewaar \"soos sy oogappel\", soos 'n arend wat sy kleintjies op sy vlerke dra (32:10–11). \"Dit is nie 'n leë woord vir julle nie, maar dit is julle lewe\" (32:47). Die seën oor die stamme (33). \"Die ewige God is 'n toevlug, en onder is daar ewige arms\" (33:27). Moses sien die land (34:1–4). \"Toe het Moses, die kneg van die Here, daar gesterwe\" (34:5). Daar het geen profeet weer opgestaan soos Moses, wat die Here van aangesig tot aangesig geken het nie (34:10).","bid":"Loof God as ons Rots en dank Hom vir Sy \"ewige arms\" wat ons dra. Bid dat God se Woord vir ons \"nie 'n leë woord nie, maar ons lewe\" sal wees. Dank Jesus wat groter is as Moses (Hebreërs 3:3), en wat ons in die ewige beloofde land bring.","vraag":"God het Moses toegelaat om die land te sien maar nie in te gaan nie. Hoe het God dit later op 'n ander manier vervul (Markus 9:4)?","hoofstukke":[["Deuteronomium","DEU",32],["Deuteronomium","DEU",33],["Deuteronomium","DEU",34]]},{"dag":81,"ref":"Josua 1 – 2","titel":"Wees Sterk en Moedig","fase":4,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, oorkant Jerigo.","agtergrond":"Josua (\"die Here red\" – dieselfde naam as Jesus in Grieks) was Moses se assistent en een van die twee getroue verkenners. Jerigo was 'n antieke ommuurde stad by 'n oase naby die Jordaan – die poort na Kanaän. Ragab was 'n prostituut wie se huis in die stadsmuur gebou was. Sy het gehoor van die Rietsee en die oorwinnings oor Sihon en Og, en die Here se Naam erken. Sy word later 'n voorouer van Dawid en Jesus (Matteus 1:5) en 'n voorbeeld van geloof (Hebreërs 11:31).","leer":"Die geheim van moed en sukses in God se oë is Sy teenwoordigheid en daaglikse oordenking van Sy Woord. God se genade bereik selfs dié wat die minste waardig lyk, wanneer hulle in geloof na Hom draai. Ons verlede bepaal nie ons toekoms as ons in God skuil nie.","skrif":"\"Soos Ek met Moses was, sal Ek met jou wees; Ek sal jou nie begewe en jou nie verlaat nie\" (1:5). \"Hierdie wetboek moet nie wyk uit jou mond nie, maar bepeins dit dag en nag... want dan sal jy op jou weë voorspoedig wees\" (1:8). \"Wees sterk en moedig; wees nie verskrik en wees nie ontsteld nie; want die Here jou God is met jou oral waar jy gaan\" (1:9). Ragab versteek die verkenners (2:4–6). \"Die Here julle God, Hy is God in die hemel daarbo en op die aarde hieronder\" (2:11). Die skarlakenrooi lyn in die venster (2:18–21).","bid":"Bid vir moed vir ons gesin se kinders in die uitdagings wat voorlê (skool, toetse, groepsdruk). Bid dat hulle God se Woord daagliks sal oordink. Dank God dat Sy genade ook mense met 'n slegte verlede bereik.","vraag":"Josua 1:9 sê \"wees sterk en moedig\". Waar het jy vandeesweek moed nodig?","hoofstukke":[["Josua","JOS",1],["Josua","JOS",2]]},{"dag":82,"ref":"Josua 3 – 5","titel":"Oor die Jordaan: Gedenkstene vir die Kinders","fase":4,"tydlyn":"Die 10de van die eerste maand (4:19), net voor Paasfees, c. 1406 v.C. (of c. 1230 v.C.).","agtergrond":"Die Jordaan was in die lente in vloed (3:15) as gevolg van die smeltende sneeu op die berg Hermon. Die priesters moes eers met hul voete in die water stap voordat die water stilgestaan het. Die volk rig twaalf klippe op by Gilgal as 'n gedenkteken. Die nuwe geslag is in die woestyn nie besny nie, en word nou besny. Hulle hou Paasfees, en die manna hou op. Die \"Owerste van die leër van die Here\" (5:14) word deur baie uitleggers gesien as 'n verskyning van Christus voor Sy menswording.","leer":"Geloof tree soms eers uit voordat God die pad oopmaak. God wil hê dat ons gedenktekens van Sy trou sal oprig, sodat ons kinders kan vra en hoor. Voordat ons vorentoe gaan, moet ons ons heilig en aan God toewy. God is nie bloot \"aan ons kant\" nie – ons moet aan Sy kant wees.","skrif":"\"Heilig julle, want môre sal die Here wonders onder julle doen\" (3:5). Die water staan stil sodra die priesters se voete daarin stap (3:15–16). \"Wanneer julle kinders later vra: Wat beteken hierdie klippe vir julle?\" (4:6–7, 21–24). \"Sodat al die volke van die aarde die hand van die Here kan ken... en julle die Here julle God al die dae kan vrees\" (4:24). Die besnydenis by Gilgal (5:2–9). Die manna hou op (5:12). \"Is U vir ons of vir ons teëstanders?\" – \"Nee, maar ek is die Owerste van die leër van die Here\" (5:13–14).","bid":"Dank God vir die \"gedenkstene\" in ons gesin – plekke en tye waar Hy getrou was. Bid vir geloof om die eerste tree te gee wanneer God ons roep. Bid dat ons altyd aan die Here se kant sal staan.","vraag":"As ons as gesin 'n \"gedenksteen\" vir God se trou moet oprig, waaroor sou dit gaan?","hoofstukke":[["Josua","JOS",3],["Josua","JOS",4],["Josua","JOS",5]]},{"dag":83,"ref":"Josua 6 – 7","titel":"Jerigo se Mure en Agan se Sonde","fase":4,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Jerigo en Ai, in die Jordaanvallei en die heuwels daarbo.","agtergrond":"Die oorwinning by Jerigo was duidelik God se werk – deur 'n onlogiese plan van sewe dae se optog en basuine. Jerigo was die \"eerstelinge\" van die land, en alles daarin was \"met die ban getref\" – dit het aan God behoort, gedeeltelik vir vernietiging en gedeeltelik vir die skat van die Here. Opgrawings by Jerigo word verskillend gedateer en verklaar; geleerdes stem nie saam oor die argeologie nie. Agan steel van dit wat aan God gewy was, en die gevolg is 'n nederlaag by die klein stad Ai. (Die oordeel oor die volke van Kanaän was God se oordeel oor eeue se ernstige sonde, Genesis 15:16; Deuteronomium 9:5.)","leer":"God veg vir Sy volk, en Sy oorwinnings kom deur geloof en gehoorsaamheid, nie deur menslike strategie nie. Een persoon se versteekte sonde kan 'n hele gemeenskap raak. Sonde begin met sien, begeer, vat en wegsteek – en moet eerlik bely word. God se genade red Ragab en haar familie.","skrif":"\"Deur die geloof het die mure van Jerigo geval\" (Hebreërs 11:30). Die volk skreeu en die muur val (6:20). Ragab en haar familie word gered (6:22–25). Israel word verslaan by Ai (7:4–5). Josua lê op sy aangesig (7:6). God: \"Israel het gesondig\" (7:11). Agan bely: \"Ek het gesien... begeer... geneem... en kyk, dit is weggesteek\" (7:21). Die hele volk raak die gevolge (7:24–26).","bid":"Bid dat ons nie sonde sal \"wegsteek\" nie, maar dit eerlik voor God en mekaar sal bely. Dank God vir Sy oorwinning in Jesus. Bid vir beskerming teen die patroon \"sien, begeer, vat en wegsteek\".","vraag":"Agan se sonde het met \"sien\" begin. Hoe begin sonde dikwels by ons oë?","hoofstukke":[["Josua","JOS",6],["Josua","JOS",7]]},{"dag":84,"ref":"Josua 8 – 9","titel":"Herstel, Verbond en 'n Fout sonder Gebed","fase":4,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Ai, die berge Ebal en Gerisim by Sigem, en Gibeon.","agtergrond":"Ná Agan se sonde gehanteer is, gee God oorwinning by Ai. Josua voer dan die opdrag van Deuteronomium 27 uit: die wet word op klippe geskryf en die seëninge en vloeke word by Ebal en Gerisim gelees. Die Gibeoniete, 'n naburige volk, mislei Israel met ou klere en droë brood om voor te gee dat hulle van ver kom. In die antieke wêreld was 'n eed in God se Naam bindend, selfs al is dit op bedrog gegrond.","leer":"Wanneer sonde hanteer is, kan God se seën weer vloei. God se Woord moet voor almal gelees word – mans, vroue, kinders en vreemdelinge. Wanneer ons besluite neem op grond van wat ons sien, sonder om God te raadpleeg, maak ons foute. Ons moet ons woord hou, selfs as dit ons iets kos.","skrif":"\"Wees nie bevrees en wees nie verskrik nie\" (8:1). Die wet word op die klippe geskryf (8:32). Josua lees die hele wet voor die hele vergadering, ook die vroue, kinders en vreemdelinge (8:34–35). Die Gibeoniete se bedrog (9:3–13). \"Maar die mond van die Here het hulle nie geraadpleeg nie\" (9:14). Hulle hou hul eed (9:19–20). Die Gibeoniete word houtkappers en waterputters vir die huis van God (9:27).","bid":"Bid dat ons God se raad sal vra voordat ons besluite neem – groot en klein. Bid dat ons woord betroubaar sal wees. Dank God dat Hy selfs ons foute ten goede kan gebruik.","vraag":"Die Israeliete het die Gibeoniete se \"bewyse\" gesien maar nie God gevra nie. Hoe kan ons in ons keuses eers God raadpleeg?","hoofstukke":[["Josua","JOS",8],["Josua","JOS",9]]},{"dag":85,"ref":"Josua 10 – 12","titel":"Die Dag wat die Son Stilgestaan het","fase":4,"tydlyn":"c. 1406–1400 v.C. (of c. 1230–1220 v.C.). Die suidelike en noordelike veldtogte deur Kanaän.","agtergrond":"Vyf Amoritiese konings val Gibeon aan omdat dit vrede met Israel gemaak het. Josua kom Gibeon te hulp en God gee 'n groot oorwinning met hael en 'n buitengewone verlenging van die dag (10:12–14). Hoe dit presies gebeur het, verduidelik die teks nie; dit beklemtoon dat God vir Israel geveg het. Daarna volg die verowering van die suide en die noorde (onder Jabin van Hasor). Hoofstuk 12 lys 31 konings wat verslaan is. Die inname was egter nie volledig nie (13:1); dele van die land moes nog ingeneem word.","leer":"God hoor die gebede van Sy kinders – selfs dapper, groot gebede. Hy hou Sy beloftes en veg vir Sy volk. Gehoorsaamheid is volledig wanneer ons \"niks nalaat van alles wat die Here beveel het nie\". God se oordeel oor sonde is werklik en ernstig.","skrif":"\"Wees nie bevrees nie, want Ek het hulle in jou hand gegee\" (10:8). \"Son, staan stil in Gibeon\" (10:12). \"Daar was geen dag soos dié nie... dat die Here na die stem van 'n man geluister het; want die Here het vir Israel geveg\" (10:14). \"Wees nie bevrees nie... wees sterk en moedig\" (10:25). \"Hy het niks nagelaat van alles wat die Here Moses beveel het nie\" (11:15). \"En die land het gerus van oorlog\" (11:23).","bid":"Bid groot gebede vir dinge wat net God kan doen. Dank God dat Hy vir ons veg. Bid vir volledige gehoorsaamheid, nie net halfpad nie.","vraag":"Josua het 'n baie dapper gebed gebid. Waarvoor sou jy 'n \"dapper\" gebed wil bid?","hoofstukke":[["Josua","JOS",10],["Josua","JOS",11],["Josua","JOS",12]]},{"dag":86,"ref":"Josua 13 – 17","titel":"Die Land Verdeel – en Kaleb se Geloof","fase":4,"tydlyn":"c. 1400 v.C. (of c. 1220 v.C.). Josua is oud (13:1). Die stamgebiede in Kanaän.","agtergrond":"Hierdie hoofstukke beskryf die grense van die gebiede wat aan die stamme toegeken is – met baie plekname (lees dit gerus vinniger of gebruik 'n Bybelkaart). Die land is deur lootjies verdeel, wat as God se keuse beskou is (Spreuke 16:33). Die Leviete het nie 'n eie gebied gekry nie, want \"die Here is hulle erfdeel\". Kaleb, nou 85 jaar oud, vra die bergland van Hebron – juis die plek waar die reuse gewoon het wat die ander verkenners bang gemaak het. Die dogters van Selofhad ontvang hulle erfdeel soos belowe (17:3–6).","leer":"God hou Sy beloftes tot in die detail – elke stam kry sy deel. Geloof word nie oud nie: Kaleb het 45 jaar lank aan God se belofte vasgehou. Gedeeltelike gehoorsaamheid – die Kanaäniete laat bly – sal later 'n strik word. Ons moet nie kla oor ons erfdeel nie, maar dit in geloof inneem.","skrif":"\"Daar bly nog baie van die land oor om in besit te neem\" (13:1). Die Leviete se erfdeel is die Here (13:14, 33). Kaleb: \"Ek het die Here my God volkome gevolg\" (14:8). \"Ek is vandag nog net so sterk soos op die dag toe Moses my uitgestuur het... gee my dan nou hierdie gebergte\" (14:11–12). Akhsa vra vir waterbronne (15:16–19). Die Jebusiete in Jerusalem kon nie verdryf word nie (15:63). Efraim en Manasse laat die Kanaäniete bly (16:10; 17:12–13). Josua: \"As jy 'n groot volk is, trek dan op na die bos en kap vir jou daar oop\" (17:15).","bid":"Dank God vir die \"erfdeel\" – die plek, gawes en geleenthede – wat Hy vir elkeen van ons gegee het. Bid vir 'n geloof wat nie oud word nie, soos Kaleb s'n. Bid dat ons nie sonde in ons lewe sal \"laat bly\" nie.","vraag":"Kaleb het op 85 die moeilikste gebied gevra. Wat sê dit oor sy geloof?","hoofstukke":[["Josua","JOS",13],["Josua","JOS",14],["Josua","JOS",15],["Josua","JOS",16],["Josua","JOS",17]]},{"dag":87,"ref":"Josua 18 – 21","titel":"Die Tabernakel in Silo en God se Volkome Trou","fase":4,"tydlyn":"c. 1400 v.C. (of c. 1220 v.C.). Silo, in die sentrale bergland van Efraim.","agtergrond":"Die tabernakel word in Silo opgerig, waar dit sowat 300 jaar sal bly, tot in die tyd van Samuel. Sewe stamme het nog nie hulle erfdeel ingeneem nie en word aangemoedig om dit te doen. Die laaste gebiede word verdeel, die vrystede (soos in Numeri 35) en die 48 stede vir die Leviete word aangewys. Die Leviete was oor die hele land versprei – sodat God se wet oral geleer kon word.","leer":"Uitstel is gevaarlik: \"Hoe lank sal julle nalatig wees?\" God het nie een woord van al Sy beloftes laat val nie. Dit is die fondament van ons vertroue – soos God vir Israel getrou was, sal Hy ook vir ons getrou wees.","skrif":"Die tabernakel in Silo (18:1). \"Hoe lank sal julle nalatig wees om in te gaan en die land in besit te neem?\" (18:3). Josua kry sy eie erfdeel laaste (19:49–50). Die vrystede (20:1–9). Die stede van die Leviete (21:1–42). \"Daar het niks verval van al die goeie woorde wat die Here met die huis van Israel gespreek het nie; dit het alles uitgekom\" (21:45).","bid":"Dank God dat nie een van Sy beloftes ooit misluk het nie. Bid vir ons gesin dat ons nie \"nalatig\" sal wees in die dinge wat God vir ons gee nie. Bid dat Sy Woord oral in ons land geleer sal word.","vraag":"Josua 21:45 sê al God se beloftes het uitgekom. Watter belofte van God is vir jou nou belangrik?","hoofstukke":[["Josua","JOS",18],["Josua","JOS",19],["Josua","JOS",20],["Josua","JOS",21]]},{"dag":88,"ref":"Josua 22 – 24","titel":"\"Maar Ek en My Huis, Ons sal die Here Dien\"","fase":4,"tydlyn":"c. 1380 v.C. (of c. 1200 v.C.). Josua is 110 jaar oud aan die einde. Sigem.","agtergrond":"Die stamme oos van die Jordaan bou 'n altaar, en die res van Israel dink hulle het afgedwaal – byna 'n burgeroorlog! Dit blyk 'n misverstand te wees; die altaar was 'n getuienis van eenheid. Josua se laaste toesprake (hoofstuk 23–24) volg die verbondspatroon: wat God gedoen het, en die oproep tot trou. Sigem was die plek waar God Sy belofte aan Abraham gegee het (Genesis 12:6–7). Josef se beendere word daar begrawe (24:32), soos hy gevra het.","leer":"Misverstande moet met gesprek opgelos word, nie met vinnige oordele nie. Elke gesin moet self besluit wie hulle gaan dien – dit kan nie oorgeërf word nie. God se volk moet die afgode wegdoen. Josua se lewe eindig in getrouheid, en sy invloed het die volgende geslag bly vorm.","skrif":"Die altaar as getuie (22:10–34). \"Hou baie goed in die oog... om die Here julle God lief te hê\" (23:11). \"Kies dan vandag vir julle wie julle wil dien... Maar ek en my huis, ons sal die Here dien!\" (24:15). Die volk: \"Ver is dit van ons om die Here te verlaat\" (24:16). Josua: \"Doen dan nou die vreemde gode weg wat onder julle is\" (24:23). Die klip as getuie (24:26–27). \"Israel het die Here gedien al die dae van Josua en al die dae van die oudstes wat Josua oorleef het\" (24:31).","bid":"Maak as gesin die keuse van Josua 24:15 jou eie gebed: \"Ek en my huis, ons sal die Here dien.\" Bid dat elkeen persoonlik daardie keuse sal maak. Bid vir 'n getroue nalatenskap.","vraag":"Waarom kan geloof nie oorgeërf word nie? Wat beteken dit vir jou om persoonlik te kies?","hoofstukke":[["Josua","JOS",22],["Josua","JOS",23],["Josua","JOS",24]]},{"dag":89,"ref":"Rigters 1 – 2","titel":"Halwe Gehoorsaamheid en die Kringloop van Sonde","fase":4,"tydlyn":"c. 1380/1200 v.C. Ná Josua se dood. Kanaän.","agtergrond":"Die boek Rigters beskryf die tyd tussen Josua en die konings. \"Rigters\" was nie hoofsaaklik hofregters nie, maar leiers wat God opgewek het om Israel te bevry van onderdrukkers. Die stamme verdryf nie die Kanaäniete volledig nie, en neem hul gode oor – veral Baäl (die storm- en vrugbaarheidsgod) en Astarte (godin van vrugbaarheid en oorlog). Hoofstuk 2 gee die patroon van die hele boek: sonde → verdrukking → roep na God → God stuur 'n rigter → rus → weer sonde.","leer":"Elke geslag moet God self leer ken; die vorige geslag se geloof is nie genoeg nie. Kompromie met die sonde rondom ons lei uiteindelik tot afgodery. Maar God se genade is onvermoeid: elke keer as die volk roep, stuur Hy redding.","skrif":"Juda en die ander stamme verdryf nie die inwoners nie (1:19–36). Die Engel van die Here: \"Hulle sal vir julle 'n strik word\" (2:3). \"Daar het 'n ander geslag ná hulle opgestaan wat die Here nie geken het nie\" (2:10). Die kringloop: hulle doen wat verkeerd is, God gee hulle oor, hulle is in benoudheid, God verwek rigters (2:11–19). \"Die Here het berou gehad oor hul gekerm\" (2:18).","bid":"Bid dat ons gesin se kinders se geslag die Here persoonlik sal ken. Bid dat ons nie stadig sal toegee aan die \"gode\" van ons kultuur nie. Dank God vir Sy geduld en genade.","vraag":"Rigters 2:10 sê 'n hele geslag het die Here nie geken nie. Hoe kan dit gebeur ná so 'n groot geskiedenis?","hoofstukke":[["Rigters","JDG",1],["Rigters","JDG",2]]},{"dag":90,"ref":"Rigters 3 – 5","titel":"Otniël, Ehud, Debora en Barak","fase":4,"tydlyn":"c. 1350–1200 v.C. (by benadering). Kanaän, Moab en die Jisreëlvlakte.","agtergrond":"Die eerste rigters kom uit verskillende stamme. Ehud was linkshandig – 'n eienskap wat hom gehelp het om sy swaard ongemerk te dra. Debora was 'n profetes en rigter – 'n vrou in leierskap, wat in die antieke wêreld buitengewoon was. Sisera se 900 ysterwaens was die gevreesde militêre tegnologie van die tyd, maar 'n storm het die Kisonrivier laat oorstroom sodat die waens vasgeval het (5:20–21). Jael se daad was skokkend, maar word in die lied gevier as God se oorwinning deur 'n vrou (soos Debora voorspel het, 4:9).","leer":"God gebruik onverwagte mense – 'n linkshandige man, 'n vrou, 'n tentvrou – om Sy volk te red. Sy krag is nie afhanklik van tegnologie of getalle nie. Ons moet gereed wees om op te tree wanneer God roep, en nie op ander wag om die eer te kry nie.","skrif":"Die Gees van die Here kom oor Otniël (3:10). Ehud, 'n linkshandige man (3:15). Debora rig Israel onder die palmboom (4:4–5). Barak wil nie sonder Debora gaan nie (4:8). \"Die Here sal Sisera in die hand van 'n vrou verkoop\" (4:9). \"Het die Here nie voor jou uit getrek nie?\" (4:14). Die lied van Debora: \"Die sterre het uit hul bane teen Sisera geveg\" (5:20). \"Dié wat Hom liefhet, is soos die son as hy opgaan in sy krag\" (5:31).","bid":"Dank God dat Hy gewone mense – ook jongmense en vroue – gebruik vir Sy werk. Bid vir die dogter in ons gesin dat sy die moed en wysheid van Debora sal hê. Bid vir die seuns in ons gesin dat hulle gereed sal wees om op te tree wanneer God roep.","vraag":"Debora en Jael was onverwagte helde. Watter \"onverwagte\" persoon kan God in jou skool of omgewing gebruik?","hoofstukke":[["Rigters","JDG",3],["Rigters","JDG",4],["Rigters","JDG",5]]},{"dag":91,"ref":"Rigters 6 – 8","titel":"Gideon: Van Bang Boer tot Dapper Held","fase":4,"tydlyn":"c. 1170 v.C. (by benadering). Ofra in Manasse en die Jisreëlvlakte.","agtergrond":"Die Midianiete was nomades met kamele (een van die eerste groot militêre gebruike van kamele in die Bybel) wat elke jaar by oestyd ingestroom en alles gestroop het. Gideon dors koring in 'n wynpers – 'n versteekte plek – uit vrees. Baäl se altaar en die Asjera-paal was op sy eie pa se erf. Om die vlies te gebruik, was nie 'n model vir hoe ons God se wil moet vind nie, maar 'n teken van Gideon se swak geloof wat God geduldig verdra het. Die leër word van 32 000 na 300 verminder.","leer":"God sien ons nie net soos ons nou is nie, maar soos ons kan word deur Sy krag (\"dapper held\"). Gehoorsaamheid begin by die huis – die afgode in ons eie lewe moet eers weg. God verminder soms ons hulpbronne sodat dit duidelik is dat Hy die oorwinning gee. Sukses kan egter 'n strik word: Gideon se goue efod word later 'n afgod.","skrif":"\"Die Here is met jou, dapper held!\" (6:12). \"Gaan in hierdie krag van jou... het Ek jou nie gestuur nie?\" (6:14). \"My geslag is die armste... en ek is die kleinste\" (6:15). Gideon breek Baäl se altaar in die nag af (6:25–27). Die vlies (6:36–40). \"Die volk wat by jou is, is te veel... dat Israel nie teen My roem nie\" (7:2). Die 300 wat soos honde lek (7:5–7). \"Die swaard van die Here en van Gideon!\" (7:20). Gideon weier om koning te wees: \"Die Here sal oor julle heers\" (8:23). Die efod word 'n strik (8:27).","bid":"Bid dat God ons sal sien en roep soos Hy vir Gideon gesien het – nie volgens ons vrese nie. Bid vir die moed om die \"afgode\" in ons eie huis eerste aan te spreek. Bid dat sukses ons nie van God sal weglei nie.","vraag":"God het Gideon 'n \"dapper held\" genoem toe hy weggekruip het. Wat dink jy sien God in jou wat jy dalk nie self sien nie?","hoofstukke":[["Rigters","JDG",6],["Rigters","JDG",7],["Rigters","JDG",8]]},{"dag":92,"ref":"Rigters 9 – 10","titel":"Abimelek: Die Gevaar van Selfsugtige Mag","fase":4,"tydlyn":"c. 1150 v.C. (by benadering). Sigem.","agtergrond":"Abimelek, Gideon se seun by 'n byvrou uit Sigem, vermoor 69 van sy 70 halfbroers om koning te word. Jotam, die enigste oorlewende, vertel 'n gelykenis van bome wat 'n koning soek – die waardevolle bome (olyf, vy, wingerdstok) wil nie regeer nie, maar die doringbos (wat niks bied nie) wil. Abimelek se einde kom deur 'n vrou wat 'n meulsteen op sy kop gooi – 'n vernederende dood vir 'n krygsman. Hoofstuk 10 noem twee \"klein\" rigters, en Israel se afgodery word erger.","leer":"Selfsugtige ambisie en geweld vernietig. God sien onreg raak, en \"wat 'n mens saai, sal hy maai\". Goeie leiers dien; slegte leiers soek mag. God se hart word steeds deur Sy volk se ellende geraak.","skrif":"Abimelek vermoor sy broers op een klip (9:5). Jotam se gelykenis van die bome (9:8–15). Die doringbos: \"kom skuil onder my skaduwee\" (9:15). God laat die bose gees tussen Abimelek en Sigem kom (9:23). \"So het God die kwaad van Abimelek op hom laat terugkom\" (9:56). Israel dien Baäls en verlaat die Here (10:6). \"Gaan en roep die gode aan wat julle uitgekies het\" (10:14). Hulle doen die vreemde gode weg, \"en Hy kon die ellende van Israel nie langer verdra nie\" (10:16).","bid":"Bid vir leiers in ons land wat dien en nie net mag soek nie. Bid dat ons kinders nooit leierskap sal soek vir hul eie eer nie. Dank God dat Hy diep geraak word deur ons nood.","vraag":"In Jotam se gelykenis wou die goeie bome nie regeer nie. Wat leer dit ons oor wie goeie leiers is?","hoofstukke":[["Rigters","JDG",9],["Rigters","JDG",10]]},{"dag":93,"ref":"Rigters 11 – 12","titel":"Jefta: 'n Verworpene en 'n Tragiese Gelofte","fase":4,"tydlyn":"c. 1100 v.C. (by benadering). Gilead, oos van die Jordaan.","agtergrond":"Jefta was die seun van 'n prostituut en is deur sy halfbroers verwerp. Hy word 'n leier van \"ledige manne\" (rowers), maar as die Ammoniete aanval, kom die oudstes hom soek. Hy ken Israel se geskiedenis goed (11:15–27). Sy roekelose gelofte om \"wat ook al\" eerste uit sy huis kom, te offer, eindig tragies met sy dogter. Uitleggers verskil oor wat met haar gebeur het – sommige meen sy is geoffer, ander dat sy lewenslank as maagd aan God se diens gewy is (11:37–39). God het mensoffers uitdruklik verbied (Deuteronomium 12:31). Die konflik met Efraim (hoofstuk 12) wys die groeiende verdeeldheid in Israel; \"Sjibbolet\" was 'n uitspraaktoets.","leer":"God kan mense gebruik wat deur ander verwerp is. Maar ons moet nie roekeloos met God onderhandel nie – God hoef nie omgekoop te word nie. Sorgelose beloftes kan groot skade doen. Trots en verdeeldheid tussen broers lei tot bloedvergieting.","skrif":"Jefta word verdryf (11:1–3). Die oudstes kom hom haal (11:5–11). Jefta se kennis van Israel se geskiedenis (11:15–27). \"Die Gees van die Here het oor Jefta gekom\" (11:29). Die roekelose gelofte (11:30–31). Sy dogter kom hom tegemoet met tamboeryne (11:34). Die Efraimiete se twis en die \"Sjibbolet\"-toets (12:1–6).","bid":"Bid vir mense wat verwerp of uitgesluit word – dat hulle God se aanvaarding sal ken. Bid vir wysheid voor ons beloftes maak. Bid vir eenheid tussen Christene en in ons gesin.","vraag":"Jefta het gedink hy moet God \"omkoop\" vir oorwinning. Waarom is dit 'n verkeerde beeld van God?","hoofstukke":[["Rigters","JDG",11],["Rigters","JDG",12]]},{"dag":94,"ref":"Rigters 13 – 16","titel":"Simson: Sterk Liggaam, Swak Karakter","fase":4,"tydlyn":"c. 1100–1070 v.C. (by benadering). Sora (Dan) en Filistynse gebied (Timna, Gasa) aan die kus.","agtergrond":"Die Filistyne was 'n seevaarders-volk (die \"Seevolke\") wat c. 1200 v.C. aan die kus gevestig het; hulle het ystersmeewerk beheer en was die grootste bedreiging vir Israel vir die volgende 150 jaar. Simson was van geboorte 'n Nasireër (Numeri 6). Sy krag het nie in sy hare self gelê nie, maar in God se Gees en sy toewyding aan God, waarvan die hare die teken was. Hy oortree egter al drie Nasireër-reëls: hy raak 'n dooie leeu aan, hou 'n drinkfees, en laat sy hare skeer. Dagon was die hoofgod van die Filistyne.","leer":"Groot gawes sonder 'n gedissiplineerde karakter is gevaarlik. Simson is deur sy oë en begeertes gelei, nie deur God nie. Sonde maak ons blind, bind ons en laat ons in diens van die vyand. Tog bly God genadig: in sy laaste oomblik roep Simson na God, en God antwoord. Hebreërs 11:32 noem hom selfs onder die geloofshelde.","skrif":"Die Engel van die Here kondig Simson se geboorte aan (13:3–5). \"Waarom vra jy tog na my naam, want dit is wonderbaar?\" (13:18). \"Neem haar vir my, want sy is reg in my oë\" (14:3). Die Gees van die Here kom oor hom (14:6, 19; 15:14). Delila haal sy geheim uit hom (16:15–17). \"Hy het nie geweet dat die Here van hom gewyk het nie\" (16:20). Die Filistyne steek sy oë uit en laat hom maal (16:21). Sy hare groei weer (16:22). \"Here, dink tog aan my en versterk my tog net hierdie keer\" (16:28).","bid":"Bid dat elkeen van ons talente en krag tot God se eer sal gebruik, met 'n gedissiplineerde karakter. Bid vir beskerming vir ons seuns teen versoekings wat sterk mans laat val. Dank God dat Hy ook ná ons foute na ons gebed luister.","vraag":"Simson het nie agtergekom dat die Here van hom weggegaan het nie (16:20). Hoe kan 'n mens stadig van God wegdryf sonder om dit agter te kom?","hoofstukke":[["Rigters","JDG",13],["Rigters","JDG",14],["Rigters","JDG",15],["Rigters","JDG",16]]},{"dag":95,"ref":"Rigters 17 – 18","titel":"Elkeen Doen wat Reg is in Sy Eie Oë","fase":4,"tydlyn":"Die tyd van die rigters (die hoofstukke is nie chronologies aan die einde nie; 18:30 dui op 'n vroeë tyd, want die priester is 'n kleinseun van Moses). Efraim en Dan.","agtergrond":"Die laaste hoofstukke van Rigters is 'n \"aanhangsel\" wat die geestelike en morele chaos van die tyd wys. Miga maak 'n afgod met gesteelde silwer en huur 'n Leviet as sy persoonlike priester. Die stam Dan, wat sy gebied nie kon inneem nie, steel Miga se afgode en priester en vestig hulle in die noorde. Dan word later een van die middelpunte van afgodery in Israel (1 Konings 12:29).","leer":"Wanneer elke mens self besluit wat reg is, word godsdiens 'n mengsel van eie idees – selfs met Bybelse woorde. Ons kan nie God \"huur\" of beheer om ons te seën nie. Ware geloof volg God se Woord, nie ons eie gevoelens nie.","skrif":"Miga steel silwer van sy ma, wat dit dan vir 'n afgod gebruik (17:1–4). \"In dié dae was daar geen koning in Israel nie; elkeen het gedoen wat reg was in sy oë\" (17:6). \"Nou weet ek dat die Here aan my goed sal doen, omdat ek 'n Leviet as priester het\" (17:13). Die Daniete steel die afgode en die priester (18:14–20). \"Julle het my gode wat ek gemaak het, weggeneem... wat het ek nog oor?\" (18:24). Jonatan, kleinseun van Moses, word priester vir die afgode (18:30).","bid":"Bid dat ons nie sal doen \"wat reg is in ons eie oë\" nie, maar wat reg is in God se oë. Bid vir die kerk in ons land om getrou aan God se Woord te bly. Bid vir mense wat 'n geloof volgens hul eie smaak gemaak het.","vraag":"Hoe lyk \"elkeen doen wat reg is in sy eie oë\" in ons samelewing vandag?","hoofstukke":[["Rigters","JDG",17],["Rigters","JDG",18]]},{"dag":96,"ref":"Rigters 19 – 21","titel":"Die Donkerste Hoofstuk in Israel","fase":4,"tydlyn":"Die tyd van die rigters (vroeg – Pinehas is nog priester, 20:28). Gibea in Benjamin en Mispa.","agtergrond":"Let wel: hierdie gedeelte beskryf gruwelike sonde – groepsverkragting en moord (hoofstuk 19), burgeroorlog en die ontvoering van vroue. Dit is een van die moeilikste gedeeltes in die Bybel; gesels oor die hoofgedagte eerder as die besonderhede, en pas dit aan by elkeen se ouderdom. Die verhaal herinner doelbewus aan Sodom (Genesis 19) – Israel het geword soos die Kanaäniete. Die Bybel verheerlik nie hierdie gebeure nie; dit stel dit aan die kaak.","leer":"Sonder God word 'n samelewing wreed, veral teenoor vroue en die kwesbares. Selfs God se volk kan so ver val. Die boek eindig met 'n kreet na 'n regverdige koning – wat vervul word in Dawid, en volkome in Jesus, die Koning wat regverdig regeer en die swakkes beskerm.","skrif":"Die Leviet en sy byvrou in Gibea (19:15–28). \"So iets het nie gebeur... sedert die dag toe die kinders van Israel uit Egipteland opgetrek het nie\" (19:30). Die hele Israel vergader (20:1). Die oorlog teen Benjamin (20:12–48). Die volk huil voor God (20:26; 21:2). \"In dié dae was daar geen koning in Israel nie; elkeen het gedoen wat reg was in sy oë\" (21:25).","bid":"Bid vir slagoffers van geweld en misbruik in ons land, veral vroue en kinders. Bid dat ons seuns sal opgroei as mans wat beskerm, en dat die dogter in ons gesin veilig sal wees en haar waarde in God sal ken. Bid vir 'n herlewing in ons land. Dank God vir Jesus, die regverdige Koning.","vraag":"Rigters eindig met \"daar was geen koning nie\". Hoe verander dit 'n mens se lewe om Jesus as Koning te hê?","hoofstukke":[["Rigters","JDG",19],["Rigters","JDG",20],["Rigters","JDG",21]]},{"dag":97,"ref":"Rut 1 – 4","titel":"Liefde, Lojaliteit en 'n Losser","fase":4,"tydlyn":"\"In die dae toe die rigters regeer het\" (1:1), c. 1100 v.C. (by benadering). Moab en Betlehem in Juda.","agtergrond":"Rut speel af in dieselfde donker tyd as Rigters, maar wys 'n heeltemal ander prentjie: gewone mense wat getrou leef. Rut was 'n Moabitiese vrou – van 'n volk wat dikwels Israel se vyand was. 'n Weduwee sonder seuns was uiters kwesbaar. Die wet het armes toegelaat om agter die oesters aan op te tel (Levitikus 19:9–10). 'n \"Losser\" (go'el) was 'n naby familielid wat verpligting gehad het om grond terug te koop en die familienaam voort te sit. Die boek eindig met die geslagsregister van Dawid.","leer":"God werk stil en getrou deur gewone dade van lojaliteit, harde werk en goedheid. Rut kies om die God van Israel te volg, en God sluit haar – 'n buitestaander – in Sy plan in. Boas wys hoe 'n goeie man optree: hy beskerm, voorsien en tree eerbaar op. Hy is 'n beeld van Jesus, ons Losser, wat ons tot 'n prys vrygekoop het.","skrif":"Naomi verloor haar man en seuns (1:3–5). Rut: \"Waar u heengaan, sal ek heengaan... u volk is my volk, en u God is my God\" (1:16). Naomi: \"Noem my nie Naomi (lieflik) nie, noem my Mara (bitter)\" (1:20). \"Toevallig\" kom Rut op Boas se land (2:3). Boas beveel sy werkers om haar te beskerm en ekstra te laat oorbly (2:9, 15–16). \"Onder wie se vleuels jy kom skuil het\" (2:12). Boas tree eerbaar op by die drumpelvloer (3:10–13). Hy koop die grond en trou met Rut (4:9–10). Obed is die vader van Isai, die vader van Dawid (4:17, 22).","bid":"Dank God dat Hy in die \"toevallige\" dinge van ons lewe werk. Bid vir lojaliteit en getrouheid in ons gesin. Bid vir die seuns in ons gesin om soos Boas te wees, en vir die dogter in ons gesin om soos Rut te wees – mense van karakter. Dank Jesus, ons Losser.","vraag":"Wat het Boas gedoen wat wys hy is 'n man met goeie karakter?","hoofstukke":[["Rut","RUT",1],["Rut","RUT",2],["Rut","RUT",3],["Rut","RUT",4]]},{"dag":98,"ref":"1 Samuel 1 – 3","titel":"Hanna se Gebed en \"Spreek, Here\"","fase":4,"tydlyn":"c. 1100 v.C. (by benadering). Rama en die tabernakel in Silo.","agtergrond":"Die boeke Samuel beskryf die oorgang van rigters na konings. Hanna was onvrugbaar – in daardie kultuur 'n groot skande – en word deur die ander vrou, Peninna, gespot. Eli was hoëpriester, maar sy seuns Hofni en Pinehas het die offers misbruik en met vroue by die tabernakel geslaap; Eli het hulle nie streng aangespreek nie. \"Die woord van die Here was skaars in dié dae\" (3:1).","leer":"God hoor die gebede van 'n gebroke hart. Hanna wys ons hoe om ons hartseer en begeertes eerlik voor God uit te stort, en dan weer te gee wat Hy gegee het. God waardeer 'n hart wat luister: \"Spreek, Here, want u kneg hoor.\" Ouers moet hul kinders liefdevol maar ernstig dissiplineer.","skrif":"Hanna stort haar hart voor God uit (1:10–15). \"Ek het my siel voor die aangesig van die Here uitgestort\" (1:15). Sy noem hom Samuel (\"van God gevra\", 1:20) en gee hom aan God (1:27–28). Hanna se lied: \"Daar is niemand heilig soos die Here nie\" (2:2). God verhef die nederiges (2:7–8; vgl. Maria se lied in Lukas 1:46–55). \"Die wat My eer, sal Ek eer\" (2:30). Die seun Samuel groei op voor die Here (2:26). \"Spreek, want u kneg hoor\" (3:10). Eli het sy seuns nie bestraf nie (3:13). \"Die Here was met hom en het nie een van al sy woorde op die grond laat val nie\" (3:19).","bid":"Bid dat elkeen van ons God se stem sal hoor en sal sê: \"Spreek, Here.\" Bring persoonlike hartsbegeertes eerlik na God, soos Hanna. Bid vir ouers – ook vir Pappa – vir wysheid in dissipline.","vraag":"Samuel het eers nie die Here se stem herken nie. Hoe \"praat\" God vandag met ons?","hoofstukke":[["1 Samuel","1SA",1],["1 Samuel","1SA",2],["1 Samuel","1SA",3]]},{"dag":99,"ref":"1 Samuel 4 – 7","titel":"Die Ark Gevang – God Laat Hom nie Beheer nie","fase":4,"tydlyn":"c. 1080–1050 v.C. (by benadering). Afek en Eben-Haëser; Asdod, Gat en Ekron (Filistynse stede); Bet-Semes en Kirjat-Jearim.","agtergrond":"Israel bring die ark van die verbond na die slagveld asof dit 'n towermiddel is wat oorwinning sal waarborg. Hulle word verslaan, die ark word gevang, Eli se seuns sterf en Eli sterf wanneer hy die nuus hoor. Ikabod (\"die eer is weg\") word gebore. Silo is waarskynlik in hierdie tyd verwoes (Jeremia 7:12). Die Filistyne sit die ark in Dagon se tempel – en Dagon val voor dit neer. Die Filistyne stuur die ark uiteindelik terug.","leer":"God kan nie gemanipuleer of soos 'n gelukbringer gebruik word nie. Hy is nie in 'n kissie toegesluit nie – Hy verdedig Sy eie eer. Ware herlewing begin met berou, die wegdoen van afgode en die terugkeer na God met die hele hart. \"Tot hiertoe het die Here ons gehelp.\"","skrif":"\"Laat ons die ark... na ons toe haal, dat dit in ons midde kan kom en ons kan verlos\" (4:3). Die ark word gevang (4:11). \"Die eer is weg uit Israel\" (4:21–22). Dagon val voor die ark en breek (5:3–4). Die Filistyne stuur die ark terug op 'n wa met twee koeie (6:7–12). Samuel: \"As julle met julle hele hart na die Here terugkeer, verwyder dan die vreemde gode\" (7:3). Die volk bely: \"Ons het teen die Here gesondig\" (7:6). Eben-Haëser: \"Tot hiertoe het die Here ons gehelp\" (7:12).","bid":"Bid dat ons God nie soos 'n gelukbringer sal behandel nie, maar Hom sal eer en gehoorsaam. Bid vir herlewing in ons hart, gesin, kerk en land. Dank God: \"Tot hiertoe het die Here ons gehelp.\"","vraag":"Hoe behandel mense vandag God soms soos 'n \"gelukbringer\" in plaas van die Here?","hoofstukke":[["1 Samuel","1SA",4],["1 Samuel","1SA",5],["1 Samuel","1SA",6],["1 Samuel","1SA",7]]},{"dag":100,"ref":"1 Samuel 8 – 10","titel":"\"Gee vir Ons 'n Koning\" – Saul word Gesalf","fase":4,"tydlyn":"c. 1050 v.C. Rama, Gibea (Saul se tuisdorp in Benjamin) en Mispa.","agtergrond":"Samuel is oud en sy seuns is korrup. Die volk vra 'n koning \"soos al die nasies\". God het in Deuteronomium 17 voorsiening gemaak vir 'n koning, so die probleem was nie die koningskap self nie, maar die hart agter die versoek: hulle verwerp God as hulle Koning. Samuel waarsku hulle oor wat 'n koning sal \"neem\". Saul was lank, aantreklik en nederig aan die begin – hy kruip tussen die bagasie weg.","leer":"Die begeerte om \"soos almal\" te wees, kan ons wegtrek van God. God gee ons soms wat ons vra, met die gevolge daarby. Uiterlike voorkoms is nie die maatstaf van 'n leier nie. God gee 'n nuwe hart en Sy Gees vir die taak waarvoor Hy iemand roep.","skrif":"\"Stel nou 'n koning oor ons aan... soos al die nasies\" (8:5). \"Nie jou het hulle verwerp nie, maar My het hulle verwerp\" (8:7). \"Hy sal julle seuns neem... julle dogters... julle beste lande\" (8:11–17). \"Ons wil hê dat 'n koning oor ons moet wees, sodat ons ook kan wees soos al die nasies\" (8:19–20). Saul soek sy pa se donkies (9:3). Samuel salf Saul (10:1). \"God het hom 'n ander hart gegee\" (10:9). Saul het tussen die goed weggekruip (10:22).","bid":"Bid dat ons as gesin nie net \"soos almal\" sal wil wees nie, maar God as ons Koning sal eer. Bid vir ons regering. Bid vir nederige harte wat afhanklik bly van God.","vraag":"Waar voel jy die druk om \"soos almal\" te wees? Wat sou dit beteken om God as Koning te hê in daardie situasie?","hoofstukke":[["1 Samuel","1SA",8],["1 Samuel","1SA",9],["1 Samuel","1SA",10]]},{"dag":101,"ref":"1 Samuel 11 – 13","titel":"'n Goeie Begin en 'n Ongeduldige Offer","fase":4,"tydlyn":"c. 1050–1040 v.C. Jabes in Gilead, Gilgal en Mikmas.","agtergrond":"Saul se eerste oorwinning (teen die Ammoniete) bevestig hom as koning. Samuel se afskeidstoespraak herinner die volk aan God se trou. In hoofstuk 13 is die Filistyne baie sterk: hulle het 'n monopolie op ystersmeewerk (13:19–22), sodat Israel byna geen swaarde gehad het nie. Saul moes sewe dae vir Samuel wag om die offer te bring. Toe die volk begin wegloop, bring Saul self die offer – iets wat net 'n priester mag doen.","leer":"Ongeduld en vrees vir mense lei tot ongehoorsaamheid. 'n Leier wat eie oplossings soek wanneer God se tyd te lank voel, verloor God se seën. God soek 'n leier \"na Sy hart\" – iemand wie se hart aan God oorgegee is, nie net iemand met talent nie. Bid vir ander is deel van liefde (12:23).","skrif":"Die Gees van God kom oor Saul (11:6). Saul vergewe sy teenstanders (11:13). Samuel se integriteit (12:3–5). \"Vrees net die Here en dien Hom in waarheid met julle hele hart\" (12:24). \"Ver is dit van my om teen die Here te sondig deur op te hou om vir julle te bid\" (12:23). Saul offer self, net voor Samuel opdaag (13:8–10). \"Jy het dwaas gehandel\" (13:13). \"Die Here het vir Hom 'n man gesoek na sy hart\" (13:14). Geen smid in Israel nie (13:19).","bid":"Bid vir geduld om op God se tyd te wag. Bid dat ons nie uit vrees vir mense ongehoorsaam sal wees nie. Bid dat elkeen van ons 'n hart \"na God se hart\" sal hê.","vraag":"Wat dink jy beteken dit om 'n mens \"na God se hart\" te wees?","hoofstukke":[["1 Samuel","1SA",11],["1 Samuel","1SA",12],["1 Samuel","1SA",13]]},{"dag":102,"ref":"1 Samuel 14 – 15","titel":"Jonatan se Geloof en Saul se Verwerping","fase":4,"tydlyn":"c. 1040–1025 v.C. Mikmas, en die veldtog teen Amalek in die suide.","agtergrond":"Jonatan, Saul se seun, val met net sy wapendraer 'n Filistynse buitepos aan, omdat hy glo God kan red \"deur baie of deur weinig\". Saul maak intussen 'n dwase eed wat die soldate verbied om te eet. In hoofstuk 15 beveel God dat die Amalekiete – wat Israel eeue tevore aangeval het (Exodus 17) – geoordeel moet word. Saul spaar die koning en die beste vee, en bou 'n monument vir homself. (God se oordeel oor Amalek was 'n spesifieke oordeel in daardie tyd, nie 'n model vir vandag nie.)","leer":"Geloof kyk na God se mag, nie na die getalle nie. Gedeeltelike gehoorsaamheid is ongehoorsaamheid. God soek nie godsdienstige offers in die plek van gehoorsaamheid nie. Wie God se woord verwerp, verloor sy roeping. Saul se grootste probleem was dat hy mense meer gevrees het as God.","skrif":"Jonatan: \"Vir die Here is daar geen verhindering om te verlos deur baie of deur weinig nie\" (14:6). Saul se dwase eed (14:24). Saul rig vir hom 'n gedenkteken op (15:12). Saul: \"Ek het die woord van die Here uitgevoer\" (15:13). Samuel: \"Wat is dan hierdie geblêr van kleinvee in my ore?\" (15:14). \"Gehoorsaamheid is beter as slagoffer\" (15:22). \"Ek het die volk gevrees en na hulle stem geluister\" (15:24). \"Die Here het berou gehad dat Hy Saul koning gemaak het\" (15:35).","bid":"Bid vir geloof soos Jonatan s'n, wat God se krag vertrou. Bid dat ons volkome gehoorsaam sal wees, nie gedeeltelik nie. Bid dat ons God meer sal vrees as mense.","vraag":"Saul het gesê hy het \"die woord van die Here uitgevoer\", maar dit was nie heeltemal waar nie. Hoe doen ons soms \"amper\" wat ons ouers of God vra?","hoofstukke":[["1 Samuel","1SA",14],["1 Samuel","1SA",15]]},{"dag":103,"ref":"1 Samuel 16 – 17","titel":"God Kyk na die Hart: Dawid en Goliat","fase":4,"tydlyn":"c. 1025 v.C. (by benadering). Betlehem en die Elavallei, tussen Israel en Filistea.","agtergrond":"God stuur Samuel om 'n nuwe koning te salf onder die seuns van Isai in Betlehem. Dawid, die jongste, is 'n skaapwagter – so onbelangrik dat hy nie eers na die offerfees genooi is nie. Dawid word ook as musikant aan Saul se hof aangestel. Goliat was 'n reus van Gat (een van die vyf Filistynse stede), swaar gewapen. Die Filistyne stel \"eenstryd\" voor: een kampvegter veg teen een, en die uitslag geld vir die hele leër. 'n Slinger was 'n dodelike wapen in die hande van 'n kenner (vgl. Rigters 20:16).","leer":"God kyk nie na die uiterlike nie, maar na die hart. Hy berei ons voor in die versteekte plekke (Dawid met die leeu en die beer) vir die openbare stryd. Die stryd behoort aan die Here. Dawid se moed was nie selfvertroue nie, maar God-vertroue – en sy oorwinning was vir die eer van God se Naam.","skrif":"\"Die Here sien nie soos die mens sien nie; want die mens sien aan wat voor oë is, maar die Here sien die hart aan\" (16:7). Dawid word gesalf en die Gees van die Here kom oor hom (16:13). Goliat daag Israel uit vir 40 dae (17:16). \"Wie is hierdie onbesnede Filistyn, dat hy die slagordes van die lewende God beskimp?\" (17:26). \"Die Here wat my gered het uit die klou van die leeu en van die beer, Hy sal my red uit die hand van hierdie Filistyn\" (17:37). \"Jy kom na my met 'n swaard... maar ek kom na jou in die Naam van die Here van die leërskare\" (17:45). \"Die oorlog is die Here s'n\" (17:47).","bid":"Dank God dat Hy ons harte sien, nie net ons voorkoms, punte of prestasies nie. Bid dat ons Hom getrou sal dien in die \"versteekte\" plekke. Bring die \"reuse\" in elkeen se lewe na God, en bid vir geloof wat weet: die stryd is die Here s'n.","vraag":"Waar het Dawid geleer om God te vertrou voordat hy voor Goliat gestaan het? Wat beteken dit vir jou?","hoofstukke":[["1 Samuel","1SA",16],["1 Samuel","1SA",17]]},{"dag":104,"ref":"1 Samuel 18 – 20","titel":"Jaloesie en Ware Vriendskap","fase":4,"tydlyn":"c. 1020–1015 v.C. (by benadering). Saul se hof in Gibea.","agtergrond":"Ná Goliat word Dawid baie gewild, en die vroue sing: \"Saul het sy duisende verslaan, maar Dawid sy tienduisende.\" Saul word bitter jaloers en probeer Dawid herhaaldelik doodmaak. Jonatan, die kroonprins wat self koning sou word, erken dat God Dawid gekies het. Hulle sluit 'n verbond van vriendskap. In die antieke wêreld was so 'n verbond plegtig en lewenslank.","leer":"Jaloesie vergiftig die hart en kan 'n mens tot haat en geweld dryf. Ware vriendskap is lojaal, opofferend en wil die beste vir die ander, selfs ten koste van jouself. Jonatan was nederig genoeg om God se keuse bo sy eie belang te stel. God beskerm Sy kinders.","skrif":"\"Die siel van Jonatan was aan die siel van Dawid verbind, en Jonatan het hom liefgehad soos sy eie siel\" (18:1). Jonatan gee Dawid sy mantel en wapens (18:4). Saul se jaloesie: \"Van dié dag af het Saul Dawid met agterdog dopgehou\" (18:9). Saul gooi sy spies na Dawid (18:11; 19:10). \"Dawid het verstandig gehandel in al sy weë, en die Here was met hom\" (18:14). Mikal help Dawid ontsnap (19:11–17). Jonatan pleit vir Dawid (19:4–5). Die teken van die pyle (20:35–42). \"Gaan in vrede\" (20:42).","bid":"Bid vir ware vriende vir elkeen van ons kinders – vriende soos Jonatan. Bid dat hulle self ook sulke vriende sal wees. Bid vir bevryding van jaloesie wanneer ander meer erkenning kry.","vraag":"Wat maak Jonatan 'n goeie vriend? Wie is so 'n vriend vir jou, of vir wie kan jy so 'n vriend wees?","hoofstukke":[["1 Samuel","1SA",18],["1 Samuel","1SA",19],["1 Samuel","1SA",20]]},{"dag":105,"ref":"1 Samuel 21 – 24","titel":"Op die Vlug – en Weier om Wraak te Neem","fase":4,"tydlyn":"c. 1015–1012 v.C. (by benadering). Nob, Gat, die grot van Adullam, die woestyn van Juda en die rotse van En-Gedi by die Dooie See.","agtergrond":"Dawid vlug vir Saul en kry die heilige brood by die priesters in Nob (Jesus verwys hierna in Markus 2:25–26). Saul laat die priesters van Nob vermoor. Dawid word die leier van 'n groep van sowat 400 mense \"wat in nood, skuld of bitterheid\" was. Verskeie psalms kom uit hierdie tyd, bv. Psalm 34, 52, 54, 57 en 142 (volgens hul opskrifte). By En-Gedi, met sy grotte en watervalle, kry Dawid die kans om Saul dood te maak, maar weier.","leer":"God berei Sy dienaars voor in die woestyn van swaarkry. Ons moet nie wraak neem nie, maar oordeel aan God oorlaat – selfs wanneer ons die geleentheid en \"regverdiging\" het. Respek vir God se gesalfde (Saul se amp) was vir Dawid belangriker as sy eie veiligheid. Dawid se gewete was sensitief, selfs oor 'n stukkie mantel.","skrif":"Dawid kry die heilige brood (21:6). Hy maak hom kranksinnig in Gat (21:13). Die mense in nood kom na hom (22:2). Saul laat die priesters van Nob doodmaak (22:18). Jonatan gaan na Dawid in die woestyn en versterk sy hand in God (23:16). Saul in die grot by En-Gedi (24:3–4). \"Dawid se hart het hom geslaan\" omdat hy 'n slip van Saul se mantel afgesny het (24:5). \"Ver is dit van my... dat ek my hand teen hom sou uitsteek, want hy is die gesalfde van die Here\" (24:6). \"Die Here sal oordeel tussen my en jou... maar my hand sal nie teen jou wees nie\" (24:12).","bid":"Bid vir genade om nie wraak te neem wanneer iemand ons onregverdig behandel nie. Bid vir mense wat soos Dawid se manne \"in nood, skuld of bitterheid\" is. Bid dat ons gewete sensitief sal bly vir God se Gees.","vraag":"Dawid se manne het gesê: \"Dit is jou kans!\" Waarom was dit vir Dawid nie reg nie?","hoofstukke":[["1 Samuel","1SA",21],["1 Samuel","1SA",22],["1 Samuel","1SA",23],["1 Samuel","1SA",24]]},{"dag":106,"ref":"1 Samuel 25 – 27","titel":"Abigail se Wysheid en Dawid se Moeë Geloof","fase":4,"tydlyn":"c. 1012–1010 v.C. (by benadering). Karmel (in Juda), Sif, en Siklag in Filistynse gebied.","agtergrond":"Nabal (\"dwaas\") was 'n ryk boer wie se trop deur Dawid se manne beskerm is. Dit was die gebruik om sulke beskermers by skeertyd te beloon. Nabal beledig Dawid, en Dawid wil wraak neem. Abigail, Nabal se wyse vrou, keer hom. Later spaar Dawid Saul se lewe 'n tweede keer. Moeg en moedeloos vlug Dawid daarna na die Filistyne – 'n besluit sonder om God te raadpleeg.","leer":"'n Wyse woord op die regte tyd kan 'n mens van groot sonde red. God gebruik soms ander mense om ons te keer. Wraak behoort aan God – Hy het self met Nabal afgereken. Selfs mense van geloof word moeg en neem dan besluite uit vrees, sonder om God te vra.","skrif":"Nabal: \"Wie is Dawid?\" (25:10). Abigail se vinnige en nederige optrede (25:18–31). \"Die siel van my heer sal ingebind wees in die bundel van die lewe by die Here\" (25:29). Dawid: \"Geseënd is jou verstandigheid... dat jy my vandag teruggehou het van bloedskuld\" (25:33). God slaan Nabal (25:38). Dawid spaar Saul weer en neem sy spies en waterkruik (26:7–12). \"Die Here sal elkeen sy geregtigheid en trou vergelde\" (26:23). \"Nou sal ek eendag deur die hand van Saul omkom\" – Dawid se moedelose gedagte (27:1).","bid":"Dank God vir mense wat ons op die regte tyd keer van verkeerde besluite. Bid dat ons kinders sal luister wanneer ander wyse raad gee. Bid vir krag wanneer ons moeg en moedeloos is, dat ons dan God se raad sal soek.","vraag":"Abigail het Dawid gekeer om iets te doen waaroor hy spyt sou wees. Wanneer het iemand jou al so gekeer?","hoofstukke":[["1 Samuel","1SA",25],["1 Samuel","1SA",26],["1 Samuel","1SA",27]]},{"dag":107,"ref":"1 Samuel 28 – 31","titel":"Saul se Tragiese Einde","fase":4,"tydlyn":"c. 1010 v.C. Endor, Siklag, en die gebergte Gilboa.","agtergrond":"Die Filistyne berei 'n groot aanval voor. Saul het die waarsêers uit die land verwyder, soos God se wet vereis, maar in sy desperaatheid gaan raadpleeg hy self 'n medium (die \"heks van Endor\"). Uitleggers verskil oor presies wat gebeur het; die teks sê dat Samuel verskyn het, en die medium self skrik daarvoor. Die boodskap is oordeel. Intussen word Dawid deur die Filistyne teruggestuur, en vind Siklag afgebrand en sy familie weggevoer. Saul en Jonatan sterf op die gebergte Gilboa.","leer":"Wie God se woord herhaaldelik verwerp, word uiteindelik deur God se stilte geoordeel. Die okkulte is nooit 'n antwoord nie. In ons diepste krisis kan ons, soos Dawid, ons in die Here versterk. Hy deel die buit regverdig – ook met die moeës wat agtergebly het.","skrif":"Die Here antwoord Saul nie (28:6). Saul vermom hom en raadpleeg die medium (28:7–8). Samuel: \"Die Here het van jou gewyk\" (28:16). Siklag is verbrand, en Dawid se manne wil hom stenig (30:1–6). \"Maar Dawid het hom versterk in die Here sy God\" (30:6). Dawid raadpleeg die Here (30:8). Die deel van hom wat by die goed bly, sal gelyk wees aan die deel van hom wat in die geveg gaan (30:24). Saul en sy seuns sterf (31:6). Die manne van Jabes onthou Saul se goedheid (31:11–13).","bid":"Bid vir ons kinders se beskerming teen die okkulte en dat hulle vir antwoorde net na God sal gaan. Bid dat ons in ons swaarste tye ons in die Here sal versterk. Bid vir mense wat soos Saul ver van God af gedryf het.","vraag":"Wat beteken dit om \"jouself in die Here te versterk\" as alles verkeerd loop?","hoofstukke":[["1 Samuel","1SA",28],["1 Samuel","1SA",29],["1 Samuel","1SA",30],["1 Samuel","1SA",31]]},{"dag":108,"ref":"2 Samuel 1 – 4","titel":"Dawid word Koning oor Juda","fase":4,"tydlyn":"c. 1010 v.C. Hebron, waar Dawid sewe en 'n half jaar oor Juda regeer (2:11).","agtergrond":"'n Amalekiet bring die nuus van Saul se dood, en eis die \"eer\" om hom doodgemaak te hê, in die hoop op 'n beloning. Dawid treur oor Saul en Jonatan met 'n pragtige klaaglied. Juda salf Dawid as koning in Hebron, maar Isboset, Saul se seun, word deur die bevelvoerder Abner oor die res van Israel aangestel. 'n Lang burgeroorlog volg. Joab, Dawid se bevelvoerder, vermoor Abner uit wraak, en twee manne vermoor Isboset in die hoop om Dawid te behaag.","leer":"Dawid weier om sy koningskap op ander se bloed te bou. Hy rou opreg oor sy vyand en sy vriend. God se beloftes word in Sy tyd vervul – Dawid hoef nie te manipuleer nie. Wraak en eie-belang (Joab) bring net meer bloedvergieting.","skrif":"Dawid rou oor Saul en Jonatan (1:11–12). \"Hoe het die helde geval!\" (1:19, 25, 27). \"Jou liefde was vir my wonderliker as die liefde van vroue\" – oor Jonatan (1:26). Dawid vra die Here waarheen hy moet gaan (2:1). \"Die oorlog was lank tussen die huis van Saul en die huis van Dawid; maar Dawid het al sterker geword\" (3:1). Dawid treur oor Abner (3:31–39). Dawid straf die moordenaars van Isboset (4:9–12).","bid":"Bid dat ons nie ons sukses sal bou op ander se val nie. Bid vir 'n hart wat selfs vir vyande kan rou. Bid vir geduld om God se beloftes in Sy tyd te ontvang.","vraag":"Waarom het Dawid die man gestraf wat gedink het hy bring goeie nuus?","hoofstukke":[["2 Samuel","2SA",1],["2 Samuel","2SA",2],["2 Samuel","2SA",3],["2 Samuel","2SA",4]]},{"dag":109,"ref":"2 Samuel 5 – 7","titel":"Jerusalem, die Ark, en God se Ewige Belofte aan Dawid","fase":4,"tydlyn":"c. 1003–1000 v.C. Dawid word op 30 koning en regeer 40 jaar (5:4). Jerusalem.","agtergrond":"Dawid verower Jerusalem van die Jebusiete – 'n sterk, neutrale stad op die grens tussen Juda en die noordelike stamme – en maak dit sy hoofstad, \"die stad van Dawid\". Hy bring die ark na Jerusalem; die eerste poging misluk omdat die ark op 'n wa vervoer is en nie deur Leviete gedra is soos God beveel het nie (Numeri 4:15). In hoofstuk 7 wil Dawid vir God 'n huis (tempel) bou, maar God sê Hy sal vir Dawid 'n \"huis\" (dinastie) bou wat vir ewig sal bestaan – een van die belangrikste beloftes in die Bybel.","leer":"God se werk moet op God se manier gedoen word, al is ons bedoelings goed. Ware aanbidding is uitbundig en nederig voor God, sonder skaamte. God oortref altyd ons bedoelings: Dawid wou iets vir God doen, maar God belowe iets veel groters vir Dawid. Die ewige koninkryk van Dawid word vervul in Jesus Christus, die Seun van Dawid.","skrif":"Dawid neem Jerusalem in (5:6–9). \"Dawid het al groter geword, want die Here, die God van die leërskare, was met hom\" (5:10). Ussa sterf toe hy die ark aanraak (6:6–7). Dawid dans met al sy krag voor die Here (6:14). Mikal verag hom; Dawid: \"Ek wil nog geringer as so word\" (6:16, 22). \"Kyk tog, ek woon in 'n huis van sederhout, terwyl die ark van God in 'n tent woon\" (7:2). \"Die Here verkondig jou dat die Here vir jou 'n huis sal maak... jou troon sal vas wees tot in ewigheid\" (7:11, 16). \"Wie is ek, Here Here, en wat is my huis, dat U my tot hiertoe gebring het?\" (7:18).","bid":"Dank God vir Jesus, die ewige Koning uit Dawid se huis. Bid dat ons God uitbundig en sonder skaamte sal aanbid. Bid Dawid se gebed: \"Wie is ek, Here, dat U ons gesin tot hiertoe gebring het?\"","vraag":"Dawid wou vir God 'n huis bou, maar God het eerder vir Dawid 'n \"huis\" gebou. Wat leer dit ons oor God?","hoofstukke":[["2 Samuel","2SA",5],["2 Samuel","2SA",6],["2 Samuel","2SA",7]]},{"dag":110,"ref":"2 Samuel 8 – 10","titel":"Oorwinnings en Genade vir Mefiboset","fase":4,"tydlyn":"c. 1000–990 v.C. (by benadering). Jerusalem en die buurvolke (Filistea, Moab, Aram, Edom, Ammon).","agtergrond":"Dawid brei die koninkryk uit en verslaan die vyande rondom. Hy regeer met \"reg en geregtigheid\" (8:15). Mefiboset was Jonatan se seun, wat as kind laam geval het (4:4). In die antieke wêreld het 'n nuwe koning dikwels die vorige koning se familie uitgeroei om bedreigings te verwyder. Dawid doen die teenoorgestelde. Hoofstuk 10 wys hoe 'n gebaar van vriendskap verkeerd verstaan word en tot oorlog met Ammon lei – die agtergrond van hoofstuk 11.","leer":"God gee oorwinning, en 'n goeie leier regeer met reg en geregtigheid. Dawid se goedheid aan Mefiboset is 'n prentjie van God se genade aan ons: ons was \"kreupel\", ver weg, en verdien niks nie, maar ons word geroep om vir altyd aan die Koning se tafel te eet – omdat Hy 'n verbond gesluit het.","skrif":"\"Die Here het Dawid gehelp oral waar hy gegaan het\" (8:6, 14). Dawid regeer met reg en geregtigheid oor sy hele volk (8:15). \"Is daar nog iemand oor van die huis van Saul, dat ek aan hom guns kan bewys ter wille van Jonatan?\" (9:1). Mefiboset buig: \"Wat is u kneg, dat u op 'n dooie hond soos ek ag gee?\" (9:8). \"Hy sal altyd aan my tafel eet soos een van die koningsseuns\" (9:11). Die Ammoniete verneder Dawid se gesante (10:4). \"Wees sterk, en laat ons ons dapper gedra... die Here sal doen wat goed is in sy oë\" (10:12).","bid":"Dank God dat Hy ons, wat Sy genade nie verdien nie, aan Sy tafel genooi het. Bid dat ons, soos Dawid, sal soek na mense aan wie ons goedheid kan bewys. Bid vir leiers wat met reg en geregtigheid regeer.","vraag":"Hoe is die verhaal van Mefiboset 'n prentjie van wat God vir ons gedoen het?","hoofstukke":[["2 Samuel","2SA",8],["2 Samuel","2SA",9],["2 Samuel","2SA",10]]},{"dag":111,"ref":"2 Samuel 11 – 12","titel":"Dawid se Val en Ware Berou","fase":4,"tydlyn":"c. 990 v.C. (by benadering). Jerusalem, terwyl die leër Rabba (hoofstad van Ammon) beleër.","agtergrond":"Let wel: hierdie hoofstuk handel oor egbreuk en moord – gesels ouderdomsgepas, maar eerlik. \"In die tyd wanneer die konings uittrek\", bly Dawid in Jerusalem. Batseba was die vrou van Uria, een van Dawid se getrouste soldate (23:39). Uria was 'n Hetiet (nie-Israeliet), maar meer getrou as Dawid. Dawid probeer die sonde toesmeer, en wanneer dit nie werk nie, laat hy Uria doodmaak. Natan se gelykenis laat Dawid homself veroordeel. Psalm 51 (volgens die opskrif) is Dawid se berou-psalm ná hierdie gebeure.","leer":"Selfs 'n man na God se hart kan diep val wanneer hy op die verkeerde plek is, sy oë laat dwaal en sy mag misbruik. Een sonde lei tot 'n volgende om dit weg te steek. God sien alles en stuur iemand om ons te konfronteer. Ware berou erken sonde sonder verskonings – en God vergewe. Maar sonde het steeds gevolge.","skrif":"Dawid bly in Jerusalem (11:1). Hy sien, hy stuur, hy neem (11:2–4). Uria weier om huis toe te gaan terwyl die leër in die veld is (11:11). Dawid laat Uria doodmaak (11:14–17). \"Die saak wat Dawid gedoen het, was verkeerd in die oë van die Here\" (11:27). Natan se gelykenis van die arm man se lammetjie (12:1–4). \"Jy is die man!\" (12:7). \"Ek het teen die Here gesondig\" (12:13). \"Die Here het ook jou sonde weggeneem; jy sal nie sterwe nie\" (12:13). Die gevolge: die swaard sal nie van sy huis wyk nie (12:10). \"Ek sal na hom gaan, maar hy sal nie na my terugkom nie\" (12:23).","bid":"Bid vir ons gesin se kinders se beskerming teen seksuele versoeking en dat hulle hul oë sal bewaak. Bid vir die moed om sonde dadelik te bely, sonder verskonings. Dank God dat Hy vergewe wanneer ons met 'n gebroke hart na Hom kom.","vraag":"Dawid se sonde het met \"op die verkeerde plek wees\" begin. Hoe help dit ons om versoeking vroeg te vermy?","hoofstukke":[["2 Samuel","2SA",11],["2 Samuel","2SA",12]]},{"dag":112,"ref":"2 Samuel 13 – 14","titel":"Sonde in Dawid se Huis","fase":4,"tydlyn":"c. 985–978 v.C. (by benadering). Jerusalem en Gesur.","agtergrond":"Let wel: hoofstuk 13 vertel van die verkragting van Tamar deur haar halfbroer Amnon – gesels ouderdomsgepas en sensitief. Natan se profesie begin vervul word. Dawid word kwaad, maar doen niks (13:21) – 'n vader wat nie optree nie. Absalom, Tamar se broer, wag twee jaar en vermoor dan vir Amnon. Hy vlug, en Joab bewerkstellig later sy terugkeer, maar sonder ware versoening.","leer":"Sonde in 'n gesin het verwoestende gevolge oor geslagte. 'n Vader moet beskerm en geregtigheid laat geskied – passiwiteit is ook 'n keuse met gevolge. Wraak is nie geregtigheid nie. Ware versoening vereis eerlikheid, berou en herstel, nie net dat mense weer in dieselfde huis woon nie.","skrif":"Amnon se begeerte word haat (13:1–15). Tamar: \"So iets word in Israel nie gedoen nie\" (13:12). \"Toe koning Dawid al hierdie dinge hoor, het hy baie kwaad geword\" – maar niks gedoen nie (13:21). Absalom vermoor Amnon (13:28–29). Die vrou van Tekoa: \"God... bedink planne sodat die verstotene nie van Hom verstoot bly nie\" (14:14). Absalom kom terug maar sien die koning twee jaar nie (14:24, 28). Die koning soen Absalom (14:33).","bid":"Bid vir beskerming vir die dogter in ons gesin en vir al die meisies en vroue in ons familie en kerk. Bid dat die seuns in ons gesin sal leer om vroue met respek en eerbaarheid te behandel. Bid vir Pappa vir wysheid om as vader te beskerm en reg te laat geskied. Bid vir gebroke gesinne.","vraag":"Waarom dink jy was Dawid se stilte en passiwiteit so gevaarlik?","hoofstukke":[["2 Samuel","2SA",13],["2 Samuel","2SA",14]]},{"dag":113,"ref":"2 Samuel 15 – 17","titel":"Absalom se Opstand: Dawid Vlug","fase":4,"tydlyn":"c. 975 v.C. (by benadering). Jerusalem, die Olyfberg en die woestyn langs die Jordaan.","agtergrond":"Absalom wen die harte van die volk deur by die stadspoort met ontevrede mense te praat en te kritiseer. Hy laat hom in Hebron as koning uitroep. Dawid vlug uit Jerusalem, kaalvoet en huilend teen die Olyfberg uit – dieselfde berg waar Jesus later sou huil en bid. Psalm 3 word volgens die opskrif in hierdie tyd geskryf. Agitofel, Dawid se raadgewer (moontlik Batseba se oupa, vgl. 11:3 en 23:34), sluit by Absalom aan.","leer":"Hoogmoed en ambisie vernietig. Mense se harte kan maklik deur vleiery en kritiek \"gesteel\" word. In vernedering vertrou Dawid God: hy laat die ark in Jerusalem en aanvaar God se wil. Hy weier om terug te slaan wanneer Simei hom vloek. God beskerm Sy gesalfde deur die raad van die vyand te verydel.","skrif":"Absalom \"het die hart van die manne van Israel gesteel\" (15:6). Dawid stuur die ark terug: \"As ek genade vind in die oë van die Here, sal Hy my terugbring... maar as Hy so sê... laat Hy aan my doen wat goed is in sy oë\" (15:25–26). Dawid gaan huilend die Olyfberg op (15:30). \"Here, maak tog die raad van Agitofel tot dwaasheid\" (15:31). Simei vloek Dawid; Dawid: \"Laat hom vloek\" (16:5–11). Husai se raad verydel Agitofel s'n, \"want die Here het beskik\" (17:14).","bid":"Bid dat ons nie deur vleiery of kritiek teen ons ouers, leiers of mekaar opgestook sal word nie. Bid vir Dawid se nederigheid in vernedering. Dank God dat Hy in beheer bly, selfs wanneer dinge uitmekaar val.","vraag":"Absalom het die mense se harte \"gesteel\" deur te kritiseer. Hoe kan negatiewe praatjies in 'n skool of span die vrede steel?","hoofstukke":[["2 Samuel","2SA",15],["2 Samuel","2SA",16],["2 Samuel","2SA",17]]},{"dag":114,"ref":"2 Samuel 18 – 20","titel":"\"My Seun Absalom!\"","fase":4,"tydlyn":"c. 975 v.C. (by benadering). Die woud van Efraim (oos van die Jordaan), Mahanaim en terug na Jerusalem.","agtergrond":"Dawid se leër verslaan Absalom se mag. Dawid het beveel dat Absalom gespaar moet word, maar Joab maak hom dood toe hy met sy hare in 'n eikeboom vasgehaak hang. Dawid se rou is diep. Joab berispe Dawid omdat sy rou die getroue soldate laat skaam voel. Op pad terug ontmoet Dawid vriende en vyande. Hoofstuk 20 vertel van nog 'n opstand (Seba) – die verdeeldheid tussen Juda en die noordelike stamme groei.","leer":"'n Vader se liefde vir 'n opstandige kind is diep – 'n weerspieëling van God se hart vir Sy opstandige kinders. Hoogmoed (Absalom se hare, sy monument) word dikwels die middel van 'n mens se val. Ná konflik is daar tyd vir genade en versoening. Verdeeldheid wat nie aangespreek word nie, groei.","skrif":"\"Werk sag met die jongman Absalom om\" (18:5). Absalom se hare raak in die eikeboom vas (18:9). Absalom het vir hom 'n gedenkteken opgerig (18:18). \"My seun Absalom, my seun, my seun Absalom! Was ek maar in jou plek dood\" (18:33). Joab se teregwysing (19:5–7). Dawid vergewe Simei (19:23). Mefiboset se lojaliteit (19:24–30). Barsillai se getrouheid (19:31–39). Seba se opstand (20:1–2).","bid":"Bid vir kinders wat van God en hul ouers weggedwaal het. Dank God dat Hy, soos Dawid, ons liefhet selfs in ons opstand – en dat Jesus werklik in ons plek gesterf het. Bid vir versoening ná konflik.","vraag":"Dawid wou in Absalom se plek sterf. Wat het Jesus vir ons gedoen wat Dawid nie vir Absalom kon doen nie?","hoofstukke":[["2 Samuel","2SA",18],["2 Samuel","2SA",19],["2 Samuel","2SA",20]]},{"dag":115,"ref":"2 Samuel 21 – 24","titel":"Dawid se Lied en Laaste Woorde","fase":4,"tydlyn":"Verskeie gebeure uit Dawid se regering (nie in chronologiese volgorde nie), c. 1000–970 v.C.","agtergrond":"Die laaste hoofstukke is 'n aanhangsel wat Dawid se regering opsom: 'n hongersnood weens Saul se onreg teen die Gibeoniete (vgl. Josua 9), die reuse wat deur Dawid se manne verslaan is, Dawid se lofsang (hoofstuk 22, ook Psalm 18), sy \"laaste woorde\" (23:1–7), 'n lys van sy helde, en die sensus wat hy uit hoogmoed geneem het (hoofstuk 24). Die plek waar die plaag gestuit is – Arauna se dorsvloer – word die plek van die tempel (2 Kronieke 3:1), op die berg Moria.","leer":"God is ons rots, vesting en redder. Dawid erken dat al sy oorwinnings van God kom. Om in eie krag (getalle, leërs) te vertrou, is sonde. Ware aanbidding kos iets. God se genade is groter as Sy oordeel, en op die plek van oordeel en offer word God se huis gebou.","skrif":"\"Die Here is my rots en my bergvesting en my redder\" (22:2). \"Met U storm ek op 'n bende af; met my God spring ek oor 'n muur\" (22:30). \"Die weg van God is volkome\" (22:31). \"Wie regeer oor die mense... in die vrees van God, is soos die lig van die môre\" (23:3–4). Dawid se helde (23:8–39) – en Uria die Hetiet is laaste genoem (23:39). Dawid se hart slaan hom ná die sensus (24:10). \"Laat ons tog in die hand van die Here val, want sy barmhartighede is groot\" (24:14). \"Ek sal aan die Here my God nie brandoffers bring wat niks kos nie\" (24:24).","bid":"Loof God as ons rots en redder. Bid dat ons nie op ons eie krag, geld of getalle sal vertrou nie. Bid vir 'n aanbidding wat iets kos – tyd, gemak, eie wil. Dank God dat Sy barmhartighede groot is.","vraag":"Dawid het gesê hy sal nie aan God gee \"wat niks kos nie\". Wat sou dit vir jou beteken om God iets te gee wat jou iets kos?","hoofstukke":[["2 Samuel","2SA",21],["2 Samuel","2SA",22],["2 Samuel","2SA",23],["2 Samuel","2SA",24]]},{"dag":116,"ref":"Psalms 1 – 5","titel":"Twee Weë en die Gesalfde Koning","fase":4,"inleiding":["Psalms 1–72: Die Liedere van Dawid","Die Psalms was Israel se gebede- en liedereboek. Dit is in vyf \"boeke\" verdeel, elk wat met 'n lofprysing eindig (Psalm 41, 72, 89, 106 en 150). Boek I (Psalm 1–41) en Boek II (Psalm 42–72) bevat veral psalms wat aan Dawid toegeskryf word, maar ook psalms van die seuns van Korag (Levitiese sangers) en van Asaf. Die opskrifte is baie oud, maar nie altyd deel van die oorspronklike gedig nie; waar 'n opskrif 'n gebeurtenis in Dawid se lewe noem, help dit ons om die psalm te verstaan. Ons lees nou Boek I en II, ná Dawid se lewe in 1 en 2 Samuel. Boek III tot V lees ons later saam met die geskiedenis waarby hulle die beste pas.","Jesus het die Psalms gebid en aangehaal – selfs aan die kruis (Psalm 22 en 31). Die Psalms leer ons om oor álles met God te praat: lof, dank, vrees, woede, skuld en verlange. Lees die psalms gerus hardop of beurtelings."],"tydlyn":"Die Psalms is oor ongeveer 'n duisend jaar geskryf (van Moses tot ná die ballingskap). Psalm 3 word met Dawid se vlug vir Absalom verbind (c. 975 v.C.).","agtergrond":"Psalm 1 en 2 vorm saam die \"voordeur\" van die hele Psalmboek: Psalm 1 oor die mens wat in God se Woord behae het, Psalm 2 oor die Koning (die Gesalfde, Hebreeus \"Messias\") wat God aanstel. Die Nuwe Testament pas Psalm 2 op Jesus toe (Handelinge 4:25–26; 13:33; Hebreërs 1:5). Psalm 3 en 4 is 'n oggend- en 'n aandgebed, en Psalm 5 is 'n oggendgebed.","leer":"Daar is net twee weë: die weg van die regverdige (wat in God se Woord gewortel is) en die weg van die goddelose (wat soos kaf wegwaai). Die nasies kan teen God en Sy Gesalfde rebelleer, maar Jesus regeer. Ons kan God vertrou in die oggend en in die aand – ook wanneer daar baie teëstanders is.","skrif":"Psalm 1: Welgeluksalig die man wat nie wandel in die raad van die goddelose nie, maar sy behae het in die wet van die Here en dit dag en nag oordink; hy is soos 'n boom geplant by waterstrome (1:1–3). Psalm 2: \"Waarom is die nasies in oproer?\" (2:1); \"U is my Seun, vandag het Ek U gegenereer\" (2:7); \"Kus die Seun\" (2:12). Psalm 3: Dawid op die vlug: \"Maar U, Here, is 'n skild om my heen\"; hy lê en slaap en word wakker, want die Here ondersteun hom. Psalm 4: \"In vrede sal ek gaan lê en meteens aan die slaap raak.\" Psalm 5: in die môre rig ek my gebed tot U en wag.","bid":"Bid dat elkeen van ons soos 'n boom by die waterstrome sal wees – gewortel in God se Woord. Bid saam die gebede van Psalm 3 en 4: dat ons in vrede sal slaap en in die oggend God sal soek. Loof Jesus as die Koning oor alle nasies.","vraag":"Psalm 1 sê die regverdige is soos 'n boom by water. Wat is die \"water\" wat jou geestelik laat groei?","hoofstukke":[["Psalms","PSA",1],["Psalms","PSA",2],["Psalms","PSA",3],["Psalms","PSA",4],["Psalms","PSA",5]]},{"dag":117,"ref":"Psalms 6 – 10","titel":"\"Wat is die Mens?\" – God se Majesteit en Geregtigheid","fase":4,"tydlyn":"Grootliks aan Dawid toegeskryf (c. 1000 v.C.).","agtergrond":"Psalm 6 is die eerste van sewe tradisionele \"boetepsalms\" (berou-psalms: 6, 32, 38, 51, 102, 130, 143). Psalm 7 se opskrif noem Kus, 'n Benjaminiet – waarskynlik iemand van Saul se kant wat Dawid valslik beskuldig het. Psalm 8 word in Hebreërs 2:6–9 op Jesus toegepas, en Jesus haal dit aan toe die kinders Hom in die tempel prys (Matteus 21:16). Psalm 9 en 10 was waarskynlik oorspronklik een gedig: 'n alfabetiese gedig (elke strofe begin met die volgende letter van die Hebreeuse alfabet).","leer":"God is majestueus, maar Hy gee om vir die mens en het die mens kroon en waardigheid gegee. Hy is die regverdige Regter wat die verdruktes en weerloses nie vergeet nie. Ons kan in trane en pyn eerlik na Hom roep, en Hy hoor.","skrif":"Psalm 6: \"Ek is moeg van my gesug... elke nag laat ek my bed swem\"; en dan: \"die Here het die stem van my geween gehoor.\" Psalm 7: God is 'n regverdige Regter. Psalm 8: \"Here, onse Here, hoe heerlik is u Naam op die ganse aarde\"; \"Wat is die mens dat U aan hom dink?\"; \"U het hom 'n weinig minder gemaak as 'n goddelike wese en hom met eer en heerlikheid gekroon.\" Psalm 9: \"die Here is 'n rots vir die verdrukte\"; \"hulle wat u Naam ken, vertrou op U.\" Psalm 10: \"Waarom, o Here, staan U ver?\"; maar U sien die moeite en verdriet raak; U is die Helper van die wees.","bid":"Loof God vir Sy majesteit in die skepping en dank Hom vir die waarde wat Hy aan elkeen van ons gee. Bid vir die verdruktes, weerloses en wese in ons land. Bring elkeen se trane en seer na God.","vraag":"Wanneer laas het jy na die sterrehemel gekyk en gevoel soos Dawid in Psalm 8?","hoofstukke":[["Psalms","PSA",6],["Psalms","PSA",7],["Psalms","PSA",8],["Psalms","PSA",9],["Psalms","PSA",10]]},{"dag":118,"ref":"Psalms 11 – 17","titel":"\"Hoe Lank, o Here?\" – en 'n Hoop sterker as die Dood","fase":4,"tydlyn":"Grootliks aan Dawid toegeskryf.","agtergrond":"Hierdie psalms kom uit tye van druk: wanneer \"die fondamente omgegooi word\" (Psalm 11), wanneer mense lieg en vlei (Psalm 12), wanneer God ver voel (Psalm 13). Psalm 14 word deur Paulus aangehaal om te wys dat almal gesondig het (Romeine 3:10–12). Psalm 15 vra wie in God se teenwoordigheid mag woon. Psalm 16 word deur Petrus met Pinkster aangehaal as 'n profesie van Jesus se opstanding (Handelinge 2:25–31).","leer":"God bly op Sy troon, selfs as alles rondom ons skud. Ons mag eerlik sê \"hoe lank?\", maar ons eindig by vertroue. God se woorde is suiwer, anders as mense se vleiery. Ware vreugde en veiligheid is in God se teenwoordigheid, en daar is hoop selfs oor die dood heen.","skrif":"Psalm 11: \"As die fondamente omgegooi word, wat kan die regverdige doen?\" – \"Die Here is in sy heilige paleis; die Here – in die hemel is sy troon.\" Psalm 12: \"Die woorde van die Here is rein woorde, silwer gelouter.\" Psalm 13: \"Hoe lank, o Here? Sal U my vir altyd vergeet?\" ... \"Maar ek, ek vertrou op u goedertierenheid.\" Psalm 14: \"Die dwaas sê in sy hart: Daar is geen God nie.\" Psalm 15: wie in opregtheid wandel, die waarheid praat, nie skinder nie, en sy woord hou al is dit tot sy nadeel. Psalm 16: \"U sal my siel nie aan die doderyk oorlaat nie\"; \"by u aangesig is volheid van vreugde.\" Psalm 17: \"Bewaar my soos die appel van die oog, verberg my in die skaduwee van u vleuels.\"","bid":"Bid vir mense wie se \"fondamente\" skud – gesinne, ons land. Bring eerlike \"hoe lank?\"-vrae na God. Bid dat ons die mense van Psalm 15 sal wees: eerlik, sonder skinder, en mense wat ons woord hou.","vraag":"Psalm 15 noem eienskappe van iemand wat naby God leef. Watter een daarvan is vir jou die moeilikste?","hoofstukke":[["Psalms","PSA",11],["Psalms","PSA",12],["Psalms","PSA",13],["Psalms","PSA",14],["Psalms","PSA",15],["Psalms","PSA",16],["Psalms","PSA",17]]},{"dag":119,"ref":"Psalms 18 – 21","titel":"God se Hemel en God se Woord","fase":4,"tydlyn":"Psalm 18 word volgens die opskrif gesing op die dag toe God Dawid uit die hand van Saul en al sy vyande gered het (vgl. 2 Samuel 22).","agtergrond":"Psalm 18 is Dawid se groot danklied ná jare van vlug en oorlog. Psalm 19 bestaan uit twee dele: die skepping se stille getuienis van God (die son was in die antieke wêreld dikwels 'n god, maar hier is dit net God se werk), en God se Woord wat die siel verkwik. Psalm 20 en 21 is gebede vir die koning voor en ná 'n geveg.","leer":"God openbaar Homself op twee maniere: deur die skepping (wat sê dat daar 'n Skepper is) en deur Sy Woord (wat sê wie Hy is en hoe ons kan lewe). Sy Woord is volmaak, betroubaar en kosbaarder as goud. Ons vertroue moet nie in ons eie hulpmiddels (\"waens en perde\") wees nie, maar in die Naam van die Here.","skrif":"Psalm 18: \"Ek het U hartlik lief, Here, my sterkte! Die Here is my rots en my bergvesting en my redder\"; \"Hy het my uitgehaal na die ruimte; Hy het my gered, omdat Hy behae in my het.\" Psalm 19: \"Die hemele vertel die eer van God, en die uitspansel verkondig die werk van sy hande\"; \"Die wet van die Here is volmaak en verkwik die siel\"; \"Laat die woorde van my mond en die oordenking van my hart welgevallig wees voor u aangesig, o Here, my rots en my verlosser!\" Psalm 20: \"Sommige vermeld waens en ander perde, maar ons die Naam van die Here onse God.\" Psalm 21: die koning vertrou op die Here.","bid":"Bid Psalm 19 se slotgebed saam: dat ons woorde en gedagtes vandag vir God aanneemlik sal wees. Dank God vir die skepping en vir Sy Woord. Bid dat ons nie op \"waens en perde\" – geld, slimheid, kontakte – sal vertrou nie, maar op God.","vraag":"Wat is die \"waens en perde\" waarop mense vandag vertrou in plaas van op God?","hoofstukke":[["Psalms","PSA",18],["Psalms","PSA",19],["Psalms","PSA",20],["Psalms","PSA",21]]},{"dag":120,"ref":"Psalms 22 – 24","titel":"Die Lydende Kneg, die Goeie Herder en die Koning van die Heerlikheid","fase":4,"tydlyn":"Aan Dawid toegeskryf (c. 1000 v.C.), maar Psalm 22 beskryf merkwaardig akkuraat die kruisiging, wat sowat 1 000 jaar later plaasgevind het.","agtergrond":"Psalm 22 begin met die woorde wat Jesus aan die kruis uitgeroep het: \"My God, my God, waarom het U My verlaat?\" (Markus 15:34). Dit beskryf spot, dors, deurboorde hande en voete, en die verdeel van klere deur die lot (Johannes 19:24) – lank voor kruisiging uitgevind is. Maar die psalm eindig met oorwinning en lof onder die nasies. Psalm 23 is waarskynlik die bekendste psalm; Dawid was self 'n skaapwagter. Psalm 24 is moontlik gesing toe die ark na Jerusalem gebring is (2 Samuel 6).","leer":"Jesus het die volle verlatenheid van die kruis vir ons gedra, sodat ons nooit deur God verlaat sal word nie. Daarom kan ons sê: \"Die Here is my Herder.\" Hy lei, voed, beskerm en gaan saam deur die donker dal. Die K

ie teen vlees en bloed nie, maar teen die owerhede, teen die magte\" (6:12). Die gordel van die waarheid, die borswapen van die geregtigheid, die skoene van die evangelie, die skild van die geloof, die helm van die verlossing, en die swaard van die Gees, die woord van God (6:14–17). \"Bid te alle tye\" (6:18).","bid":"Pappa: bid Efesiërs 6:4 oor jouself – om jou kinders nie te terg nie, maar in die Here op te voed. Kinders: bid vir genade om julle ouers te eer. Trek saam die wapenrusting van God aan in gebed (6:14–17) – elke stuk vir elke kind. Bid 4:29 oor ons woorde in die huis.","vraag":"Watter deel van die wapenrusting van God (6:14–17) het jy hierdie week die meeste nodig? Waarom?","hoofstukke":[["Efesiërs","EPH",4],["Efesiërs","EPH",5],["Efesiërs","EPH",6]]},{"dag":370,"ref":"Filippense 1 – 2","titel":"Om te Lewe is Christus – die Gesindheid van Jesus","fase":7,"tydlyn":"c. 60–62 n.C. Geskryf deur Paulus in die tronk (waarskynlik Rome; 1:13 noem die keiserlike lyfwag), aan die eerste kerk wat hy in Europa gestig het (Handelinge 16).","agtergrond":"Filippi was 'n Romeinse kolonie wat trots was op sy Romeinse burgerskap – daarom sê Paulus \"ons burgerskap is in die hemele\" (3:20). Die gemeente het Paulus herhaaldelik finansieel ondersteun en Epafroditus met 'n geskenk na hom in die tronk gestuur. Filippense word die \"brief van blydskap\" genoem: die woorde \"bly\" en \"blydskap\" kom sowat 16 keer voor – en dit word geskryf deur 'n gevangene wat nie weet of hy gaan lewe of sterf nie. Filippense 2:6–11 is moontlik 'n vroeë Christelike lofsang oor Jesus.","leer":"God voltooi die werk wat Hy in ons begin het. Selfs ons swaarkry kan die evangelie bevorder. Vir 'n Christen is lewe Christus en sterwe wins. Ware eenheid kom wanneer ons nederig ander belangriker ag as onsself, met die gesindheid van Jesus, wat Homself verneder het tot by die kruis – en daarom deur God verhoog is. Ons moet skyn soos sterre in 'n donker wêreld.","skrif":"\"Hy wat 'n goeie werk in julle begin het, sal dit voleindig tot op die dag van Jesus Christus\" (1:6). \"Die dinge wat my oorgekom het, het eerder bygedra tot bevordering van die evangelie\" (1:12). \"Want vir my is die lewe Christus en die sterwe wins\" (1:21). \"Wandel net waardig die evangelie van Christus\" (1:27). \"Moenie iets doen uit partysug of ydele eer nie, maar laat die een in nederigheid die ander hoër ag as homself\" (2:3). \"Laat elkeen nie sy eie belang soek nie, maar elkeen ook dié van ander\" (2:4). \"Laat daardie gesindheid in julle wees wat ook in Christus Jesus was, wat in die gestalte van God synde... Homself ontledig het deur die gestalte van 'n dienskneg aan te neem... Hy het Homself verneder deur gehoorsaam te word tot die dood, ja, tot die dood aan die kruis\" (2:5–8). \"Daarom het God Hom ook uitermate verhoog... sodat in die Naam van Jesus elke knie sou buig... en elke tong sou bely dat Jesus Christus die Here is\" (2:9–11). \"Werk julle eie heil uit met vrees en bewing; want dit is God wat in julle werk sowel die wil as die werk\" (2:12–13). \"Doen alles sonder murmurering en teëspraak\" (2:14). \"Waaronder julle skyn soos ligte in die wêreld\" (2:15). Timoteus en Epafroditus as voorbeelde (2:19–30).","bid":"Dank God dat Hy die goeie werk wat Hy in elkeen van ons begin het, sal voltooi (1:6). Bid vir die gesindheid van Jesus – nederig, ander eerste (2:3–5). Bid dat ons sonder kla sal lewe en soos sterre sal skyn in ons skool en omgewing.","vraag":"Filippense 2:14 sê \"doen alles sonder om te kla\". Wat sal in ons huis verander as ons 'n week lank niks kla nie?","hoofstukke":[["Filippense","PHP",1],["Filippense","PHP",2]]},{"dag":371,"ref":"Filippense 3 – 4","titel":"Om Christus te Ken, en die Vrede van God","fase":7,"tydlyn":"c. 60–62 n.C. Geskryf uit die tronk.","agtergrond":"Paulus waarsku teen mense wat besnydenis vereis het (soos in Galasiërs). Hy lys sy eie indrukwekkende Joodse \"CV\": besny op die agtste dag, van die stam Benjamin, 'n Hebreër uit die Hebreërs, 'n Fariseër, ywerig, onberispelik volgens die wet – en noem dit alles \"drek\" (die Griekse woord is baie sterk) in vergelyking met Christus. Hy gebruik beelde uit die atletiek (die wedloop na die eindstreep). Twee vroue in die gemeente, Euodia en Sintige, wat saam met Paulus gewerk het, het twis gehad. Paulus bedank die Filippense vir hulle geskenk.","leer":"Al ons prestasies en godsdienstige agtergrond is niks werd in vergelyking met die kennis van Christus nie. Ons is nog nie volmaak nie, maar ons vergeet wat agter is en jaag na die doel. Ons burgerskap is in die hemel. Ons kan altyd in die Here bly wees, ons bekommernisse in gebed na God bring, en Sy vrede sal ons harte bewaak. Ons moet ons gedagtes rig op wat goed is. Die geheim van tevredenheid is Christus, wat ons krag gee.","skrif":"\"Wat vir my wins was, dit het ek om Christus wil skade geag... om Christus te ken en die krag van sy opstanding en die gemeenskap aan sy lyde\" (3:7–10). \"Een ding doen ek: ek vergeet wat agter is en strek my uit na wat voor is, en jaag na die doel om die prys te verkry van die hemelse roeping van God in Christus Jesus\" (3:13–14). \"Ons burgerskap is in die hemele\" (3:20). Euodia en Sintige moet eensgesind wees (4:2). \"Verbly julle altyd in die Here; ek sê weer: Verbly julle!\" (4:4). \"Die Here is naby\" (4:5). \"Wees oor niks besorg nie, maar laat julle begeertes in alles deur gebed en smeking met danksegging bekend word by God. En die vrede van God wat alle verstand te bowe gaan, sal julle harte en julle sinne bewaar in Christus Jesus\" (4:6–7). \"Alles wat waar is, alles wat eerbaar is, alles wat regverdig is, alles wat rein is, alles wat lieflik is, alles wat loflik is... bedink dit\" (4:8). \"Ek het geleer om tevrede te wees in die omstandighede waarin ek is\" (4:11). \"Ek is tot alles in staat deur Christus wat my krag gee\" (4:13). \"My God sal in al julle behoeftes ryklik voorsien\" (4:19).","bid":"Bring elkeen se bekommernisse in gebed met danksegging na God, en bid vir Sy vrede wat alle verstand te bowe gaan (4:6–7). Bid dat ons gedagtes gevul sal wees met wat waar, rein en lieflik is (4:8) – ook wat ons kyk en lees. Bid vir tevredenheid, en dat ons \"alles kan deur Christus wat ons krag gee\" (4:13).","vraag":"Filippense 4:8 gee 'n \"filter\" vir ons gedagtes. As jy jou foon se inhoud deur hierdie filter sou sit, wat sou oorbly?","hoofstukke":[["Filippense","PHP",3],["Filippense","PHP",4]]},{"dag":372,"ref":"Kolossense 1 – 2","titel":"Christus bo Alles","fase":7,"tydlyn":"c. 60–62 n.C. Geskryf deur Paulus uit die tronk, aan die kerk in Kolosse ('n kleiner stad in die Lycus-vallei in die huidige Turkye), wat hy nie self gestig het nie, maar deur sy medewerker Epafras.","agtergrond":"In Kolosse het 'n vals lering ontstaan wat Christus as onvoldoende voorgestel het: dit het \"filosofie\", die aanbidding van engele, spesiale geestelike ervarings, streng reëls oor kos en feesdae, en selfvernedering bygevoeg as die weg na ware geestelikheid. Paulus antwoord deur te wys hoe groot Christus is. Kolossense 1:15–20 is een van die sterkste beskrywings van Christus se godheid in die Bybel. 'n \"Skuldbrief\" (2:14) was 'n handgeskrewe erkenning van skuld; in die Romeinse wêreld is die misdaad van 'n gekruisigde dikwels op 'n bordjie aan die kruis vasgespyker.","leer":"Jesus is die beeld van die onsigbare God, die Skepper en Onderhouer van alles, die Hoof van die kerk, en die volheid van God woon liggaamlik in Hom. In Hom het ons alles – ons het niks \"ekstra\" nodig nie. Aan die kruis het Hy ons skuld uitgewis en die bose magte ontwapen. Ons moet nie deur menslike filosofie, godsdienstige reëls of spesiale ervarings van Christus weggetrek word nie, maar in Hom gewortel bly.","skrif":"\"Hy het ons verlos uit die mag van die duisternis en oorgebring in die koninkryk van die Seun van sy liefde\" (1:13). \"Hy is die beeld van die onsienlike God, die eersgeborene van die ganse skepping. Want deur Hom is alle dinge geskape... alle dinge is deur Hom en tot Hom geskape. En Hy is voor alle dinge, en in Hom hou alle dinge stand\" (1:15–17). \"Hy is die Hoof van die liggaam, die gemeente\" (1:18). \"Om deur Hom alle dinge met Homself te versoen... deur die bloed van sy kruis\" (1:20). \"Christus in julle, die hoop van die heerlikheid\" (1:27). \"In wie al die skatte van die wysheid en die kennis verborge is\" (2:3). \"Soos julle dan Christus Jesus, die Here, aangeneem het, wandel so in Hom, gewortel en opgebou in Hom\" (2:6–7). \"Pas op dat niemand julle as buit wegvoer deur die wysbegeerte en ydele bedrog nie\" (2:8). \"In Hom woon die hele volheid van die Godheid liggaamlik\" (2:9). \"Hy het die handskrif wat teen ons was... uitgewis en dit uit die weg geruim deur dit aan die kruis vas te spyker\" (2:14). \"Laat niemand julle dan oordeel oor spys of drank nie\" (2:16).","bid":"Aanbid Jesus met Kolossense 1:15–20 – lees dit hardop saam. Dank Hom dat Hy ons skuld aan die kruis \"vasgespyker\" het. Bid dat ons kinders nie deur leë filosofieë of gewilde idees van Jesus weggevoer sal word nie, maar in Hom gewortel sal wees.","vraag":"Kolossense 1:17 sê \"in Hom hou alle dinge stand\". Wat beteken dit dat Jesus die hele skepping bymekaarhou?","hoofstukke":[["Kolossense","COL",1],["Kolossense","COL",2]]},{"dag":373,"ref":"Kolossense 3 – 4; Filemon 1","titel":"Bedink die Dinge daarbo – en 'n Slaaf word 'n Broer","fase":7,"tydlyn":"c. 60–62 n.C. Kolossense en Filemon is saam deur Tigikus en Onesimus na Kolosse geneem (Kolossense 4:7–9).","agtergrond":"Kolossense 3–4 gee praktiese riglyne vir die nuwe lewe in Christus, ook vir gesinne en vir slawe en here. Filemon is Paulus se kortste brief – 'n persoonlike brief aan Filemon, 'n welgestelde Christen in Kolosse in wie se huis die kerk vergader het. Sy slaaf Onesimus het weggeloop (moontlik met geld of goedere), het in Rome by Paulus beland, en het 'n Christen geword. Volgens Romeinse wetgewing kon 'n weggeloopte slaaf swaar gestraf word. Paulus stuur Onesimus terug en vra Filemon om hom te ontvang \"nie meer as 'n slaaf nie, maar meer as 'n slaaf, as 'n geliefde broer\". Die naam Onesimus beteken \"nuttig\" (vgl. die woordspel in vers 11). Hierdie soort beginsels het uiteindelik die fondament van slawerny ondermyn.","leer":"Omdat ons met Christus opgewek is, moet ons ons gedagtes op die hemelse dinge rig, die sondes van die ou lewe \"doodmaak\", en ons met die deugde van Christus beklee – met liefde as die band van volmaaktheid. Alles wat ons doen, in woord of daad, moet in die Naam van Jesus gebeur. Die evangelie verander verhoudings: 'n weggeloopte slaaf word 'n geliefde broer. Vergifnis en versoening is prakties en kos soms iets.","skrif":"\"As julle dan saam met Christus opgewek is, soek die dinge wat daarbo is... Bedink die dinge wat daarbo is, nie wat op die aarde is nie\" (Kol. 3:1–2). \"Maak dood julle lede wat op die aarde is\" (3:5). \"Lê dit alles af: toorn, woede, kwaadwilligheid, lastering, skandelike taal\" (3:8). \"Beklee julle dan... met innige ontferming, goedertierenheid, nederigheid, sagmoedigheid, lankmoedigheid; en verdra mekaar en vergewe mekaar... Soos Christus julle vergewe het, so moet julle ook doen. En bo dit alles, beklee julle met die liefde wat die band van die volmaaktheid is\" (3:12–14). \"Laat die vrede van God in julle harte regeer\" (3:15). \"Alles wat julle ook doen in woord of in daad, doen dit alles in die Naam van die Here Jesus\" (3:17). \"Kinders, wees gehoorsaam aan julle ouers in alles\" (3:20). \"Vaders, moenie julle kinders terg nie, sodat hulle nie moedeloos word nie\" (3:21). \"Wat julle ook al doen, doen dit van harte, as vir die Here en nie vir mense nie\" (3:23). \"Volhard in die gebed\" (4:2). \"Laat julle woord altyd vriendelik wees, met sout besprinkel\" (4:6). Filemon: \"Ek pleit by jou vir my kind, Onesimus\" (Filemon 1:10). \"Nie meer as 'n slaaf nie, maar meer as 'n slaaf, as 'n geliefde broeder\" (1:16). \"Ontvang hom soos vir my\" (1:17). \"As hy jou iets skuldig is, reken dit vir my\" (1:18).","bid":"Bid Kolossense 3:12–14 oor ons gesin – dat ons ons met hierdie deugde sal \"beklee\". Pappa: bid 3:21 oor jouself. Bid dat ons alles \"van harte, vir die Here\" sal doen, ook skoolwerk en take (3:23). Bid vir iemand met wie ons versoen moet word.","vraag":"Paulus sê vir Filemon: \"As hy jou iets skuldig is, reken dit vir my.\" Hoe is dit 'n prentjie van wat Jesus vir ons gedoen het?","hoofstukke":[["Kolossense","COL",3],["Kolossense","COL",4],["Filemon","PHM",1]]},{"dag":374,"ref":"1 Timoteus 1 – 3","titel":"Die Grootste Sondaar, en Leiers in God se Huis","fase":7,"tydlyn":"c. 62–64 n.C. (ná Paulus se vrylating uit sy eerste gevangenskap in Rome). Geskryf deur Paulus, waarskynlik uit Masedonië (1:3), aan Timoteus, wat hy in Efese agtergelaat het.","agtergrond":"Timoteus was die seun van 'n Joodse moeder (Eunike) en 'n Griekse vader, en het van kleins af die Skrif by sy ma en ouma (Loïs) geleer (2 Timoteus 1:5; 3:15). Hy het Paulus op sy tweede sendingreis vergesel en was soos 'n \"eie seun in die geloof\" vir hom. Hy was relatief jonk (4:12) en waarskynlik nogal skaam. In Efese het valse leraars opgestaan met spekulasies, eindelose geslagsregisters en twisgesprekke. Paulus gee riglyne vir gebed, eredienste en die kwalifikasies vir opsieners (oudstes) en diakens. (Christene verskil oor hoe sekere riglyne oor die rol van vroue in die eredienste vandag toegepas moet word.)","leer":"Christus het in die wêreld gekom om sondaars te red – selfs die \"grootste\". As God vir Paulus genade kon gee, kan Hy dit vir enigiemand doen. Ons moet bid vir alle mense, ook vir die owerheid, want God wil hê dat alle mense gered word. Daar is net een Middelaar. Leiers in die kerk word gekies op grond van karakter – veral hoe hulle hulle eie huisgesin lei – nie net talent nie.","skrif":"\"Die doel van die gebod is liefde uit 'n rein hart en 'n goeie gewete en 'n ongeveinsde geloof\" (1:5). \"Ek was vroeër 'n lasteraar en vervolger... maar ek het barmhartigheid verkry\" (1:13). \"Dit is 'n betroubare woord en alle aanneming werd, dat Christus Jesus in die wêreld gekom het om sondaars te red, van wie ek die grootste is\" (1:15). \"Stry die goeie stryd, terwyl jy die geloof en 'n goeie gewete behou\" (1:18–19). \"Dat smekinge, gebede, voorbiddinge, danksegginge gedoen word vir alle mense, vir konings en almal wat in hoogheid is\" (2:1–2). \"God... wil hê dat alle mense gered word en tot kennis van die waarheid kom. Want daar is een God en een Middelaar tussen God en die mense, die mens Christus Jesus\" (2:4–5). Die kwalifikasies van 'n opsiener: onberispelik, getrou aan sy vrou, nugter, gasvry, bekwaam om te leer, nie 'n drinker nie, nie geldgierig nie, \"een wat sy eie huis goed regeer\" (3:1–7). \"As iemand sy eie huis nie weet te regeer nie, hoe sal hy vir die gemeente van God sorg?\" (3:5). Die verborgenheid van die godsvrug: \"God is geopenbaar in die vlees\" (3:16).","bid":"Dank God dat Jesus gekom het om sondaars te red – ook ons. Bid vir ons president, regering en alle leiers (2:1–2). Bid vir die leiers in ons kerk, dat hulle mense van karakter sal wees. Pappa: bid vir genade om \"jou eie huis goed te lei\" (3:4–5).","vraag":"Paulus het homself \"die grootste sondaar\" genoem. Waarom is dit bemoedigend vir ons?","hoofstukke":[["1 Timoteus","1TI",1],["1 Timoteus","1TI",2],["1 Timoteus","1TI",3]]},{"dag":375,"ref":"1 Timoteus 4 – 6","titel":"Wees 'n Voorbeeld – en die Gevaar van Geldsug","fase":7,"tydlyn":"c. 62–64 n.C.","agtergrond":"Die valse leraars in Efese het onder meer die huwelik en sekere kos verbied (4:3) en godsdiens as 'n manier om ryk te word gebruik (6:5). Timoteus was jonk en sommige het hom moontlik nie ernstig opgeneem nie; Paulus moedig hom aan om deur sy voorbeeld gesag te verdien. Paulus gee ook riglyne vir die versorging van weduwees (die kerk moes eg behoeftige weduwees versorg, maar families het eerste verantwoordelikheid), oudstes en slawe.","leer":"Alles wat God geskep het, is goed as dit met danksegging ontvang word. Geestelike oefening is belangriker as liggaamlike oefening. Jongmense kan 'n voorbeeld wees vir ander in woorde, gedrag, liefde, geloof en reinheid. Families moet vir hulle eie mense sorg. Godsvrug met tevredenheid is groot wins, maar die liefde vir geld is 'n wortel van alle soorte kwaad. Ons moet vlug van die kwaad, jaag na wat reg is, en die goeie stryd stry.","skrif":"\"Alles wat God geskape het, is goed... as dit met danksegging ontvang word\" (4:4). \"Die liggaamlike oefening is tot min nuttig, maar die godsvrug is tot alles nuttig\" (4:8). \"Laat niemand jou jonkheid verag nie, maar wees 'n voorbeeld vir die gelowiges in woord, in wandel, in liefde, in gees, in geloof, in reinheid\" (4:12). \"Gee ag op jouself en op die leer; volhard daarin\" (4:16). Behandel ouer mans soos vaders, jonger mans soos broers, ouer vroue soos moeders, jonger vroue soos susters \"in alle reinheid\" (5:1–2). \"As iemand nie vir sy eie... sorg nie, het hy die geloof verloën\" (5:8). \"Die godsvrug met tevredenheid is 'n groot wins\" (6:6). \"Ons het niks in die wêreld ingebring nie, en dit is duidelik dat ons ook niks kan uitdra nie\" (6:7). \"Die geldgierigheid is 'n wortel van al die kwaad\" (6:10). \"Maar jy, o man van God, vlug hierdie dinge en jaag die geregtigheid na, die godsvrug, geloof, liefde, lydsaamheid, sagmoedigheid. Stry die goeie stryd van die geloof, gryp die ewige lewe aan\" (6:11–12). Aan die rykes: \"Moenie hulle hoop op die onsekerheid van die rykdom stel nie, maar op die lewende God\" (6:17). \"Dat hulle goed doen, ryk word in goeie werke, mededeelsaam is\" (6:18).","bid":"Bid 1 Timoteus 4:12 oor ons gesin se kinders: dat hulle, ondanks hulle jeug, 'n voorbeeld sal wees in woorde, gedrag, liefde, geloof en reinheid. Bid vir tevredenheid en teen die liefde vir geld. Bid dat elkeen \"die goeie stryd van die geloof\" sal stry.","vraag":"Paulus sê vir die jong Timoteus: \"Laat niemand jou jonk verag nie, maar wees 'n voorbeeld.\" Op watter een van die vyf areas (woorde, gedrag, liefde, geloof, reinheid) kan jy vandeesweek 'n voorbeeld wees?","hoofstukke":[["1 Timoteus","1TI",4],["1 Timoteus","1TI",5],["1 Timoteus","1TI",6]]},{"dag":376,"ref":"Titus 1 – 3","titel":"Leef Goed, want die Genade van God het Verskyn","fase":7,"tydlyn":"c. 63–65 n.C. Geskryf deur Paulus aan Titus, wat hy op die eiland Kreta agtergelaat het.","agtergrond":"Titus was 'n nie-Joodse Christen (Galasiërs 2:3), 'n betroubare medewerker van Paulus wat moeilike take in Korinte hanteer het. Kreta was 'n groot eiland in die Middellandse See. Die Kretensers het 'n swak reputasie gehad: Paulus haal hulle eie digter Epimenides aan wat gesê het: \"Kretensers is altyd leuenaars, wilde diere, lui vraatsugtiges\" (1:12). In daardie omgewing moes Titus oudstes aanstel en die gelowiges leer om goed te leef. Die brief gee riglyne vir ouer mans, ouer vroue, jong vroue, jong mans en slawe.","leer":"Gesonde leer moet tot 'n goeie lewe lei. Ouer gelowiges moet die jongeres leer en mentor. Die genade van God red ons nie net nie, maar leer ons ook om \"nee\" te sê vir sonde en verstandig, regverdig en godvresend te leef terwyl ons op Jesus se koms wag. God het ons gered, nie op grond van ons goeie werke nie, maar deur Sy barmhartigheid – en daarom moet ons ywerig wees in goeie werke.","skrif":"Die kwalifikasies van 'n oudste (1:5–9). \"Vir die reines is alle dinge rein\" (1:15). \"Hulle bely dat hulle God ken, maar met die werke verloën hulle Hom\" (1:16). Ouer vroue moet die jong vroue leer (2:3–5). \"Vermaan net so die jongmanne om ingetoë te wees\" (2:6). \"Stel jouself in alles as 'n voorbeeld van goeie werke\" (2:7). \"Want die genade van God het verskyn, wat aan alle mense redding bring, en dit leer ons om die goddeloosheid en die wêreldse begeerlikhede te verloën, en ingetoë en regverdig en godvresend te lewe in die teenwoordige wêreld, terwyl ons die salige hoop verwag\" (2:11–13). \"Om vir Hom 'n eiendomsvolk te reinig, ywerig in goeie werke\" (2:14). \"Om niemand te beledig nie, om nie twisgierig te wees nie, maar vriendelik\" (3:2). \"Toe die goedertierenheid van God ons Verlosser en sy mensliewendheid verskyn het, het Hy ons gered, nie uit die werke van geregtigheid wat ons gedoen het nie, maar na sy barmhartigheid, deur die bad van die wedergeboorte en die vernuwing van die Heilige Gees\" (3:4–5).","bid":"Dank God dat Sy genade ons nie net red nie, maar ook leer om \"nee\" te sê vir sonde (2:11–12). Bid vir goeie mentors vir ons kinders – ouer mans vir die seuns in ons gesin, en ouer vroue vir die dogter in ons gesin. Bid dat ons gesin \"ywerig in goeie werke\" sal wees.","vraag":"Titus 2:12 sê God se genade leer ons om \"nee\" te sê vir sonde. Hoe help God se genade jou om nee te sê?","hoofstukke":[["Titus","TIT",1],["Titus","TIT",2],["Titus","TIT",3]]},{"dag":377,"ref":"2 Timoteus 1 – 2","titel":"Moenie Skaam Wees nie – Wees Sterk in die Genade","fase":7,"tydlyn":"c. 64–67 n.C. Paulus se laaste brief. Hy is weer gevange in Rome, hierdie keer in 'n donker tronk, en verwag om tereggestel te word (4:6). Waarskynlik tydens keiser Nero se vervolging van Christene ná die brand van Rome in 64 n.C.","agtergrond":"Die omstandighede was baie anders as Paulus se eerste gevangenskap (Handelinge 28): baie het hom verlaat (1:15), en dit was gevaarlik om met hom verbind te word. Onesiforus het moeite gedoen om hom in Rome te vind (1:16–17). Timoteus is moontlik ontmoedig en geneig om terug te deins weens die vervolging. Paulus skryf soos 'n vader aan 'n seun – hy wil die fakkel van die evangelie aan die volgende geslag oordra.","leer":"Geloof kan van geslag tot geslag oorgedra word – van ouma na ma na kind. God het ons nie 'n gees van vreesagtigheid gegee nie, maar van krag, liefde en selfbeheersing. Ons moet ons nie skaam vir die evangelie of vir mede-Christene wat ly nie. Ons moet wat ons geleer is, aan getroue mense oordra wat dit weer aan ander sal leer. Die Christelike lewe vra die toewyding van 'n soldaat, die dissipline van 'n atleet en die geduld van 'n boer. Ons moet God se Woord reg hanteer en van jeugdige begeertes wegvlug.","skrif":"\"Die ongeveinsde geloof wat in jou is, wat eers gewoon het in jou grootmoeder Loïs en jou moeder Eunike\" (1:5). \"Wakker die genadegawe van God aan wat in jou is\" (1:6). \"Want God het ons nie 'n gees van vreesagtigheid gegee nie, maar van krag en liefde en selfbeheersing\" (1:7). \"Skaam jou dan nie oor die getuienis van onse Here nie\" (1:8). \"Ek weet in wie ek geglo het, en ek is oortuig dat Hy mag het om my pand te bewaar\" (1:12). \"Wees sterk in die genade wat in Christus Jesus is\" (2:1). \"Vertrou dit toe aan getroue mense wat bekwaam sal wees om ook ander te leer\" (2:2). Die soldaat, die atleet en die boer (2:3–6). \"As ons ontrou is, Hy bly getrou\" (2:13). \"Beywer jou om jou voor God beproef voor te stel as 'n arbeider wat hom nie hoef te skaam nie, wat die woord van die waarheid reg sny\" (2:15). \"Vlug die jeugdige begeerlikhede en jaag die geregtigheid na, die geloof, die liefde, die vrede saam met die wat die Here aanroep uit 'n rein hart\" (2:22). \"'n Dienskneg van die Here moet nie twis nie, maar vriendelik wees teenoor almal\" (2:24).","bid":"Dank God vir die geloof wat deur ons ouma's, oupa's en ouers oorgedra is – noem hulle by die naam. Bid 2 Timoteus 1:7 oor elke kind: nie vrees nie, maar krag, liefde en selfbeheersing. Bid dat ons gesin se kinders die geloof eendag aan hulle eie kinders sal oordra (2:2).","vraag":"Timoteus se geloof het by sy ouma en ma begin. Wat wil jy hê moet die geloof wees wat jy eendag aan jou kinders oordra?","hoofstukke":[["2 Timoteus","2TI",1],["2 Timoteus","2TI",2]]},{"dag":378,"ref":"2 Timoteus 3 – 4","titel":"Die Skrif is deur God Ingegee – Ek het die Wedloop Voleindig","fase":7,"tydlyn":"c. 64–67 n.C. Paulus se laaste woorde, kort voor sy teregstelling. Hy vra Timoteus om voor die winter te kom en sy mantel en boeke te bring (4:13, 21).","agtergrond":"Paulus waarsku dat \"in die laaste dae\" (die tyd tussen Jesus se eerste en tweede koms) mense selfsugtig, geldgierig, trots en ondankbaar sal wees, met 'n skyn van godsvrug maar sonder die krag daarvan. Hy herinner Timoteus aan die Skrif wat hy van kleins af ken. \"Deur God ingegee\" (3:16) beteken letterlik \"deur God uitgeasem\". Paulus se laaste woorde is 'n afskeid van 'n ou soldaat: hy sien sy dood as 'n drankoffer wat uitgegiet word. Merkwaardig: hy vra dat Markus kom, \"want hy is vir my nuttig vir die bediening\" (4:11) – dieselfde Markus oor wie hy en Barnabas jare vroeër uitmekaar is (Handelinge 15:38). Volgens vroeë oorlewering is Paulus as Romeinse burger met die swaard onthoof.","leer":"Die Skrif is deur God gegee en is nuttig om ons te leer, te bestraf, reg te help en in geregtigheid op te voed, sodat ons volkome toegerus is vir elke goeie werk. Ons moet die Woord verkondig, ook wanneer dit ongewild is. Ons moet getrou bly tot die einde. Mense kan verander – Markus het van 'n mislukking 'n nuttige werker geword. Die Here staan by ons, selfs wanneer almal ons verlaat.","skrif":"\"In die laaste dae sal daar swaar tye kom. Want die mense sal liefhebbers van hulleself wees, geldgierig... ongehoorsaam aan die ouers, ondankbaar... wat meer van plesier hou as van God\" (3:1–4). \"Wat 'n gedaante van godsvrug het, maar die krag daarvan verloën\" (3:5). \"Almal wat godvrugtig wil lewe in Christus Jesus, sal vervolg word\" (3:12). \"Van kleins af ken jy die heilige Skrifte\" (3:15). \"Die hele Skrif is deur God ingegee en is nuttig tot lering, tot weerlegging, tot teregwysing, tot onderwysing in die geregtigheid, sodat die mens van God volkome kan wees, vir elke goeie werk volkome toegerus\" (3:16–17). \"Verkondig die woord, hou aan tydig en ontydig\" (4:2). \"Daar sal 'n tyd wees wanneer hulle die gesonde leer nie sal verdra nie... en hulle ore van die waarheid sal afkeer\" (4:3–4). \"Ek het die goeie stryd gestry, ek het die wedloop voleindig, ek het die geloof behou. Verder is daar vir my weggelê die kroon van die geregtigheid\" (4:7–8). \"Neem Markus... want hy is vir my nuttig vir die bediening\" (4:11). \"Maar die Here het by my gestaan en my versterk\" (4:17).","bid":"Dank God vir die Bybel – Sy uitgeasemde Woord – wat ons die afgelope jaar saam gelees het. Bid dat ons gesin se kinders soos Timoteus \"van kleins af die Skrif sal ken\". Bid dat elkeen van ons, soos Paulus, eendag sal kan sê: \"Ek het die wedloop voleindig, ek het die geloof behou.\" Dank God dat mense kan verander, soos Markus.","vraag":"Paulus en Markus was eers in onmin, maar later was Markus vir hom \"nuttig\". Wat leer dit ons oor mense wat ons teleurgestel het?","hoofstukke":[["2 Timoteus","2TI",3],["2 Timoteus","2TI",4]]},{"dag":379,"ref":"1 Petrus 1 – 2","titel":"'n Lewende Hoop en 'n Uitverkore Geslag","fase":7,"inleiding":["Die Algemene Briewe en Openbaring","Hierdie briewe is nie aan een spesifieke gemeente gerig nie, maar aan wyer groepe Christene, dikwels in tye van vervolging of valse lering. Ons lees dit in 'n waarskynlike historiese volgorde: 1 Petrus (c. 62–64), Hebreërs (voor 70), 2 Petrus en Judas (middel tot laat 60's, of later), en die briewe en Openbaring van Johannes (c. 90–95). Die Bybel eindig met Openbaring: die opgestane Christus wat regeer, Sy kerk wat volhard, die oordeel oor die kwaad, en 'n nuwe hemel en 'n nuwe aarde."],"tydlyn":"c. 62–64 n.C., moontlik net voor of aan die begin van Nero se vervolging. Geskryf deur die apostel Petrus uit \"Babilon\" (5:13) – waarskynlik 'n skuilnaam vir Rome – met hulp van Silvanus (Silas).","agtergrond":"Petrus skryf aan \"vreemdelinge in die verstrooiing\" in die provinsies van Klein-Asië (die huidige Turkye). Hulle was meestal nie-Joodse Christene wat nou soos buitestaanders in hulle eie gemeenskap gevoel het: hulle het nie meer aan die heidense feeste en sedeloosheid deelgeneem nie, en is daarom bespot, verdink en soms vervolg. Petrus gebruik beelde uit die Ou Testament wat vir Israel gegee is ('n uitverkore geslag, 'n koninklike priesterdom, 'n heilige nasie – Exodus 19:6) en pas dit op die kerk toe.","leer":"Deur Jesus se opstanding het ons 'n lewende hoop en 'n erfenis wat nie kan vergaan nie. Swaarkry toets en suiwer ons geloof soos goud. Ons moet heilig wees, want God is heilig, en ons is met die kosbare bloed van Christus vrygekoop. As God se volk is ons geroep om Sy deugde te verkondig, as vreemdelinge in die wêreld te lewe, en goed te doen sodat ander God sal verheerlik. Jesus is ons voorbeeld in lyding.","skrif":"\"Geseënd is die God en Vader van onse Here Jesus Christus wat ons volgens sy groot barmhartigheid weergebore het tot 'n lewende hoop deur die opstanding van Jesus Christus uit die dode, tot 'n onverganklike en onbevlekte en onverwelklike erfenis\" (1:3–4). Die beproewing van julle geloof, kosbaarder as goud (1:7). \"Vir wie julle liefhet sonder dat julle Hom gesien het\" (1:8). \"Wees heilig, want Ek is heilig\" (1:16). \"Julle is losgekoop... nie met verganklike dinge, silwer of goud nie, maar met die kosbare bloed van Christus, soos van 'n lam sonder gebrek en sonder vlek\" (1:18–19). \"Verlang na die onvervalste melk van die woord, soos pasgebore kindertjies, sodat julle daardeur kan opgroei\" (2:2). \"Julle word ook as lewende stene opgebou\" (2:5). \"Maar julle is 'n uitverkore geslag, 'n koninklike priesterdom, 'n heilige nasie, 'n volk as eiendom verkry, om te verkondig die deugde van Hom wat julle uit die duisternis geroep het tot sy wonderbare lig\" (2:9). \"As vreemdelinge en bywoners\" (2:11). \"Lei 'n goeie lewe onder die heidene\" (2:12). \"Christus het vir ons gely en vir ons 'n voorbeeld nagelaat, dat julle sy voetstappe kan navolg\" (2:21). \"Deur sy wonde is julle genees\" (2:24; Jesaja 53).","bid":"Dank God vir die \"lewende hoop\" wat ons deur Jesus se opstanding het. Bid vir 'n honger na God se Woord, \"soos pasgebore babatjies na melk\" (2:2). Bid dat ons as \"vreemdelinge\" sal leef – anders as die wêreld – en tog goed sal doen sodat ander God sal sien. Bid vir vervolgde Christene.","vraag":"Petrus sê ons is \"vreemdelinge\" in die wêreld. Wanneer voel jy die meeste soos 'n \"vreemdeling\" omdat jy 'n Christen is?","hoofstukke":[["1 Petrus","1PE",1],["1 Petrus","1PE",2]]},{"dag":380,"ref":"1 Petrus 3 – 5","titel":"Gereed om te Antwoord – en Werp Jou Sorge op Hom","fase":7,"tydlyn":"c. 62–64 n.C. Geskryf uit \"Babilon\" (Rome).","agtergrond":"Petrus gee riglyne vir vrouens (dikwels getroud met ongelowige mans), mans, en die hele gemeente. Hy berei hulle voor op \"die vuurgloed\" van vervolging wat oor hulle kom (4:12). Die oudstes moet die kudde soos herders lei – Petrus self is deur Jesus geroep om \"Sy skape te wei\" (Johannes 21). Hy sluit af met groete van \"my seun Markus\" (5:13) – volgens oorlewering die Markus wat die evangelie op grond van Petrus se prediking opgeteken het, die evangelie waarmee ons hierdie plan begin het.","leer":"Ons innerlike skoonheid en karakter is belangriker as uiterlike voorkoms. Mans moet hulle vrouens met begrip en eer behandel. Ons moet nie kwaad met kwaad vergeld nie, maar seën. Ons moet altyd gereed wees om met sagmoedigheid en respek te verduidelik waarom ons hoop het. Lyding vir Christus is 'n eer, nie 'n verrassing nie. Ons moet nederig wees, ons bekommernisse op God werp, waaksaam wees teen die duiwel en vas staan in die geloof.","skrif":"\"Julle versiering moet nie die uiterlike wees nie... maar die verborge mens van die hart in die onverganklike sieraad van 'n sagmoedige en stille gees, wat baie kosbaar is voor God\" (3:3–4). \"Manne, woon by hulle met verstand\" en gee hulle eer (3:7). \"Vergeld nie kwaad met kwaad nie... maar seën\" (3:9). \"Heilig die Here God in julle harte, en wees altyd gereed om verantwoording te doen aan elkeen wat van julle rekenskap eis van die hoop wat in julle is, met sagmoedigheid en vrees\" (3:15). \"Christus het ook een maal vir die sondes gely, die Regverdige vir die onregverdiges, sodat Hy ons na God kon bring\" (3:18). \"Die liefde bedek 'n menigte van sondes\" (4:8). \"Wees gasvry teenoor mekaar sonder murmurering\" (4:9). \"Elkeen moet die genadegawe wat hy ontvang het, ten dienste van mekaar gebruik\" (4:10). \"Moenie verbaas wees oor die vuurgloed wat oor julle kom nie\" (4:12). \"Wei die kudde van God\" (5:2). \"Beklee julle met nederigheid... want God weerstaan die hoogmoediges, maar aan die nederiges gee Hy genade\" (5:5). \"Werp al julle bekommernis op Hom, want Hy sorg vir julle\" (5:7). \"Wees nugter en waak, want julle teëstander, die duiwel, loop rond soos 'n brullende leeu\" (5:8). \"Weerstaan hom, standvastig in die geloof\" (5:9).","bid":"Bid vir die dogter in ons gesin dat sy haar waarde in die \"verborge mens van die hart\" sal vind, en vir die seuns in ons gesin dat hulle vroue eendag met eer sal behandel. Bid dat elkeen gereed sal wees om te verduidelik waarom hy of sy in Jesus glo (3:15). Werp elkeen se bekommernis saam op God (5:7).","vraag":"Petrus sê ons moet gereed wees om te verduidelik waarom ons hoop het (3:15). As 'n vriend jou vra \"Waarom glo jy in Jesus?\", wat sou jy antwoord?","hoofstukke":[["1 Petrus","1PE",3],["1 Petrus","1PE",4],["1 Petrus","1PE",5]]},{"dag":381,"ref":"Hebreërs 1 – 2","titel":"Jesus is Groter as die Engele","fase":7,"tydlyn":"Waarskynlik c. 60–69 n.C., voor die verwoesting van die tempel in 70 n.C. (die brief praat van die offers asof dit nog gebring word, bv. 10:1–2). Die skrywer is onbekend (voorstelle sluit in Paulus, Barnabas, Apollos en Priscilla); die kerk het dit as gesaghebbend aanvaar.","agtergrond":"Hebreërs is geskryf aan Joodse Christene wat onder druk was – vervolging, verlies van eiendom (10:32–34) – en in die versoeking was om Jesus te los en terug te keer na die Joodse godsdiens met sy tempel, priesters en offers. Die skrywer wys dat Jesus groter is as alles in die ou verbond: groter as die engele (deur wie die wet volgens Joodse oorlewering gegee is), as Moses, as Josua, as die hoëpriesters, en Sy offer groter as alle offers. Die brief is eintlik 'n preek (\"woord van vermaning\", 13:22) met baie aanhalings uit die Ou Testament, veral die Psalms.","leer":"In die verlede het God op baie maniere deur die profete gepraat, maar nou het Hy finaal deur Sy Seun gepraat. Jesus is die afskynsel van God se heerlikheid, die Skepper en Onderhouer van alles, wat die reiniging van ons sondes bewerk het en aan God se regterhand sit. Hy is groter as die engele. Daarom moet ons nie dryf weg van die redding wat Hy bring nie. Jesus het mens geword en gely, sodat Hy ons kan verstaan, help en na heerlikheid kan bring.","skrif":"\"Nadat God in die ou tyd baiekeer en op baie maniere tot die vaders gespreek het deur die profete, het Hy in hierdie laaste dae tot ons gespreek deur die Seun\" (1:1–2). \"Hy wat die afskynsel is van sy heerlikheid en die afdruksel van sy wese, en wat alle dinge dra deur die woord van sy krag\" (1:3). \"U is my Seun, vandag het Ek U gegenereer\" (1:5; Psalm 2:7). \"U troon, o God, is tot in alle ewigheid\" (1:8; Psalm 45). \"Daarom moet ons des te meer ag gee op wat ons gehoor het, sodat ons nie miskien wegdryf nie\" (2:1). \"Hoe sal ons ontvlug as ons so 'n groot saligheid verwaarloos?\" (2:3). \"Ons sien Jesus... met heerlikheid en eer gekroon, sodat Hy deur die genade van God vir elkeen die dood sou smaak\" (2:9). \"Hy skaam Hom nie om hulle broeders te noem nie\" (2:11). \"Sodat Hy deur die dood hom tot niet kon maak wat die mag van die dood het, dit is die duiwel\" (2:14). \"Want waarin Hy self gely het toe Hy versoek is, kan Hy die wat versoek word, help\" (2:18).","bid":"Aanbid Jesus as die Seun deur wie God finaal gepraat het. Bid dat ons nie stadig van Jesus sal \"wegdryf\" nie (2:1). Dank Jesus dat Hy Hom nie skaam om ons Sy broers en susters te noem nie, en dat Hy ons in versoeking kan help omdat Hy self versoek is.","vraag":"Hebreërs 2:1 waarsku teen \"wegdryf\". Hoe dryf 'n mens van Jesus weg sonder om dit agter te kom – soos 'n boot sonder anker?","hoofstukke":[["Hebreërs","HEB",1],["Hebreërs","HEB",2]]},{"dag":382,"ref":"Hebreërs 3 – 4","titel":"Groter as Moses – en die Sabbatsrus vir die Volk van God","fase":7,"tydlyn":"c. 60–69 n.C.","agtergrond":"Moses was vir Jode die grootste figuur in hul geskiedenis. Die skrywer erken Moses se getrouheid, maar wys dat Jesus groter is: Moses was 'n dienaar in God se huis, Jesus is die Seun oor die huis. Hy haal Psalm 95 aan oor die geslag in die woestyn wat weens ongeloof nie in God se \"rus\" (die beloofde land) ingegaan het nie (Numeri 14). Josua het hulle nie die volle rus gegee nie; daar bly 'n sabbatsrus oor vir God se volk – 'n rus wat ons nou in Christus ingaan en volkome in die ewigheid sal geniet.","leer":"Ons moet ons oë op Jesus hou, wat groter is as Moses. Ongeloof en verharde harte keer dat ons God se beloftes ontvang; daarom moet ons mekaar elke dag bemoedig sodat niemand deur die bedrog van die sonde verhard word nie. God se ware rus word deur geloof ontvang, nie deur ons werke nie. God se Woord is lewend en kragtig en deurgrond ons harte. Omdat Jesus ons Hoëpriester is wat met ons swakhede kan meevoel, kan ons met vrymoedigheid na God se troon gaan.","skrif":"\"Let op die Apostel en Hoëpriester van ons belydenis, Christus Jesus\" (3:1). Moses was getrou as dienaar, \"maar Christus as Seun oor sy huis\" (3:5–6). \"Vandag, as julle sy stem hoor, verhard julle harte nie\" (3:7–8, 15; Psalm 95). \"Vermaan mekaar elke dag... sodat niemand van julle verhard word deur die bedrog van die sonde nie\" (3:13). \"Hulle kon nie ingaan weens ongeloof nie\" (3:19). \"Daar bly dan 'n sabbatsrus oor vir die volk van God\" (4:9). \"Want die woord van God is lewend en kragtig en skerper as enige tweesnydende swaard... en is 'n beoordelaar van die oorlegginge en gedagtes van die hart\" (4:12). \"Want ons het nie 'n hoëpriester wat nie met ons swakhede medelyde kan hê nie, maar een wat in alle opsigte net soos ons versoek is, maar sonder sonde. Laat ons dan met vrymoedigheid na die troon van die genade gaan, sodat ons barmhartigheid kan verkry en genade vind om op die regte tyd gehelp te word\" (4:15–16).","bid":"Bid dat ons harte nie verhard sal word nie. Bid dat ons mekaar in die gesin \"elke dag\" sal bemoedig (3:13) – sê nou vir mekaar een bemoedigende ding. Gaan saam \"met vrymoedigheid na die troon van genade\" met elkeen se behoeftes, en dank Jesus dat Hy ons swakhede verstaan.","vraag":"Hebreërs 3:13 sê ons moet mekaar \"elke dag\" bemoedig. Hoe kan ons dit as gesin prakties doen?","hoofstukke":[["Hebreërs","HEB",3],["Hebreërs","HEB",4]]},{"dag":383,"ref":"Hebreërs 5 – 7","titel":"Jesus, Hoëpriester volgens die Orde van Melgisedek","fase":7,"tydlyn":"c. 60–69 n.C.","agtergrond":"'n Hoëpriester van Israel moes uit die stam van Levi en die familie van Aäron kom. Jesus kom uit Juda. Hoe kan Hy dan Hoëpriester wees? Die skrywer wys na Melgisedek, die geheimsinnige priester-koning van Salem wat Abraham geseën het (Genesis 14:18–20), en na Psalm 110:4: \"U is priester vir ewig volgens die orde van Melgisedek.\" Melgisedek se naam beteken \"koning van geregtigheid\", en Salem beteken \"vrede\". Omdat Abraham aan hom tiendes gegee het, was Melgisedek groter as Abraham – en dus groter as Levi, wat uit Abraham gebore is. In hoofstuk 5–6 onderbreek die skrywer homself met 'n skerp waarskuwing teen geestelike onvolwassenheid en afvalligheid (Christene verstaan 6:4–6 verskillend).","leer":"Jesus is die volmaakte Hoëpriester – nie deur menslike afkoms nie, maar deur God se aanstelling en die krag van 'n onvernietigbare lewe. Hy het gehoorsaamheid geleer deur lyding. Ons moet nie geestelik op \"melk\" bly nie, maar groei tot volwassenheid. God se belofte, bevestig met 'n eed, is 'n anker vir ons siel. Omdat Jesus vir ewig lewe, kan Hy volkome red, en Hy bid altyd vir ons.","skrif":"\"Hy het, hoewel Hy die Seun was, gehoorsaamheid geleer uit wat Hy gely het\" (5:8). \"Julle het nodig dat iemand julle weer leer... julle het melk nodig en nie vaste spys nie\" (5:12). \"Laat ons voortgaan tot die volmaaktheid\" (6:1). \"God is nie onregverdig, dat Hy julle werk en die arbeid van die liefde sal vergeet nie\" (6:10). \"Wees navolgers van die wat deur geloof en lankmoedigheid die beloftes beërwe\" (6:12). \"Wat ons het as 'n anker van die siel, wat veilig en vas is\" (6:19). Melgisedek, \"koning van geregtigheid... koning van Salem, dit is koning van vrede\" (7:1–2). \"Volgens die krag van 'n onvernietigbare lewe\" (7:16). \"Daarom kan Hy ook volkome red die wat deur Hom na God gaan, omdat Hy altyd lewe om vir hulle in te tree\" (7:25).","bid":"Dank Jesus dat Hy vir ewig lewe en altyd vir ons intree (7:25) – Hy bid nou vir ons gesin se kinders. Bid dat ons nie geestelik op \"melk\" sal bly nie, maar sal groei. Dank God vir Sy beloftes as 'n anker in die storms van die lewe.","vraag":"Hebreërs 6:19 noem God se belofte 'n \"anker vir die siel\". Wat doen 'n anker vir 'n skip, en hoe doen God se beloftes dit vir jou?","hoofstukke":[["Hebreërs","HEB",5],["Hebreërs","HEB",6],["Hebreërs","HEB",7]]},{"dag":384,"ref":"Hebreërs 8 – 10","titel":"Die Nuwe Verbond en die Een Volmaakte Offer","fase":7,"tydlyn":"c. 60–69 n.C.","agtergrond":"Die skrywer haal Jeremia 31:31–34 (die nuwe verbond) volledig aan – die langste aanhaling uit die Ou Testament in die Nuwe Testament. Hy vergelyk die aardse tabernakel en sy offers met die hemelse werklikheid. Die ou offers moes daagliks en jaarliks herhaal word, wat gewys het dat dit nie sonde werklik kon wegneem nie. Jesus het een keer vir altyd met Sy eie bloed in die hemelse Heiligdom ingegaan. Die priesters in die tempel het nooit gaan sit nie (daar was nie stoele in die tabernakel nie), want hulle werk was nooit klaar nie; Jesus het gaan sit aan die regterhand van God.","leer":"Die nuwe verbond in Jesus is beter as die ou: God skryf Sy wet op ons harte en onthou ons sondes nie meer nie. Jesus se offer is volmaak en finaal – een keer vir altyd. Daarom kan ons met vrymoedigheid tot God nader. Ons moet aan ons hoop vashou, mekaar aanspoor tot liefde en goeie werke, en nie ophou om saam te kom nie. Ons moet volhard.","skrif":"\"Ek sal my wette in hulle verstand gee en dit op hulle harte skrywe... en aan hulle sondes en ongeregtighede sal Ek nooit meer dink nie\" (8:10, 12). \"Christus het gekom as Hoëpriester... met sy eie bloed het Hy een maal ingegaan in die heiligdom en 'n ewige verlossing teweeggebring\" (9:11–12). \"Hoeveel te meer sal die bloed van Christus... julle gewete reinig van dooie werke om die lewende God te dien\" (9:14). \"Sonder bloedstorting is daar geen vergifnis nie\" (9:22). \"Dit is die mense bestem om een maal te sterwe en daarna die oordeel\" (9:27). \"Dit is onmoontlik dat die bloed van bulle en bokke sondes kan wegneem\" (10:4). \"Ons is geheilig deur die offer van die liggaam van Jesus Christus, een maal vir altyd\" (10:10). \"Hy het... vir altyd gaan sit aan die regterhand van God\" (10:12). \"Laat ons nader gaan met 'n waaragtige hart in volle sekerheid van geloof\" (10:22). \"Laat ons die onwankelbare belydenis van die hoop vashou, want Hy wat die beloftes gemaak het, is getrou\" (10:23). \"Laat ons op mekaar ag gee om mekaar aan te spoor tot liefde en goeie werke, en laat ons ons onderlinge byeenkoms nie versuim soos sommige die gewoonte het nie\" (10:24–25). \"Gooi dan julle vrymoedigheid nie weg nie\" (10:35).","bid":"Dank Jesus dat Sy een offer genoeg is – daar is niks meer om te betaal nie. Dank God dat Hy ons sondes \"nooit meer onthou\" nie. Bid dat ons gesin getrou in die kerk sal saamkom en mekaar sal aanspoor tot liefde en goeie werke.","vraag":"Die priesters in die tempel het nooit gaan sit nie, maar Jesus het gaan sit (10:11–12). Wat sê dit oor Sy werk vir ons?","hoofstukke":[["Hebreërs","HEB",8],["Hebreërs","HEB",9],["Hebreërs","HEB",10]]},{"dag":385,"ref":"Hebreërs 11","titel":"Die Geloofshelde: Deur die Geloof...","fase":7,"tydlyn":"c. 60–69 n.C. Die hoofstuk gaan deur die hele Ou Testament, van Abel tot die Makkabeërs.","agtergrond":"Hebreërs 11 word die \"geloofsgalery\" genoem. Dit vat die hele Ou Testament wat ons hierdie jaar gelees het, saam in een hoofstuk – van Abel, Henog en Noag, deur Abraham, Sara, Isak, Jakob en Josef, Moses, die volk by die Rietsee, Ragab, Gideon, Simson, Dawid, Samuel en die profete, tot dié wat gemartel is. Die meeste van hierdie mense was onvolmaak – ons het hulle foute gelees – maar hulle het God vertrou. Baie het nie die vervulling van die beloftes in hulle lewe gesien nie, maar het \"van ver af\" daarna uitgesien.","leer":"Geloof is om seker te wees van dinge wat ons hoop, en oortuig te wees van dinge wat ons nie sien nie. Sonder geloof is dit onmoontlik om God te behaag. Geloof word gesien in dade: offer, bou, gaan, wag, kies, weier, oorwin, en volhard – selfs tot die dood. Geloof kyk vorentoe na God se beloftes, al sien ons dit nie nou nie. God skaam Hom nie om die God van sulke mense genoem te word nie.","skrif":"\"Die geloof dan is 'n vaste vertroue op die dinge wat ons hoop, 'n bewys van die dinge wat ons nie sien nie\" (11:1). \"Deur die geloof verstaan ons dat die wêreld deur die woord van God toeberei is\" (11:3). \"Sonder geloof is dit onmoontlik om God te behaag; want hy wat tot God gaan, moet glo dat Hy bestaan en 'n beloner is van die wat Hom soek\" (11:6). Abraham het uitgegaan, \"sonder om te weet waar hy heen gaan\" (11:8). \"Hulle het die beloftes nie verkry nie, maar dit van ver gesien\" (11:13). \"Daarom skaam God Hom nie oor hulle om hulle God genoem te word nie\" (11:16). Moses het \"verkies om eerder met die volk van God mishandel te word as om die tydelike genieting van die sonde te hê\" (11:25). Ragab (11:31). \"Wat my tyd sou ontbreek om te vertel van Gideon en Barak en Simson en Jefta, ook van Dawid en Samuel en die profete\" (11:32). \"Hulle is gestenig, in stukke gesaag... die wêreld was hulle nie werd nie\" (11:37–38). \"Want God het iets beters vir ons voorsien\" (11:40).","bid":"Dank God vir die \"geloofshelde\" van die Bybel, en vir die geloofshelde in ons eie familie. Bid Hebreërs 11:6 oor elke kind: dat hulle sal glo dat God bestaan en 'n beloner is van dié wat Hom soek. Bid dat ons, soos Moses, sal kies om God te volg eerder as om die tydelike plesier van sonde te geniet.","vraag":"Watter geloofsheld uit Hebreërs 11 – van wie ons hierdie jaar gelees het – het jou die meeste geïnspireer? Waarom?","hoofstukke":[["Hebreërs","HEB",11]]},{"dag":386,"ref":"Hebreërs 12 – 13","titel":"Laat Ons die Wedloop Hardloop met die Oog op Jesus","fase":7,"tydlyn":"c. 60–69 n.C.","agtergrond":"Ná die geloofsgalery gebruik die skrywer die beeld van 'n stadion: die geloofshelde van hoofstuk 11 is soos 'n \"wolk van getuies\" in die pawiljoen – nie toeskouers wat kyk nie, maar getuies wat bewys dat volharding moontlik is. Hardlopers in die antieke spele het alle oortollige gewig en klere afgelê. Die skrywer verduidelik swaarkry as die liefdevolle tug van 'n Vader, en kontrasteer die berg Sinai (vrees en vuur) met die berg Sion (die hemelse Jerusalem en die vreugde van God se volk). Hy sluit af met praktiese vermanings.","leer":"Ons moet alles wat ons hinder en die sonde wat ons so maklik verstrik, aflê, en die wedloop met volharding hardloop – met ons oë op Jesus, die Begin en Voleinder van ons geloof. God se tug is 'n bewys van Sy liefde; dit lei tot heiligheid en vrede. Ons moet in vrede met almal leef, gasvry wees, die huwelik eer, tevrede wees met wat ons het, en ons leiers respekteer. Jesus Christus is dieselfde – gister en vandag en tot in ewigheid.","skrif":"\"Daarom moet ons ook, terwyl ons so 'n groot wolk van getuies rondom ons het, elke las aflê en die sonde wat ons so maklik omring, en met volharding die wedloop loop wat voor ons lê, die oog gevestig op Jesus, die Leidsman en Voleinder van die geloof\" (12:1–2). \"Wat ter wille van die vreugde wat voor Hom gelê is, die kruis verdra het\" (12:2). \"Die Here tugtig hom wat Hy liefhet\" (12:6). \"Geen tugtiging lyk op die oomblik of dit 'n saak van blydskap is nie, maar van droefheid; later lewer dit egter... die vreedsame vrug van geregtigheid\" (12:11). \"Jaag die vrede na met almal, en die heiligmaking sonder wat niemand die Here sal sien nie\" (12:14). \"Julle het gekom by die berg Sion en die stad van die lewende God\" (12:22). \"Want onse God is 'n verterende vuur\" (12:29). \"Die broederliefde moet bly. Moenie die herbergsaamheid vergeet nie, want daardeur het sommige onwetend engele geherberg\" (13:1–2). \"Die huwelik moet deur almal in eer gehou word\" (13:4). \"Wees tevrede met wat julle het; want Hy self het gesê: Ek sal jou nooit begewe en jou nooit verlaat nie\" (13:5). \"Jesus Christus is gister en vandag dieselfde en tot in ewigheid\" (13:8). \"Gehoorsaam julle voorgangers\" (13:17).","bid":"Vra God om elkeen te wys watter \"las\" of sonde hulle in die wedloop terughou, en bid vir die krag om dit af te lê. Bid dat ons oë op Jesus gevestig sal bly. Dank God vir Sy liefdevolle tug. Dank Hom dat Hy ons nooit sal verlaat nie (13:5).","vraag":"Hebreërs 12:1 vra ons om \"elke las af te lê\" wat ons in die wedloop hinder. Wat is iets – nie noodwendig sonde nie – wat jou geestelik vertraag?","hoofstukke":[["Hebreërs","HEB",12],["Hebreërs","HEB",13]]},{"dag":387,"ref":"2 Petrus 1 – 3; Judas 1","titel":"Groei in Genade – en Waak teen Valse Leraars","fase":7,"tydlyn":"2 Petrus: c. 64–68 n.C., kort voor Petrus se dood (1:14). Judas: waarskynlik in dieselfde tyd. (Sommige geleerdes dateer albei later en bevraagteken die skrywerskap van 2 Petrus; die kerk het albei briewe as deel van die Skrif aanvaar.)","agtergrond":"2 Petrus is Petrus se \"testament\" – hy weet hy gaan binnekort sterf, soos Jesus voorspel het (Johannes 21:18–19). Hy herinner aan sy ooggetuienis van die verheerliking op die berg. Valse leraars het opgestaan wat sedeloosheid as \"vryheid\" voorgehou het en gespot het met Jesus se wederkoms. Judas (die broer van Jakobus, en dus ook 'n broer van Jesus) skryf oor dieselfde probleem – baie van sy brief kom ooreen met 2 Petrus 2. Judas haal ook voorbeelde uit Joodse oorleweringe aan (soos die boek Henog), wat sy lesers geken het.","leer":"God het ons alles gegee wat ons nodig het vir lewe en godsvrug; ons moet ywerig groei in deugde, van geloof tot liefde. Die Skrif is nie mensgemaak nie – die skrywers is deur die Heilige Gees gedryf. Valse leraars sal kom, en ons moet hulle aan hulle vrugte herken. God is nie stadig met Sy belofte nie, maar geduldig omdat Hy wil hê almal moet tot bekering kom. Jesus kom weer; daarom moet ons heilig leef. God is magtig om ons te bewaar sodat ons nie struikel nie.","skrif":"\"Sy goddelike krag het ons alles geskenk wat tot die lewe en die godsvrug nodig is\" (1:3). \"Voeg by julle geloof deug, by die deug kennis, by die kennis selfbeheersing, by die selfbeheersing lydsaamheid, by die lydsaamheid godsvrug, by die godsvrug broederliefde, by die broederliefde die liefde\" (1:5–7). \"Ons was ooggetuies van sy majesteit\" (1:16). \"Geen profesie is ooit voortgebring deur die wil van 'n mens nie, maar die heilige mense van God, deur die Heilige Gees gedrywe, het gespreek\" (1:21). \"Daar sal valse leraars onder julle wees\" (2:1). \"Hulle beloof hulle vryheid, terwyl hulle self slawe van die verderf is\" (2:19). \"By die Here is een dag soos duisend jaar\" (3:8). \"Die Here vertraag nie die belofte nie... maar Hy is lankmoedig teenoor ons, omdat Hy nie wil hê dat sommige verlore gaan nie, maar dat almal tot bekering kom\" (3:9). \"Ons verwag volgens sy belofte nuwe hemele en 'n nuwe aarde waarin geregtigheid woon\" (3:13). \"Groei in die genade en kennis van onse Here en Verlosser Jesus Christus\" (3:18). Judas: \"Om te stry vir die geloof wat eenmaal aan die heiliges oorgelewer is\" (Judas 1:3). \"Bou julleself op in julle allerheiligste geloof, bid in die Heilige Gees, bewaar julleself in die liefde van God\" (1:20–21). \"Ontferm julle oor sommige wat twyfel\" (1:22). \"Aan Hom wat mag het om julle sonder struikel te bewaar en julle onberispelik met vreugde voor sy heerlikheid te stel\" (1:24).","bid":"Bid 2 Petrus 1:5–7 oor elke kind – dat hulle sal groei van geloof tot liefde. Bid vir onderskeidingsvermoë teen valse leringe. Bid vir mense wat twyfel (Judas 1:22). Sluit af met die doksologie van Judas 1:24–25.","vraag":"Petrus sê God is \"geduldig\" omdat Hy wil hê almal moet tot bekering kom. Vir wie is jy dankbaar dat God geduldig is?","hoofstukke":[["2 Petrus","2PE",1],["2 Petrus","2PE",2],["2 Petrus","2PE",3],["Judas","JUD",1]]},{"dag":388,"ref":"1 Johannes 1 – 2","titel":"Wandel in die Lig – God Vergewe","fase":7,"tydlyn":"c. 85–95 n.C. Geskryf deur die apostel Johannes, nou 'n ou man, waarskynlik uit Efese, aan gemeentes in die provinsie Asië.","agtergrond":"Johannes skryf as die laaste lewende apostel en 'n ooggetuie (\"wat ons gehoor het, wat ons met ons oë gesien het... en ons hande getas het\", 1:1). Daar het 'n groep die kerk verlaat (2:19) wat geleer het dat Jesus nie werklik in 'n menslike liggaam gekom het nie, en dat sonde nie saak maak nie omdat net \"geestelike kennis\" belangrik is (die begin van die latere Gnostisisme). Johannes skryf sodat die gelowiges seker kan wees van hulle verhouding met God. Hy noem hulle liefdevol \"my kindertjies\".","leer":"God is lig, en ons kan nie in die duisternis leef en terselfdertyd beweer ons het gemeenskap met Hom nie. Om te sê ons het geen sonde nie, is selfbedrog – maar as ons ons sondes bely, is God getrou en regverdig om dit te vergewe. Jesus is ons Voorspraak. Ons ken God as ons Sy gebooie gehoorsaam, veral om mekaar lief te hê. Ons moet nie die wêreld en sy begeertes liefhê nie, want dit gaan verby.","skrif":"\"Wat ons gehoor het, wat ons met ons oë gesien het... en ons hande getas het aangaande die Woord van die lewe\" (1:1). \"God is lig, en in Hom is daar hoegenaamd geen duisternis nie\" (1:5). \"As ons in die lig wandel soos Hy in die lig is, het ons gemeenskap met mekaar, en die bloed van Jesus Christus, sy Seun, reinig ons van alle sonde\" (1:7). \"As ons sê dat ons geen sonde het nie, mislei ons onsself\" (1:8). \"As ons ons sondes bely, Hy is getrou en regverdig om ons die sondes te vergewe en ons van alle ongeregtigheid te reinig\" (1:9). \"As iemand gesondig het, ons het 'n Voorspraak by die Vader, Jesus Christus, die Regverdige\" (2:1). \"Hy wat sê dat hy in Hom bly, behoort self ook so te wandel soos Hy gewandel het\" (2:6). \"Hy wat sy broeder haat, is in die duisternis\" (2:11). \"Ek skrywe aan julle, jongmanne, omdat julle sterk is en die woord van God in julle bly, en julle die Bose oorwin het\" (2:14). \"Moenie die wêreld liefhê nie, en ook nie die dinge wat in die wêreld is nie... die begeerlikheid van die vlees en die begeerlikheid van die oë en die grootsheid van die lewe\" (2:15–16). \"En die wêreld gaan verby... maar hy wat die wil van God doen, bly tot in ewigheid\" (2:17).","bid":"Bely saam ons sondes en ontvang 1 Johannes 1:9 as 'n belofte. Dank Jesus dat Hy ons Voorspraak is. Bid 1 Johannes 2:14 oor die seuns in ons gesin – dat hulle sterk sal wees, die Woord in hulle sal bly, en hulle die Bose sal oorwin – en oor die dogter in ons gesin net so. Bid dat ons nie die wêreld se begeertes sal liefhê nie.","vraag":"1 Johannes 2:16 noem drie dinge in die wêreld: die begeerte van die vlees, die begeerte van die oë, en grootpratery oor die lewe. Hoe lyk elkeen vandag?","hoofstukke":[["1 Johannes","1JN",1],["1 Johannes","1JN",2]]},{"dag":389,"ref":"1 Johannes 3 – 5","titel":"God is Liefde – en Ons Weet dat Ons die Lewe Het","fase":7,"tydlyn":"c. 85–95 n.C.","agtergrond":"Johannes gebruik eenvoudige woorde (lig, liefde, waarheid, lewe, weet, bly) maar met groot diepte. Hy gee \"toetse\" waaraan ons kan weet dat ons God ken: of ons Sy gebooie gehoorsaam, of ons mekaar liefhet, en of ons glo dat Jesus die Christus is wat in die vlees gekom het. 4:8 en 4:16 bevat die kortste definisie van God in die Bybel: \"God is liefde.\" Hy sluit af met die sekerheid van die ewige lewe.","leer":"Ons is nou al kinders van God, en wanneer Jesus verskyn, sal ons soos Hy wees. Liefde word nie net in woorde gesien nie, maar in dade en waarheid – soos Jesus Sy lewe vir ons gegee het. Ons moet die geeste toets. God is liefde, en Hy het ons eerste liefgehad. Volmaakte liefde dryf vrees uit. Wie die Seun het, het die lewe – en ons kan wéét dat ons die ewige lewe het.","skrif":"\"Kyk watter groot liefde die Vader aan ons bewys het, dat ons kinders van God genoem kan word\" (3:1). \"Wanneer Hy verskyn, sal ons aan Hom gelyk wees\" (3:2). \"Hieraan het ons die liefde leer ken, dat Hy sy lewe vir ons afgelê het; ons behoort ook vir die broeders die lewe af te lê\" (3:16). \"Laat ons nie liefhê met die woord of met die tong nie, maar met die daad en in waarheid\" (3:18). \"Beproef die geeste of hulle uit God is\" (4:1). \"Hy wat in julle is, is groter as hy wat in die wêreld is\" (4:4). \"Hy wat nie liefhet nie, het God nie geken nie, want God is liefde\" (4:8). \"Hierin is die liefde: nie dat ons God liefgehad het nie, maar dat Hy ons liefgehad het en sy Seun gestuur het as 'n versoening vir ons sondes\" (4:10). \"Daar is geen vrees in die liefde nie, maar die volmaakte liefde dryf die vrees buite\" (4:18). \"Ons het Hom lief, omdat Hy ons eerste liefgehad het\" (4:19). \"As iemand sê: Ek het God lief – en hy haat sy broeder, dan is hy 'n leuenaar\" (4:20). \"Dit is die oorwinning wat die wêreld oorwin het, naamlik ons geloof\" (5:4). \"Hy wat die Seun het, het die lewe\" (5:12). \"Hierdie dinge het ek aan julle geskrywe... sodat julle kan weet dat julle die ewige lewe het\" (5:13). \"Kindertjies, pas op vir die afgode\" (5:21).","bid":"Dank God dat ons Sy kinders genoem word (3:1). Bid dat ons liefde nie net in woorde nie, maar in dade gesien sal word – kies een daad van liefde vir môre. Bid vir mense wat bang is, dat God se liefde die vrees sal uitdryf. Dank God vir die sekerheid van die ewige lewe (5:13).","vraag":"Johannes sê ons kan \"weet\" dat ons die ewige lewe het (5:13). Hoe weet 'n mens dit – op grond van gevoelens, of van iets anders?","hoofstukke":[["1 Johannes","1JN",3],["1 Johannes","1JN",4],["1 Johannes","1JN",5]]},{"dag":390,"ref":"2 Johannes 1; 3 Johannes 1","titel":"Waarheid en Liefde – en Gasvryheid","fase":7,"tydlyn":"c. 85–95 n.C. Twee kort persoonlike briewe van \"die ouderling\" (Johannes).","agtergrond":"In die vroeë kerk het reisende leraars en sendelinge van stad tot stad gegaan en op die gasvryheid van gelowiges staatgemaak. Dit het 'n probleem geskep: hoe weet jy of 'n reisende leraar die waarheid verkondig? 2 Johannes is aan \"die uitverkore vrou en haar kinders\" gerig – waarskynlik 'n gemeente – en waarsku hulle om nie valse leraars, wat ontken dat Jesus in die vlees gekom het, te ontvang en te ondersteun nie. 3 Johannes is 'n persoonlike brief aan Gajus, wat getroue sendelinge gasvry ontvang het, en waarsku teen Diotrefes, 'n leier wat \"graag die eerste wil wees\" en die apostel se boodskappers weggewys het.","leer":"Waarheid en liefde gaan altyd saam – liefde sonder waarheid word onkritiese aanvaarding, waarheid sonder liefde word hardheid. Ons moet in die waarheid wandel en mekaar liefhê. Ons moet nie dwalinge ondersteun nie. Gasvryheid en ondersteuning vir getroue sendelinge maak ons medewerkers vir die waarheid. Trotse, beheersugtige leierskap skaad die kerk. Ons moet nie die kwaad navolg nie, maar die goeie.","skrif":"2 Johannes: \"Die waarheid wat in ons bly en met ons sal wees tot in ewigheid\" (1:2). \"Ek was baie bly dat ek sommige van jou kinders gevind het wat in die waarheid wandel\" (1:4). \"Dat ons mekaar moet liefhê\" (1:5). \"En dit is die liefde, dat ons wandel volgens sy gebooie\" (1:6). Pas op vir die misleiers wat nie bely dat Jesus Christus in die vlees gekom het nie (1:7). 3 Johannes: \"Ek het geen groter blydskap as om te hoor dat my kinders in die waarheid wandel nie\" (1:4). Gajus se gasvryheid (1:5–8). \"Sodat ons medewerkers van die waarheid kan word\" (1:8). Diotrefes \"wat graag die eerste onder hulle wil wees\" (1:9). \"Geliefde, moenie die kwaad navolg nie, maar die goeie\" (1:11).","bid":"Pappa: bid 3 Johannes 1:4 oor jou kinders – \"ek het geen groter blydskap as om te hoor dat my kinders in die waarheid wandel nie.\" Bid dat ons waarheid en liefde altyd bymekaar sal hou. Bid vir sendelinge, en hoe ons gesin hulle kan ondersteun. Bid vir nederige leiers.","vraag":"Johannes sê sy grootste vreugde is dat sy \"kinders in die waarheid wandel\". Wat beteken dit om \"in die waarheid te wandel\"?","hoofstukke":[["2 Johannes","2JN",1],["3 Johannes","3JN",1]]},{"dag":391,"ref":"Openbaring 1","titel":"Die Openbaring van Jesus Christus","fase":7,"tydlyn":"c. 95 n.C., tydens die regering van keiser Domitianus (sommige dateer dit c. 68–69 n.C., onder of kort ná Nero). Die eiland Patmos in die Egeïese See, waarheen Johannes verban is \"ter wille van die woord van God en die getuienis van Jesus Christus\" (1:9).","agtergrond":"\"Openbaring\" (Grieks apokalupsis – \"ontsluiering\") is 'n boek vol simbole: getalle (7 = volheid of volkomenheid, 12 = God se volk, 1 000 = 'n groot, volledige hoeveelheid), kleure, diere en beelde, baie daarvan uit die Ou Testament (veral Daniël, Esegiël, Jesaja en Sagaria). Dit is 'n brief aan sewe werklike gemeentes in die provinsie Asië wat met vervolging (veral die eis om die keiser as god te aanbid), valse lering en gemaksug geworstel het. Christene verstaan Openbaring op verskillende maniere: as gebeure in die eerste eeu, as 'n oorsig oor die kerkgeskiedenis, as hoofsaaklik eindtydgebeure, of as tydlose beelde van die stryd tussen God en die kwaad. Die gids fokus op die boodskap waaroor almal saamstem: Jesus het oorwin, Hy regeer, Hy kom weer, en Sy volk moet getrou bly.","leer":"Openbaring is in die eerste plek 'n openbaring van Jesus Christus – nie 'n kode van die eindtyd nie. Jesus is die getroue Getuie, die Eersgeborene uit die dode en die Heerser oor die konings van die aarde. Hy het ons lief en het ons deur Sy bloed van ons sondes verlos. Hy is die Alfa en die Omega, die Begin en die Einde. Hy staan tussen Sy kerke. Wanneer ons Hom sien, hoef ons nie te vrees nie, want Hy het die sleutels van die dood.","skrif":"\"Die openbaring van Jesus Christus\" (1:1). \"Salig is hy wat lees en hulle wat hoor die woorde van die profesie en wat bewaar wat daarin geskrywe is\" (1:3). \"Aan Hom wat ons liefhet en ons van ons sondes gewas het in sy bloed\" (1:5). \"Kyk, Hy kom met die wolke, en elke oog sal Hom sien, ook hulle wat Hom deursteek het\" (1:7; Daniël 7:13; Sagaria 12:10). \"Ek is die Alfa en die Omega, die begin en die einde... wat is en wat was en wat kom, die Almagtige\" (1:8). Johannes, \"julle broeder en medegenoot in die verdrukking en in die koninkryk en in die lydsaamheid van Jesus Christus\" (1:9). Die visioen van die verheerlikte Christus tussen die sewe goue kandelare (1:12–16). \"Toe ek Hom sien, het ek voor sy voete neergeval soos 'n dooie\" (1:17). \"Moenie vrees nie; Ek is die eerste en die laaste, en die lewende; en Ek was dood, en kyk, Ek leef tot in alle ewigheid... en Ek het die sleutels van die doderyk en van die dood\" (1:17–18).","bid":"Aanbid Jesus as die Alfa en die Omega – die Begin en die Einde van die Bybel wat ons gelees het, en van ons lewens. Dank Hom dat Hy ons liefhet en ons van ons sondes gewas het. Bid vir Christene wat, soos Johannes, vir hulle geloof verban of vervolg word. Dank Jesus dat Hy die sleutels van die dood het – ons hoef nie te vrees nie.","vraag":"Openbaring 1:17 sê Jesus het Sy hand op Johannes gelê en gesê \"Moenie vrees nie\". Waarom kan ons, wat Jesus ken, sonder vrees na die toekoms kyk?","hoofstukke":[["Openbaring","REV",1]]},{"dag":392,"ref":"Openbaring 2 – 3","titel":"Briewe aan Sewe Gemeentes","fase":7,"tydlyn":"c. 95 n.C. Sewe werklike stede in die provinsie Asië (westelike Turkye): Efese, Smirna, Pergamum, Tiatira, Sardis, Filadelfia en Laodicea – in die volgorde waarin 'n boodskapper op 'n sirkelroete sou reis.","agtergrond":"Elke brief pas by die stad se agtergrond. Efese het sy \"eerste liefde\" verloor. Smirna was ryk maar die gemeente arm en vervolg. Pergamum het 'n groot altaar vir Zeus en 'n sentrum van keiseraanbidding gehad (\"waar die troon van die Satan is\"). Sardis was bekend vir sy rykdom en sy vesting wat twee keer verower is omdat die wagte nie waaksaam was nie (\"word wakker\"). Laodicea was 'n ryk bankstad, bekend vir sy klerebedryf en 'n oogsalf, maar het sy water via 'n akwaduk van ver gekry, wat louwarm aangekom het – anders as die warm bronne van Hiërapolis (vir genesing) en die koue water van Kolosse (om te drink). Daarom: \"omdat jy lou is... sal Ek jou uit my mond uitspuug\".","leer":"Jesus ken Sy kerke – hulle goeie werke, hulle swaarkry en hulle sonde. Hy prys getrouheid en roep tot bekering. Ons kan baie goed doen en tog ons eerste liefde vir Jesus verloor. Ons moet getrou wees tot die dood. Gemaksug en geestelike louheid is gevaarlik, al lyk dit of dit goed gaan. Jesus staan by die deur en klop, en nooi ons tot gemeenskap. Aan elkeen wat oorwin, gee Hy groot beloftes.","skrif":"Efese: \"Ek ken jou werke... Maar Ek het teen jou dat jy jou eerste liefde verlaat het\" (2:2–4). Smirna: \"Ek ken jou... armoede – maar jy is ryk\" (2:9). \"Wees getrou tot die dood, en Ek sal jou die kroon van die lewe gee\" (2:10). Pergamum: \"Jy het my Naam vasgehou\" (2:13). Tiatira (2:18–29). Sardis: \"Jy het die naam dat jy lewe, en jy is dood. Word wakker\" (3:1–2). Filadelfia: \"Kyk, Ek het voor jou 'n geopende deur gegee wat niemand kan sluit nie... want jy het min krag, en jy het my woord bewaar\" (3:8). Laodicea: \"Omdat jy lou is en nie koud of warm nie, sal Ek jou uit my mond uitspuug. Omdat jy sê: Ek is ryk en het verryk geword en het niks nodig nie – en jy weet nie dat jy ellendig en beklaenswaardig en arm en blind en naak is nie\" (3:16–17). \"Almal wat Ek liefhet, bestraf en tugtig Ek\" (3:19). \"Kyk, Ek staan by die deur en Ek klop. As iemand my stem hoor en die deur oopmaak, sal Ek by hom inkom en maaltyd hou met hom en hy met My\" (3:20). \"Wie 'n oor het, laat hy hoor wat die Gees vir die gemeentes sê\" (herhaal in elke brief).","bid":"Vra Jesus om ons te wys of ons, soos Efese, ons \"eerste liefde\" vir Hom verloor het. Bid teen geestelike louheid en gemaksug – ook in ons gemaklike lewe. Bid vir Christene wat, soos Smirna, arm en vervolg is. Maak in gebed die \"deur\" van elkeen se hart oop vir Jesus (3:20).","vraag":"As Jesus vandag 'n brief aan ons gesin sou skryf, soos aan die sewe gemeentes, wat dink jy sou Hy prys, en waaroor sou Hy ons roep om te verander?","hoofstukke":[["Openbaring","REV",2],["Openbaring","REV",3]]},{"dag":393,"ref":"Openbaring 4 – 5","titel":"Die Troon en die Lam","fase":7,"tydlyn":"Die hemelse visioen begin. Tydloos – 'n blik agter die skerms van die geskiedenis.","agtergrond":"Ná die briewe word Johannes deur 'n \"deur in die hemel\" na God se troonkamer geneem. Die beelde kom uit Jesaja 6 en Esegiël 1: die troon, die reënboog, die vier lewende wesens wat \"heilig, heilig, heilig\" roep, die 24 ouderlinge (moontlik die volk van God van die Ou en Nuwe Testament – 12 stamme plus 12 apostels). Die boekrol met sewe seëls bevat God se plan vir die geskiedenis. Niemand is waardig om dit oop te maak nie – totdat die Leeu uit die stam van Juda verskyn... en Johannes kyk en sien 'n Lam wat geslag is. Hierdie twee hoofstukke is die sleutel tot die hele boek: wat ook al op aarde gebeur, God sit op die troon, en die Lam het oorwin.","leer":"Die hele heelal draai om God se troon, en die regte reaksie op Hom is aanbidding. Jesus is die Leeu (die oorwinnende Koning uit Dawid se lyn, Genesis 49:9–10) wat oorwin het as 'n Lam wat geslag is – Sy oorwinning het deur die kruis gekom. Deur Sy bloed het Hy mense uit elke stam, taal, volk en nasie vir God gekoop. Hy alleen hou die geskiedenis in Sy hand.","skrif":"\"Kyk, daar was 'n deur oop in die hemel\" (4:1). \"Daar het 'n troon in die hemel gestaan, en op die troon was Een wat sit\" (4:2). \"Heilig, heilig, heilig is die Here God, die Almagtige, wat was en wat is en wat kom\" (4:8). Die ouderlinge werp hulle krone voor die troon: \"U is waardig, o Here, om die heerlikheid en die eer en die krag te ontvang, want U het alle dinge geskep\" (4:10–11). \"Wie is waardig om die boek oop te maak?\" (5:2). Johannes huil, want niemand is waardig nie (5:4). \"Moenie ween nie; kyk, die Leeu wat uit die stam van Juda is, die Wortel van Dawid, het oorwin\" (5:5). \"En ek het gesien... 'n Lam wat staan soos geslag\" (5:6). \"U is waardig... want U is geslag en het ons vir God met u bloed gekoop uit elke stam en taal en volk en nasie\" (5:9). \"Die Lam wat geslag is, is waardig om te ontvang die krag en rykdom en wysheid en sterkte en eer en heerlikheid en lof\" (5:12). Die hele skepping aanbid (5:13).","bid":"Aanbid God op Sy troon saam met die hemelse koor: \"Heilig, heilig, heilig.\" Dank Jesus, die Lam wat geslag is, dat Hy ons met Sy bloed gekoop het. Bid vir mense uit elke stam, taal en nasie wat nog nie die Lam ken nie – ook in Afrika. Dank God dat die geskiedenis in die hande van die Lam is.","vraag":"Johannes het gehoor van 'n Leeu, maar toe hy kyk, sien hy 'n Lam wat geslag is. Wat sê dit oor hoe Jesus oorwin het?","hoofstukke":[["Openbaring","REV",4],["Openbaring","REV",5]]},{"dag":394,"ref":"Openbaring 6 – 7","titel":"Die Seëls – en 'n Groot Skare uit Alle Nasies","fase":7,"tydlyn":"Die visioen van die seëls. Die beelde beskryf oordele wat deur die geskiedenis plaasvind en op die einde uitloop.","agtergrond":"Die Lam breek die seëls een vir een. Die eerste vier seëls is die bekende \"vier ruiters\" (oorlog/verowering, geweld, hongersnood en dood) – dit beeld die soort lyding uit wat deur die hele geskiedenis voorkom (vgl. Jesus se woorde in Markus 13:7–8). Die vyfde seël wys die siele van die martelare wat vra: \"Hoe lank?\" Die sesde seël beskryf die einde. Dan kom 'n \"onderbreking\" (hoofstuk 7): God verseël Sy dienaars (die 144 000 – 12 x 12 x 1 000, 'n beeld van die volledige volk van God) en Johannes sien 'n groot skare wat niemand kan tel nie, uit elke nasie, voor die troon.","leer":"Oorlog, hongersnood en dood is nie buite God se beheer nie – die Lam breek die seëls. God hoor die gebede van Sy vervolgde volk en sal reg laat geskied. Niemand kan bestaan in die dag van God se toorn nie, behalwe dié wat Hy verseël het. God beskerm Sy volk in die verdrukking. Aan die einde sal 'n ontelbare skare uit alle nasies God aanbid, en God sal elke traan van hulle oë afvee.","skrif":"Die vier ruiters (6:1–8). Die martelare onder die altaar: \"Hoe lank, o heilige en waaragtige Heerser?\" (6:9–10). Die sesde seël: \"Die groot dag van sy toorn het gekom, en wie kan bestaan?\" (6:17). God verseël Sy diensknegte (7:3–4). \"Na hierdie dinge het ek gesien, en kyk, 'n groot menigte wat niemand kon tel nie, uit alle nasies en stamme en volke en tale, het gestaan voor die troon en voor die Lam\" (7:9). \"Die saligheid behoort aan onse God wat op die troon sit, en aan die Lam!\" (7:10). \"Dit is hulle wat uit die groot verdrukking kom, en hulle het hul klere gewas en hul klere wit gemaak in die bloed van die Lam\" (7:14). \"Hulle sal nie meer honger of dors hê nie... want die Lam... sal hulle lei na fonteine van die water van die lewe; en God sal alle trane van hulle oë afvee\" (7:16–17).","bid":"Bid vir mense wat oorlog, hongersnood en siekte beleef. Bid vir die vervolgde kerk, wie se gebede \"Hoe lank?\" God hoor. Dank God vir die visioen van 'n ontelbare skare uit alle nasies – en bid dat ons gesin daar sal wees, saam met mense uit elke taal.","vraag":"Johannes sien 'n skare \"wat niemand kon tel nie, uit alle nasies en tale\". Hoe voel dit om te weet die hemel sal so divers wees?","hoofstukke":[["Openbaring","REV",6],["Openbaring","REV",7]]},{"dag":395,"ref":"Openbaring 8 – 9","titel":"Die Basuine: Waarskuwings om tot Bekering te Kom","fase":7,"tydlyn":"Die visioen van die basuine.","agtergrond":"Ná 'n halfuur se stilte in die hemel (8:1) word die gebede van die heiliges soos reukwerk voor God gebring – en dan begin die sewe basuine. Die oordele van die basuine herinner sterk aan die tien plae van Egipte (hael en vuur, water wat bloed word, duisternis, sprinkane). Die oordele is gedeeltelik (\"'n derde\") – dit is nog nie die finale oordeel nie, maar waarskuwings. Die beelde in hoofstuk 9 (sprinkane soos perde met mensegesigte, 'n leër van 200 miljoen) is simbolies vir demoniese en vernietigende magte; die bedoeling is nie om elke detail met moderne wapens te probeer verbind nie. Die tragiese hoogtepunt is 9:20–21: ondanks alles het die mense hulle nie bekeer nie.","leer":"Die gebede van God se volk is kosbaar vir God en maak 'n verskil in die geskiedenis. God stuur waarskuwings in die geskiedenis om mense tot bekering te roep – soos met Farao in Egipte. Die bose magte is werklik en vernietigend, maar hulle het grense wat God stel (9:4–5). Die mens se hart kan so verhard word dat selfs groot rampe nie tot bekering lei nie.","skrif":"\"Daar het 'n stilte in die hemel gekom omtrent 'n halfuur lank\" (8:1). \"Die rook van die reukwerk het saam met die gebede van die heiliges opgegaan uit die hand van die engel voor God\" (8:4). Die eerste vier basuine: hael en vuur, die see word bloed, 'n ster genaamd Alsem, duisternis (8:7–12). Die sprinkane uit die put van die afgrond, wat net die mense mag skaad wat nie die seël van God het nie (9:1–4). \"Die ander mense... het hulle nie bekeer van die werke van hulle hande, om nie die duiwels en die afgode... te aanbid nie; en hulle het hul nie bekeer van hul moorde en hul towerye en hul hoerery en hul diewery nie\" (9:20–21).","bid":"Dank God dat ons gebede soos reukwerk voor Hom kom en 'n verskil maak. Bid vir mense wat deur rampe of krisisse gaan, dat dit hulle na God sal draai, nie van Hom weg nie. Bid dat ons harte nooit so hard sal word dat ons nie op God se waarskuwings reageer nie.","vraag":"Ondanks al die waarskuwings het die mense hulle nie bekeer nie (9:20–21). Waarom dink jy hou mense vas aan hulle sonde, selfs wanneer dit hulle skade doen?","hoofstukke":[["Openbaring","REV",8],["Openbaring","REV",9]]},{"dag":396,"ref":"Openbaring 10 – 11","titel":"Die Klein Boekie en die Twee Getuies","fase":7,"tydlyn":"'n Tweede \"onderbreking\" voor die sewende basuin.","agtergrond":"Soos Esegiël (Esegiël 3) moet Johannes 'n boekrol eet: dit is soet in die mond (God se woord is goed) maar bitter in die maag (die boodskap van oordeel en vervolging is swaar). Die twee getuies in hoofstuk 11 doen wonders soos Moses en Elia; baie uitleggers sien hulle as 'n beeld van die getuienis van die kerk in die wêreld. Hulle word deur die \"dier\" doodgemaak en die wêreld vier fees – maar ná drie en 'n half dae (vgl. Jesus se drie dae) staan hulle op en vaar op na die hemel. Die tydperk van \"42 maande\" of \"1 260 dae\" (3½ jaar, die helfte van 7) is 'n beeld van 'n beperkte tydperk van vervolging (vgl. Daniël 7:25). Die sewende basuin kondig die koms van God se koninkryk aan.","leer":"God se Woord is soet, maar om dit te verkondig, kan pynlik wees. Die kerk se taak is om getuie te wees, selfs wanneer dit lewensgevaarlik is. Die wêreld kan die getuies stilmaak, maar nie vir altyd nie – die opstanding volg die dood. Die tyd van vervolging is beperk. Uiteindelik word die koninkryk van die wêreld die koninkryk van onse Here en van Sy Christus.","skrif":"\"Daar sal geen uitstel meer wees nie\" (10:6). \"Neem dit en eet dit op; en dit sal jou maag bitter maak, maar in jou mond sal dit soet wees soos heuning\" (10:9). \"Jy moet weer profeteer\" (10:11). Die twee getuies (11:3–6). Die dier maak hulle dood, en die inwoners van die aarde is bly (11:7–10). \"Ná die drie en 'n half dae het 'n gees van die lewe uit God in hulle gekom\" (11:11). Die sewende basuin: \"Die koninkryke van die wêreld het geword die koninkryke van onse Here en van sy Christus, en Hy sal as koning heers tot in alle ewigheid\" (11:15).","bid":"Dank God dat Sy Woord soet is, en bid vir krag wanneer dit moeilik is om dit te volg of te deel. Bid vir die getuienis van die kerk in plekke waar dit gevaarlik is. Verklaar saam Openbaring 11:15: Jesus sal as Koning heers tot in ewigheid.","vraag":"Die boekie was soet in die mond maar bitter in die maag. Wanneer is God se Woord vir jou \"soet\", en wanneer \"bitter\"?","hoofstukke":[["Openbaring","REV",10],["Openbaring","REV",11]]},{"dag":397,"ref":"Openbaring 12 – 13","titel":"Die Draak, die Vrou en die Twee Diere","fase":7,"tydlyn":"'n Visioen wat die geestelike stryd agter die geskiedenis openbaar – van Jesus se geboorte tot die eindtyd.","agtergrond":"Hoofstuk 12 vertel die hele storie van die Bybel in simbole: 'n vrou (God se volk, uit wie die Messias gebore word – vgl. Genesis 3:15 en die twaalf sterre van Jakob se seuns in Genesis 37:9) baar 'n Seun wat al die nasies sal regeer; die draak (Satan, \"die ou slang\", 12:9) probeer die kind verslind, maar die kind word na God se troon weggeruk. Satan word uit die hemel gewerp en vervolg die vrou en haar ander kinders (die kerk). In hoofstuk 13 gee die draak sy mag aan 'n dier uit die see ('n politieke mag wat aanbidding eis – vir Johannes se lesers was dit veral Rome se keiseraanbidding) en 'n dier uit die aarde ('n \"valse profeet\" wat mense mislei om die eerste dier te aanbid). Die getal 666 (13:18) word op baie maniere verklaar; die mees algemene verklaring is dat die Hebreeuse letters van \"Keiser Nero\" by 666 optel. 666 is ook \"kort\" van 7 (volmaaktheid) op elke vlak.","leer":"Agter die vervolging van die kerk sit 'n geestelike stryd met Satan, wat reeds deur Jesus se kruis en opstanding verslaan is. Ons oorwin hom deur die bloed van die Lam, deur ons getuienis, en deur nie aan ons lewe vas te hou nie. Satan werk deur politieke magte wat totale lojaliteit eis, en deur valse godsdiens en propaganda wat mense mislei. God se volk moet volhard, geloof hou en weier om enigiets anders as God te aanbid.","skrif":"Die vrou met die son, maan en twaalf sterre (12:1). Die groot rooi draak (12:3). \"Sy het 'n seun gebaar... wat al die nasies met 'n ystersepter sal regeer\" (12:5). \"Die groot draak, die ou slang, wat duiwel en Satan genoem word, wat die hele wêreld mislei, is op die aarde neergewerp\" (12:9). \"En hulle het hom oorwin deur die bloed van die Lam en deur die woord van hulle getuienis, en hulle het hul lewe nie liefgehad tot die dood toe nie\" (12:11). \"Die duiwel het na julle neergedaal met groot woede, omdat hy weet dat hy min tyd het\" (12:12). Die dier uit die see (13:1–10). \"Hier is die lydsaamheid en die geloof van die heiliges\" (13:10). Die dier uit die aarde en die merk (13:11–17). Die getal 666 (13:18).","bid":"Dank Jesus dat Hy Satan reeds by die kruis oorwin het. Bid dat ons, soos die gelowiges in 12:11, sal oorwin deur die bloed van die Lam en ons getuienis. Bid vir onderskeiding teen magte en stemme wat ons totale lojaliteit eis. Bid vir Christene onder regerings wat geloof onderdruk.","vraag":"Openbaring 12:11 noem drie maniere waarop die gelowiges die draak oorwin. Wat is hulle, en hoe kan ons dit vandag doen?","hoofstukke":[["Openbaring","REV",12],["Openbaring","REV",13]]},{"dag":398,"ref":"Openbaring 14 – 16","titel":"Die Lam op Sion, die Oes, en die Skale van God se Toorn","fase":7,"tydlyn":"Visioene van die einde.","agtergrond":"Hoofstuk 14 kontrasteer die volgelinge van die Lam (op die berg Sion, met Sy Naam op hulle voorhoofde) met dié wat die merk van die dier dra. Engele verkondig die ewige evangelie aan alle nasies, die val van Babilon (die beeld van die wêreld se trotse stelsel teen God), en die finale oordeel as 'n oes. Hoofstuk 15 wys die oorwinnaars wat \"die lied van Moses en die lied van die Lam\" sing – Moses het gesing ná die uittog deur die Rietsee (Exodus 15), en nou sing God se volk ná die finale verlossing. Hoofstuk 16 beskryf die sewe skale van God se too

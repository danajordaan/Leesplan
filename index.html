rn – die finale, volle oordele, weer met eggo's van die plae van Egipte. Harmagedon (16:16) beteken waarskynlik \"berg van Megiddo\" – 'n plek van beroemde veldslae in Israel se geskiedenis (vgl. Rigters 5:19; 2 Konings 23:29), hier 'n beeld van die finale stryd.","leer":"Die evangelie word tot die einde aan alle nasies verkondig. Daar is uiteindelik net twee groepe mense: dié wat aan die Lam behoort, en dié wat aan die dier behoort. God se oordeel is regverdig en waaragtig – Hy straf die kwaad volkome. Die verloste volk sing die lied van verlossing, soos by die Rietsee. God se oordeel lei nie outomaties tot bekering nie; ons moet nou kies.","skrif":"Die Lam op die berg Sion met die 144 000 wat \"die Lam volg waar Hy ook al heengaan\" (14:1–4). \"'n Engel... wat die ewige evangelie gehad het om te verkondig aan... elke nasie en stam en taal en volk\" (14:6). \"Vrees God en gee Hom eer, want die uur van sy oordeel het gekom; en aanbid Hom wat die hemel en die aarde... gemaak het\" (14:7). \"Gevalle, gevalle is Babilon, die groot stad\" (14:8). \"Hier is die lydsaamheid van die heiliges, hier is hulle wat die gebooie van God en die geloof van Jesus bewaar\" (14:12). \"Salig is die dode wat van nou af in die Here sterwe... sodat hulle kan rus van hul arbeid; en hulle werke volg met hulle\" (14:13). Die lied van Moses en van die Lam: \"Groot en wonderbaar is u werke, Here God, Almagtige! Regverdig en waaragtig is u weë, o Koning van die nasies!\" (15:3). Die sewe skale (16:1–21). \"Regverdig is U, o Here... omdat U so geoordeel het\" (16:5). \"Hulle het hul nie bekeer om Hom eer te gee nie\" (16:9). Harmagedon (16:16).","bid":"Bid dat ons sal behoort aan dié wat \"die Lam volg waar Hy ook al heengaan\" (14:4). Dank God vir die troos van 14:13 vir dié wat in die Here sterf. Bid vir die verkondiging van die evangelie aan elke nasie. Sing of sê saam die lied van Moses en die Lam (15:3–4).","vraag":"Die gelowiges in hoofstuk 14 \"volg die Lam waar Hy ook al heengaan\". Waarheen sou dit vir jou moeilik wees om Hom te volg?","hoofstukke":[["Openbaring","REV",14],["Openbaring","REV",15],["Openbaring","REV",16]]},{"dag":399,"ref":"Openbaring 17 – 18","titel":"Die Val van Babilon","fase":7,"tydlyn":"Visioene van die einde.","agtergrond":"\"Babilon\" was vir Johannes se lesers 'n kodenaam vir Rome (vgl. 1 Petrus 5:13): die stad op sewe heuwels (17:9), ryk, magtig, sedeloos, vol afgodery, en \"dronk van die bloed van die heiliges\". Maar Babilon is ook 'n tydlose beeld van elke menslike stelsel – polities, ekonomies of kultureel – wat in trots teen God staan en mense verlei met rykdom, luukse en mag. Hoofstuk 18 is 'n klaaglied in die styl van die Ou Testamentiese profete (vgl. Jesaja 47; Jeremia 50–51; Esegiël 27): die konings, handelaars en seevaarders huil oor die val van die stad – nie oor haar sonde nie, maar oor die verlies van hulle wins. Die lys handelsware eindig met \"liggame en siele van mense\" (18:13) – slawe.","leer":"Die wêreld se stelsel van rykdom, mag, plesier en afgodery lyk aantreklik en permanent, maar dit sal skielik val. God roep Sy volk om nie aan haar sondes deel te neem nie – om \"uit te gaan uit haar\". Ekonomiese uitbuiting, ook van mense, is sonde voor God. Die Lam sal oorwin, want Hy is Here van die here en Koning van die konings.","skrif":"Die vrou op die dier – \"Babilon die grote, die moeder van die hoere en van die gruwels van die aarde\" (17:5). \"Dronk van die bloed van die heiliges en van die bloed van die getuies van Jesus\" (17:6). \"Hulle sal oorlog voer teen die Lam, en die Lam sal hulle oorwin, want Hy is die Here van die here en die Koning van die konings\" (17:14). \"Gevalle, gevalle is Babilon die grote\" (18:2). \"Gaan uit haar uit, my volk, sodat julle aan haar sondes nie deel kry nie\" (18:4). \"Ek sit as koningin... en sal nooit rou sien nie\" (18:7). \"In een uur het jou oordeel gekom\" (18:10). Die handelaars ween oor hulle verlore wins (18:11–19). Die handelsware, insluitend \"liggame en siele van mense\" (18:13). 'n Groot meulsteen word in die see gegooi (18:21; vgl. Jeremia 51:63).","bid":"Bid dat ons nie deur die \"Babilon\" van ons tyd – materialisme, trots, plesier, mag – verlei sal word nie. Bid vir slagoffers van mensehandel en uitbuiting. Dank God dat Jesus die Koning van die konings is, en dat geen trotse stelsel vir ewig sal staan nie.","vraag":"Die handelaars het oor Babilon gehuil omdat hulle geld verloor het, nie oor haar sonde nie. Wat sê dit oor hoe die wêreld dink?","hoofstukke":[["Openbaring","REV",17],["Openbaring","REV",18]]},{"dag":400,"ref":"Openbaring 19 – 20","titel":"Die Bruilof van die Lam, die Ruiter op die Wit Perd en die Laaste Oordeel","fase":7,"tydlyn":"Visioene van die einde: die wederkoms van Christus en die finale oordeel.","agtergrond":"Die hemel juig oor die val van Babilon met \"Halleluja!\" – die enigste plek in die Nuwe Testament waar die woord voorkom. Dan kom die bruilofsmaal van die Lam: die kerk as die Bruid van Christus (vgl. Hosea 2; Efesiërs 5:25–32). Jesus verskyn as die Ruiter op die wit perd, \"Getrou en Waaragtig\", met die Naam \"Die Woord van God\" en \"Koning van die konings en Here van die here\". Hoofstuk 20 noem die \"duisend jaar\" – oor die betekenis hiervan verskil Christene al eeue lank (of dit 'n letterlike toekomstige tydperk is, of 'n simbool van die tyd tussen Jesus se eerste en tweede koms, of van Christus se heerskappy saam met die heiliges). Almal stem saam oor die kern: Satan word finaal oorwin en in die poel van vuur gewerp, en daar is 'n finale oordeel voor die groot wit troon.","leer":"God se volk sal saam met Christus by Sy bruilofsmaal wees – dit is die vreugdevolle doel van die geskiedenis. Jesus kom weer as Koning en Regter, getrou en waaragtig. Die bose – Satan, die dier en die valse profeet – sal finaal en volkome vernietig word. Elke mens sal voor God staan en geoordeel word. Wie se naam in die boek van die lewe opgeskryf is, is veilig. Dit is ernstig – en dit is die rede waarom ons die evangelie vertel.","skrif":"\"Halleluja! Die saligheid en die heerlikheid en die eer en die krag behoort aan die Here onse God\" (19:1). \"Laat ons bly wees en jubel... want die bruilof van die Lam het gekom, en sy vrou het haar gereed gemaak\" (19:7). \"Salig is hulle wat geroep is na die bruilofsmaal van die Lam\" (19:9). \"Die getuienis van Jesus is die gees van die profesie\" (19:10). \"Ek het die hemel geopend gesien, en daar was 'n wit perd; en Hy wat daarop sit, word genoem Getrou en Waaragtig\" (19:11). \"Sy Naam word genoem: Die Woord van God\" (19:13). \"Koning van die konings en Here van die here\" (19:16). Die dier en die valse profeet word in die poel van vuur gewerp (19:20). Satan gebind (20:1–3). Die duisend jaar (20:4–6). Satan word in die poel van vuur gewerp (20:10). Die groot wit troon: \"Ek het die dode gesien, klein en groot, staan voor God, en boeke is geopen... en die dode is geoordeel uit wat in die boeke geskrywe was, volgens hulle werke\" (20:12). \"En as iemand nie gevind is in die boek van die lewe opgeskryf nie, is hy in die poel van vuur gewerp\" (20:15).","bid":"Dank Jesus dat Hy weer kom as Koning van die konings – \"Getrou en Waaragtig\". Dank Hom dat ons, deur Sy genade, na Sy bruilofsmaal genooi is. Bid dat elkeen van ons se name in die boek van die lewe opgeskryf sal wees. Bid ernstig vir familie en vriende wat Jesus nog nie ken nie.","vraag":"Openbaring 19:7 sê die Bruid (die kerk) het haar \"gereed gemaak\". Hoe maak 'n mens hom of haar gereed vir Jesus se koms?","hoofstukke":[["Openbaring","REV",19],["Openbaring","REV",20]]},{"dag":401,"ref":"Openbaring 21 – 22","titel":"'n Nuwe Hemel en 'n Nuwe Aarde: \"Ek Kom Gou\"","fase":7,"tydlyn":"Die einde – en die nuwe begin. Die ewigheid.","agtergrond":"Die Bybel eindig waar dit begin het – maar beter. Genesis 1–3 begin met 'n tuin, die boom van die lewe, die rivier, God wat by die mens wandel, en die vloek van die sonde. Openbaring 21–22 eindig met 'n tuin-stad, die boom van die lewe, die rivier van die water van die lewe (vgl. Esegiël 47), God wat by Sy volk woon, en \"geen vloek meer nie\". Die nuwe Jerusalem is 'n kubus (21:16) – soos die Allerheiligste in die tempel – want nou is die hele stad die plek van God se volle teenwoordigheid. Daar is geen tempel nodig nie, want God en die Lam is die tempel. Die name van die twaalf stamme en die twaalf apostels is op die poorte en fondamente – die volk van God van die Ou en Nuwe Testament saam.","leer":"God gaan alles nuut maak. Hy sal by Sy volk woon, en elke traan afvee: geen dood, rou, gehuil of pyn meer nie. Ons sal Sy aangesig sien. Die vloek van die sondeval is opgehef. Die uitnodiging staan steeds oop: \"Kom! Wie dors het, laat hom kom.\" Jesus belowe: \"Ek kom gou.\" Die regte antwoord, aan die einde van ons reis deur die hele Bybel, is die laaste gebed van die Bybel: \"Amen, ja kom, Here Jesus!\"","skrif":"\"Ek het 'n nuwe hemel en 'n nuwe aarde gesien\" (21:1). \"Kyk, die tabernakel van God is by die mense, en Hy sal by hulle woon, en hulle sal sy volk wees, en God self sal by hulle wees as hulle God\" (21:3). \"En God sal al die trane van hulle oë afvee, en daar sal geen dood meer wees nie; ook geen rou of geween of moeite sal daar meer wees nie, want die eerste dinge het verbygegaan\" (21:4). \"Kyk, Ek maak alles nuut\" (21:5). \"Ek is die Alfa en die Omega... Aan hom wat dors het, sal Ek uit die fontein van die water van die lewe gee, verniet\" (21:6). Die stad met die name van die twaalf stamme en twaalf apostels (21:12–14). \"En ek het geen tempel daarin gesien nie, want die Here God, die Almagtige, en die Lam is sy tempel\" (21:22). \"Die Lam is sy lamp\" (21:23). Die rivier van die water van die lewe en die boom van die lewe, met blare \"vir die genesing van die nasies\" (22:1–2). \"En geen vervloeking sal daar meer wees nie\" (22:3). \"En hulle sal sy aangesig sien\" (22:4). \"Kyk, Ek kom gou\" (22:7, 12, 20). \"Ek is die Alfa en die Omega, die begin en die einde, die eerste en die laaste\" (22:13). \"Die Gees en die bruid sê: Kom! En laat hy wat hoor, sê: Kom! En laat hy wat dors het, kom; en laat hy wat wil, die water van die lewe neem, verniet\" (22:17). \"Amen, ja kom, Here Jesus! Die genade van onse Here Jesus Christus sy met julle almal. Amen\" (22:20–21).","bid":"Dank God vir die hele reis deur Sy Woord – van \"In die begin\" tot \"Ja kom, Here Jesus\". Laat elkeen een ding noem wat hy of sy die afgelope jaar oor Jesus geleer het, en dank God daarvoor. Bid vir elkeen van ons kinders: dat hulle hulle lewe lank Jesus sal volg, tot hulle Sy aangesig sien. Sluit af deur saam die laaste gebed van die Bybel te bid: \"Amen, ja kom, Here Jesus!\"","vraag":"Die Bybel begin in 'n tuin met die boom van die lewe en eindig in 'n stad met die boom van die lewe. Wat het tussenin gebeur, en wat het Jesus gedoen om die mens terug te bring?","hoofstukke":[["Openbaring","REV",21],["Openbaring","REV",22]]}]}]</script>

<script>
"use strict";
const PLANS = JSON.parse(document.getElementById('plans').textContent);
const ART = JSON.parse(document.getElementById('art').textContent);
const KEY = 'leesplan.v1';
const COLORS = ['#d9684e','#2f7f8a','#6b5bb5','#4f8a3c','#c4892a','#c2477d'];
const BIBLE = (code, ch) => `https://www.biblesa.co.za/bible/AFR53/${code}.${ch}`;
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
// SA numbers: 082 123 4567 -> 27821234567 (wa.me needs the international form, digits only)
const waNum = n => { let d = String(n||'').replace(/\D/g,''); if(d.startsWith('00')) d = d.slice(2); if(d.startsWith('0')) d = '27'+d.slice(1); return d.length >= 10 ? d : ''; };

/* ---------- state ---------- */
function blank(){ return { v:1, profiles:[], active:null, tab:'vandag', view:null, theme:'auto', ouers:{pappa:'',mamma:''} }; }
let S = load();
function load(){ try{ const t = localStorage.getItem(KEY); if(t){ const s = JSON.parse(t); return Object.assign(blank(), s); } }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const me = () => S.profiles.find(p => p.id === S.active) || null;
const plan = () => PLANS.find(p => p.id === (me()?.plan)) || PLANS[0];
function pdata(p = me()){ const pl = plan(); p.data = p.data || {}; p.data[pl.id] = p.data[pl.id] || { done:{}, journal:{}, seen:{} }; return p.data[pl.id]; }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = iso => { const [y,m,d] = iso.split('-').map(Number); return `${d} ${['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Des'][m-1]} ${y}`; };

/* ---------- helpers ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(k === 'html') el.innerHTML = v;  // only used for our own SVG art
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()){ if(c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function toast(msg){ const t = h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(), 2200); }
function currentDay(){ const d = pdata(); const days = plan().dae; const f = days.find(x => !d.done[x.dag]); return f ? f.dag : days[days.length-1].dag; }
function streak(){
  const d = pdata(); const dates = new Set(Object.values(d.done));
  let n = 0; const t = new Date();
  const key = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  if(!dates.has(key(t))) t.setDate(t.getDate()-1);
  while(dates.has(key(t))){ n++; t.setDate(t.getDate()-1); }
  return n;
}
function chaptersDone(){ const d = pdata(); return plan().dae.filter(x => d.done[x.dag]).reduce((a,x)=>a+x.hoofstukke.length,0); }
const totalCh = () => plan().dae.reduce((a,x)=>a+x.hoofstukke.length,0);
function artFor(day){
  if(ART[day.dag]) return ART[day.dag];
  return ART['fase'+day.fase] || ART.fallback;
}
function stars(){
  let s = ''; let seed = 7;
  for(let i=0;i<34;i++){ seed = (seed*9301+49297)%233280; const x = seed/233280*100; seed = (seed*9301+49297)%233280; const y = seed/233280*100; s += `<circle cx="${x}%" cy="${y}%" r="${i%5?0.8:1.4}" fill="#fff"/>`; }
  return h('svg',{class:'stars','aria-hidden':'true',html:s});
}
function header(eyebrow, title, sub, extra){
  return h('header',{class:'top'}, stars(), h('div',{class:'lampglow'}),
    h('div',{class:'in'}, extra?.back, h('div',{class:'eyebrow'},eyebrow), h('h1',{},title), sub ? h('p',{},sub) : null, extra?.after));
}

/* ---------- screens ---------- */
function render(){
  document.body.classList.toggle('groot', !!me()?.groot);
  if(S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  const app = $('#app'); app.replaceChildren();
  const tabs = $('#tabs');
  if(!me()){ tabs.hidden = true; app.append(welcome()); return; }
  tabs.hidden = false;
  tabs.querySelectorAll('.tab').forEach(b => { b.classList.toggle('on', b.dataset.tab === S.tab); b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'); });
  if(S.view?.dag) { app.append(dayView(S.view.dag)); return; }
  app.append(({vandag:home, joernaal:journal, gebede:prayers, vordering:progress, ek:settings}[S.tab] || home)());
}
function go(tab){ S.tab = tab; S.view = null; save(); render(); scrollTo(0,0); }
function openDay(dag){ S.view = {dag}; save(); render(); scrollTo(0,0); }

function welcome(editing){
  const p = editing || { name:'', color: COLORS[S.profiles.length % COLORS.length], groot:false };
  let color = p.color;
  const name = h('input',{type:'text',id:'naam',placeholder:'Jou naam',value:p.name,autocomplete:'given-name'});
  const sw = h('div',{class:'swatches',role:'radiogroup','aria-label':'Kies jou kleur'}, COLORS.map(c => h('button',{type:'button',class:'sw'+(c===color?' on':''),style:`background:${c}`,'aria-label':'Kleur',role:'radio','aria-checked':String(c===color),onclick:e=>{color=c; sw.querySelectorAll('.sw').forEach(b=>{b.classList.toggle('on',b===e.currentTarget);b.setAttribute('aria-checked',String(b===e.currentTarget));});}})));
  const groot = h('input',{type:'checkbox',id:'groot'}); groot.checked = !!p.groot;
  const go_ = () => {
    const n = name.value.trim(); if(!n){ name.focus(); toast('Tik eers jou naam'); return; }
    if(editing){ editing.name = n; editing.color = color; editing.groot = groot.checked; }
    else { const np = { id: 'p'+Date.now(), name:n, color, groot:groot.checked, plan: PLANS[0].id, prayers:[], data:{} }; S.profiles.push(np); S.active = np.id; }
    S.tab = 'vandag'; S.view = null; save(); render();
  };
  return h('div',{},
    header('Psalm 119:105', 'U woord is ’n lamp vir my voet', 'Lees elke dag ’n stukkie van die Bybel, skryf neer wat jy leer, en kyk hoe jy groei.'),
    h('div',{class:'wrap'},
      h('div',{class:'card'},
        h('h2',{style:'font-size:22px'}, editing ? 'Verander jou profiel' : 'Wie lees?'),
        h('label',{class:'f',for:'naam'},'Naam', name),
        h('div',{class:'f',style:'font-weight:800;margin-top:14px'},'Jou kleur'), sw,
        h('label',{class:'switch',for:'groot',style:'margin-top:14px'}, h('span',{}, h('b',{},'Groter letters en eenvoudiger'), h('br'), h('span',{class:'small muted'},'Lekker vir jonger lesers')), groot),
        h('button',{class:'btn primary block',type:'button',style:'margin-top:14px',onclick:go_}, editing ? 'Stoor' : 'Begin lees'),
        editing ? h('button',{class:'btn ghost block',type:'button',style:'margin-top:8px',onclick:()=>{S.tab='ek';render();}},'Kanselleer') : null,
        S.profiles.length && !editing ? h('div',{class:'list'}, h('p',{class:'muted small'},'Of kies ’n bestaande profiel:'), S.profiles.map(pp => h('button',{class:'item',type:'button',style:'cursor:pointer;text-align:left',onclick:()=>{S.active=pp.id;save();render();}}, h('div',{class:'avatar',style:`background:${pp.color}`},pp.name[0].toUpperCase()), h('div',{class:'t'},h('b',{},pp.name))))) : null
      ),
      h('p',{class:'note'},'Alles wat jy skryf, bly net op hierdie toestel. Niemand anders sien dit nie, tensy jy dit self deel.')
    ));
}

function home(){
  const p = me(), d = pdata(), pl = plan(), cd = currentDay(), day = pl.dae.find(x=>x.dag===cd);
  const doneCount = Object.keys(d.done).length, finished = doneCount >= pl.dae.length;
  const st = streak();
  const greet = (()=>{ const hr = new Date().getHours(); return hr<12?'Goeiemôre':hr<18?'Goeiemiddag':'Goeienaand'; })();
  const fase = pl.fases.find(f=>f.n===day.fase);
  return h('div',{},
    header(pl.naam, `${greet}, ${p.name}!`, finished ? 'Jy het die hele plan klaargelees. Wonderlik!' : `Fase ${day.fase}: ${fase.title}`,
      {after: h('div',{class:'stats'},
        h('div',{class:'stat'},h('b',{},`${doneCount}`),h('span',{},`van ${pl.dae.length} dae`)),
        h('div',{class:'stat'},h('b',{},`${chaptersDone()}`),h('span',{},`van ${totalCh()} hoofstukke`)),
        h('div',{class:'stat'},h('b',{},`${st}`),h('span',{},st===1?'dag aaneen':'dae aaneen')))}),
    h('div',{class:'wrap'},
      h('article',{class:'card today'},
        h('div',{class:'art',html:artFor(day),role:'img','aria-label':`Prent: ${day.titel}`}),
        h('div',{class:'body'},
          h('span',{class:'tag'}, d.done[cd] ? `Dag ${cd} · gelees` : `Dag ${cd} · vandag`),
          h('h2',{style:'font-size:24px;margin-top:10px'}, day.titel),
          h('div',{class:'refs'}, day.ref),
          h('p',{class:'muted',style:'margin:10px 0 0'}, firstSentence(day.leer)),
          h('button',{class:'btn primary block',type:'button',style:'margin-top:14px',onclick:()=>openDay(cd)}, d.done[cd] ? 'Kyk weer' : 'Begin vandag se lees'))),
      !S.herinnering ? h('button',{class:'card',type:'button',style:'display:block;width:100%;text-align:left;cursor:pointer',onclick:()=>go('ek')}, h('b',{},'Stel ’n daaglikse herinnering'), h('div',{class:'small muted'},'Jou foon herinner jou elke dag om te lees. Tik hier.')) : null,
      st === 0 && doneCount > 0 ? h('p',{class:'note'},'Het jy ’n dag gemis? Geen probleem nie. Gaan net aan waar jy gebly het.') : null,
      h('div',{class:'card'},
        h('h3',{style:'font-size:18px'},'Hoe werk dit?'),
        h('ol',{style:'margin:8px 0 0;padding-left:20px'},
          h('li',{},'Lees of luister na die hoofstukke in die BibleSA-app.'),
          h('li',{},'Lees die agtergrond en wat ons leer.'),
          h('li',{},'Skryf in jou joernaal en bid.'),
          h('li',{},'Merk die dag as klaar.'))))
  );
}
const firstSentence = t => { const m = t.match(/^.+?[.!?](\s|$)/); return m ? m[0].trim() : t; };

function dayView(dag){
  const p = me(), d = pdata(), pl = plan(), day = pl.dae.find(x=>x.dag===dag);
  const j = d.journal[dag] || {}; d.seen = d.seen || {};
  const idx = pl.dae.indexOf(day);
  const back = h('button',{class:'back',type:'button',onclick:()=>{S.view=null;save();render();}},'← Terug');
  const fields = {};

function entryText(day, j){
  const lines = [`📖 Dag ${day.dag}: ${day.titel} (${day.ref})`];
  if(j.leer) lines.push(`\nWat ek geleer het:\n${j.leer}`);
  if(j.antwoord) lines.push(`\n${day.vraag}\n${j.antwoord}`);
  if(j.vers) lines.push(`\nMy vers:\n${j.vers}`);
  if(j.vraagPa) lines.push(`\nMy vraag:\n${j.vraagPa}`);
  lines.push(`\n– ${me().name}`);
  return lines.join('\n');
}
async function shareEntry(day, who){
  const j = pdata().journal[day.dag] || {};
  if(!j.leer && !j.antwoord && !j.vers && !j.vraagPa){ toast('Skryf eers iets in jou joernaal'); return; }
  const text = entryText(day, j);
  const num = waNum(S.ouers?.[who]);
  if(num){ location.href = 'https://wa.me/'+num+'?text='+encodeURIComponent(text); return; }
  // no number saved yet: let the phone ask who to send it to
  toast(`Pappa en Mamma se nommers is nog nie by “Ek” ingesit nie`);
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==='AbortError') return; } }
  location.href = 'https://wa.me/?text='+encodeURIComponent(text);
}

function journal(){
  const d = pdata(), pl = plan();
  const entries = pl.dae.filter(x => { const j = d.journal[x.dag]; return j && (j.leer||j.antwoord||j.vers||j.vraagPa); }).reverse();
  return h('div',{},
    header('My joernaal', 'Wat ek geleer het', `${entries.length} ${entries.length===1?'inskrywing':'inskrywings'}`),
    h('div',{class:'wrap'},
      entries.length ? h('div',{class:'list'}, entries.map(day => { const j = d.journal[day.dag];
        return h('button',{class:'item',type:'button',style:'text-align:left;cursor:pointer',onclick:()=>openDay(day.dag)},
          h('div',{class:'t'}, h('div',{class:'small muted'}, `Dag ${day.dag} · ${day.ref}${j.datum?' · '+fmtDate(j.datum):''}`), h('b',{},day.titel),
            j.leer ? h('p',{}, j.leer) : null, j.vers ? h('p',{class:'muted'}, '“'+j.vers+'”') : null)); }))
      : h('div',{class:'card empty'}, h('p',{style:'margin:0;font-weight:800'},'Jou joernaal is nog leeg.'), h('p',{class:'small'},'Wanneer jy by ’n dag skryf wat jy geleer het, wys dit hier.'), h('button',{class:'btn primary',type:'button',onclick:()=>openDay(currentDay())},'Gaan na vandag'))
    ));
}

function prayers(){

    h('button',{class:'check'+(g.ans?' on':''),type:'button','aria-label':g.ans?'Merk as nog nie beantwoord nie':'Merk as beantwoord',onclick:()=>{ g.ans = g.ans ? null : today(); save(); render(); if(g.ans) toast('Dank die Here!'); }}, g.ans?'✓':''),
    h('div',{class:'t'}, h('p',{style:'margin:0;font-weight:700'}, g.text), h('div',{class:'small muted'}, `Begin ${fmtDate(g.datum)}${g.dag?' · Dag '+g.dag:''}${g.ans?' · beantwoord '+fmtDate(g.ans):''}`)),

    h('div',{class:'wrap'},
      h('div',{class:'card'},
        h('label',{class:'f',for:'gebed-nuut',style:'margin-top:0'},'Nuwe gebedsversoek', input),
        h('button',{class:'btn dark',type:'button',style:'margin-top:10px',onclick:()=>{ const t=input.value.trim(); if(!t) return; p.prayers.unshift({id:'g'+Date.now(),text:t,dag:null,datum:today(),ans:null}); save(); render(); }},'Voeg by')),
      h('h2',{style:'font-size:20px;margin-top:20px'},'Ek bid nog hiervoor'),

function progress(){
  const d = pdata(), pl = plan(), cd = currentDay();
  const books = []; const bmap = {};
  pl.dae.forEach(x => x.hoofstukke.forEach(([b]) => { if(!bmap[b]){ bmap[b]={n:b,t:0,r:0}; books.push(bmap[b]); } bmap[b].t++; if(d.done[x.dag]) bmap[b].r++; }));

  const doneDays = Object.keys(d.done).length;
  return h('div',{},
    header('Vordering', `${Math.round(chaptersDone()/totalCh()*100)}% van die Bybel`, `${chaptersDone()} van ${totalCh()} hoofstukke · ${doneDays} van ${pl.dae.length} dae`),

        h('div',{class:'daygrid'}, pl.dae.map(x => h('button',{class:'dg'+(d.done[x.dag]?' done':'')+(x.dag===cd?' cur':''),type:'button','aria-label':`Dag ${x.dag}: ${x.ref}${d.done[x.dag]?' (klaar)':''}`,onclick:()=>openDay(x.dag)}, x.dag))))
    ));

function reminderCard(){
  const sel = h('select',{id:'herinner-tyd',style:'border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-weight:700'});
  for(let hh=5; hh<22; hh++) for(const mm of [0,30]){ const v = String(hh).padStart(2,'0')+String(mm).padStart(2,'0'); const o = h('option',{value:v}, `${hh}:${String(mm).padStart(2,'0')}`); if(v === (S.herinnering||'1900')) o.selected = true; sel.append(o); }
  sel.addEventListener('change', ()=>{ S.herinnering = sel.value; save(); });
  const go_ = () => { S.herinnering = sel.value; save();
    const url = new URL('herinnering/'+sel.value+'.ics', location.href).href;
    if(location.protocol === 'https:' && location.hostname.endsWith('github.io')) window.open(url, '_blank'); else toast('Dit werk net in die regte app op jou foon'); };
  return h('section',{class:'card'}, h('h2',{style:'font-size:20px'},'Daaglikse herinnering'),
    h('p',{class:'small muted',style:'margin:4px 0 0'},'Kies wanneer jy elke dag wil lees. Jou foon se kalender herinner jou dan elke dag op daardie tyd.'),
    h('div',{class:'row',style:'margin-top:10px'}, h('label',{for:'herinner-tyd',style:'font-weight:800'},'Tyd'), sel,
      h('button',{class:'btn primary',type:'button',onclick:go_},'Stel herinnering')),
    h('p',{class:'note'},'Tik daarna op “Voeg by kalender” (Add to Calendar). Wil jy die tyd verander? Vee die ou “Bybeltyd” in jou kalender uit en stel ’n nuwe een.'));
}

        : h('ol',{style:'margin:8px 0 0;padding-left:20px'}, h('li',{},'Maak hierdie bladsy in Chrome oop.'), h('li',{},'Tik op die drie kolletjies regs bo.'), h('li',{},'Kies “Voeg by tuisskerm” of “Installeer app”.'))),
      h('section',{class:'card'}, h('h2',{style:'font-size:20px'},'Rugsteun'),
        h('p',{class:'small muted',style:'margin:4px 0 0'},'Jou joernaal en gebede bly net op hierdie toestel. Maak gereeld ’n rugsteun en stuur dit vir Pappa en Mamma, sodat niks verlore raak as jou toestel iets oorkom nie.'),
        h('div',{class:'row',style:'margin-top:10px'},
          h('button',{class:'btn soft',type:'button',onclick:async()=>{ const t = backup(); const name = `leesplan-rugsteun-${today()}.json`;

          h('button',{class:'btn ghost',type:'button',onclick:async()=>{ try{ await navigator.clipboard.writeText(backup()); toast('Gekopieer'); }catch(e){ restoreBox.value = backup(); restoreBox.select(); toast('Kies alles en kopieer'); } }},'Kopieer as teks')),
        h('label',{class:'f',for:'herstel'},'Sit ’n rugsteun terug', restoreBox),

        h('button',{class:'btn ghost block',type:'button',style:'margin-top:10px',onclick:()=>{ S.active=null; save(); render(); }},'Voeg nog ’n leser by'))

document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

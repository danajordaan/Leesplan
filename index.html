etriet meet alles noukeurig – mure, poorte, voorhowe en kamers. (Lees dit gerus vinniger; die detail beklemtoon dat God se plan seker en volledig is.) Die volk het hierdie tempel nooit so gebou nie. Christene verstaan dit verskillend: as 'n simboliese beeld van God se volmaakte teenwoordigheid by Sy volk, vervul in Christus en die kerk, en finaal in die nuwe Jerusalem (Openbaring 21–22, wat ook gemeet word); ander verwag 'n letterlike toekomstige tempel.","leer":"Die verwoesting is nie die einde nie – God het reeds die herstel beplan, tot in die kleinste besonderhede. God se woonplek is heilig en ordelik; daar is 'n duidelike onderskeid tussen heilig en gewoon. Sy plan om by Sy volk te woon, sal vervul word.","skrif":"\"In die vyf-en-twintigste jaar van ons ballingskap... op presies dieselfde dag het die hand van die Here op my gekom\" (40:1). 'n Man met 'n linnelyn en 'n meetriet (40:3). \"Vertel aan die huis van Israel alles wat jy sien\" (40:4). Die poorte, voorhowe en kamers (40:5–42:14). Die muur om te skei tussen die heilige en die onheilige (42:20).","bid":"Dank God dat Hy, selfs ná verwoesting, 'n plan vir herstel het. Bid dat ons heilig sal leef, met 'n duidelike skeiding tussen wat God eer en wat nie. Dank God dat ons die tempel van die Heilige Gees is.","vraag":"Waarom dink jy het God aan die ballinge 'n so gedetailleerde beeld van 'n nuwe tempel gegee?","hoofstukke":[["Esegiël","EZK",40],["Esegiël","EZK",41],["Esegiël","EZK",42]]},{"dag":237,"ref":"Esegiël 43 – 45","titel":"Die Heerlikheid Keer Terug","fase":5,"tydlyn":"Die visioen van 573 v.C. gaan voort.","agtergrond":"In hoofstuk 10–11 het Esegiël gesien hoe die heerlikheid van God die tempel deur die oostepoort verlaat. Nou keer dieselfde heerlikheid deur die oostepoort terug en vul die nuwe tempel. Die oostepoort word daarna toegesluit, omdat die Here daardeur ingegaan het. Die volk moet skaam wees oor hulle sonde wanneer hulle die tempel sien. Daar is reëls vir die altaar, die priesters (die seuns van Sadok, wat getrou gebly het), en die verdeling van die land.","leer":"God se teenwoordigheid keer terug na 'n volk wat Hy gereinig het. Wanneer ons God se heiligheid en genade sien, word ons beskaamd oor ons sonde – en dit lei tot bekering. Getrouheid word beloon. Leiers moet regverdig wees en nie die volk verdruk nie.","skrif":"\"Die heerlikheid van die God van Israel het gekom uit die rigting van die ooste\" (43:2). \"En die heerlikheid van die Here het die huis vervul\" (43:5). \"Hier is die plek van my troon... waar Ek sal woon in die midde van die kinders van Israel vir ewig\" (43:7). \"Beskryf die huis aan die huis van Israel, dat hulle hulle ongeregtighede kan skaam\" (43:10). Die oostepoort bly gesluit (44:1–2). Die Leviete wat afgedwaal het, en die seuns van Sadok wat getrou was (44:10–16). \"Laat staan geweld en verdrukking, en doen reg en geregtigheid\" (45:9).","bid":"Dank God dat Sy heerlikheid terugkeer waar Hy verwelkom word. Bid dat God se teenwoordigheid ons huis sal vul. Bid vir leiers om reg en geregtigheid te doen.","vraag":"God se heerlikheid het die tempel verlaat en toe teruggekeer. Hoe kan ons seker maak God voel \"welkom\" in ons lewe en huis?","hoofstukke":[["Esegiël","EZK",43],["Esegiël","EZK",44],["Esegiël","EZK",45]]},{"dag":238,"ref":"Esegiël 46 – 48","titel":"Die Rivier van Lewe en \"Die Here is Daar\"","fase":5,"tydlyn":"Die visioen van 573 v.C. eindig.","agtergrond":"In hoofstuk 47 sien Esegiël water wat onder die drumpel van die tempel uitvloei en al dieper word – enkel-diep, knie-diep, heup-diep, en dan 'n rivier waarin 'n mens moet swem. Dit vloei oos na die Dooie See (wat so sout is dat niks daarin kan lewe nie) en maak dit gesond: daar is vis, en bome met vrugte elke maand en blare vir genesing. Openbaring 22:1–2 gebruik dieselfde beeld vir die rivier van die water van die lewe. Hoofstuk 48 verdeel die land tussen die stamme. Die boek eindig met die nuwe naam van die stad: \"Die Here is daar.\"","leer":"Waar God se teenwoordigheid uitvloei, bring dit lewe en genesing – selfs op die dooiste plekke. Ons word genooi om al dieper in God se lewe in te gaan, nie net by die enkels te bly nie. Jesus het gesê dat strome van lewende water uit dié wat in Hom glo sal vloei (Johannes 7:37–39). Die doel van alles is dat God by ons sal wees.","skrif":"Die prins se offers en die sabbat (46). \"Water het uitgekom onder die drumpel van die huis\" (47:1). Enkel-diep, knie-diep, heup-diep, en 'n rivier om in te swem (47:3–5). \"Alles sal lewe waarheen die rivier kom\" (47:9). Bome aan die rivier: \"hulle vrugte sal tot voedsel dien en hulle blare tot genesing\" (47:12). Vreemdelinge kry ook 'n erfdeel (47:22–23). \"En die naam van die stad sal van dié dag af wees: DIE HERE IS DAAR\" (48:35).","bid":"Bid dat God se lewende water uit ons gesin sal vloei en lewe en genesing na ander sal bring. Bid dat ons al dieper in ons verhouding met God sal ingaan. Dank God dat Hy belowe om vir ewig by ons te wees.","vraag":"Esegiël het al dieper in die rivier ingegaan. Hoe \"diep\" is jou verhouding met God op die oomblik – enkel, knie of swem? Hoe kan jy dieper gaan?","hoofstukke":[["Esegiël","EZK",46],["Esegiël","EZK",47],["Esegiël","EZK",48]]},{"dag":239,"ref":"Daniël 1 – 2","titel":"Trou in Babel en die Droom van die Groot Beeld","fase":5,"tydlyn":"605 v.C. (die derde jaar van Jojakim, 1:1) – die eerste wegvoering. Hoofstuk 2: Nebukadnesar se tweede jaar, c. 603 v.C. Babel.","agtergrond":"Daniël en sy drie vriende (Hananja, Misael en Asarja – die Babiloniërs noem hulle Sadrag, Mesag en Abednego) was jong mans uit adellike families, waarskynlik tieners, wat weggevoer is om in die Babiloniese hof opgelei te word. Hulle kry nuwe name (met verwysings na Babiloniese gode), 'n nuwe taal en 'n nuwe kultuur. Hulle aanvaar baie daarvan, maar weier om die koning se kos te eet – waarskynlik omdat dit aan afgode gewy was of onrein volgens die wet was. In hoofstuk 2 droom Nebukadnesar van 'n groot beeld van vier metale: dit word algemeen verklaar as vier opeenvolgende wêreldryke (Babel, Medo-Persië, Griekeland, en Rome – of volgens ander, Babel, Medië, Persië, Griekeland). (Die boek Daniël word tradisioneel in die 6de eeu v.C. gedateer; baie geleerdes dateer die finale vorm in die 2de eeu v.C. Die gids volg die verhaal soos dit vertel word.)","leer":"Jongmense kan in 'n vreemde, vyandige kultuur getrou aan God bly – met respek, wysheid en vasberadenheid. Om in jou hart te besluit, kom voor die toets. God eer dié wat Hom eer. God openbaar geheimenisse en regeer oor koninkryke; Hy sal 'n koninkryk oprig wat vir ewig bly – die koninkryk van Jesus.","skrif":"\"Daniël het hom in sy hart voorgeneem om hom nie te verontreinig met die spys van die koning nie\" (1:8). Hy vra beleefd vir 'n toets van tien dae (1:12). \"Aan hierdie vier jongmanne het God kennis en verstand gegee\" (1:17). Die koning eis dat die wyse manne die droom self vertel (2:5). Daniël en sy vriende bid saam (2:17–18). \"Hy verander tye en geleenthede, sit konings af en stel konings aan; Hy gee aan die wyse wysheid\" (2:21). \"Daar is 'n God in die hemel wat geheimenisse openbaar\" (2:28). Die beeld van goud, silwer, koper, yster en klei (2:31–35). 'n Klip, nie deur hande losgemaak nie, word 'n groot berg (2:34–35). \"Die God van die hemel sal 'n koninkryk verwek wat in ewigheid nie vernietig sal word nie\" (2:44).","bid":"Bid vir ons gesin se kinders dat hulle, soos Daniël, nou al \"in hulle harte sal besluit\" om God getrou te bly, voordat die toets kom. Bid vir goeie vriende wat saam met hulle bid. Dank God dat Hy die geskiedenis regeer en dat Jesus se koninkryk vir ewig staan.","vraag":"Daniël het \"in sy hart besluit\" voor die toets gekom het. Watter besluite moet 'n tiener vooraf neem, voordat die versoeking kom?","hoofstukke":[["Daniël","DAN",1],["Daniël","DAN",2]]},{"dag":240,"ref":"Daniël 3 – 4","titel":"Die Vuuroond en die Trotse Koning","fase":5,"tydlyn":"Gedurende Nebukadnesar se regering (605–562 v.C.). Die vlakte van Dura naby Babel, en die koning se paleis.","agtergrond":"Nebukadnesar rig 'n goue beeld van 60 by 6 el (sowat 27 m hoog) op en beveel almal om daarvoor te buig. Die drie vriende weier. 'n Oond vir die bak van stene of vir metaal was groot genoeg om in te loop. Daniël self word nie in hoofstuk 3 genoem nie (hy was moontlik elders besig). In hoofstuk 4 vertel die koning self, in die vorm van 'n brief aan sy ryk, hoe hy deur God verneder is weens sy trots: hy het sewe \"tye\" soos 'n dier gelewe totdat hy erken het dat die Allerhoogste regeer. Babel was beroemd om sy groot bouprojekte (soos die Isjtarpoort, nou in Berlyn), en Nebukadnesar se inskripsies spog daaroor – soos in 4:30.","leer":"Ware geloof sê: \"Ons God kan ons red – maar selfs as Hy dit nie doen nie, sal ons nie buig nie.\" God is met Sy kinders in die vuur. Hoogmoed kom voor die val, maar God is genadig met dié wat hulleself verootmoedig. Die Allerhoogste regeer, en Hy gee die koninkryk aan wie Hy wil.","skrif":"\"Wie nie neerval en aanbid nie, sal dadelik in die brandende vuuroond gewerp word\" (3:6). \"As onse God wat ons dien, ons kan red... sal Hy ons red... Maar so nie, laat dit u bekend wees, o koning, dat ons u gode nie sal dien nie\" (3:17–18). \"Ek sien vier manne los wandel in die vuur... en die voorkoms van die vierde is soos 'n seun van die gode\" (3:25). \"Die vuur het geen mag oor hulle liggame gehad nie... en geen reuk van vuur het aan hulle gekom nie\" (3:27). Nebukadnesar se droom van die boom (4:10–17). \"Is dit nie die groot Babel wat ek gebou het... deur die sterkte van my mag en tot eer van my heerlikheid nie?\" (4:30). \"En sy verstand het na hom teruggekeer\" (4:34). \"Die wat in hoogmoed wandel, kan Hy verneder\" (4:37).","bid":"Bid vir geloof wat sê \"selfs as God nie red nie, sal ons Hom nie verlaat nie\". Bid vir Christene wat vandag gevaar trotseer omdat hulle nie voor ander gode wil buig nie. Bid teen hoogmoed oor ons prestasies.","vraag":"Die drie vriende het gesê \"maar selfs as Hy ons nie red nie...\" Waarom is dit so 'n sterk geloof?","hoofstukke":[["Daniël","DAN",3],["Daniël","DAN",4]]},{"dag":241,"ref":"Daniël 5 – 6","titel":"Die Skrif teen die Muur en die Leeukuil","fase":5,"tydlyn":"Hoofstuk 5: die nag van die val van Babel, 539 v.C. Hoofstuk 6: die vroeë Persiese tyd, kort daarna. Daniël is nou 'n ou man (in sy 80's).","agtergrond":"Belsasar was die seun van koning Nabonidus, die laaste koning van Babel, en het in Babel geregeer terwyl sy vader weg was. (Vir lank was sy naam buite die Bybel onbekend, maar Babiloniese tekste, soos die Nabonidus-silinder, bevestig hom nou. Dit verklaar ook waarom hy Daniël die \"derde\" heerser in die koninkryk kon maak – na Nabonidus en homself.) Hy gebruik die heilige bekers uit die tempel van Jerusalem by 'n dronk fees. In dieselfde nag val Babel teen die Mede en Perse. \"Darius die Meder\" (5:31) se presiese identiteit word deur geleerdes bespreek. Persiese wette kon volgens die verhaal nie herroep word nie.","leer":"God kan nie gespot word nie; Hy weeg elke mens en elke koninkryk. Daniël wys hoe 'n mens met integriteit kan leef sodat vyande niks teen hom kan vind nie – behalwe sy getrouheid aan God. Gebed was vir hom 'n vaste gewoonte, ook wanneer dit verbode en gevaarlik was. God red Sy kinders, en Sy koninkryk bly vir ewig.","skrif":"Belsasar gebruik die tempelbekers (5:2–4). 'n Hand skryf teen die muur (5:5). \"MENE, MENE, TEKEL, UFARSIN\" (5:25). \"U is op die weegskaal geweeg en te lig bevind\" (5:27). \"In dieselfde nag is Belsasar... gedood\" (5:30). Die amptenare kon geen rede vind om Daniël aan te kla nie, \"omdat hy getrou was\" (6:4). \"Ons sal geen rede vind om hierdie Daniël aan te kla nie, tensy ons dit vind in verband met die wet van sy God\" (6:5). \"Hy het drie maal op 'n dag op sy knieë gekniel en gebid en lofgesing voor sy God, net soos hy voorheen gedoen het\" (6:10). \"My God het sy engel gestuur en die bek van die leeus toegesluit\" (6:22). \"Hy is die lewende God... en sy koninkryk is een wat nie vernietig sal word nie\" (6:26).","bid":"Bid vir integriteit – dat niemand ooit iets teen ons sal kan vind behalwe ons trou aan God nie. Bid vir 'n vaste gewoonte van gebed in ons gesin, soos Daniël s'n. Bid vir Christene wat vir hulle gebede vervolg word.","vraag":"Daniël het gebid \"net soos hy voorheen gedoen het\" – selfs toe dit gevaarlik was. Hoe help 'n vaste gewoonte van gebed jou wanneer moeilike tye kom?","hoofstukke":[["Daniël","DAN",5],["Daniël","DAN",6]]},{"dag":242,"ref":"Daniël 7 – 8","titel":"Die Vier Diere en die Seun van die Mens","fase":5,"tydlyn":"Hoofstuk 7: die eerste jaar van Belsasar (c. 553 v.C.). Hoofstuk 8: sy derde jaar (c. 551 v.C.). Visioene van Daniël.","agtergrond":"Die tweede helfte van Daniël bestaan uit visioene in apokaliptiese styl – vol simbole (diere, horings, getalle) wat wêreldryke en gebeure voorstel. Die vier diere in hoofstuk 7 stem ooreen met die vier dele van die beeld in hoofstuk 2. Die \"klein horing\" word dikwels verbind met Antiochus IV Epifanes, die Griekse koning (175–164 v.C.) wat die tempel in 167 v.C. ontheilig en die Joodse godsdiens verbied het – en ook met 'n finale vyand van God in die eindtyd. In hoofstuk 8 word die ram en bok uitdruklik as Medo-Persië en Griekeland verklaar (8:20–21). Die \"Seun van die mens\" wat met die wolke kom (7:13), was Jesus se gunsteling-titel vir Homself; Hy het dit voor die hoëpriester aangehaal (Markus 14:62).","leer":"Die ryke van die wêreld is soos wilde diere – wreed en verslindend – maar God, die Oue van dae, sit op die troon en oordeel hulle. Die finale koninkryk word gegee aan \"Een soos 'n seun van die mens\" – Jesus – en aan die heiliges. Vervolging is tydelik; God se koninkryk is ewig.","skrif":"Die vier diere uit die see (7:2–8). \"Die Oue van dae het gaan sit; sy kleed was wit soos sneeu\" (7:9). \"En kyk, met die wolke van die hemel het Een gekom soos 'n mensekind... En aan Hom is gegee heerskappy en eer en koningskap, sodat al die volke... Hom moet vereer. Sy heerskappy is 'n ewige heerskappy\" (7:13–14). \"Die heiliges van die Allerhoogste sal die koninkryk ontvang\" (7:18). Die klein horing teen die heiliges (7:21, 25). Die ram en die bok (8:3–8). \"Die ram... dit is die konings van Medië en Persië. En die bok is die koning van Griekeland\" (8:20–21).","bid":"Dank Jesus dat Hy die Seun van die mens is aan wie alle mag gegee is. Bid vir vervolgde Christene – dat hulle sal weet dat God se koninkryk die laaste woord het. Bid vir vrede en geloof wanneer wêreldnuus ons bang maak.","vraag":"Jesus het die titel \"Seun van die mens\" uit Daniël 7 vir Homself gebruik. Wat sê Daniël 7:13–14 oor wie Jesus is?","hoofstukke":[["Daniël","DAN",7],["Daniël","DAN",8]]},{"dag":243,"ref":"Daniël 9 – 10","titel":"Daniël se Gebed en die Sewentig Weke","fase":5,"tydlyn":"Hoofstuk 9: die eerste jaar van Darius, 539/538 v.C. Hoofstuk 10: die derde jaar van Kores, 536 v.C. By die Tigrisrivier.","agtergrond":"Daniël lees in Jeremia (25:11; 29:10) dat die ballingskap 70 jaar sal duur en besef die tyd is amper verby. Sy reaksie is nie om net te wag nie, maar om te vas en die sonde van die volk te bely – met \"ons\" en nie \"hulle\" nie. Die engel Gabriël bring 'n profesie van \"sewentig weke\" (sewentig \"sewes\", gewoonlik verstaan as 490 jaar) tot die koms van 'n \"Gesalfde\" wat \"uitgeroei\" sal word – Christene verstaan dit meestal as 'n profesie oor Jesus se koms en dood, hoewel die presiese berekening verskillend gedoen word. In hoofstuk 10 sien Daniël 'n hemelse boodskapper wat vertel van 'n geestelike stryd agter die skerms (\"die vors van Persië\").","leer":"God se beloftes moet ons nie passief maak nie, maar tot gebed dryf. Ware gebed sluit in eerlike, nederige skuldbelydenis – ook vir die sondes van ons volk. Ons bid op grond van God se barmhartigheid, nie ons eie geregtigheid nie. Daar is 'n werklike geestelike stryd, en gebed maak 'n verskil. God noem Sy dienaars \"baie bemind\".","skrif":"Daniël lees Jeremia se profesie oor 70 jaar (9:2). \"Ek het my aangesig gerig na die Here God om Hom te soek met gebed en smekinge, met vas en sak en as\" (9:3). \"Ons het gesondig en verkeerd gedoen\" (9:5). \"Nie op grond van ons geregtighede lê ons ons smekinge voor u aangesig neer nie, maar op grond van u groot barmhartighede\" (9:18). \"Here, hoor! Here, vergeef!\" (9:19). \"Aan die begin van jou smekinge het daar 'n woord uitgegaan\" (9:23). Die sewentig weke (9:24–27). \"Die Gesalfde sal uitgeroei word\" (9:26). \"Van die eerste dag af dat jy jou hart daarop gerig het... is jou woorde gehoor\" (10:12). Die vors van die koninkryk Persië het teëgestaan (10:13). \"Man wat baie bemind is, wees nie bevrees nie; vrede vir jou, wees sterk\" (10:19).","bid":"Bid soos Daniël vir ons land – bely die sondes van ons volk met \"ons\", nie \"hulle\" nie. Bid op grond van God se barmhartigheid. Dank God dat Hy ons gebede van die eerste dag af hoor. Bid vir elkeen: \"Wees nie bevrees nie, vrede vir jou, wees sterk.\"","vraag":"Daniël het gebid \"ons het gesondig\", al was hy self baie getrou. Waarom dink jy het hy so gebid?","hoofstukke":[["Daniël","DAN",9],["Daniël","DAN",10]]},{"dag":244,"ref":"Daniël 11 – 12","titel":"Die Konings van die Noorde en die Suide – en die Opstanding","fase":5,"tydlyn":"Die visioen van 536 v.C., met 'n blik oor die volgende eeue tot by die eindtyd.","agtergrond":"Hoofstuk 11 gee 'n buitengewoon gedetailleerde beskrywing van die stryd tussen die \"koning van die noorde\" en die \"koning van die suide\" – wat ooreenstem met die Griekse ryke ná Alexander die Grote: die Seleukiede (Sirië, noord) en die Ptolemeërs (Egipte, suid), met Israel tussenin. Verse 21–35 pas presies op Antiochus IV Epifanes. (Hierdie detail is die rede waarom baie geleerdes Daniël se finale vorm in die 2de eeu v.C. dateer; ander sien dit as voorspellende profesie.) Vanaf 11:36 of 12:1 kyk die teks na die eindtyd. Daniël 12:2 is die duidelikste verwysing in die Ou Testament na die liggaamlike opstanding van die regverdiges en die goddeloses.","leer":"God weet die geskiedenis vooruit en het dit in Sy hand – selfs die opkoms en val van konings. Gelowiges sal vervolg word, maar dié wat God ken, sal sterk wees en optree. Daar is 'n opstanding uit die dood: vir sommige tot ewige lewe, vir ander tot ewige skande. Ons word geroep om getrou te bly tot die einde, en dan sal ons ons erfdeel ontvang.","skrif":"Die konings van die noorde en die suide (11:2–35). \"Die volk wat hulle God ken, sal sterk wees en met krag optree\" (11:32). \"Die verstandiges onder die volk sal baie mense tot insig bring\" (11:33). Die koning wat homself bo elke god verhef (11:36). \"In dié tyd sal jou volk gered word, elkeen wat gevind word opgeskrywe in die boek\" (12:1). \"Baie van die wat slaap in die stof van die aarde, sal ontwaak, sommige tot die ewige lewe en sommige tot groot smaad, tot ewige afsku\" (12:2). \"Die verstandiges sal glans soos die glans van die uitspansel, en die wat baie tot geregtigheid gebring het, soos die sterre, vir ewig en altyd\" (12:3). \"Gaan jy heen tot die einde; en jy sal rus en sal opstaan tot jou lot aan die einde van die dae\" (12:13).","bid":"Bid dat ons gesin God sal ken en \"sterk sal wees en optree\". Dank God vir die hoop van die opstanding. Bid dat elkeen van ons ander \"tot geregtigheid sal bring\" en soos die sterre sal skyn.","vraag":"Daniël 12:3 sê die wat ander tot geregtigheid bring, sal skyn soos die sterre. Wat beteken dit om iemand anders na God te lei?","hoofstukke":[["Daniël","DAN",11],["Daniël","DAN",12]]},{"dag":245,"ref":"Psalms 90 – 92","titel":"\"Leer Ons om Ons Dae te Tel\" – Onder die Skaduwee van die Almagtige","fase":5,"tydlyn":"Boek IV van die Psalms begin. Psalm 90 is die enigste psalm wat aan Moses toegeskryf word (c. 1400/1250 v.C.) – die oudste in die Psalmboek.","agtergrond":"Boek IV begin met Moses – asof om die ballinge, wat Dawid se koninkryk verloor het, terug te neem na die tyd voor daar konings was, toe God self hulle \"woning\" was. Psalm 90 kontrasteer God se ewigheid met die kortheid van die mens se lewe (\"sewentig jaar, en as ons baie sterk is, tagtig\"). Psalm 91 is 'n psalm van God se beskerming; die duiwel het dit in die versoeking aan Jesus aangehaal, buite konteks (Matteus 4:6). Psalm 92 is \"'n lied vir die sabbatdag\".","leer":"God is ons woonplek van geslag tot geslag; Hy was daar voor die berge gebore is. Ons lewe is kort, daarom moet ons God vra om ons te leer om dit wys te leef. Wie by God skuil, is veilig onder Sy vleuels – nie dat niks sleg sal gebeur nie, maar dat ons in Sy hande is. Die regverdiges dra vrug selfs in hulle ouderdom.","skrif":"Psalm 90: \"Here, U was vir ons 'n toevlug van geslag tot geslag. Voordat die berge gebore was... ja, van ewigheid tot ewigheid is U God\"; \"Want duisend jaar is in u oë soos die dag van gister\"; \"Die dae van ons jare – daarin is sewentig jaar, of as ons baie sterk is, tagtig jaar\"; \"Leer ons om ons dae so te tel dat ons 'n wyse hart mag bekom\"; \"Bevestig die werk van ons hande.\" Psalm 91: \"Wie in die skuilplek van die Allerhoogste sit... sê van die Here: My toevlug en my bergvesting\"; \"Met sy vlerke sal Hy jou dek\"; \"Hy sal sy engele aangaande jou bevel gee om jou te bewaar op al jou weë.\" Psalm 92: \"Dit is goed om die Here te loof\"; \"Die regverdige sal groei soos die palmboom... in die gryse ouderdom sal hulle nog vrug dra.\"","bid":"Bid Psalm 90:12 vir elkeen: \"Leer ons om ons dae so te tel dat ons 'n wyse hart mag bekom.\" Bid Psalm 91 se beskerming oor elke kind. Dank God dat Hy ons woonplek is van geslag tot geslag.","vraag":"Psalm 90 vra God om ons te leer \"ons dae te tel\". Hoe sou dit jou lewe verander as jy elke dag as 'n kosbare geskenk sien?","hoofstukke":[["Psalms","PSA",90],["Psalms","PSA",91],["Psalms","PSA",92]]},{"dag":246,"ref":"Psalms 93 – 97","titel":"\"Die Here Regeer!\"","fase":5,"tydlyn":"Die \"troonsbestygingspsalms\" (Psalm 93 en 95–99).","agtergrond":"Hierdie psalms verkondig telkens: \"Die Here is Koning\" of \"Die Here regeer\". Vir 'n volk in ballingskap, sonder 'n koning op Dawid se troon, was dit 'n kragtige herinnering dat God nog steeds op die troon is. Psalm 95 is 'n uitnodiging tot aanbidding, met 'n waarskuwing uit die woestyntyd; Hebreërs 3–4 haal dit uitvoerig aan (\"Vandag, as julle sy stem hoor, verhard julle harte nie\"). Psalm 96 roep al die nasies om 'n nuwe lied vir die Here te sing.","leer":"Die Here regeer – oor die skepping, die nasies en die geskiedenis – selfs wanneer dit nie so lyk nie. Die regte reaksie is aanbidding, gehoorsaamheid en vreugde. God roep ons om vandag na Sy stem te luister en nie ons harte te verhard nie. Sy heerlikheid moet onder al die nasies verkondig word.","skrif":"Psalm 93: \"Die Here is Koning, Hy is met hoogheid bekleed.\" Psalm 94: \"Hy wat die oor geplant het, sou Hy nie hoor nie?\"; \"As ek sê: My voet wankel, dan ondersteun u goedertierenheid my, o Here.\" Psalm 95: \"Kom, laat ons buig en kniel, laat ons neerkniel voor die Here wat ons gemaak het\"; \"Vandag, as julle sy stem hoor, verhard julle harte nie.\" Psalm 96: \"Sing tot eer van die Here 'n nuwe lied, sing tot eer van die Here, o ganse aarde!\"; \"Vertel onder die nasies sy eer.\" Psalm 97: \"Die Here is Koning; laat die aarde juig\"; \"Lig is gesaai vir die regverdige.\"","bid":"Loof God as Koning oor alles – ook oor ons bekommernisse. Bid dat ons vandag na Sy stem sal luister. Bid vir sendelinge wat \"onder die nasies Sy eer vertel\".","vraag":"Psalm 95 sê \"vandag, as julle sy stem hoor, verhard julle harte nie\". Waarom is \"vandag\" so belangrik?","hoofstukke":[["Psalms","PSA",93],["Psalms","PSA",94],["Psalms","PSA",95],["Psalms","PSA",96],["Psalms","PSA",97]]},{"dag":247,"ref":"Psalms 98 – 101","titel":"\"Juig voor die Here, o Ganse Aarde\"","fase":5,"tydlyn":"Psalms 98–100 (troonsbestygingspsalms), Psalm 101 (Dawid).","agtergrond":"Psalm 98 vier God se oorwinning en verlossing, en roep die hele skepping op om saam te jubel – die see, die riviere en die berge. Psalm 99 beklemtoon God se heiligheid (\"Hy is heilig\", drie keer). Psalm 100 was 'n lied vir wanneer die volk met dankoffers by die tempelpoorte ingegaan het; dit is eeue lank deur die kerk gesing. In Psalm 101 maak Dawid 'n besluit oor hoe hy as koning sy huis en hof gaan lei – met integriteit.","leer":"God se verlossing is rede vir uitbundige vreugde. Hy is heilig, maar Hy antwoord dié wat Hom aanroep. Ons behoort aan Hom – Hy het ons gemaak, en ons is Sy skape. Integriteit begin by die huis: wat ons voor ons oë sit, met wie ons tyd spandeer, en hoe ons praat.","skrif":"Psalm 98: \"Sing tot eer van die Here 'n nuwe lied, want Hy het wonders gedoen\"; \"Juig voor die Here, o ganse aarde.\" Psalm 99: \"Die Here is Koning... Hy is heilig\"; \"Moses en Aäron... het die Here aangeroep, en Hy het hulle geantwoord.\" Psalm 100: \"Juig voor die Here, o ganse aarde! Dien die Here met vreugde\"; \"Hy het ons gemaak, en nie ons self nie, sy volk en die skape van sy weide\"; \"Gaan in by sy poorte met lof\"; \"Want die Here is goed; sy goedertierenheid is tot in ewigheid.\" Psalm 101: \"Ek wil wandel in die opregtheid van my hart, in my huis\"; \"Ek sal geen nikswerdige saak voor my oë stel nie.\"","bid":"Sê of sing Psalm 100 saam as gesin. Bid Psalm 101 vir ons huis: dat ons \"in opregtheid sal wandel in ons huis\" en geen \"nikswerdige saak voor ons oë sal stel nie\" – ook op ons skerms.","vraag":"Psalm 101:3 sê \"ek sal geen nikswerdige saak voor my oë stel nie\". Hoe pas dit op wat ons op ons fone en skerms kyk?","hoofstukke":[["Psalms","PSA",98],["Psalms","PSA",99],["Psalms","PSA",100],["Psalms","PSA",101]]},{"dag":248,"ref":"Psalms 102 – 104","titel":"\"Loof die Here, my Siel, en Vergeet nie Een van sy Weldade nie\"","fase":5,"tydlyn":"Psalm 102 ('n gebed van 'n ellendige, moontlik in ballingskap), 103 (Dawid), 104 (die skepping).","agtergrond":"Psalm 102 is die gebed van iemand wat ly en wie se dae soos 'n skaduwee verdwyn, maar wat God se ewigheid en Sion se herstel bely; Hebreërs 1:10–12 pas 102:25–27 op Jesus toe. Psalm 103 is een van die mooiste lofpsalms in die Bybel: Dawid praat met sy eie siel en somme die weldade van God op. Psalm 104 is 'n gedig oor die skepping wat die volgorde van Genesis 1 volg – lig, hemel, waters, aarde, plante, son en maan, diere, mens – en God se voortgaande sorg vir alles wat lewe.","leer":"Ons moet doelbewus onthou wat God vir ons gedoen het, want ons vergeet so maklik. God vergewe, genees, verlos en kroon ons met liefde. Hy is soos 'n vader wat Hom ontferm oor sy kinders, en Hy onthou dat ons stof is. Die hele skepping wys Sy wysheid en sorg – en Hy voed elke skepsel op die regte tyd.","skrif":"Psalm 102: \"Ek is soos 'n eensame voël op die dak\"; \"Maar U bly dieselfde, en u jare het geen einde nie.\" Psalm 103: \"Loof die Here, o my siel, en vergeet nie een van sy weldade nie! Wat al jou ongeregtighede vergewe, wat al jou krankhede genees\"; \"Barmhartig en genadig is die Here, lankmoedig en groot van goedertierenheid\"; \"So ver as die ooste verwyderd is van die weste, so ver verwyder Hy ons oortredinge van ons\"; \"Soos 'n vader hom ontferm oor die kinders, so ontferm die Here Hom oor die wat Hom vrees. Want Hy ken ons maaksel; Hy dink daaraan dat ons stof is.\" Psalm 104: \"Hoe talryk is u werke, o Here! U het hulle almal met wysheid gemaak\"; \"Hulle almal wag op U.\"","bid":"Laat elkeen een \"weldaad\" noem wat God vir hom of haar gedoen het, en loof God daarvoor (Psalm 103:2). Dank God dat Hy ons sonde so ver verwyder as die ooste van die weste. Loof Hom vir die skepping.","vraag":"Psalm 103:2 sê \"vergeet nie een van Sy weldade nie\". Noem drie dinge wat God vir jou gedoen het wat jy nie wil vergeet nie.","hoofstukke":[["Psalms","PSA",102],["Psalms","PSA",103],["Psalms","PSA",104]]},{"dag":249,"ref":"Psalms 105 – 106","titel":"God se Trou en Israel se Ontrou","fase":5,"tydlyn":"Psalms wat die geskiedenis van Israel vertel. Psalm 106 eindig Boek IV met 'n gebed om uit die nasies versamel te word – 'n gebed van die ballingskap.","agtergrond":"Psalm 105 en 106 vertel dieselfde geskiedenis van twee kante. Psalm 105 vertel God se trou: Sy verbond met Abraham, Josef, die plae, die uittog en die gawe van die land. Psalm 106 vertel Israel se ontrou: die goue kalf, die murmurering, Baäl-Peor, die afgodery in Kanaän – en tog het God telkens geluister wanneer hulle roep. Gedeeltes van Psalm 105 en 106 word in 1 Kronieke 16 aangehaal in die lied wat by die koms van die ark na Jerusalem gesing is.","leer":"God se trou aan Sy verbond is groter as ons ontrou. Om die geskiedenis eerlik te onthou – God se goedheid en ons eie sonde – lei tot dank, belydenis en hoop. God red \"om Sy Naam ontwil\". Selfs in ballingskap kan ons bid dat God ons weer sal versamel.","skrif":"Psalm 105: \"Loof die Here, roep sy Naam aan, maak onder die volke sy dade bekend\"; \"Soek die Here en sy sterkte, soek gedurigdeur sy aangesig\"; \"Hy dink vir ewig aan sy verbond\"; Josef \"is as slaaf verkoop... totdat sy woord uitgekom het.\" Psalm 106: \"Ons het gesondig saam met ons vaders\"; \"Tog het Hy hulle verlos om sy Naam ontwil\"; \"Hulle het sy werke gou vergeet\"; \"Hulle het die heerlikheid van God verruil vir die beeld van 'n bees wat gras eet\"; \"Verlos ons, o Here onse God, en versamel ons uit die nasies\"; \"Geloofd sy die Here, die God van Israel, van ewigheid tot ewigheid! En laat die hele volk sê: Amen!\"","bid":"Dank God vir Sy trou, ook wanneer ons ontrou was. Bely eerlik ons sonde. Bid vir Jode en vir alle mense wat ver van God af is, dat Hy hulle sal \"versamel\".","vraag":"Psalm 105 vertel God se trou en Psalm 106 die volk se ontrou – oor dieselfde geskiedenis. Hoe sou jou \"Psalm 105\" en jou \"Psalm 106\" lyk?","hoofstukke":[["Psalms","PSA",105],["Psalms","PSA",106]]},{"dag":250,"ref":"Esra 1 – 4","titel":"Terug na Jerusalem: Die Altaar en die Fondament","fase":5,"inleiding":["Die Terugkeer: Esra, Haggai, Sagaria, Ester, Nehemia en Maleagi","In 539 v.C. verower Kores die Grote van Persië Babel. In 538 v.C. gee hy die Jode toestemming om terug te keer en die tempel te herbou. Die terugkeer het in verskeie golwe plaasgevind: eers onder Serubbabel (538 v.C.), later onder Esra (458 v.C.) en Nehemia (445 v.C.). Baie Jode het ook in Persië agtergebly – die agtergrond van die boek Ester. Die profete Haggai en Sagaria het die volk aangemoedig om die tempel klaar te bou (520–516 v.C.), en Maleagi, die laaste profeet van die Ou Testament, het teen c. 430 v.C. gepreek.","Die volk is terug in die land, maar daar is geen koning uit Dawid op die troon nie, en hulle is steeds onder vreemde heerskappy. Die Ou Testament eindig met 'n verwagting: God sal Sy boodskapper stuur, en die Here self sal na Sy tempel kom (Maleagi 3:1)."],"tydlyn":"538 v.C. (Kores se dekreet) tot c. 536 v.C. (die fondament van die tempel). Hoofstuk 4 strek tot later teenstand. Babel en Jerusalem.","agtergrond":"Kores se beleid om weggevoerde volke na hulle lande te laat terugkeer en hulle tempels te herbou, word bevestig deur die Kores-silinder. Jesaja het hom by name genoem (Jesaja 44:28). Die eerste groep van sowat 50 000 mense (2:64–65) keer terug onder Serubbabel (van Dawid se lyn) en die hoëpriester Josua (Jesua). Hulle bou eers die altaar, en daarna die fondament van die tempel. Die ou mense wat die eerste tempel geken het, huil, terwyl die jonges jubel. Hoofstuk 4 vat die teenstand saam wat oor die volgende 80 jaar gekom het (4:6–23 handel eintlik oor 'n latere tyd, toe die stadsmure gebou is).","leer":"God beweeg die harte van konings om Sy beloftes te vervul. Om God te aanbid (die altaar), kom eerste – voor ons eie huise en sekuriteit. Nuwe beginne bring vreugde én hartseer. God se werk word altyd teengestaan, en ons moenie verbaas wees wanneer dit gebeur nie.","skrif":"\"Het die Here die gees van Kores... opgewek\" (1:1). \"Die Here, die God van die hemel... het my opgedra om vir Hom 'n huis te bou in Jerusalem\" (1:2). Kores gee die tempelgereedskap terug (1:7–11). Die lys van die teruggekeerdes (2). Hulle bou die altaar eerste, \"want hulle was bang vir die volke van die lande\" (3:3). Die fondament word gelê (3:10). \"Want Hy is goed, want sy goedertierenheid oor Israel is tot in ewigheid\" (3:11). Die oumense huil en die jonges jubel (3:12–13). Die teëstanders wil saambou, maar met 'n gemengde geloof (4:1–3). Die werk word gestaak (4:24).","bid":"Dank God dat Hy die harte van leiers kan beweeg. Bid dat ons aanbidding (die \"altaar\") eerste sal kom in ons gesin se prioriteite. Bid vir volharding wanneer God se werk teengestaan word.","vraag":"Waarom dink jy het die oumense gehuil terwyl die jonges gejubel het?","hoofstukke":[["Esra","EZR",1],["Esra","EZR",2],["Esra","EZR",3],["Esra","EZR",4]]},{"dag":251,"ref":"Haggai 1 – 2","titel":"\"Let op Julle Weë\": Bou God se Huis","fase":5,"tydlyn":"Die tweede jaar van koning Darius I, 520 v.C. (1:1), van Augustus tot Desember. Jerusalem.","agtergrond":"Ná die eerste entoesiasme was die tempelbou sowat 16 jaar lank gestaak weens teenstand en moedeloosheid. Die volk het intussen hulle eie huise mooi gebou (met panele, 1:4) en gesê \"dis nog nie tyd nie\". Maar dinge het nie goed gegaan nie: swak oeste, geld wat deur 'n \"stukkende beurs\" verdwyn. Haggai roep hulle om eerste God se huis te bou. Die nuwe tempel het eenvoudig gelyk in vergelyking met Salomo s'n, maar God belowe dat die heerlikheid van hierdie huis groter sal wees – Jesus het in hierdie (later deur Herodes uitgebreide) tempel geleer.","leer":"Wanneer ons ons eie belange voor God se werk stel, ervaar ons nie Sy seën nie. God roep ons om eerlik na ons prioriteite te kyk. Wanneer ons gehoorsaam, is God met ons. Moenie die dag van klein beginne verag nie – God se teenwoordigheid maak die verskil, nie die grootte van die gebou nie.","skrif":"\"Hierdie volk sê: Die tyd is nog nie daar nie\" (1:2). \"Is dit vir julle self tyd om in julle betimmerde huise te woon terwyl hierdie huis verwoes lê?\" (1:4). \"Let op julle weë\" (1:5, 7). \"Julle saai baie en bring min in... en wie loon verdien, verdien dit vir 'n stukkende beurs\" (1:6). \"Omdat elkeen van julle hardloop vir sy eie huis\" (1:9). \"Ek is met julle, spreek die Here\" (1:13). \"Wees sterk... en werk, want Ek is met julle\" (2:4). \"Die silwer is myne, en die goud is myne\" (2:8). \"Die heerlikheid van hierdie laaste huis sal groter wees as dié van die eerste\" (2:9). Serubbabel soos 'n seëlring (2:23).","bid":"Vra God om ons prioriteite te toets: kom Sy koninkryk eerste in ons tyd, geld en energie? Bid vir ons kerk se werk. Dank God dat Hy met ons is wanneer ons Sy werk doen.","vraag":"Haggai sê \"let op julle weë\". As jy eerlik na jou week kyk, waar kom God in jou prioriteite?","hoofstukke":[["Haggai","HAG",1],["Haggai","HAG",2]]},{"dag":252,"ref":"Sagaria 1 – 3","titel":"Nagtelike Visioene: God is Jaloers oor Jerusalem","fase":5,"tydlyn":"Die agtste maand van die tweede jaar van Darius, 520 v.C. (1:1) en die 11de maand (1:7). Jerusalem.","agtergrond":"Sagaria was 'n jong priester en profeet, tydgenoot van Haggai (Esra 5:1). In een nag sien hy agt visioene (1:7–6:8) wat die volk bemoedig: God is besig om Jerusalem te herstel. In hoofstuk 3 staan die hoëpriester Josua in vuil klere voor die Engel van die Here, met die Satan (\"die aanklaer\") aan sy regterhand om hom aan te kla. God laat sy vuil klere uittrek en skoon klere aantrek. Die \"Spruit\" (3:8) is weer die Messias (vgl. Jesaja 4:2; Jeremia 23:5).","leer":"God roep Sy volk om terug te keer, en Hy belowe om na hulle terug te keer. Hy is jaloers oor Sy volk en beskerm hulle soos die appel van Sy oog. Wanneer die Satan ons aankla, verwyder God ons sonde en beklee ons met skoon klere – dit is presies wat Jesus vir ons doen. God sal self 'n muur van vuur rondom Sy volk wees.","skrif":"\"Keer terug na My... dan sal Ek na julle terugkeer\" (1:3). \"Ek is ontsaglik jaloers oor Jerusalem\" (1:14). Die man met die meetsnoer (2:1–2). \"Ek sal vir hulle wees 'n vurige muur rondom\" (2:5). \"Wie julle aanraak, raak sy oogappel aan\" (2:8). \"Baie nasies sal hulle by die Here aansluit in dié dag\" (2:11). Josua in vuil klere, die Satan aan sy regterhand (3:1). \"Is hierdie man nie 'n stuk hout wat uit die vuur geruk is nie?\" (3:2). \"Trek die vuil klere van hom uit... Kyk, Ek het jou ongeregtigheid van jou weggeneem en jou met feesklere beklee\" (3:4). \"Ek sal my kneg, die Spruit, laat kom\" (3:8).","bid":"Dank God dat Hy ons sondige \"vuil klere\" wegneem en ons met die geregtigheid van Jesus beklee. Dank Hom dat ons die \"appel van Sy oog\" is. Bid vir mense wat hulself as \"te vuil\" vir God beskou.","vraag":"Toe die Satan Josua aankla, het God nie met die Satan gestry oor Josua se sonde nie, maar dit weggeneem. Wat sê dit oor hoe God met ons sonde handel?","hoofstukke":[["Sagaria","ZEC",1],["Sagaria","ZEC",2],["Sagaria","ZEC",3]]},{"dag":253,"ref":"Sagaria 4 – 6","titel":"\"Nie deur Krag nie, maar deur My Gees\"","fase":5,"tydlyn":"520–519 v.C. Jerusalem.","agtergrond":"In die vyfde visioen sien Sagaria 'n goue kandelaar en twee olyfbome wat dit van olie voorsien – Serubbabel (die goewerneur, van Dawid se lyn) en Josua (die hoëpriester). Die tempelbou het onmoontlik gelyk: min mense, min geld, baie teenstand. God se boodskap aan Serubbabel is dat dit nie deur menslike krag gedoen sal word nie. In hoofstuk 6 word 'n kroon op die hoëpriester Josua se kop gesit, en hy word die \"Spruit\" genoem wat priester én koning sal wees – iets wat net in Jesus vervul word (Hebreërs 7).","leer":"God se werk word nie deur menslike mag of krag gedoen nie, maar deur Sy Gees. Ons moet nie die \"dag van klein dinge\" verag nie – klein beginne in God se hande word groot. God sal die sonde uit Sy land verwyder. Jesus is die volmaakte Priester-Koning.","skrif":"Die goue kandelaar en twee olyfbome (4:2–3). \"Nie deur krag of deur geweld nie, maar deur my Gees, sê die Here van die leërskare\" (4:6). \"Wie is jy, o groot berg? Voor Serubbabel word jy 'n gelykte\" (4:7). \"Wie verag die dag van klein dinge?\" (4:10). Die vlieënde boekrol (5:1–4). Die vrou in die efa (sonde) word na Sinear (Babel) weggeneem (5:5–11). Die vier strydwaens (6:1–8). Die kroon op Josua se kop: \"Kyk, 'n man wie se naam Spruit is... hy sal priester wees op sy troon\" (6:12–13).","bid":"Bid dat ons nie op ons eie krag sal staatmaak nie, maar op God se Gees – in skoolwerk, verhoudings en geloof. Bid vir klein beginne in ons lewe en kerk. Dank Jesus dat Hy ons Priester en Koning is.","vraag":"\"Nie deur krag of geweld nie, maar deur my Gees.\" Waar probeer jy iets in eie krag doen wat jy aan God se Gees moet oorgee?","hoofstukke":[["Sagaria","ZEC",4],["Sagaria","ZEC",5],["Sagaria","ZEC",6]]},{"dag":254,"ref":"Sagaria 7 – 8","titel":"Ware Vas en die Beloftes van Herstel","fase":5,"tydlyn":"Die vierde jaar van Darius, 518 v.C. (7:1).","agtergrond":"'n Afvaardiging uit Bet-el vra of hulle moet aanhou om te vas in die vyfde maand (wat hulle 70 jaar lank gedoen het om die verwoesting van die tempel te herdenk). God se antwoord is 'n vraag terug: het julle eintlik vir My gevas, of vir julleself? Hy herinner hulle aan die vorige profete se boodskap: geregtigheid, liefde en sorg vir die swakkes. Hoofstuk 8 bevat tien beloftes van herstel, en eindig met die visioen dat tien mense uit die nasies 'n Jood aan die slip van sy kleed sal vashou en sê: \"Ons wil saam met julle gaan.\"","leer":"Godsdienstige gewoontes is net waardevol as dit uit 'n hart vir God kom en tot liefde vir ander lei. God roep ons om reg te doen, liefde en barmhartigheid te bewys, en nie die swakkes te verdruk nie. God se toekoms vir Sy volk is vol vreugde, vrede en lewe – met oumense en kinders in die strate. Die nasies sal na God se volk toe kom omdat hulle sien God is met hulle.","skrif":"\"Het julle werklik vir My gevas?\" (7:5). \"Spreek eerlike regsuitsprake en bewys liefde en barmhartigheid aan mekaar; en verdruk die weduwee en die wees, die vreemdeling en die ellendige nie\" (7:9–10). \"Hulle het hul hart soos diamant gemaak\" (7:12). \"Oumanne en oumense sal weer sit op die pleine van Jerusalem... en die pleine van die stad sal vol wees van seuns en dogters wat op sy pleine speel\" (8:4–5). \"As dit wonderlik is in die oë van die oorblyfsel van hierdie volk... sou dit ook in my oë wonderlik wees?\" (8:6). \"Laat julle hande sterk wees\" (8:9). \"Spreek die waarheid met mekaar\" (8:16). \"Ons wil saam met julle gaan, want ons het gehoor dat God met julle is\" (8:23).","bid":"Bid dat ons geloofsgewoontes (kerk, gebed, Bybellees) uit 'n hart vir God sal kom. Bid vir die weduwees, wese, vreemdelinge en armes in ons omgewing. Bid dat mense in ons lewe sal sien dat \"God met ons is\" en na Hom aangetrek sal word.","vraag":"In Sagaria 8:23 wil mense saam met God se volk gaan \"omdat God met julle is\". Wat sou maak dat iemand sien God is met jou?","hoofstukke":[["Sagaria","ZEC",7],["Sagaria","ZEC",8]]},{"dag":255,"ref":"Sagaria 9 – 11","titel":"Die Koning op 'n Esel en die Dertig Silwerstukke","fase":5,"tydlyn":"Waarskynlik later in Sagaria se bediening (ná 480 v.C.?). Die presiese datum word bespreek.","agtergrond":"Die tweede helfte van Sagaria (hoofstuk 9–14) is moeiliker om te verstaan, maar word baie in die Nuwe Testament aangehaal oor Jesus se laaste week. 9:9 word vervul wanneer Jesus op 'n eselsvul Jerusalem binnery (Markus 11:1–10; Matteus 21:5). In hoofstuk 11 speel Sagaria die rol van 'n herder wat deur die volk verwerp word; sy loon is 30 silwerstukke – die prys van 'n slaaf (Exodus 21:32) – wat hy in die huis van die Here vir die pottebakker gooi. Matteus 27:9–10 sien dit vervul in Judas se 30 silwerstukke.","leer":"Jesus is die Koning wat nederig kom, op 'n esel, en vrede bring. Hy is die goeie Herder wat deur Sy volk verwerp en vir die prys van 'n slaaf verkoop is. Die volk sonder 'n goeie herder dwaal soos skape. God belowe om Sy volk se gevangenes vry te maak deur die bloed van die verbond.","skrif":"\"Verheug jou baie, o dogter van Sion! Juig, o dogter van Jerusalem! Kyk, jou Koning kom na jou toe; regverdig en 'n Oorwinnaar is Hy; nederig en Hy ry op 'n esel\" (9:9). \"Hy sal aan die nasies vrede aankondig, en sy heerskappy sal wees van see tot see\" (9:10). \"Deur die bloed van jou verbond laat Ek jou gevangenes vry\" (9:11). \"Keer terug na die vesting, julle gevangenes van die hoop\" (9:12). Die volk dwaal \"soos skape omdat daar geen herder is nie\" (10:2). \"Hulle het my loon afgeweeg: dertig silwerstukke\" (11:12). \"Werp dit vir die pottebakker – die heerlike prys waarteen Ek deur hulle geskat is!\" (11:13).","bid":"Dank Jesus dat Hy as nederige Koning gekom het. Dank Hom dat Hy vir ons verwerp en verkoop is. Bid dat ons nooit Jesus vir enigiets sal \"verkoop\" nie.","vraag":"Jesus is vir 30 silwerstukke verkoop – die prys van 'n slaaf. Wat het mense vandag die neiging om Jesus voor te \"verruil\"?","hoofstukke":[["Sagaria","ZEC",9],["Sagaria","ZEC",10],["Sagaria","ZEC",11]]},{"dag":256,"ref":"Sagaria 12 – 14","titel":"\"Hulle sal Opsien na My wat Hulle Deurboor het\"","fase":5,"tydlyn":"Profesieë oor \"dié dag\" – die toekoms.","agtergrond":"Hierdie hoofstukke beskryf 'n toekoms waarin God Jerusalem beskerm, die volk tot berou kom, en God self Koning word oor die hele aarde. 12:10 beskryf hoe die volk sal opsien na Een wat hulle deurboor het en oor Hom sal rou soos oor 'n enigste kind – Johannes haal dit aan by die kruis (Johannes 19:37) en in Openbaring 1:7. 13:7 (\"Slaan die herder, en die skape sal verstrooid word\") haal Jesus aan in die nag toe Hy gevange geneem is (Markus 14:27). Hoofstuk 14 beskryf die dag van die Here, waar die Here op die Olyfberg staan (vgl. Handelinge 1:11–12) en Koning word oor die hele aarde.","leer":"God gee 'n gees van genade en gebede wat mense laat rou oor hulle sonde wanneer hulle Jesus sien wat hulle deurboor het. Uit Sy wonde vloei 'n fontein wat sonde en onreinheid afwas. Die Herder is geslaan sodat die skape gereinig kan word. Die geskiedenis eindig met God as Koning oor alles, en selfs die gewoonste dinge sal \"heilig aan die Here\" wees.","skrif":"\"Oor die huis van Dawid... sal Ek uitgiet die Gees van genade en van gebede, en hulle sal opsien na My wat hulle deurboor het, en oor Hom rouklaag soos die rouklag oor 'n enigste kind\" (12:10). \"In dié dag sal daar 'n fontein geopen wees vir die huis van Dawid... teen sonde en onreinheid\" (13:1). \"Slaan die herder, dat die skape verstrooi kan word\" (13:7). \"Ek sal hulle louter soos 'n mens silwer louter... Hy sal my Naam aanroep, en Ek sal hom antwoord; Ek sal sê: Dit is my volk!\" (13:9). \"Sy voete sal in dié dag staan op die Olyfberg\" (14:4). \"En die Here sal Koning wees oor die hele aarde\" (14:9). \"Op die klokkies van die perde sal staan: HEILIG AAN DIE HERE\" (14:20).","bid":"Dank Jesus dat uit Sy deurboorde liggaam 'n fontein vloei wat ons sonde afwas. Bid vir 'n \"gees van genade en gebede\" oor ons gesin. Bid vir die dag wanneer Jesus Koning sal wees oor die hele aarde, en dat selfs die gewone dinge in ons lewe \"heilig aan die Here\" sal wees.","vraag":"Sagaria 14:20 sê selfs die klokkies van die perde sal \"heilig aan die Here\" wees. Hoe kan gewone dinge in jou lewe \"heilig aan die Here\" wees?","hoofstukke":[["Sagaria","ZEC",12],["Sagaria","ZEC",13],["Sagaria","ZEC",14]]},{"dag":257,"ref":"Esra 5 – 6","titel":"Die Tempel word Voltooi","fase":5,"tydlyn":"520–516 v.C. Die tempel word voltooi in die sesde jaar van Darius, in die maand Adar (6:15) – Maart 515 v.C., sowat 70 jaar ná die verwoesting in 586.","agtergrond":"Aangemoedig deur Haggai en Sagaria hervat Serubbabel en Josua die bou (5:1–2). Tatnai, die Persiese goewerneur, bevraagteken die werk en skryf aan koning Darius. In die argiewe word Kores se oorspronklike dekreet gevind – en Darius beveel nie net dat die werk voortgaan nie, maar dat die koste uit die koninklike skatkis betaal word. Die tempel word ingewy en die Pasga gevier. (Esra 4:8–6:18 is in Aramees geskryf, die amptelike taal van die Persiese Ryk.)","leer":"Wanneer ons God se woord gehoorsaam en aan die werk gaan, open God deure wat ons nie kon voorsien nie. God se beloftes word presies vervul. Vreugde volg op gehoorsaamheid. God kan selfs teenstand omdraai tot hulp.","skrif":"\"Die profete van God was by hulle en het hulle gehelp\" (5:2). \"Maar die oog van hulle God was oor die oudstes van die Jode\" (5:5). \"Ons is die knegte van die God van die hemel en die aarde\" (5:11). Kores se dekreet word gevind (6:1–5). Darius beveel dat die koste betaal word (6:8). Die tempel word voltooi en ingewy met blydskap (6:15–16). Die Pasga word gehou, ook deur dié wat hulle van die onreinheid van die heidene afgesonder het (6:19–21). \"Die Here het hulle bly gemaak\" (6:22).","bid":"Dank God vir die deure wat Hy oopmaak wanneer ons Hom gehoorsaam. Bid vir moed om met God se werk voort te gaan, selfs as dit gestaak is. Dank Hom vir die vreugde van gehoorsaamheid.","vraag":"Die teenstanders se brief het eintlik tot meer hulp gelei. Het jy al gesien hoe God iets slegs ten goede omdraai?","hoofstukke":[["Esra","EZR",5],["Esra","EZR",6]]},{"dag":258,"ref":"Ester 1 – 3","titel":"'n Koningin in Persië en 'n Plan om die Jode Uit te Roei","fase":5,"tydlyn":"Die regering van Ahasveros (Xerxes I, 486–465 v.C.). Die fees in sy derde jaar, 483 v.C. (1:3); Ester word koningin in sy sewende jaar, 479 v.C. (2:16). Susan, die winterhoofstad van Persië.","agtergrond":"Ester speel af onder die Jode wat nie na Jerusalem teruggekeer het nie, in die hart van die Persiese Ryk – die grootste ryk wat die wêreld tot dan toe geken het, van Indië tot Kus. Ahasveros (Xerxes) was die koning wat Griekeland aangeval en in 480 v.C. by Salamis verloor het – tussen die fees van hoofstuk 1 en Ester se kroning. Die boek Ester noem nie een keer die Naam van God nie, maar Sy hand is in elke \"toevallige\" gebeurtenis sigbaar. Haman was 'n Agagiet – moontlik 'n afstammeling van Agag, koning van Amalek (1 Samuel 15), Israel se ou vyand. Mordegai was 'n Benjaminiet, soos koning Saul.","leer":"God werk agter die skerms, selfs wanneer Hy onsigbaar lyk. Hy plaas Sy mense op strategiese plekke. Integriteit beteken soms om nie te buig voor mense nie, al kos dit iets. Hoogmoed en haat kan tot verskriklike planne lei. God se volk word dikwels gehaat juis omdat hulle anders is (3:8).","skrif":"Ahasveros se ses maande lange fees (1:3–4). Koningin Wasti weier om voor die dronk gaste te verskyn (1:10–12). Ester, 'n weeskind, word deur haar neef Mordegai grootgemaak (2:7). Ester vind guns by almal (2:15). Mordegai red die koning se lewe (2:21–23) – maar dit word vergeet. Mordegai buig nie voor Haman nie (3:2). \"Daar is 'n sekere volk... wie se wette verskillend is van dié van elke volk\" (3:8). Die bevel om al die Jode op een dag uit te roei (3:13). \"Die koning en Haman het gaan sit om te drink, maar die stad Susan was verslae\" (3:15).","bid":"Dank God dat Hy aan die werk is, ook wanneer ons Hom nie sien nie. Bid vir Jode en Christene wat vandag gehaat en vervolg word omdat hulle anders is. Bid vir die dogter in ons gesin, en vir die seuns in ons gesin, dat hulle soos Ester en Mordegai integriteit sal hê.","vraag":"God se Naam word nie in Ester genoem nie. Waar sien jy tog Sy hand in hierdie hoofstukke?","hoofstukke":[["Ester","EST",1],["Ester","EST",2],["Ester","EST",3]]},{"dag":259,"ref":"Ester 4 – 7","titel":"\"Wie Weet of Jy nie vir 'n Tyd soos Hierdie\" – die Draai van die Verhaal","fase":5,"tydlyn":"c. 474 v.C. (die 12de jaar van Ahasveros, 3:7). Susan.","agtergrond":"Niemand mag ongenooid voor die Persiese koning verskyn nie, op straf van die dood – tensy hy sy goue septer uitsteek. Ester was dertig dae lank nie geroep nie. Mordegai daag haar uit om haar posisie te gebruik om haar volk te red. Ester vra die Jode om drie dae te vas – wat in die Bybel byna altyd gepaard gaan met gebed. Dan volg 'n reeks \"toevallighede\": die koning kan nie slaap nie, laat die kronieke voorlees, en hoor van Mordegai se onbeloonde daad – net toe Haman kom vra om hom op te hang.","leer":"God plaas ons waar ons is met 'n doel. As ons swyg, sal God Sy plan op 'n ander manier uitvoer, maar ons verloor die voorreg om deel daarvan te wees. Moed beteken om die regte ding te doen, al kan dit ons alles kos. God se tydsberekening is perfek – selfs 'n slapelose nag kan deel van Sy plan wees. Hoogmoed kom voor die val.","skrif":"Mordegai treur in sak en as (4:1). \"As jy in hierdie tyd heeltemal swyg, sal verligting en uitkoms vir die Jode uit 'n ander plek ontstaan... En wie weet of jy nie juis vir 'n tyd soos hierdie tot die koninklike waardigheid gekom het nie?\" (4:14). \"Vas vir my... drie dae lank... en so sal ek na die koning ingaan, wat nie volgens die wet is nie; en as ek omkom, dan kom ek om\" (4:16). Die koning steek die goue septer uit (5:2). Haman bou 'n galg (5:14). \"In dié nag kon die koning nie slaap nie\" (6:1). Haman moet Mordegai self eer (6:10–11). Ester ontmasker Haman (7:3–6). Haman word aan sy eie galg opgehang (7:10).","bid":"Bid vir elkeen van ons kinders dat hulle sal weet dat God hulle \"vir 'n tyd soos hierdie\" geplaas het – in hulle skool, span en vriendekring. Bid vir moed om op te staan vir ander. Dank God dat Hy selfs slapelose nagte gebruik.","vraag":"Mordegai sê: \"Wie weet of jy nie vir 'n tyd soos hierdie\" daar is nie? Waarvoor dink jy het God jou nou op hierdie plek gesit?","hoofstukke":[["Ester","EST",4],["Ester","EST",5],["Ester","EST",6],["Ester","EST",7]]},{"dag":260,"ref":"Ester 8 – 10","titel":"Redding en Purim","fase":5,"tydlyn":"c. 474–473 v.C. Die dertiende dag van die maand Adar (Februarie/Maart). Susan en die hele Persiese Ryk.","agtergrond":"'n Persiese koninklike wet kon nie herroep word nie, so Haman se bevel bly staan. Die koning gee 'n tweede bevel: die Jode mag hulleself verdedig. Die dag wat bedoel was vir hulle vernietiging, word 'n dag van oorwinning. Die Jode neem nie die buit nie (9:10, 15–16) – anders as Saul by Amalek. Die fees van Purim (\"lootjies\", na Haman se lotte, 3:7) word ingestel en word tot vandag deur Jode gevier, met die boek Ester wat hardop gelees word. Mordegai word tweede na die koning.","leer":"God draai die vyand se planne om tot die redding van Sy volk. Die dag van rou word 'n dag van vreugde. Dit is belangrik om God se redding te onthou en te vier, en om dit aan die volgende geslagte oor te dra. Ware leierskap soek die welvaart van die volk en spreek vrede.","skrif":"Ester pleit by die koning (8:3–6). 'n Nuwe bevel gee die Jode die reg om hulleself te verdedig (8:11). \"Vir die Jode was daar lig en vreugde en blydskap en eer\" (8:16). \"Baie van die volke van die land het Jode geword, want die skrik vir die Jode het op hulle geval\" (8:17). \"Die teendeel het gebeur\" (9:1). Hulle het nie die buit geneem nie (9:10). Die instelling van Purim – \"dae van vreugde en fees, en om aan mekaar porsies te stuur en geskenke aan die armes\" (9:22). Mordegai \"het die beste vir sy volk gesoek en vrede gespreek vir sy hele nageslag\" (10:3).","bid":"Dank God vir die maniere waarop Hy al in ons gesin se lewe dinge omgedraai het. Bid dat ons Sy redding sal onthou en vier. Bid vir leiers wat, soos Mordegai, die beste vir hulle volk soek.","vraag":"Ester 9:1 sê \"die teendeel het gebeur\" – die slegte plan is omgedraai. Hoe wys die kruis en die opstanding van Jesus die grootste \"omdraai\" van alles?","hoofstukke":[["Ester","EST",8],["Ester","EST",9],["Ester","EST",10]]},{"dag":261,"ref":"Esra 7 – 8","titel":"Esra, die Skrifgeleerde: Hand van God op Hom","fase":5,"tydlyn":"Die sewende jaar van Artasasta (Artaxerxes I), 458 v.C. (7:7). Esra lei 'n tweede groep terug van Babel na Jerusalem; die reis duur vier maande (7:9).","agtergrond":"Sowat 58 jaar ná die voltooiing van die tempel (en ná die gebeure in Ester) keer Esra terug. Hy was 'n priester en 'n \"skrifgeleerde, ervare in die wet van Moses\". Die Persiese koning gee hom gesag om die wet van God in die provinsie toe te pas, en gee ryklik vir die tempel. Esra was skaam om die koning vir 'n militêre begeleiding te vra, omdat hy vertel het dat God se hand oor Sy mense is – daarom vas en bid hulle vir 'n veilige reis met 'n groot hoeveelheid silwer en goud.","leer":"Esra se lewe het 'n duidelike volgorde: hy het sy hart daarop gerig om God se wet te ondersoek, dit te doen, en dit dan aan ander te leer. Die \"hand van God\" rus op dié wat Hom soek. Ons getuienis oor God se beskerming moet ons optrede bepaal. Gebed en vas is 'n kragtige voorbereiding vir 'n groot taak.","skrif":"\"Esra... was 'n skrifgeleerde, ervare in die wet van Moses\" (7:6). \"Volgens die goeie hand van sy God oor hom\" (7:9). \"Want Esra het sy hart daarop gerig om die wet van die Here te ondersoek en te doen, en om in Israel insetting en verordening te leer\" (7:10). Artasasta se brief (7:12–26). \"Geloofd sy die Here... wat dit in die hart van die koning gegee het\" (7:27). Esra vind geen Leviete nie, en roep hulle (8:15–20). \"Ek het my geskaam om van die koning 'n leërmag... te vra\" (8:22). \"So het ons gevas en hieroor van onse God gesoek, en Hy het Hom deur ons laat verbid\" (8:23). Hulle kom veilig aan (8:31–32).","bid":"Bid Esra 7:10 oor elkeen van ons: dat ons God se Woord sal ondersoek, doen en aan ander leer. Bid vir die \"goeie hand van God\" oor elke kind se toekoms. Bid vir beskerming op reis.","vraag":"Esra het eers die Woord ondersoek, dan gedoen, en dan geleer. Waarom is daardie volgorde belangrik?","hoofstukke":[["Esra","EZR",7],["Esra","EZR",8]]},{"dag":262,"ref":"Esra 9 – 10","titel":"Die Pyn van Kompromie en Ware Berou","fase":5,"tydlyn":"458–457 v.C. Jerusalem.","agtergrond":"Kort ná Esra se aankoms hoor hy dat baie van die teruggekeerdes, insluitend priesters en leiers, getrou het met vroue van die omliggende volke wat ander gode aanbid het – presies die sonde wat Salomo se val veroorsaak het en tot die ballingskap gelei het. Die probleem was nie etnisiteit nie (Rut en Ragab was buitelanders wat die Here aangeneem het), maar afgodery: die geloof van die volk was in gevaar. Esra se reaksie is diepe rou en 'n gebed van skuldbelydenis. Die oplossing (om die huwelike te ontbind, hoofstuk 10) was 'n pynlike, eenmalige maatreël in 'n spesifieke situasie; die Nuwe Testament gee ander riglyne vir gelowiges in gemengde huwelike (1 Korintiërs 7:12–16). (Gesels ouderdomsgepas en sensitief.)","leer":"Sonde is ernstig, en ware leiers treur daaroor. Kompromie in verhoudings kan 'n hele gemeenskap se geloof ondermyn. Esra se gebed wys ware berou: hy identifiseer hom met die volk se skuld (\"ons\"), erken God se regverdigheid, en gooi hom op God se genade. Berou lei tot dade, al is dit moeilik.","skrif":"\"Die heilige saad het hulle vermeng met die volke van die lande\" (9:2). Esra skeur sy klere, trek sy hare uit en sit verslae (9:3). \"My God, ek skaam my... want ons ongeregtighede het vermeerder tot oor die hoof\" (9:6). \"U het ons minder gestraf as wat ons ongeregtighede verdien het\" (9:13). \"Here, God van Israel, U is regverdig\" (9:15). \"Daar is nog hoop vir Israel in hierdie saak\" (10:2). \"Maak dan nou belydenis aan die Here... en doen sy welbehae\" (10:11).","bid":"Bid vir harte wat oor sonde treur. Bid dat ons kinders eendag maats sal kies wat die Here liefhet en hulle geloof sal versterk. Bid vir mense in moeilike huwelike, en vir wysheid en genade.","vraag":"Esra het gebid \"ons het gesondig\", al het hy dit nie self gedoen nie. Waarom is dit belangrik om ons met ons gemeenskap se sonde te identifiseer?","hoofstukke":[["Esra","EZR",9],["Esra","EZR",10]]},{"dag":263,"ref":"Nehemia 1 – 3","titel":"Die Muur Herbou: Gebed, Planne en Spanwerk","fase":5,"tydlyn":"Die maand Kislev (Desember) van die 20ste jaar van Artasasta, 446 v.C. (1:1), en Nisan (Maart/April) 445 v.C. (2:1). Susan en Jerusalem.","agtergrond":"Nehemia was die koning se skinker – 'n posisie van groot vertroue, want hy het die koning se wyn geproe om vergiftiging te voorkom. Hy hoor dat Jerusalem se mure nog in puin lê; sonder mure was 'n stad weerloos en verneder. Hy bid en vas vier maande lank, en wanneer die koning vra waarom hy hartseer lyk, bid hy kort en vra vir verlof, materiaal en briewe. Sanballat (goewerneur van Samaria – sy naam word ook in die Elefantine-papiri van c. 407 v.C. genoem) en Tobia is van die begin af teen hom. Hoofstuk 3 lys die families wat elkeen 'n deel van die muur bou – dikwels die deel voor hulle eie huis.","leer":"Nehemia wys hoe 'n mens se hart gebreek kan word oor wat God se hart breek, en hoe gebed en beplanning saamgaan. Hy bid lank in die geheim, en kort in die oomblik. Hy maak 'n eerlike inspeksie voordat hy begin. God se werk word gedoen wanneer elkeen sy deel doen – selfs die dogters (3:12). Teenstand en spot is te verwagte.","skrif":"\"Toe ek hierdie woorde hoor, het ek gaan sit en geween en dae lank getreur; en ek het gevas en gebid\" (1:4). Nehemia bely die sonde van die volk (1:6–7). \"Toe het ek tot die God van die hemel gebid, en vir die koning gesê...\" (2:4–5). \"Volgens die goeie hand van my God oor my\" (2:8). Hy inspekteer die mure snags (2:12–15). \"Kom, laat ons die muur van Jerusalem bou\" (2:17). \"Die God van die hemel, Hy sal dit vir ons laat geluk\" (2:20). Elke familie bou 'n deel (3:1–32), \"hy en sy dogters\" (3:12). Die edeles van Tekoa \"het hul nek nie onder die diens van hulle Here gebring nie\" (3:5).","bid":"Bid dat ons harte gebreek sal word oor die dinge wat God se hart breek. Bid vir die moed om, soos Nehemia, 'n behoefte raak te sien en iets daaraan te doen. Bid dat ons as gesin elkeen sy deel sal doen.","vraag":"Nehemia het eers gehuil en gebid voordat hy gehandel het. Watter \"muur\" in jou skool of gemeenskap lê in puin, en wat kan jy daaromtrent doen?","hoofstukke":[["Nehemia","NEH",1],["Nehemia","NEH",2],["Nehemia","NEH",3]]},{"dag":264,"ref":"Nehemia 4 – 6","titel":"Teenstand van Buite en van Binne – Klaar in 52 Dae","fase":5,"tydlyn":"445 v.C. Jerusalem. Die muur word klaar op die 25ste van Elul (Augustus/September), ná 52 dae (6:15).","agtergrond":"Die teenstanders probeer alles: spot, dreigemente van aanval, en later persoonlike aanvalle en valse gerugte teen Nehemia. Die werkers word moeg en bang. Nehemia reageer met gebed én praktiese wagte. Intussen is daar 'n krisis van binne: ryk Jode buit hul arm broers uit met rente en skuldslawerny, sodat hulle hul kinders as slawe moes verkoop – presies wat die wet verbied het (Levitikus 25). Nehemia konfronteer hulle, en hy weier self om sy reg as goewerneur op kos te gebruik.","leer":"Wanneer ons God se werk doen, kom teenstand – van buite (spot en dreigemente) en van binne (sonde en onreg). Ons antwoord is gebed én waaksaamheid. Leiers moet met hulle eie voorbeeld lei en nie hulle posisie misbruik nie. Om op ons taak gefokus te bly en nie deur afleidings van die werk weggelei te word nie, is wysheid.","skrif":"\"Wat doen hierdie magtelose Jode?\" (4:2). \"So het ons die muur gebou... want die volk het lus gehad om te werk\" (4:6). \"Ons het tot onse God gebid en vir hulle 'n wag uitgesit\" (4:9). \"Wees nie bevrees vir hulle nie; dink aan die Here, die grote en die gedugte, en veg vir julle broers, julle seuns en julle dogters\" (4:14). Met die een hand werk en met die ander 'n wapen vashou (4:17). Die geroep van die armes oor die uitbuiting (5:1–5). \"Behoort julle nie te wandel in die vrees van onse God nie?\" (5:9). Nehemia eet nie die goewerneur se brood nie (5:14–18). \"Ek is besig om 'n groot werk te doen, sodat ek nie kan afkom nie\" (6:3). \"Maar nou, versterk my hande!\" (6:9). Die muur klaar in 52 dae, \"want hulle het geweet dat hierdie werk van onse God uitgevoer is\" (6:15–16).","bid":"Bid vir volharding wanneer ons gespot of teengestaan word in ons geloof. Bid dat ons, soos Nehemia, \"besig is met 'n groot werk\" en nie deur afleidings weggetrek word nie. Bid vir regverdigheid teenoor die armes en vir eerlike leiers. Bid: \"Here, versterk ons hande.\"","vraag":"Nehemia het gesê \"Ek is besig met 'n groot werk, ek kan nie afkom nie.\" Watter afleidings trek jou weg van belangrike dinge?","hoofstukke":[["Nehemia","NEH",4],["Nehemia","NEH",5],["Nehemia","NEH",6]]},{"dag":265,"ref":"Nehemia 7 – 9","titel":"Die Wet word Gelees en die Volk Bely","fase":5,"tydlyn":"Die sewende maand (Tisjri – September/Oktober) van 445 v.C. Jerusalem, by die Waterpoort.","agtergrond":"Hoofstuk 7 herhaal die lys van die eerste teruggekeerdes (Esra 2). In hoofstuk 8 vergader die hele volk, mans, vroue en almal wat kan verstaan, en Esra lees die wet van Moses voor van vroegoggend tot middag, terwyl Leviete dit verduidelik (moontlik ook vertaal uit Hebreeus in Aramees, die taal wat die volk toe gepraat het). Die volk huil, maar word gesê om eerder bly te wees en die Huttefees te vier. In hoofstuk 9 vas die volk en bely hulle sonde in 'n lang gebed wat die hele geskiedenis van God se trou en Israel se ontrou deurgaan.","leer":"God se Woord moet duidelik gelees en verduidelik word sodat almal – ook die jonges – dit kan verstaan. Die Woord bring eers oortuiging van sonde, maar dan vreugde: \"die blydskap in die Here is julle sterkte\". Berou kyk eerlik terug op die geskiedenis en erken: God was regverdig, en ons het sleg gedoen. God se genade is groter as ons ontrou.","skrif":"Esra lees die wet \"van die môrelig tot die middag... en die ore van die hele volk was gerig op die wetboek\" (8:3). Die volk staan op toe die boek oopgemaak word (8:5). \"Hulle het uit die boek gelees... duidelik, met verklaring van die sin, sodat hulle die gelese verstaan het\" (8:8). \"Moenie treur nie, want die blydskap in die Here is julle sterkte\" (8:10). Die Huttefees word gevier soos nie sedert Josua se tyd nie (8:17). Die volk bely hulle sonde (9:2). \"U alleen is die Here! U het die hemel gemaak\" (9:6). \"Maar U is 'n God van vergewing, genadig en barmhartig, lankmoedig en groot van goedertierenheid, en U het hulle nie verlaat nie\" (9:17). \"U is regverdig in alles wat oor ons gekom het\" (9:33).","bid":"Dank God dat ons Sy Woord in ons eie taal het en dit kan verstaan. Bid dat die blydskap in die Here ons sterkte sal wees. Bely as gesin waar ons ontrou was, en dank God dat Hy ons nie verlaat het nie.","vraag":"Nehemia 8:10 sê \"die blydskap in die Here is julle sterkte\". Hoe kan vreugde in God 'n bron van krag wees?","hoofstukke":[["Nehemia","NEH",7],["Nehemia","NEH",8],["Nehemia","NEH",9]]},{"dag":266,"ref":"Nehemia 10 – 13","titel":"Beloftes Gemaak – en Beloftes Gebreek","fase":5,"tydlyn":"445 v.C. (hoofstuk 10–12) en c. 432 v.C. (hoofstuk 13, ná Nehemia se terugkeer van 'n besoek aan die koning, 13:6).","agtergrond":"Die volk maak 'n skriftelike verbond om nie met heidene te trou nie, die sabbat te hou, en die tempeldiens met tiendes te ondersteun (hoofstuk 10). 'n Tiende van die volk trek na Jerusalem om die stad te bevolk. Die muur word met twee groot kore ingewy. Maar in hoofstuk 13, ná Nehemia sowat 12 jaar later terugkeer, vind hy dat al die beloftes gebreek is: Tobia (die vyand) woon in 'n kamer in die tempel, die Leviete is nie betaal nie, die sabbat word geskend, en gemengde huwelike het teruggekeer – kinders kan nie eers meer Hebreeus praat nie.","leer":"Dit is maklik om groot beloftes aan God te maak, maar moeilik om dit oor jare te hou. Herlewing moet elke dag volgehou word. Kompromie sluip stadig in. Leiers moet waaksaam bly en sonde ferm aanspreek. Nehemia se gebed – \"Dink aan my, o my God, ten goede\" – wys dat ons uiteindelik net op God se genade kan staatmaak. Die Ou Testament wag nog op 'n Verlosser wat harte werklik verander.","skrif":"Die volk sluit 'n vaste verbond en skryf dit op (9:38; 10:29). \"Ons sal die huis van onse God nie verwaarloos nie\" (10:39). Die inwyding van die muur met vreugde, \"sodat die vreugde van Jerusalem tot in die verte gehoor is\" (12:43). Tobia se kamer in die tempel (13:4–9). Die Leviete is nie betaal nie (13:10). Die sabbat geskend (13:15–22). Kinders kan nie meer Joods praat nie (13:24). \"Het Salomo... nie daardeur gesondig nie?\" (13:26). \"Dink aan my, o my God, ten goede!\" (13:31).","bid":"Bid vir getrouheid oor die lang termyn – nie net groot oomblikke van toewyding nie. Bid dat ons gesin waaksaam sal bly teen klein kompromieë wat insluip. Bid Nehemia se gebed: \"Dink aan ons, o God, ten goede.\"","vraag":"Die volk het groot beloftes gemaak, maar 12 jaar later was dit gebreek. Wat help 'n mens om getrou te bly oor die lang termyn?","hoofstukke":[["Nehemia","NEH",10],["Nehemia","NEH",11],["Nehemia","NEH",12],["Nehemia","NEH",13]]},{"dag":267,"ref":"Maleagi 1 – 4","titel":"\"Ek het Julle Lief\" – Die Laaste Woord van die Ou Testament","fase":5,"tydlyn":"c. 440–430 v.C., omtrent dieselfde tyd as Nehemia (dieselfde probleme: swak offers, gemengde huwelike, tiendes). Jerusalem.","agtergrond":"Maleagi (\"my boodskapper\") is die laaste profeet van die Ou Testament. Die tempel staan, maar die volk is geestelik koud en sinies. Die boek is opgebou in 'n reeks gesprekke: God maak 'n stelling, die volk vra \"Waarin?\", en God antwoord. Die priesters offer blinde en siek diere; mans skei van hulle vrouens; mense steel van God deur nie die tiende te gee nie; en hulle sê dit help nie om God te dien nie. Maar God belowe 'n boodskapper wat die weg sal voorberei (Johannes die Doper, Markus 1:2) en dat die Here self na Sy tempel sal kom. (In die 1933/53 het Maleagi vier hoofstukke; in die Hebreeuse Bybel is hoofstuk 4 deel van hoofstuk 3.) Ná Maleagi was daar sowat 400 jaar lank geen profeet in Israel nie – tot Johannes die Doper.","leer":"God begin met Sy liefde: \"Ek het julle lief.\" Ons moet God ons beste gee, nie ons oorskiet nie. God haat egskeiding en ontrouheid in die huwelik. Hy roep ons om Hom te toets met ons gee. God sien en onthou dié wat Hom vrees – hulle is Sy \"eiendom\". Die Ou Testament eindig met 'n belofte: die Son van geregtigheid sal opgaan, en die harte van vaders en kinders sal na mekaar gedraai word.","skrif":"\"Ek het julle liefgehad, sê die Here; maar julle sê: Waarin het U ons liefgehad?\" (1:2). \"As Ek 'n Vader is, waar is my eer?\" (1:6). \"As julle 'n blinde dier bring om te offer, is dit nie verkeerd nie?\" (1:8). \"Want van die opgang van die son tot sy ondergang sal my Naam groot wees onder die nasies\" (1:11). \"Ek haat egskeiding\" (2:16). \"Kyk, Ek stuur my boodskapper, dat hy die weg voor my aangesig kan berei; en skielik sal na sy tempel kom die Here\" (3:1). \"Ek, die Here, het nie verander nie\" (3:6). \"Sal 'n mens God beroof? Tog beroof julle My\" – in die tiendes (3:8). \"Beproef My tog hierin... of Ek nie vir julle die vensters van die hemel sal oopmaak nie\" (3:10). \"'n Gedenkboek is voor sy aangesig geskrywe vir die wat die Here vrees\" (3:16). \"Vir julle wat my Naam vrees, sal die son van geregtigheid opgaan met genesing onder sy vleuels\" (4:2). \"Kyk, Ek stuur vir julle die profeet Elia voordat die groot en vreeslike dag van die Here kom. En hy sal die hart van die vaders terugbring tot die kinders en die hart van die kinders tot hulle vaders\" (4:5–6).","bid":"Dank God dat Hy ons liefhet. Bid dat ons God ons beste sal gee – tyd, talente en geld – nie ons oorskiet nie. Bid vir die huwelike in ons familie. Bid Maleagi 4:6 oor ons gesin: dat God die harte van Pappa en die kinders na mekaar sal draai.","vraag":"Die laaste woorde van die Ou Testament gaan oor vaders en kinders wie se harte na mekaar gedraai word. Waarom dink jy is dit so belangrik vir God?","hoofstukke":[["Maleagi","MAL",1],["Maleagi","MAL",2],["Maleagi","MAL",3],["Maleagi","MAL",4]]},{"dag":268,"ref":"Psalms 107 – 109","titel":"\"Laat die Verlostes van die Here So Sê\"","fase":5,"inleiding":["Psalms 107–150 (Boek V): Dankie vir die Terugkeer","Boek V begin met Psalm 107: \"Laat die verlostes van die Here so sê, wat Hy... uit die lande versamel het\" – 'n antwoord op die gebed van Psalm 106:47. Dit bevat die \"Pelgrimsliedere\" (Psalm 120–134), wat die volk gesing het op pad na Jerusalem vir die feeste, Psalm 119 (die langste hoofstuk in die Bybel, oor God se Woord), en eindig met vyf \"Halleluja\"-psalms (146–150). Die hele Psalmboek begin met 'n seën (Psalm 1) en eindig met lof (Psalm 150)."],"tydlyn":"Boek V begin. Psalm 107 kyk terug op die terugkeer uit die ballingskap; 108–109 aan Dawid toegeskryf.","agtergrond":"Psalm 107 beskryf vier groepe mense in nood: dwalers in die woestyn, gevangenes in die donker, siekes weens hulle eie dwaasheid, en seevaarders in 'n storm. Telkens herhaal die refrein: \"Toe het hulle in hul benoudheid na die Here geroep, en Hy het hulle uit hul angste gered\", gevolg deur 'n oproep om God te loof. Psalm 109 is 'n \"vloekpsalm\" – 'n gebed teen 'n valse aanklaer; Petrus pas 109:8 op Judas toe (Handelinge 1:20). Sulke psalms leer ons om ons woede oor onreg eerlik na God te bring en die oordeel aan Hom oor te laat, terwyl Jesus ons leer om vir ons vyande te bid.","leer":"Wat ons nood ook al is – verlorenheid, gevangenskap, siekte of storm – God hoor wanneer ons roep. En die verlostes moet dit hardop sê: \"Hy is goed.\" Wanneer ons vals beskuldig word, kan ons ons saak aan God toevertrou.","skrif":"Psalm 107: \"Loof die Here, want Hy is goed, want sy goedertierenheid is tot in ewigheid! Laat die verlostes van die Here so sê\"; \"Toe het hulle in hul benoudheid na die Here geroep, en Hy het hulle uit hul angste gered\" (die refrein); \"Hy het die dorstige siel versadig\"; \"Hy het sy woord gestuur en hulle gesond gemaak\"; \"Hy het die storm tot stilte gebring\" (vgl. Jesus in Markus 4:39). Psalm 108: \"My hart is vas, o God; ek wil sing.\" Psalm 109: \"Maar ek is net gebed\"; \"Help my, o Here my God! verlos my na u goedertierenheid.\"","bid":"Laat elkeen 'n tyd onthou toe hy of sy na God geroep het en Hy gehelp het – en \"sê dit\" hardop as lof. Bid vir mense wat verlore, gevange, siek of in 'n storm is. Bid vir dié wat vals beskuldig word.","vraag":"Psalm 107 sê \"Laat die verlostes van die Here so sê.\" Waarom is dit belangrik om hardop te vertel wat God gedoen het?","hoofstukke":[["Psalms","PSA",107],["Psalms","PSA",108],["Psalms","PSA",109]]},{"dag":269,"ref":"Psalms 110 – 114","titel":"Priester vir Ewig volgens die Orde van Melgisedek","fase":5,"tydlyn":"Psalm 110 (Dawid); 111–114 lofpsalms (113–118 is die \"Egiptiese Hallel\", wat Jode by die Paasmaaltyd sing).","agtergrond":"Psalm 110 is die psalm wat die meeste in die Nuwe Testament aangehaal word. Jesus het dit gebruik om te wys dat die Messias meer is as net Dawid se seun – Dawid noem Hom \"my Here\" (Markus 12:35–37). Hebreërs gebruik 110:4 om te wys dat Jesus 'n ewige Hoëpriester is volgens die orde van Melgisedek (Genesis 14). Psalm 113–118 is waarskynlik die \"lofsang\" wat Jesus en Sy dissipels aan die einde van die laaste Paasmaaltyd gesing het (Markus 14:26). Psalm 114 vier die uittog.","leer":"Jesus is Koning én Priester – Hy sit aan die regterhand van God, en Hy tree vir ons in. Die vrees van die Here is die begin van wysheid. God, wat so hoog verhewe is, buig af om die armes en die kinderloses op te tel. Die hele skepping bewe voor Hom.","skrif":"Psalm 110: \"Die Here het tot my Here gespreek: Sit aan my regterhand, totdat Ek u vyande maak 'n voetbank vir u voete\"; \"U is priester vir ewig volgens die orde van Melgisedek.\" Psalm 111: \"Die vrees van die Here is die beginsel van die wysheid.\" Psalm 112: \"Welgeluksalig is die man wat die Here vrees\"; \"Vir slegte tyding vrees hy nie; sy hart is vas.\" Psalm 113: \"Wie is soos die Here onse God... wat die geringe ophef uit die stof.\" Psalm 114: \"Toe Israel uit Egipte trek... het die see dit gesien en gevlug.\"","bid":"Dank Jesus dat Hy aan die regterhand van God sit en vir ons intree. Bid dat ons harte \"vas\" sal wees en nie vir slegte nuus sal vrees nie (Psalm 112). Dank God dat Hy die geringes ophef.","vraag":"Psalm 112 sê die mens wat God vrees, is nie bang vir slegte nuus nie. Hoe kan 'n hart \"vas\" wees as daar slegte nuus kom?","hoofstukke":[["Psalms","PSA",110],["Psalms","PSA",111],["Psalms","PSA",112],["Psalms","PSA",113],["Psalms","PSA",114]]},{"dag":270,"ref":"Psalms 115 – 118","titel":"\"Die Steen wat die Bouers Verwerp het\"","fase":5,"tydlyn":"Deel van die Egiptiese Hallel (113–118), gesing by die Paasfees. Psalm 117 is die kortste hoofstuk in die Bybel; Psalm 118 is moontlik die laaste lied wat Jesus voor Sy kruisiging gesing het.","agtergrond":"Psalm 115 spot met afgode wat oë het maar nie sien nie. Psalm 116 is 'n persoonlike danklied van iemand wat uit doodsgevaar gered is. Psalm 117 roep al die nasies op om die Here te loof (Paulus haal dit aan in Romeine 15:11). Psalm 118 is 'n feeslied: die skare het \"Hosanna\" (\"red tog!\") en \"geseënd is hy wat kom in die Naam van die Here\" uit hierdie psalm geroep toe Jesus Jerusalem binnegery het (Markus 11:9). Jesus het 118:22 op Homself toegepas (Markus 12:10–11).","leer":"Ons word soos dit wat ons aanbid – daarom moet ons die lewende God aanbid. God hoor en red, en ons reaksie is dank en om ons beloftes na te kom. Jesus is die verwerpte klip wat God die hoeksteen gemaak het. Elke dag is 'n dag wat die Here gemaak het – rede tot vreugde.","skrif":"Psalm 115: \"Nie aan ons nie, o Here, nie aan ons nie, maar aan u Naam gee eer\"; afgode het oë maar sien nie; \"Die wat dit maak, word net soos hulle.\" Psalm 116: \"Ek het die Here lief, want Hy hoor my stem\"; \"Wat sal ek aan die Here vergeld vir al sy weldade aan my?\"; \"Kosbaar is in die oë van die Here die dood van sy gunsgenote.\" Psalm 117: \"Loof die Here, al die nasies!\" Psalm 118: \"Die Here is aan my kant, ek sal nie vrees nie; wat kan 'n mens aan my doen?\"; \"Dit is beter om by die Here te skuil as om op mense te vertrou\"; \"Die steen wat die bouers verwerp het, het 'n hoeksteen geword\"; \"Dit is die dag wat die Here gemaak het; laat ons daarin juig en bly wees\"; \"Geseënd is hy wat kom in die Naam van die Here.\"","bid":"Bid Psalm 115:1: \"Nie aan ons nie, Here, maar aan U Naam die eer.\" Dank Jesus dat Hy die hoeksteen van ons lewe is. Begin môre met Psalm 118:24: \"Dit is die dag wat die Here gemaak het.\"","vraag":"Psalm 115 sê ons word soos dit wat ons aanbid. Wat beteken dit, en wat sê dit oor wat ons die meeste aandag gee?","hoofstukke":[["Psalms","PSA",115],["Psalms","PSA",116],["Psalms","PSA",117],["Psalms","PSA",118]]},{"dag":271,"ref":"Psalms 119","titel":"Die Lang Liefdeslied oor God se Woord","fase":5,"tydlyn":"Die skrywer is onbekend. Dit is die langste hoofstuk in die Bybel (176 verse).","agtergrond":"Psalm 119 is 'n meesterstuk van Hebreeuse poësie: dit bestaan uit 22 strofes van agt verse elk, een vir elke letter van die Hebreeuse alfabet (Alef, Bet, Gimel...). Al agt verse van 'n strofe begin met dieselfde letter. Byna elke vers noem God se Woord met een van agt sinonieme: wet, getuienisse, bevele, insettinge, gebooie, verordeninge, woord en beloftes. Dit is nie droë reëls nie, maar 'n diep persoonlike gebed van iemand wat God liefhet en daarom Sy Woord liefhet – ook in tye van swaarkry en vervolging. (Dit is 'n lang leesstuk; julle kan dit verdeel of elkeen 'n paar strofes laat lees.)","leer":"God se Woord is die gids, die skat, die troos en die vreugde van 'n mens wat God liefhet. Dit hou ons rein, gee ons lig op ons pad, en is soeter as heuning. Selfs swaarkry kan ons nader aan die Woord bring. Ons kan God vra om ons oë oop te maak sodat ons die wonders van Sy wet raaksien.","skrif":"\"Welgeluksalig is die wat opreg van wandel is\" (119:1). \"Waardeur sal 'n jongman sy pad rein hou? Deur dit te hou volgens u woord\" (119:9). \"Ek het u woord in my hart bewaar, sodat ek teen U nie sou sondig nie\" (119:11). \"Open my oë, dat ek kan aanskou die wonders uit u wet\" (119:18). \"Dit is vir my goed dat ek verdruk is, sodat ek u insettinge kan leer\" (119:71). \"U woord is 'n lamp vir my voet en 'n lig vir my pad\" (119:105). \"Hoe soet is u woorde vir my verhemelte, meer as heuning vir my mond!\" (119:103). \"Die ontsluiting van u woorde gee lig, dit gee verstand aan die eenvoudiges\" (119:130). \"Groot vrede het die wat u wet liefhet\" (119:165). \"Ek dwaal soos 'n verlore skaap; soek u kneg\" (119:176).","bid":"Bid Psalm 119:9–11 oor die seuns in ons gesin, en vir die dogter in ons gesin: dat hulle hul pad rein sal hou deur God se Woord in hulle harte te bewaar. Bid Psalm 119:18: \"Open ons oë.\" Dank God dat Sy Woord 'n lamp vir ons voet is.","vraag":"Psalm 119:9 vra hoe 'n jongmens sy pad rein kan hou. Wat is die antwoord, en hoe lyk dit prakties vir jou?","hoofstukke":[["Psalms","PSA",119]]},{"dag":272,"ref":"Psalms 120 – 125","titel":"Pelgrimsliedere (I): \"Ek Slaan My Oë op na die Berge\"","fase":5,"tydlyn":"Die \"Pelgrimsliedere\" (Hebreeus: \"liedere van die optog\", Psalm 120–134), gesing deur pelgrims op pad na Jerusalem vir die drie jaarlikse feeste.","agtergrond":"Jerusalem lê hoog in die berge van Judea (sowat 750 m bo seevlak), daarom het pelgrims letterlik \"opgegaan\" na Jerusalem. Die reis was lank en gevaarlik – met rowers, hitte en uitputting. Hierdie kort liedere is gesing terwyl hulle loop. Psalm 120 begin ver weg, tussen vyandige mense; Psalm 121 vra waar hulp vandaan kom terwyl die pelgrim die berge sien (waar heiligdomme van afgode dikwels was); Psalm 122 kom by Jerusalem aan.","leer":"Die lewe van 'n gelowige is 'n pelgrimstog na God. Ons hulp kom nie van die berge (of van enige afgod) nie, maar van die Skepper van die berge. Hy slaap nie, en Hy bewaar ons uitgang en ingang. Om saam met ander God se huis toe te gaan, is 'n vreugde. Wie op God vertrou, staan vas soos die berg Sion.","skrif":"Psalm 120: \"In my benoudheid het ek na die Here geroep, en Hy het my verhoor.\" Psalm 121: \"Ek slaan my oë op na die berge: waarvandaan sal my hulp kom? My hulp is van die Here wat hemel en aarde gemaak het\"; \"Kyk, die Bewaarder van Israel sluimer nie en slaap nie\"; \"Die Here sal jou uitgang en jou ingang bewaar van nou af tot in ewigheid.\" Psalm 12

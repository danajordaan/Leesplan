n nie-Jode. Ons moet die evangelie in taal en voorbeelde bring wat die hoorders verstaan. Die mense wat ons vandag aanbid, kan ons môre stenig – ons moet nie op mense se goedkeuring staatmaak nie. \"Deur baie verdrukkinge moet ons in die koninkryk van God ingaan.\"","skrif":"\"Sonder vir My af Barnabas en Saulus vir die werk waartoe Ek hulle geroep het\" (13:2). Hulle vas, bid en lê hulle die hande op (13:3). Paulus se preek in die sinagoge in Antiogië van Pisidië (13:16–41). \"Deur Hom word aan julle vergewing van sondes verkondig\" (13:38). \"Ek het jou gestel tot 'n lig van die heidene\" (13:47; Jesaja 49:6). \"Die dissipels was vol blydskap en die Heilige Gees\" (13:52). Die kreupele in Listra word genees (14:8–10). \"Ons is ook mense net soos julle... ons verkondig aan julle die evangelie dat julle van hierdie nietige dinge jul moet bekeer tot die lewende God\" (14:15). God het Homself nie sonder getuienis gelaat nie – reën en vrugbare tye (14:17). Paulus word gestenig en vir dood gelaat, maar staan op en gaan terug in die stad in (14:19–20). \"Deur baie verdrukkinge moet ons in die koninkryk van God ingaan\" (14:22). Hulle stel oudstes aan en vertel die gemeente \"hoe God vir die heidene die deur van die geloof geopen het\" (14:27).","bid":"Bid vir sendelinge wat oral in die wêreld die evangelie bring – en vir enige sendelinge wat ons ken. Bid vir ons kerk om, soos Antiogië, mense uit te stuur. Bid vir volharding vir Christene wat ly.","vraag":"Paulus is gestenig en het opgestaan en teruggegaan in die stad in. Wat het hom so laat volhard?","hoofstukke":[["Handelinge","ACT",13],["Handelinge","ACT",14]]},{"dag":340,"ref":"Galasiërs 1 – 3","titel":"Geen Ander Evangelie: Gered deur Geloof","fase":7,"tydlyn":"c. 48–49 n.C. (as die brief aan die kerke van die eerste sendingreis in Suid-Galasië gerig is, voor die vergadering in Jerusalem) of c. 53–55 n.C. (as dit aan Noord-Galasië gerig is). Geskryf deur Paulus.","agtergrond":"Ná Paulus se besoek het sekere Joodse Christene (later \"Judaïseerders\" genoem) die Galasiese gelowiges geleer dat nie-Jode ook besny moet word en die wet van Moses moet onderhou om werklik deel van God se volk te wees. Paulus is ontsteld: dit is 'n \"ander evangelie\" wat nie 'n evangelie is nie. Hy verdedig sy apostelskap (hy het die evangelie direk van Jesus ontvang) en vertel hoe hy selfs Petrus in Antiogië in die openbaar teëgestaan het toe Petrus uit vrees vir die Judaïseerders opgehou het om saam met nie-Jode te eet.","leer":"Ons word nie gered deur ons eie werke of die nakoming van godsdienstige reëls nie, maar alleen deur geloof in Jesus Christus. Om iets by die evangelie te voeg, is om dit te vernietig. Christus het vir ons 'n vloek geword sodat ons die seën van Abraham kan ontvang. In Christus is almal gelyk: Jood of Griek, slaaf of vry, man of vrou – almal is een en kinders van God.","skrif":"\"Ek is verwonderd dat julle so gou... oorgaan na 'n ander evangelie\" (1:6). \"As ek nog mense wou behaag, sou ek geen dienskneg van Christus wees nie\" (1:10). \"Ek het dit nie van 'n mens ontvang nie... maar deur 'n openbaring van Jesus Christus\" (1:12). Paulus weerstaan Petrus (2:11–14). \"Die mens word nie geregverdig uit die werke van die wet nie, maar deur die geloof in Jesus Christus\" (2:16). \"Ek is met Christus gekruisig, en ek leef, nie meer ek nie, maar Christus leef in my. En wat ek nou in die vlees lewe, leef ek deur die geloof in die Seun van God, wat my liefgehad en Homself vir my oorgegee het\" (2:20). \"O onverstandige Galasiërs, wie het julle betower?\" (3:1). \"Abraham het God geglo, en dit is hom tot geregtigheid gereken\" (3:6). \"Christus het ons losgekoop van die vloek van die wet deur vir ons 'n vloek te word\" (3:13). Die wet was ons tugmeester tot Christus (3:24). \"Daar is nie meer Jood of Griek nie... want julle is almal een in Christus Jesus\" (3:28).","bid":"Dank God dat ons gered is deur genade, deur geloof – nie deur goed genoeg te wees nie. Bid Galasiërs 2:20 persoonlik. Bid dat ons nooit iets by die evangelie sal voeg of mense op grond van hulle agtergrond sal uitsluit nie.","vraag":"Galasiërs 2:20 sê \"Christus leef in my\". Hoe verander dit die manier waarop jy jou lewe leef?","hoofstukke":[["Galasiërs","GAL",1],["Galasiërs","GAL",2],["Galasiërs","GAL",3]]},{"dag":341,"ref":"Galasiërs 4 – 6","titel":"Vryheid in Christus en die Vrug van die Gees","fase":7,"tydlyn":"c. 48–55 n.C. Geskryf deur Paulus.","agtergrond":"Paulus verduidelik dat God se kinders nie meer slawe onder die wet is nie, maar aangenome seuns en dogters wat God \"Abba\" (\"Pappa\" in Aramees, die huistaal van Jesus) kan noem. Hy gebruik die verhaal van Hagar en Sara (Genesis 16 en 21) as 'n beeld van twee verbonde: slawerny en vryheid. Maar vryheid is nie 'n lisensie om te sondig nie: die Gees en die \"vlees\" (ons sondige natuur) stry teen mekaar. Paulus het die brief self met \"groot letters\" afgesluit (6:11) – moontlik weens swak oë.","leer":"In Christus is ons nie slawe nie, maar kinders en erfgename van God. Ons is geroep tot vryheid – nie om te sondig nie, maar om mekaar in liefde te dien. Wanneer ons deur die Gees lewe, groei die vrug van die Gees in ons – nie deur ons eie inspanning nie, maar soos vrugte aan 'n boom. Ons moet mekaar se laste dra, nie moeg word om goed te doen nie, en weet dat ons oes wat ons saai.","skrif":"\"Toe die volheid van die tyd gekom het, het God sy Seun uitgestuur, gebore uit 'n vrou\" (4:4). \"Omdat julle kinders is, het God die Gees van sy Seun uitgestuur in julle harte, wat roep: Abba, Vader!\" (4:6). \"Jy is nie meer 'n dienskneg nie, maar 'n kind\" (4:7). \"Staan dan vas in die vryheid waarmee Christus ons vrygemaak het\" (5:1). \"Dien mekaar deur die liefde\" (5:13). \"Wandel deur die Gees, en julle sal die begeerlikheid van die vlees nooit volbring nie\" (5:16). Die werke van die vlees (5:19–21). \"Maar die vrug van die Gees is: liefde, blydskap, vrede, lankmoedigheid, vriendelikheid, goedheid, getrouheid, sagmoedigheid, selfbeheersing\" (5:22–23). \"Dra mekaar se laste\" (6:2). \"Wat die mens ook al saai, dit sal hy maai\" (6:7). \"Laat ons nie moeg word om goed te doen nie\" (6:9). \"Mag dit ver van my wees om in iets anders te roem as in die kruis van onse Here Jesus Christus\" (6:14).","bid":"Dank God dat ons Hom \"Abba, Vader\" kan noem. Gaan saam deur die nege vrugte van die Gees en laat elkeen een kies waarin hy of sy wil groei – en bid daarvoor. Bid dat ons mekaar se laste sal dra.","vraag":"Watter een van die vrugte van die Gees (5:22–23) sien jy die meeste in iemand anders in ons gesin? En watter een wil jy self meer van hê?","hoofstukke":[["Galasiërs","GAL",4],["Galasiërs","GAL",5],["Galasiërs","GAL",6]]},{"dag":342,"ref":"Handelinge 15 – 16","titel":"Die Vergadering in Jerusalem en die Evangelie na Europa","fase":7,"tydlyn":"c. 49 n.C. (die vergadering) en c. 49–50 n.C. (die begin van die tweede sendingreis). Jerusalem, Antiogië, Listra, Troas en Filippi (in Masedonië, Noord-Griekeland).","agtergrond":"Die vraag van Galasiërs word nou deur die hele kerk hanteer: moet nie-Jode besny word en die wet van Moses onderhou om gered te word? Petrus, Paulus, Barnabas en Jakobus (die broer van Jesus) praat, en die vergadering besluit: nee, ons word deur genade gered. Die nie-Joodse gelowiges word net gevra om dinge te vermy wat Joodse gelowiges ernstig sou aanstoot gee en die gemeenskap tussen hulle sou belemmer. Paulus en Barnabas verskil oor Markus en gaan uitmekaar. Paulus neem Silas en later die jong Timoteus. Die \"ons\"-gedeeltes begin (16:10) – Lukas self het by hulle aangesluit. Filippi was 'n Romeinse kolonie; Lidia was 'n sakevrou wat duur pers materiaal verkoop het.","leer":"Die kerk los meningsverskille op deur na mekaar te luister, God se werk raak te sien, en die Skrif te raadpleeg. Ons word gered deur die genade van Jesus, ongeag ons agtergrond. Christene kan van mekaar verskil, en God kan selfs dit gebruik om meer mense te bereik. God lei soms deur deure toe te maak. In die donkerste plek (die tronk) kan ons God loof – en dit kan ander na Jesus lei.","skrif":"\"As julle nie besny word nie... kan julle nie gered word nie\" (15:1). Petrus: \"Ons glo dat ons deur die genade van die Here Jesus Christus gered sal word op dieselfde manier as hulle\" (15:11). Jakobus haal Amos 9:11–12 aan (15:16–17). \"Dit het die Heilige Gees en ons goedgedink\" (15:28). Paulus en Barnabas skei weens Markus (15:39). Timoteus sluit aan (16:1–3). Die Gees verhinder hulle om in Asië te preek (16:6–7). Die visioen van die Masedoniër: \"Kom oor na Masedonië en help ons\" (16:9). Lidia: \"Die Here het haar hart geopen\" (16:14). Paulus en Silas word geslaan en in die blok gesit (16:23–24). \"Om middernag het Paulus en Silas gebid en God lofsange gesing, en die gevangenes het na hulle geluister\" (16:25). Die tronkbewaarder: \"Menere, wat moet ek doen om gered te word?\" – \"Glo in die Here Jesus Christus, en jy sal gered word, jy en jou huisgesin\" (16:30–31).","bid":"Bid vir eenheid en wysheid wanneer Christene van mekaar verskil. Bid dat ons, soos Paulus en Silas, God sal loof selfs in die donkerste tye. Bid Handelinge 16:31 oor ons gesin: \"Glo in die Here Jesus, en jy sal gered word, jy en jou huisgesin.\"","vraag":"Paulus en Silas het in die tronk gesing nadat hulle geslaan is. Hoe is dit moontlik om in so 'n situasie te loof?","hoofstukke":[["Handelinge","ACT",15],["Handelinge","ACT",16]]},{"dag":343,"ref":"Handelinge 17 – 18","titel":"Tessalonika, Berea, Atene en Korinte","fase":7,"tydlyn":"c. 50–52 n.C. Tessalonika en Berea (Masedonië), Atene, en Korinte (Agaje, Suid-Griekeland), waar Paulus 18 maande bly.","agtergrond":"In Tessalonika ontstaan 'n kerk in net 'n paar weke voordat Paulus moet vlug – daarom skryf hy hulle later briewe. Die Joodse gemeenskap in Berea ondersoek die Skrif self. Atene was die intellektuele hoofstad van die antieke wêreld, vol tempels en beelde; die Areopagus was die raad (en die heuwel) waar idees bespreek is. Die Epikureërs (wat geleer het dat plesier die hoogste goed is en die gode ver weg is) en Stoïsyne (wat geleer het om met die rede in harmonie met die natuur te leef) luister na Paulus. Hy haal selfs Griekse digters aan. Korinte was 'n ryk, sedeloos hawestad. Priscilla en Akwila was 'n Joodse egpaar wat deur keiser Claudius uit Rome verban is (c. 49 n.C.). Gallio se ampstermyn word deur 'n inskripsie in Delfi bevestig (51–52 n.C.).","leer":"Ons moet, soos die Bereërs, alles wat ons hoor aan die Skrif toets. Paulus bring die evangelie op 'n manier wat sy hoorders verstaan, en begin waar hulle is – maar hy verwater nie die boodskap van die opstanding en oordeel nie. God is nie ver nie; in Hom leef ons. God roep alle mense oral tot bekering. God bemoedig Sy dienaars in tye van vrees: \"Wees nie bevrees nie... Ek is met jou.\"","skrif":"In Tessalonika: \"Hierdie mense wat die wêreld in oproer gebring het\" (17:6). Die Bereërs \"het die woord met alle bereidwilligheid aangeneem en elke dag die Skrifte ondersoek of hierdie dinge so was\" (17:11). In Atene \"het sy gees in hom geprikkel geword toe hy sien dat die stad vol afgode was\" (17:16). \"Aan 'n onbekende God\" (17:23). \"God wat die wêreld gemaak het... woon nie in tempels deur hande gemaak nie\" (17:24). \"Hy het uit een bloed elke nasie van die mense gemaak\" (17:26). \"In Hom leef ons en beweeg ons en bestaan ons\" (17:28). \"God... verkondig nou aan alle mense oral dat hulle hul moet bekeer\" (17:30). Sommige spot, ander glo (17:32–34). In Korinte werk Paulus as tentmaker (18:3). \"Wees nie bevrees nie, maar spreek en moenie swyg nie; want Ek is met jou\" (18:9–10). Priscilla en Akwila verduidelik die weg van God aan Apollos \"noukeuriger\" (18:26).","bid":"Bid dat ons, soos die Bereërs, alles aan die Skrif sal toets – ook wat ons op sosiale media en in die klaskamer hoor. Bid vir Christene in universiteite en plekke van baie idees. Bid vir egpare wat saam in die bediening werk. Bid vir moed om nie te swyg nie.","vraag":"Die Bereërs het \"elke dag die Skrifte ondersoek of hierdie dinge so was\". Hoe kan jy toets of iets wat jy hoor, waar is?","hoofstukke":[["Handelinge","ACT",17],["Handelinge","ACT",18]]},{"dag":344,"ref":"1 Tessalonisense 1 – 3","titel":"'n Jong Kerk wat Skitter","fase":7,"tydlyn":"c. 50–51 n.C., een van Paulus se vroegste briewe. Geskryf uit Korinte, kort nadat Timoteus van Tessalonika teruggekeer het met nuus (3:6).","agtergrond":"Tessalonika was die hoofstad van Masedonië en 'n belangrike hawestad op die Via Egnatia, die groot Romeinse pad. Paulus kon net 'n kort tyd daar bly (Handelinge 17:1–10) voordat hy moes vlug, en hy was bekommerd oor die jong gelowiges wat vervolg is. Timoteus bring goeie nuus: hulle staan vas! Die brief is warm en persoonlik. Paulus verdedig ook sy optrede, want teenstanders het hom beskuldig dat hy vir geld of eer gepreek het.","leer":"Die evangelie kom nie net in woorde nie, maar in krag, in die Heilige Gees en met volle oortuiging. 'n Kerk wat hulle van afgode bekeer het om die lewende God te dien, word 'n voorbeeld vir ander. Ware bediening is opreg, nie vir geld of eer nie, en is soos 'n ma wat haar kinders koester en 'n pa wat hulle aanmoedig. Vervolging is deel van die Christelike lewe.","skrif":"Die werk van die geloof, die arbeid van die liefde en die volharding van die hoop (1:3). \"Ons evangelie het nie net in woorde na julle gekom nie, maar ook in krag en in die Heilige Gees en met volle oortuiging\" (1:5). \"Julle het julle van die afgode tot God bekeer om die lewende en waaragtige God te dien\" (1:9). \"Ons spreek nie om mense te behaag nie, maar God wat ons harte beproef\" (2:4). \"Ons was vriendelik in julle midde, soos 'n voedster wat haar eie kinders koester\" (2:7). \"Soos 'n vader sy kinders... vermaan, bemoedig en besweer\" (2:11–12). \"Julle het die woord van God... aangeneem, nie as die woord van mense nie, maar soos dit waarlik is, as die woord van God\" (2:13). \"Julle is ons heerlikheid en blydskap\" (2:20). \"Mag die Here julle laat toeneem en oorvloedig word in die liefde vir mekaar en vir almal\" (3:12).","bid":"Dank God vir die werk van geloof, liefde en hoop in ons gesin (1:3). Bid vir Pappa en Mamma om soos Paulus te wees – koesterend soos 'n ma, bemoedigend soos 'n pa (2:7, 11). Bid 3:12 oor ons gesin: dat ons sal toeneem in liefde vir mekaar en vir almal.","vraag":"Paulus beskryf goeie leierskap soos 'n ma wat koester en 'n pa wat bemoedig. Hoe kan jy dit doen vir 'n jonger kind of vriend?","hoofstukke":[["1 Tessalonisense","1TH",1],["1 Tessalonisense","1TH",2],["1 Tessalonisense","1TH",3]]},{"dag":345,"ref":"1 Tessalonisense 4 – 5","titel":"Heilig Lewe en Hoop vir dié wat Gesterf het","fase":7,"tydlyn":"c. 50–51 n.C. Geskryf uit Korinte.","agtergrond":"Die Tessalonisense het twee vrae gehad. Eerstens hoe om heilig te lewe in 'n kultuur waar seksuele losbandigheid normaal was (ook in die heidense tempels). Tweedens, wat gebeur met gelowiges wat sterf voordat Jesus terugkom? Sal hulle Sy koms mis? Paulus antwoord met die hoop van die opstanding en die wederkoms. Die woord \"ontmoeting\" (4:17) is die woord wat gebruik is wanneer 'n stad se burgers uitgaan om 'n besoekende keiser buite die stad te ontmoet en hom dan in te begelei.","leer":"God se wil is ons heiligmaking, ook in ons seksualiteit. Ons moet stil lewe, ons eie werk doen, en 'n goeie getuienis teenoor buitestaanders hê. Ons treur oor dié wat gesterf het, maar nie soos mense wat geen hoop het nie, want Jesus het opgestaan en Hy sal terugkom. Ons moet waaksaam lewe, mekaar bemoedig, altyd bly wees, sonder ophou bid en in alles dank.","skrif":"\"Want dit is die wil van God: julle heiligmaking, dat julle jul van hoerery moet onthou\" (4:3). \"Dat elkeen van julle sy liggaam in heiligheid en eer weet te besit\" (4:4). \"God het ons nie geroep tot onreinheid nie, maar tot heiligmaking\" (4:7). \"Stil te lewe en jul met jul eie sake te bemoei en met jul eie hande te werk\" (4:11). \"Dat julle nie bedroef moet wees soos die ander wat geen hoop het nie\" (4:13). \"Die Here self sal met 'n geroep, met die stem van 'n aartsengel en met die basuin van God neerdaal van die hemel, en die dode in Christus sal eerste opstaan... en so sal ons altyd by die Here wees\" (4:16–17). \"Troos mekaar dan met hierdie woorde\" (4:18). \"Die dag van die Here kom soos 'n dief in die nag\" (5:2). \"Bemoedig mekaar en bou mekaar op\" (5:11). \"Wees altyd bly. Bid sonder ophou. Dank God in alles, want dit is die wil van God in Christus Jesus\" (5:16–18). \"Beproef alle dinge; behou die goeie\" (5:21). \"Die God van vrede self mag julle volkome heilig\" (5:23).","bid":"Bid vir reinheid vir ons gesin se kinders in hulle liggame en verhoudings (4:3–7). Bid vir mense wat rou, dat hulle die hoop van die opstanding sal ken. Bid 5:16–18 oor ons gesin: dat ons altyd bly sal wees, sonder ophou bid, en in alles dank.","vraag":"Paulus sê ons moet \"in alles dank\". Is dit moontlik om selfs in moeilike tye te dank? Waarvoor kan jy vandag, selfs in 'n moeilike situasie, dank?","hoofstukke":[["1 Tessalonisense","1TH",4],["1 Tessalonisense","1TH",5]]},{"dag":346,"ref":"2 Tessalonisense 1 – 3","titel":"Volhard tot Jesus Kom – en Werk!","fase":7,"tydlyn":"c. 51 n.C. Geskryf uit Korinte, 'n paar maande ná die eerste brief.","agtergrond":"Die vervolging in Tessalonika het voortgeduur. Daarby het iemand (moontlik met 'n vals brief in Paulus se naam, 2:2) die gelowiges ontstel deur te sê \"die dag van die Here is reeds daar\". Sommige het selfs opgehou werk en net gewag. Paulus verduidelik dat sekere dinge eers moet gebeur, insluitend die verskyning van \"die mens van die wetteloosheid\" – Christene verstaan verskillend wie of wat dit is. Paulus het die brief self onderteken as bewys van egtheid (3:17).","leer":"God is regverdig, en Hy sal reg laat geskied vir dié wat ly. Ons moet nie paniekerig word oor gerugte oor die eindtyd nie, maar vasstaan in wat ons geleer is. Om op Jesus se koms te wag, beteken nie om lui te wees nie: \"As iemand nie wil werk nie, moet hy ook nie eet nie.\" Ons moet nie moeg word om goed te doen nie.","skrif":"\"Julle geloof neem buitengewoon toe\" (1:3). God sal \"aan julle wat verdruk word, verligting gee saam met ons by die openbaring van die Here Jesus\" (1:7). \"Dat julle nie gou geskok word in julle gemoed... asof die dag van Christus al aangebreek het nie\" (2:2). \"Laat niemand julle op enige manier mislei nie\" (2:3). \"Staan dan vas en hou die oorleweringe wat julle geleer is\" (2:15). \"Die Here is getrou, wat julle sal versterk en van die Bose bewaar\" (3:3). \"Die Here mag julle harte lei tot die liefde van God en die lydsaamheid van Christus\" (3:5). \"As iemand nie wil werk nie, moet hy ook nie eet nie\" (3:10). \"Moenie moeg word om goed te doen nie\" (3:13). \"Die Here van die vrede self gee julle altyd vrede op allerlei manier\" (3:16).","bid":"Bid vir vervolgde Christene om te volhard. Bid dat ons nie deur gerugte en vrees oor die toekoms ontstel sal word nie. Bid vir 'n goeie werksetiek vir elkeen – in skoolwerk, take en eendag in hulle beroepe. Dank God dat Hy getrou is en ons van die Bose bewaar.","vraag":"Sommige mense het opgehou werk omdat hulle gedink het Jesus kom binnekort. Waarom is dit nie die regte manier om op Jesus te wag nie?","hoofstukke":[["2 Tessalonisense","2TH",1],["2 Tessalonisense","2TH",2],["2 Tessalonisense","2TH",3]]},{"dag":347,"ref":"Handelinge 19 – 20","titel":"Efese: Die Woord Groei – en Paulus se Afskeid","fase":7,"tydlyn":"c. 52–57 n.C. Die derde sendingreis. Efese (sowat drie jaar, 20:31), Masedonië, Griekeland, Troas en Milete.","agtergrond":"Efese was een van die grootste stede van die Romeinse Ryk en die middelpunt van die aanbidding van die godin Artemis (in Latyn: Diana); haar tempel was een van die sewe wonders van die antieke wêreld. Die stad was ook bekend vir towery en die okkulte. Paulus het daagliks in die lesingsaal van Tirannus geleer, en die evangelie het oor die hele provinsie Asië versprei. Die opstand van die silwersmede onder Demetrius wys hoe die evangelie hulle besigheid bedreig het. Die groot teater waar die skare twee uur lank geskreeu het, het sowat 24 000 plekke gehad en is vandag nog sigbaar. In hierdie tyd skryf Paulus 1 Korintiërs (uit Efese), 2 Korintiërs (uit Masedonië) en Romeine (uit Korinte, 20:2–3).","leer":"Die evangelie verander nie net harte nie, maar ook ekonomie en kultuur – en dit kan teenstand uitlok. Ware bekering lei tot 'n radikale breuk met die okkulte en die verlede. Paulus se afskeidstoespraak wys die hart van 'n ware herder: hy het met trane gewerk, niks teruggehou nie, met sy eie hande gewerk, en sy lewe as niks geag in vergelyking met die voltooiing van sy taak nie. Dit is saliger om te gee as om te ontvang.","skrif":"\"Het julle die Heilige Gees ontvang toe julle gelowig geword het?\" (19:2). Paulus leer twee jaar lank daagliks, \"sodat almal wat in Asië woon... die woord van die Here gehoor het\" (19:10). Die seuns van Skeva (19:13–16). Die towenaars verbrand hulle boeke ter waarde van 50 000 silwerstukke (19:19). \"So het die woord van die Here kragtig gegroei\" (19:20). Demetrius en die oproer: \"Groot is die Artemis van die Efesiërs!\" (19:28, 34). Eutigus val by die venster uit (20:9–12). Paulus se afskeid by Milete (20:17–38): \"Ek het niks teruggehou wat nuttig is nie\" (20:20). \"Ek ag my lewe nie van die minste waarde nie... as ek maar my loopbaan met blydskap kan voleindig\" (20:24). \"Ek het nie teruggedeins om julle die hele raad van God te verkondig nie\" (20:27). \"Gee ag op julleself en op die hele kudde\" (20:28). \"Dit is saliger om te gee as om te ontvang\" (20:35). Hulle huil en soen hom (20:37).","bid":"Bid vir mense wat in die okkulte vasgevang is, dat hulle vry sal word. Bid vir pastore en leiers om ware herders te wees soos Paulus. Bid dat ons as gesin sal leer dat dit \"saliger is om te gee as om te ontvang\".","vraag":"Die mense in Efese het hulle duur towerboeke verbrand toe hulle tot geloof gekom het. Is daar iets in jou lewe wat jy moet \"verbrand\" omdat dit jou van God weghou?","hoofstukke":[["Handelinge","ACT",19],["Handelinge","ACT",20]]},{"dag":348,"ref":"1 Korintiërs 1 – 3","titel":"Verdeeldheid en die Dwaasheid van die Kruis","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf deur Paulus uit Efese (16:8), aan die kerk wat hy c. 50–52 in Korinte gestig het.","agtergrond":"Korinte was 'n ryk hawestad met twee hawens, bekend vir handel, rykdom, trots en seksuele losbandigheid (\"om soos 'n Korintiër te lewe\" was 'n uitdrukking vir sedeloosheid). Die kerk was jonk en vol probleme: groepe wat elk 'n gunsteling-leier gevolg het, trots op wysheid en welsprekendheid, seksuele sonde, hofsake tussen gelowiges, vrae oor die huwelik en voedsel wat aan afgode geoffer is, wanorde in die eredienste, en twyfel oor die opstanding. Paulus het van hierdie dinge gehoor van \"die mense van Chloë\" (1:11) en het ook 'n brief van hulle ontvang (7:1).","leer":"Christene moet nie in groepe rondom menslike leiers verdeel nie – ons behoort almal aan Christus. Die boodskap van die gekruisigde Christus lyk vir die wêreld na dwaasheid en swakheid, maar dit is God se krag en wysheid. God kies die swakkes en geringes sodat niemand voor Hom kan roem nie. Leiers is maar dienaars; God gee die groei. Ons bou ons lewe op die fondament van Jesus, en ons werk sal getoets word.","skrif":"\"Dat julle almal eensgesind moet wees en dat daar geen skeuringe onder julle mag wees nie\" (1:10). \"Is Christus verdeel?\" (1:13). \"Die woord van die kruis is wel vir die wat verlore gaan, 'n dwaasheid; maar vir ons wat gered word, is dit 'n krag van God\" (1:18). \"Ons verkondig Christus as gekruisigde\" (1:23). \"Die dwaasheid van God is wyser as die mense, en die swakheid van God is sterker as die mense\" (1:25). \"God het die dwase dinge van die wêreld uitverkies om die wyse te beskaam\" (1:27). \"Wie roem, moet in die Here roem\" (1:31). \"Wat die oog nie gesien en die oor nie gehoor het nie... wat God berei het vir die wat Hom liefhet\" (2:9). \"Ek het geplant, Apollos het natgegooi, maar God het laat groei\" (3:6). \"Niemand kan 'n ander fondament lê as wat daar gelê is nie, naamlik Jesus Christus\" (3:11). \"Weet julle nie dat julle die tempel van God is en dat die Gees van God in julle woon nie?\" (3:16).","bid":"Bid vir eenheid in ons kerk – dat ons nie volgens gunsteling-leiers of style sal verdeel nie. Dank God dat Hy die swakkes kies. Bid dat elkeen van ons sy of haar lewe op die fondament van Jesus sal bou.","vraag":"Paulus sê ons is God se tempel (3:16). Hoe verander dit die manier waarop ons met ons liggaam en ons lewe omgaan?","hoofstukke":[["1 Korintiërs","1CO",1],["1 Korintiërs","1CO",2],["1 Korintiërs","1CO",3]]},{"dag":349,"ref":"1 Korintiërs 4 – 6","titel":"Getrou soos Rentmeesters, en Julle Liggaam is God s'n","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf uit Efese.","agtergrond":"Die Korintiërs was trots en het gedink hulle het \"aangekom\", terwyl die apostels ly. Paulus noem homself hulle geestelike \"vader\" en stuur Timoteus. In hoofstuk 5 spreek hy 'n skokkende situasie aan: 'n man in die kerk leef saam met sy stiefma, en die kerk is trots op hulle \"verdraagsaamheid\" in plaas daarvan om te treur (let wel: gesels ouderdomsgepas). In hoofstuk 6 kla gelowiges mekaar in heidense howe aan, en sommige het gedink omdat die liggaam nie belangrik is nie, kan hulle die prostitute (ook by die tempels) besoek. Die \"suurdeeg\" (5:6–8) verwys na die Paasfees, wanneer alle suurdeeg uit die huis verwyder moes word.","leer":"Ons is rentmeesters wat getrou moet wees, en net God kan ons harte werklik oordeel. Die kerk moet sonde ernstig opneem en in liefde dissiplineer, met die doel van herstel. Christene moet hulle geskille onder mekaar oplos. Ons is gewas, geheilig en geregverdig – nie meer wie ons was nie. Ons liggaam is die tempel van die Heilige Gees en behoort aan God; daarom moet ons van seksuele sonde wegvlug.","skrif":"\"Wat van rentmeesters vereis word, is dat elkeen getrou bevind word\" (4:2). \"Wat het jy wat jy nie ontvang het nie?\" (4:7). \"Word my navolgers\" (4:16). \"Die koninkryk van God bestaan nie in woorde nie, maar in krag\" (4:20). \"'n Bietjie suurdeeg suur die hele deeg\" (5:6). \"Christus, ons Pasga, is vir ons geslag\" (5:7). \"Is daar dan nie een wyse onder julle nie...?\" (6:5). \"En dit was sommige van julle; maar julle is afgewas, maar julle is geheilig, maar julle is geregverdig in die Naam van die Here Jesus\" (6:11). \"Alle dinge is my geoorloof, maar nie alle dinge is nuttig nie\" (6:12). \"Vlug weg van die hoerery\" (6:18). \"Weet julle nie dat julle liggaam 'n tempel is van die Heilige Gees wat in julle is... en dat julle nie aan julleself behoort nie? Want julle is duur gekoop. Verheerlik God dan in julle liggaam\" (6:19–20).","bid":"Bid dat ons getroue rentmeesters sal wees van alles wat God aan ons toevertrou het. Dank God dat ons \"afgewas, geheilig en geregverdig\" is, ongeag ons verlede. Bid vir ons gesin se kinders dat hulle hulle liggame as God se tempel sal eer en van seksuele sonde sal wegvlug.","vraag":"Paulus sê \"alle dinge is my geoorloof, maar nie alle dinge is nuttig nie\". Wat is iets wat nie verkeerd is nie, maar ook nie nuttig is vir jou geloof nie?","hoofstukke":[["1 Korintiërs","1CO",4],["1 Korintiërs","1CO",5],["1 Korintiërs","1CO",6]]},{"dag":350,"ref":"1 Korintiërs 7 – 8","titel":"Die Huwelik, Enkellopendheid en die Swak Broer","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf uit Efese.","agtergrond":"Die Korintiërs het Paulus vrae in 'n brief gestuur (\"Wat nou betref die dinge waaroor julle aan my geskrywe het\", 7:1). Sommige het gedink seks binne die huwelik is ongeestelik; ander het gewonder of hulle moet skei as die huweliksmaat nie 'n gelowige is nie, of enkellopend moet bly. Paulus maak 'n onderskeid tussen wat die Here gebied het en sy eie apostoliese raad (7:10, 12, 25). Hoofstuk 8 handel oor vleis wat aan afgode geoffer is en daarna in die mark verkoop of by feeste geëet is – 'n groot kwessie in 'n stad vol tempels.","leer":"Die huwelik en enkellopendheid is albei gawes van God, en albei kan God dien. In die huwelik moet man en vrou mekaar liefdevol en onselfsugtig dien. Elkeen moet God dien in die situasie waarin Hy hom geroep het. Kennis maak trots, maar liefde bou op. Ons vryheid moet nooit 'n struikelblok word vir 'n broer of suster met 'n swakker gewete nie.","skrif":"Elke man en vrou moet aan mekaar gee wat hulle verskuldig is (7:3–4). Die getroude moet nie skei nie (7:10–11). Die ongelowige huweliksmaat word geheilig deur die gelowige (7:14). \"God het ons tot vrede geroep\" (7:15). \"Laat elkeen bly in die roeping waarin hy geroep is\" (7:20). Die ongetroude kan onverdeeld vir die Here lewe (7:32–35). \"Die kennis maak opgeblase, maar die liefde stig\" (8:1). \"Daar is maar een God, die Vader, uit wie alle dinge is... en een Here, Jesus Christus\" (8:6). \"Pas op dat hierdie vryheid van julle nie miskien 'n struikelblok word vir die swakkes nie\" (8:9). \"As spys my broeder laat struikel, sal ek in alle ewigheid geen vleis eet nie\" (8:13).","bid":"Bid vir die huwelike in ons familie, dat hulle onselfsugtig en getrou sal wees. Bid vir die toekoms van elke kind – of in die huwelik of enkellopend – dat hulle God onverdeeld sal dien. Bid dat ons ons vryheid in liefde sal gebruik en ander nie sal laat struikel nie.","vraag":"Paulus sê \"kennis maak trots, maar liefde bou op\". Hoe kan iemand wat baie oor die Bybel weet, tog trots en liefdeloos wees?","hoofstukke":[["1 Korintiërs","1CO",7],["1 Korintiërs","1CO",8]]},{"dag":351,"ref":"1 Korintiërs 9 – 11","titel":"Alles vir die Evangelie, Vlug van Afgodery, en die Nagmaal","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf uit Efese.","agtergrond":"Paulus verdedig sy reg as apostel om deur die kerk onderhou te word, maar sê hy het doelbewus nie daarvan gebruik gemaak nie. Korinte het die tweejaarlikse Istmiese Spele aangebied (soos die Olimpiese Spele) – vandaar Paulus se beeld van die atleet wat oefen en hardloop vir 'n krans. In hoofstuk 10 gebruik hy die woestyngeskiedenis van Israel as waarskuwing. Hoofstuk 11 spreek kulturele gebruike in die eredienste aan (kopbedekking – Christene verstaan verskillend hoe dit vandag toegepas moet word) en ernstige misbruik by die Nagmaal: die rykes het hulle eie kos vroeg geëet en die armes, wat later van die werk af gekom het, honger laat bly.","leer":"Ons moet bereid wees om ons regte prys te gee ter wille van die evangelie, en alles vir almal te word sodat sommige gered kan word. Die Christelike lewe vra dissipline, soos 'n atleet. Niemand is te sterk om te val nie, maar God laat ons nie bo ons krag versoek word nie – Hy maak 'n uitweg. Doen alles tot eer van God. Die Nagmaal verkondig die dood van die Here en moet in eenheid en met eerbied gevier word.","skrif":"\"Wee my as ek die evangelie nie verkondig nie!\" (9:16). \"Vir almal het ek alles geword, sodat ek in elk geval sommige kan red\" (9:22). \"Weet julle nie dat die wat in die renbaan hardloop, almal hardloop, maar een die prys ontvang? Hardloop so dat julle dit kan verkry\" (9:24). \"Ek kasty my liggaam en bring dit in onderwerping\" (9:27). \"Hierdie dinge het met hulle gebeur as voorbeelde\" (10:11). \"Laat hy wat meen dat hy staan, oppas dat hy nie val nie\" (10:12). \"Geen versoeking het julle oorval as net 'n menslike nie; maar God is getrou, wat julle nie bo julle krag sal laat versoek word nie, maar saam met die versoeking ook die uitkoms sal gee\" (10:13). \"Vlug weg van die afgodediens\" (10:14). \"Of julle dan eet of drink of watter ander ding ook al doen, doen alles tot eer van God\" (10:31). Die instelling van die Nagmaal: \"Doen dit tot my gedagtenis\" (11:23–25). \"So dikwels as julle hierdie brood eet en hierdie beker drink, verkondig julle die dood van die Here totdat Hy kom\" (11:26). \"Laat elkeen homself beproef\" (11:28).","bid":"Bid vir geestelike dissipline – soos 'n atleet – in ons geloofslewe. Dank God dat Hy getrou is en altyd 'n uitweg gee uit versoeking; bid dat ons dit sal raaksien en neem. Bid 10:31 oor elke dag: \"Alles tot eer van God.\"","vraag":"1 Korintiërs 10:13 sê God gee altyd 'n uitweg uit versoeking. Wat is 'n praktiese \"uitweg\" uit 'n versoeking wat tieners gereeld beleef?","hoofstukke":[["1 Korintiërs","1CO",9],["1 Korintiërs","1CO",10],["1 Korintiërs","1CO",11]]},{"dag":352,"ref":"1 Korintiërs 12 – 14","titel":"Een Liggaam, Baie Gawes – en die Grootste is die Liefde","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf uit Efese.","agtergrond":"Die Korintiërs was trots op opvallende geestelike gawes, veral die spreek in tale, en het hul eredienste chaoties en kompeterend gemaak. Paulus gebruik die beeld van die menslike liggaam: elke deel is anders, maar almal is nodig. Hoofstuk 13 – die bekende \"liefdeshoofstuk\" – staan doelbewus in die middel: sonder liefde is selfs die indrukwekkendste gawes niks werd nie. (Christene verskil oor of sekere gawes, soos tale en profesie, vandag nog op dieselfde manier funksioneer; almal stem saam dat liefde die grootste is en dat gawes vir die opbou van die kerk gegee word.)","leer":"Die Heilige Gees gee elke gelowige gawes – nie vir eie eer nie, maar vir die opbou van die kerk. Elke lid van die liggaam van Christus is nodig, ook die \"swakkes\" en \"onopvallendes\". Die grootste ding is liefde: geduldig, vriendelik, nie jaloers, nie trots, nie selfsugtig nie. Aanbidding moet ordelik wees en ander opbou.","skrif":"\"Daar is verskeidenheid van genadegawes, maar dieselfde Gees\" (12:4). \"Aan elkeen word die openbaring van die Gees gegee tot nut van almal\" (12:7). \"Want ook die liggaam is nie een lid nie, maar baie\" (12:14). \"Die oog kan nie vir die hand sê: Ek het jou nie nodig nie\" (12:21). \"Die lede wat skyn swakker te wees, is juis nodig\" (12:22). \"As een lid ly, ly al die lede saam\" (12:26). \"Julle is die liggaam van Christus, en elkeen afsonderlik lede\" (12:27). \"Al sou ek die tale van mense en engele spreek, en ek het nie die liefde nie, dan het ek 'n klinkende metaal of luidende simbaal geword\" (13:1). \"Die liefde is lankmoedig, die liefde is vriendelik; die liefde is nie jaloers nie... dit soek nie sy eie belang nie, word nie verbitterd nie, reken die kwaad nie toe nie\" (13:4–5). \"Dit bedek alles, glo alles, hoop alles, verdra alles. Die liefde vergaan nooit nie\" (13:7–8). \"En nou bly geloof, hoop, liefde, hierdie drie; maar die grootste hiervan is die liefde\" (13:13). \"Jaag die liefde na\" (14:1). \"Laat alles tot stigting geskied\" (14:26). \"Laat alles welvoeglik en ordelik geskied\" (14:40).","bid":"Dank God vir die gawes wat Hy aan elkeen in ons gesin gegee het – noem dit vir mekaar. Lees 1 Korintiërs 13:4–7 en sit elkeen se naam in die plek van \"die liefde\". Bid dat ons liefde so sal word.","vraag":"Lees 13:4–7 en sit jou eie naam in plek van \"die liefde\". Watter deel is die moeilikste om eerlik waar te maak?","hoofstukke":[["1 Korintiërs","1CO",12],["1 Korintiërs","1CO",13],["1 Korintiërs","1CO",14]]},{"dag":353,"ref":"1 Korintiërs 15 – 16","titel":"Christus het Opgestaan – die Fondament van Alles","fase":7,"tydlyn":"c. 54–55 n.C. Geskryf uit Efese. Die belydenis in 15:3–7 is baie oud: Paulus het dit self \"ontvang\" – waarskynlik binne 'n paar jaar ná die opstanding.","agtergrond":"Sommige in Korinte het gesê \"daar is geen opstanding van die dode nie\" (15:12). Die Griekse kultuur het die liggaam as minderwaardig beskou en net in die onsterflikheid van die siel geglo (as hulle in 'n hiernamaals geglo het). Paulus wys dat die liggaamlike opstanding van Jesus die fondament van die Christelike geloof is, en noem talle ooggetuies – meer as 500 op een slag, van wie die meeste nog gelewe het en ondervra kon word (15:6). Hy verduidelik ook hoe ons opstandingsliggame sal wees. Hoofstuk 16 reël praktiese sake, soos 'n insameling vir die arm gelowiges in Jerusalem.","leer":"Die opstanding van Jesus is 'n historiese feit met getuies, en dit is die hart van die evangelie. As Christus nie opgestaan het nie, is ons geloof sinloos; maar Hy het opgestaan, en daarom sal ons ook opstaan. Die dood is verslind deur die oorwinning. Daarom is ons arbeid in die Here nie tevergeefs nie. Waak, staan vas, wees sterk – en laat alles in liefde gebeur.","skrif":"\"Dat Christus gesterf het vir ons sondes volgens die Skrifte, en dat Hy begrawe is, en dat Hy opgewek is op die derde dag volgens die Skrifte, en dat Hy verskyn het aan Kefas, daarna aan die twaalf. Daarna het Hy verskyn aan meer as vyf honderd broeders tegelyk, van wie die meeste nog lewe\" (15:3–6). \"As Christus nie opgewek is nie, dan is julle geloof tevergeefs; julle is nog in julle sondes\" (15:17). \"Maar nou, Christus is opgewek uit die dode en het die eersteling geword van die wat ontslaap het\" (15:20). \"Soos almal in Adam sterwe, so sal ook almal in Christus lewend gemaak word\" (15:22). \"Moenie dwaal nie: slegte geselskap bederf goeie sedes\" (15:33). \"Dit word gesaai in verganklikheid, dit word opgewek in onverganklikheid\" (15:42). \"Die dood is verslind in die oorwinning. Dood, waar is jou angel? Doderyk, waar is jou oorwinning?\" (15:54–55). \"Daarom, my geliefde broeders, wees standvastig, onwankelbaar, altyd oorvloedig in die werk van die Here, omdat julle weet dat julle arbeid nie tevergeefs is in die Here nie\" (15:58). \"Waak, staan vas in die geloof, wees manmoedig, wees sterk. Laat alles by julle in liefde geskied\" (16:13–14).","bid":"Dank God vir die opstanding van Jesus en die hoop van ons eie opstanding. Bid vir mense wat rou, dat 15:55 hulle sal troos. Bid 16:13–14 oor elke kind: \"Waak, staan vas in die geloof, wees manmoedig, wees sterk. Laat alles in liefde gebeur.\"","vraag":"Paulus sê as Christus nie opgestaan het nie, is ons geloof tevergeefs. Waarom is die opstanding so belangrik vir die Christelike geloof?","hoofstukke":[["1 Korintiërs","1CO",15],["1 Korintiërs","1CO",16]]},{"dag":354,"ref":"2 Korintiërs 1 – 3","titel":"Die God van Alle Vertroosting en Briewe van Christus","fase":7,"tydlyn":"c. 55–56 n.C. Geskryf uit Masedonië (2:13; 7:5), ná 'n pynlike besoek en 'n \"trane-brief\" wat nie bewaar is nie (2:4).","agtergrond":"Die verhouding tussen Paulus en die Korintiërs was gespanne: sommige het sy gesag bevraagteken, hom van onbetroubaarheid beskuldig omdat hy sy reisplanne verander het, en het \"uitnemende apostels\" (valse leraars, 11:5) gevolg wat met aanbevelingsbriewe, welsprekendheid en trots gekom het. 2 Korintiërs is Paulus se mees persoonlike brief: hy deel sy lyding, swakheid en liefde vir hulle. In die antieke wêreld het reisende leraars aanbevelingsbriewe gebruik om hulle geloofwaardigheid te bewys.","leer":"God troos ons in ons swaarkry sodat ons ander kan troos. Swaarkry leer ons om nie op onsself te vertrou nie, maar op God wat die dooies opwek. Al God se beloftes is \"ja\" in Christus. Ons moet vergewe en herstel wie berou het, sodat Satan nie voordeel trek nie. Die beste \"aanbevelingsbrief\" is 'n veranderde lewe. Waar die Gees van die Here is, daar is vryheid, en ons word al meer verander na die beeld van Christus.","skrif":"\"Die God van alle vertroosting, wat ons troos in al ons verdrukking, sodat ons in staat kan wees om die wat in allerhande verdrukking is, te troos\" (1:3–4). \"Sodat ons nie op onsself sou vertrou nie, maar op God wat die dode opwek\" (1:9). \"Want al die beloftes van God is in Hom ja\" (1:20). Vergewe en troos hom (2:7). \"Sodat ons nie deur die Satan oorvleuel word nie; want sy planne is ons nie onbekend nie\" (2:11). \"Ons is vir God 'n aangename geur van Christus\" (2:15). \"Julle is ons brief, in ons harte geskrywe, wat deur alle mense geken en gelees word... 'n brief van Christus... geskrywe nie met ink nie, maar met die Gees van die lewende God\" (3:2–3). \"Die letter maak dood, maar die Gees maak lewend\" (3:6). \"Waar die Gees van die Here is, daar is vryheid\" (3:17). \"En ons almal wat met onbedekte gesig die heerlikheid van die Here aanskou... word van gedaante verander na dieselfde beeld, van heerlikheid tot heerlikheid\" (3:18).","bid":"Bid vir mense wat swaarkry, en dat ons, uit ons eie ervaring van God se troos, ander sal troos. Bid vir genade om te vergewe. Bid dat ons lewe 'n \"brief van Christus\" sal wees wat ander kan lees.","vraag":"Paulus sê ons lewe is 'n \"brief van Christus\" wat almal kan lees. Wat sou mense oor Jesus lees as hulle na jou lewe kyk?","hoofstukke":[["2 Korintiërs","2CO",1],["2 Korintiërs","2CO",2],["2 Korintiërs","2CO",3]]},{"dag":355,"ref":"2 Korintiërs 4 – 6","titel":"Skatte in Erdekruike en die Bediening van Versoening","fase":7,"tydlyn":"c. 55–56 n.C. Geskryf uit Masedonië.","agtergrond":"In die antieke wêreld het mense waardevolle dinge dikwels in gewone, goedkoop erdekruike gebêre – en die beeld van 'n olielamp van klei was bekend. Paulus beskryf sy liggaam en lewe as so 'n broos kruik waarin die skat van die evangelie gedra word. Hy noem sy lyding herhaaldelik – hy is \"verdruk, maar nie benoud nie\". In hoofstuk 5 gebruik hy die beeld van 'n tent (ons aardse liggaam) en 'n gebou (ons opstandingsliggaam), en die beeld van 'n gesant (ambassadeur) wat namens 'n koning praat.","leer":"Ons swakheid is nie 'n probleem vir God nie – dit wys juis dat die krag van Hom kom. Daarom verloor ons nie moed nie: ons uiterlike mens vergaan, maar ons innerlike mens word daagliks vernuwe. Ons sien nie na wat sigbaar is nie, maar na wat onsigbaar en ewig is. In Christus is ons 'n nuwe skepping. God het ons die bediening van versoening gegee – ons is ambassadeurs van Christus.","skrif":"\"Ons verkondig nie onsself nie, maar Christus Jesus as Here\" (4:5). \"Maar ons het hierdie skat in erdekruike, sodat die uitnemendheid van die krag van God kan wees en nie uit ons nie\" (4:7). \"Ons word in alles verdruk, maar ons is nie benoud nie; ons is radeloos, maar nie wanhopig nie; vervolg, maar nie verlate nie; neergewerp, maar ons vergaan nie\" (4:8–9). \"Al vergaan ons uiterlike mens, nogtans word die innerlike vernuwe van dag tot dag\" (4:16). \"Ons let nie op die sienlike dinge nie, maar op die onsienlike; want die sienlike dinge is tydelik, maar die onsienlike ewig\" (4:18). \"Ons wandel deur geloof, nie deur aanskouing nie\" (5:7). \"Ons moet almal geopenbaar word voor die regterstoel van Christus\" (5:10). \"Die liefde van Christus dring ons\" (5:14). \"As iemand in Christus is, is hy 'n nuwe skepsel; die oue het verbygegaan, kyk, alles het nuut geword\" (5:17). \"Ons is dan gesante in die Naam van Christus... Laat julle met God versoen\" (5:20). \"Hom wat geen sonde geken het nie, het Hy vir ons sonde gemaak, sodat ons kan word geregtigheid van God in Hom\" (5:21). \"Vandag is dit die dag van saligheid\" (6:2). \"Moenie in 'n ongelyke juk trek met ongelowiges nie\" (6:14).","bid":"Dank God dat Sy krag in ons swakheid volmaak word. Bid vir mense wat moedeloos is, dat hulle \"van dag tot dag vernuwe\" sal word. Dank God dat ons 'n nuwe skepping is. Bid dat ons as ambassadeurs van Jesus sal leef – in ons skool, werk en aanlyn.","vraag":"Paulus sê ons is \"gesante\" of ambassadeurs van Christus (5:20). Wat doen 'n ambassadeur, en hoe pas dit op jou?","hoofstukke":[["2 Korintiërs","2CO",4],["2 Korintiërs","2CO",5],["2 Korintiërs","2CO",6]]},{"dag":356,"ref":"2 Korintiërs 7 – 9","titel":"Ware Berou en Vrolike Gee","fase":7,"tydlyn":"c. 55–56 n.C. Geskryf uit Masedonië.","agtergrond":"Titus het Paulus in Masedonië ontmoet met die goeie nuus dat die Korintiërs op sy \"trane-brief\" gereageer en berou gehad het (7:6–7). In hoofstuk 8–9 moedig Paulus hulle aan om die insameling vir die arm gelowiges in Jerusalem (wat deur hongersnood getref is) af te handel. Hy gebruik die gemeentes van Masedonië (Filippi, Tessalonika en Berea) – self baie arm en vervolg – as voorbeeld. Hierdie insameling was vir Paulus ook 'n kragtige simbool van eenheid tussen nie-Joodse en Joodse gelowiges.","leer":"Daar is 'n verskil tussen wêreldse spyt (net jammer omdat ons uitgevang is) en goddelike droefheid wat tot ware bekering lei. Ware vrygewigheid kom wanneer ons eers onsself aan die Here gee. Jesus het arm geword sodat ons ryk kan word. God het 'n blymoedige gewer lief, en Hy sorg dat ons genoeg het om goed te doen. Gee is 'n daad van aanbidding en dank.","skrif":"\"Die droefheid na God werk 'n onberoulike bekering tot saligheid, maar die droefheid van die wêreld werk die dood\" (7:10). Die gemeentes van Masedonië het in groot armoede ryklik gegee (8:1–2). \"Hulle het hulleself eers aan die Here gegee\" (8:5). \"Want julle ken die genade van onse Here Jesus Christus, dat Hy om julle ontwil arm geword het terwyl Hy ryk was, sodat julle deur sy armoede ryk kan word\" (8:9). \"Wie skraps saai, sal ook skraps maai; en wie volop saai, sal ook volop maai\" (9:6). \"Elkeen soos hy in sy hart voorneem; nie met droefheid of uit dwang nie, want God het 'n blymoedige gewer lief\" (9:7). \"God is magtig om alle genade oorvloedig oor julle te laat kom\" (9:8). \"Dank aan God vir sy onuitspreeklike gawe!\" (9:15).","bid":"Bid vir harte wat werklik berou het, nie net jammer is omdat ons uitgevang is nie. Bid dat ons, soos die Masedoniërs, onsself eers aan die Here sal gee. Bid dat ons gesin blymoedige gewers sal wees – van geld, tyd en talente. Dank Jesus dat Hy arm geword het om ons ryk te maak.","vraag":"Wat is die verskil tussen jammer wees omdat jy uitgevang is, en ware berou?","hoofstukke":[["2 Korintiërs","2CO",7],["2 Korintiërs","2CO",8],["2 Korintiërs","2CO",9]]},{"dag":357,"ref":"2 Korintiërs 10 – 13","titel":"Krag in Swakheid","fase":7,"tydlyn":"c. 55–56 n.C. Geskryf uit Masedonië.","agtergrond":"Die toon verander skerp in hoofstuk 10–13: Paulus verdedig hom teen die \"uitnemende apostels\" wat die Korintiërs verlei het met hulle welsprekendheid, aansien en Joodse herkoms, en wat Paulus as swak en onindrukwekkend afgemaak het. In 'n ironiese \"dwaas se roem\" lys Paulus nie sy suksesse nie, maar sy lyding: tronke, slae, skipbreuke, gevare, honger en sorg vir die kerke. Hy vertel van 'n visioen van die hemel (die \"derde hemel\") en van 'n \"doring in die vlees\" – 'n bron van pyn waarvan ons nie weet wat dit was nie (voorstelle sluit in 'n oogsiekte, ander siekte, of vervolging).","leer":"Die wêreld beoordeel mense volgens voorkoms, prestasie en welsprekendheid, maar God werk deur swakheid. Wanneer God nie ons gebed op die manier beantwoord wat ons wil nie, kan Sy antwoord wees: \"My genade is vir jou genoeg.\" Christus se krag word in ons swakheid volmaak. Ons moet onsself toets of ons in die geloof is. Ons moet elke gedagte gevange neem om Christus gehoorsaam te wees.","skrif":"\"Die wapens van ons stryd is nie vleeslik nie, maar kragtig deur God\" (10:4). \"Ons neem elke gedagte gevange tot die gehoorsaamheid aan Christus\" (10:5). \"Wie roem, moet in die Here roem\" (10:17). \"Die Satan self verander hom in 'n engel van die lig\" (11:14). Paulus se lyding: vyf keer 39 houe, drie keer met stokke geslaan, een keer gestenig, drie keer skipbreuk (11:23–28). \"Daarby kom nog... die sorg vir al die gemeentes\" (11:28). Die visioen van die paradys (12:2–4). \"'n Doring in die vlees\" (12:7). \"My genade is vir jou genoeg, want my krag word in swakheid volbring\" (12:9). \"Want as ek swak is, dan is ek sterk\" (12:10). \"Ondersoek julleself of julle in die geloof is\" (13:5). \"Die genade van die Here Jesus Christus en die liefde van God en die gemeenskap van die Heilige Gees sy met julle almal\" (13:13).","bid":"Bring elkeen se \"doring in die vlees\" – 'n swakheid of pyn wat nie weggaan nie – na God, en bid om Sy genade. Bid dat ons nie mense volgens voorkoms of prestasie sal oordeel nie. Bid dat ons ons gedagtes gevange sal neem vir Christus. Sluit af met die seën van 13:13.","vraag":"God het nie Paulus se \"doring\" weggeneem nie, maar gesê \"My genade is vir jou genoeg\". Hoe kan God se genade genoeg wees wanneer iets moeilik bly?","hoofstukke":[["2 Korintiërs","2CO",10],["2 Korintiërs","2CO",11],["2 Korintiërs","2CO",12],["2 Korintiërs","2CO",13]]},{"dag":358,"ref":"Romeine 1 – 3","titel":"Almal het Gesondig – en die Geregtigheid van God","fase":7,"tydlyn":"c. 57 n.C. Geskryf deur Paulus uit Korinte (vgl. 16:23; Handelinge 20:2–3), aan die kerk in Rome, wat hy nog nie besoek het nie.","agtergrond":"Rome was die hoofstad van die wêreld, met sowat een miljoen inwoners. Die kerk daar is nie deur Paulus gestig nie, en het uit Joodse en nie-Joodse gelowiges bestaan. Keiser Claudius het c. 49 n.C. die Jode uit Rome verban (Handelinge 18:2); toe hulle ná sy dood in 54 n.C. terugkeer, was daar waarskynlik spanning tussen Joodse en nie-Joodse Christene. Paulus beplan om Rome te besoek op pad na Spanje (15:24). Romeine is die mees sistematiese uiteensetting van die evangelie in die Bybel. Dit het die lewens van Augustinus, Martin Luther en John Wesley verander.","leer":"Die evangelie is die krag van God tot redding vir elkeen wat glo. Alle mense – nie-Jode én Jode, \"goddelose\" én \"godsdienstige\" mense – het gesondig en kort die heerlikheid van God. Niemand kan deur die werke van die wet reg voor God staan nie. Maar God verklaar ons regverdig, verniet, uit genade, deur geloof in Jesus, wat ons sonde gedra het.","skrif":"\"Want ek skaam my nie oor die evangelie van Christus nie, want dit is 'n krag van God tot redding vir elkeen wat glo\" (1:16). \"Die regverdige sal uit die geloof lewe\" (1:17; Habakuk 2:4). \"Wat van God geken kan word, is aan hulle openbaar... sy ewige krag en goddelikheid word uit die skepsele verstaan... sodat hulle geen verontskuldiging het nie\" (1:19–20). \"Hulle het die waarheid van God verruil vir die leuen\" (1:25). \"Of verag jy die rykdom van sy goedertierenheid... terwyl jy nie besef dat die goedertierenheid van God jou tot bekering lei nie?\" (2:4). \"Daar is niemand regverdig nie, selfs nie een nie\" (3:10). \"Want almal het gesondig en kort die heerlikheid van God\" (3:23). \"En hulle word deur sy genade sonder verdienste geregverdig deur die verlossing wat in Christus Jesus is\" (3:24). \"Die mens word geregverdig deur die geloof sonder die werke van die wet\" (3:28).","bid":"Bid dat ons ons nooit oor die evangelie sal skaam nie. Erken saam: \"Ons het almal gesondig.\" Dank God vir Romeine 3:23–24 – dat ons verniet, uit genade, regverdig verklaar word. Bid vir mense wat probeer om deur hulle eie goedheid by God te kom.","vraag":"Romeine 3:23 sê \"almal het gesondig\". Waarom is dit eintlik goeie nuus om dit te erken?","hoofstukke":[["Romeine","ROM",1],["Romeine","ROM",2],["Romeine","ROM",3]]},{"dag":359,"ref":"Romeine 4 – 5","titel":"Abraham se Geloof en Vrede met God","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte.","agtergrond":"Paulus gebruik Abraham, die vader van die Joodse volk, as bewys dat God nog altyd mense deur geloof regverdig verklaar het – want Abraham is regverdig verklaar (Genesis 15:6) voordat hy besny is (Genesis 17) en eeue voor die wet van Moses. In hoofstuk 5 vergelyk Paulus Adam (deur wie sonde en dood in die wêreld gekom het) met Christus (deur wie geregtigheid en lewe kom). \"Regverdig verklaar\" (geregverdig) is 'n hofterm: die regter verklaar die beskuldigde \"onskuldig\".","leer":"Redding was nog altyd deur geloof – om God te vertrou dat Hy doen wat Hy belowe. Omdat ons deur geloof geregverdig is, het ons vrede met God. Selfs swaarkry kan ons laat groei in volharding, karakter en hoop. God het Sy liefde vir ons bewys deurdat Christus vir ons gesterf het terwyl ons nog sondaars was. Wat Adam verloor het, het Christus oorvloedig herstel.","skrif":"\"Abraham het God geglo, en dit is hom tot geregtigheid gereken\" (4:3). \"Hy het teen hoop op hoop geglo\" (4:18). \"Hy het nie deur ongeloof aan die belofte van God getwyfel nie\" (4:20). \"Hy het ten volle oortuig gewees dat wat Hy beloof het, Hy ook magtig is om te doen\" (4:21). \"Omdat ons dan uit die geloof geregverdig is, het ons vrede by God deur onse Here Jesus Christus\" (5:1). \"Die verdrukking werk lydsaamheid, en die lydsaamheid ondervinding, en die ondervinding hoop\" (5:3–4). \"Die liefde van God is in ons harte uitgestort deur die Heilige Gees\" (5:5). \"Maar God bewys sy liefde tot ons daarin dat Christus vir ons gesterwe het toe ons nog sondaars was\" (5:8). \"Deur een mens het die sonde in die wêreld gekom, en deur die sonde die dood\" (5:12). \"Waar die sonde meer geword het, het die genade nog meer oorvloedig geword\" (5:20).","bid":"Dank God vir die vrede wat ons deur Jesus met Hom het. Bid vir mense wat swaarkry, dat dit volharding, karakter en hoop in hulle sal werk. Dank God vir Romeine 5:8 – dat Hy ons liefgehad het toe ons nog sondaars was.","vraag":"Romeine 5:8 sê Christus het vir ons gesterf \"toe ons nog sondaars was\". Wat sê dit oor God se liefde vir jou – selfs op jou slegste dag?","hoofstukke":[["Romeine","ROM",4],["Romeine","ROM",5]]},{"dag":360,"ref":"Romeine 6 – 7","titel":"Dood vir die Sonde, Lewend vir God – en die Stryd binne-in","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte.","agtergrond":"Paulus antisipeer 'n teenwerping: as God se genade groter is as ons sonde, kan ons dan maar aanhou sondig sodat die genade meer kan word? Sy antwoord is 'n sterk \"Nee!\" Hy gebruik die beeld van die doop (om saam met Christus begrawe te word en saam met Hom op te staan) en van slawerny (ons was slawe van die sonde, maar is nou vrygekoop om slawe van God en die geregtigheid te wees). In hoofstuk 7 beskryf Paulus die innerlike stryd met sonde: om te weet wat goed is, maar dit nie te kan doen nie. Christene verstaan verskillend of Paulus hier sy lewe voor of ná sy bekering beskryf; baie gelowiges herken hierdie stryd in hulle eie lewe.","leer":"Genade is nie 'n vrypas om te sondig nie. In Christus het ons saam met Hom gesterf en is ons opgewek tot 'n nuwe lewe; die sonde is nie meer ons baas nie. Ons moet onsself elke dag as \"dood vir die sonde en lewend vir God\" beskou. Die stryd met sonde is werklik, en ons kan dit nie in eie krag wen nie – maar Jesus Christus verlos ons.","skrif":"\"Sal ons in die sonde bly, sodat die genade meer kan word? Nee, stellig nie!\" (6:1–2). \"Ons is saam met Hom begrawe deur die doop in die dood... sodat ons ook in 'n nuwe lewe kan wandel\" (6:4). \"So moet julle ook julleself reken as dood vir die sonde, maar lewend vir God in Christus Jesus\" (6:11). \"Laat die sonde dan nie in julle sterflike liggaam heers nie\" (6:12). \"Stel julle lede in diens van God as werktuie van geregtigheid\" (6:13). \"Die loon van die sonde is die dood, maar die genadegawe van God is die ewige lewe in Christus Jesus\" (6:23). \"Wat ek wil, dit doen ek nie; maar wat ek haat, dit doen ek\" (7:15). \"Die goeie wat ek wil, doen ek nie\" (7:19). \"Ek, ellendige mens! Wie sal my verlos uit die liggaam van hierdie dood? Ek dank God deur Jesus Christus, onse Here!\" (7:24–25).","bid":"Dank God dat ons in Christus dood is vir die sonde en lewend vir God. Bring eerlik die sondes waarmee ons sukkel na God, en bid vir Sy krag. Bid Romeine 6:13 oor ons liggame: dat ons dit vir God sal gebruik. Dank God vir die ewige lewe as 'n gratis geskenk (6:23).","vraag":"Paulus sê \"die goeie wat ek wil, doen ek nie\". Herken jy hierdie stryd in jou eie lewe? Wat is die antwoord in 7:25?","hoofstukke":[["Romeine","ROM",6],["Romeine","ROM",7]]},{"dag":361,"ref":"Romeine 8","titel":"Geen Veroordeling – en Niks kan Ons van God se Liefde Skei nie","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte.","agtergrond":"Romeine 8 word dikwels die hoogtepunt van die hele Bybel genoem. Ná die stryd van hoofstuk 7 kom die oorwinning: lewe deur die Heilige Gees. Die hoofstuk begin met \"geen veroordeling\" en eindig met \"geen skeiding\". \"Abba\" is Aramees vir \"Vader\" – die intieme woord wat Jesus self gebruik het (Markus 14:36). In die Romeinse wêreld het 'n aangenome seun al die regte van 'n natuurlike seun ontvang, insluitend die erfenis – en 'n vorige skuld is uitgewis.","leer":"Vir dié wat in Christus is, is daar geen veroordeling nie. Die Heilige Gees woon in ons, lei ons, en getuig dat ons kinders van God is. Ons ly nou, saam met die hele skepping, maar die heerlikheid wat kom, is baie groter. Die Gees help ons in ons swakheid en bid vir ons. God werk alle dinge ten goede vir dié wat Hom liefhet. As God vir ons is, wie kan teen ons wees? Niks kan ons skei van die liefde van God in Christus nie.","skrif":"\"Daar is dan nou geen veroordeling vir die wat in Christus Jesus is nie\" (8:1). \"Almal wat deur die Gees van God gelei word, dié is kinders van God\" (8:14). \"Julle het die Gees van aanneming tot kinders ontvang, deur wie ons roep: Abba, Vader!\" (8:15). \"Die Gees self getuig saam met ons gees dat ons kinders van God is\" (8:16). \"Die lyding van die teenwoordige tyd is nie op te weeg teen die heerlikheid wat aan ons geopenbaar sal word nie\" (8:18). \"Die Gees kom ons swakhede te hulp... die Gees self pleit vir ons met onuitspreeklike sugtinge\" (8:26). \"En ons weet dat vir hulle wat God liefhet, alles ten goede meewerk\" (8:28). \"As God vir ons is, wie kan teen ons wees?\" (8:31). \"Hy wat selfs sy eie Seun nie gespaar het nie... hoe sal Hy ons saam met Hom ook nie alles skenk nie?\" (8:32). \"Wie sal ons skei van die liefde van Christus?\" (8:35). \"In al hierdie dinge is ons meer as oorwinnaars deur Hom wat ons liefgehad het\" (8:37). \"Want ek is oortuig dat geen dood of lewe... of enige ander skepsel ons sal kan skei van die liefde van God wat daar is in Christus Jesus, onse Here\" (8:38–39).","bid":"Lees Romeine 8:38–39 hardop oor elke kind. Dank God dat daar geen veroordeling is vir dié in Christus nie. Bring elke \"ding\" wat ons bang maak na God, en verklaar saam: \"As God vir ons is, wie kan teen ons wees?\"","vraag":"Romeine 8:38–39 noem baie dinge wat ons nie van God se liefde kan skei nie. Watter ding sou jy by daardie lys wou voeg?","hoofstukke":[["Romeine","ROM",8]]},{"dag":362,"ref":"Romeine 9 – 11","titel":"God se Plan met Israel en die Nasies","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte.","agtergrond":"Hierdie drie hoofstukke beantwoord 'n pynlike vraag: as Jesus die Messias van Israel is, waarom het die meeste Jode Hom verwerp? Het God se beloftes aan Israel dan misluk? Paulus, self 'n Jood, voel diep hartseer oor sy volk. Hy praat oor God se soewereine keuse (9), Israel se verantwoordelikheid om te glo (10), en God se voortgaande plan met Israel (11), met die beeld van 'n olyfboom waarin wilde takke (nie-Jode) ingeënt word. Hierdie hoofstukke word deur Christene verskillend verstaan, veral oor uitverkiesing en oor die toekoms van Israel. Bespreek die hoofgedagtes eerder as die moeilikste besonderhede.","leer":"God se woord het nie misluk nie; Hy is getrou aan Sy beloftes. Redding is genade, nie iets wat ons verdien nie. Elkeen wat die Naam van die Here aanroep, sal gered word – daarom moet die evangelie verkondig word. Nie-Joodse gelowiges moet nie trots wees teenoor Israel nie. God se weë is diep en ondeurgrondelik, en die regte reaksie is aanbidding.","skrif":"\"Ek het 'n groot droefheid en 'n gedurige smart in my hart\" vir my volk (9:2–3). \"Nie al die wat uit Israel is, is Israel nie\" (9:6). \"Dit hang dan nie af van die een wat wil of van die een wat loop nie, maar van God wat Hom ontferm\" (9:16). \"As jy met jou mond die Here Jesus bely en met jou hart glo dat God Hom uit die dode opgewek het, sal jy gered word\" (10:9). \"Elkeen wat die Naam van die Here aanroep, sal gered word\" (10:13). \"Hoe sal hulle dan hoor sonder een wat preek?... Hoe lieflik is die voete van die wat die evangelie van vrede verkondig\" (10:14–15). \"Die geloof is dan uit die gehoor, en die gehoor deur die woord van God\" (10:17). \"Het God sy volk verstoot? Nee, stellig nie!\" (11:1). Die olyfboom en die ingeënte takke (11:17–24). \"Moenie hoogmoedig wees nie, maar vrees\" (11:20). \"Want die genadegawes en die roeping van God is onberoulik\" (11:29). \"O diepte van die rykdom en wysheid en kennis van God! Hoe ondeurgrondelik is sy oordele en onnaspeurlik sy weë!... Want uit Hom en deur Hom en tot Hom is alle dinge. Aan Hom die heerlikheid tot in ewigheid!\" (11:33–36).","bid":"Bid vir die Joodse volk, dat hulle Jesus as hulle Messias sal leer ken. Bid Romeine 10:9 oor elkeen van ons. Bid vir mense wat nog nie van Jesus gehoor het nie, en vir dié wat die \"lieflike voete\" is wat dit gaan vertel. Aanbid God met Romeine 11:33–36.","vraag":"Romeine 10:14 vra: \"Hoe sal hulle hoor sonder een wat preek?\" Wie het die evangelie aan jou vertel? Aan wie kan jy dit vertel?","hoofstukke":[["Romeine","ROM",9],["Romeine","ROM",10],["Romeine","ROM",11]]},{"dag":363,"ref":"Romeine 12 – 13","titel":"'n Lewende Offer en Liefde in die Praktyk","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte.","agtergrond":"Ná elf hoofstukke oor wat God vir ons gedoen het, begin Paulus met \"Ek vermaan julle dan\" – die praktiese gevolge. Die offers in die Ou Testament was dooie diere; nou moet ons onsself as \"lewende offers\" gee. Hoofstuk 13 handel oor die verhouding met die regering. Paulus skryf dit onder keiser Nero (54–68 n.C.), wat in sy vroeë jare redelik bestuur het, maar later Christene wreed vervolg het. Die oproep om die owerheid te gehoorsaam, het grense: wanneer die owerheid vra om God ongehoorsaam te wees, moet ons God meer gehoorsaam wees (Handelinge 5:29).","leer":"Die regte reaksie op God se genade is om ons hele lewe aan Hom te gee. Ons moenie aan die wêreld gelykvormig word nie, maar ons denke laat vernuwe. Elkeen het gawes om die liggaam van Christus te dien. Ware liefde is opreg, eer ander, seën vervolgers, leef in vrede en oorwin die kwaad met die goeie. Ons moet die owerheid respekteer, ons belasting betaal, en ons naaste liefhê. Die nag is amper verby – leef in die lig.","skrif":"\"Ek vermaan julle dan, broeders, by die barmhartighede van God, om julle liggame te stel as 'n lewende, heilige en aan God welgevallige offer – dit is julle redelike godsdiens\" (12:1). \"Word nie aan hierdie wêreld gelykvormig nie, maar word verander deur die vernuwing van julle gemoed\" (12:2). \"Om nie hoër te dink as wat 'n mens behoort te dink nie\" (12:3). \"Die liefde moet ongeveins wees. Verfoei die kwaad, hang die goeie aan\" (12:9). \"Wees in die broederliefde hartlik teenoor mekaar; wees in eerbetoon voorkomend teenoor mekaar\" (12:10). \"Wees bly in die hoop; wees geduldig in die verdrukking; volhard in die gebed\" (12:12). \"Seën die wat julle vervolg\" (12:14). \"Verbly julle met die wat bly is, en ween met die wat ween\" (12:15). \"Vergeld niemand kwaad met kwaad nie\" (12:17). \"Laat jou nie deur die kwaad oorwin nie, maar oorwin die kwaad deur die goeie\" (12:21). \"Laat elke mens hom aan die magte onderwerp wat oor hom gestel is\" (13:1). \"Wees niemand iets skuldig nie, behalwe om mekaar lief te hê\" (13:8). \"Die nag is ver gevorder en die dag het naby gekom\" (13:12). \"Beklee julle met die Here Jesus Christus\" (13:14).","bid":"Gee elkeen se liggaam en lewe aan God as 'n \"lewende offer\" (12:1). Bid dat ons denke vernuwe sal word, nie gevorm deur die wêreld nie (12:2). Bid vir ons regering en leiers. Bid vir genade om die kwaad met die goeie te oorwin – kies een persoon vir wie jy goed kan wees wat nie goed vir jou was nie.","vraag":"Romeine 12:2 sê ons moenie aan die wêreld gelykvormig word nie. Waar voel jy die meeste druk om \"soos almal\" te wees?","hoofstukke":[["Romeine","ROM",12],["Romeine","ROM",13]]},{"dag":364,"ref":"Romeine 14 – 16","titel":"Aanvaar Mekaar – en Groete aan die Familie","fase":7,"tydlyn":"c. 57 n.C. Geskryf uit Korinte. Paulus beplan om Jerusalem toe te gaan met die insameling, en dan via Rome na Spanje (15:24–28).","agtergrond":"In die kerk in Rome was daar verskille oor \"betwisbare sake\": sommige (waarskynlik Joodse gelowiges) het net groente geëet of spesiale dae gehou; ander (waarskynlik nie-Joodse gelowiges) het alles geëet en alle dae as gelyk beskou. Paulus noem die eerste groep \"swak\" en die tweede \"sterk\", maar vra albei om mekaar nie te oordeel of te verag nie. Hoofstuk 16 is 'n lang lys groete aan sowat 26 mense – mans en vroue, slawe en vry mense, Jode en nie-Jode – wat wys hoe persoonlik die vroeë kerk was. Febe, 'n diakones van Kenchreë (die hawe van Korinte), het waarskynlik die brief na Rome geneem.","leer":"In sake wat nie die kern van die evangelie raak nie, moet Christene mekaar aanvaar en nie oordeel nie. Ons sal almal voor God rekenskap gee. Liefde stel die ander persoon se geloof bo my eie vryheid. Ons moet mekaar aanneem soos Christus ons aangeneem het. God is die God van hoop, wat ons met vreugde en vrede vul. Die kerk is 'n familie waarin elkeen raakgesien en waardeer word.","skrif":"\"Neem die een wat swak is in die geloof aan, maar nie om oor menings te twis nie\" (14:1). \"Wie is jy dat jy die huiskneg van 'n ander oordeel?\" (14:4). \"Want nie een van ons lewe vir homself nie\" (14:7). \"Die koninkryk van God is nie spys en drank nie, maar geregtigheid en vrede en blydskap deur die Heilige Gees\" (14:17). \"Laat ons dan najaag die dinge wat tot vrede strek en tot onderlinge stigting\" (14:19). \"Laat elkeen van ons sy naaste behaag tot sy beswil, tot stigting\" (15:2). \"Neem mekaar dan aan soos Christus ons ook aangeneem het, tot heerlikheid van God\" (15:7). \"Mag die God van die hoop julle vervul met alle blydskap en vrede in die geloof, sodat julle oorvloedig kan wees in die hoop deur die krag van die Heilige Gees\" (15:13). Febe, Priscilla en Akwila, en baie ander (16:1–16). \"Die God van die vrede sal die Satan binnekort onder julle voete vermorsel\" (16:20; vgl. Genesis 3:15).","bid":"Bid vir eenheid tussen Christene wat oor kleiner sake verskil. Bid dat ons mekaar in die gesin sal \"aanneem soos Christus ons aangeneem het\". Bid Romeine 15:13 oor elke kind: dat God hulle met blydskap, vrede en hoop sal vul. Dank God vir die mense in ons kerk-familie – noem 'n paar by die naam.","vraag":"Paulus groet in Romeine 16 sowat 26 mense by die naam. Wie in ons kerk of lewe moet ons meer raaksien en waardeer?","hoofstukke":[["Romeine","ROM",14],["Romeine","ROM",15],["Romeine","ROM",16]]},{"dag":365,"ref":"Handelinge 21 – 23","titel":"Gevange geneem in Jerusalem","fase":7,"tydlyn":"c. 57 n.C. Van Milete via Tirus en Sesarea na Jerusalem; dan na Sesarea, die Romeinse hoofkwartier aan die kus.","agtergrond":"Paulus kom in Jerusalem aan met die insameling, ten spyte van profetiese waarskuwings dat hy gevange geneem sal word. Die leiers vra hom om 'n Joodse reinigingsritueel in die tempel te ondergaan om te wys dat hy nie die wet verag nie. Jode van Asië beskuldig hom valslik dat hy 'n nie-Jood (Trofimus) in die binnehof ingeneem het – 'n misdaad waarop die doodstraf gestaan het (inskripsies in Grieks wat nie-Jode op straf van die dood waarsku om nie verder te gaan nie, is in Jerusalem gevind). Die Romeinse bevelvoerder red hom. Paulus se Romeinse burgerskap beskerm hom teen geseling. 'n Sameswering van meer as 40 man word deur Paulus se neef ontdek.","leer":"Gehoorsaamheid aan God se roeping kan beteken dat ons na swaarkry toe gaan, en ons moet bereid wees om selfs te sterf vir die Naam van Jesus. Ons persoonlike getuienis – wat Jesus in ons lewe gedoen het – is kragtig. Christene kan hulle wettige regte gebruik. God beskerm Sy dienaars en vervul Sy planne, selfs deur die hande van ongelowiges en 'n jong seun se moed.","skrif":"\"Ek is gereed om nie alleen gebind te word nie, maar ook om in Jerusalem te sterwe vir die Naam van die Here Jesus\" (21:13). \"Laat die wil van die Here geskied\" (21:14). Die oproer in die tempel (21:27–36). Paulus se getuienis: \"Ek was 'n ywerige vir God... Saul, Saul, waarom vervolg jy My?\" (22:3–8). \"Wat moet ek doen, Here?\" (22:10). \"Jy sal vir Hom 'n getuie wees by alle mense van wat jy gesien en gehoor het\" (22:15). \"Is dit vir julle geoorloof om 'n mens wat 'n Romein is... te gesel?\" (22:25). Paulus voor die Raad: \"Oor die hoop en die opstanding van die dode word ek geoordeel\" (23:6). \"Hou goeie moed, Paulus, want soos jy in Jerusalem van My getuig het, so moet jy ook in Rome getuig\" (23:11). Die sameswering van 40 man en Paulus se suster se seun (23:12–22).","bid":"Bid vir Christene wat vir hulle geloof gevange geneem word. Bid dat ons gereed sal wees om ons persoonlike getuienis te deel: wat het Jesus vir my gedoen? Dank God dat Hy Sy kinders beskerm, en bid dat ons, soos Paulus se neef, moedig sal optree om ander te help.","vraag":"Paulus het sy storie vertel: hoe hy was, hoe hy Jesus ontmoet het, en hoe sy lewe verander het. Hoe sou jy jou eie storie met Jesus in drie sinne vertel?","hoofstukke":[["Handelinge","ACT",21],["Handelinge","ACT",22],["Handelinge","ACT",23]]},{"dag":366,"ref":"Handelinge 24 – 26","titel":"Paulus voor Goewerneurs en 'n Koning","fase":7,"tydlyn":"c. 57–59 n.C. Sesarea. Paulus is twee jaar lank gevange onder die goewerneur Felix (24:27), en verskyn dan voor die nuwe goewerneur Festus en koning Agrippa II.","agtergrond":"Felix (goewerneur c. 52–59 n.C.) was volgens die Romeinse geskiedskrywer Tacitus 'n wrede en korrupte man; hy het gehoop Paulus sal hom omkoop. Sy vrou Drusilla was 'n Joodse prinses (dogter van Herodes Agrippa I). Festus was die volgende goewerneur. Omdat Paulus 'n Romeinse burger was, het hy die reg gehad om hom op die keiser te beroep – en hy doen dit, sodat hy na Rome gestuur moet word. Herodes Agrippa II was die laaste van die Herodes-konings en het die Joodse gebruike goed geken. Bernice was sy suster.","leer":"Christene kan hulle saak met respek, eerlikheid en wysheid stel. Ons moet daarna streef om altyd 'n skoon gewete voor God en mense te hê. Mense stel dikwels hulle beslissing oor Jesus uit tot 'n \"geskikte tyd\". Paulus gebruik elke geleentheid – selfs sy eie verhoor – om van Jesus te getuig, en wens almal kon soos hy wees, behalwe sy boeie.","skrif":"\"Ek oefen my om altyd 'n onergerlike gewete te hê voor God en die mense\" (24:16). Felix word bevrees toe Paulus praat oor \"geregtigheid en selfbeheersing en die toekomstige oordeel\" (24:25). \"Gaan nou maar weg; as ek 'n geleentheid kry, sal ek jou laat roep\" (24:25). \"Ek beroep my op die keiser!\" (25:11). Paulus se getuienis voor Agrippa (26:2–23). \"Om hulle oë te open, sodat hulle hul kan bekeer van die duisternis tot die lig en van die mag van die Satan tot God\" (26:18). \"Ek was nie ongehoorsaam aan die hemelse verskyning nie\" (26:19). Festus: \"Jy is gek, Paulus!\" (26:24). Agrippa: \"Amper oorreed jy my om 'n Christen te word\" (26:28). \"Ek wens tot God dat... almal wat my vandag hoor, so mag word soos ek, uitgenome hierdie boeie\" (26:29).","bid":"Bid dat ons altyd 'n skoon gewete voor God en mense sal hê. Bid vir mense wat, soos Felix en Agrippa, \"amper\" oorreed is maar uitstel – dat hulle vandag sal kies. Bid vir moed om enige geleentheid te gebruik om van Jesus te vertel.","vraag":"Felix het gesê \"as ek 'n geleentheid kry, sal ek jou roep\" – maar het nooit. Waarom is dit gevaarlik om 'n besluit oor Jesus uit te stel?","hoofstukke":[["Handelinge","ACT",24],["Handelinge","ACT",25],["Handelinge","ACT",26]]},{"dag":367,"ref":"Handelinge 27 – 28","titel":"Skipbreuk, Malta, en Rome – die Evangelie Ongehinderd","fase":7,"tydlyn":"c. 59–62 n.C. Die seereis van Sesarea na Rome in die herfs en winter (gevaarlike seisoen), skipbreuk op Malta, en twee jaar huisarres in Rome.","agtergrond":"Lukas se verslag van die seereis (hoofstuk 27) word deur kenners van antieke seevaart as een van die mees gedetailleerde en akkurate beskrywings van 'n antieke skeepsreis beskou. Die \"Vas\" (27:9) verwys na die Versoendag in die herfs, ná wanneer seereise op die Middellandse See gevaarlik geword het. 'n Graanskip van Alexandrië was groot genoeg vir 276 mense. Malta het steeds 'n \"Paulusbaai\". In Rome woon Paulus twee jaar onder huisarres in 'n gehuurde huis, met 'n soldaat aan hom vasgeketting. Handelinge eindig sonder om Paulus se verhoor of dood te vertel; volgens vroeë kerklike oorlewering is hy later, onder Nero, in Rome tereggestel.","leer":"God is in beheer, selfs in die storms van die lewe, en Hy hou Sy beloftes. Een gelowige wat God vertrou, kan 'n bron van moed en hoop vir almal rondom hom wees – selfs vir ongelowiges. God gebruik selfs 'n skipbreuk om die evangelie op 'n nuwe eiland te bring. Die evangelie gaan ongehinderd voort, selfs wanneer die boodskapper in boeie is. Die verhaal van die kerk is nog nie klaar nie – ons is deel daarvan.","skrif":"Paulus waarsku teen die reis, maar hulle luister nie (27:9–11). Die storm \"Euraquilo\" (27:14). \"Alle hoop op ons redding het verdwyn\" (27:20). \"Hou goeie moed... want 'n engel van God... het by my gestaan\" (27:22–23). \"Ek glo God dat dit so sal gebeur soos aan my gesê is\" (27:25). Paulus moedig almal aan om te eet en dank God voor almal (27:33–36). Almal kom veilig aan land (27:44). Die slang op Malta (28:3–6). Paulus genees die vader van Publius en baie ander (28:8–9). Die broeders van Rome kom hom tegemoet, en \"hy het God gedank en moed geskep\" (28:15). \"Hierdie heil van God is aan die heidene gestuur, en hulle sal luister\" (28:28). \"Hy het die koninkryk van God verkondig en die dinge aangaande die Here Jesus Christus met alle vrymoedigheid geleer, sonder dat iemand hom verhinder het\" (28:31).","bid":"Dank God dat Hy in beheer is in elke storm. Bid dat ons, soos Paulus, vir ander 'n bron van moed sal wees in moeilike tye. Bid vir die verspreiding van die evangelie – \"ongehinderd\" – in ons land en tot aan die uiterste van die aarde. Dank God dat ons deel is van die verhaal wat nog voortgaan.","vraag":"Handelinge het nie 'n \"einde\" nie – dit eindig met die evangelie wat aanhou versprei. Wat beteken dit dat ons deel is van die \"volgende hoofstuk\"?","hoofstukke":[["Handelinge","ACT",27],["Handelinge","ACT",28]]},{"dag":368,"ref":"Efesiërs 1 – 3","titel":"Geseën met Elke Geestelike Seën – Gered uit Genade","fase":7,"inleiding":["Die Gevangenskapsbriewe en die Pastorale Briewe","Terwyl Paulus in Rome onder huisarres was (c. 60–62 n.C.), het hy waarskynlik Efesiërs, Filippense, Kolossense en Filemon geskryf (sommige geleerdes plaas een of meer daarvan tydens 'n gevangenskap in Efese of Sesarea). Volgens vroeë oorlewering is Paulus vrygelaat, het hy verder gereis, en is hy later weer gevange geneem en in Rome tereggestel (c. 64–67 n.C.). 1 Timoteus, Titus en 2 Timoteus – die \"pastorale briewe\", gerig aan twee jonger leiers – pas in hierdie laaste jare. Die briewe noem Paulus as skrywer, en die kerk het dit nog altyd so aanvaar; sommige moderne geleerdes bevraagteken dit weens verskille in styl."],"tydlyn":"c. 60–62 n.C. Geskryf deur Paulus as gevangene (\"die gevangene van Christus Jesus\", 3:1), waarskynlik uit Rome. Moontlik 'n rondbrief aan verskeie kerke in die provinsie Asië, met Efese as die hoofstad.","agtergrond":"Efese was die stad van die godin Artemis en vol towery en die vrees vir geestelike magte (Handelinge 19). Paulus wys dat Christus bo elke mag en owerheid verhewe is. Die brief bestaan uit twee helftes: hoofstukke 1–3 beskryf wie ons in Christus is (wat God gedoen het), en hoofstukke 4–6 hoe ons daarom moet lewe. Efesiërs 1:3–14 is in Grieks een lang sin van lof. In die tempel in Jerusalem was daar 'n muur met waarskuwings wat nie-Jode verbied het om verder te gaan; Paulus sê Christus het die \"middelmuur van skeiding\" afgebreek (2:14).","leer":"In Christus is ons ryklik geseën: uitverkies, aangeneem as kinders, verlos, vergewe en verseël met die Heilige Gees. Ons was geestelik dood in sonde, maar God het ons uit genade lewend gemaak – nie deur ons werke nie, sodat niemand kan roem nie – en ons geskep vir goeie werke. In Christus is Jode en nie-Jode een nuwe volk, die huisgesin van God. God se liefde is wyer, langer, hoër en dieper as wat ons kan begryp.","skrif":"\"Geseënd is die God en Vader van onse Here Jesus Christus wat ons geseën het met alle geestelike seëninge in die hemele in Christus\" (1:3). \"Soos Hy ons in Hom uitverkies het voor die grondlegging van die wêreld\" (1:4). Aangeneem as kinders (1:5). \"In Hom het ons die verlossing deur sy bloed, die vergewing van die misdade\" (1:7). Verseël met die Heilige Gees (1:13). Paulus bid dat die oë van ons verstand verlig sal word (1:18). \"En julle was dood deur die misdade en die sondes\" (2:1). \"Maar God, wat ryk is in barmhartigheid... het ons... saam met Christus lewend gemaak\" (2:4–5). \"Want uit genade is julle gered, deur die geloof, en dit nie uit julle nie: dit is die gawe van God; nie uit die werke nie, sodat niemand mag roem nie. Want ons is sy maaksel, geskape in Christus Jesus tot goeie werke\" (2:8–10). \"Hy is ons vrede wat... die middelmuur van skeiding afgebreek het\" (2:14). \"Medeburgers van die heiliges en huisgenote van God\" (2:19). \"Dat Christus deur die geloof in julle harte mag woon, sodat julle, gewortel en gegrond in die liefde... kan begryp wat die breedte en lengte en diepte en hoogte is, en die liefde van Christus kan ken wat die kennis te bowe gaan\" (3:17–19). \"Aan Hom wat mag het om te doen ver bo alles wat ons bid of dink\" (3:20).","bid":"Bid Paulus se gebede (1:17–19 en 3:16–19) oor ons gesin se kinders – noem hulle by die naam. Dank God vir Efesiërs 2:8–10: gered uit genade, geskep vir goeie werke. Bid vir eenheid tussen rasse en groepe in die kerk van Suid-Afrika.","vraag":"Efesiërs 2:10 sê ons is God se \"maaksel\" (Grieks poiēma, waarvan ons woord \"poësie\" kom) – Sy kunswerk. Hoe voel dit om te weet jy is God se kunswerk?","hoofstukke":[["Efesiërs","EPH",1],["Efesiërs","EPH",2],["Efesiërs","EPH",3]]},{"dag":369,"ref":"Efesiërs 4 – 6","titel":"Wandel Waardig: Eenheid, Nuwe Lewe, Gesin en die Wapenrusting","fase":7,"tydlyn":"c. 60–62 n.C. Geskryf uit gevangenskap.","agtergrond":"Paulus se \"huishoudelike reëls\" (5:21–6:9) spreek mans en vroue, kinders en ouers, slawe en here aan. In die Grieks-Romeinse wêreld het die vader van die huis amper absolute mag gehad. Paulus se riglyne was radikaal: almal moet aan mekaar onderdanig wees, mans moet hulle vroue liefhê soos Christus die kerk liefhet en Homself vir haar gegee het, en vaders moet hulle kinders nie terg nie. Paulus was waarskynlik aan 'n Romeinse soldaat vasgeketting toe hy die wapenrusting van God beskryf het.","leer":"Ons moet eenheid in die Gees bewaar, en God het gawes aan die kerk gegee om ons almal tot volwassenheid in Christus op te bou. Ons moet die ou mens aflê en die nuwe mens aantrek: die waarheid praat, ons woede beheer, nie steel nie, opbouende woorde spreek, mekaar vergewe. Ons moet in liefde en lig lewe en met die Gees vervul word. Die huwelik is 'n beeld van Christus en die kerk. Die Christen se stryd is geestelik, en God gee ons die wapenrusting om vas te staan.","skrif":"\"Wandel waardig die roeping waarmee julle geroep is\" (4:1). \"Een liggaam en een Gees... een Here, een geloof, een doop, een God en Vader van almal\" (4:4–6). \"Ons moet die waarheid betrag in liefde\" (4:15). \"Lê die oue mens af... en word vernuwe in die gees van julle gemoed, en beklee julle met die nuwe mens\" (4:22–24). \"Word toornig en moenie sondig nie; laat die son nie ondergaan oor julle toorn nie\" (4:26). \"Geen vuil woord moet uit julle mond uitgaan nie, maar net een wat goed is tot nodige stigting\" (4:29). \"Wees vriendelik teenoor mekaar, barmhartig, en vergewe mekaar soos God julle ook in Christus vergewe het\" (4:32). \"Word dan navolgers van God soos geliefde kinders\" (5:1). \"Wandel soos kinders van die lig\" (5:8). \"Word met die Gees vervul\" (5:18). \"Wees aan mekaar onderdanig in die vrees van God\" (5:21). \"Manne, julle moet jul vrouens liefhê soos Christus ook die gemeente liefgehad het en Homself daarvoor oorgegee het\" (5:25). \"Kinders, wees gehoorsaam aan julle ouers in die Here\" (6:1). \"Eer jou vader en moeder – dit is die eerste gebod met 'n belofte\" (6:2). \"En vaders, moenie julle kinders terg nie, maar voed hulle op in die tug en vermaning van die Here\" (6:4). \"Ons worsteling is n

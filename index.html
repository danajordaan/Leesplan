oning van die heerlikheid kom in – en Hy roep mense met rein hande en 'n suiwer hart.","skrif":"Psalm 22: \"My God, my God, waarom het U My verlaat?\"; \"Almal wat my sien, spot met my\"; \"my tong kleef aan my verhemelte\"; \"hulle het my hande en my voete deurgegrawe\"; \"Hulle verdeel my klere onder mekaar en werp die lot oor my gewaad\"; en die slot: \"al die eindes van die aarde sal... hulle tot die Here bekeer.\" Psalm 23: \"Die Here is my Herder; niks sal my ontbreek nie\"; \"Al gaan ek ook in 'n dal van doodskaduwee, ek sal geen onheil vrees nie; want U is met my.\" Psalm 24: \"Die aarde is die Here s'n en sy volheid\"; \"Wie sal klim op die berg van die Here? Hy wat rein van hande en suiwer van hart is\"; \"Hef julle koppe op, o poorte... dat die Koning van die heerlikheid kan ingaan!\"","bid":"Dank Jesus dat Hy verlaat is sodat ons nie verlaat sal word nie. Bid Psalm 23 saam en laat elkeen 'n vers hardop sê. Bid vir rein hande en 'n suiwer hart.","vraag":"Watter vers in Psalm 23 beteken die meeste vir jou op die oomblik? Waarom?","hoofstukke":[["Psalms","PSA",22],["Psalms","PSA",23],["Psalms","PSA",24]]},{"dag":121,"ref":"Psalms 25 – 29","titel":"\"Een Ding Vra Ek van die Here\"","fase":4,"tydlyn":"Aan Dawid toegeskryf.","agtergrond":"Psalm 25 is weer 'n alfabetiese gedig – 'n gebed vir leiding en vergifnis. Psalm 26 is 'n gebed van iemand wat opreg probeer lewe. Psalm 27 kombineer vertroue en verlange: Dawid se diepste begeerte is om by God te woon. Psalm 29 beskryf die \"stem van die Here\" in 'n donderstorm wat oor die land trek – moontlik doelbewus in kontras met die Kanaänitiese stormgod Baäl: die Here, nie Baäl nie, regeer oor die storm.","leer":"God lei die nederiges en leer hulle Sy weg. Ons grootste begeerte moet wees om naby God te wees en Sy skoonheid te sien. Wanneer ons bang is, is die Here ons lig en heil. God se stem is magtig oor die hele skepping, en Hy gee Sy volk krag en vrede.","skrif":"Psalm 25: \"Here, maak my u weë bekend, leer my u paaie\"; \"Die verborge omgang van die Here is vir die wat Hom vrees.\" Psalm 26: \"Toets my, Here, en beproef my.\" Psalm 27: \"Die Here is my lig en my heil, vir wie sal ek vrees?\"; \"Een ding het ek van die Here gebid, dit sal ek soek: dat ek in die huis van die Here mag woon al die dae van my lewe, om die lieflikheid van die Here te aanskou\"; \"Wag op die Here; wees sterk, en laat jou hart moedig wees.\" Psalm 28: \"Die Here is my sterkte en my skild.\" Psalm 29: \"Die stem van die Here is oor die waters\"; \"Die Here sal sy volk sterkte gee; die Here sal sy volk seën met vrede.\"","bid":"Bid Psalm 25: \"Here, leer my U paaie.\" Bid dat ons grootste begeerte sal wees om naby God te wees. Bring elkeen se vrese na God, die Lig en Heil.","vraag":"As jy net \"een ding\" van God kon vra, soos Dawid in Psalm 27, wat sou dit wees?","hoofstukke":[["Psalms","PSA",25],["Psalms","PSA",26],["Psalms","PSA",27],["Psalms","PSA",28],["Psalms","PSA",29]]},{"dag":122,"ref":"Psalms 30 – 33","titel":"Van Rou na Dans – die Vreugde van Vergifnis","fase":4,"tydlyn":"Aan Dawid toegeskryf. Psalm 30 se opskrif noem die inwyding van \"die huis\".","agtergrond":"Psalm 31 bevat die woorde wat Jesus laaste aan die kruis gebid het: \"In u hand gee ek my gees oor\" (Lukas 23:46). Psalm 32 is 'n boetepsalm wat Paulus aanhaal om te wys dat God die goddelose regverdig verklaar deur geloof (Romeine 4:6–8). Dit beskryf die fisiese en emosionele las van onbelyde sonde. Psalm 33 is 'n loflied oor God se skepping en voorsienigheid.","leer":"God se toorn duur 'n oomblik, maar Sy guns 'n leeftyd. Ons kan ons hele lewe in God se hande toevertrou, soos Jesus gedoen het. Sonde wat ons wegsteek, druk ons onder; sonde wat ons bely, word vergewe – en dan kom ware vreugde. God se planne staan vir ewig.","skrif":"Psalm 30: \"Saans vernag die geween, maar soggens is daar gejubel\"; \"U het my rouklag vir my in 'n koordans verander.\" Psalm 31: \"In u hand gee ek my gees oor\"; \"my tye is in u hand.\" Psalm 32: \"Welgeluksalig is hy wie se oortreding vergewe, wie se sonde bedek is\"; toe ek geswyg het, het my gebeente verouder; \"Ek het my sonde aan U bekend gemaak... en U het die skuld van my sonde vergewe\"; \"Ek wil jou onderrig en jou leer aangaande die weg wat jy moet gaan.\" Psalm 33: \"Deur die woord van die Here is die hemele gemaak\"; \"Die raad van die Here bestaan tot in ewigheid.\"","bid":"Dank God dat Hy ons rou in dans kan verander. Gee 'n oomblik stilte vir elkeen om in stilte sonde te bely, en lees dan Psalm 32:1 as 'n belofte. Bid: \"My tye is in U hand.\"","vraag":"Psalm 32 beskryf hoe dit voel om sonde weg te steek. Hoe voel dit, en hoe voel dit wanneer jy dit bely het?","hoofstukke":[["Psalms","PSA",30],["Psalms","PSA",31],["Psalms","PSA",32],["Psalms","PSA",33]]},{"dag":123,"ref":"Psalms 34 – 37","titel":"\"Smaak en Sien dat die Here Goed Is\"","fase":4,"tydlyn":"Psalm 34 se opskrif verbind dit met Dawid se vlug na die Filistyne, toe hy hom kranksinnig gehou het (1 Samuel 21:10–15; die koning word hier Abimelek genoem – moontlik 'n titel vir Filistynse konings).","agtergrond":"Dawid het in 'n vernederende situasie God se redding beleef en skryf dan 'n alfabetiese lofpsalm. Psalm 34 word in 1 Petrus 3:10–12 aangehaal, en \"geen been van Hom sal verbreek word nie\" word in Johannes 19:36 op Jesus toegepas. Psalm 35 is 'n gebed teen onregverdige vyande. Psalm 36 kontrasteer die goddelose se hart met God se oneindige goedertierenheid. Psalm 37 is wysheid vir wanneer dit lyk of slegte mense voorspoedig is.","leer":"Wie God soek en na Hom kyk, word nie beskaam nie. God is naby die gebrokenes van hart. Ons moet nie jaloers of ontsteld wees oor die voorspoed van goddeloses nie, maar ons in die Here verlustig, ons weg aan Hom toevertrou en geduldig wag. God se goedertierenheid is groter as ons kan meet.","skrif":"Psalm 34: \"Ek wil die Here loof te alle tye\"; \"Smaak en sien dat die Here goed is; welgeluksalig is die man wat by Hom skuil\"; \"Die Here is naby die wat gebroke is van hart.\" Psalm 35: \"Pleit my saak, o Here.\" Psalm 36: \"Here, u goedertierenheid is tot in die hemel\"; \"By U is die fontein van die lewe; in u lig sien ons die lig.\" Psalm 37: \"Moenie kwaad word oor die kwaaddoeners nie\"; \"Verlustig jou in die Here, dan sal Hy jou gee die begeertes van jou hart\"; \"Laat jou weg aan die Here oor en vertrou op Hom, en Hy sal dit uitvoer\"; \"Die stappe van 'n man word deur die Here bevestig.\"","bid":"Dank God vir spesifieke maniere waarop ons \"gesmaak en gesien\" het dat Hy goed is. Bid vir enigiemand wat gebroke van hart is. Bid dat ons ons in die Here sal verlustig, en ons toekoms aan Hom sal toevertrou.","vraag":"Psalm 37:4 sê: \"Verlustig jou in die Here, dan sal Hy jou gee die begeertes van jou hart.\" Wat beteken dit – en wat beteken dit nie?","hoofstukke":[["Psalms","PSA",34],["Psalms","PSA",35],["Psalms","PSA",36],["Psalms","PSA",37]]},{"dag":124,"ref":"Psalms 38 – 41","titel":"Geduldig Wag en 'n Nuwe Lied","fase":4,"tydlyn":"Aan Dawid toegeskryf. Psalm 41 sluit Boek I van die Psalms af met 'n lofprysing.","agtergrond":"Psalm 38 is 'n boetepsalm van iemand wat siek is en sy sonde as oorsaak sien (let wel: nie alle siekte is 'n gevolg van sonde nie, vgl. Johannes 9:3). Psalm 39 dink na oor hoe kort die lewe is. Psalm 40 word in Hebreërs 10:5–7 op Jesus toegepas: Hy het gekom om God se wil te doen, en Sy gehoorsaamheid vervang die offers. Psalm 41 noem die vriend wat sy hakskeen teen hom oplig – Jesus haal dit oor Judas aan (Johannes 13:18).","leer":"God hoor die geduldige gebed en trek ons uit die modder. Die lewe is kort; daarom moet ons ons hoop op God stel en wys leef. Jesus het die volmaakte gehoorsaamheid gelewer wat God werklik verlang. God seën dié wat vir die armes sorg.","skrif":"Psalm 38: \"My sondes gaan oor my hoof\"; \"Here, al my begeerte is voor U.\" Psalm 39: \"Here, maak my einde aan my bekend... dat ek mag weet hoe verganklik ek is\"; \"my hoop – dit is op U!\" Psalm 40: \"Ek het lankmoedig gewag op die Here\"; \"Hy het my uitgetrek uit die kuil van verderf, uit die modderige slyk\"; \"Hy het 'n nuwe lied in my mond gegee\"; \"Ek het lus om u welbehae te doen, o my God, en u wet is binne-in my.\" Psalm 41: \"Welgeluksalig is hy wat ag gee op die arme\"; \"Selfs die man met wie ek in vrede gelewe het, op wie ek vertrou het, wat my brood eet, het sy hakskeen teen my groot gemaak.\" \"Geloofd sy die Here, die God van Israel, van ewigheid tot ewigheid! Amen, ja amen.\"","bid":"Bid vir geduld om op God te wag. Dank God vir elke keer dat Hy ons uit \"die modder\" getrek het. Bid dat ons, soos Jesus, lus sal hê om God se wil te doen. Bid vir die armes in ons omgewing.","vraag":"Psalm 39 vra God om ons te leer hoe kort die lewe is. Hoe sou dit jou keuses verander as jy dit gereeld onthou?","hoofstukke":[["Psalms","PSA",38],["Psalms","PSA",39],["Psalms","PSA",40],["Psalms","PSA",41]]},{"dag":125,"ref":"Psalms 42 – 46","titel":"\"Soos 'n Takbok Smag\" – God is ons Toevlug","fase":4,"tydlyn":"Boek II begin. Psalm 42–49 word aan die \"seuns van Korag\" toegeskryf – 'n Levitiese familie van sangers in die tempel (nakomelinge van die Korag van Numeri 16, wie se kinders nie gesterf het nie, Numeri 26:11).","agtergrond":"Psalm 42 en 43 was waarskynlik een gedig met 'n refrein (\"Wat buig jy jou neer, o my siel?\"). Die skrywer is ver van Jerusalem, in die noorde by die Hermon en die bronne van die Jordaan. Psalm 44 is 'n volkslag in 'n tyd van nederlaag. Psalm 45 is 'n koninklike troulied; Hebreërs 1:8–9 pas dit op Jesus toe. Psalm 46 het Martin Luther geïnspireer om \"'n Vaste Burg is onse God\" te skryf.","leer":"Ons siel dors na God self, nie net na Sy gawes nie. Wanneer ons neerslagtig is, kan ons met ons eie siel praat en dit na God wys. Ons hoef nie te vrees nie, selfs as die aarde verander, want God is ons toevlug en sterkte. Soms is die regte antwoord om stil te word en te weet dat Hy God is.","skrif":"Psalm 42: \"Soos 'n hert wat smag na waterstrome, so smag my siel na U, o God\"; \"Wat buig jy jou neer, o my siel... Hoop op God, want ek sal Hom nog loof.\" Psalm 43: \"Stuur u lig en u waarheid, laat dit my lei.\" Psalm 44: \"Ontwaak! Waarom slaap U, Here?\" Psalm 45: \"U troon, o God, is vir ewig en altyd.\" Psalm 46: \"God is vir ons 'n toevlug en sterkte; as hulp in benoudhede baie beproef. Daarom sal ons nie vrees nie, al verander die aarde van plek\"; \"Laat staan en weet dat Ek God is.\"","bid":"Bid dat ons, soos 'n dors takbok, na God self sal verlang. Praat saam met ons siele: \"Hoop op God!\" Bid vir mense wat neerslagtig of depressief is. Neem 'n minuut stilte saam, \"en weet dat Hy God is\".","vraag":"Psalm 46 sê \"Laat staan en weet dat Ek God is.\" Hoe kry 'n mens stilte in 'n lawaaierige, besige lewe?","hoofstukke":[["Psalms","PSA",42],["Psalms","PSA",43],["Psalms","PSA",44],["Psalms","PSA",45],["Psalms","PSA",46]]},{"dag":126,"ref":"Psalms 47 – 51","titel":"\"Skep vir My 'n Rein Hart, o God\"","fase":4,"tydlyn":"Psalm 47–49 van die seuns van Korag; Psalm 50 van Asaf (een van Dawid se hoofmusikante, 1 Kronieke 16:5); Psalm 51 van Dawid, ná Natan se teregwysing oor Batseba (2 Samuel 12).","agtergrond":"Psalm 47 en 48 vier God as Koning van die hele aarde en Sion (Jerusalem) as Sy stad. Psalm 49 is 'n wysheidspsalm: rykdom kan nie 'n mens van die dood loskoop nie. Psalm 50 is 'n hofsaak: God is nie behoeftig aan diere-offers nie, maar wil dankbaarheid en opregtheid. Psalm 51 is die mees bekende berou-psalm in die Bybel.","leer":"God is Koning oor alle nasies. Geld kan ons nie red nie. God soek nie uiterlike godsdiens nie, maar 'n dankbare, eerlike en gebroke hart. Ware berou erken sonde as sonde teen God, vra nie net om vergifnis nie maar om 'n nuwe hart, en lei tot vreugde en getuienis.","skrif":"Psalm 47: \"Klap in die hande, o volke almal!\" Psalm 48: \"Groot is die Here en baie te prys.\" Psalm 49: \"'n Broer kan niemand ooit loskoop nie... maar God sal my siel loskoop uit die mag van die doderyk.\" Psalm 50: \"Aan My behoort al die wild van die bos, die vee op duisend berge\"; \"Offer aan God lof.\" Psalm 51: \"Wees my genadig, o God, na u goedertierenheid\"; \"Teen U alleen het ek gesondig\"; \"Skep vir my 'n rein hart, o God, en vernuwe in my binneste 'n vaste gees\"; \"Gee my weer die vreugde van u heil\"; \"Die offers van God is 'n gebroke gees; 'n gebroke en verslae hart sal U, o God, nie verag nie.\"","bid":"Bid Psalm 51 saam as 'n gesinsgebed. Vra God vir 'n rein hart vir elkeen van ons. Dank Hom dat Hy 'n gebroke en verslae hart nie verag nie.","vraag":"Dawid het nie net gevra om vergewe te word nie, maar om 'n \"rein hart\". Wat is die verskil?","hoofstukke":[["Psalms","PSA",47],["Psalms","PSA",48],["Psalms","PSA",49],["Psalms","PSA",50],["Psalms","PSA",51]]},{"dag":127,"ref":"Psalms 52 – 57","titel":"Vertroue in die Grot","fase":4,"tydlyn":"Verskeie psalms se opskrifte verbind hulle met Dawid se vlug vir Saul (c. 1015–1010 v.C.): Psalm 52 (Doëg verraai hom, 1 Samuel 22), Psalm 54 (die Sifiete verraai hom, 1 Samuel 23), Psalm 56 (die Filistyne gryp hom in Gat), Psalm 57 (in die grot).","agtergrond":"Hierdie psalms gee ons 'n blik in Dawid se hart terwyl hy gejag, verraai en in grotte weggekruip het. Psalm 53 is byna dieselfde as Psalm 14 (met \"God\" in plaas van \"Here\" – 'n kenmerk van Boek II). Psalm 55 beskryf die pyn van verraad deur 'n naby vriend.","leer":"Wanneer mense ons verraai of ons bang is, kan ons ons vertroue doelbewus op God stel. Ons kan ons las op die Here werp – Hy sal ons onderhou. God hou elke traan by. Selfs in die grot kan ons lofsing, want God se goedertierenheid is groter as ons omstandighede.","skrif":"Psalm 52: \"Ek is soos 'n groen olyfboom in die huis van God; ek vertrou op die goedertierenheid van God.\" Psalm 54: \"Kyk, God is my helper.\" Psalm 55: \"Ag, had ek maar vlerke soos 'n duif\"; \"dit is nie 'n vyand wat my smaad nie... maar jy, my vertroude vriend\"; \"Werp jou sorg op die Here, en Hy sal jou onderhou.\" Psalm 56: \"Die dag as ek bevrees is, vertrou ek op U\"; \"Sit my trane in u kruik – is hulle nie in u boek nie?\"; \"Op God vertrou ek, ek sal nie vrees nie; wat kan 'n mens aan my doen?\" Psalm 57: \"Wees my genadig, o God... want by U skuil my siel; ja, in die skaduwee van u vlerke skuil ek\"; \"Ek wil die dageraad wakker maak.\"","bid":"Werp elkeen se sorge op die Here. Bid vir enigiemand wat deur 'n vriend verraai is. Dank God dat Hy elke traan raaksien en \"in Sy kruik\" bewaar.","vraag":"Psalm 56 sê: \"Die dag as ek bevrees is, vertrou ek op U.\" Wat maak jy prakties wanneer jy bang is?","hoofstukke":[["Psalms","PSA",52],["Psalms","PSA",53],["Psalms","PSA",54],["Psalms","PSA",55],["Psalms","PSA",56],["Psalms","PSA",57]]},{"dag":128,"ref":"Psalms 58 – 63","titel":"\"My Siel Dors na U\" – in die Woestyn","fase":4,"tydlyn":"Psalm 59 se opskrif verbind dit met Saul se manne wat Dawid se huis bewaak (1 Samuel 19:11); Psalm 60 met oorloë teen Aram en Edom (2 Samuel 8); Psalm 63 met Dawid in die woestyn van Juda.","agtergrond":"Psalm 58 is 'n skerp gebed teen onregverdige regters – sulke \"vloekpsalms\" vra God om die onreg te stop. Dit leer ons om wraak aan God oor te laat eerder as om dit self te neem (Romeine 12:19). Psalm 61 en 62 praat van God as rots en toevlug. Die woestyn van Juda, wes van die Dooie See, is droog en dor – die perfekte beeld vir Psalm 63 se \"dorstige land sonder water\".","leer":"Ons mag ons woede oor onreg na God bring, en dit aan Hom oorlaat. Ons siel kan net in God rus vind. God se goedertierenheid is beter as die lewe self. Ons dors na God moet dieper word as ons dors na enigiets anders.","skrif":"Psalm 58: \"Waarlik, daar is 'n God wat op die aarde oordeel.\" Psalm 59: \"U is my rotsvesting.\" Psalm 60: \"Met God sal ons kragtige dade doen.\" Psalm 61: \"Lei my op 'n rots wat vir my te hoog is.\" Psalm 62: \"Net op God wag my siel stil\"; \"Vertrou op Hom te alle tye, o volk; stort julle hart voor sy aangesig uit.\" Psalm 63: \"O God, U is my God, U soek ek vroeg; my siel dors na U... in 'n dor en uitgedroogde land sonder water\"; \"Want u goedertierenheid is beter as die lewe\"; \"In die skaduwee van u vlerke jubel ek.\"","bid":"Bid vir ware dors na God – meer as na sukses, vriende of vermaak. Stort jou hart voor God uit oor enige onreg wat ons sien. Dank God dat Sy liefde beter is as die lewe.","vraag":"Psalm 62 sê: \"Net op God wag my siel stil.\" Wat is die verskil tussen rus vind in God en rus vind in ander dinge (bv. 'n foon, vermaak)?","hoofstukke":[["Psalms","PSA",58],["Psalms","PSA",59],["Psalms","PSA",60],["Psalms","PSA",61],["Psalms","PSA",62],["Psalms","PSA",63]]},{"dag":129,"ref":"Psalms 64 – 68","titel":"God van die Oes en die Nasies","fase":4,"tydlyn":"Grootliks aan Dawid toegeskryf.","agtergrond":"Psalm 65 is 'n danklied vir die oes en die reën – in 'n landbou-samelewing het alles van die reën afgehang. Psalm 66 nooi die hele aarde om te kom kyk wat God gedoen het (met verwysing na die Rietsee). Psalm 67 brei die priesterlike seën (Numeri 6:24–26) uit na al die nasies. Psalm 68 is 'n triomflied oor God wat as Oorwinnaar optrek; Paulus pas 'n vers daarvan op Jesus se hemelvaart toe (Efesiërs 4:8).","leer":"God voorsien vir die hele skepping en ons moet dankbaar wees vir elke maaltyd en elke reënbui. Wat God vir ons gedoen het, moet ons aan ander vertel. God seën ons sodat al die nasies Hom kan ken. God is 'n Vader vir die wese en sorg vir die eensames.","skrif":"Psalm 64: die regverdige sal hom in die Here verbly. Psalm 65: \"U kroon die jaar van u goedheid.\" Psalm 66: \"Kom en sien die dade van God\"; \"As ek op ongeregtigheid in my hart ag gegee het, sou die Here nie gehoor het nie.\" Psalm 67: \"Mag God ons genadig wees en ons seën; mag Hy sy aangesig oor ons laat lig, sodat u weg op aarde bekend kan word, u heil onder al die nasies.\" Psalm 68: \"'n Vader van die wese en 'n Regter van die weduwees is God\"; \"God laat die eensames in 'n huis woon\"; \"Geloofd sy die Here! Dag vir dag dra Hy ons.\"","bid":"Dank God vir ons kos, die reën en die oes. Bid Psalm 67 vir die nasies – vir sendelinge en vir mense wat nog nie van Jesus gehoor het nie. Bid vir wese en eensame mense.","vraag":"Psalm 66 sê \"kom en sien\" en vertel ander wat God gedoen het. Wat het God vir jou gedoen wat jy vir 'n vriend kan vertel?","hoofstukke":[["Psalms","PSA",64],["Psalms","PSA",65],["Psalms","PSA",66],["Psalms","PSA",67],["Psalms","PSA",68]]},{"dag":130,"ref":"Psalms 69 – 72","titel":"\"Die Ywer vir U Huis\" en die Ideale Koning","fase":4,"tydlyn":"Psalm 69–70 aan Dawid toegeskryf; Psalm 71 is 'n gebed van 'n ou man; Psalm 72 word aan Salomo toegeskryf en sluit Boek II af (\"Die gebede van Dawid, die seun van Isai, is ten einde\").","agtergrond":"Psalm 69 word dikwels in die Nuwe Testament op Jesus toegepas: \"die ywer vir u huis het my verteer\" (Johannes 2:17, by die tempelreiniging), en die asyn wat Hy in Sy dors gekry het (Matteus 27:34, 48). Psalm 71 is die gebed van iemand wat van jongs af op God vertrou het en nou oud is. Psalm 72 beskryf die ideale koning: regverdig, sorgsaam teenoor armes, met 'n koninkryk tot aan die eindes van die aarde. Geen koning van Israel het dit volkome vervul nie – net Jesus.","leer":"Jesus het vir ons die smaad en lyding gedra. God is getrou van ons jeug tot ons ouderdom, en ons geloof moet aan die volgende geslag oorgedra word. Die ware Koning regeer met geregtigheid en red die armes – en Sy Naam sal vir ewig bestaan.","skrif":"Psalm 69: \"Red my, o God, want die waters het gekom tot aan my siel\"; \"Die ywer vir u huis het my verteer\"; \"in my dors het hulle my asyn laat drink.\" Psalm 70: \"Haas U, o God, om my te red!\" Psalm 71: \"U is my hoop... my vertroue van my jeug af\"; \"Ook tot die ouderdom en die grysheid toe, o God, moet U my nie verlaat nie, totdat ek u arm verkondig aan die nageslag.\" Psalm 72: die koning sal reg doen aan die ellendiges van die volk; \"Hy sal heers van see tot see\"; \"Sy naam sal vir ewig bestaan\"; \"En die hele aarde moet van sy heerlikheid vol word! Amen, ja amen.\"","bid":"Dank Jesus dat Hy die smaad vir ons gedra het. Bid vir ons oupas en oumas, dat hulle hul geloof aan ons kinders sal oordra. Bid dat ons gesin se kinders van hulle jeug af op God sal vertrou – en eendag dit self aan die volgende geslag sal oordra. Bid vir die koms van Jesus se koninkryk.","vraag":"Psalm 71 sê die skrywer vertrou op God \"van my jeug af\". Hoe kan jy nou al, as jongmens, jou vertroue op God bou?","hoofstukke":[["Psalms","PSA",69],["Psalms","PSA",70],["Psalms","PSA",71],["Psalms","PSA",72]]},{"dag":131,"ref":"1 Konings 1 – 2","titel":"Salomo word Koning","fase":4,"inleiding":["Salomo en die Wysheidsboeke","Salomo (c. 970–930 v.C.) was die seun van Dawid en Batseba. Hy het om wysheid gebid, die eerste tempel gebou en Israel na die toppunt van sy rykdom en invloed gelei. Maar sy hart het later van die Here afgedraai. Saam met sy geskiedenis (1 Konings 1–11) lees ons die wysheidsboeke wat met hom verbind word: Spreuke (grootliks aan hom toegeskryf, met bydraes van ander wyses), Hooglied (\"die lied van liedere, van Salomo\") en Prediker (tradisioneel aan Salomo toegeskryf; sommige geleerdes meen dit is later deur 'n wysheidsleraar geskryf wat in Salomo se stem praat)."],"tydlyn":"c. 970 v.C. Jerusalem. Dawid is oud (hy sterf op sowat 70).","agtergrond":"Die boeke Konings (oorspronklik een boek) beskryf die geskiedenis van Israel se konings van Salomo tot die ballingskap (c. 970–560 v.C.). Dit is geskryf vanuit die perspektief van die ballingskap, om te verduidelik waarom dit gebeur het: die konings en die volk het die verbond verbreek. Adonia, Dawid se oudste oorlewende seun, roep homself as koning uit sonder Dawid se seën. Natan en Batseba sorg dat Dawid sy belofte aan Salomo nakom. Dawid se laaste opdragte sluit die afhandeling van ou rekeninge in (Joab, Simei).","leer":"Selfsugtige ambisie (Adonia) kan God se plan nie keer nie. Dawid se laaste raad aan sy seun is die kern van 'n suksesvolle lewe: wees sterk, wees 'n man, en hou God se gebooie. Elke geslag moet self kies om God te volg.","skrif":"Adonia: \"Ek sal koning word\" (1:5). Dawid het hom nooit teregwys nie (1:6). Natan en Batseba se ingryping (1:11–31). Salomo word gesalf in Gihon (1:38–40). Dawid: \"Wees sterk en wees 'n man; en neem die verordening van die Here jou God in ag... sodat jy voorspoedig kan wees in alles wat jy doen\" (2:2–3). Dawid sterf ná 40 jaar as koning (2:10–11). \"Die koningskap is in die hand van Salomo bevestig\" (2:46).","bid":"Bid vir die seuns in ons gesin – dat hulle \"sterk en manne\" sal wees deur God se gebooie te hou. Bid vir die dogter in ons gesin – dat sy sterk sal staan in die Here. Bid vir ouers om hul kinders betyds en liefdevol reg te wys (1:6).","vraag":"Dawid sê \"wees 'n man\" deur God se gebooie te hou. Hoe verskil dit van die wêreld se idee van 'n \"regte man\"?","hoofstukke":[["1 Konings","1KI",1],["1 Konings","1KI",2]]},{"dag":132,"ref":"1 Konings 3 – 4","titel":"Salomo Vra vir Wysheid","fase":4,"tydlyn":"c. 970–966 v.C. Gibeon (waar die tabernakel toe was, 2 Kronieke 1:3) en Jerusalem.","agtergrond":"Salomo trou met die farao se dogter – 'n politieke huwelik wat Israel se status wys, maar ook die begin van sy probleme (vgl. Deuteronomium 17:17). Die volk offer nog op die \"hoogtes\" (plaaslike heiligdomme), omdat die tempel nog nie gebou is nie. By Gibeon verskyn God aan Salomo in 'n droom. Die verhaal van die twee vroue wys sy wysheid in die praktyk. Hoofstuk 4 beskryf sy administrasie, rykdom en wye kennis – 3 000 spreuke en 1 005 liedere (4:32).","leer":"Die beste ding om van God te vra, is 'n \"hart wat luister\" (Hebreeus: lev shomea) – wysheid om reg en verkeerd te onderskei en ander goed te dien. God gee ruim aan dié wat eerste die regte dinge soek (vgl. Matteus 6:33). Wysheid is prakties: dit wys in moeilike, alledaagse besluite.","skrif":"Salomo het die Here liefgehad, behalwe dat hy op die hoogtes geoffer het (3:3). \"Vra wat Ek jou moet gee\" (3:5). \"Ek is nog 'n jong seun... gee dan aan u kneg 'n hart wat luister, om u volk te regeer, om te onderskei tussen goed en kwaad\" (3:7, 9). God gee wysheid, en ook rykdom en eer (3:12–13). Die oordeel tussen die twee vroue (3:16–28). \"Hulle het gesien dat die wysheid van God in hom was om reg te doen\" (3:28). Juda en Israel was baie, en hulle het geëet en gedrink en vrolik gewees (4:20). Salomo se wysheid was groter as dié van al die oosterlinge (4:30).","bid":"Bid soos Salomo vir 'n hart wat luister en wysheid om tussen goed en kwaad te onderskei – vir ons gesin se kinders in hul skoolwerk, vriendskappe en keuses. Bid dat ons eerste God se dinge sal soek.","vraag":"As God vir jou sê \"vra wat Ek jou moet gee\", wat sou jy vra? Waarom?","hoofstukke":[["1 Konings","1KI",3],["1 Konings","1KI",4]]},{"dag":133,"ref":"1 Konings 5 – 7","titel":"Die Bou van die Tempel","fase":4,"tydlyn":"Die tempel word begin in Salomo se vierde jaar, c. 966 v.C. (6:1), en voltooi ná sewe jaar (6:38). Jerusalem, op die berg Moria.","agtergrond":"Hiram, koning van Tirus (in Fenisië, die huidige Libanon), voorsien sederhout van die Libanon en vakmanne. Die Fenisiërs was bekende bouers en handelaars. Die tempel was nie baie groot nie (sowat 30 m lank, 10 m breed, 15 m hoog), maar uiters ryk versier met goud. Klip is by die steengroef voorberei, sodat geen hamer op die bouterrein gehoor is nie (6:7). Salomo se eie paleis het 13 jaar geneem (7:1) – byna twee keer so lank as die tempel.","leer":"God verdien ons beste. Sy tempel was die plek waar Hy tussen Sy volk woon – 'n beeld wat vervul word in Jesus (\"Breek hierdie tempel af, en in drie dae sal Ek dit oprig\", Johannes 2:19) en in die kerk (\"julle is die tempel van God\", 1 Korintiërs 3:16). Maar God sê duidelik: Sy teenwoordigheid hang af van gehoorsaamheid, nie van 'n gebou nie.","skrif":"Salomo wil 'n huis bou vir die Naam van die Here (5:5). Hiram se samewerking (5:7–12). Die tempel word begin 480 jaar ná die uittog (6:1). Geen hamer of byl is gehoor nie (6:7). God: \"As jy in my insettinge wandel... sal Ek in die midde van die kinders van Israel woon\" (6:12–13). Die binnekant met goud oorgetrek (6:21–22). Salomo bou sy paleis 13 jaar lank (7:1). Die bronspilare Jakin en Boas (7:21). Die gegote see (7:23).","bid":"Dank God dat Hy deur Sy Gees in ons woon – ons is Sy tempel. Bid dat ons liggaam en lewe Hom sal eer (1 Korintiërs 6:19–20). Bid dat ons God ons beste sal gee, en nie meer tyd aan ons eie \"paleis\" as aan Sy werk sal spandeer nie.","vraag":"Salomo het 7 jaar aan God se huis en 13 jaar aan sy eie huis gebou. Wat sê dit dalk oor sy prioriteite?","hoofstukke":[["1 Konings","1KI",5],["1 Konings","1KI",6],["1 Konings","1KI",7]]},{"dag":134,"ref":"1 Konings 8 – 9","titel":"Die Inwyding van die Tempel en Salomo se Gebed","fase":4,"tydlyn":"c. 959 v.C. Die inwyding vind plaas tydens die Huttefees in die sewende maand (8:2).","agtergrond":"Die ark word in die Allerheiligste geplaas, en die wolk van God se heerlikheid vul die tempel – soos by die tabernakel (Exodus 40:34). Salomo se gebed (8:22–53) is een van die langste gebede in die Bybel. Hy erken dat God nie in 'n huis ingeperk kan word nie, en vra dat God sal hoor wanneer mense na die tempel toe bid – ook vreemdelinge en mense in ballingskap (wat later presies gebeur, vgl. Daniël 6:10). In hoofstuk 9 verskyn God weer aan Salomo met 'n belofte én 'n waarskuwing.","leer":"God is groter as enige gebou, maar Hy wil hoor wanneer Sy volk bid. Daar is vergifnis vir dié wat hulle bekeer. God se huis is ook vir die nasies. God se seën is nie outomaties nie – dit hang af van trou aan Hom.","skrif":"Die heerlikheid van die Here vul die huis (8:10–11). \"Maar sou God waarlik op die aarde woon? Kyk, die hemel, ja, die hemel van die hemele kan U nie bevat nie\" (8:27). Hoor en vergewe (8:30). Die vreemdeling wat bid (8:41–43). \"Daar is geen mens wat nie sondig nie\" (8:46). Bekering in ballingskap (8:47–50). \"Nie een woord het verval van al sy goeie woorde nie\" (8:56). God se waarskuwing: as julle afwyk... (9:4–9).","bid":"Dank God dat Hy hoor wanneer ons bid, waar ons ook al is. Bid vir vreemdelinge en buitestaanders om God te leer ken. Bid vir 'n getroue hart, sodat ons nie God se seëninge as vanselfsprekend aanvaar nie.","vraag":"Salomo sê selfs die hemel kan God nie bevat nie. Hoe kan so 'n groot God dan ons klein gebede hoor?","hoofstukke":[["1 Konings","1KI",8],["1 Konings","1KI",9]]},{"dag":135,"ref":"1 Konings 10 – 11","titel":"Glorie en Val: Salomo se Hart Draai Weg","fase":4,"tydlyn":"c. 950–930 v.C. Jerusalem; die koningin van Skeba (waarskynlik uit Suid-Arabië, die huidige Jemen).","agtergrond":"Salomo se rykdom en roem bereik 'n hoogtepunt: die koningin van Skeba kom van ver af om sy wysheid te toets. Jesus verwys later na haar (Matteus 12:42 – \"meer as Salomo is hier\"). Maar Salomo oortree al drie die waarskuwings vir konings in Deuteronomium 17:16–17: hy vermeerder perde (en koop dit in Egipte), silwer en goud, en vroue (700 vroue en 300 byvroue, 11:3). Baie was politieke huwelike met buitelandse prinsesse, en hulle het hul gode saamgebring. God laat teëstanders opstaan en kondig aan dat die koninkryk verdeel sal word.","leer":"Wysheid en seën is geen waarborg teen afvalligheid nie. Klein kompromieë, oor jare, kan 'n hart heeltemal van God wegdraai. Om met iemand te trou wat nie die Here liefhet nie, kan jou geloof skade aandoen. Selfs die wysste mens het 'n Verlosser nodig. Jesus is \"meer as Salomo\".","skrif":"Die koningin van Skeba: \"Die helfte is my nie meegedeel nie\" (10:7). \"Geseënd is die Here jou God\" (10:9). Salomo se rykdom: silwer was soos klippe in Jerusalem (10:27). Perde uit Egipte (10:28). \"Koning Salomo het baie vreemde vroue liefgehad\" (11:1). \"Sy vroue het sy hart afgetrek agter ander gode aan\" (11:4). Hy bou hoogtes vir Kamos en Molog (11:7). \"Die Here was toornig op Salomo, omdat sy hart afgewyk het\" (11:9). Die profeet Ahia skeur sy mantel in twaalf stukke (11:29–31). Ter wille van Dawid sal een stam bly (11:32–36).","bid":"Bid dat ons harte nie stadig van God sal wegdryf nie. Bid nou al vir ons gesin se kinders se toekomstige huweliksmaats – mense wat die Here liefhet. Dank Jesus dat Hy die ware wysheid van God is (1 Korintiërs 1:24) en ons nooit sal verlaat nie.","vraag":"Salomo was die wysste mens, maar het tog van God weggedraai. Hoe beskerm ons ons harte teen so 'n stadige wegdrywing?","hoofstukke":[["1 Konings","1KI",10],["1 Konings","1KI",11]]},{"dag":136,"ref":"Spreuke 1 – 3","titel":"Die Vrees van die Here is die Begin van Kennis","fase":4,"tydlyn":"Grootliks deur Salomo (c. 970–930 v.C.), met latere bydraes; die boek is in sy finale vorm saamgestel in die tyd van koning Hiskia of later (25:1).","agtergrond":"Spreuke is wysheid vir die alledaagse lewe – kort, kragtige uitsprake wat waarhede in 'n paar woorde saamvat. Hoofstukke 1–9 is grootliks 'n vader se toesprake aan sy seun (\"my seun\"), wat perfek geskik is vir 'n pa wat met sy kinders praat. Spreuke is algemene beginsels oor hoe die lewe gewoonlik werk, nie onvoorwaardelike beloftes nie. \"Wysheid\" word as 'n vrou voorgestel wat op die strate roep, teenoor \"dwaasheid\".","leer":"Ware wysheid begin by eerbied vir God. Ons moet kies na wie ons luister – na God se wysheid of na die stem van die \"sondaars\" wat ons wil verlei. Vertrou die Here met jou hele hart, nie jou eie insig nie, en Hy sal jou paaie gelykmaak. God se tug is 'n bewys van Sy liefde.","skrif":"\"Die vrees van die Here is die begin van kennis; die dwase verag wysheid en tug\" (1:7). \"My seun, luister na die tug van jou vader en verwerp nie die onderwysing van jou moeder nie\" (1:8). \"My seun, as sondaars jou wil oorhaal, moenie toestem nie\" (1:10). Die Wysheid roep op die strate (1:20). \"Vertrou op die Here met jou hele hart en steun nie op jou eie insig nie. Ken Hom in al jou weë, dan sal Hy jou paaie gelykmaak\" (3:5–6). \"Eer die Here met jou besitting\" (3:9). \"Die Here tugtig hom wat Hy liefhet, soos 'n vader die seun in wie hy behae het\" (3:12).","bid":"Bid dat elkeen van ons God met eerbied sal vrees en wysheid sal soek. Bid Spreuke 3:5–6 oor elke kind se toekoms. Bid dat ons kinders sterk sal staan as \"sondaars hulle wil oorhaal\".","vraag":"Spreuke 3:5 sê \"steun nie op jou eie insig nie\". Wanneer is dit moeilik om God meer te vertrou as jou eie gedagtes?","hoofstukke":[["Spreuke","PRO",1],["Spreuke","PRO",2],["Spreuke","PRO",3]]},{"dag":137,"ref":"Spreuke 4 – 6","titel":"Bewaar Jou Hart","fase":4,"tydlyn":"Grootliks deur Salomo.","agtergrond":"Die vader praat verder met sy seun en herinner hom dat hy dit self by sy eie vader geleer het (4:3–4) – wysheid word van geslag tot geslag oorgedra. Hoofstuk 5 waarsku teen die \"vreemde vrou\" (seksuele versoeking buite die huwelik) en moedig getrouheid in die huwelik aan (let wel: volwasse temas – gesels ouderdomsgepas). Hoofstuk 6 waarsku teen borgstaan vir ander se skuld, luiheid (die mier as voorbeeld), en noem sewe dinge wat God haat.","leer":"Ons hart is die bron van ons hele lewe – wat ons dink, kyk en begeer, bepaal wie ons word. Daarom moet ons dit bewaak. Seksuele sonde beloof soetigheid, maar bring bitterheid. Hardwerkendheid en eerlikheid is wysheid; luiheid, trots en twisstokery is dwaasheid.","skrif":"\"Die begin van wysheid is: verwerf wysheid\" (4:7). \"Die pad van die regverdiges is soos die lig van die môre wat aldeur helderder word\" (4:18). \"Bewaar jou hart bo alles wat bewaar moet word, want daaruit is die oorspronge van die lewe\" (4:23). Waarskuwing teen die vreemde vrou (5:3–14). \"Verbly jou in die vrou van jou jeug\" (5:18). \"Gaan na die mier, luiaard, kyk na sy weë en word wys\" (6:6). Sewe dinge wat die Here haat (6:16–19): hoogmoedige oë, 'n valse tong, hande wat onskuldige bloed vergiet, 'n hart wat slegte planne smee, voete wat haastig is om kwaad te doen, 'n vals getuie, en een wat twis tussen broers saai.","bid":"Bid dat elkeen van ons sy of haar hart sal bewaak – ook teen wat ons op skerms kyk. Bid vir ywer in skoolwerk en take. Gaan saam deur die sewe dinge wat God haat en vra Hom om ons daarvan te bewaar.","vraag":"Wat is praktiese maniere waarop 'n tiener sy of haar \"hart kan bewaar\"?","hoofstukke":[["Spreuke","PRO",4],["Spreuke","PRO",5],["Spreuke","PRO",6]]},{"dag":138,"ref":"Spreuke 7 – 9","titel":"Twee Uitnodigings: Wysheid of Dwaasheid","fase":4,"tydlyn":"Grootliks deur Salomo.","agtergrond":"Hoofstuk 7 vertel die verhaal van 'n naïewe jongman wat in die skemer deur 'n verleidelike vrou van die regte pad weggelok word – soos \"'n os wat na die slagplek gaan\" (let wel: volwasse tema; gesels ouderdomsgepas). Hoofstuk 8 laat die Wysheid self praat: sy was by God voor die skepping. Baie Christene sien hierin 'n voorafskaduwing van Christus, die Wysheid van God (1 Korintiërs 1:24, 30; Kolossense 2:3). Hoofstuk 9 stel twee uitnodigings teenoor mekaar: Vrou Wysheid en Vrou Dwaasheid nooi albei die eenvoudige na hulle huis.","leer":"Versoeking kom gewoonlik geleidelik: die jongman gaan na die verkeerde straat, op die verkeerde tyd, sonder 'n plan. Wysheid is meer werd as alle skatte, en wie dit vind, vind die lewe. Elke dag kies ons wie se uitnodiging ons aanvaar.","skrif":"\"Bewaar my gebooie... soos die appel van jou oog\" (7:2). Die jongman wat \"sonder verstand\" was, loop in die skemer naby haar hoek (7:7–9). \"Hy volg haar meteens\" (7:22). \"Haar huis is die paaie na die doderyk\" (7:27). Die Wysheid roep (8:1–4). \"Die vrees van die Here is om die kwaad te haat\" (8:13). \"Ek het lief die wat my liefhet, en die wat my vroeg soek, sal my vind\" (8:17). Die Wysheid was by God voor die skepping (8:22–31). \"Wie my vind, vind die lewe\" (8:35). Die twee uitnodigings (9:1–6, 13–18). \"Gesteelde water is soet\" (9:17).","bid":"Bid dat ons kinders die \"verkeerde strate\" – plekke, mense en webwerwe wat tot sonde lei – sal vermy. Bid dat hulle God vroeg sal soek. Dank Jesus dat Hy die Wysheid van God is.","vraag":"Die jongman in hoofstuk 7 het nie skielik gesondig nie. Watter klein keuses het hom daarheen gelei?","hoofstukke":[["Spreuke","PRO",7],["Spreuke","PRO",8],["Spreuke","PRO",9]]},{"dag":139,"ref":"Spreuke 10 – 12","titel":"Die Regverdige en die Goddelose","fase":4,"tydlyn":"\"Die spreuke van Salomo\" (10:1).","agtergrond":"Vanaf hoofstuk 10 verander die styl: nou volg kort, losstaande spreuke, meestal in twee reëls wat 'n teenstelling maak (die regverdige teenoor die goddelose, die wyse teenoor die dwaas, die ywerige teenoor die luie). Hulle volg nie altyd 'n tema nie. 'n Goeie manier om dit as gesin te lees: laat elkeen een spreuk kies wat hom of haar tref, en gesels daaroor.","leer":"Ons woorde, werk en karakter het gevolge. Wysheid sien in klein, alledaagse keuses: hoe ons praat, of ons hard werk, of ons raad aanvaar en of ons eerlik is. Die tong het groot mag: om op te bou of af te breek.","skrif":"\"'n Wyse seun maak die vader bly\" (10:1). \"Haat verwek twis, maar liefde bedek al die oortredinge\" (10:12). \"By die veelheid van woorde ontbreek die oortreding nie, maar hy wat sy lippe inhou, handel verstandig\" (10:19). \"Waar hoogmoed kom, kom ook skande, maar by die beskeidenes is wysheid\" (11:2). \"Waar geen leiding is nie, val 'n volk; maar waar baie raadgewers is, daar is oorwinning\" (11:14). \"Wie tug liefhet, het kennis lief\" (12:1). \"Die weg van die dwaas is reg in sy eie oë, maar wie na raad luister, is wys\" (12:15). \"Kommer in die hart van die mens maak dit neerslagtig, maar 'n goeie woord maak dit bly\" (12:25).","bid":"Bid oor ons woorde: dat ons tonge sal opbou en nie afbreek nie. Bid vir nederigheid om raad en teregwysing te aanvaar. Bid vir elkeen se karakter.","vraag":"Kies elkeen een spreuk uit vandag se lees wat jou getref het. Waarom het dit jou getref?","hoofstukke":[["Spreuke","PRO",10],["Spreuke","PRO",11],["Spreuke","PRO",12]]},{"dag":140,"ref":"Spreuke 13 – 15","titel":"'n Sagte Antwoord en die Krag van Vriende","fase":4,"tydlyn":"\"Die spreuke van Salomo\".","agtergrond":"Hierdie spreuke gaan voort met praktiese wysheid oor woorde, werk, geld, gesinsverhoudings, dissipline en die hart. Let op hoe dikwels die gevolge van ons keuses beskryf word – nie as straf van buite nie, maar as die natuurlike vrug van ons optrede. Let ook op die rol van vriende: met wie ons tyd spandeer, vorm ons.","leer":"Ons word soos die mense met wie ons omgaan. 'n Sagte antwoord kalmeer woede, en 'n vriendelike woord bring genesing. God sien alles, en 'n eenvoudige lewe met die vrees van die Here is beter as rykdom met onrus.","skrif":"\"Wie met wyse mense omgaan, word wys; maar wie met dwase verkeer, gaan sleg\" (13:20). \"Hoop wat uitgestel word, maak die hart siek\" (13:12). \"Daar is 'n weg wat vir 'n mens reg lyk, maar die einde daarvan is weë van die dood\" (14:12). \"Geregtigheid verhoog 'n nasie, maar die sonde is 'n skandvlek vir die volke\" (14:34). \"'n Sagte antwoord keer die grimmigheid af, maar 'n krenkende woord laat toorn opkom\" (15:1). \"Die oë van die Here is op elke plek\" (15:3). \"Beter is min met die vrees van die Here as 'n groot skat met onrus daarby\" (15:16). \"Planne misluk sonder beraadslaging\" (15:22).","bid":"Bid vir goeie vriende vir elkeen van ons kinders – mense wat hulle wyser maak. Bid vir genade om sag te antwoord wanneer ons kwaad is. Bid vir ons land, dat geregtigheid dit sal verhoog.","vraag":"Spreuke 13:20 sê ons word soos die mense met wie ons omgaan. Hoe beïnvloed jou vriende jou – positief of negatief?","hoofstukke":[["Spreuke","PRO",13],["Spreuke","PRO",14],["Spreuke","PRO",15]]},{"dag":141,"ref":"Spreuke 16 – 18","titel":"Die Mens Bedink, maar die Here Lei","fase":4,"tydlyn":"\"Die spreuke van Salomo\".","agtergrond":"Hoofstuk 16 begin met 'n reeks spreuke oor God se soewereiniteit: ons maak planne, maar God bepaal die uitkoms. Hierdie hoofstukke praat ook baie oor hoogmoed, woede, vriendskap, skinder en twis. Die \"lot\" (16:33) was 'n manier om besluite te neem, en die spreuk sê selfs dit is in God se hand.","leer":"Ons moet beplan, maar ons planne aan God toevertrou. Hoogmoed kom voor die val. Selfbeheersing is 'n groter oorwinning as om 'n stad in te neem. Ware vriende bly getrou in teëspoed. Die Naam van die Here is 'n sterk toring vir die regverdige.","skrif":"\"Laat jou werke aan die Here oor, dan sal jou planne bevestig word\" (16:3). \"Die hart van die mens bedink sy weg, maar die Here bestuur sy gang\" (16:9). \"Hoogmoed kom voor die val\" (16:18). \"Hy wat stadig is om toornig te word, is beter as 'n held; en hy wat sy gees beheers, as een wat 'n stad inneem\" (16:32). \"'n Vriend het altyd lief, en as daar teëspoed is, word hy 'n broer gebore\" (17:17). \"'n Vrolike hart is 'n goeie geneesmiddel\" (17:22). \"Die Naam van die Here is 'n sterk toring; die regverdige hardloop daarheen en is veilig\" (18:10). \"Dood en lewe is in die mag van die tong\" (18:21). \"Daar is 'n vriend wat meer aanhanklik is as 'n broer\" (18:24).","bid":"Gee elkeen se planne (vir die week, skool, toekoms) aan die Here oor. Bid vir selfbeheersing, veral oor woede. Dank God vir goeie vriende, en bid dat ons self sulke vriende sal wees.","vraag":"Spreuke 16:32 sê selfbeheersing is beter as om 'n stad in te neem. Waarom is dit so moeilik om jou eie gees te beheers?","hoofstukke":[["Spreuke","PRO",16],["Spreuke","PRO",17],["Spreuke","PRO",18]]},{"dag":142,"ref":"Spreuke 19 – 21","titel":"Die Koning se Hart is in die Hand van die Here","fase":4,"tydlyn":"\"Die spreuke van Salomo\".","agtergrond":"Hierdie spreuke sluit raad in oor armoede en rykdom, ouers en kinders, drank, geduld, luiheid, eerlikheid in besigheid en die gevaar van 'n twissieke huishouding. Wyn en sterk drank (20:1) was algemeen in die antieke wêreld; Spreuke waarsku nie teen alle gebruik nie, maar sterk teen dronkenskap en die misleiding daarvan. Let op hoe God telkens as die een genoem word wat die harte toets en die uitkoms bepaal.","leer":"God sien die hart en toets ons motiewe. Geduld en vergewensgesindheid is 'n eer. Selfs die magtigstes (konings) is in God se hand. God wil reg en geregtigheid meer as godsdienstige offers. Wie nie die arme hoor nie, sal self nie gehoor word nie.","skrif":"\"Die verstand van 'n mens maak hom lankmoedig, en dit is vir hom 'n eer om oortreding te vergewe\" (19:11). \"Wie hom oor die arme ontferm, leen aan die Here\" (19:17). \"Baie is die planne in die hart van 'n man, maar die raad van die Here – dit hou stand\" (19:21). \"Die wyn is 'n spotter... en elkeen wat daardeur dwaal, is nie wys nie\" (20:1). \"Selfs 'n seun laat hom ken aan sy dade\" (20:11). \"Die koning se hart is in die hand van die Here soos waterstrome\" (21:1). \"Om geregtigheid en reg te doen, is vir die Here verkiesliker as slagoffer\" (21:3). \"Wie sy oor toestop vir die geroep van die arme, sal self roep en nie verhoor word nie\" (21:13). \"Wysheid help niks... teen die Here nie\" (21:30).","bid":"Bid vir ons land se leiers – dat hulle harte in God se hand sal wees. Bid vir wysheid oor alkohol vir ons kinders. Bid vir 'n hart wat maklik vergewe en die armes raaksien.","vraag":"Spreuke 20:11 sê selfs 'n jongmens word geken aan sy dade. Wat sê jou dade oor wie jy is?","hoofstukke":[["Spreuke","PRO",19],["Spreuke","PRO",20],["Spreuke","PRO",21]]},{"dag":143,"ref":"Spreuke 22 – 24","titel":"Die Woorde van die Wyses","fase":4,"tydlyn":"22:17–24:34 is 'n afsonderlike versameling, \"die woorde van die wyses\".","agtergrond":"Hierdie gedeelte begin met 'n afdeling (22:17–24:22) wat opvallend ooreenkom met 'n ouer Egiptiese wysheidsgeskrif, die \"Lering van Amenemope\" (c. 1100 v.C.) – ook in die getal \"dertig\" spreuke (22:20). Dit wys dat Israel se wyses wysheid van ander volke geken het, maar dit onder die vrees van die Here geplaas het (22:19). Spreuk 22:6 is een van die bekendste opvoedingsbeginsels – 'n algemene beginsel, nie 'n waarborg nie.","leer":"'n Goeie naam is meer werd as rykdom. Ouers moet hul kinders doelbewus op die regte pad oplei. Ons moet nie jaloers wees op mense wat sondig nie. Ons is verantwoordelik om op te tree vir dié wat in gevaar is. Moenie bly wees oor jou vyand se val nie.","skrif":"\"'n Goeie naam is verkiesliker as groot rykdom\" (22:1). \"Oefen die seun volgens die eis van sy weg; dan sal hy, ook as hy oud word, daarvan nie afwyk nie\" (22:6). \"Moenie met 'n kwaai man omgaan nie\" (22:24). \"Moenie moeg word om ryk te word nie\" – rykdom maak vir hom vlerke (23:4–5). \"My seun, gee my jou hart\" (23:26). Waarskuwing oor dronkenskap: \"Wie het ellende? ... Die wat laat sit by die wyn\" (23:29–35). \"Moenie jaloers wees op slegte mense nie\" (24:1). \"Red die wat na die dood weggesleep word\" (24:11). \"Want die regverdige val sewe maal en staan weer op\" (24:16). \"Moenie bly wees as jou vyand val nie\" (24:17). Die akker van die luiaard (24:30–34).","bid":"Bid vir Pappa om sy kinders goed op te lei \"volgens die eis van hulle weg\" – elkeen volgens sy of haar unieke persoonlikheid. Bid dat elke kind vir God sy of haar hart sal gee (23:26). Bid vir mense wat \"na die dood weggesleep word\" – deur dwelms, depressie of sonde.","vraag":"Spreuke 24:16 sê die regverdige val sewe maal en staan weer op. Wat leer dit ons oor mislukking?","hoofstukke":[["Spreuke","PRO",22],["Spreuke","PRO",23],["Spreuke","PRO",24]]},{"dag":144,"ref":"Spreuke 25 – 27","titel":"Woorde soos Goue Appels","fase":4,"tydlyn":"\"Dit is ook spreuke van Salomo wat die manne van Hiskia, die koning van Juda, oorgeskryf het\" (25:1), c. 715–686 v.C.","agtergrond":"Koning Hiskia het 'n geestelike hervorming in Juda gelei (2 Konings 18) en het skrifgeleerdes gebruik om Salomo se spreuke te versamel en te bewaar. Hierdie hoofstukke gebruik baie beelde uit die natuur en daaglikse lewe: sneeu, wolke, honde, deure, yster en spieëls. Hoofstuk 26 bevat 'n reeks spreuke oor die dwaas en die luiaard.","leer":"Die regte woord op die regte tyd is kosbaar. Wees goed vir jou vyand – so oorwin jy kwaad met goed (aangehaal in Romeine 12:20). Moenie spog oor môre nie, want jy weet nie wat dit bring nie. Eerlike vriende wat ons skerp maak, is 'n geskenk – selfs wanneer hulle ons seermaak.","skrif":"\"Dit is die eer van God om 'n saak te verberg, maar die eer van konings om 'n saak te ondersoek\" (25:2). \"Soos goue appels in silwer skale, so is 'n woord op sy regte tyd gespreek\" (25:11). \"As jou vyand honger het, gee hom brood om te eet\" (25:21). \"'n Man wat sy gees nie kan beheers nie, is soos 'n stad wat oopgebreek is, sonder muur\" (25:28). \"Soos 'n hond wat na sy uitbraaksel terugkeer, so is 'n dwaas wat sy dwaasheid herhaal\" (26:11). \"Waar daar geen hout is nie, gaan die vuur dood; en waar daar geen kwaadstoker is nie, hou die twis op\" (26:20). \"Moenie roem oor die dag van môre nie\" (27:1). \"Die wonde van 'n vriend is getrou\" (27:6). \"Yster word deur yster geslyp, en een mens deur die omgang met die ander\" (27:17).","bid":"Bid vir die regte woorde op die regte tyd. Bid vir vriende wat ons \"slyp\" en eerlik is. Bid vir genade om goed te wees vir mense wat nie goed vir ons is nie.","vraag":"Spreuke 27:17 sê \"yster slyp yster\". Wie in jou lewe slyp jou om 'n beter mens te word?","hoofstukke":[["Spreuke","PRO",25],["Spreuke","PRO",26],["Spreuke","PRO",27]]},{"dag":145,"ref":"Spreuke 28 – 29","titel":"Leiers, Eerlikheid en die Vrees vir Mense","fase":4,"tydlyn":"Die versameling van Hiskia se manne gaan voort.","agtergrond":"Hierdie hoofstukke fokus sterk op leierskap, regverdigheid in die samelewing, eerlikheid, die armes, en ouers en kinders. Baie spreuke kontrasteer wat met 'n volk gebeur wanneer goddelose of regverdige mense regeer. 'n Belangrike tema is die verskil tussen vrees vir mense en vertroue op God.","leer":"Wie sy sonde bely en laat staan, sal barmhartigheid vind. Die vrees vir mense is 'n strik. Eerlike teregwysing is op die lange duur meer waardevol as vleiery. 'n Volk sonder visie (profetiese openbaring) loop wild – ons het God se Woord nodig.","skrif":"\"Die goddeloses vlug sonder dat iemand hulle agtervolg, maar die regverdiges is vol vertroue soos 'n jong leeu\" (28:1). \"Wie sy oortredinge bedek, sal nie voorspoedig wees nie; maar wie dit bely en laat staan, sal barmhartigheid verkry\" (28:13). \"Wie 'n mens bestraf, sal later meer guns vind as hy wat met die tong vlei\" (28:23). \"As die regverdiges baie word, is die volk bly\" (29:2). \"Wanneer daar geen openbaring is nie, word 'n volk handuit\" (29:18). \"Vrees vir mense span 'n strik, maar wie op die Here vertrou, is beskut\" (29:25).","bid":"Bid vir ons kinders om moedig te wees \"soos 'n jong leeu\" in hul geloof. Bid dat hulle nie deur die vrees vir mense gelei sal word nie. Bely sonde – en \"laat dit staan\". Bid vir ons land se leiers.","vraag":"Spreuke 29:25 sê die vrees vir mense is 'n strik. Wanneer bepaal die vrees vir wat ander dink jou keuses?","hoofstukke":[["Spreuke","PRO",28],["Spreuke","PRO",29]]},{"dag":146,"ref":"Spreuke 30 – 31","titel":"Agur, Lemuel en die Deugsame Vrou","fase":4,"tydlyn":"Hoofstuk 30: die woorde van Agur; hoofstuk 31: die woorde van koning Lemuel, wat sy moeder hom geleer het. Ons weet nie meer van hulle nie.","agtergrond":"Agur is nederig oor sy eie kennis en bid 'n merkwaardige gebed: nie armoede of rykdom nie, maar net genoeg. Lemuel se moeder leer hom hoe 'n koning moet leef: nie dronk word nie, nie aan vroue sy krag gee nie, en opkom vir dié wat swak is. Die \"deugsame vrou\" (31:10–31) is 'n alfabetiese gedig wat die ideale vrou beskryf – sterk, hardwerkend, wys, vrygewig, sakevernuftig en godvresend. In die Joodse tradisie het mans dit by die sabbatmaaltyd vir hulle vroue voorgelees.","leer":"Nederigheid voor God se Woord is die begin van wysheid. Tevredenheid is 'n groot skat – genoeg is genoeg. Leiers moet die stem van die stemloses wees. 'n Vrou wat die Here vrees, is uiters waardevol – haar waarde lê in haar karakter en geloof, nie in haar voorkoms nie.","skrif":"\"Elke woord van God is gelouter\" (30:5). \"Gee my nie armoede of rykdom nie... sodat ek nie versadig word en verloën en sê: Wie is die Here? of dat ek arm word en steel\" (30:8–9). Lemuel se moeder: \"Maak jou mond oop vir die stomme, vir die saak van al die hulpelose mense\" (31:8). \"'n Deugsame vrou, wie sal haar vind? Want haar waarde is ver bo korale\" (31:10). \"Sy maak haar oop hand vir die ellendige\" (31:20). \"Sy open haar mond met wysheid, en vriendelike onderrig is op haar tong\" (31:26). \"Die bevalligheid is bedrieglik, en die skoonheid is vergeefs; maar 'n vrou wat die Here vrees – sy moet geprys word\" (31:30).","bid":"Dank God vir Mamma en vir die vroue in ons lewe wat die Here vrees. Bid vir die dogter in ons gesin dat sy 'n vrou van sterk karakter en geloof sal word, wat haar waarde in God vind. Bid vir die seuns in ons gesin dat hulle karakter bo voorkoms sal waardeer, en eendag 'n vrou soos hierdie sal vind en eer. Bid Agur se gebed oor genoeg.","vraag":"Spreuke 31:30 sê skoonheid is vergeefs, maar 'n vrou wat die Here vrees, moet geprys word. Hoe verskil dit van wat sosiale media sê?","hoofstukke":[["Spreuke","PRO",30],["Spreuke","PRO",31]]},{"dag":147,"ref":"Hooglied 1 – 4","titel":"Die Skoonheid van Liefde in God se Plan","fase":4,"tydlyn":"\"Die lied van liedere, van Salomo\" (1:1). c. 970–930 v.C. (tradisioneel).","agtergrond":"Hooglied (\"die mooiste lied\") is 'n reeks liefdesgedigte tussen 'n bruid en haar bruidegom. Dit vier die liefde en aantrekking tussen man en vrou binne die verbintenis van die huwelik. Dit is poësie met baie beelde uit die natuur (tuine, wingerde, gasells, duiwe). Dwarsdeur die kerkgeskiedenis is dit ook gelees as 'n beeld van die liefde tussen God en Sy volk, of Christus en Sy kerk (vgl. Efesiërs 5:25–32). Albei lesings het waarde. (Gesels ouderdomsgepas – dit is 'n goeie geleentheid om met tieners oor God se goeie plan vir liefde en seksualiteit te praat.)","leer":"Romantiese liefde en aantrekking is God se skepping en geskenk, en dit is goed. Die Bybel is nie skaam daaroor nie. Maar liefde moet op die regte tyd en in die regte verhouding (die huwelik) ontwaak – nie haastig of voortydig nie. God se liefde vir ons is selfs dieper as die beste menslike liefde.","skrif":"Die bruid: \"Ek is swart, maar lieflik\" – sy voel onseker oor haar voorkoms (1:5–6). Wedersydse bewondering en respek (1:15–16). \"Sy banier oor my is liefde\" (2:4). \"Ek besweer julle, dogters van Jerusalem... maak die liefde nie wakker en wek dit nie op voordat dit die liefde behaag nie\" (2:7; herhaal in 3:5 en 8:4). \"Vang vir ons die jakkalse, die klein jakkalse wat die wingerde verniel\" (2:15). \"Jy is heeltemal skoon, my vriendin, en daar is geen gebrek aan jou nie\" (4:7). \"'n Geslote tuin is my suster, my bruid\" (4:12).","bid":"Dank God dat Hy liefde en die huwelik geskep het. Bid vir die huwelike in ons familie. Bid vir ons gesin se kinders se reinheid – dat hulle liefde nie voortydig sal \"wakker maak\" nie, maar op God se tyd. Bid vir hulle toekomstige maats.","vraag":"Hooglied sê drie keer: moenie die liefde wakker maak voordat dit tyd is nie. Waarom dink jy is dit so 'n belangrike raad vir jongmense?","hoofstukke":[["Hooglied","SNG",1],["Hooglied","SNG",2],["Hooglied","SNG",3],["Hooglied","SNG",4]]},{"dag":148,"ref":"Hooglied 5 – 8","titel":"Liefde is Sterk soos die Dood","fase":4,"tydlyn":"\"Die lied van liedere, van Salomo\".","agtergrond":"Die tweede helfte bevat 'n tyd van afstand en soeke (5:2–8), weer bewondering, en die hoogtepunt in hoofstuk 8 oor die krag van liefde. 'n \"Seël op die hart\" was 'n persoonlike stempel wat eienaarskap en verbintenis aandui. In 8:6 word die liefde \"'n vlam van die Here\" genoem (in sommige vertalings) – die enigste moontlike verwysing na God se Naam in die boek.","leer":"Ware liefde is getrou, eksklusief, sterk en kan nie gekoop word nie. Huweliksliefde vra toewyding, ook wanneer daar afstand of moeilike tye is. God se liefde vir ons is die sterkste liefde – sterker as die dood, soos Jesus aan die kruis gewys het.","skrif":"Die bruid soek haar geliefde in die nag (5:6–8). Sy beskryf hom met bewondering: \"Dit is my beminde, en dit is my vriend\" (5:16). \"Ek is my beminde s'n, en my beminde is myne\" (6:3). \"Sit my soos 'n seël op jou hart, soos 'n seël op jou arm; want die liefde is sterk soos die dood... sy vlamme is vuurvlamme\" (8:6). \"Baie waters kan die liefde nie uitblus nie\" (8:7). \"As iemand al die goed van sy huis vir die liefde wou gee, sou hy heeltemal verag word\" (8:7).","bid":"Dank God vir Sy liefde wat sterker as die dood is en wat ons nie kan koop nie. Bid vir getroue huwelike – ook vir Pappa en Mamma. Bid dat elke kind sal groei in die begrip dat ware liefde toewyding en trou is, nie net 'n gevoel nie.","vraag":"Hooglied 8:7 sê liefde kan nie gekoop word nie. Wat is die verskil tussen ware liefde en net aangetrokkenheid?","hoofstukke":[["Hooglied","SNG",5],["Hooglied","SNG",6],["Hooglied","SNG",7],["Hooglied","SNG",8]]},{"dag":149,"ref":"Prediker 1 – 4","titel":"\"Alles is Tydelik\" – Lewe sonder God onder die Son","fase":4,"tydlyn":"Tradisioneel aan Salomo toegeskryf (\"die seun van Dawid, koning in Jerusalem\", 1:1), c. 940 v.C.; sommige geleerdes dateer dit later.","agtergrond":"\"Prediker\" (Hebreeus Kohelet – iemand wat 'n vergadering toespreek) ondersoek die lewe \"onder die son\" – dit wil sê, die lewe soos 'n mens dit sien sonder om verder as hierdie wêreld te kyk. Sy sleutelwoord \"ydelheid\" (Hebreeus hevel) beteken letterlik \"asem\" of \"damp\": iets wat vlugtig, tydelik en ongrypbaar is. Hy het alles probeer – wysheid, plesier, werk, rykdom, bouprojekte – en vind dat niks blywende sin gee nie.","leer":"Niks in hierdie wêreld – plesier, sukses, rykdom of selfs kennis – kan op sigself ons diepste honger stil nie, want God het die ewigheid in ons harte gelê. Die eenvoudige vreugdes van die lewe is geskenke uit God se hand. Daar is 'n tyd vir alles, en God bestuur die tye. Ons het mekaar nodig.","skrif":"\"Ydelheid van ydelhede... alles is ydelheid\" (1:2). \"Daar is niks nuuts onder die son nie\" (1:9). Hy het alles probeer: wysheid, plesier, wyn, groot werke, rykdom, musiek (2:1–11). \"Kyk, alles was ydelheid en najaag van wind\" (2:11). \"Dit kom uit die hand van God\" (2:24). \"Vir alles is daar 'n vasgestelde tyd... 'n tyd om gebore te word en 'n tyd om te sterwe... 'n tyd om te ween en 'n tyd om te lag\" (3:1–8). \"Hy het alles mooi gemaak op sy tyd; ook het Hy die ewigheid in hulle hart gelê\" (3:11). \"Twee is beter as een\" (4:9). \"'n Drievoudige snoer word nie gou gebreek nie\" (4:12).","bid":"Bid dat ons nie ons sin in tydelike dinge sal soek nie, maar in God. Dank God vir die eenvoudige vreugdes van die lewe – kos, werk, vriendskap. Bid vir elkeen se \"seisoen\" in die lewe. Dank God vir die \"drievoudige snoer\" van ons gesin met Hom in die middel.","vraag":"Prediker 3:11 sê God het \"die ewigheid in ons hart gelê\". Wat beteken dit, en hoe verklaar dit waarom niks in die wêreld ons heeltemal tevrede kan maak nie?","hoofstukke":[["Prediker","ECC",1],["Prediker","ECC",2],["Prediker","ECC",3],["Prediker","ECC",4]]},{"dag":150,"ref":"Prediker 5 – 8","titel":"Eerbied, Tevredenheid en die Grense van Wysheid","fase":4,"tydlyn":"Prediker se ondersoek gaan voort.","agtergrond":"Prediker gee raad oor aanbidding (moenie haastig met jou mond voor God wees nie), oor geld (wie geld liefhet, word nooit versadig nie), en oor die raaisels van die lewe – die regverdige wat swaarkry en die goddelose wat lank lewe. Hy erken dat wysheid beter is as dwaasheid, maar ook dat wysheid nie alles kan verklaar nie.","leer":"Kom met eerbied na God en hou jou beloftes aan Hom. Liefde vir geld bring nooit tevredenheid nie; geniet eerder dankbaar wat God gee. Die huis van rou kan ons meer leer as die huis van fees, want dit herinner ons aan wat werklik belangrik is. Ons moet nederig erken dat ons nie al God se werke verstaan nie.","skrif":"\"Wees nie haastig met jou mond nie... want God is in die hemel, en jy is op die aarde; laat jou woorde dan min wees\" (5:2). \"As jy aan God 'n gelofte doen, stel die betaling daarvan nie uit nie\" (5:4). \"Wie die geld liefhet, word nie versadig van geld nie\" (5:10). \"Soos hy uit die moederskoot van sy moeder gekom het, so sal hy naak weer heengaan\" (5:15). \"Dit is beter om te gaan na 'n huis van rou as om te gaan na 'n huis van maaltyd\" (7:2). \"Moenie sê: Hoe kom dit dat die vorige dae beter was as hierdie nie?\" (7:10). \"Daar is geen regverdige mens op die aarde wat goed doen en nie sondig nie\" (7:20). \"God het die mens opreg gemaak, maar hulle soek baie planne\" (7:29). Die mens kan die werk van God nie uitvind nie (8:17).","bid":"Bid vir eerbied in ons aanbidding. Bid vir tevredenheid met wat God ons gee. Bid vir mense wat rou – en dat ons uit hartseer wysheid sal leer.","vraag":"Prediker 5:10 sê wie geld liefhet, word nooit versadig nie. Waarom dink jy is dit so?","hoofstukke":[["Prediker","ECC",5],["Prediker","ECC",6],["Prediker","ECC",7],["Prediker","ECC",8]]},{"dag":151,"ref":"Prediker 9 – 12","titel":"Dink aan Jou Skepper in die Dae van Jou Jeug","fase":4,"tydlyn":"Prediker se ondersoek eindig.","agtergrond":"Prediker het gewys dat die lewe \"onder die son\" alleen geen blywende sin het nie. Hoofstuk 12:1–7 is 'n pragtige, poëtiese beskrywing van ouderdom (die \"wagters van die huis\" wat bewe is die hande, die \"malers\" wat min geword het is die tande, die wat \"deur die vensters kyk\" is die oë, ensovoorts) en die dood. Die boek se finale gevolgtrekking (12:13–14) gee die sleutel tot alles: die lewe kry sin wanneer ons dit met God en in die lig van Sy oordeel leef. Die Nuwe Testament gee nog meer lig: in Christus is ons arbeid \"nie tevergeefs in die Here nie\" (1 Korintiërs 15:58).","leer":"Geniet die lewe as 'n gawe van God – jou kos, jou werk, die mense wat jy liefhet – en doen alles met jou volle krag. Maar onthou God van jongs af, voordat die moeilike jare kom. Die hele plig van die mens is om God te vrees en Sy gebooie te hou, want God sal elke werk oordeel.","skrif":"\"Eet jou brood met vreugde\" (9:7). \"Alles wat jou hand vind om te doen, doen dit met jou krag\" (9:10). \"Die wedloop is nie vir die vlugtiges nie\" (9:11). \"Werp jou brood op die water\" (11:1). \"Verheug jou, o jongman, in jou jeug... maar weet dat God jou oor al hierdie dinge in die gerig sal bring\" (11:9). \"En dink aan jou Skepper in die dae van jou jonkheid, voordat die ongelukkige dae kom\" (12:1). \"Die stof keer terug na die aarde soos dit was, en die gees keer terug na God wat dit gegee het\" (12:7). \"Die hoofsaak van alles wat gehoor is, is dit: Vrees God en onderhou sy gebooie, want dit geld alle mense\" (12:13).","bid":"Bid Prediker 12:1 oor ons gesin se kinders: dat hulle hulle Skepper sal onthou in die dae van hulle jeug. Bid dat ons as gesin die lewe sal geniet as God se gawe en alles met ons volle krag vir Hom sal doen. Dank God dat ons lewe in Christus nie tevergeefs is nie.","vraag":"Prediker sê: \"Dink aan jou Skepper in die dae van jou jeug.\" Waarom is die jeug so 'n belangrike tyd om God te leer ken?","hoofstukke":[["Prediker","ECC",9],["Prediker","ECC",10],["Prediker","ECC",11],["Prediker","ECC",12]]},{"dag":152,"ref":"1 Konings 12 – 14","titel":"Die Koninkryk Skeur","fase":5,"tydlyn":"c. 930 v.C. Sigem, Jerusalem, Bet-el en Dan.","agtergrond":"Rehabeam, Salomo se seun, word koning. Die noordelike stamme vra dat hy die swaar belasting en dwangarbeid van Salomo verlig. Hy volg die raad van sy jong vriende eerder as dié van die ervare raadgewers, en tien stamme skeur weg onder Jerobeam. Om te keer dat sy mense na Jerusalem gaan aanbid, maak Jerobeam twee goue kalwers by Bet-el (in die suide van sy gebied) en Dan (in die noorde), met sy eie priesters en feeste. Hierdie \"sonde van Jerobeam\" word die maatstaf vir al die slegte konings van Israel. Farao Sisak (Sjosjenk I) val Juda aan (14:25); sy eie inskripsie in Karnak, Egipte, beskryf hierdie veldtog.","leer":"Trotse leierskap wat nie luister nie, skeur gesinne, kerke en nasies. Ons moet wyse raad soek, nie net die raad wat ons wil hoor nie. Om God op ons eie gerieflike manier te aanbid in plaas van op Sy manier, is afgodery. Die profeet uit Juda wys hoe belangrik dit is om God se woord volledig te gehoorsaam, selfs as iemand anders \"namens God\" iets anders sê.","skrif":"Die volk vra verligting (12:4). Die oudstes se raad: \"As jy vandag 'n dienaar van hierdie volk word... sal hulle altyd jou dienaars wees\" (12:7). Rehabeam volg die jongmanne se raad (12:8–14). \"Dit was 'n beskikking van die Here\" (12:15). Jerobeam se kalwers: \"Hier is jou gode, o Israel\" (12:28) – dieselfde woorde as by die goue kalf (Exodus 32:4). Die man van God uit Juda (13:1–32). Ahia se profesie oor Jerobeam se huis (14:7–16). Juda doen ook kwaad – hoogtes en heilige pale (14:22–24).","bid":"Bid vir nederige leiers wat dien en luister. Bid vir wysheid vir ons kinders om goeie raad te herken – ook van ouer, ervare mense. Bid dat ons nie God op ons eie gerieflike manier sal aanbid nie, maar volgens Sy Woord.","vraag":"Rehabeam het die raad gevolg wat hy wou hoor. Hoe weet ons of raad goed is, al is dit nie wat ons wil hoor nie?","hoofstukke":[["1 Konings","1KI",12],["1 Konings","1KI",13],["1 Konings","1KI",14]]},{"dag":153,"ref":"1 Konings 15 – 16","titel":"Goeie en Slegte Konings – Agab en Isebel","fase":5,"tydlyn":"c. 913–874 v.C. Juda (Asa) en Israel (van Nadab tot Agab). Samaria word die hoofstad van Israel.","agtergrond":"Konings sit die verhaal van die twee koninkryke langs mekaar voort, en beoordeel elke koning met dieselfde vraag: het hy gedoen wat reg of verkeerd was in die oë van die Here? In Israel volg staatsgreep op staatsgreep. Omri bou Samaria as hoofstad; hy was so bekend dat Assiriese bronne Israel nog lank daarna \"die huis van Omri\" noem, en die Mesa-steen (Moab, c. 840 v.C.) noem hom ook. Sy seun Agab trou met Isebel, 'n Fenisiese prinses van Sidon, wat die aanbidding van Baäl en Asjera ywerig in Israel bevorder.","leer":"Een koning se keuse vir of teen God beïnvloed 'n hele volk en die volgende geslagte. Asa wys dat 'n mens kan breek met die slegte voorbeeld van jou eie familie (hy verwyder selfs sy grootmoeder se afgod). Agab was erger as almal voor hom – en die rede was dat hy sonde as 'n klein saak beskou het en met 'n vrou getrou het wat God gehaat het.","skrif":"Asa doen wat reg is in die oë van die Here soos sy vader Dawid (15:11). Hy verwyder sy grootmoeder Maäga as koningin-moeder weens haar afskuwelike afgod (15:13). \"Die hart van Asa was volkome met die Here\" (15:14). Nadab, Baësa, Ela, Simri – een ná die ander volg die weg van Jerobeam (15:25–16:20). Omri koop die berg Samaria (16:24). \"Agab... het gedoen wat verkeerd was in die oë van die Here, meer as almal wat voor hom was\" (16:30). \"Asof dit vir hom 'n geringe saak was om in die sondes van Jerobeam te wandel, het hy Isebel... as vrou geneem en Baäl gedien\" (16:31). Jerigo word herbou ten koste van Hiël se seuns (16:34; vgl. Josua 6:26).","bid":"Bid vir ons gesin om 'n nuwe, godvresende nalatenskap te bou. Bid dat ons sonde nooit as \"'n geringe saak\" sal beskou nie. Bid vir ons land se leiers – dat hulle doen wat reg is in die oë van die Here.","vraag":"Asa het moedig gebreek met sy familie se afgodery. Waarom is dit soms die moeilikste om reg te doen teenoor familie?","hoofstukke":[["1 Konings","1KI",15],["1 Konings","1KI",16]]},{"dag":154,"ref":"1 Konings 17 – 19","titel":"Elia: Die Here is God!","fase":5,"tydlyn":"c. 860–850 v.C. Gilead, Sarfat (in Fenisië), die berg Karmel, Jisreël en die berg Horeb (Sinai).","agtergrond":"Baäl is aanbid as die god van storm, reën en vrugbaarheid. Elia (\"my God is die Here\") kondig aan dat daar geen reën sal wees nie – 'n direkte uitdaging aan Baäl op sy eie terrein. Die droogte duur drie en 'n half jaar (Lukas 4:25; Jakobus 5:17). Sarfat was in Isebel se tuisland, die kern van Baäl-aanbidding, maar God voorsien daar vir 'n heidense weduwee. Op die berg Karmel (by die kus) is daar 'n regstreekse toets: watter God antwoord met vuur? Daarna vlug Elia, moedeloos, na Horeb – waar God aan Moses verskyn het.","leer":"Daar is net een ware God, en ons moet kies – ons kan nie op twee gedagtes hink nie. God voorsien vir Sy kinders op onverwagte maniere. Selfs groot geloofshelde kan uitgeput en depressief word ná 'n groot oorwinning; God sorg dan eers liggaamlik vir hulle (kos en slaap), en praat dan saggies. Ons is nooit so alleen as wat ons voel nie.","skrif":"\"So waar as die Here... leef, daar sal hierdie jare geen dou of reën wees nie\" (17:1). Die rawe bring kos (17:6). Die weduwee se meel en olie raak nie op nie (17:14–16). Elia wek haar seun op (17:21–24). \"Hoe lank hink julle op twee gedagtes? As die Here God is, volg Hom\" (18:21). Die profete van Baäl roep tot die middag (18:26–29). Elia giet water oor die offer (18:33–35). \"Die Here, Hy is God! Die Here, Hy is God!\" (18:39). Elia vlug en wil sterf (19:3–4). 'n Engel gee hom brood en water (19:5–8). Nie in die storm, aardbewing of vuur nie, maar 'n \"suisende sagte koelte\" (19:11–12). Sewe duisend het nie voor Baäl gekniel nie (19:18).","bid":"Bid vir moed om duidelik vir God te kies in 'n wêreld van \"twee gedagtes\". Bid vir mense wat moedeloos of uitgebrand is – en dat ons hulle prakties sal help. Bid dat ons God se sagte stem sal hoor.","vraag":"Ná sy grootste oorwinning was Elia so moedeloos dat hy wou sterf. Wat het God eerste vir hom gedoen? Wat leer dit ons?","hoofstukke":[["1 Konings","1KI",17],["1 Konings","1KI",18],["1 Konings","1KI",19]]},{"dag":155,"ref":"1 Konings 20 – 22","titel":"Nabot se Wingerd en die Ware Profeet","fase":5,"tydlyn":"c. 855–853 v.C. Samaria, Jisreël en Ramot in Gilead.","agtergrond":"Agab veg teen die Arameërs (Aram = Sirië, met Damaskus as hoofstad). Assiriese bronne (die Kurkh-monoliet van Salmaneser III) noem \"Agab die Israeliet\" met 2 000 waens by die slag van Karkar in 853 v.C. – een van die vroegste buite-Bybelse vermeldings van 'n koning van Israel. In Israel kon grond nie sommer verkoop word nie; dit was die familie se erfdeel van God (Levitikus 25:23), daarom weier Nabot. Isebel reël 'n skynhof en laat Nabot stenig. In hoofstuk 22 sê 400 profete wat die koning wil hoor; net Miga, seun van Jimla, sê die waarheid.","leer":"God sien elke onreg, ook dié wat deur magtiges in die geheim gepleeg word. Begeerte na wat aan ander behoort, lei tot groter sonde. Ware profete sê wat God sê, nie wat gewild is nie – ook al kos dit hulle iets. God is genadig selfs teenoor Agab wanneer hy hom verootmoedig.","skrif":"Agab is \"mismoedig en ontevrede\" omdat Nabot sy wingerd nie wil verkoop nie (21:4). \"Die Here bewaar my daarvan dat ek die erfdeel van my vaders aan jou sou gee\" (21:3). Isebel se valse getuies (21:9–13). \"Het jy gemoor en ook in besit geneem?\" (21:19). \"Het jy my gevind, o my vyand?\" (21:20). Agab verootmoedig hom en God stel die oordeel uit (21:27–29). Miga: \"So waar as die Here leef, wat die Here vir my sê, dit sal ek spreek\" (22:14). Die leuengees in die mond van die profete (22:22–23). Agab vermom hom, maar 'n pyl tref hom \"op goeie geluk af\" (22:34). Die honde lek sy bloed (22:38).","bid":"Bid vir mense wat onregverdig behandel word deur magtiges – en vir regverdigheid in ons land. Bid dat ons nie sal begeer wat aan ander behoort nie. Bid vir moed om, soos Miga, die waarheid te praat al is dit ongewild.","vraag":"Miga was die enigste een van 401 profete wat die waarheid gepraat het. Hoe voel dit om alleen vir die waarheid te staan?","hoofstukke":[["1 Konings","1KI",20],["1 Konings","1KI",21],["1 Konings","1KI",22]]},{"dag":156,"ref":"2 Konings 1 – 3","titel":"Elia word Opgeneem en Elisa Neem Oor","fase":5,"tydlyn":"c. 852–850 v.C. Samaria, Bet-el, Jerigo, die Jordaan, en Moab.","agtergrond":"Agasia, Agab se seun, raadpleeg Baäl-Sebub (\"heer van die vlieë\") van die Filistynse stad Ekron oor sy siekte – in die Nuwe Testament word \"Beëlsebul\" 'n naam vir die duiwel (Markus 3:22). Elia word in 'n stormwind na die hemel opgeneem – een van net twee mense (saam met Henog) wat nie gesterf het nie. Elisa vra 'n \"dubbele deel\" van Elia se gees – die erfdeel van die eersgeborene (Deuteronomium 21:17), dus om sy opvolger te wees. Die Mesa-steen (in die Louvre) is Moab se eie verslag van hul opstand teen Israel (vgl. hoofstuk 3).","leer":"Om ander gode (of bronne) te raadpleeg in plaas van die lewende God, is 'n belediging teen God. Elisa wys toegewyde volharding: hy weier om Elia te verlaat. Die geestelike stryd gaan voort van een geslag na die volgende – ons moet die mantel opneem. God se krag is nie aan een mens gebind nie: \"Waar is die Here, die God van Elia?\"","skrif":"\"Is daar geen God in Israel... dat julle Baäl-Sebub gaan raadpleeg?\" (1:3). Elisa: \"So waar as die Here leef... ek sal u nie verlaat nie\" (2:2, 4, 6). \"Laat daar tog 'n dubbele deel van u gees op my wees\" (2:9). Elia vaar op in 'n stormwind (2:11). Elisa neem die mantel: \"Waar is die Here, die God van Elia?\" en die Jordaan skei (2:13–14). Die water van Jerigo word gesond (2:19–22). Die konings van Israel, Juda en Edom teen Moab; Elisa vra 'n musikant en profeteer (3:14–18). Grawe slote, want God sal dit met water vul (3:16–17).","bid":"Bid dat ons, soos Elisa, toegewyd aan God sal bly. Bid dat elkeen van ons kinders die \"mantel\" van geloof sal opneem en dit verder sal dra. Bid dat ons nie ander bronne bo God sal raadpleeg nie.","vraag":"Wat beteken dit vir jou om die \"mantel\" van geloof van jou ouers of grootouers op te neem?","hoofstukke":[["2 Konings","2KI",1],["2 Konings","2KI",2],["2 Konings","2KI",3]]},{"dag":157,"ref":"2 Konings 4 – 6","titel":"Elisa: God se Genade in Alledaagse Nood","fase":5,"tydlyn":"c. 850–840 v.C. Verskeie plekke in Israel, Sunem, Gilgal, en Aram (Damaskus).","agtergrond":"Elisa se bediening was anders as Elia s'n: minder openbare konfrontasie en meer wonders van sorg vir gewone mense – 'n arm weduwee, 'n gasvrye vrou, profete-studente en selfs 'n vyandige generaal. Naäman was die bevelvoerder van die leër van Aram (Israel se vyand) en melaats. Jesus verwys na hom as voorbeeld van God se genade vir die nasies (Lukas 4:27). Die \"Jordaan\" was vir hom 'n vernedering, want Damaskus se riviere was mooier.","leer":"God sien ons klein en groot nood raak – skuld, kinderloosheid, siekte, 'n verlore byl. Hy gebruik ons klein bietjie (die weduwee se olie) as ons dit in geloof gee. Genesing en redding kom deur nederige gehoorsaamheid, nie deur trots of geld nie. God se genade strek ook na ons vyande. En daar is meer by ons as by hulle – al kan ons dit nie sien nie.","skrif":"Die weduwee se olie vul al die leë kanne (4:1–7). Die Sunamitiese vrou se gasvryheid en haar seun wat opgewek word (4:8–37). \"Dit is goed\" – haar geloof in krisis (4:26). Die dood in die pot (4:38–41). Twintig brode voed honderd man, en daar bly oor (4:42–44; vgl. Jesus in Markus 6). Die klein Israelitiese slavin wat haar meester na God wys (5:2–3). Naäman is kwaad – die Jordaan is te gewoon (5:11–12). Hy dompel sewe keer en word rein soos 'n klein seuntjie (5:14). \"Nou weet ek dat daar in die hele aarde geen God is behalwe in Israel nie\" (5:15). Gehasi se hebsug (5:20–27). Die byl dryf (6:5–7). \"Die wat by ons is, is meer as die wat by hulle is\" (6:16). Die Here maak die dienaar se oë oop: vuurperde en -waens (6:17).","bid":"Bring ons gesin se klein en groot nood na God. Dank God vir die klein slavinnetjie se moed om van God te getuig – en bid dat ons kinders ook so sal getuig. Bid dat ons oë oopgemaak sal word om te sien dat God se beskerming om ons is.","vraag":"Die klein slavin het in 'n vreemde land, by haar vyand, van God getuig. Wat leer jy van haar?","hoofstukke":[["2 Konings","2KI",4],["2 Konings","2KI",5],["2 Konings","2KI",6]]},{"dag":158,"ref":"2 Konings 7 – 9","titel":"God Hou Sy Woord: Hongersnood, Oorvloed en Jehu","fase":5,"tydlyn":"c. 845–841 v.C. Samaria, Damaskus, Ramot in Gilead en Jisreël.","agtergrond":"Samaria word deur die Arameërs beleër en die hongersnood is verskriklik. Elisa voorspel oorvloed binne een dag; vier melaatses ontdek dat die vyand gevlug het. Hasael word koning van Aram, soos Elisa voorspel. In 841 v.C. salf 'n profeet Jehu as koning van Israel; hy roei die huis van Agab uit en Isebel sterf soos Elia voorspel het (1 Konings 21:23). Die \"Swart Obelisk\" van die Assiriese koning Salmaneser III (in die British Museum) toon Jehu (of sy gesant) wat voor hom buig – die enigste bekende afbeelding van 'n koning van Israel.","leer":"God se woord word vervul, presies en op Sy tyd – of dit nou 'n belofte of 'n oordeel is. Goeie nuus moet gedeel word, nie vir onsself gehou word nie. Sonde se oordeel kom, selfs al neem dit jare (Isebel). Ware hervorming moet uit 'n hart vir God kom, nie net uit ywer of ambisie nie.","skrif":"Elisa: \"Môre om dié tyd sal...\" (7:1). Die offisier wat twyfel (7:2, 17–20). Die vier melaatses: \"Ons doen nie reg nie; vandag is 'n dag van goeie boodskap, en ons swyg\" (7:9). Die Sunamitiese vrou se grond word teruggegee (8:1–6). Elisa huil oor wat Hasael aan Israel gaan doen (8:11–13). Jehu word gesalf (9:1–10). Jehu ry \"soos 'n besetene\" (9:20). Isebel se einde (9:30–37).","bid":"Bid dat ons nie sal swyg oor die \"goeie boodskap\" van Jesus nie. Dank God dat Sy woord altyd waar word. Bid vir mense wat honger ly – fisies en geestelik.","vraag":"Die melaatses het besef \"ons doen nie reg as ons swyg nie\". Met wie kan jy die goeie nuus van Jesus deel?","hoofstukke":[["2 Konings","2KI",7],["2 Konings","2KI",8],["2 Konings","2KI",9]]},{"dag":159,"ref":"2 Konings 10 – 12","titel":"Jehu se Ywer, Atalia se Gruwel en Joas se Herstel","fase":5,"tydlyn":"c. 841–796 v.C. Samaria en Jerusalem.","agtergrond":"Jehu roei die aanbidding van Baäl in Israel uit, maar hou die goue kalwers van Jerobeam. In Juda vermoor Atalia (Agab en Isebel se dogter) die hele koninklike familie om self te regeer – amper die einde van Dawid se lyn, en dus van die belofte van die Messias. Maar Joseba, 'n tante, steek die babaseun Joas ses jaar lank in die tempel weg. Die priester Jojada lei 'n opstand en maak Joas op sewe jaar koning. Joas herstel later die tempel deur 'n geldkis by die altaar te sit.","leer":"Halfhartige gehoorsaamheid is nie genoeg nie – Jehu was ywerig, maar nie \"met sy hele hart\" nie. God bewaar Sy beloftes deur moeilike tye heen, dikwels deur die moed van gewone mense (Joseba). 'n Goeie geestelike mentor (Jojada) kan 'n jong mens se lewe vorm. Ons moet ons eie geloof hê, nie net 'n mentor s'n nie.","skrif":"Jehu: \"Kom saam met my en kyk na my ywer vir die Here\" (10:16). Hy vernietig Baäl uit Israel (10:28). \"Maar Jehu het nie daarop gelet om met sy hele hart in die wet van die Here... te wandel nie\" (10:31). Atalia vermoor die koninklike familie (11:1). Joseba red Joas (11:2–3). Joas word gekroon: \"Lank lewe die koning!\" (11:12). Jojada sluit 'n verbond tussen die Here, die koning en die volk (11:17). \"Joas het gedoen wat reg was in die oë van die Here al sy dae dat die priester Jojada hom onderrig het\" (12:2). Die geldkis vir die tempelherstel (12:9). Die werkers was so eerlik dat hulle nie rekenskap hoef te gee nie (12:15).","bid":"Dank God dat Hy Sy beloftes bewaar, selfs in die donkerste tye. Bid vir goeie mentors vir ons kinders. Bid dat elkeen 'n persoonlike geloof sal hê wat bly staan, ook as die mentors weg is. Bid vir eerlikheid in alles.","vraag":"Joas het goed gedoen \"solank Jojada hom onderrig het\". Wat gebeur as ons geloof net op iemand anders s'n leun?","hoofstukke":[["2 Konings","2KI",10],["2 Konings","2KI",11],["2 Konings","2KI",12]]},{"dag":160,"ref":"2 Konings 13 – 14","titel":"Elisa se Dood en Jerobeam II se Voorspoed","fase":5,"tydlyn":"c. 814–753 v.C. Israel en Juda. Elisa sterf c. 795 v.C.","agtergrond":"Israel word deur Aram onderdruk, maar God ontferm Hom oor hulle. Elisa, nou oud en siek, gee koning Joas van Israel 'n profetiese teken met pyle. Selfs ná Elisa se dood word 'n dooie man lewend toe hy aan Elisa se beendere raak. Amasia van Juda word hoogmoedig ná 'n oorwinning oor Edom en verloor teen Israel. Jerobeam II regeer 41 jaar oor Israel in 'n tyd van groot voorspoed – en 14:25 noem dat die profeet Jona, seun van Amittai, sy grense se herstel voorspel het. Dit is die tyd van Jona, Amos en Hosea.","leer":"God bly genadig ter wille van Sy verbond, selfs met 'n ontroue volk. Ons moet met volle ywer optree in geloof, nie halfhartig nie (Joas wat net drie keer slaan). Hoogmoed ná sukses lei tot 'n val. Voorspoed is nie altyd 'n teken van God se goedkeuring nie.","skrif":"Jehoahas smeek die Here, en die Here hoor hom (13:4). Elisa: \"Slaan op die grond!\" – Joas slaan net drie keer (13:18–19). \"Jy moes vyf of ses maal geslaan het\" (13:19). Die man wat aan Elisa se beendere raak, word lewend (13:21). \"Die Here was hulle genadig... ter wille van sy verbond met Abraham, Isak en Jakob\" (13:23). Amasia se hoogmoed: \"Waarom sou jy die onheil uitdaag?\" (14:10). Jerobeam II herstel die grense \"volgens die woord van die Here... deur sy kneg Jona\" (14:25). \"Die Here het die ellende van Israel gesien\" (14:26).","bid":"Bid dat ons nie halfhartig in ons geloof en gebed sal wees nie, maar met volle ywer. Bid teen hoogmoed in tye van sukses. Dank God vir Sy genade wat Hy aan Sy verbond verbind.","vraag":"Joas het net drie keer met die pyle geslaan. Waar is jy dalk halfhartig in iets wat God van jou vra?","hoofstukke":[["2 Konings","2KI",13],["2 Konings","2KI",14]]},{"dag":161,"ref":"Jona 1 – 4","titel":"Jona: God se Genade vir die Vyand","fase":5,"tydlyn":"c. 780–760 v.C., in die tyd van Jerobeam II (2 Konings 14:25). Jaffa (Joppe) aan die kus, die see, en Nineve – die hoofstad van Assirië, aan die Tigris (naby die huidige Mosul in Irak).","agtergrond":"Assirië was die wreedste wêreldmag van die tyd, bekend vir die marteling van oorwonne volke, en Israel se

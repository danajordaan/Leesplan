grootste bedreiging. Nineve was 'n reuse stad. God stuur Jona om daar te preek, maar Jona vlug in die teenoorgestelde rigting – na Tarsis (waarskynlik in Spanje, die verste bekende plek). Jesus verwys na Jona as 'n werklike persoon en na sy drie dae in die vis as 'n teken van Sy eie dood en opstanding (Matteus 12:39–41). Nineve se bekering was, soos die latere geskiedenis wys, nie blywend nie (vgl. Nahum).","leer":"Ons kan nie van God wegvlug nie. God se genade is groter as ons vooroordele – Hy gee ook om vir ons vyande en vir mense wat ons dink nie redding verdien nie. Gehoorsaamheid sonder liefde (Jona preek, maar wil nie hê hulle moet gered word nie) mis God se hart. \"Die heil is van die Here.\"","skrif":"Jona vlug na Tarsis \"weg van die aangesig van die Here\" (1:3). Die heidense matrose bid, maar Jona slaap (1:5–6). \"Ek is 'n Hebreër, en ek vrees die Here, die God van die hemel\" (1:9). Die Here beskik 'n groot vis (1:17). Jona se gebed in die vis: \"Die heil is van die Here\" (2:9). \"Nog veertig dae, dan word Nineve omgekeer!\" (3:4). Die hele Nineve, van die koning af, bekeer hulle (3:5–9). God het berou oor die onheil (3:10). Jona is kwaad: \"Ek het geweet dat U 'n genadige en barmhartige God is\" (4:2). Die wonderboom (4:6–10). \"Sou Ek dan nie die groot stad Nineve spaar nie?\" (4:11).","bid":"Bid vir mense wat ons as \"vyande\" beskou, of wat ons dink ver van God is – dat hulle tot bekering sal kom. Vra God om ons harte te wys waar ons, soos Jona, nie wil hê ander moet genade kry nie. Bid vir sendelinge in moeilike plekke.","vraag":"Waarom dink jy was Jona kwaad dat God Nineve gespaar het? Is daar mense vir wie jy dalk soos Jona voel?","hoofstukke":[["Jona","JON",1],["Jona","JON",2],["Jona","JON",3],["Jona","JON",4]]},{"dag":162,"ref":"Amos 1 – 3","titel":"God Brul vanuit Sion: Oordeel oor die Nasies – en oor Israel","fase":5,"tydlyn":"c. 760 v.C., \"twee jaar voor die aardbewing\" (1:1), in die tyd van Ussia van Juda en Jerobeam II van Israel. Amos kom van Tekoa in Juda, maar preek in Bet-el in Israel.","agtergrond":"Amos was 'n skaapboer en 'n kweker van wildevye – nie 'n beroepsprofeet nie (7:14). Israel was ryk en selfversekerd onder Jerobeam II, maar die rykdom was op onreg gebou: die armes is uitgebuit. Amos begin met oordeel oor die omliggende vyande (Damaskus, Gasa, Tirus, Edom, Ammon, Moab) – sy luisteraars sou ingestem het – en dan draai hy dit op Juda en, op sy skerpste, op Israel self. Die \"aardbewing\" was so groot dat dit eeue later nog onthou is (Sagaria 14:5), en argeoloë het tekens van 'n groot aardbewing in die middel van die 8ste eeu v.C. gevind.","leer":"God oordeel alle nasies volgens Sy morele standaard, maar Sy eie volk, wat Sy wet ken, het die grootste verantwoordelikheid. Om verkies te wees is nie 'n voorreg sonder verpligting nie – dit is 'n roeping om heilig te leef. God sien hoe die armes verdruk word.","skrif":"\"Die Here sal brul uit Sion\" (1:2). \"Oor drie oortredinge van... ja, oor vier\" – oor Damaskus, Gasa, Tirus, Edom, Ammon, Moab (1:3–2:3). Oor Juda: \"omdat hulle die wet van die Here verwerp het\" (2:4). Oor Israel: \"omdat hulle die regverdige vir geld verkoop en die behoeftige vir 'n paar skoene\" (2:6). \"Net julle het Ek geken uit al die geslagte van die aarde; daarom sal Ek al julle ongeregtighede aan julle besoek\" (3:2). \"Sal twee saam wandel tensy hulle ooreengekom het?\" (3:3). \"Die Here doen niks sonder dat Hy sy raadsbesluit aan sy knegte, die profete, geopenbaar het nie\" (3:7).","bid":"Bid vir die armes en uitgebuites in ons land. Bid dat ons as gesin nie gemaklik en selfvoldaan sal raak nie. Bid dat ons die groter verantwoordelikheid wat met God se Woord kom, ernstig sal opneem.","vraag":"Waarom dink jy het Amos eers oor die vyande gepraat en eers aan die einde oor Israel self?","hoofstukke":[["Amos","AMO",1],["Amos","AMO",2],["Amos","AMO",3]]},{"dag":163,"ref":"Amos 4 – 6","titel":"Soek die Here en Lewe – Laat Reg Aanrol soos Water","fase":5,"tydlyn":"c. 760 v.C. Bet-el en Samaria.","agtergrond":"Amos noem die ryk vroue van Samaria \"koeie van Basan\" (Basan was bekend vir sy vet vee) wat die armes verdruk en hul mans opdrag gee om drank te bring. Israel het steeds ywerig godsdiens beoefen – offers, feeste, liedere by Bet-el en Gilgal – maar dit was leeg omdat hul lewens vol onreg was. Ivoor-versierde huise en bedde (6:4) is deur argeoloë in Samaria opgegrawe. Die \"dag van die Here\" was vir hulle 'n dag van oorwinning; Amos sê dit sal 'n dag van oordeel wees.","leer":"God wil nie godsdienstige vertonings sonder geregtigheid en liefde in die alledaagse lewe nie. Om God te soek, beteken om Sy wil in elke deel van die lewe te doen. Gemaklike luukse terwyl ander ly, is sonde. God waarsku en roep ons telkens terug voordat oordeel kom.","skrif":"\"Koeie van Basan... wat die geringes verdruk\" (4:1). \"Tog het julle nie tot My teruggekeer nie\" (5 keer herhaal, 4:6–11). \"Maak jou gereed om jou God te ontmoet, o Israel!\" (4:12). \"Soek My, dan sal julle lewe\" (5:4). \"Haat die kwaad en het die goeie lief, en stel die reg in die poort\" (5:15). \"Ek haat, Ek verwerp julle feeste\" (5:21). \"Maar laat die reg aanrol soos water en die geregtigheid soos 'n standhoudende stroom\" (5:24). \"Wee die sorgelose in Sion... wat op ivoorbedde lê... maar hulle bekommer hulle nie oor die verbreking van Josef nie\" (6:1–6).","bid":"Bid dat ons godsdiens nie net 'n uiterlike vertoning sal wees nie, maar in reg en geregtigheid gesien sal word. Bid dat ons gemak ons nie blind sal maak vir ander se lyding nie. Bid vir geregtigheid in Suid-Afrika.","vraag":"Amos sê God haat feeste en liedere as die lewe vol onreg is. Hoe sou dit vandag in 'n kerk of gesin kon lyk?","hoofstukke":[["Amos","AMO",4],["Amos","AMO",5],["Amos","AMO",6]]},{"dag":164,"ref":"Amos 7 – 9","titel":"Die Skietlood, die Mandjie Somervrugte en die Herstelde Hut van Dawid","fase":5,"tydlyn":"c. 760 v.C. Bet-el, die koninklike heiligdom van Israel.","agtergrond":"Amos sien vyf visioene. In die eerste twee pleit hy vir Israel, en God laat Hom verbid. Die skietlood (7:7–8) is 'n boumeester se gereedskap om te toets of 'n muur reguit is – God meet Israel aan Sy standaard. Amasia, die priester van Bet-el, beveel Amos om terug te gaan na Juda. Die \"mandjie met somervrugte\" is 'n woordspel in Hebreeus: \"somervrugte\" (kajits) en \"einde\" (kets) klink byna dieselfde. Die boek eindig met 'n belofte van herstel: die vervalle \"hut van Dawid\" sal weer opgerig word – Jakobus haal dit aan by die vergadering in Jerusalem om te wys dat die nie-Jode in God se volk ingesluit word (Handelinge 15:16–17).","leer":"God luister na voorbidding. Hy meet ons nie aan ander mense nie, maar aan Sy reguit standaard. Die ergste oordeel is 'n honger na die woord van die Here wat nie meer gehoor word nie. Maar God se laaste woord is herstel: deur die Seun van Dawid bring Hy nasies in Sy koninkryk.","skrif":"Amos pleit: \"Here, vergeef tog!\" en die Here het berou (7:2–3). Die skietlood (7:7–8). Amasia: \"Gaan weg, siener, vlug na die land Juda\" (7:12). Amos: \"Ek was geen profeet nie... maar ek was 'n veeboer en 'n kweker van wildevye. En die Here het my agter die kleinvee weggeneem\" (7:14–15). Die mandjie somervrugte: \"Die einde het oor my volk Israel gekom\" (8:2). \"Ek sal 'n honger in die land stuur... na die hoor van die woorde van die Here\" (8:11). \"In dié dag sal Ek die vervalle hut van Dawid oprig\" (9:11). \"Ek sal die lot van my volk Israel verander\" (9:14).","bid":"Bid soos Amos vir ons land: \"Here, vergeef tog!\" Dank God dat ons Sy Woord vryelik kan hoor, en bid teen 'n \"hongersnood\" van God se Woord in ons huis. Dank God vir Jesus, die Seun van Dawid, deur wie die nasies ingebring word.","vraag":"Amos was \"net\" 'n boer, maar God het hom geroep. Wat sê dit oor wie God kan gebruik?","hoofstukke":[["Amos","AMO",7],["Amos","AMO",8],["Amos","AMO",9]]},{"dag":165,"ref":"Joël 1 – 3","titel":"Die Sprinkaanplaag en die Uitstorting van die Gees","fase":5,"tydlyn":"Datum onseker. Joël noem geen koning nie; voorstelle wissel van die 9de eeu v.C. tot ná die ballingskap (c. 400 v.C.). Ons lees hom hier saam met Amos, met wie hy taal en temas deel (vgl. Joël 3:16 en Amos 1:2). Juda en Jerusalem.","agtergrond":"'n Verwoestende sprinkaanplaag het die land getref – sprinkaanswerms kon (en kan steeds) alle plantegroei binne ure vernietig, met hongersnood as gevolg. Joël sien dit as 'n waarskuwing van die groot \"dag van die Here\" en roep die hele volk – oud en jonk – op tot vas, gebed en ware bekering. Daarna kom 'n merkwaardige belofte: God se Gees sal op alle mense uitgestort word. Petrus haal hierdie profesie met Pinkster aan (Handelinge 2:16–21). (Let wel: in die Hebreeuse Bybel en sommige vertalings is Joël in vier hoofstukke verdeel; die 1933/53 volg drie.)","leer":"Rampe kan ons wakker skud om na God terug te keer. Ware bekering is innerlik: \"Skeur julle hart en nie julle klere nie.\" God is genadig en kan selfs die jare wat verlore was, vergoed. Sy groot belofte vir die eindtyd – die Heilige Gees op seuns en dogters, jonk en oud – is met Pinkster vervul, en dit sluit ons kinders in.","skrif":"\"Het so iets in julle dae gebeur?... Vertel dit aan julle kinders\" (1:2–3). \"Die dag van die Here is naby\" (1:15). \"Bekeer julle tot My met julle hele hart, en met vas en geween en rouklag. En skeur julle hart en nie julle klere nie\" (2:12–13). \"Want Hy is genadig en barmhartig, lankmoedig en groot van goedertierenheid\" (2:13). \"Ek sal julle die jare vergoed wat die treksprinkaan verteer het\" (2:25). \"Ek sal my Gees uitstort op alle vlees, en julle seuns en julle dogters sal profeteer, julle oumense sal drome droom, julle jongmanne gesigte sien\" (2:28). \"Elkeen wat die Naam van die Here aanroep, sal gered word\" (2:32; vgl. Romeine 10:13).","bid":"Bid vir ware bekering in ons land – harte wat geskeur word, nie net klere nie. Dank God vir die gawe van die Heilige Gees, ook vir ons gesin se kinders. Bid dat God verlore jare in mense se lewens sal vergoed.","vraag":"Joël 2:28 sê God se Gees sal op \"seuns en dogters\" kom. Wat beteken dit vir jou as jongmens?","hoofstukke":[["Joël","JOL",1],["Joël","JOL",2],["Joël","JOL",3]]},{"dag":166,"ref":"Hosea 1 – 3","titel":"God se Liefde vir 'n Ontroue Vrou","fase":5,"tydlyn":"c. 755–725 v.C., van die tyd van Jerobeam II tot net voor die val van Samaria. Hosea preek in die noordryk Israel.","agtergrond":"God beveel Hosea om met Gomer te trou – 'n vrou wat ontrou sou wees. Uitleggers verskil of sy reeds ontrou was of eers later so geword het. Hosea se huwelik word 'n lewende gelykenis van God se verhouding met Israel: God is die getroue man, Israel die ontroue vrou wat agter Baäl (\"baäl\" beteken ook \"eienaar\" of \"man\") aangaan. Die kinders se name dra 'n boodskap: Jisreël (oordeel oor Jehu se bloedvergieting), Lo-Ruhama (\"geen ontferming\") en Lo-Ammi (\"nie my volk nie\"). (Gesels ouderdomsgepas oor die huweliksbeeld.)","leer":"Afgodery is geestelike ontrou: om God, wat ons liefhet, te verruil vir ander \"minnaars\". Maar God se liefde gee nie op nie. Hy gaan Sy ontroue bruid soek, koop haar terug en spreek haar weer met liefde aan. Dit is die evangelie: Christus het ons, wat ontrou was, met Sy eie lewe teruggekoop. \"Nie My volk nie\" word \"kinders van die lewende God\" (Romeine 9:25–26; 1 Petrus 2:10).","skrif":"Hosea trou met Gomer (1:2–3). Die name van die kinders (1:4–9). \"Julle is my volk nie\" – en tog: \"Hulle sal genoem word: kinders van die lewende God\" (1:9–10). Israel het nie geweet dat Ek die koring, wyn en olie gegee het nie (2:8). \"Ek sal haar lok en haar in die woestyn bring en na haar hart spreek\" (2:14). \"Ek sal jou met My verloof tot in ewigheid... in geregtigheid en reg en goedertierenheid en barmhartighede\" (2:19). \"Ek sal sê vir Lo-Ammi: Jy is my volk!\" (2:23). Hosea koop Gomer terug vir 15 sikkels silwer en gars (3:1–2).","bid":"Dank God vir Sy getroue liefde wat ons nie los nie, selfs as ons ontrou is. Bely die \"minnaars\" wat ons harte van God wegtrek. Bid vir huwelike in ons familie om getrou te bly. Bid vir mense wat ver van God af weggedwaal het, dat God hulle sal \"lok en na hulle hart spreek\".","vraag":"Hoe help Hosea se verhaal jou om God se liefde vir jou te verstaan?","hoofstukke":[["Hosea","HOS",1],["Hosea","HOS",2],["Hosea","HOS",3]]},{"dag":167,"ref":"Hosea 4 – 7","titel":"\"My Volk Gaan te Gronde weens Gebrek aan Kennis\"","fase":5,"tydlyn":"c. 750–730 v.C. Israel (ook \"Efraim\" genoem, na die grootste noordelike stam), in 'n tyd van politieke chaos: vier konings is binne 15 jaar vermoor (vgl. 2 Konings 15).","agtergrond":"Ná Jerobeam II se dood het Israel in chaos verval. Die priesters het nagelaat om God se wet te leer, en die volk het by die hoogtes afgode aanbid met kultiese prostitusie. Polities het Israel tussen Egipte en Assirië rondgeval, op soek na hulp by groot moondhede in plaas van by God (\"soos 'n onnosele duif\", 7:11). Hosea gebruik baie beelde: 'n koek wat nie omgedraai is nie (half gebak), dou wat verdwyn, 'n oond wat brand.","leer":"Om God nie te ken nie, is die wortel van morele verval – en leiers wat God se Woord nalaat, is daarvoor verantwoordelik. Oppervlakkige bekering wat soos die oggenddou verdwyn, is nie genoeg nie. God wil liefde en kennis van Hom meer as offers. Ons moet ons hulp by God soek, nie by mense of moondhede nie.","skrif":"\"Daar is geen trou en geen liefde en geen kennis van God in die land nie\" (4:1). \"My volk gaan te gronde weens gebrek aan kennis; omdat jy die kennis verwerp het, sal Ek jou verwerp\" (4:6). \"Soos die volk, so die priester\" (4:9). \"Kom en laat ons terugkeer na die Here... laat ons ken, laat ons jaag om die Here te ken\" (6:1–3). \"Julle liefde is soos 'n môrewolk en soos die dou\" (6:4). \"Want Ek het lus in liefde en nie in slagoffer nie, en in die kennis van God meer as in brandoffers\" (6:6; Jesus haal dit aan in Matteus 9:13 en 12:7). \"Efraim is 'n koek wat nie omgekeer is nie\" (7:8). \"Soos 'n onnosele duif sonder verstand\" (7:11).","bid":"Bid dat ons gesin God werklik sal ken – nie net van Hom weet nie. Bid vir pastore en leiers om God se Woord getrou te leer. Bid teen oppervlakkige geloof wat soos dou verdwyn.","vraag":"Hosea 6:6 sê God wil liefde en kennis van Hom meer as offers. Wat is die verskil tussen God ken en net van God weet?","hoofstukke":[["Hosea","HOS",4],["Hosea","HOS",5],["Hosea","HOS",6],["Hosea","HOS",7]]},{"dag":168,"ref":"Hosea 8 – 11","titel":"\"Toe Israel 'n Seun was, het Ek Hom Liefgehad\"","fase":5,"tydlyn":"c. 740–725 v.C. Israel, net voor Assirië dit vernietig.","agtergrond":"Hosea waarsku dat Assirië soos 'n arend oor Israel gaan kom. Hulle het \"wind gesaai en sal storm oes\". Hulle het konings aangestel sonder God en die kalf van Samaria aanbid. Hoofstuk 11 is een van die teerste gedeeltes in die Bybel: God praat soos 'n pa wat sy kind leer loop. Matteus haal 11:1 aan oor Jesus, wat as kind ook uit Egipte geroep is (Matteus 2:15) – Jesus is die getroue Seun wat Israel nie was nie.","leer":"Ons oes wat ons saai. Maar God se hart is die hart van 'n liefdevolle Vader, wat Sy kinders leer loop, hulle in Sy arms neem en hulle met bande van liefde trek. Selfs wanneer Hy moet straf, \"draai Sy hart om\" van ontferming. God se liefde is anders as menslike liefde: \"Ek is God en nie 'n mens nie.\"","skrif":"\"Hulle saai wind, en hulle sal storm maai\" (8:7). \"Ek skryf vir hom die menigvuldighede van my wet, maar dit word as iets vreemds beskou\" (8:12). \"Saai vir julle volgens geregtigheid, maai na die maatstaf van liefde; breek vir julle 'n nuwe land om, want dit is tyd om die Here te soek\" (10:12). \"Toe Israel 'n seun was, het Ek hom liefgehad, en uit Egipte het Ek my seun geroep\" (11:1). \"Dit is Ek wat Efraim leer loop het... Ek het hulle getrek met mensetoue, met bande van liefde\" (11:3–4). \"Hoe kan Ek jou oorgee, Efraim?... my hart draai in My om\" (11:8). \"Want Ek is God en nie 'n mens nie, die Heilige in jou midde\" (11:9).","bid":"Dank God dat Hy 'n Vader is wat ons leer loop en ons met bande van liefde trek. Bid vir Pappa om so 'n vader vir ons gesin se kinders te wees. Bid dat ons gesin \"volgens geregtigheid sal saai\".","vraag":"Hosea 11 beskryf God soos 'n pa wat sy kind leer loop. Wat sê dit vir jou oor hoe God oor jou voel?","hoofstukke":[["Hosea","HOS",8],["Hosea","HOS",9],["Hosea","HOS",10],["Hosea","HOS",11]]},{"dag":169,"ref":"Hosea 12 – 14","titel":"\"Keer Terug, o Israel\" – God se Laaste Uitnodiging","fase":5,"tydlyn":"c. 730–725 v.C. Net voor die val van Samaria in 722 v.C.","agtergrond":"Hosea herinner Israel aan hulle voorvader Jakob, wat met God geworstel en om seën gesmeek het (Genesis 32). Die volk het egter vergeet wie hulle uit Egipte uitgelei het. Die oordeel is naby. Maar die boek eindig met 'n pragtige uitnodiging tot bekering en 'n belofte van genesing. Paulus haal 13:14 aan in sy hoofstuk oor die opstanding: \"Dood, waar is jou angel?\" (1 Korintiërs 15:55).","leer":"Dit is nooit te laat om terug te keer na God nie – Hy gee ons selfs die woorde om mee te bid. Wanneer ons terugkeer, genees Hy ons ontrouheid en Sy liefde is vry en onverdiend. Die weë van die Here is reg; wie wys is, sal dit verstaan en daarin wandel. In Christus is selfs die dood oorwin.","skrif":"Jakob het met die Engel geworstel en gesmeek (12:3–4). \"Keer terug tot jou God, hou liefde en reg en wag gedurig op jou God\" (12:6). \"Ek, die Here, is jou God van Egipteland af... daar is geen Verlosser behalwe Ek nie\" (13:4). \"Uit die mag van die doderyk sal Ek hulle loskoop... o dood, waar is jou pessiektes?\" (13:14). \"Bekeer jou, o Israel, tot die Here jou God\" (14:1). \"Neem woorde met julle saam... sê vir Hom: Vergeef alle ongeregtigheid\" (14:2). \"Ek sal hulle afkerigheid genees, Ek sal hulle vrywillig liefhê\" (14:4). \"Die weë van die Here is reg, en die regverdiges wandel daarin\" (14:9).","bid":"Bid Hosea 14:2 saam: \"Here, vergeef al ons ongeregtigheid en neem aan wat goed is.\" Dank God dat Hy ons \"vrywillig\" liefhet. Bid vir iemand wat ons ken wat van God weggedwaal het, dat hy of sy sal terugkeer.","vraag":"God gee in Hosea 14 die woorde vir die volk om mee te bid. Waarom dink jy doen Hy dit?","hoofstukke":[["Hosea","HOS",12],["Hosea","HOS",13],["Hosea","HOS",14]]},{"dag":170,"ref":"2 Konings 15 – 17","titel":"Die Val van Samaria","fase":5,"tydlyn":"c. 792–722 v.C. Juda (Ussia/Asarja, Jotam, Agas) en Israel (vyf konings in 25 jaar, van Sagaria tot Hosea). Samaria val in 722 v.C.","agtergrond":"Die Assiriese koning Tiglat-Pileser III (ook \"Pul\" genoem, 745–727 v.C.) begin die gebiede rondom Israel verower en volke wegvoer. Israel se konings word een ná die ander vermoor. Agas van Juda (tydgenoot van Jesaja, Jesaja 7) vra Assirië om hulp teen Israel en Aram, en kopieer 'n heidense altaar in die tempel. Koning Hosea van Israel kom in opstand teen Assirië; Salmaneser V beleër Samaria drie jaar, en dit val in 722 v.C. (Sargon II eis die oorwinning op in sy inskripsies). Die Israeliete word weggevoer en ander volke word in hulle plek gevestig – die oorsprong van die Samaritane.","leer":"God is geduldig, maar Sy waarskuwings is nie leë dreigemente nie. Hoofstuk 17 gee die rede vir Israel se val: hulle het die Here verwerp, ander gode gedien, en na geen profeet geluister nie. Om God se Naam te dra, maar ook ander gode te dien, is nie geloof nie. Die geskiedenis waarsku ons: die sonde van een geslag word deur die volgende herhaal.","skrif":"Asarja (Ussia) word melaats (15:5). Die koningsmoorde in Israel (15:10, 14, 25, 30). Tiglat-Pileser voer die noorde weg (15:29). Agas offer sy seun deur die vuur (16:3) en kopieer die altaar van Damaskus (16:10–16). Samaria val (17:5–6). \"Dit het gebeur omdat die kinders van Israel teen die Here hulle God gesondig het\" (17:7). \"Die Here het Israel en Juda gewaarsku deur al sy profete\" (17:13). \"Hulle het die Here gevrees en hulle eie gode gedien\" (17:33).","bid":"Bid dat ons gesin en ons land na God se waarskuwings sal luister. Bid teen 'n \"gemengde\" geloof wat die Here vrees maar ook ander gode dien. Bid vir mense wat uit hulle land weggevoer of gevlug het.","vraag":"2 Konings 17:33 sê hulle het die Here gevrees én hul eie gode gedien. Hoe lyk so 'n \"gemengde\" geloof vandag?","hoofstukke":[["2 Konings","2KI",15],["2 Konings","2KI",16],["2 Konings","2KI",17]]},{"dag":171,"ref":"Jesaja 1 – 3","titel":"Kom, Laat Ons Saam 'n Regsaak Hê","fase":5,"inleiding":["Jesaja en Miga: Die Heilige van Israel en die Komende Messias","Jesaja, seun van Amos (nie die profeet Amos nie), het in Jerusalem gepreek van c. 740 tot ná 701 v.C., onder die konings Ussia, Jotam, Agas en Hiskia. Hy word dikwels \"die evangelis van die Ou Testament\" genoem, want geen ander profeet het so duidelik oor die Messias gepraat nie: Sy geboorte uit 'n maagd, Sy name, Sy Gees, Sy lyding as die Kneg van die Here, en die nuwe hemel en nuwe aarde. Die Nuwe Testament haal Jesaja meer aan as enige ander profeet.","Hoofstukke 1–39 spreek grootliks Jesaja se eie tyd aan (die Assiriese bedreiging). Hoofstukke 40–66 spreek die volk aan asof hulle reeds in Babiloniese ballingskap is (meer as 100 jaar later) en noem selfs Kores by die naam. Baie geleerdes meen daarom dat hoofstukke 40–66 deur latere profete in die tradisie van Jesaja geskryf is. Ander, en die Joodse en Christelike oorlewering, hou Jesaja self as die skrywer, en wys daarop dat die Nuwe Testament albei dele aan \"die profeet Jesaja\" toeskryf (bv. Johannes 12:38–41). Die boek se boodskap is in albei gevalle dieselfde: God is die Heilige van Israel wat oordeel en verlos.","Miga, 'n tydgenoot van Jesaja uit die plattelandse dorp Moreset, het dieselfde tyd gepreek. Ons lees hom ná Jesaja 1–35, net voor die verhaal van koning Hiskia."],"tydlyn":"c. 740–700 v.C. Jerusalem en Juda. Jesaja 1 is moontlik ná die Assiriese inval van 701 v.C. geskryf, wanneer die land verwoes was (1:7–8).","agtergrond":"Jesaja begin soos 'n hofsaak: hemel en aarde word as getuies geroep teen God se volk. Juda het nog die tempel, offers, feeste en gebede gehad – maar hulle hande was vol bloed: onreg teenoor wese en weduwees, korrupte leiers, omkopery. Hoofstuk 2:2–4 (byna woordeliks ook in Miga 4:1–3) sien vooruit na die \"laaste dae\" wanneer al die nasies na God se berg sal stroom. Hoofstuk 3 beskryf die oordeel oor leiers en die ydele vroue van Jerusalem.","leer":"Godsdiens sonder gehoorsaamheid en geregtigheid is vir God 'n las. Maar Sy uitnodiging is genadig: al is ons sondes soos skarlaken, kan dit wit word soos sneeu. God se plan sluit die nasies in, en Hy sal vrede bring. Hoogmoed sal verneder word en die Here alleen sal verhewe wees.","skrif":"\"Ek het kinders grootgemaak... maar hulle het teen My oortree. 'n Os ken sy eienaar... maar Israel ken nie\" (1:2–3). \"Waarvoor dien vir My die menigte van julle slagoffers?\" (1:11). \"Leer om goed te doen, soek wat reg is... doen reg aan die wees, verdedig die saak van die weduwee\" (1:17). \"Kom nou, en laat ons die saak uitmaak, sê die Here: al was julle sondes soos skarlaken, dit sal wit word soos sneeu\" (1:18). \"In die laaste dae sal die berg van die huis van die Here vasstaan... en al die nasies sal daarheen stroom\" (2:2). \"Hulle sal hul swaarde omsmee tot pikke\" (2:4). \"Die hoogmoedige oë van die mens sal verneder word, en die Here alleen sal hoog verhewe wees in dié dag\" (2:11).","bid":"Dank God dat Hy ons sondes wit kan maak soos sneeu. Bid dat ons geloof nie net op Sondae gesien sal word nie, maar in hoe ons ander behandel. Bid vir vrede tussen nasies, en vir die dag wanneer Jesus volkome vrede bring.","vraag":"God sê \"Kom, laat ons saam die saak uitmaak.\" Wat sê dit oor God se houding teenoor sondaars?","hoofstukke":[["Jesaja","ISA",1],["Jesaja","ISA",2],["Jesaja","ISA",3]]},{"dag":172,"ref":"Jesaja 4 – 6","titel":"\"Heilig, Heilig, Heilig\" – Jesaja se Roeping","fase":5,"tydlyn":"Hoofstuk 6: \"In die sterfjaar van koning Ussia\" (6:1), c. 740 v.C. Die tempel in Jerusalem.","agtergrond":"Die \"Spruit van die Here\" (4:2) is 'n Messiaanse titel (vgl. Jeremia 23:5; Sagaria 3:8). Die lied van die wingerd (hoofstuk 5) is 'n gelykenis: God het alles vir Sy wingerd (Israel) gedoen, maar dit het net wilde druiwe opgelewer. Jesus gebruik hierdie beeld in Markus 12:1–12. In hoofstuk 6 sien Jesaja die Here op Sy troon. Koning Ussia het 52 jaar regeer; sy dood was 'n onseker tyd – maar die ware Koning sit nog op Sy troon. Die serafs (\"brandendes\") bedek hulle gesigte voor God se heiligheid. Johannes 12:41 sê Jesaja het hier die heerlikheid van Jesus gesien.","leer":"God is heilig – volkome rein en anders as ons. Wanneer ons Hom werklik sien, sien ons ook ons eie sonde. Maar God reinig en vergewe, en stuur ons dan om Sy boodskap te dra. \"Hier is ek, stuur my\" is die antwoord van 'n vergewe hart. God soek vrug in ons lewe.","skrif":"\"My beminde het 'n wingerd gehad... en hy het gewag dat dit druiwe sou voortbring, maar dit het wilde druiwe voortgebring\" (5:1–2). \"Wee hulle wat sê van die kwaad dat dit goed is, en van die goeie dat dit kwaad is\" (5:20). \"Ek het die Here sien sit op 'n hoë en verhewe troon\" (6:1). \"Heilig, heilig, heilig is die Here van die leërskare; die hele aarde is vol van sy heerlikheid!\" (6:3). \"Wee my, want ek is verlore; want ek is 'n man onrein van lippe\" (6:5). Die gloeiende kool: \"jou ongeregtigheid is weggeneem en jou sonde versoen\" (6:7). \"Wie sal Ek stuur, en wie sal vir Ons gaan?\" – \"Hier is ek, stuur my!\" (6:8).","bid":"Aanbid God vir Sy heiligheid. Bely ons \"onrein lippe\" – woorde wat ons spyt is. Dank Hom vir Jesus se reiniging. Bid Jesaja se gebed: \"Hier is ek, stuur my\" – vir elkeen van ons.","vraag":"Wat het met Jesaja gebeur toe hy God se heiligheid gesien het? Waarom dink jy het hy so gereageer?","hoofstukke":[["Jesaja","ISA",4],["Jesaja","ISA",5],["Jesaja","ISA",6]]},{"dag":173,"ref":"Jesaja 7 – 9","titel":"Immanuel: 'n Kind is vir Ons Gebore","fase":5,"tydlyn":"c. 735–732 v.C. Jerusalem, tydens die bedreiging deur Aram (Damaskus) en Israel (Efraim) teen koning Agas.","agtergrond":"Aram en Israel wil Juda dwing om saam met hulle teen Assirië in opstand te kom. Agas is doodbang (7:2) en wil Assirië om hulp vra (2 Konings 16:7). Jesaja nooi hom om God te vertrou en selfs 'n teken te vra; Agas weier met 'n vroom klinkende verskoning. God gee self 'n teken: die jong vrou (Hebreeus almah; die Griekse vertaling, en Matteus 1:23, gebruik \"maagd\") sal 'n seun baar, Immanuel – \"God met ons\". Die teken het 'n naby vervulling in Agas se tyd gehad, maar is volkome vervul in Jesus se geboorte uit die maagd Maria. Hoofstuk 9 (in die 1933/53 is die bekende \"Want 'n Kind is vir ons gebore\" vers 9:5; in Engelse Bybels 9:6) sien die Seun wat as ewige Koning op Dawid se troon sal regeer.","leer":"In tye van vrees kan ons kies om op God of op menslike hulp te vertrou. \"As julle nie glo nie, sal julle nie bestaan nie.\" God se antwoord op die donker is 'n Kind: God self kom by ons woon. Jesus is Wonderbaar, Raadsman, Sterke God, Vader van die ewigheid, Vredevors – en Sy koninkryk sal geen einde hê nie.","skrif":"Agas se hart bewe soos die bome van die bos (7:2). \"Pas op en hou jou stil; wees nie bevrees nie\" (7:4). \"As julle nie glo nie, sal julle nie bestaan nie\" (7:9). \"Daarom sal die Here self aan julle 'n teken gee: Kyk, die maagd sal swanger word en 'n seun baar, en sy sal hom Immanuel noem\" (7:14). \"Die Here van die leërskare – Hom moet julle heilig ag... Hy sal julle 'n heiligdom wees\" (8:13–14). \"Na die wet en na die getuienis!\" (8:20). \"Die volk wat in duisternis wandel, sien 'n groot lig\" (9:1–2; vgl. Matteus 4:15–16). \"Want 'n Kind is vir ons gebore, 'n Seun is aan ons gegee; en die heerskappy is op sy skouer, en sy Naam word genoem: Wonderbaar, Raadsman, Sterke God, Vader van die ewigheid, Vredevors\" (9:5). \"Aan die uitbreiding van die heerskappy... sal daar geen einde wees nie\" (9:6).","bid":"Dank God vir Immanuel – dat God in Jesus by ons kom woon het. Bid vir vertroue in plaas van vrees, ook vir dinge wat ons as gesin bekommer. Gebruik die name van Jesus uit 9:5 in jul gebed: Wonderbaar, Raadsman, Sterke God, Vader van die ewigheid, Vredevors.","vraag":"Watter een van die name van Jesus in Jesaja 9 (in jou Bybel 9:5) beteken vir jou die meeste nou? Waarom?","hoofstukke":[["Jesaja","ISA",7],["Jesaja","ISA",8],["Jesaja","ISA",9]]},{"dag":174,"ref":"Jesaja 10 – 12","titel":"Die Takkie uit die Stomp van Isai","fase":5,"tydlyn":"c. 730–701 v.C. Assirië verower volk ná volk en bedreig Juda.","agtergrond":"God gebruik Assirië as \"die roede van my toorn\" om Sy ontroue volk te straf, maar Assirië self is trots en wreed en sal ook geoordeel word. Wanneer 'n boom afgekap word, bly 'n stomp oor; Dawid se familie (Isai was Dawid se vader) sal soos 'n afgekapte boom lyk, maar uit die stomp sal 'n nuwe loot uitspruit – die Messias. Op Hom sal die Gees van die Here rus. Hoofstuk 12 is 'n danklied vir die verlossing.","leer":"God gebruik selfs trotse nasies vir Sy doel, maar hulle bly verantwoordelik vir hul wreedheid. Wanneer alles verlore lyk, begin God iets nuuts. Jesus is die \"Spruit uit Isai\", vervul met die Gees, wat regverdig oordeel, die armes verdedig, en uiteindelik volmaakte vrede in die skepping sal bring.","skrif":"\"Wee Assur, die roede van my toorn\" (10:5). \"Sal die byl hom beroem teenoor die een wat daarmee kap?\" (10:15). \"'n Oorblyfsel sal terugkeer... na die sterke God\" (10:21). \"Daar sal 'n takkie uitspruit uit die stomp van Isai\" (11:1). \"Op Hom sal die Gees van die Here rus: die Gees van wysheid en verstand, die Gees van raad en sterkte, die Gees van kennis en van die vrees van die Here\" (11:2). \"Hy sal die armes in geregtigheid oordeel\" (11:4). \"Die wolf sal by die lam verkeer... en 'n klein seuntjie sal hulle aanja\" (11:6). \"Die aarde sal vol wees van die kennis van die Here soos die waters die seebodem oordek\" (11:9). \"Kyk, God is my heil; ek vertrou en sal nie vrees nie\" (12:2). \"Julle sal water skep met vreugde uit die fonteine van heil\" (12:3).","bid":"Dank God dat Hy iets nuuts begin waar alles verlore lyk. Bid vir die Gees van wysheid, verstand, raad en sterkte (11:2) vir ons gesin se kinders. Bid vir die dag wanneer die aarde vol sal wees van die kennis van die Here.","vraag":"Waarom dink jy gebruik God die beeld van 'n \"stomp\" wat weer uitloop? Waar het jy al gesien dat God iets nuuts uit iets \"doods\" maak?","hoofstukke":[["Jesaja","ISA",10],["Jesaja","ISA",11],["Jesaja","ISA",12]]},{"dag":175,"ref":"Jesaja 13 – 18","titel":"God Regeer oor die Nasies (I): Babel, Moab, Damaskus en Kus","fase":5,"tydlyn":"c. 730–700 v.C. Profesieë oor die volke rondom Israel.","agtergrond":"Hoofstukke 13–23 bevat \"godsprake\" (Hebreeus massa – \"las\") teen die nasies. Babel word eerste genoem, hoewel Assirië op daardie stadium die wêreldmag was; Babel het later die simbool van menslike hoogmoed teen God geword (vgl. Genesis 11; Openbaring 17–18). Hoofstuk 14:12–15 beskryf die val van die koning van Babel as die \"môrester\" wat uit die hemel val omdat hy homself bo God wou verhef. Baie Christene sien hierin ook 'n beeld van die val van Satan (vgl. Lukas 10:18), hoewel die teks primêr oor die koning van Babel gaan. Moab was oos van die Dooie See; Kus was die gebied suid van Egipte (Soedan/Etiopië).","leer":"God regeer oor die geskiedenis van alle nasies, nie net Israel nie. Hoogmoed wat homself in God se plek wil stel, sal verneder word. Selfs vir Israel se vyande toon God ontferming (Hy treur oor Moab, 16:9–11). Ons kan in die stormagtige wêreldgebeure rus, want God het 'n plan.","skrif":"Die dag van die Here oor Babel (13:6–11). \"Hoe het jy uit die hemel geval, o môrester, seun van die dageraad!... Ek wil opklim na die hemel... ek wil my gelykstel aan die Allerhoogste\" (14:12–14). \"Die Here van die leërskare het besluit, en wie sal dit verydel?\" (14:27). God se hart huil oor Moab (15:5; 16:9–11). \"'n Troon sal in goedertierenheid bevestig word... in die tent van Dawid\" (16:5). \"Jy het die God van jou heil vergeet\" (17:10). Kus sal 'n geskenk aan die Here bring (18:7).","bid":"Bid vir die nasies van die wêreld – dat hulle die Here sal leer ken. Bid teen hoogmoed in ons eie harte. Dank God dat Hy die geskiedenis in Sy hand hou.","vraag":"Die koning van Babel wou homself \"gelykstel aan die Allerhoogste\". Hoe probeer mense vandag om hulle eie god te wees?","hoofstukke":[["Jesaja","ISA",13],["Jesaja","ISA",14],["Jesaja","ISA",15],["Jesaja","ISA",16],["Jesaja","ISA",17],["Jesaja","ISA",18]]},{"dag":176,"ref":"Jesaja 19 – 23","titel":"God Regeer oor die Nasies (II): Egipte, Babel, Edom en Tirus","fase":5,"tydlyn":"c. 720–700 v.C. Juda soek hulp by Egipte teen Assirië.","agtergrond":"Egipte was die ou supermoondheid waarop Juda gereeld vir militêre hulp gesteun het. Jesaja loop drie jaar lank \"naak\" (waarskynlik net in 'n onderkleed, soos 'n krygsgevangene) as 'n teken dat Egipte deur Assirië weggevoer sal word (hoofstuk 20). Die verrassende belofte in 19:23–25 is dat Egipte en Assirië – Israel se grootste vyande – saam met Israel God se volk sal word. Hoofstuk 22 waarsku Jerusalem se eie leiers; Sebna (22:15) was 'n trotse amptenaar wat vir homself 'n luukse graf gebou het. Eljakim kry \"die sleutel van die huis van Dawid\" – Jesus pas dit op Homself toe (Openbaring 3:7). Tirus was 'n ryk handelsstad aan die kus van Fenisië.","leer":"Moenie op mense of magte vertrou in plaas van op God nie. God se plan is groter as ons dink: Hy wil selfs Israel se vyande seën en tot Sy volk maak. Selfsugtige leiers val, maar God stel getroue dienaars aan. Jesus hou die sleutels.","skrif":"Egipte se wysheid word dwaasheid (19:11–14). \"In dié dag sal daar 'n altaar vir die Here wees in die middel van Egipteland\" (19:19). \"Geseënd is Egipte, my volk, en Assur, die werk van my hande, en Israel, my erfdeel\" (19:25). Jesaja loop drie jaar as teken (20:2–4). \"Gevalle, gevalle is Babel!\" (21:9). \"Wagter, hoe ver is dit in die nag?\" (21:11). \"Laat ons eet en drink, want môre sterf ons\" (22:13; vgl. 1 Korintiërs 15:32). \"Ek sal die sleutel van die huis van Dawid op sy skouer lê\" (22:22). Tirus se trots en val (23).","bid":"Bid vir lande wat ons as vyande sien, dat hulle God se volk sal word. Bid vir eerlike, nederige leiers. Dank Jesus dat Hy die sleutel van die huis van Dawid hou.","vraag":"Jesaja 19:25 sê God sal Egipte en Assirië \"my volk\" noem. Watter verrassing is dit vir Israel? Wat sê dit vir ons?","hoofstukke":[["Jesaja","ISA",19],["Jesaja","ISA",20],["Jesaja","ISA",21],["Jesaja","ISA",22],["Jesaja","ISA",23]]},{"dag":177,"ref":"Jesaja 24 – 27","titel":"Die Dood sal vir Ewig Verslind Word","fase":5,"tydlyn":"Gedeelte oor die eindtyd (\"die Jesaja-apokalips\").","agtergrond":"Hoofstukke 24–27 sien vorentoe na die einde van die geskiedenis: God se oordeel oor die hele aarde, en dan 'n groot feesmaal op die berg Sion vir al die volke. Dit is een van die vroegste duidelike verwysings in die Bybel na die opstanding uit die dood (25:8; 26:19). Paulus haal 25:8 aan in 1 Korintiërs 15:54, en Johannes in Openbaring 21:4. \"Leviatan\" (27:1) was in die antieke Ooste 'n simbool van chaos en kwaad; God sal dit vernietig.","leer":"Die geskiedenis loop na 'n doel: God sal die kwaad oordeel en die dood self vernietig. Hy sal 'n fees vir al die volke berei en die trane van elke gesig afvee. Wie op Hom vertrou, het volmaakte vrede. Die dooies sal lewe.","skrif":"\"Die aarde is ontheilig onder sy inwoners, want hulle het die wette oortree\" (24:5). \"Die Here van die leërskare sal vir al die volke op hierdie berg 'n maaltyd berei\" (25:6). \"Hy sal die dood vir altyd verslind, en die Here Here sal die trane van elke aangesig afvee\" (25:8). \"Kyk, dit is onse God op wie ons gewag het, dat Hy ons kan verlos\" (25:9). \"Aan hom wat vas van sin is, sal U vrede, vrede gee, omdat hy op U vertrou\" (26:3). \"Vertrou op die Here vir ewig, want die Here Here is 'n ewige rots\" (26:4). \"U dooies sal lewe... word wakker en jubel, julle wat in die stof woon\" (26:19). God sal Leviatan straf (27:1).","bid":"Dank God dat Jesus die dood oorwin het en dat daar 'n dag kom wanneer alle trane afgevee word. Bid vir mense wat rou. Bid vir die \"vrede, vrede\" van 26:3 vir elkeen wat bekommerd is.","vraag":"Jesaja 25:8 sê God sal die dood vir altyd verslind. Hoe verander hierdie hoop die manier waarop ons na die dood kyk?","hoofstukke":[["Jesaja","ISA",24],["Jesaja","ISA",25],["Jesaja","ISA",26],["Jesaja","ISA",27]]},{"dag":178,"ref":"Jesaja 28 – 30","titel":"In Bekering en Rus is Julle Krag","fase":5,"tydlyn":"c. 705–701 v.C. Hiskia se tyd. Juda se leiers sluit 'n verbond met Egipte teen Assirië.","agtergrond":"Die leiers van Efraim (Israel) en Jerusalem was dronk – letterlik en geestelik – en het met Jesaja se eenvoudige boodskap gespot (28:9–10 klink soos babataal). Hulle het gedink hulle het 'n \"verbond met die dood\" gesluit wat hulle sal beskerm. In plaas daarvan om God te vra, stuur hulle gesante met geskenke na Egipte. God belowe 'n kosbare hoeksteen in Sion (28:16) – die Nuwe Testament pas dit op Jesus toe (Romeine 9:33; 1 Petrus 2:6). Jesus haal 29:13 aan teen die Fariseërs (Markus 7:6–7).","leer":"Godsdiens met die lippe sonder die hart is leeg. Ware krag lê nie in menslike planne en bondgenootskappe nie, maar in bekering, stilte en vertroue op God. God wag om genadig te wees. Hy sal ons lei: \"Dit is die weg, wandel daarin.\"","skrif":"\"Gebod op gebod, gebod op gebod, reël op reël\" (28:10). \"Kyk, Ek lê in Sion 'n steen... 'n kosbare hoeksteen, vas gegrondves; wie glo, sal nie haastig wees nie\" (28:16). \"Hierdie volk nader My met hul mond en eer My met hul lippe, maar hulle hart hou hulle ver van My af\" (29:13). \"Sal die werk van sy maker sê: Hy het my nie gemaak nie?\" (29:16). \"Wee die opstandige kinders... wat planne uitvoer, maar nie uit My nie\" (30:1). \"Deur bekering en rus sal julle verlos word; in stil wees en vertroue sal julle sterkte wees. Maar julle het nie gewil nie\" (30:15). \"Die Here wag om julle genadig te wees\" (30:18). \"Jou ore sal 'n woord agter jou hoor: Dit is die weg, wandel daarin\" (30:21).","bid":"Bid dat ons God nie net met ons lippe sal eer nie, maar met ons harte. Bid vir rus en stilte voor God in 'n besige lewe. Bid vir leiding: dat elkeen sal hoor \"dit is die weg\".","vraag":"Jesaja 30:15 sê krag lê in \"stil wees en vertroue\". Waarom is dit so moeilik vir ons om stil te word?","hoofstukke":[["Jesaja","ISA",28],["Jesaja","ISA",29],["Jesaja","ISA",30]]},{"dag":179,"ref":"Jesaja 31 – 35","titel":"'n Koning in Geregtigheid en die Woestyn wat Blom","fase":5,"tydlyn":"c. 705–701 v.C., met 'n blik op die toekoms.","agtergrond":"Jesaja waarsku weer teen vertroue op Egipte se perde en waens. Hy beskryf 'n regverdige koning wat soos 'n skuilplek teen die storm sal wees (32:1–2). Hoofstuk 34 is 'n oordeel oor Edom (as verteenwoordiger van al God se vyande). Hoofstuk 35 is 'n pragtige gedig oor die woestyn wat blom en 'n heilige pad waarop die verlostes huis toe gaan. Jesus verwys na 35:5–6 as bewys dat Hy die Messias is (Matteus 11:4–5).","leer":"Vertrou op God, nie op menslike sterkte nie. Die Messias-Koning bring geregtigheid en beskerming. Wanneer God verlos, verander selfs die dorste plekke in tuine van vreugde, en die swakstes word sterk. Die verlostes sal met gejubel by God aankom.","skrif":"\"Wee hulle wat aftrek na Egipte om hulp, wat op perde steun... maar die Heilige van Israel nie aanskou nie\" (31:1). \"Kyk, 'n koning sal regeer in geregtigheid\" (32:1). \"Die werk van die geregtigheid sal vrede wees\" (32:17). \"Die Here is ons Regter, die Here is ons Wetgewer, die Here is ons Koning; Hy sal ons verlos\" (33:22). \"Die woestyn en die dor land sal bly wees, en die wildernis sal juig en bloei soos 'n roos\" (35:1). \"Versterk die slap hande en maak vas die knikkende knieë\" (35:3). \"Dan sal die oë van die blindes geopen word, en die ore van die dowes ontsluit\" (35:5). \"Dit sal genoem word die heilige weg\" (35:8). \"Die losgekooptes van die Here sal terugkom... vreugde en blydskap sal hulle verkry, kommer en sugting sal wegvlug\" (35:10).","bid":"Bid vir mense in \"woestyn-tye\" – dat God hulle lewe weer sal laat blom. Bid dat ons die \"slap hande\" en \"knikkende knieë\" van ander sal versterk met bemoediging. Dank Jesus wat blindes laat sien en dowes laat hoor.","vraag":"Jesaja 35:3 vra ons om swakkes te versterk. Wie in jou lewe het nou bemoediging nodig?","hoofstukke":[["Jesaja","ISA",31],["Jesaja","ISA",32],["Jesaja","ISA",33],["Jesaja","ISA",34],["Jesaja","ISA",35]]},{"dag":180,"ref":"Miga 1 – 3","titel":"Oordeel oor Samaria en Jerusalem se Leiers","fase":5,"tydlyn":"c. 735–700 v.C., in die dae van Jotam, Agas en Hiskia (1:1). Miga kom van Moreset-Gat, 'n plattelandse dorp in die laeveld van Juda.","agtergrond":"Miga was 'n tydgenoot van Jesaja, maar waar Jesaja in die koninklike hof beweeg het, het Miga die perspektief van die plattelandse boere gehad – dié wie se grond deur ryk grondbesitters ingepalm is. Hy profeteer die val van Samaria (722 v.C.) en waarsku dat Jerusalem ook sal val. Meer as 'n eeu later het die oudstes van Juda Miga se woorde (3:12) aangehaal om Jeremia se lewe te red, en vertel dat koning Hiskia op Miga se preek berou gehad het (Jeremia 26:17–19).","leer":"God sien die onreg van magtiges teenoor gewone mense. Leiers – politieke en godsdienstige – wat vir geld preek en regeer, sal geoordeel word. 'n Ware profeet is vol van God se Gees en krag om sonde te benoem, nie om mense te behaag nie.","skrif":"\"Hoor, o volke almal\" (1:2). Miga treur oor die oordeel (1:8). \"Wee hulle wat ongeregtigheid bedink... Hulle begeer lande en roof dit\" (2:1–2). \"Moenie profeteer nie\" – die volk wil nie hoor nie (2:6). Die leiers \"haat die goeie en het die kwaad lief\" (3:2). \"Maar ek, ek is vol krag deur die Gees van die Here, en vol reg en sterkte, om aan Jakob sy oortreding te verkondig\" (3:8). \"Sy hoofde spreek reg vir 'n geskenk, en sy priesters leer vir loon, en sy profete waarsê vir geld\" (3:11). \"Daarom sal Sion ter wille van julle as 'n land omgeploeg word\" (3:12).","bid":"Bid vir eerlike regters, politici en kerkleiers in ons land. Bid vir boere en gewone mense wat uitgebuit word. Bid dat ons, soos Miga, vol van God se Gees sal wees om die waarheid te praat.","vraag":"Miga se woorde het 'n koning tot berou gebring (Jeremia 26:19). Wat sê dit oor die mag van God se Woord?","hoofstukke":[["Miga","MIC",1],["Miga","MIC",2],["Miga","MIC",3]]},{"dag":181,"ref":"Miga 4 – 7","titel":"Uit Betlehem sal die Heerser Kom – en Wat God Vra","fase":5,"tydlyn":"c. 735–700 v.C., met beloftes vir die verre toekoms.","agtergrond":"Miga sien verby die oordeel na herstel. Hoofstuk 5 bevat die profesie dat die Messias in Betlehem gebore sal word – die skrifgeleerdes haal dit aan toe die wyse manne van die Ooste kom vra (Matteus 2:5–6). (In die 1933/53 is dit Miga 5:1; in Engelse Bybels 5:2.) Hoofstuk 6 is weer 'n hofsaak tussen God en Sy volk, wat eindig met een van die bekendste opsommings van God se wil in die Bybel (6:8). Die boek eindig met 'n vraag wat op Miga se naam speel: Miga beteken \"Wie is soos die Here?\"","leer":"God se Koning sal uit 'n klein, onbelangrike dorpie kom – en Sy oorsprong is van ewigheid af. God vra nie groot offers nie, maar dat ons reg doen, liefde betoon en nederig met Hom wandel. Geen God is soos ons God nie: Hy vergewe sonde en gooi dit in die dieptes van die see.","skrif":"\"In die laaste dae... sal hulle hul swaarde omsmee tot pikke\" (4:1–3). \"Hulle sal sit elkeen onder sy wingerdstok en onder sy vyeboom, en niemand sal hulle verskrik nie\" (4:4). \"En jy, Betlehem Efrata, klein om te wees onder die geslagte van Juda – uit jou sal vir My voortkom een wat 'n heerser sal wees oor Israel; en sy oorsprong is uit die voortyd, uit die dae van die ewigheid\" (5:1). \"Hy sal hulle vrede wees\" (5:4). \"Hy het jou bekend gemaak, o mens, wat goed is; en wat vra die Here van jou anders as om reg te doen en goedertierenheid lief te hê en ootmoedig te wandel met jou God?\" (6:8). \"Maar ek sal uitsien na die Here\" (7:7). \"As ek in duisternis sit, is die Here my lig\" (7:8). \"Wie is 'n God soos U wat die ongeregtigheid vergewe?... U sal al hulle sondes in die dieptes van die see werp\" (7:18–19).","bid":"Dank God vir Jesus, gebore in Betlehem, wie se oorsprong van ewigheid af is. Bid Miga 6:8 oor elkeen van ons: om reg te doen, liefde te betoon en nederig met God te loop. Dank God dat Hy ons sondes in die dieptes van die see gooi.","vraag":"Lees Miga 6:8 weer. Kies een van die drie dinge en sê hoe jy dit vandeesweek kan doen.","hoofstukke":[["Miga","MIC",4],["Miga","MIC",5],["Miga","MIC",6],["Miga","MIC",7]]},{"dag":182,"ref":"2 Konings 18 – 20","titel":"Hiskia: Vertroue in die Krisis","fase":5,"tydlyn":"Hiskia regeer c. 715–686 v.C. (moontlik saam met sy vader vanaf c. 729). Die Assiriese koning Sanherib val Juda in 701 v.C. aan.","agtergrond":"Hiskia was een van Juda se beste konings. Hy het die hoogtes en afgode verwyder – selfs die koperslang van Moses, wat 'n afgod geword het (18:4). Toe Sanherib inval, het hy 46 versterkte stede van Juda ingeneem, insluitend Lakis (die Lakis-reliëfs in Sanherib se paleis in Nineve, nou in die British Museum, beeld dit uit). Sanherib se eie kroniek (die Taylor-prisma) spog dat hy Hiskia \"soos 'n voël in 'n hok\" in Jerusalem toegesluit het – maar dit sê nie dat hy Jerusalem ingeneem het nie. Hiskia het 'n tonnel gegrawe om water in die stad te bring (20:20); die Siloam-tonnel met sy Hebreeuse inskripsie bestaan nog. (Jesaja 36–39 vertel dieselfde gebeure; ons lees dit môre uit Jesaja se oogpunt.)","leer":"Wanneer ons voor 'n oormag staan, kan ons die bedreiging voor God \"oopsprei\" en bid. God hoor en verlos – nie omdat ons sterk is nie, maar vir Sy eie Naam se ontwil. Selfs 'n goeie, gebedsvolle leier kan later in trots en kortsigtigheid val.","skrif":"\"Hy het op die Here, die God van Israel, vertrou... hy het die Here aangehang\" (18:5–6). Die koperslang word vernietig (18:4). Die Assiriese veldowerste spot: \"Op wie vertrou jy?\" (18:19–20). Hy sê selfs die Here het hom gestuur (18:25). Hiskia gaan na die huis van die Here en sprei die brief oop voor die Here (19:14). \"Here, onse God, verlos ons tog uit sy hand, sodat al die koninkryke van die aarde kan weet dat U, Here, alleen God is\" (19:19). Die Engel van die Here slaan die Assiriese leër (19:35). Hiskia word siek en bid; God gee 15 jaar (20:1–6). Hy wys die Babiloniese gesante al sy skatte (20:12–15). \"Is dit nie so as daar maar vrede en sekerheid in my dae is nie?\" (20:19).","bid":"Sprei elkeen se \"brief\" – die grootste bekommernis van die oomblik – oop voor God in gebed. Bid vir vertroue wanneer mense ons geloof bespot. Bid dat ons nie, soos Hiskia aan die einde, net aan onsself en ons eie tyd sal dink nie.","vraag":"Hiskia het die brief \"voor die Here oopgesprei\". Wat sou jy vandag voor die Here wil oopsprei?","hoofstukke":[["2 Konings","2KI",18],["2 Konings","2KI",19],["2 Konings","2KI",20]]},{"dag":183,"ref":"Jesaja 36 – 39","titel":"Hiskia, Jesaja en die Skaduwee van Babel","fase":5,"tydlyn":"701 v.C. Jerusalem. Die siekte van Hiskia en die besoek van die Babiloniese gesante het waarskynlik 'n bietjie vroeër plaasgevind (c. 703 v.C.).","agtergrond":"Hierdie hoofstukke is byna woordeliks dieselfde as 2 Konings 18–20, maar hulle staan hier om 'n rede: hulle vorm die brug tussen die twee dele van Jesaja. Hoofstukke 36–37 eindig die Assiriese bedreiging (God red Jerusalem). Hoofstuk 38 bevat Hiskia se eie gebed en lied ná sy genesing (wat nie in Konings voorkom nie). Hoofstuk 39 eindig met die profesie dat alles na Babel weggevoer sal word – en hoofstuk 40 begin met troos vir die mense in daardie ballingskap. Merodag-Baladan (39:1) was 'n Babiloniese koning wat telkens teen Assirië in opstand gekom het en bondgenote gesoek het.","leer":"God is getrou om te red wanneer ons na Hom roep. Ons lewe en ons tye is in Sy hand; Hy kan selfs ons sonde agter Sy rug werp. Maar trots en die begeerte om mense te beïndruk, kan ons blootstel aan toekomstige gevaar. Die Here sien egter verder as ons, en berei reeds troos voor vir die volgende geslag.","skrif":"Die veldowerste se toespraak (36:4–20). Jesaja: \"Wees nie bevrees vir die woorde wat jy gehoor het nie\" (37:6). Hiskia se gebed (37:14–20). \"Ek sal hierdie stad beskut om dit te verlos, om My ontwil en om Dawid, my kneg, ontwil\" (37:35). Hiskia draai sy gesig na die muur en bid (38:2–3). \"Ek het jou gebed gehoor, Ek het jou trane gesien\" (38:5). \"U het al my sondes agter u rug gewerp\" (38:17). Die Babiloniese gesante (39:1–4). \"Kyk, daar kom dae dat alles wat in jou huis is... na Babel weggevoer sal word\" (39:6).","bid":"Dank God dat Hy ons gebede hoor en ons trane sien. Dank Hom dat Hy ons sondes agter Sy rug werp. Bid dat ons nie mense sal probeer beïndruk met wat ons het nie.","vraag":"Hiskia het sy skatte gewys om die Babiloniërs te beïndruk. Hoe probeer ons soms ander beïndruk – en wat is die gevaar daarvan?","hoofstukke":[["Jesaja","ISA",36],["Jesaja","ISA",37],["Jesaja","ISA",38],["Jesaja","ISA",39]]},{"dag":184,"ref":"Jesaja 40 – 42","titel":"\"Troos, Troos My Volk\" – die Kneg van die Here","fase":5,"tydlyn":"Gerig aan die volk in Babiloniese ballingskap (586–538 v.C.).","agtergrond":"Hier begin die tweede groot deel van Jesaja. Die toon verander van oordeel na troos. Die volk in ballingskap voel vergete: hulle tempel is verwoes, hulle land is leeg, en die Babiloniese gode lyk sterker. Jesaja wys op die onvergelyklike grootheid van Israel se God – die Skepper van die sterre. 40:3 (\"'n Stem van een wat roep\") word op Johannes die Doper toegepas (Markus 1:3). Hoofstuk 42 is die eerste van vier \"Kneg-van-die-Here\"-liedere (42:1–9; 49:1–13; 50:4–11; 52:13–53:12) wat in Jesus vervul word (Matteus 12:18–21).","leer":"God troos Sy volk met die belofte van vergifnis en Sy koms. Mense is soos gras wat verdor, maar God se Woord bly vir ewig. Wie op die Here wag, kry nuwe krag. Sy Kneg (Jesus) kom saggies – Hy sal die geknakte riet nie breek nie – en bring geregtigheid en lig vir die nasies.","skrif":"\"Troos, troos my volk, sê julle God\" (40:1). \"Berei in die woestyn die weg van die Here\" (40:3). \"Die gras verdor, die blom verwelk; maar die woord van onse God bly tot in ewigheid\" (40:8). \"Soos 'n herder sal Hy sy kudde laat wei; in sy arm sal Hy die lammers vergader\" (40:11). \"Aan wie sal julle My dan vergelyk?\" (40:25). \"Die wat op die Here wag, kry nuwe krag; hulle vaar op met vleuels soos die arende; hulle hardloop en word nie moeg nie\" (40:31). \"Vrees nie, want Ek is met jou... Ek versterk jou, ook help Ek jou, ook ondersteun Ek jou met my reddende regterhand\" (41:10). \"Kyk, my Kneg... Ek het my Gees op Hom gelê\" (42:1). \"Die geknakte riet sal Hy nie verbreek nie, en die rokende vlaspit sal Hy nie uitblus nie\" (42:3). \"'n Lig vir die heidene\" (42:6).","bid":"Bid Jesaja 40:31 oor elkeen wat moeg is. Dank God dat Sy Woord vir ewig bly. Dank Jesus dat Hy saggies is met \"geknakte riete\" – en bid vir mense wat gebroke voel.","vraag":"Jesaja 42:3 sê Jesus sal die \"geknakte riet\" nie breek nie. Wat beteken dit vir iemand wat swak of gebroke voel?","hoofstukke":[["Jesaja","ISA",40],["Jesaja","ISA",41],["Jesaja","ISA",42]]},{"dag":185,"ref":"Jesaja 43 – 45","titel":"\"Ek het Jou by Jou Naam Geroep\" – Net Een God","fase":5,"tydlyn":"Gerig aan die ballinge in Babel, met die opkoms van Kores (Kores II van Persië, wat Babel in 539 v.C. verower).","agtergrond":"In Babel het die Jode die groot godebeelde gesien wat in optogte rondgedra is. Jesaja maak 'n skerp spotprent van afgode: 'n man kap 'n boom, gebruik die helfte om kos te kook en kniel voor die ander helfte (44:9–20). God noem Kores by die naam (44:28; 45:1) as die een wat Jerusalem sal laat herbou. Die Kores-silinder (in die British Museum) bevestig dat Kores die beleid gevolg het om weggevoerde volke na hulle lande te laat terugkeer en hulle tempels te herbou (vgl. Esra 1).","leer":"God ken elkeen van ons persoonlik en het ons by die naam geroep. Hy is met ons in die water en die vuur. Daar is geen ander God nie – afgode is mensgemaakte dwaasheid. God regeer oor wêreldleiers en gebruik selfs heidense konings vir Sy doel. Elke knie sal voor Hom buig.","skrif":"\"Vrees nie, want Ek het jou verlos; Ek het jou by jou naam geroep, jy is myne!\" (43:1). \"As jy deur die water gaan, is Ek by jou... as jy deur die vuur gaan, sal jy nie verbrand nie\" (43:2). \"Julle is my getuies\" (43:10). \"Ek, Ek is die Here, en buiten My is daar geen Verlosser nie\" (43:11). \"Dink nie aan die vorige dinge nie... kyk, Ek maak iets nuuts\" (43:18–19). \"Ek, Ek is dit wat jou oortredinge uitdelg om My ontwil\" (43:25). Die afgodemaker (44:9–20). \"Wat van Kores sê: Hy is my herder\" (44:28). \"Ek is die Here, en daar is geen ander nie\" (45:5–6). \"Wend julle na My en word gered, al die eindes van die aarde\" (45:22). \"Voor My sal elke knie buig\" (45:23; vgl. Filippense 2:10–11).","bid":"Dank God dat Hy elkeen van ons by die naam ken en geroep het. Bid vir mense wat deur \"water en vuur\" gaan. Bid dat ons lewe 'n getuienis sal wees dat daar net een ware God is.","vraag":"Jesaja 43:1 sê \"Ek het jou by jou naam geroep, jy is myne.\" Hoe voel dit om te weet God ken jou persoonlik?","hoofstukke":[["Jesaja","ISA",43],["Jesaja","ISA",44],["Jesaja","ISA",45]]},{"dag":186,"ref":"Jesaja 46 – 48","titel":"Gode wat Gedra Moet Word teenoor die God wat Dra","fase":5,"tydlyn":"Gerig aan die ballinge in Babel, kort voor die val van Babel (539 v.C.).","agtergrond":"Bel en Nebo was die hoofgode van Babel (Bel = Mardoek; Nebo = Nabu, god van wysheid en skryf – vandaar name soos Nebukadnesar). Hulle beelde moes op diere gelaai en weggedra word wanneer gevaar kom. Hoofstuk 47 beskryf die val van Babel, \"die koningin van die koninkryke\", wat haar op toordery en sterrewiggelary verlaat het. Hoofstuk 48 berispe die Jode wat steeds hardkoppig is.","leer":"Afgode is 'n las wat ons moet dra; die ware God dra ons – van geboorte tot ouderdom. God weet die einde van die begin af, en Sy plan sal uitgevoer word. Trots en okkultisme kan nie red nie. God beproef en louter ons in die smeltoond van swaarkry, en Hy leer ons wat goed is vir ons.","skrif":"\"Bel buig neer, Nebo krom... hulle is 'n vrag vir die moeë diere\" (46:1). \"Ek wat julle gedra het van die moederskoot af... tot die ouderdom is Ek dieselfde, en tot die grysheid sal Ek julle dra\" (46:3–4). \"Wat van die begin af die einde verkondig\" (46:10). \"My raad sal tot stand kom\" (46:10). Die val van Babel (47:1–15). Die sterrekykers kan jou nie red nie (47:13–14). \"Ek het jou gelouter... Ek het jou beproef in die smeltoond van ellende\" (48:10). \"Ek is die Here jou God wat jou leer wat nuttig is, wat jou lei op die weg wat jy moet gaan\" (48:17). \"Ag, as jy maar ag gegee het op my gebooie! Dan sou jou vrede gewees het soos 'n rivier\" (48:18).","bid":"Dank God dat Hy ons dra – van ons geboorte tot ons ouderdom. Bid vir mense wat in astrologie en okkultisme hul hoop soek. Bid dat swaarkry ons sal louter, nie bitter maak nie.","vraag":"Afgode moet gedra word, maar God dra ons. Wat sê dit oor die verskil tussen God en die \"afgode\" van ons tyd?","hoofstukke":[["Jesaja","ISA",46],["Jesaja","ISA",47],["Jesaja","ISA",48]]},{"dag":187,"ref":"Jesaja 49 – 51","titel":"Op die Palms van My Hande Gegraveer","fase":5,"tydlyn":"Gerig aan die ballinge in Babel.","agtergrond":"Hoofstuk 49 is die tweede Kneg-lied: die Kneg word \"'n lig vir die heidene\" sodat God se redding tot by die eindes van die aarde kan kom (Paulus pas dit op sy eie sending toe, Handelinge 13:47). Sion (Jerusalem) voel vergete deur God. Hoofstuk 50 is die derde Kneg-lied: die Kneg luister elke oggend na God, en Hy word geslaan en bespot sonder om terug te deins – presies wat met Jesus gebeur het (Markus 14:65; 15:19). Hoofstuk 51 roep die volk om na Abraham te kyk: as God een man tot 'n volk kon maak, kan Hy hulle herstel.","leer":"God vergeet ons nooit – selfs nie so min as wat 'n ma haar baba kan vergeet nie. Jesus, die Kneg, het die vernedering in ons plek gedra. Ons moet, soos die Kneg, elke oggend na God luister. Die verlostes van die Here sal met vreugde terugkom.","skrif":"\"Ek sal jou ook maak 'n lig vir die heidene, dat my heil kan wees tot aan die einde van die aarde\" (49:6). \"Maar Sion sê: Die Here het my verlaat\" (49:14). \"Kan 'n vrou haar suigeling vergeet...? Al sou hulle ook vergeet, tog sal Ek jou nie vergeet nie. Kyk, in die handpalms het Ek jou gegraveer\" (49:15–16). \"Elke môre wek Hy... my oor om te hoor soos leerlinge\" (50:4). \"Ek het my rug gegee vir die slaners... my aangesig het Ek nie verberg vir smaad en bespuwing nie\" (50:6). \"Kyk na Abraham, julle vader\" (51:2). \"Die losgekooptes van die Here sal terugkeer en met gejubel na Sion kom\" (51:11). \"Ek, Ek is dit wat julle troos\" (51:12).","bid":"Dank God dat ons op die palms van Sy hande gegraveer is – Hy kan ons nie vergeet nie. Bid dat ons elke oggend na God sal luister. Dank Jesus dat Hy die slae en spot vir ons gedra het.","vraag":"God sê selfs as 'n ma haar baba vergeet, sal Hy jou nie vergeet nie. Wanneer het jy al gevoel dat God jou vergeet het?","hoofstukke":[["Jesaja","ISA",49],["Jesaja","ISA",50],["Jesaja","ISA",51]]},{"dag":188,"ref":"Jesaja 52 – 54","titel":"Die Lydende Kneg: Hy is om Ons Oortredinge Deurboor","fase":5,"tydlyn":"Gerig aan die ballinge, maar met die oog op die kruis, meer as 500 jaar later.","agtergrond":"Jesaja 52:13–53:12 is die vierde Kneg-lied en een van die belangrikste gedeeltes in die hele Ou Testament. Dit beskryf iemand wat verag, verwerp, mishandel en doodgemaak word – nie vir sy eie sonde nie, maar in die plek van ander. Hy sterf soos 'n lam, word saam met misdadigers gereken en by 'n ryk man begrawe, en tog \"sal Hy die lewe verleng\" (opstanding). Die Etiopiese hofbeampte het juis hierdie gedeelte gelees toe Filippus hom die evangelie van Jesus vertel het (Handelinge 8:32–35). Die Groot Jesajarol van die Dooie See-rolle (c. 125 v.C.) bevat hierdie hoofstuk, wat bewys dat dit lank voor Jesus geskryf is.","leer":"Jesus het in ons plek gely en gesterf. Ons sonde is op Hom gelê, en deur Sy wonde is ons genees. Dit was die Here se plan. Hierdie goeie nuus moet versprei word: \"Hoe lieflik is die voete van die boodskapper.\" God se liefde vir Sy volk is ewig.","skrif":"\"Hoe lieflik is op die berge die voete van hom wat 'n goeie boodskap bring\" (52:7). \"Hy was verag en deur mense verlaat, 'n man van smarte en bekend met krankheid\" (53:3). \"Waarlik, ons krankhede het Hy op Hom geneem, en ons smarte het Hy gedra\" (53:4). \"Maar Hy is ter wille van ons oortredinge deurboor, ter wille van ons ongeregtighede is Hy verbrysel; die straf wat vir ons die vrede aanbring, was op Hom, en deur sy wonde het daar vir ons genesing gekom\" (53:5). \"Ons het almal soos skape gedwaal... maar die Here het die ongeregtigheid van ons almal op Hom laat neerkom\" (53:6). \"Soos 'n lam wat na die slagplek gelei word\" (53:7). \"By 'n ryke was Hy in sy dood\" (53:9). \"Hy sal 'n nageslag sien, die lewe verleng\" (53:10). \"Hy is saam met die oortreders getel, terwyl Hy tog die sonde van baie gedra het\" (53:12). \"Met ewige goedertierenheid sal Ek My oor jou ontferm\" (54:8). \"Al wyk die berge... my goedertierenheid sal van jou nie wyk nie\" (54:10).","bid":"Lees Jesaja 53:5–6 stadig saam en sit elkeen se naam in die plek van \"ons\". Dank Jesus persoonlik vir wat Hy gedoen het. Bid vir mense wat nog nie hierdie goeie nuus gehoor het nie.","vraag":"Lees Jesaja 53:5 en sit jou eie naam in. Hoe voel dit om dit so persoonlik te lees?","hoofstukke":[["Jesaja","ISA",52],["Jesaja","ISA",53],["Jesaja","ISA",54]]},{"dag":189,"ref":"Jesaja 55 – 57","titel":"\"Kom na die Water\" – God se Uitnodiging aan Almal","fase":5,"tydlyn":"Gerig aan die ballinge en aan die toekomstige volk van God.","agtergrond":"Ná die lydende Kneg (hoofstuk 53) volg die uitnodiging: die redding wat Hy bewerk het, is gratis beskikbaar. In die Ooste het waterverkopers in die strate geroep; hier roep God self – maar sonder om geld te vra. Hoofstuk 56 sluit vreemdelinge en eunugs (wat volgens die wet uit die vergadering uitgesluit was, Deuteronomium 23:1) in God se volk in – vgl. die Etiopiese eunug in Handelinge 8. Jesus haal 56:7 aan by die tempelreiniging (Markus 11:17). Hoofstuk 57 kontrasteer die afgodery van die goddeloses met God se nabyheid aan die nederiges.","leer":"God se genade is gratis – ons kan dit nie koop nie, net ontvang. Sy gedagtes en weë is hoër as ons s'n, en Sy Woord sal altyd doen waarvoor Hy dit stuur. God se huis is oop vir almal wat Hom soek, ook dié wat uitgesluit voel. Die hoë en verhewe God woon by dié wat verslae en nederig van gees is.","skrif":"\"Ag, almal wat dors het, kom na die water, en julle wat geen geld het nie, kom koop en eet... sonder geld en sonder prys\" (55:1). \"Soek die Here terwyl Hy te vinde is; roep Hom aan terwyl Hy naby is\" (55:6). \"My gedagtes is nie julle gedagtes nie, en julle weë is nie my weë nie\" (55:8). \"So sal my woord wees... dit sal nie leeg na My terugkeer nie\" (55:11). \"My huis sal 'n huis van gebed genoem word vir al die volke\" (56:7). \"Ek woon in die hoogte en in die heilige plek, en by die verbryselde en nederige van gees\" (57:15). \"Vir die goddelose is daar geen vrede nie\" (57:21).","bid":"Dank God dat Sy genade gratis is. Bid vir mense wat \"dors\" na God het sonder om dit te besef. Bid dat ons kerk 'n huis van gebed sal wees vir almal – ook vir mense wat uitgesluit voel. Bid vir 'n nederige gees.","vraag":"Jesaja 55:1 sê kom \"sonder geld en sonder prys\". Waarom is dit so moeilik vir mense om iets heeltemal gratis van God te aanvaar?","hoofstukke":[["Jesaja","ISA",55],["Jesaja","ISA",56],["Jesaja","ISA",57]]},{"dag":190,"ref":"Jesaja 58 – 60","titel":"Ware Vas, en \"Staan op, Word Verlig\"","fase":5,"tydlyn":"Moontlik gerig aan die volk ná die terugkeer uit ballingskap, toe hulle steeds gesukkel het.","agtergrond":"Die volk het gevas en gekla dat God nie raaksien nie. God antwoord dat hulle vas net 'n uiterlike ritueel was terwyl hulle hul werkers verdruk en baklei het. Hoofstuk 59 beskryf hoe sonde 'n skeiding tussen ons en God maak, en hoe God self ingryp omdat daar niemand anders was nie. Hoofstuk 60 is 'n visioen van Sion wat in God se lig skitter, met nasies wat na die lig toe kom – Openbaring 21 gebruik baie van hierdie beelde vir die nuwe Jerusalem.","leer":"God soek 'n \"vas\" wat bande van onreg losmaak, honger mense voed en dakloses huisves. Wanneer ons só leef, breek ons lig deur soos die dageraad. Sonde skei ons van God, maar Hy kom self as Verlosser. God se lig in ons lewe moet ander na Hom trek.","skrif":"\"Is dit nie die vas wat Ek verkies nie: dat jy die bande van goddeloosheid losmaak... en die verdruktes vrylaat?... dat jy jou brood breek vir die hongerige... en as jy 'n naakte sien, dat jy hom klee\" (58:6–7). \"Dan sal jou lig deurbreek soos die dageraad\" (58:8). \"Die Here sal jou gedurigdeur lei\" (58:11). Die sabbat 'n lus noem (58:13). \"Kyk, die hand van die Here is nie te kort om te verlos nie... maar julle ongeregtighede het 'n skeiding gemaak tussen julle en julle God\" (59:1–2). \"Hy het gesien dat daar niemand was nie... toe het sy arm Hom gehelp\" (59:16). \"'n Verlosser sal na Sion kom\" (59:20). \"Staan op, word verlig! want jou lig kom, en die heerlikheid van die Here gaan oor jou op\" (60:1). \"Nasies sal wandel na jou lig\" (60:3).","bid":"Bid dat ons gesin se \"vas\" en geloof prakties gesien sal word – in hulp vir die honger en armes. Bid dat ons lig sal skyn in ons skool en omgewing. Bely enige sonde wat skeiding tussen ons en God maak.","vraag":"Jesaja 58 sê ware \"vas\" is om die honger te voed en die verdrukte te help. Wat kan ons as gesin hierdie maand doen?","hoofstukke":[["Jesaja","ISA",58],["Jesaja","ISA",59],["Jesaja","ISA",60]]},{"dag":191,"ref":"Jesaja 61 – 63","titel":"\"Die Gees van die Here is op My\"","fase":5,"tydlyn":"Gerig aan die volk ná die ballingskap, maar vervul in Jesus.","agtergrond":"Jesus het Sy openbare bediening in die sinagoge van Nasaret begin deur Jesaja 61:1–2 voor te lees, en toe te sê: \"Vandag is hierdie Skrif vervul\" (Lukas 4:16–21). Hy het opvallend opgehou voor die woorde \"die dag van wraak van onse God\" – Sy eerste koms was vir genade; die oordeel kom by Sy wederkoms. Hoofstuk 62 beskryf God se vreugde oor Sy volk soos 'n bruidegom oor sy bruid. Hoofstuk 63 begin met 'n beeld van God wat terugkom van oordeel oor Edom (Bosra) met klere rooi soos 'n wynpers (vgl. Openbaring 19:13–15), en eindig met 'n gebed van die volk.","leer":"Jesus is die Gesalfde wat goeie nuus bring aan die armes, die gebrokenes genees en gevangenes vry maak. Hy gee \"sieraad in plaas van as\" en klere van lof in plaas van 'n neerslagtige gees. God verheug Hom oor Sy volk, en Hy noem hulle met nuwe name. Hy het in al ons benoudheid saam met ons gely.","skrif":"\"Die Gees van die Here Here is op My, omdat die Here My gesalf het om 'n blye boodskap te bring aan die ootmoediges; Hy het My gestuur om te verbind die wat gebroke is van hart, om vir die gevangenes vrylating uit te roep\" (61:1). \"Om uit te roep die jaar van die welbehae van die Here\" (61:2). \"Sieraad in plaas van as... die gewaad van lof in plaas van 'n neerslagtige gees\" (61:3). \"Hy het my beklee met die klere van heil\" (61:10). \"Soos 'n bruidegom hom verbly oor die bruid, so sal jou God Hom oor jou verbly\" (62:5). \"Op jou mure, o Jerusalem, het Ek wagte aangestel... gun Hom geen rus nie\" (62:6–7). \"In al hulle benoudheid was Hy benoud\" (63:9).","bid":"Dank Jesus dat Hy gekom het om die gebrokenes te genees en gevangenes vry te maak. Bid vir mense wat \"as\" in hulle lewe het – rou, skaamte – dat Hy hulle sieraad sal gee. Bid soos die \"wagte op die mure\" vir ons kerk en land.","vraag":"Jesus het Jesaja 61 gelees en gesê dit gaan oor Hom. Watter deel van Jesaja 61:1–3 beskryf wat Hy al in jou lewe gedoen het?","hoofstukke":[["Jesaja","ISA",61],["Jesaja","ISA",62],["Jesaja","ISA",63]]},{"dag":192,"ref":"Jesaja 64 – 66","titel":"'n Nuwe Hemel en 'n Nuwe Aarde","fase":5,"tydlyn":"Die einde van Jesaja – met 'n blik op die einde van die geskiedenis.","agtergrond":"Hoofstuk 64 is 'n diep gebed: \"Ag, as U die hemel maar skeur en neerdaal!\" – wat in Jesus se koms en by Sy doop (Markus 1:10, die hemel \"skeur\") vervul is. In hoofstuk 65–66 belowe God 'n nuwe hemel en 'n nuwe aarde waar daar geen huil meer sal wees nie. Hierdie beelde word in Openbaring 21–22 opgeneem. Die boek eindig met nasies wat God se heerlikheid sien, en met 'n ernstige waarskuwing oor die lot van dié wat teen Hom opstaan (66:24; Jesus haal dit aan in Markus 9:48).","leer":"Ons is soos klei, en God is die Pottebakker. Al ons eie geregtighede is soos vuil klere – ons het Sy genade nodig. God gaan alles nuut maak: 'n wêreld sonder trane, met volmaakte vrede. Hy sien om na die nederige en verslae van gees wat bewe vir Sy Woord. Die keuse om Hom te volg, het ewige gevolge.","skrif":"\"Ag, as U die hemel maar skeur en neerdaal!\" (64:1). \"Al ons geregtighede is soos 'n besoedelde kleed\" (64:6). \"Nogtans, Here, U is ons Vader; ons is die klei, en U is ons Formeerder\" (64:8). \"Ek het my laat vind deur die wat My nie gesoek het nie\" (65:1; vgl. Romeine 10:20). \"Kyk, Ek skep 'n nuwe hemel en 'n nuwe aarde\" (65:17). \"Daar sal nie meer gehoor word die geluid van geween nie\" (65:19). \"Voordat hulle roep, sal Ek antwoord\" (65:24). \"Die wolf en die lam sal saam wei\" (65:25). \"Die hemel is my troon en die aarde die voetbank van my voete\" (66:1). \"Maar op hierdie een sal Ek ag gee: op die ellendige en die wat verslae van gees is en wat bewe vir my woord\" (66:2).","bid":"Dank God vir die hoop van 'n nuwe hemel en nuwe aarde. Bid dat ons as klei in die Pottebakker se hande gevorm sal word. Bid vir 'n hart wat \"bewe vir Sy Woord\" – wat dit ernstig opneem.","vraag":"Hoe dink jy sal die nuwe hemel en aarde lyk? Waarna sien jy die meeste uit?","hoofstukke":[["Jesaja","ISA",64],["Jesaja","ISA",65],["Jesaja","ISA",66]]},{"dag":193,"ref":"2 Konings 21 – 23","titel":"Manasse se Gruwels en Josia se Hervorming","fase":5,"tydlyn":"Manasse 697–642 v.C. (55 jaar – die langste regering in Juda); Amon 642–640 v.C.; Josia 640–609 v.C. Die wetboek word in 622 v.C. gevind (Josia se 18de jaar).","agtergrond":"Manasse, Hiskia se seun, was Juda se slegste koning: hy het Baäl-altare herbou, sterre aanbid, sy seun deur die vuur laat gaan, waarsêery beoefen en baie onskuldige bloed vergiet (volgens Joodse oorlewering ook Jesaja). 2 Kronieke 33 vertel dat hy later in Babel berou gekry het. Josia word op agt jaar koning. Terwyl die tempel herstel word, vind die hoëpriester Hilkia \"die wetboek\" (waarskynlik Deuteronomium of 'n deel daarvan). Josia se reaksie is diepe berou en 'n volledige hervorming. Hy sterf in 609 v.C. by Megiddo in 'n geveg teen farao Nego van Egipte.","leer":"Een geslag se goedheid waarborg nie die volgende s'n nie. God se Woord, wanneer dit herontdek word, bring berou en hervorming. Josia se reaksie is die model: 'n sagte hart, nederigheid, trane, en dan doelgerigte optrede. Maar selfs 'n groot hervorming kan nie die gevolge van jare se sonde ongedaan maak nie – elke hart moet self verander.","skrif":"Manasse \"het baie gedoen wat verkeerd was in die oë van die Here\" (21:6). Hy het meer kwaad gedoen as die Amoriete (21:11). \"Hy het baie onskuldige bloed vergiet totdat hy Jerusalem... vol gemaak het\" (21:16). Josia word op agt jaar koning en \"het nie na regs of na links afgewyk nie\" (22:1–2). \"Ek het die wetboek in die huis van die Here gevind\" (22:8). Die koning skeur sy klere (22:11). \"Omdat jou hart week geword het en jy jou verootmoedig het voor die Here... het Ek ook gehoor\" (22:19). Die wet word voor die hele volk gelees en die verbond hernu (23:1–3). Josia vernietig die afgode, ook by Bet-el (23:4–20; vgl. 1 Konings 13:2). Die Pasga word gehou soos nooit tevore nie (23:21–23). \"Voor hom was daar geen koning soos hy nie, wat hom tot die Here bekeer het met sy hele hart\" (23:25).","bid":"Bid vir 'n \"sagte hart\" wat reageer wanneer God se Woord ons aanspreek. Bid dat elke kind 'n persoonlike geloof sal hê, ongeag die voorbeeld van ander. Bid vir herlewing deur God se Woord in ons land.","vraag":"Josia was net agt toe hy koning geword het, en 16 toe hy God begin soek het (2 Kronieke 34:3). Wat sê dit oor wat 'n jongmens vir God kan doen?","hoofstukke":[["2 Konings","2KI",21],["2 Konings","2KI",22],["2 Konings","2KI",23]]},{"dag":194,"ref":"Sefanja 1 – 3","titel":"Die Dag van die Here – en God wat oor Jou Jubel","fase":5,"tydlyn":"\"In die dae van Josia\" (1:1), c. 640–622 v.C., waarskynlik voor sy hervorming. Jerusalem.","agtergrond":"Sefanja was 'n afstammeling van koning Hiskia (1:1) en het waarskynlik toegang tot die koninklike hof gehad. Hy het gepreek in die tyd toe Manasse se afgodery nog oral sigbaar was. Sy boodskap oor \"die dag van die Here\" – 'n dag van oordeel oor Juda en die nasies – het moontlik bygedra tot Josia se hervorming. Hy kritiseer veral selfvoldane mense wat sê \"die Here doen niks, goed of kwaad nie\" (1:12). Die boek eindig met een van die teerste beskrywings van God se liefde in die Bybel.","leer":"God se oordeel is werklik, en selfvoldaanheid is gevaarlik. Die nederiges wat Hom soek, sal geborge wees. Ná die oordeel suiwer God 'n nederige oorblyfsel. En God is nie 'n koue regter nie: Hy is 'n Held wat red, wat Hom oor Sy kinders verheug en oor hulle jubel met gesang.","skrif":"\"Die groot dag van die Here is naby\" (1:14). \"Ek sal die manne straf wat... in hulle hart sê: Die Here doen geen goed en ook geen kwaad nie\" (1:12). \"Soek die Here, al julle ootmoediges van die land... soek geregtigheid, soek ootmoed\" (2:3). God oordeel die nasies (2:4–15). \"Dan sal Ek aan die volke rein lippe gee, sodat hulle almal die Naam van die Here kan aanroep\" (3:9). \"Ek sal in jou midde 'n ellendige en geringe volk laat oorbly, en hulle sal skuil by die Naam van die Here\" (3:12). \"Die Here jou God is in jou midde, 'n Held wat verlos; Hy sal oor jou bly wees met vreugde, Hy sal swyg in sy liefde, Hy sal oor jou juig met gejubel\" (3:17).","bid":"Bid teen selfvoldaanheid in ons geloof. Bid dat ons die Here, geregtigheid en nederigheid sal soek. Dank God dat Hy oor elkeen van ons \"jubel met gesang\" – lees Sefanja 3:17 oor elke kind.","vraag":"Sefanja 3:17 sê God jubel oor jou met gesang. Hoe verander dit die manier waarop jy jouself sien?","hoofstukke":[["Sefanja","ZEP",1],["Sefanja","ZEP",2],["Sefanja","ZEP",3]]},{"dag":195,"ref":"Nahum 1 – 3","titel":"Die Val van Nineve","fase":5,"tydlyn":"Tussen die val van Thebe (No-Amon) in Egipte in 663 v.C. (3:8) en die val van Nineve in 612 v.C. Die oordeel oor Assirië se hoofstad.","agtergrond":"Sowat 150 jaar ná Jona se preek het Nineve teruggekeer na sy wreedheid. Assirië het Israel vernietig (722 v.C.) en Juda verwoes (701 v.C.). Assiriese konings het in hulle inskripsies gespog oor hoe hulle gevangenes gemartel het. Nahum (\"trooster\") se boodskap was vir Juda 'n troos: die onderdrukker sal val. In 612 v.C. het die Babiloniërs en Mede Nineve verower en vernietig; die stad is nooit herbou nie, en eeue lank was selfs sy ligging vergete.","leer":"God is lankmoedig, maar Hy laat die skuldige nie ongestraf nie. Sy geduld met Nineve in Jona se tyd was nie goedkeuring van sonde nie. Vir dié wat in Hom skuil, is God 'n vesting in die dag van benoudheid. Geen wrede mag, hoe groot ook al, is buite Sy bereik nie.","skrif":"\"Die Here is 'n jaloerse God en 'n wreker\" (1:2). \"Die Here is lankmoedig en groot van krag, en Hy sal sekerlik nie ongestraf laat bly nie\" (1:3). \"Die Here is goed, 'n toevlug in die dag van benoudheid, en Hy ken die wat by Hom skuil\" (1:7). \"Kyk, op die berge die voete van hom wat goeie boodskap bring, wat vrede laat hoor\" (1:15). Die aanval op Nineve (2:1–13). \"Wee die bloedstad! Dit is heeltemal vol leuens en roof\" (3:1). \"Is jy beter as No-Amon?\" (3:8). \"Daar is geen verbinding vir jou wond nie\" (3:19).","bid":"Dank God dat Hy 'n vesting is vir dié wat in Hom skuil. Bid vir mense wat onder wrede regerings en onderdrukkers ly. Dank God dat geen kwaad buite Sy bereik is nie.","vraag":"Jona het gepreek dat God genadig is; Nahum dat God regverdig straf. Hoe pas die twee waarhede saam?","hoofstukke":[["Nahum","NAM",1],["Nahum","NAM",2],["Nahum","NAM",3]]},{"dag":196,"ref":"Habakuk 1 – 3","titel":"\"Die Regverdige sal deur sy Geloof Lewe\"","fase":5,"tydlyn":"c. 609–605 v.C., ná Josia se dood, terwyl die Babiloniërs (\"Chaldeërs\") opkom. Jerusalem.","agtergrond":"Habakuk is uniek: in plaas van God se woord aan die volk te bring, bring hy die volk se vrae na God. Hy kla oor die onreg in Juda, en God antwoord dat Hy die Babiloniërs as oordeel sal stuur. Dit maak Habakuk se probleem nog groter: hoe kan 'n heilige God 'n nog goddeloser volk gebruik? God se antwoord in 2:4 word drie keer in die Nuwe Testament aangehaal (Romeine 1:17; Galasiërs 3:11; Hebreërs 10:38) en was die vers wat Martin Luther se lewe verander het. Hoofstuk 3 is 'n gebed in die vorm van 'n psalm.","leer":"Ons mag ons eerlike vrae na God bring – en dan wag vir Sy antwoord. God se tydsberekening is nie ons s'n nie, maar Hy is nie laat nie. Die regverdige leef deur geloof (vertroue op God), nie deur wat hy sien nie. Ware geloof kan God loof selfs wanneer alles misluk.","skrif":"\"Hoe lank, Here, het ek al om hulp geroep, en U hoor nie?\" (1:2). God antwoord: \"Ek verwek die Chaldeërs\" (1:6). \"U oë is te rein om na die kwaad te kyk – waarom kyk U dan na die troueloses?\" (1:13). \"Ek wil op my wagpos gaan staan... om uit te kyk wat Hy met my sal spreek\" (2:1). \"Skryf die gesig op... want die gesig is nog vir die bestemde tyd... as dit vertoef, verwag dit, want dit sal sekerlik kom\" (2:2–3). \"Maar die regverdige sal deur sy geloof lewe\" (2:4). \"Want die aarde sal vol word van die kennis van die heerlikheid van die Here soos die waters die seebodem oordek\" (2:14). \"Here, laat u werk lewe in die loop van die jare... in die toorn dink aan ontferming\" (3:2). \"Al bloei die vyeboom nie, en is daar geen vrug aan die wingerdstok nie... nogtans sal ek my in die Here verbly, ek sal juig in die God van my heil. Die Here Here is my krag\" (3:17–19).","bid":"Bring elkeen se eerlike vrae oor die onreg in die wêreld na God. Bid vir geloof wat God vertrou al verstaan ons nie. Bid Habakuk 3:17–18 as gesin: \"Al gaan dinge sleg... nogtans sal ons ons in die Here verbly.\"","vraag":"Habakuk 3:17–18 sê \"al misluk alles, nogtans sal ek die Here loof\". Hoe lyk so 'n geloof in die praktyk?","hoofstukke":[["Habakuk","HAB",1],["Habakuk","HAB",2],["Habakuk","HAB",3]]},{"dag":197,"ref":"2 Konings 24 – 25","titel":"Die Val van Jerusalem","fase":5,"tydlyn":"609–561 v.C. Nebukadnesar van Babel verslaan Egipte by Karkemis (605 v.C.) en neem die eerste gevangenes weg (onder wie Daniël). Tweede wegvoering 597 v.C. (koning Jojagin, Esegiël en 10 000 ander). Jerusalem en die tempel word in 586 v.C. verwoes (sommige reken 587).","agtergrond":"Ná Josia se dood volg vier swak konings: Joahas (drie maande), Jojakim (wat Jeremia se boekrol verbrand het), Jojagin (drie maande) en Sedekia. Sedekia kom in opstand teen Babel ten spyte van Jeremia se waarskuwings. Ná 'n beleg van sowat 18 maande val Jerusalem; die tempel, die paleis en die stad word verbrand, die mure afgebreek, en die volk weggevoer. Gedalja word as goewerneur aangestel en dan vermoor. Die boek eindig met 'n flikkering van hoop: Jojagin word in 561 v.C. uit die tronk vrygelaat en eet aan die koning van Babel se tafel. Babiloniese kleitablette met rantsoenlyste noem \"Jaukin, koning van Juda\" en sy seuns – presies soos die Bybel vertel.","leer":"God se waarskuwings – deur Moses, die profete en eeue van geduld – het uiteindelik gebeur. Sonde het verwoestende gevolge, ook vir 'n hele volk. Maar selfs in die donkerste hoofstuk hou God Sy belofte aan Dawid lewendig: die lyn van Dawid oorleef in Babel – die lyn waaruit Jesus sou kom.","skrif":"\"Dit het... gebeur op bevel van die Here, om hulle van sy aangesig te verwyder weens die sondes van Manasse\" (24:3). Jojagin en 10 000 gevangenes word weggevoer (24:12–16). Sedekia kom in opstand (24:20). Die beleg en val van Jerusalem (25:1–7). Die tempel, die koningshuis en al die huise word verbrand (25:9). \"So is Juda uit sy land weggevoer\" (25:21). Gedalja word vermoor (25:25). Jojagin word vrygelaat en eet \"gedurigdeur\" aan die koning se tafel (25:27–30).","bid":"Bid vir ons land, dat ons na God se waarskuwings sal luister voordat dit te laat is. Dank God dat Hy Sy beloftes hou, selfs in oordeel. Bid vir vlugtelinge en mense wat hulle huise verloor het.","vraag":"Die boek Konings eindig met 'n klein teken van hoop (25:27–30). Waarom dink jy het die skrywer dit daar gesit?","hoofstukke":[["2 Konings","2KI",24],["2 Konings","2KI",25]]},{"dag":198,"ref":"Jeremia 1 – 3","titel":"Die Roeping van 'n Jong Profeet","fase":5,"inleiding":["Jeremia en Klaagliedere: Die Huilende Profeet","Jeremia het sowat 40 jaar lank gepreek (627 tot ná 586 v.C.) – van Josia se hervorming, deur die laaste vier konings, tot ná die val van Jerusalem. Hy was 'n priester uit Anatot, net noord van Jerusalem. Hy moes 'n ongewilde boodskap bring: oordeel is onvermydelik, onderwerp julle aan Babel. Hy is geslaan, in die blok gesit, in 'n put gegooi, gevange gehou en as verraaier beskou. Hy het ook gehuil oor sy volk, en hy is eerlik met God oor sy pyn. Maar Jeremia het ook die grootste belofte van die Ou Testament gebring: die nuwe verbond (31:31–34), wat Jesus by die Nagmaal ingestel het (Lukas 22:20).","Die boek is nie chronologi

 is groot en ons verstaan Hom nie ten volle nie. Sy mag in die natuur wys hoe klein ons is, maar ook hoe betroubaar Hy is. In die middel van lyding is die regte reaksie nie om God aan te kla nie, maar om Hom te vrees en te vertrou.","skrif":"God gee \"lofsange in die nag\" (35:10). God is groot en verwerp niemand nie (36:5). Hy gebruik verdrukking om mense se ore oop te maak (36:15). \"Kyk, God is verhewe, sodat ons Hom nie ken nie\" (36:26). Die donderstem van God (37:2–5). \"Staan stil en let op die wonders van God\" (37:14).","bid":"Loof God vir Sy grootheid in die natuur. Dank Hom vir die \"lofsange in die nag\" – Sy teenwoordigheid in moeilike tye. Bid vir nederigheid om te erken dat ons God nie ten volle verstaan nie, maar Hom kan vertrou.","vraag":"Wanneer laas het iets in die natuur jou laat stilstaan voor God se grootheid?","hoofstukke":[["Job","JOB",35],["Job","JOB",36],["Job","JOB",37]]},{"dag":34,"ref":"Job 38 – 39","titel":"Die Here Antwoord uit die Storm","fase":2,"tydlyn":"God praat self.","agtergrond":"Job wou God se antwoord hê – en nou praat God. Maar Hy verduidelik nie die rede vir Job se lyding nie (Job hoor nooit van die gesprek in hoofstuk 1–2 nie). Hy vra eerder 'n reeks vrae oor die skepping: die fondamente van die aarde, die see, die sterre, die weer en die wilde diere. Die diere wat genoem word (leeus, steenbokke, wildedonkies, volstruise, perde, valke) was dié wat buite menslike beheer leef.","leer":"God hoef Homself nie aan ons te verantwoord nie, maar Hy kom wel na ons toe. Die antwoord op lyding is nie altyd 'n verduideliking nie, maar 'n ontmoeting met God self. As God die hele skepping in stand hou en vir elke wilde dier sorg, kan ons Hom ook met ons lewe vertrou.","skrif":"\"Toe het die Here Job uit die storm geantwoord\" (38:1). \"Waar was jy toe Ek die aarde gegrond het?\" (38:4). Toe \"die môresterre saam gejubel het\" (38:7). God stel grense vir die see (38:8–11). \"Kan jy die bande van die Sewe-ster knoop?\" (38:31). God sorg vir die jong rawe en leeus (38:39–41). Die volstruis, die perd en die arend (39:13–30).","bid":"Loof God as Skepper wat alles in stand hou. Bid vir nederigheid wanneer ons dink ons weet beter as God. Bid dat, wanneer ons nie antwoorde kry nie, ons God self sal ontmoet.","vraag":"Waarom dink jy het God nie vir Job verduidelik waarom hy gely het nie?","hoofstukke":[["Job","JOB",38],["Job","JOB",39]]},{"dag":35,"ref":"Job 40 – 42","titel":"Job Sien God en Word Herstel","fase":2,"tydlyn":"Die slot van die boek.","agtergrond":"Die Behemot en Leviatan (hoofstuk 40–41) word verskillend verklaar: as groot diere (bv. seekoei en krokodil), of as poëtiese beelde van magte van chaos. Die punt is dat selfs dit wat vir die mens skrikwekkend en onbeheerbaar is, onder God se beheer is. Job se rykdom word verdubbel, behalwe sy kinders: hy kry weer sewe seuns en drie dogters – wat volgens sommige uitleggers aandui dat sy eerste kinders nie \"verlore\" is nie.","leer":"Wanneer ons God werklik sien, verander ons van aanklaers na aanbidders. God red Job en bestraf die vriende wat verkeerd van Hom gepraat het – en Job moet vir hulle bid. God het die laaste woord, en Hy is genadig. Jakobus 5:11 sê die einde van Job wys \"dat die Here baie barmhartig en medelydend is\".","skrif":"Job: \"Ek is te gering, wat sal ek U antwoord? Ek lê my hand op my mond\" (40:4). God: \"Wil jy... My veroordeel, sodat jy regverdig kan wees?\" (40:8). \"Ek weet dat U alles vermag\" (42:2). \"Op hoorsê het ek van U gehoor, maar nou het my oog U gesien\" (42:5). God sê die vriende het nie reg van Hom gespreek soos Job nie (42:7). Job bid vir sy vriende, en God draai sy lot om (42:10). Job se dogters kry 'n erfdeel saam met hul broers (42:15).","bid":"Bid dat ons God nie net \"op hoorsê\" sal ken nie, maar self sal sien wie Hy is. Bid vir mense wat ons seergemaak het (soos Job vir sy vriende). Dank God dat Hy barmhartig is en dat die laaste hoofstuk van ons storie in Sy hand is.","vraag":"Wat is die verskil tussen God \"op hoorsê\" ken en Hom self \"sien\"?","hoofstukke":[["Job","JOB",40],["Job","JOB",41],["Job","JOB",42]]},{"dag":36,"ref":"Exodus 1 – 2","titel":"Slawerny en die Geboorte van 'n Verlosser","fase":3,"tydlyn":"c. 1526 v.C. (Moses se geboorte volgens die vroeë datum) of c. 1350 v.C. (laat datum). Egipte, in die Nyldelta (Gosen).","agtergrond":"'n Nuwe farao \"wat Josef nie geken het nie\" sien die Hebreërs as 'n bedreiging. Egipte het slawe-arbeid gebruik vir groot bouprojekte; stene is van Nylmodder en strooi gemaak. Die bevel om seuntjies in die Nyl te gooi, is ironies: die Nyl is as 'n god aanbid. Moses se naam klink soos 'n Egiptiese woord vir \"seun\" (bv. in Ramses = \"seun van Ra\") en soos die Hebreeuse woord vir \"uittrek\" (2:10). Midian lê oos van die Golf van Akaba (Arabië).","leer":"God is aan die werk, selfs wanneer dit lyk of Hy stil is. Hy gebruik dapper, gewone mense – vroedvroue, 'n ma, 'n suster en selfs die farao se dogter – om Sy plan te bewaar. God hoor die gekerm van Sy volk en dink aan Sy verbond. Moses se poging om in eie krag te red, misluk: God se redding kom op God se manier.","skrif":"Hoe meer hulle verdruk is, hoe meer het hulle vermeerder (1:12). Die vroedvroue Sifra en Pua het God gevrees en nie die koning gehoorsaam nie (1:17). Moses in die mandjie (die Hebreeuse woord is dieselfde as \"ark\" by Noag) op die Nyl (2:3). Sy suster Mirjam en sy ma word deel van die plan (2:7–9). Moses slaan 'n Egiptenaar dood en vlug (2:11–15). \"God het hulle gekerm gehoor, en God het gedink aan sy verbond met Abraham, Isak en Jakob\" (2:24).","bid":"Bid vir Christene wat vandag verdruk en vervolg word. Bid dat ons, soos die vroedvroue, eerder God as mense sal gehoorsaam wanneer ons voor 'n keuse staan. Dank God dat Hy hoor, sien en onthou.","vraag":"Die vroedvroue het die koning ongehoorsaam geword om God te gehoorsaam. Wanneer is dit reg om nie te doen wat 'n gesagsfiguur sê nie?","hoofstukke":[["Exodus","EXO",1],["Exodus","EXO",2]]},{"dag":37,"ref":"Exodus 3 – 4","titel":"\"EK IS WAT EK IS\" – God Roep Moses","fase":3,"tydlyn":"Veertig jaar later (Handelinge 7:30), c. 1446 of c. 1270 v.C. Die berg Horeb (Sinai) in die woestyn.","agtergrond":"Moses was 80 jaar oud en 'n skaapwagter – 'n beroep wat die Egiptenare verag het. 'n Brandende bos wat nie verbrand nie, wys God se heilige teenwoordigheid. In die antieke wêreld was 'n naam meer as 'n etiket; dit het iemand se karakter uitgedruk. God se Naam, JHWH (in die Afrikaanse Bybel \"HERE\" of \"Here\"), hou verband met \"Ek is\". Jesus gebruik later dieselfde uitdrukking oor Homself: \"Voordat Abraham was, is Ek\" (Johannes 8:58).","leer":"God is heilig, ewig en Hy verander nie – Hy is wie Hy is. Hy roep onvolmaakte mense en rus hulle toe; ons swakheid is nie 'n hindernis vir Hom nie. Ons verskonings (\"wie is ek?\", \"ek kan nie praat nie\") word deur Sy belofte beantwoord: \"Ek sal met jou wees.\"","skrif":"Die braambos brand maar verteer nie (3:2). \"Trek jou skoene van jou voete af, want die plek waarop jy staan, is heilige grond\" (3:5). \"Ek het die ellende van my volk... gesien... en Ek het afgekom om hulle te verlos\" (3:7–8). \"Wie is ek dat ek na Farao sou gaan?\" – \"Ek sal met jou wees\" (3:11–12). \"EK IS WAT EK IS\" (3:14). Moses se kierie, melaatse hand en water wat bloed word (4:1–9). \"Wie het die mens 'n mond gegee?\" (4:11). Aäron as woordvoerder (4:14–16). Die volk glo en aanbid (4:31).","bid":"Loof God as die \"Ek is\" – die ewige, onveranderlike God. Bid dat ons nie verskonings sal maak wanneer God ons roep om iets vir Hom te doen nie. Bid vir elkeen se eie \"braambos-oomblik\" – 'n persoonlike ontmoeting met God.","vraag":"Watter verskoning sou jy waarskynlik gebruik as God jou roep om iets moeiliks te doen? Wat antwoord God daarop?","hoofstukke":[["Exodus","EXO",3],["Exodus","EXO",4]]},{"dag":38,"ref":"Exodus 5 – 7","titel":"Farao se Harde Hart en die Eerste Plaag","fase":3,"tydlyn":"c. 1446 of c. 1270 v.C. Die hof van die farao in Egipte.","agtergrond":"Die farao is in Egipte as 'n god op aarde beskou, die seun van die songod Ra. Daarom is sy vraag \"Wie is die Here?\" (5:2) 'n uitdaging tussen gode. Die tien plae was oordele \"oor al die gode van Egipte\" (12:12): die Nyl (bron van lewe, aanbid as Hapi), paddas (gekoppel aan die godin Heket), vee, die son (Ra) ensovoorts. Die towenaars van Egipte kon aanvanklik sommige tekens namaak. Die geslagsregister in 6:14–27 plaas Moses en Aäron in die stam van Levi.","leer":"Wanneer ons God gehoorsaam, kan dinge eers slegter word voordat dit beter word – dit beteken nie dat God nie werk nie. God se Naam en beloftes is die fondament van ons hoop. Hy sal bewys dat Hy alleen die Here is. Wie sy hart teen God verhard, word deur God in daardie verharding oorgegee.","skrif":"Farao: \"Wie is die Here, dat ek na sy stem sou luister?\" (5:2). Die slawe moet nou self strooi soek (5:7). Moses kla: \"Here, waarom het U so sleg met hierdie volk gehandel?\" (5:22). God se sewe \"Ek sal\"-beloftes: uitlei, red, verlos, aanneem as volk, julle God wees, in die land bring (6:6–8). Aäron se kierie verslind die towenaars s'n (7:12). Die Nyl word bloed (7:20). Farao se hart was verhard (7:13, 22).","bid":"Bid vir volharding wanneer om reg te doen eers swaarder maak. Bid dat ons harte sag sal bly vir God se stem. Dank God vir Sy \"Ek sal\"-beloftes, wat vervul is in Jesus.","vraag":"Moses het gekla toe dinge slegter geword het. Was dit verkeerd om so eerlik met God te wees?","hoofstukke":[["Exodus","EXO",5],["Exodus","EXO",6],["Exodus","EXO",7]]},{"dag":39,"ref":"Exodus 8 – 10","titel":"God se Oordeel oor die Gode van Egipte","fase":3,"tydlyn":"c. 1446 of c. 1270 v.C. Egipte, oor 'n tydperk van maande.","agtergrond":"Elke plaag tref iets wat Egiptenare as heilig of beskermend beskou het – die vee (gode soos Apis, die bul), die gesondheid (Sekhmet), die oeste en uiteindelik die son (Ra), die hoofgod. Vanaf die vierde plaag maak God 'n onderskeid tussen Egipte en Israel in Gosen. Die Bybel sê soms dat Farao sy hart verhard, en soms dat God dit verhard: God het hom oorgegee aan die keuse wat hy telkens self gemaak het (vgl. Romeine 9:17–18).","leer":"Daar is net een ware God, en Hy beskerm Sy volk. Uitstel van gehoorsaamheid is gevaarlik: Farao belowe herhaaldelik om die volk te laat gaan, en verander dan van plan sodra die druk af is. Halwe gehoorsaamheid (laat die mans gaan, maar hou die kinders en vee) is nie gehoorsaamheid nie.","skrif":"Die paddas (8:1–15). Die towenaars erken by die muggies: \"Dit is die vinger van God\" (8:19). God maak 'n onderskeid vir Gosen (8:22–23). Die pes op die vee (9:1–7), swere (9:8–12), hael (9:13–35). \"Om jou my krag te laat sien en my Naam te laat verkondig op die hele aarde\" (9:16). Farao se kompromieë: offer in die land (8:25), gaan nie ver nie (8:28), net die mans (10:11), los die vee (10:24). Die sprinkane en duisternis, maar lig vir Israel (10:21–23).","bid":"Bid dat ons gehoorsaamheid volledig en dadelik sal wees, nie net wanneer ons in die moeilikheid is nie. Dank God dat Hy Sy kinders beskerm en lig gee in die donker. Bid vir mense wat net na God draai as dinge sleg gaan.","vraag":"Watter van Farao se \"kompromieë\" klink soos die maniere waarop ons soms halfpad gehoorsaam?","hoofstukke":[["Exodus","EXO",8],["Exodus","EXO",9],["Exodus","EXO",10]]},{"dag":40,"ref":"Exodus 11 – 12","titel":"Die Pasga: Beskut deur die Bloed van die Lam","fase":3,"tydlyn":"Die nag van die uittog, die 14de van die maand Abib (later Nisan) – Maart/April, c. 1446 of c. 1270 v.C.","agtergrond":"Die tiende plaag tref die eersgeborenes, insluitend die farao se seun – wat as toekomstige god-koning beskou is. Dit is ook regverdige vergelding vir die moord op Israel se seuntjies (1:22) en omdat Israel God se \"eersgeborene\" is (4:22–23). God stel die Pasga (Paasfees) in: 'n lam sonder gebrek moet geslag word en sy bloed aan die deurposte gesmeer word. Die ongesuurde brood herinner aan die haastige vertrek. Die maand word die begin van Israel se jaar – hul verlossing word die nuwe begin.","leer":"God se oordeel oor sonde is werklik, maar Hy voorsien 'n plaasvervanger. Wie onder die bloed van die lam skuil, is veilig. Dit wys direk na Jesus, \"die Lam van God wat die sonde van die wêreld wegneem\" (Johannes 1:29), wat tydens die Paasfees gekruisig is. Verlossing is 'n gawe wat ons in geloof ontvang, nie iets wat ons verdien nie.","skrif":"\"Die lam moet sonder gebrek wees\" (12:5). Die bloed aan die deurposte (12:7). \"As Ek die bloed sien, sal Ek by julle verbygaan\" (12:13). Eet dit haastig, klaar om te vertrek (12:11). Die fees moet elke jaar herdenk word en vir die kinders verduidelik word (12:26–27). Geen been van die lam mag gebreek word nie (12:46; vervul in Johannes 19:36). Israel trek uit na 430 jaar (12:40–41), saam met 'n \"gemengde menigte\" (12:38).","bid":"Dank Jesus, ons Paaslam, dat Sy bloed ons beskerm teen God se oordeel. Bid dat elkeen van ons persoonlik onder Sy bloed sal skuil. Dank God dat Hy beveel het dat ouers hulle kinders hierdie verhaal moet vertel – en bid dat ons gesin dit sal oordra.","vraag":"Wat het 'n Israeliet nodig gehad om veilig te wees in daardie nag? Hoe lyk dit vir ons vandag?","hoofstukke":[["Exodus","EXO",11],["Exodus","EXO",12]]},{"dag":41,"ref":"Exodus 13 – 15","titel":"Deur die See: God Veg vir Sy Volk","fase":3,"tydlyn":"c. 1446 of c. 1270 v.C. Van Sukkot na die \"Rietsee\" (Hebreeus Yam Suf; die presiese ligging word bespreek) en die woestyn Sur.","agtergrond":"God lei Israel nie langs die kortste roete langs die kus (die \"pad van die Filistyne\", met Egiptiese vestings) nie, maar deur die woestyn. Die wolkkolom en vuurkolom wys God se teenwoordigheid. Die waens van Egipte was die gevreesde militêre tegnologie van die tyd. Moses neem Josef se beendere saam (13:19), soos belowe. Die lied in hoofstuk 15 is een van die oudste gedigte in die Bybel.","leer":"Wanneer ons vasgekeer voel, kan God 'n weg maak waar daar geen weg is nie. Ons taak is om stil te staan, op Hom te vertrou en vorentoe te gaan. Ware verlossing lei tot lofprysing. Maar net drie dae later word die volk se vertroue weer getoets – geloof moet elke dag geoefen word.","skrif":"Die wolkkolom bedags en vuurkolom snags (13:21–22). Die volk is doodbang (14:10–12). \"Wees nie bevrees nie; staan vas en aanskou die verlossing van die Here... Die Here sal vir julle veg, en julle moet stilbly\" (14:13–14). \"Spreek met die kinders van Israel dat hulle vorentoe trek\" (14:15). Die water vorm 'n muur aan hul regter- en linkerkant (14:22). \"Die Here is my sterkte en psalm, en Hy het my tot heil geword\" (15:2). Mirjam lei die vroue in lof (15:20–21). By Mara word die bitter water soet (15:22–25). \"Ek is die Here wat jou gesond maak\" (15:26).","bid":"Bring elke situasie waar ons \"vasgekeer\" voel na God. Bid vir geloof om stil te staan en Hom te vertrou, en die moed om vorentoe te gaan. Loof God soos Moses en Mirjam vir Sy verlossing.","vraag":"Watter \"Rietsee\" staan op die oomblik voor jou, en hoe kan jy God daarin vertrou?","hoofstukke":[["Exodus","EXO",13],["Exodus","EXO",14],["Exodus","EXO",15]]},{"dag":42,"ref":"Exodus 16 – 18","titel":"Manna, Water uit die Rots en Goeie Leierskap","fase":3,"tydlyn":"Die tweede maand ná die uittog. Die woestyn Sin en Refidim, op pad na Sinai.","agtergrond":"Manna (\"Wat is dit?\") was 'n wonderwerk-voedsel wat elke oggend verskyn het en net vir een dag gehou het, behalwe op die sabbat. Die Amalekiete was 'n nomadiese volk wat Israel van agter aangeval het, juis die swakkes (Deuteronomium 25:17–18). Jetro, Moses se skoonvader, was 'n priester van Midian. Sy raad oor die verdeling van leierskap is wysheid wat God ook deur \"buitestaanders\" gee.","leer":"God voorsien daagliks – nie alles op een slag nie – sodat ons elke dag op Hom vertrou. Kla wys 'n hart wat God se goedheid vergeet. In stryd is gebed (Moses se hande omhoog) en gemeenskap (Aäron en Hur wat sy hande ondersteun) noodsaaklik. Goeie leiers deel verantwoordelikheid en luister na raad.","skrif":"Die volk murmureer en verlang terug na Egipte (16:3). \"Ek gaan vir julle brood uit die hemel laat reën\" (16:4). Elkeen het genoeg – nie te veel of te min nie (16:18). Die sabbatrus (16:23–30). Jesus noem Homself later \"die brood van die lewe\" (Johannes 6:35). Water uit die rots (17:6; vgl. 1 Korintiërs 10:4). Moses se hande omhoog, Aäron en Hur ondersteun hom (17:11–12). \"Die Here is my banier\" (17:15). Jetro: \"Wat jy doen, is nie goed nie... jy kan dit nie alleen doen nie\" (18:17–18).","bid":"Dank God vir ons \"daaglikse brood\" – kos, klere, 'n huis. Bid dat ons nie sal kla nie, maar dankbaar sal wees. Bid dat ons as gesin mekaar se \"hande sal ondersteun\" in moeilike tye.","vraag":"Waarom dink jy het God die manna net vir een dag op 'n slag gegee?","hoofstukke":[["Exodus","EXO",16],["Exodus","EXO",17],["Exodus","EXO",18]]},{"dag":43,"ref":"Exodus 19 – 20","titel":"Die Verbond by Sinai en die Tien Gebooie","fase":3,"tydlyn":"Die derde maand ná die uittog. By die berg Sinai, waar Israel sowat 'n jaar bly.","agtergrond":"Die verbond by Sinai lyk soos destydse verdrae tussen 'n groot koning en 'n vasalvolk: dit begin met wie die koning is en wat hy vir die volk gedoen het, en volg met die verpligtinge. Let op die volgorde: God red Israel eers (20:2), en gee dan die gebooie. Die wet was nie die manier om gered te word nie, maar die manier om te leef as 'n verloste volk. Die donder, weerlig en rook wys God se heiligheid en majesteit.","leer":"Gehoorsaamheid is ons antwoord op God se genade, nie die prys daarvoor nie. Die Tien Gebooie wys hoe ons God liefhet (gebooie 1–4) en ons naaste liefhet (gebooie 5–10), soos Jesus dit opsom (Markus 12:29–31). Israel is geroep om 'n koninkryk van priesters te wees – en Petrus pas dit op die kerk toe (1 Petrus 2:9).","skrif":"\"Ek het julle op arendsvleuels gedra en julle na My gebring\" (19:4). \"'n Koninkryk van priesters en 'n heilige nasie\" (19:6). Die volk sê: \"Alles wat die Here gespreek het, sal ons doen\" (19:8). \"Ek is die Here jou God wat jou uit Egipteland, uit die slawehuis, uitgelei het\" (20:2). Die Tien Gebooie (20:3–17). Die volk staan op 'n afstand en is bang (20:18–19). \"Die vrees vir Hom moet voor julle oë wees, sodat julle nie sondig nie\" (20:20).","bid":"Dank God dat Hy ons eers gered het en ons nou leer hoe om te leef. Gaan saam deur die Tien Gebooie en vra die Here om ons te wys waar ons Hom en ander nie liefhet nie. Bid vir harte wat Sy gebooie as goed en waardevol sien.","vraag":"Watter van die Tien Gebooie dink jy is vandag die moeilikste vir tieners om te hou? Waarom?","hoofstukke":[["Exodus","EXO",19],["Exodus","EXO",20]]},{"dag":44,"ref":"Exodus 21 – 23","titel":"God se Wette vir die Daaglikse Lewe","fase":3,"tydlyn":"By Sinai, c. 1446 of c. 1270 v.C.","agtergrond":"Hierdie gedeelte word \"die verbondsboek\" genoem (24:7). Ander antieke wetboeke bestaan ook, soos die Wetboek van Hammurabi (c. 1750 v.C.), maar Israel se wette verskil: menselewe word hoër geag as eiendom, en daar is besondere sorg vir die swakkes – slawe, vreemdelinge, weduwees en wese. Die beginsel \"oog vir oog\" was nie 'n opdrag tot persoonlike wraak nie, maar 'n reël vir regters sodat straf eweredig sou wees en nie oordrewe nie. Slawerny in Israel was meestal tydelike skuldslawerny, met beperkings en vrylating na ses jaar (21:2).","leer":"God gee om oor alle dele van die lewe – werk, eiendom, beserings, regspraak en hoe ons die swakkes behandel. Geregtigheid moet regverdig en eerlik wees, sonder om partydig te wees teenoor ryk of arm. Om God lief te hê, word gesien in hoe ons ander behandel, ook die vreemdeling.","skrif":"Vrylating van slawe ná ses jaar (21:2). \"Oog vir oog, tand vir tand\" as reël vir eweredige straf (21:23–25). Verantwoordelikheid vir skade (21:33–22:15). \"'n Vreemdeling mag jy nie verdruk nie, want julle was vreemdelinge in Egipteland\" (22:21). Weduwees en wese (22:22–24). Geen valse gerugte of partydigheid nie (23:1–3). Help selfs jou vyand se dier (23:4–5). Die drie jaarlikse feeste (23:14–17). God stuur 'n Engel voor hulle uit (23:20).","bid":"Bid vir regverdigheid in ons land: eerlike howe, polisie en leiers. Bid dat ons die swakkes en vreemdelinge in ons omgewing raaksien. Bid dat ons nie stories sal versprei wat nie waar is nie.","vraag":"Waarom dink jy gee God so baie wette oor hoe om die swakkes te behandel?","hoofstukke":[["Exodus","EXO",21],["Exodus","EXO",22],["Exodus","EXO",23]]},{"dag":45,"ref":"Exodus 24 – 27","titel":"Die Verbondsbloed en die Plan vir God se Woonplek","fase":3,"tydlyn":"By Sinai. Moses is 40 dae en 40 nagte op die berg (24:18).","agtergrond":"Die verbond word met bloed bevestig – 'n plegtige teken van lewe en dood. Die tabernakel was 'n draagbare tent-heiligdom, ontwerp om tussen die volk te staan terwyl hulle trek. Dit was opgedeel in die voorhof (met die altaar en wasbak), die Heilige (met die kandelaar, tafel van die toonbrode en reukaltaar) en die Allerheiligste (met die verbondsark). Elke detail was deur God self voorgeskryf – dit was \"'n afbeelding en skaduwee van die hemelse dinge\" (Hebreërs 8:5).","leer":"God se grootste begeerte is om tussen Sy volk te woon (25:8). Maar Hy is heilig, en daarom kan Hy net op Sy voorwaardes genader word. Die tabernakel wys vorentoe na Jesus, wat \"onder ons gewoon het\" (Johannes 1:14 – letterlik \"getabernakel\" het), en na die kerk, wat nou God se tempel is.","skrif":"Die volk belowe weer om alles te doen (24:3, 7). \"Kyk, dit is die bloed van die verbond\" (24:8; vgl. Jesus in Markus 14:24). Die oudstes sien God en eet en drink (24:9–11). \"Hulle moet vir My 'n heiligdom maak, dat Ek in hul midde kan woon\" (25:8). Die ark met die versoendeksel (genadetroon) en gerubs (25:17–22). Die tafel en die kandelaar (25:23–40). Die voorhangsel tussen die Heilige en die Allerheiligste (26:31–33; vgl. Markus 15:38). Die brandofferaltaar (27:1–8).","bid":"Dank God dat Hy, die Heilige, by mense wil woon – en dat Hy deur Jesus en die Heilige Gees by ons woon. Bid dat ons huis 'n plek sal wees waar God tuis is. Bid dat ons Hom met eerbied sal nader.","vraag":"Waarom dink jy het God so presies gesê hoe die tabernakel moes lyk?","hoofstukke":[["Exodus","EXO",24],["Exodus","EXO",25],["Exodus","EXO",26],["Exodus","EXO",27]]},{"dag":46,"ref":"Exodus 28 – 31","titel":"Die Priesters en die Gawe van die Gees","fase":3,"tydlyn":"By Sinai.","agtergrond":"Die hoëpriester het die volk voor God verteenwoordig. Op sy skouers en op sy borsstuk was die name van die twaalf stamme gegraveer – hy het die volk letterlik op sy hart en skouers voor God gedra. Die Urim en Tummim was voorwerpe wat gebruik is om God se wil te bepaal. Op sy tulband was 'n goue plaat met \"Heilig aan die Here\". Die reukaltaar se rook word in die Bybel met gebed verbind (Psalm 141:2; Openbaring 8:3–4).","leer":"Ons het 'n middelaar nodig om voor 'n heilige God te staan. Jesus is ons volmaakte Hoëpriester, wat ons op Sy hart dra en vir ons intree (Hebreërs 4:14–16). God gee ook Sy Gees aan mense om met hul talente – selfs kreatiewe en praktiese vaardighede – Hom te dien. Die sabbat is 'n teken van die verhouding tussen God en Sy volk.","skrif":"Die name van die stamme op Aäron se skouers en hart (28:12, 29). \"Heilig aan die Here\" (28:36). Die inwyding van die priesters met offers en bloed (29:1–37). \"Ek sal woon onder die kinders van Israel en vir hulle 'n God wees\" (29:45). Die reukaltaar (30:1–10). Besaleël is \"vervul met die Gees van God, met wysheid en verstand en kennis en met allerhande kunsvaardigheid\" (31:3). Die sabbat as 'n ewige teken (31:13–17).","bid":"Dank Jesus as ons Hoëpriester wat ons op Sy hart dra. Bid vir elkeen se gawes – musiek, kuns, sport, denke, hande – dat ons dit vir God sal gebruik. Bid dat ons gebede soos reukwerk voor Hom sal opstyg.","vraag":"Watter talent of vaardigheid het God vir jou gegee wat jy vir Hom kan gebruik, soos Besaleël?","hoofstukke":[["Exodus","EXO",28],["Exodus","EXO",29],["Exodus","EXO",30],["Exodus","EXO",31]]},{"dag":47,"ref":"Exodus 32 – 34","titel":"Die Goue Kalf en God se Genade","fase":3,"tydlyn":"By Sinai, terwyl Moses op die berg is.","agtergrond":"Die goue kalf was waarskynlik nie bedoel as 'n \"ander god\" nie, maar as 'n beeld van die Here self (\"dit is jou gode... wat jou uitgelei het\", 32:4) – dalk soos die bulgode van Egipte. Dit oortree die tweede gebod. Binne weke ná die verbond het die volk dit verbreek. Moses se voorbidding, en God se openbaring van Sy Naam in 34:6–7, is een van die belangrikste gedeeltes in die Ou Testament – dit word baie keer in die res van die Bybel aangehaal.","leer":"Afgodery is om God te vervang of te herskep na ons eie smaak. Sonde breek die verhouding met God. Maar God is barmhartig en genadig: Hy luister na voorbidding en vernuwe die verbond. Sy teenwoordigheid is die belangrikste ding wat ons as volk het – sonder Hom is daar geen sin om voort te gaan nie.","skrif":"\"Kom, maak vir ons gode wat voor ons uit sal gaan\" (32:1). Aäron se swak verskoning: \"en daar het hierdie kalf uitgekom\" (32:24). Moses pleit vir die volk (32:11–14) en is selfs bereid om uit God se boek uitgedelg te word (32:32). \"As u Aangesig nie saamgaan nie, laat ons dan nie hiervandaan optrek nie\" (33:15). \"Laat my tog u heerlikheid sien\" (33:18). God se Naam: \"Here, Here, God, barmhartig en genadig, lankmoedig en groot van goedertierenheid en trou\" (34:6–7). Moses se gesig straal (34:29).","bid":"Vra God om ons te wys watter \"goue kalwers\" ons in ons harte gebou het. Bely sonde en dank God dat Hy barmhartig en genadig is. Bid soos Moses: \"Here, gaan saam met ons gesin – ons wil nie sonder U gaan nie.\"","vraag":"Aäron het gesê die kalf het \"net uitgekom\". Hoe probeer ons soms ons sonde so verduidelik?","hoofstukke":[["Exodus","EXO",32],["Exodus","EXO",33],["Exodus","EXO",34]]},{"dag":48,"ref":"Exodus 35 – 40","titel":"Die Tabernakel word Gebou en die Heerlikheid Kom","fase":3,"tydlyn":"By Sinai. Die tabernakel word opgerig op die eerste dag van die tweede jaar ná die uittog (40:17).","agtergrond":"Hierdie hoofstukke herhaal grootliks die opdragte van hoofstuk 25–31, maar nou as uitvoering: \"soos die Here Moses beveel het\" kom meer as tien keer voor. Die herhaling beklemtoon volledige gehoorsaamheid. Die materiaal (goud, silwer, materiaal) was waarskynlik grootliks wat die Egiptenare aan die Israeliete gegee het met hulle vertrek (12:35–36). (Dit is ses hoofstukke – lees gerus die beskrywings van die toerusting vinniger.)","leer":"God se werk word gedoen deur bereidwillige harte wat gee, en deur gehoorsaamheid aan Sy Woord tot in die detail. Wanneer God se volk doen wat Hy sê, kom Sy heerlikheid en woon Hy tussen hulle. Die verhaal wat in Exodus 1 begin met slawe wat vir Farao bou, eindig met 'n vry volk wat vir God bou.","skrif":"\"Elkeen wat gewillig was van hart, moet dit bring\" (35:5). Die mans en vroue bring hul gawes (35:21–29). Die volk bring te veel; hulle moet gekeer word (36:5–7). Die bou van die ark, tafel, kandelaar en altare (37–38). Alles is gedoen soos die Here beveel het (39:42–43). \"Toe het die wolk die tent van samekoms oordek, en die heerlikheid van die Here het die tabernakel vervul\" (40:34). Die wolk lei hulle op al hul togte (40:36–38).","bid":"Bid vir harte wat bereidwillig gee – tyd, talente en geld – vir God se werk. Bid vir gehoorsaamheid in die klein dinge. Dank God dat Sy heerlikheid nou deur die Heilige Gees in elke gelowige woon (1 Korintiërs 6:19).","vraag":"Die volk het so gewillig gegee dat hulle gekeer moes word. Wat maak 'n mens gewillig om vir God te gee?","hoofstukke":[["Exodus","EXO",35],["Exodus","EXO",36],["Exodus","EXO",37],["Exodus","EXO",38],["Exodus","EXO",39],["Exodus","EXO",40]]},{"dag":49,"ref":"Levitikus 1 – 4","titel":"Die Offers: Die Weg na God","fase":3,"tydlyn":"By Sinai, in die eerste maand van die tweede jaar. God praat met Moses uit die tent van samekoms (1:1).","agtergrond":"Levitikus is die \"handboek\" van die priesters (uit die stam van Levi). Offers was algemeen in die antieke wêreld, maar die meeste volke het gedink hulle voed of omkoop die gode. Israel se offers was anders: God het self die weg voorsien sodat sondige mense by Hom kon kom. Die brandoffer (hoofstuk 1) is heeltemal verbrand – totale toewyding. Die spysoffer (2) was 'n dankgawe. Die dankoffer of vredeoffer (3) is deels deur die offeraar geëet – 'n maaltyd van gemeenskap met God. Die sondoffer (4) het onopsetlike sonde versoen. Die offeraar moes sy hand op die dier se kop lê – 'n teken van identifikasie en plaasvervanging.","leer":"Sonde kos lewe, en versoening vereis bloed (17:11; Hebreërs 9:22). God het in Sy genade 'n plaasvervanger voorsien. Al hierdie offers wys na Jesus, wat Homself een keer vir altyd geoffer het (Hebreërs 10:10–14). Toewyding, dankbaarheid en gemeenskap met God is ook deel van aanbidding.","skrif":"\"Hy moet sy hand op die kop van die brandoffer lê, en dit sal hom welgevallig wees om vir hom versoening te doen\" (1:4). 'n Lieflike geur vir die Here (1:9). Die arme kon duiwe offer (1:14; vgl. Maria en Josef in Lukas 2:24). Sout by elke spysoffer – 'n teken van die verbond (2:13). Die vredeoffer (3:1–17). Sondoffers vir onopsetlike sonde – vir die priester, die volk, die leier en die gewone mens (4:1–35).","bid":"Dank Jesus dat Hy die volmaakte offer is en dat ons nie meer diere hoef te offer nie. Bid dat ons ons lewe as \"'n lewende offer\" aan God sal gee (Romeine 12:1). Bely ook die sondes wat ons nie eers raakgesien het nie.","vraag":"Waarom moes die persoon sy hand op die kop van die dier lê? Wat beeld dit uit oor Jesus?","hoofstukke":[["Levitikus","LEV",1],["Levitikus","LEV",2],["Levitikus","LEV",3],["Levitikus","LEV",4]]},{"dag":50,"ref":"Levitikus 5 – 7","titel":"Skuld, Vergoeding en Heiligheid","fase":3,"tydlyn":"By Sinai.","agtergrond":"Die skuldoffer (hoofstuk 5–6) het gehandel oor sondes wat skade aan God of ander veroorsaak het; dit het vergoeding plus 'n vyfde (20%) ekstra vereis. Hoofstuk 6–7 gee die priesters se instruksies vir elke soort offer. Die vuur op die altaar moes nooit uitgaan nie (6:13). Vet en bloed mag nie geëet word nie – die bloed verteenwoordig die lewe, wat aan God behoort.","leer":"Ware berou sluit in dat ons, waar moontlik, regmaak wat ons verkeerd gedoen het – nie net jammer sê nie. Sonde teen ander is ook sonde teen God. Ons toewyding aan God moet aanhoudend wees, soos die vuur wat nie mag uitgaan nie.","skrif":"Wie sondig deur nie te getuig wanneer hy iets weet nie, is skuldig (5:1). Bely die sonde (5:5). Die arme kon meel offer (5:11). Vergoed wat gesteel is plus 'n vyfde (6:4–5; vgl. Saggeus in Lukas 19:8). \"Die vuur moet altyd op die altaar brand; dit mag nie uitgaan nie\" (6:13). Die vredeoffer as dankoffer, gelofte of vrywillige offer (7:11–16). Geen bloed eet nie (7:26–27).","bid":"Vra die Here om ons te wys of daar iets is wat ons moet regmaak teenoor iemand. Bid vir moed om dit te doen. Bid dat die vuur van ons liefde vir God nie sal uitgaan nie.","vraag":"Is \"jammer\" sê genoeg as jy iemand se ding gebreek of gesteel het? Wat sê hierdie gedeelte?","hoofstukke":[["Levitikus","LEV",5],["Levitikus","LEV",6],["Levitikus","LEV",7]]},{"dag":51,"ref":"Levitikus 8 – 10","titel":"Die Priesters word Ingewy – en Vreemde Vuur","fase":3,"tydlyn":"By Sinai. Die eerste week ná die oprigting van die tabernakel.","agtergrond":"Aäron en sy seuns word sewe dae lank ingewy met was, klere, salfolie en offers. Bloed word aan hulle regteroor, regterduim en regtergrootoon gesmeer – 'n teken dat hulle hele lewe (wat hulle hoor, doen en waarheen hulle gaan) aan God gewy is. Op die agtste dag begin die priesters se diens, en God se vuur verteer die offer. Nadab en Abihu (Aäron se oudste seuns) bring \"vreemde vuur\" – vuur wat God nie beveel het nie. Die gebod direk daarna (10:9) oor wyn suggereer dat dronkenskap 'n rol kon gespeel het.","leer":"God moet aanbid word op Sy manier, met eerbied – nie volgens ons eie idees van wat goed genoeg is nie. Leierskap in God se huis is 'n heilige verantwoordelikheid. God is heilig, en \"aan dié wat naby My is, sal Ek My as die Heilige laat ken\" (10:3).","skrif":"Die inwyding met bloed aan oor, duim en toon (8:23–24). Die heerlikheid van die Here verskyn aan die hele volk, en vuur verteer die offer; die volk jubel en buig (9:23–24). Nadab en Abihu bring vreemde vuur en sterf (10:1–2). \"Aan dié wat naby My is, sal Ek My as die Heilige laat ken, en voor die aangesig van die hele volk sal Ek verheerlik word. En Aäron het geswyg\" (10:3). Geen wyn of sterk drank vir priesters in diens nie (10:9). Die priesters moet onderskei tussen heilig en onheilig, rein en onrein, en die volk leer (10:10–11).","bid":"Bid dat ons God met eerbied en opregtheid sal aanbid, nie net op ons eie manier nie. Bid vir leiers in die kerk. Bid dat ons hele lewe – ore, hande en voete – aan God gewy sal wees.","vraag":"Wat dink jy is \"vreemde vuur\" in die manier waarop mense vandag God probeer aanbid?","hoofstukke":[["Levitikus","LEV",8],["Levitikus","LEV",9],["Levitikus","LEV",10]]},{"dag":52,"ref":"Levitikus 11 – 13","titel":"Rein en Onrein","fase":3,"tydlyn":"By Sinai.","agtergrond":"Die reëls oor rein en onrein diere, geboorte en velsiektes klink vir ons vreemd. \"Onrein\" beteken nie altyd \"sondig\" nie, maar ongeskik om in die heilige teenwoordigheid van God te kom. Sommige reëls het gesondheidsvoordele gehad, maar die hoofrede word in 11:44–45 gegee: Israel moet heilig (afgesonder) wees omdat God heilig is. Die reëls het Israel ook van die omliggende volke onderskei. Die \"melaatsheid\" in hoofstuk 13 sluit verskeie velsiektes in, nie net wat vandag melaatsheid genoem word nie. Jesus verklaar later alle voedsel rein (Markus 7:19), en God wys Petrus dat ook nie-Jode nie onrein is nie (Handelinge 10).","leer":"God is heilig, en Hy roep Sy volk om anders te wees as die wêreld – in elke deel van die lewe, selfs wat ons eet. Die wette oor onreinheid wys dat ons nie self rein kan word nie. Jesus het melaatses aangeraak en hulle rein gemaak (Markus 1:41) – Sy reinheid is \"aansteekliker\" as ons onreinheid.","skrif":"Rein en onrein diere (11:1–47). \"Want Ek is die Here julle God; daarom moet julle julle heilig en heilig wees, want Ek is heilig\" (11:44; aangehaal in 1 Petrus 1:16). Om te onderskei tussen onrein en rein (11:47). Reiniging ná geboorte (12:1–8). Die melaatse moet buite die laer woon en roep: \"Onrein, onrein!\" (13:45–46).","bid":"Bid dat ons as gesin \"heilig\" sal wees – anders as die wêreld in ons gesprekke, keuses en wat ons kyk. Dank Jesus dat Hy die onreines aanraak en rein maak. Bid vir mense wat uitgesluit voel, dat ons hulle sal insluit soos Jesus.","vraag":"Op watter maniere behoort 'n Christen-tiener \"anders\" te wees as die wêreld rondom hom of haar?","hoofstukke":[["Levitikus","LEV",11],["Levitikus","LEV",12],["Levitikus","LEV",13]]},{"dag":53,"ref":"Levitikus 14 – 15","titel":"Reiniging en Herstel","fase":3,"tydlyn":"By Sinai.","agtergrond":"Hoofstuk 14 beskryf die seremonie vir iemand wat van 'n velsiekte genees is: twee voëls, waarvan een geslag word en die ander, in die bloed gedoop, vrygelaat word. Die genese persoon word weer by die gemeenskap ingesluit. Hoofstuk 15 handel oor liggaamlike uitskeidings – normale en abnormale. Dit wys dat die hele lewe, ook liggaamsfunksies, onder God se oog is. (Verduidelik ouderdomsgepas; die doel is nie om liggame as vuil te sien nie, maar om God se heiligheid te verstaan.)","leer":"God se doel is herstel en insluiting, nie net uitsluiting nie. Die voël wat vrygelaat word, wys hoe ons deur die bloed van 'n ander vrygemaak word. Jesus het die genese melaatse beveel om homself aan die priester te wys volgens hierdie wet (Markus 1:44) – Hy het die wet vervul. Die vrou met die bloedvloeiing (Markus 5) was onrein volgens 15:25, maar Jesus het haar rein gemaak en \"dogter\" genoem.","skrif":"Die reinigingseremonie met die twee voëls (14:4–7). Die priester gaan na buite die laer na die siek persoon (14:3). Bloed en olie op oor, duim en toon – soos by die priesters (14:14–18). Huise met skimmel (14:33–53). Onreinheid en reiniging ná liggaamlike uitskeidings (15:1–33). Die doel: dat hulle nie sterwe deur God se woning te verontreinig nie (15:31).","bid":"Dank God dat Hy herstel en insluit. Bid vir mense wat sukkel met siekte of skaamte oor hul liggaam. Dank Jesus dat Hy ons heeltemal rein maak.","vraag":"Waarom dink jy beklemtoon die Bybel dat Jesus die vrou wat 12 jaar lank onrein was, aangeraak en genees het?","hoofstukke":[["Levitikus","LEV",14],["Levitikus","LEV",15]]},{"dag":54,"ref":"Levitikus 16 – 17","titel":"Die Groot Versoendag","fase":3,"tydlyn":"By Sinai. Die Versoendag (Yom Kippur) is jaarliks op die 10de van die sewende maand gehou (September/Oktober).","agtergrond":"Een keer per jaar, op hierdie een dag, het die hoëpriester die Allerheiligste binnegegaan. Hy moes eers vir sy eie sonde 'n offer bring. Daarna is twee bokke gebruik: een is as sondoffer geslag en sy bloed op die versoendeksel gesprinkel; op die ander, die \"sondebok\" (vir Asasel), het die hoëpriester al die sonde van die volk bely, en dit is die woestyn in gestuur. Hoofstuk 17 verklaar waarom bloed so belangrik is: die lewe is in die bloed.","leer":"Ons sonde moet versoen word (bedek en betaal) én weggeneem word. Jesus vervul albei bokke: Hy het met Sy eie bloed die hemelse Heiligdom binnegegaan, een keer vir altyd (Hebreërs 9:11–12), en Hy dra ons sonde ver weg, \"so ver as die ooste is van die weste\" (Psalm 103:12).","skrif":"Aäron mag nie te eniger tyd in die Heiligdom ingaan nie (16:2). Hy offer eers vir homself (16:6). Die twee bokke (16:7–10). Bloed op die versoendeksel (16:14–15). Al die ongeregtighede word op die kop van die lewende bok bely en hy dra dit na 'n woeste land (16:21–22). \"Op hierdie dag sal vir julle versoening gedoen word om julle te reinig; van al julle sondes sal julle rein wees voor die aangesig van die Here\" (16:30). \"Want die siel van die vlees is in die bloed... die bloed doen versoening\" (17:11).","bid":"Dank Jesus dat Hy ons Hoëpriester én offer én sondebok is. Dank God dat ons sonde nie net vergewe nie, maar ook weggedra is. Bid vir vrymoedigheid om, deur Jesus, na God se troon te gaan (Hebreërs 4:16).","vraag":"Waarom dink jy was daar twee bokke op die Versoendag? Wat leer elkeen ons oor wat Jesus gedoen het?","hoofstukke":[["Levitikus","LEV",16],["Levitikus","LEV",17]]},{"dag":55,"ref":"Levitikus 18 – 20","titel":"\"Wees Heilig, want Ek is Heilig\"","fase":3,"tydlyn":"By Sinai, vóór die intog in Kanaän.","agtergrond":"Hoofstuk 18 en 20 bevat wette oor seksuele heiligheid (let wel: volwasse temas; verduidelik ouderdomsgepas). Die Kanaänitiese en Egiptiese kulture het seksuele losbandigheid, bloedskande en selfs kinderoffers aan die god Molog as deel van godsdiens beoefen. God sê duidelik: \"Volgens die werke van die land Egipte... en die land Kanaän... mag julle nie doen nie\" (18:3). Hoofstuk 19 is 'n hoogtepunt: dit verbind heiligheid met alledaagse liefde en geregtigheid. Jesus haal 19:18 aan as die tweede groot gebod.","leer":"Heiligheid is nie net godsdiens nie, maar raak elke deel van die lewe: ons seksualiteit, ons familieverhoudings, eerlikheid in besigheid, hoe ons die armes, gestremdes, bejaardes en vreemdelinge behandel. God se standaard vir seksualiteit is gegee om ons te beskerm en te seën, nie om ons te beperk nie. Die kern van alles: \"Jy moet jou naaste liefhê soos jouself.\"","skrif":"\"Volgens die werke van die land Egipte... en Kanaän... mag julle nie doen nie\" (18:3). God se grense vir seksualiteit (18:6–23). \"Wees heilig, want Ek, die Here julle God, is heilig\" (19:2). Laat iets oor vir die armes by die oes (19:9–10). Moenie steel, lieg of bedrieg nie (19:11). Moenie die dowe vloek of die blinde laat struikel nie (19:14). \"Jy moet jou naaste liefhê soos jouself\" (19:18). Staan op voor die grys hare (19:32). Die vreemdeling soos 'n burger liefhê (19:34). Eerlike skale (19:35–36). Die kinderoffer aan Molog verbied (20:2–5).","bid":"Bid vir ons gesin se kinders se suiwerheid in 'n wêreld wat seksualiteit misbruik. Bid dat hulle God se plan vir seks en huwelik as goed sal sien. Bid dat ons gesin ons naaste sal liefhê – ook die swakkes en vreemdelinge. Bid vir eerlikheid in alles.","vraag":"Levitikus 19 sit \"wees heilig\" en \"laat iets oor vir die armes\" langs mekaar. Waarom dink jy hoort dit saam?","hoofstukke":[["Levitikus","LEV",18],["Levitikus","LEV",19],["Levitikus","LEV",20]]},{"dag":56,"ref":"Levitikus 21 – 23","titel":"Heilige Priesters en Heilige Tye","fase":3,"tydlyn":"By Sinai.","agtergrond":"Hoofstuk 21–22 gee hoër standaarde vir priesters, omdat hulle naby aan God dien. Hoofstuk 23 beskryf Israel se jaarlikse feeste: die sabbat (weekliks), Pasga en Ongesuurde Brode (lente), Eerstelinge, Pinkster (vyftig dae later, oesfees), Basuingeklank (Rosj Hasjana), die Groot Versoendag, en Huttefees (herfs – herdenking van die woestyntog). Hierdie feeste het die volk se jaar rondom God se reddingsdade gestruktureer.","leer":"God wil hê ons tyd moet aan Hom gewy word – daaglikse ritme, weeklikse rus en jaarlikse herdenking. Die feeste wys merkwaardig na Jesus: Hy is gekruisig met Pasga, het opgestaan op die dag van die Eerstelinge (1 Korintiërs 15:20), en die Heilige Gees is met Pinkster uitgestort (Handelinge 2).","skrif":"Priesters moet heilig wees omdat hulle die brood van hul God offer (21:6). Die offers moet sonder gebrek wees (22:20). \"Julle moet my heilige Naam nie ontheilig nie\" (22:32). Die sabbat (23:3). Pasga en Ongesuurde Brode (23:5–8). Die eerstelinge-gerf (23:10–11). Die fees van die weke (Pinkster) (23:15–21). Laat iets oor vir die armes (23:22). Die Versoendag (23:27–32). Huttefees: woon sewe dae in hutte (23:39–43).","bid":"Dank God vir die rus van die sabbat (of Sondag) en bid dat ons gesin dit as 'n geskenk sal gebruik. Bid dat ons jaarlikse feeste (Kersfees, Paasfees) op Jesus gesentreer sal bly. Bid dat ons ons beste aan God sal gee.","vraag":"Hoe sou ons as gesin ons Sondag meer \"heilig\" (aan God gewy) kon maak?","hoofstukke":[["Levitikus","LEV",21],["Levitikus","LEV",22],["Levitikus","LEV",23]]},{"dag":57,"ref":"Levitikus 24 – 25","titel":"Die Lamp, die Brood, en die Jubeljaar","fase":3,"tydlyn":"By Sinai.","agtergrond":"Die lampe in die Heilige moes altyd brand, en twaalf brode (vir die twaalf stamme) het elke sabbat voor God gelê. Hoofstuk 24 vertel van iemand wat God se Naam gelaster het – 'n ernstige misdaad. Hoofstuk 25 beskryf die sabbatsjaar (elke sewende jaar moes die grond rus) en die Jubeljaar (elke vyftigste jaar): slawe is vrygelaat, skulde is kwytgeskeld en grond is na die oorspronklike families teruggegee. Dit het verhoed dat rykes vir altyd al die grond besit en armes vir altyd arm bly.","leer":"Die land – en alles wat ons het – behoort aan God; ons is maar bestuurders (25:23). God gee om oor regverdigheid tussen ryk en arm, en gee kanse vir 'n nuwe begin. Jesus het Sy bediening begin deur te verkondig dat Hy \"die aangename jaar van die Here\" bring (Lukas 4:18–19) – die ware Jubeljaar van vryheid.","skrif":"Die lampe brand altyd (24:2–4). Die toonbrode (24:5–9). Die godslasteraar (24:10–16). Die sabbatsjaar vir die land (25:2–7). \"Die land mag nie vir altyd verkoop word nie, want die land is myne; want julle is vreemdelinge en bywoners by My\" (25:23). Die Jubeljaar: \"Julle moet vrylating uitroep in die land\" (25:10). Moenie rente van 'n arm broer neem nie (25:35–37). God sal voorsien in die sesde jaar (25:20–22).","bid":"Dank God dat alles wat ons besit, aan Hom behoort. Bid vir wysheid in hoe ons met geld en besittings omgaan. Dank Jesus dat Hy vryheid bring vir gevangenes van sonde. Bid vir mense in skuld of armoede.","vraag":"As alles wat ons het, eintlik aan God behoort, hoe behoort dit die manier waarop ons ons geld en besittings gebruik te verander?","hoofstukke":[["Levitikus","LEV",24],["Levitikus","LEV",25]]},{"dag":58,"ref":"Levitikus 26 – 27","titel":"Seën, Waarskuwing en Beloftes aan God","fase":3,"tydlyn":"By Sinai, aan die einde van die wetgewing.","agtergrond":"Hoofstuk 26 is tipies van antieke verbonde: dit eindig met seëninge vir getrouheid en vloeke vir ontrouheid. Hierdie waarskuwings het later letterlik gebeur, toe Israel in ballingskap weggevoer is. Tog eindig dit met hoop: as hulle berou het, sal God aan Sy verbond dink (26:40–45). Hoofstuk 27 handel oor geloftes – vrywillige beloftes aan God – en die tiendes.","leer":"Gehoorsaamheid bring seën en ongehoorsaamheid het gevolge – God meen wat Hy sê. Maar selfs in Sy oordeel vergeet God nie Sy verbond nie. Ons beloftes aan God moet ernstig opgeneem word; dit is beter om nie 'n belofte te maak as om dit nie na te kom nie (Prediker 5:4–5).","skrif":"\"Ek sal in julle midde wandel en vir julle 'n God wees, en julle sal vir My 'n volk wees\" (26:12). \"Ek het die stange van julle juk stukkend gebreek en julle regop laat loop\" (26:13). Die waarskuwings van toenemende oordeel (26:14–39). \"As hulle dan hul ongeregtigheid bely... sal Ek dink aan my verbond met Jakob\" (26:40–42). \"Ek sal hulle nie verwerp nie... want Ek is die Here hulle God\" (26:44). Die tiende van alles behoort aan die Here (27:30).","bid":"Dank God dat Hy in ons midde wil wandel. Bid dat ons gesin gehoorsaam sal leef en Sy seën sal ervaar. Bid vir genade wanneer ons faal, en dat ons dan dadelik ons sonde sal bely. Dink na oor beloftes wat ons aan God gemaak het.","vraag":"God sê Hy het Israel \"regop laat loop\" ná die slawerny. Wat beteken dit vir jou om \"regop\" as 'n kind van God te loop?","hoofstukke":[["Levitikus","LEV",26],["Levitikus","LEV",27]]},{"dag":59,"ref":"Numeri 1 – 4","titel":"Die Volk word Getel en Georganiseer","fase":3,"tydlyn":"Die tweede jaar ná die uittog, tweede maand (1:1). Die woestyn Sinai.","agtergrond":"Numeri (\"getalle\") kry sy naam van die twee sensusse (hoofstuk 1 en 26). Die Hebreeuse naam is \"In die woestyn\" – wat die boek beter beskryf. Die eerste telling (603 550 weerbare mans, 1:46) dui op 'n groot volk; sommige geleerdes vertaal die Hebreeuse woord \"elef\" (duisend) anders as \"eenheid\" of \"familiegroep\", wat kleiner getalle sou gee. Die laer was georganiseer met die tabernakel in die middel en die stamme in vier groepe van drie rondom – God was letterlik in die middel van die volk. Die Leviete is nie getel vir oorlog nie, maar vir die diens van die tabernakel.","leer":"God is 'n God van orde. Elke stam, familie en persoon het 'n plek en 'n taak in Sy volk. God moet in die middel van ons lewe en gesin wees, nie aan die kant nie. Elke werk vir God – selfs om tentpenne en toue te dra – is belangrik.","skrif":"Die telling van die stamme (1:1–46). Die Leviete word nie getel nie, maar aangestel oor die tabernakel (1:47–53). Die laer rondom die tabernakel (2:1–34). \"Soos die Here Moses beveel het, so het hulle gedoen\" (2:34). Die Leviete in plaas van die eersgeborenes (3:12–13). Elke Levitiese familie se spesifieke take (4:1–49) – tot die penne en toue (4:32).","bid":"Dank God dat Hy elkeen van ons by die naam ken en 'n plek vir ons het. Bid dat God altyd in die middel van ons gesin sal wees. Bid dat elkeen sy of haar taak in die huis en in die kerk getrou sal doen, al lyk dit klein.","vraag":"Watter \"klein\" taak in die huis of die kerk is eintlik belangrik vir God?","hoofstukke":[["Numeri","NUM",1],["Numeri","NUM",2],["Numeri","NUM",3],["Numeri","NUM",4]]},{"dag":60,"ref":"Numeri 5 – 8","titel":"Reinheid, die Nasireër en die Priesterlike Seën","fase":3,"tydlyn":"By Sinai.","agtergrond":"Hoofstuk 5 handel oor die reinheid van die laer en 'n seremonie vir 'n man wat sy vrou van ontrouheid verdink – dit het eintlik die vrou beskerm teen 'n jaloerse man se willekeur, want God self sou die uitspraak gee. Hoofstuk 6 beskryf die Nasireërgelofte: 'n tydelike (of lewenslange) spesiale toewyding aan God, sonder wyn, sonder om die hare te sny en sonder om aan 'n lyk te raak. Simson en Samuel was lewenslange Nasireërs. Die priesterlike seën (6:24–26) is een van die oudste Bybelse tekste wat bewaar is – dit is op twee klein silwerrolletjies van c. 600 v.C. by Ketef Hinnom in Jerusalem gevind.","leer":"God wil hê Sy volk moet rein en eerlik met mekaar wees, ook in die huwelik. Ons kan ons spesiaal aan God toewy. God se diepste begeerte is om Sy volk te seën: om hulle te bewaar, Sy aangesig oor hulle te laat skyn, genadig te wees en vrede te gee.","skrif":"Bely en vergoed met 'n vyfde (5:6–7). Die Nasireërgelofte (6:1–21). Die priesterlike seën: \"Die Here seën jou en behoed jou! Die Here laat sy aangesig oor jou lig en wees jou genadig! Die Here verhef sy aangesig oor jou en gee jou vrede!\" (6:24–26). \"Hulle moet my Naam op die kinders van Israel lê, en Ek sal hulle seën\" (6:27). Die leiers se gawes vir die tabernakel (7). Die lampe (8:1–4) en die inwyding van die Leviete (8:5–26).","bid":"Seën vandag elke kind met die priesterlike seën (Numeri 6:24–26) – lê jou hand op elkeen se kop of skouer en sê dit oor hom of haar uit. Bid vir reinheid en trou in elke toekomstige huwelik.","vraag":"Hoe voel dit om te weet dat God se \"aangesig oor jou lig\" – dat Hy met 'n glimlag na jou kyk?","hoofstukke":[["Numeri","NUM",5],["Numeri","NUM",6],["Numeri","NUM",7],["Numeri","NUM",8]]},{"dag":61,"ref":"Numeri 9 – 12","titel":"Op Pad met die Wolk – en Klaery Begin","fase":3,"tydlyn":"Die tweede jaar ná die uittog. Die volk vertrek van Sinai op die 20ste van die tweede maand (10:11), na die woestyn Paran.","agtergrond":"Ná byna 'n jaar by Sinai trek die volk na die beloofde land. Die wolk oor die tabernakel bepaal wanneer hulle trek en wanneer hulle bly – soms 'n dag, soms 'n jaar. Silwertrompette is gebruik om die volk bymekaar te roep. Hobab, 'n Midianiet wat die woestyn ken, word gevra om saam te gaan as gids. Die klagtes begin byna dadelik. Mirjam en Aäron se kritiek op Moses se Kusitiese vrou (Kus is ongeveer die huidige Soedan/Etiopië) was eintlik jaloesie oor sy gesag.","leer":"Om God te volg beteken om op Sy tyd te beweeg – nie voor Hom uit en nie agter nie. Kla en ondankbaarheid is aansteeklik en vernietigend. God gee leiers die hulp wat hulle nodig het (die 70 oudstes) en Hy verdedig nederige leiers. Jaloesie en rassisme is sonde teen God.","skrif":"\"Op die bevel van die Here het hulle laer opgeslaan, en op die bevel van die Here het hulle opgetrek\" (9:18–23). \"Staan op, Here, dat u vyande verstrooi word\" (10:35). Die volk kla oor die manna en verlang na Egipte se vis, komkommers en uie (11:4–6). Moses: \"Ek alleen kan hierdie hele volk nie dra nie\" (11:14). God gee die Gees ook aan die 70 oudstes; \"Ag, as die hele volk van die Here maar profete was\" (11:29). Is die hand van die Here te kort? (11:23). Mirjam en Aäron kritiseer Moses (12:1–2). \"Die man Moses was baie sagmoedig\" (12:3). God praat met Moses \"van mond tot mond\" (12:8).","bid":"Bid dat ons God se leiding sal volg, en geduldig sal wees as Hy ons laat wag. Bely enige ondankbaarheid in ons gesin. Bid vir ons leiers – in die land, kerk en skool – en dat ons hulle met respek sal behandel.","vraag":"Die volk het \"vergeet\" hoe sleg dit in Egipte was. Waarom dink jy vergeet ons so maklik wat God vir ons gedoen het?","hoofstukke":[["Numeri","NUM",9],["Numeri","NUM",10],["Numeri","NUM",11],["Numeri","NUM",12]]},{"dag":62,"ref":"Numeri 13 – 14","titel":"Twaalf Verkenners: Vrees of Geloof","fase":3,"tydlyn":"c. 1445 v.C. (of c. 1269 v.C.). Kades-Barnea, in die suide van Kanaän.","agtergrond":"Twaalf verkenners, een uit elke stam, gaan veertig dae lank deur Kanaän. Die land is werklik vrugbaar (\"wat oorloop van melk en heuning\"), maar die stede was versterk met mure en die Enakiete was groot van gestalte. Tien verkenners sien net die probleme; Josua en Kaleb sien God se belofte. Die gevolg van die volk se ongeloof was 40 jaar in die woestyn – een jaar vir elke dag van die verkenning – totdat daardie geslag uitgesterf het.","leer":"Ongeloof kyk na die grootte van die probleem; geloof kyk na die grootte van God. Om in die meerderheid te wees, maak jou nie reg nie. Ongeloof het ernstige gevolge, maar dié wat \"met hulle hele hart\" die Here volg, ontvang die belofte. Die Here vergewe, maar die gevolge van sonde bly soms.","skrif":"Die tros druiwe op 'n draagstok tussen twee mans (13:23). \"Die volk... is sterk, en die stede is versterk en baie groot\" (13:28). Kaleb: \"Laat ons tog optrek... want ons sal dit sekerlik oorwin\" (13:30). \"Ons was in ons oë soos sprinkane\" (13:33). Die volk wil 'n leier kies en terugkeer na Egipte (14:4). Josua en Kaleb: \"As die Here 'n welbehae in ons het, sal Hy ons in daardie land bring... moenie teen die Here opstaan nie\" (14:8–9). Moses pleit en haal God se Naam uit Exodus 34 aan (14:17–19). \"Ek vergewe volgens u woord\" (14:20). Kaleb het \"'n ander gees\" en volg die Here volkome (14:24).","bid":"Bid vir geloof soos Josua en Kaleb, wat God se grootheid bo die probleme sien. Bid vir moed om saam met die minderheid vir God te staan. Bid oor enige \"reuse\" wat ons as gesin of individue in die gesig staar.","vraag":"Wanneer voel jy soos 'n \"sprinkaan\" voor 'n reus? Hoe sou Kaleb na daardie situasie kyk?","hoofstukke":[["Numeri","NUM",13],["Numeri","NUM",14]]},{"dag":63,"ref":"Numeri 15 – 17","titel":"Opstand teen God se Leiers","fase":3,"tydlyn":"Die jare van omswerwing in die woestyn (c. 38 jaar).","agtergrond":"Ná die oordeel van hoofstuk 14 begin hoofstuk 15 met wette \"wanneer julle in die land kom\" – God se belofte staan nog vir die volgende geslag. Die kwaste (tossels) aan die klere was 'n sigbare herinnering aan God se gebooie. Korag was 'n Leviet (uit Kehat se familie) wat ook die priesterskap wou hê; Datan en Abiram was uit Ruben (die oudste stam) en het Moses se politieke leierskap betwis. Aäron se staf wat bot, blom en amandels dra, bevestig God se keuse.","leer":"God roep en kies leiers; om teen God se orde te rebelleer, is uiteindelik rebellie teen God self. Hoogmoed en jaloesie op ander se posisie is gevaarlik. God gee herinneringe (kwaste) sodat ons nie ons eie harte en oë volg nie. Ware leiers, soos Aäron, staan tussen die dooies en die lewendes om ander te red.","skrif":"\"Wanneer julle in die land kom\" (15:2). Die verskil tussen onopsetlike sonde en sonde \"met 'n hoë hand\" (15:27–31). Die kwaste: \"sodat julle nie agter julle hart en julle oë aan dwaal nie\" (15:39). Korag: \"Die hele vergadering is heilig... waarom verhef julle julle dan bo die gemeente?\" (16:3). Moses: \"Is dit vir julle te min dat... julle nou ook die priesterskap soek?\" (16:9–10). Die aarde verswelg die rebelle (16:31–33). Aäron staan \"tussen die dooies en die lewendes\" (16:48). Aäron se staf bot (17:8).","bid":"Bid vir harte wat tevrede is met die plek wat God vir ons gegee het. Bid vir respek vir gesag – ouers, onderwysers, leiers – en vir die leiers self om nederig te dien. Dank Jesus wat tussen ons en die dood gestaan het.","vraag":"Korag het gesê \"almal is gelyk, wie is jy?\" Hoe kan dit klink soos regverdigheid, maar eintlik hoogmoed wees?","hoofstukke":[["Numeri","NUM",15],["Numeri","NUM",16],["Numeri","NUM",17]]},{"dag":64,"ref":"Numeri 18 – 20","titel":"Moses se Fout en die Dood van Mirjam en Aäron","fase":3,"tydlyn":"Die einde van die 40 jaar, c. 1407 v.C. (vroeë datum) of c. 1230 v.C. Kades en die berg Hor, by die grens van Edom.","agtergrond":"Hoofstuk 18 reël die onderhoud van die priesters en Leviete deur die tiendes. Die rooi koei (hoofstuk 19) se as is gebruik vir reiniging van mense wat aan 'n lyk geraak het (vgl. Hebreërs 9:13–14). Hoofstuk 20 begin \"in die eerste maand\" – waarskynlik van die veertigste jaar – wanneer Mirjam sterf. Moses slaan die rots in plaas van om daarmee te praat – in woede en asof hy en Aäron die wonder doen (\"Moet ons vir julle water uit hierdie rots laat uitkom?\"). Edom (Esau se nakomelinge) weier Israel deurgang.","leer":"Selfs groot leiers kan in een oomblik van woede en hoogmoed sondig, en dit het gevolge. God vra nie net dat ons Sy werk doen nie, maar dat ons dit op Sy manier en tot Sy eer doen. Leiers word volgens 'n hoër standaard beoordeel. Tog bly God genadig: die water kom steeds vir die volk.","skrif":"\"Ek is jou deel en jou erfenis\" (18:20). Die rooi koei vir reiniging (19:1–10). Mirjam sterf (20:1). Die volk twis weer oor water (20:2–5). \"Spreek met die rots\" (20:8). Moses slaan die rots twee keer (20:10–11). \"Omdat julle in My nie geglo het om My te heilig nie... daarom sal julle hierdie gemeente nie in die land bring nie\" (20:12). Edom weier (20:14–21). Aäron sterf op die berg Hor, en sy seun Eleásar word hoëpriester (20:22–29).","bid":"Bid vir selfbeheersing wanneer ons kwaad of gefrustreerd is. Bid dat ons die eer vir God sal gee, nie vir onsself nie. Bid vir ons kerkleiers, dat hulle in die moeilike tye nie moed sal verloor nie.","vraag":"Moses was moeg en kwaad. Wat is 'n goeie manier om te reageer as jy baie gefrustreerd is met mense?","hoofstukke":[["Numeri","NUM",18],["Numeri","NUM",19],["Numeri","NUM",20]]},{"dag":65,"ref":"Numeri 21 – 22","titel":"Die Koperslang en Bileam se Donkie","fase":3,"tydlyn":"c. 1407 v.C. (of c. 1230 v.C.). Rondom Edom en Moab, aan die oostekant van die Jordaan.","agtergrond":"Israel oorwin die Amoritiese konings Sihon en Og – oorwinnings wat later in Psalms gevier word. Die koperslang is 'n merkwaardige beeld: 'n slang (die oorsaak van die dood) op 'n paal, en wie daarna kyk, lewe. Jesus haal dit aan oor Homself (Johannes 3:14–15). Bileam was 'n bekende waarsêer van Petor by die Eufraat; 'n inskripsie by Deir Alla (Jordanië, c. 800 v.C.) noem 'n \"Bileam seun van Beor\" – dieselfde naam as in die Bybel. Balak, koning van Moab, wil hom betaal om Israel te vervloek.","leer":"Redding kom deur geloof – deur na God se voorsiening te kyk, soos ons na Jesus aan die kruis kyk. God se seën kan nie gekoop word nie. God kan selfs 'n donkie gebruik om 'n mens te keer wat op die verkeerde pad is. Geld en eer kan 'n mens se hart blind maak vir God se wil.","skrif":"Die volk kla weer; giftige slange; Moses bid (21:4–7). \"Maak vir jou 'n slang en sit dit op 'n paal; dan sal elkeen wat gebyt is, as hy daarna kyk, lewe\" (21:8–9). Oorwinning oor Sihon en Og (21:21–35). Balak ontbied Bileam (22:5–6). God sê: \"Jy mag hulle nie vervloek nie, want hulle is geseën\" (22:12). Bileam se donkie sien die Engel van die Here (22:23). Die donkie praat (22:28). \"Kyk, ek het uitgegaan as teëstander, want die pad is verkeerd voor My\" (22:32).","bid":"Dank Jesus dat ons lewe as ons in geloof na Hom kyk. Bid dat geld, eer of populariteit ons nooit van God se weg sal aflei nie. Bid dat ons sal ag slaan wanneer God ons waarsku, selfs op onverwagte maniere.","vraag":"Hoe help die verhaal van die koperslang ons om Johannes 3:14–16 te verstaan?","hoofstukke":[["Numeri","NUM",21],["Numeri","NUM",22]]},{"dag":66,"ref":"Numeri 23 – 25","titel":"Seën wat Nie Vervloek Kan Word nie – en 'n Valstrik","fase":3,"tydlyn":"c. 1407 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, oorkant Jerigo.","agtergrond":"Bileam probeer drie keer om Israel te vervloek, en elke keer kom daar 'n seën uit sy mond. In die vierde orakel kom 'n merkwaardige Messiaanse profesie: \"'n Ster kom uit Jakob\" (24:17). Toe die vervloeking misluk, het Bileam die Moabiete aangeraai om Israel te verlei met afgodery en seksuele sonde by die feeste van Baäl-Peor (vgl. 31:16; Openbaring 2:14). Pinehas (Aäron se kleinseun) tree beslis op en die plaag word gestuit.","leer":"Niemand kan vervloek wat God geseën het nie. God is betroubaar: \"God is geen man dat Hy sou lieg nie\" (23:19). Maar wat vyande van buite nie kon doen nie, kon versoeking van binne doen. Die grootste gevaar vir God se volk is dikwels nie aanval nie, maar verleiding tot kompromie met die wêreld.","skrif":"\"Hoe sal ek vervloek wat God nie vervloek nie?\" (23:8). \"God is geen man dat Hy sou lieg nie... sou Hy iets sê en dit nie doen nie?\" (23:19). \"Hoe goed is u tente, o Jakob\" (24:5). \"'n Ster kom uit Jakob, en 'n septer staan op uit Israel\" (24:17; vgl. die ster in Matteus 2:2). Die volk pleeg hoerery met die Moabitiese vroue en buig voor hulle gode (25:1–3). Pinehas se ywer vir God (25:7–13).","bid":"Dank God dat Sy seën oor Sy kinders nie deur enige mag gebreek kan word nie. Bid vir beskerming teen verleiding – seksueel en geestelik. Bid dat ons, soos Pinehas, ywer vir God se eer sal hê.","vraag":"Waarom dink jy was die versoeking by Baäl-Peor gevaarliker as die vervloeking van Bileam?","hoofstukke":[["Numeri","NUM",23],["Numeri","NUM",24],["Numeri","NUM",25]]},{"dag":67,"ref":"Numeri 26 – 29","titel":"'n Nuwe Geslag en 'n Nuwe Leier","fase":3,"tydlyn":"c. 1407 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, aan die einde van die 40 jaar.","agtergrond":"Die tweede sensus toon dat die ou geslag uitgesterf het – behalwe Josua en Kaleb (26:64–65) – maar die volk is omtrent net so groot. Die dogters van Selofhad (wie se pa sonder seuns gesterf het) vra vir 'n erfdeel – 'n gewaagde versoek in 'n patriargale samelewing – en God gee hulle gelyk. Josua word as Moses se opvolger aangestel. Hoofstuk 28–29 beskryf die daaglikse, weeklikse en jaarlikse offers.","leer":"God is getrou aan Sy woord – ook aan Sy waarskuwings. Hy gee 'n nuwe geslag 'n nuwe kans. God sien en verdedig dié wat kwesbaar is, en Hy hoor wanneer mense met eerbied na Hom kom met 'n saak. God voorsien leiers sodat Sy volk nie \"soos skape sonder 'n herder\" is nie (27:17; vgl. Markus 6:34).","skrif":"Die tweede telling (26:1–51). Niemand van die ou geslag oor nie, behalwe Kaleb en Josua (26:64–65). Die dogters van Selofhad (27:1–7): \"Die dogters van Selofhad spreek reg\" (27:7). Moses bid vir 'n leier, \"dat die vergadering van die Here nie mag wees soos skape wat geen herder het nie\" (27:16–17). Josua, \"'n man in wie die Gees is\" (27:18). Die daaglikse offers soggens en saans (28:3–8).","bid":"Bid vir ons generasie en die volgende – dat ons gesin se kinders se geslag die Here getrou sal volg. Bid vir die regte leiers vir ons land en kerk. Dank God dat Hy die stem van die kwesbares hoor.","vraag":"Die dogters van Selofhad het moedig gepraat. Wanneer moet ons moedig praat vir wat reg is?","hoofstukke":[["Numeri","NUM",26],["Numeri","NUM",27],["Numeri","NUM",28],["Numeri","NUM",29]]},{"dag":68,"ref":"Numeri 30 – 32","titel":"Beloftes, Oorlog en Halfhartige Toewyding","fase":3,"tydlyn":"c. 1407 v.C. (of c. 1230 v.C.). Die vlaktes van Moab.","agtergrond":"Hoofstuk 30 handel oor geloftes – veral van vroue in 'n huishouding. Die oorlog teen Midian (hoofstuk 31) was God se oordeel omdat Midian Israel by Baäl-Peor verlei het; dit is 'n moeilike gedeelte oor oorlog in die antieke wêreld (verduidelik ouderdomsgepas). Bileam sterf in hierdie geveg (31:8). Ruben, Gad en die helfte van Manasse wil oos van die Jordaan bly omdat die weiveld goed is vir hul vee.","leer":"Ons woord en ons beloftes is belangrik vir God. God se oordeel oor sonde is ernstig. Om ons eie gerief bo God se plan en ons broers se nood te stel, is gevaarlik; maar Moses vra dat hulle saam veg. \"Weet dat julle sonde julle sal vind\" (32:23) – sonde bly nie altyd verborge nie.","skrif":"\"Hy mag sy woord nie breek nie; volgens alles wat uit sy mond uitgegaan het, moet hy doen\" (30:2). Bileam sterf (31:8). Die gevangenes en die buit (31:9–54). Die Rubeniete en Gadiete vra die land oos van die Jordaan (32:1–5). Moses: \"Sal julle broers in die oorlog gaan terwyl julle hier bly?\" (32:6). Hulle belowe om saam te veg (32:16–19). \"Weet dat julle sonde julle sal vind\" (32:23).","bid":"Bid dat ons ons woord sal hou, ook as dit moeilik word. Bid dat ons nie net aan onsself sal dink nie, maar ander sal help in hul stryd. Bid dat ons nie probeer om sonde weg te steek nie, maar dit bely.","vraag":"Moses het gesê: \"Weet dat julle sonde julle sal vind.\" Het jy al gesien hoe 'n versteekte sonde later uitkom?","hoofstukke":[["Numeri","NUM",30],["Numeri","NUM",31],["Numeri","NUM",32]]},{"dag":69,"ref":"Numeri 33 – 36","titel":"Die Reis Onthou en die Land Verdeel","fase":3,"tydlyn":"c. 1407 v.C. (of c. 1230 v.C.). Die vlaktes van Moab by die Jordaan, oorkant Jerigo.","agtergrond":"Hoofstuk 33 lys 42 stopplekke van Egipte tot Moab – 'n \"reisjoernaal\" van God se trou. God beveel dat die afgode van Kanaän vernietig moet word, anders sal dit \"dorings in julle oë\" word (33:55). Die grense van die land word vasgestel. Ses vrystede word aangewys waar iemand wat per ongeluk iemand doodgemaak het, kon vlug vir beskerming totdat 'n regverdige verhoor plaasvind.","leer":"Om terug te kyk op ons lewe en God se trou op elke stopplek te onthou, versterk ons geloof. Wat ons nie radikaal uit ons lewe verwyder nie, sal ons later seermaak. God se geregtigheid onderskei tussen moord en 'n ongeluk, en Hy voorsien 'n toevlug – soos ons toevlug in Christus vind (Hebreërs 6:18).","skrif":"Moses het die reis op God se bevel opgeteken (33:2). Die lys van stopplekke (33:3–49). Verdryf die inwoners en vernietig hul beelde (33:52). \"Dorings in julle oë en angels in julle sye\" (33:55). Die grense van die land (34:1–12). Die stede vir die Leviete (35:1–8). Die vrystede (35:9–34). \"Bloed besoedel die land\" (35:33). Die erfenis van die dogters van Selofhad bly in die stam (36).","bid":"Dank God vir Sy trou op elke \"stopplek\" van ons gesin se lewe tot nou. Bid dat ons sonde en slegte gewoontes radikaal uit ons lewe sal verwyder. Dank Jesus dat Hy ons Vrystad en Toevlug is.","vraag":"As jy 'n lys van \"stopplekke\" in jou lewe maak, waar het jy al God se trou gesien?","hoofstukke":[["Numeri","NUM",33],["Numeri","NUM",34],["Numeri","NUM",35],["Numeri","NUM",36]]},{"dag":70,"ref":"Deuteronomium 1 – 3","titel":"Moses Kyk Terug op die Reis","fase":3,"tydlyn":"Die 40ste jaar, 11de maand (1:3), c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab, oos van die Jordaan.","agtergrond":"Deuteronomium beteken \"tweede wet\" – dit is nie 'n nuwe wet nie, maar 'n herhaling en toepassing van die wet vir die nuwe geslag. Dit bestaan grootliks uit drie preke van Moses kort voor sy dood. Dit volg ook die patroon van antieke verbondsverdrae: inleiding, geskiedenis, bepalings, seëninge en vloeke. Jesus haal meer uit Deuteronomium aan as uit enige ander boek van die wet – veral in Sy versoeking in die woestyn.","leer":"Om die geskiedenis van God se trou én ons eie ontrou te onthou, help ons om nie dieselfde foute te herhaal nie. God het Sy volk gedra \"soos 'n man sy seun dra\" (1:31). Die vorige geslag se ongeloof is 'n les vir die nuwe geslag. Ons hoef nie te vrees nie, want die Here veg vir ons.","skrif":"\"Julle het lank genoeg by hierdie berg gebly\" (1:6). Leiers word aangestel – oordeel regverdig, sonder aansien van die persoon (1:16–17). Die verkenners en die ongeloof by Kades (1:19–46). \"Die Here jou God het jou gedra soos 'n man sy seun dra\" (1:31). Die Here het in die woestyn vir hulle gesorg: \"niks het jou ontbreek nie\" (2:7). Oorwinning oor Sihon en Og (2:24–3:11). \"Julle moet hulle nie vrees nie, want die Here julle God, Hy is dit wat vir julle veg\" (3:22). Moses mag die land net van ver sien (3:23–28).","bid":"Dank God dat Hy ons gesin \"gedra het soos 'n pa sy seun dra\". Bid dat ons uit ons foute sal leer. Bid vir moed wanneer ons voor nuwe uitdagings staan.","vraag":"Moses het gesê God het hulle gedra \"soos 'n man sy seun dra\". Wat leer dit ons oor hoe God oor ons voel?","hoofstukke":[["Deuteronomium","DEU",1],["Deuteronomium","DEU",2],["Deuteronomium","DEU",3]]},{"dag":71,"ref":"Deuteronomium 4 – 5","titel":"Onthou, Gehoorsaam en Vertel aan Jou Kinders","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab.","agtergrond":"Moses waarsku teen afgodery: by Sinai het die volk God gehoor, maar geen gestalte gesien nie – daarom mag hulle nie 'n beeld van Hom maak nie. Die nasies het afgode van hout en klip gehad, maar Israel se God was naby en het met hulle gepraat. In hoofstuk 5 word die Tien Gebooie herhaal, met 'n klein verskil: die sabbat word hier verbind aan die verlossing uit Egipte (5:15), terwyl Exodus 20 dit aan die skepping verbind.","leer":"Ons geloof moet oorgedra word aan ons kinders en kleinkinders. God se wet is ons wysheid voor die wêreld. Hy is 'n jaloerse God – nie op 'n kleinlike manier nie, maar soos 'n man wat sy vrou liefhet en nie haar liefde met ander wil deel nie. Gehoorsaamheid kom uit 'n hart wat Hom vrees en liefhet.","skrif":"\"Want watter groot nasie is daar wat gode het wat so naby hom is soos die Here onse God?\" (4:7). \"Pas op... dat jy nie die dinge vergeet wat jou oë gesien het nie... maak dit aan jou kinders en jou kindskinders bekend\" (4:9). Julle het geen gestalte gesien nie (4:12, 15). \"Die Here jou God is 'n verterende vuur, 'n jaloerse God\" (4:24). \"Daar is geen ander nie\" (4:35, 39). Die Tien Gebooie (5:6–21). \"Ag, as hulle maar so 'n hart gehad het om My te vrees... sodat dit hulle en hulle kinders goed kan gaan vir ewig!\" (5:29).","bid":"Bid dat ons as gesin nooit sal vergeet wat God vir ons gedoen het nie, en dat ons dit aan die volgende geslag sal oordra. Bid dat God vir elkeen van ons 'n hart sal gee wat Hom vrees en liefhet (5:29).","vraag":"Wat is een ding wat God in ons gesin gedoen het wat ons nooit moet vergeet nie?","hoofstukke":[["Deuteronomium","DEU",4],["Deuteronomium","DEU",5]]},{"dag":72,"ref":"Deuteronomium 6 – 8","titel":"Die Sjema: Heb die Here Lief met Jou Hele Hart","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab.","agtergrond":"Deuteronomium 6:4–5 word die \"Sjema\" genoem (Hebreeus vir \"Hoor\"). Dit was die belangrikste geloofsbelydenis van Israel, en Jode bid dit tot vandag toe soggens en saans. Jesus noem dit die eerste en grootste gebod (Markus 12:29–30). Sommige Jode het die woorde letterlik in klein houertjies aan hul voorkoppe en deurposte vasgemaak. Jesus haal drie keer uit Deuteronomium 6–8 aan in Sy versoeking in die woestyn (Matteus 4:4, 7, 10).","leer":"Die hart van die geloof is liefde vir die een ware God, met alles wat ons is. Hierdie geloof moet in die gesin geleef en geleer word – \"as jy in jou huis sit en as jy op pad is\". God se seën kan ons laat vergeet dat alles van Hom kom; welvaart is soms 'n groter toets as swaarkry. Die mens leef nie net van brood nie, maar van God se woord.","skrif":"\"Hoor, Israel: die Here onse God is die enigste Here. Daarom moet jy die Here jou God liefhê met jou hele hart en met jou hele siel en met al jou krag\" (6:4–5). \"Jy moet dit jou kinders inskerp en daaroor spreek as jy in jou huis sit en as jy op pad is, en as jy gaan lê en as jy opstaan\" (6:7). \"Jy mag die Here jou God nie versoek nie\" (6:16). Wanneer jou kinders vra, vertel die verhaal (6:20–25). Nie omdat julle groot was nie, maar omdat die Here julle liefgehad het (7:7–8). \"Die mens lewe nie van brood alleen nie, maar... van alles wat uit die mond van die Here uitgaan\" (8:3). Pas op dat jy nie in welvaart vergeet nie (8:11–18).","bid":"Bid die Sjema saam as gesin. Dank God dat Hy ons uitgekies het, nie omdat ons beter is nie, maar uit liefde. Bid dat ons nie in goeie tye vir God sal vergeet nie.","vraag":"Hoe sou dit lyk om God lief te hê met \"jou hele hart, siel en krag\" op 'n gewone skooldag?","hoofstukke":[["Deuteronomium","DEU",6],["Deuteronomium","DEU",7],["Deuteronomium","DEU",8]]},{"dag":73,"ref":"Deuteronomium 9 – 11","titel":"Nie Omdat Jy Goed Is nie – Kies die Seën","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Die vlaktes van Moab.","agtergrond":"Moses herinner die volk aan die goue kalf en ander opstande – hulle het die land nie verdien nie. Die land Kanaän is anders as Egipte: in Egipte is landbou gedoen met besproeiing uit die Nyl, maar Kanaän was afhanklik van die vroeë en laat reëns – van God self (11:10–12). Die berge Gerisim (seën) en Ebal (vloek) by Sigem sou die plek word waar die volk die verbond hernu.","leer":"God gee ons Sy goedheid nie omdat ons regverdig is nie, maar weens Sy genade en Sy beloftes. Hy vra nie te veel nie, maar dat ons Hom vrees, Hom liefhet, Hom dien en Sy gebooie hou – tot ons eie beswil. God gee om vir die wees, die weduwee en die vreemdeling, en ons moet ook. Elke dag kies ons tussen seën en vloek.","skrif":"\"Nie om jou geregtigheid... gaan jy in nie\" (9:5). \"Jy was hardnekkig\" (9:6). Moses vas en bid 40 dae (9:18, 25–29). \"Wat vra die Here jou God van jou anders as om die Here jou God te vrees, in al sy weë te wandel en Hom lief te hê en die Here jou God te dien met jou hele hart?\" (10:12). \"Besny dan die voorhuid van julle hart\" (10:16). God doen reg aan die wees en weduwee en het die vreemdeling lief (10:18–19). \"Kyk, ek lê julle vandag die seën en die vloek voor\" (11:26).","bid":"Dank God vir Sy genade – dat ons nie gered is omdat ons goed is nie. Bid vir 'n \"besnede hart\" – 'n hart wat aan God oorgegee is. Bid dat ons elke dag die seën sal kies deur God te gehoorsaam.","vraag":"Lees 10:12 weer. As jy dit in een sin moet opsom, wat vra God van jou?","hoofstukke":[["Deuteronomium","DEU",9],["Deuteronomium","DEU",10],["Deuteronomium","DEU",11]]},{"dag":74,"ref":"Deuteronomium 12 – 15","titel":"Een Plek van Aanbidding en 'n Oop Hand","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Wette vir die lewe in die land.","agtergrond":"Die Kanaäniete het hul gode op elke heuwel en onder elke groen boom aanbid – met beelde en heilige pale. God beveel dat Israel Hom aanbid \"op die plek wat die Here sal uitkies\" (later Jerusalem), op Sy manier. Hoofstuk 13 waarsku teen valse profete – selfs as hulle tekens doen. Hoofstuk 14 herhaal die voedselwette en die tiendes. Hoofstuk 15 gee die sabbatsjaar vir die kwytskelding van skulde en die vrylating van slawe.","leer":"Ons moet God aanbid soos Hy wil, nie soos die wêreld rondom ons dit doen nie. Ons moet enige stem toets aan God se Woord – selfs as dit indrukwekkend lyk. Vrygewigheid teenoor die armes is deel van ware aanbidding: ons moet ons hand wyd oopmaak, nie ons hart verhard nie.","skrif":"Vernietig die plekke van afgodediens (12:2–3). Aanbid op die plek wat die Here sal uitkies (12:5). \"Al wat ek julle beveel... daar mag jy niks byvoeg en niks van weglaat nie\" (12:32). Toets valse profete, al gebeur die teken (13:1–3). \"Die Here julle God stel julle op die proef om te wete te kom of julle die Here julle God liefhet\" (13:3). Die tiende (14:22–29). \"Jy moet jou hand vir hom wyd oopmaak\" (15:8, 11). Die vrylating van slawe – stuur hulle nie met leë hande weg nie (15:12–15).","bid":"Bid vir onderskeiding om valse lering te herken – ook op sosiale media en in gewilde kultuur. Bid vir oop hande en harte teenoor mense in nood. Bid dat ons God sal aanbid op Sy manier.","vraag":"Hoe toets ons vandag of 'n gewilde idee of persoon se boodskap waar is?","hoofstukke":[["Deuteronomium","DEU",12],["Deuteronomium","DEU",13],["Deuteronomium","DEU",14],["Deuteronomium","DEU",15]]},{"dag":75,"ref":"Deuteronomium 16 – 19","titel":"Regverdige Leiers en 'n Profeet soos Moses","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Wette vir die lewe in die land.","agtergrond":"Hierdie hoofstukke gee riglyne vir verskillende leiers in Israel: regters (16), konings (17), priesters en Leviete (18) en profete (18). Merkwaardig is dat die koning self onder die wet staan en 'n afskrif daarvan moet maak en elke dag lees (17:18–19). Die verbode okkulte praktyke (18:9–14) – waarsêery, towery, spiritisme – was algemeen in Kanaän. Die belofte van 'n profeet soos Moses (18:15) word in die Nuwe Testament op Jesus toegepas (Handelinge 3:22).","leer":"Geregtigheid moet eerlik en onpartydig wees; omkopery verblind. Geen leier staan bo God se wet nie. Christene moet wegbly van die okkulte en geesteswêreld buite God (horoskope, waarsêery, towery). God het ons 'n Profeet gegee wat Sy woorde volmaak spreek: Jesus.","skrif":"Die drie pelgrimsfeeste (16:16). \"Geregtigheid, geregtigheid moet jy najaag\" (16:20). Omkopery verblind die oë van die wyses (16:19). Die koning mag nie vir hom baie perde, vrouens of goud vermeerder nie (17:16–17). Hy moet 'n afskrif van die wet skryf en dit al die dae van sy lewe lees (17:18–20). Geen waarsêer, towenaar of iemand wat die dooies raadpleeg nie (18:10–12). \"'n Profeet uit jou midde, uit jou broers, soos ek, sal die Here jou God vir jou verwek; na hom moet julle luister\" (18:15). Vrystede (19:1–13). Twee of drie getuies (19:15).","bid":"Bid vir ons regering, howe en polisie – dat hulle regverdig sal wees en omkopery sal weerstaan. Bid vir ons kinders se beskerming teen die okkulte. Dank God vir Jesus, die Profeet na wie ons moet luister.","vraag":"Waarom moes die koning elke dag die wet lees? Wat sê dit vir ons?","hoofstukke":[["Deuteronomium","DEU",16],["Deuteronomium","DEU",17],["Deuteronomium","DEU",18],["Deuteronomium","DEU",19]]},{"dag":76,"ref":"Deuteronomium 20 – 23","titel":"Wette vir Oorlog, Gesinne en Gemeenskap","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Wette vir die lewe in die land.","agtergrond":"Hierdie wette dek 'n wye reeks sake: oorlog, onopgeloste moord, gevange vroue, erfenis, opstandige seuns, verlore diere, huwelik en reinheid. Sommige wette pas op die antieke wêreld en Israel as volk, en kan vir ons vreemd of hard lyk (verduidelik ouderdomsgepas). Tog was baie daarvan merkwaardig menslik in vergelyking met omliggende volke: ontslag van militêre diens vir wie pas getroud is of bang is (20:5–8), beskerming van vrugtebome (20:19), 'n reling op die dak om ongelukke te voorkom (22:8), en beskerming vir 'n ontsnapte slaaf (23:15–16).","leer":"God gee om oor elke deel van ons lewe en oor elke mens se waardigheid – selfs dié van vyande, diere en die natuur. Ons is verantwoordelik vir ons naaste se eiendom en veiligheid. Liefde in die praktyk sien raak wat ander verloor het en help.","skrif":"\"Moenie vrees nie... want die Here julle God is dit wat saam met julle trek\" (20:3–4). Wie bang is, kan teruggaan (20:8). Moenie die vrugtebome afkap nie (20:19). Die eersgeborene se reg (21:15–17). \"Een wat gehang is, is 'n vervloekte van God\" (21:23; toegepas op Jesus in Galasiërs 3:13). Bring 'n verlore dier terug; jy mag jou nie onttrek nie (22:1–4). Bou 'n reling om jou dak (22:8). Moenie 'n ontsnapte slaaf teruglewer nie (23:15–16). Hou jou geloftes (23:21–23).","bid":"Dank Jesus dat Hy vir ons 'n vloek geword het aan die kruis (Galasiërs 3:13). Bid dat ons verantwoordelik sal wees teenoor ander se eiendom en veiligheid. Bid dat ons nie onverskillig sal wees as iemand iets verloor het of in nood is nie.","vraag":"Hoe lyk \"jou nie onttrek nie\" (22:4) by die skool – as iemand iets verloor of in die moeilikheid is?","hoofstukke":[["Deuteronomium","DEU",20],["Deuteronomium","DEU",21],["Deuteronomium","DEU",22],["Deuteronomium","DEU",23]]},{"dag":77,"ref":"Deuteronomium 24 – 26","titel":"Sorg vir die Swakkes en Dankbaarheid","fase":3,"tydlyn":"c. 1406 v.C. (of c. 1230 v.C.). Wette vir die lewe in die land.","agtergrond":"Hoofstuk 24 bevat die wet oor egskeiding waarna Jesus in Markus 10:2–9 verwys – Jesus verduidelik dat dit gegee is weens die hardheid van harte, maar dat God se oorspronklike plan lewenslange huwelik is. Daar is wette oor die beskerming van arm werkers, weduwees en wese – soos om 'n arm man se loon voor sononder te betaal. Hoofstuk 26 beskryf die seremonie van die eerste vrugte, waar die boer die geskiedenis van God se verlossing hardop bely.","leer":"God se volk word gekenmerk deur hoe hulle die armes, werkers en kwesbares behandel. Ons het ontvang, daarom gee ons. Dankbaarheid beteken om te onthou en te vertel wat God gedoen het – en dit met ander te deel, insluitend die Leviet, die vreemdeling, die wees en die weduwee.","skrif":"'n Pasgetroude man bly 'n jaar by die huis om sy vrou bly te maak (24:5). Betaal die arm dagloner voor sononder (24:14–15). Elkeen sterf vir sy eie sonde (24:16). \"Jy moet onthou dat jy 'n slaaf in Egipte was\" (24:18, 22). Laat 'n gerf op die land vir die vreemdeling, w

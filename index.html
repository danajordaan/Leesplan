ige getuies wat bereid was om vir hulle boodskap te sterf.","leer":"Jesus is onskuldig gekruisig, in ons plek, as die Koning van die Jode. Die skeur van die voorhangsel wys dat die weg na God oop is. Die opstanding is werklik – die graf was leeg, en Hy het aan baie verskyn. Die opgestane Jesus het alle mag, en Hy stuur Sy volgelinge om dissipels van al die nasies te maak – en Hy belowe om altyd by ons te wees.","skrif":"Judas: \"Ek het gesondig deur onskuldige bloed te verraai\" (27:4). Pilatus se vrou: \"Moenie met daardie regverdige man iets te doen hê nie\" (27:19). Pilatus was sy hande (27:24). \"Hy het ander gered; Homself kan Hy nie red nie\" (27:42). \"Eli, Eli, lama sabagtani?\" (27:46). \"Die voorhangsel van die tempel het in twee geskeur van bo na onder\" (27:51). Die hoofman oor honderd: \"Waarlik, Hy was die Seun van God!\" (27:54). Die graf word verseël en bewaak (27:62–66). Die engel: \"Hy is nie hier nie, want Hy het opgestaan soos Hy gesê het\" (28:6). Jesus ontmoet die vroue: \"Wees gegroet!\" (28:9). Die soldate word omgekoop (28:11–15). \"Aan My is gegee alle mag in hemel en op aarde. Gaan dan heen, maak dissipels van al die nasies, en doop hulle in die Naam van die Vader en die Seun en die Heilige Gees, en leer hulle om alles te onderhou wat Ek julle beveel het. En kyk, Ek is met julle al die dae tot aan die voleinding van die wêreld\" (28:18–20).","bid":"Dank Jesus dat Hy vir ons gesterf het en opgestaan het. Bid oor die Groot Opdrag: hoe kan ons gesin help om dissipels te maak? Dank Jesus vir Sy belofte: \"Ek is met julle al die dae.\"","vraag":"Jesus se laaste woorde in Matteus is 'n opdrag en 'n belofte. Wat is die opdrag, en hoe kan jy dit in jou eie lewe uitleef?","hoofstukke":[["Matteus","MAT",27],["Matteus","MAT",28]]},{"dag":309,"ref":"Johannes 1 – 2","titel":"Die Woord het Vlees Geword","fase":6,"inleiding":["Die Evangelie volgens Johannes","Johannes is anders as die ander drie evangelies. Hy vertel minder gelykenisse en meer lang gesprekke, en hy kies sewe \"tekens\" (wonderwerke) wat wys wie Jesus is. Hy bevat sewe \"Ek is\"-uitsprake waarin Jesus die Naam van God uit Exodus 3:14 gebruik. Baie van die gebeure speel af rondom die Joodse feeste in Jerusalem – daarom weet ons uit Johannes dat Jesus se bediening sowat drie jaar geduur het (hy noem drie Paasfeeste). Die doel van die boek: \"Hierdie is beskrywe, sodat julle kan glo dat Jesus die Christus is, die Seun van God, en dat julle, deur te glo, die lewe kan hê in sy Naam\" (20:31)."],"tydlyn":"\"In die begin\" (die ewigheid), en dan c. 27–28 n.C.: die Jordaan, Kana in Galilea en Jerusalem.","agtergrond":"Johannes begin, soos Genesis, met \"In die begin\". In die Griekse filosofie was die \"Logos\" (Woord) die rasionele beginsel agter die heelal; vir Jode was God se \"woord\" die krag waarmee Hy geskep en gepraat het. Johannes sê: die Woord is 'n Persoon, God self, en Hy het mens geword. \"Gewoon\" (1:14) beteken letterlik \"Sy tent opgeslaan\" – soos die tabernakel. By die bruilof in Kana sou dit 'n groot skande vir die familie gewees het as die wyn opraak. Die watervate was vir die Joodse reinigingsrituele; Jesus verander dit in die beste wyn – die eerste \"teken\".","leer":"Jesus is God, die Skepper van alles, wat mens geword het om by ons te woon. Wie Hom ontvang en in Hom glo, word 'n kind van God. Hy is die Lam van God wat die sonde van die wêreld wegneem. Jesus bring nuwe vreugde en oorvloed in plek van leë godsdienstige rituele. Hy is jaloers oor die heiligheid van Sy Vader se huis.","skrif":"\"In die begin was die Woord, en die Woord was by God, en die Woord was God\" (1:1). \"Alle dinge het deur Hom ontstaan\" (1:3). \"Hy het gekom na wat sy eie was, en die syne het Hom nie aangeneem nie. Maar so baie as Hom aangeneem het, aan hulle het Hy mag gegee om kinders van God te word\" (1:11–12). \"En die Woord het vlees geword en het onder ons gewoon... vol genade en waarheid\" (1:14). \"Die wet is deur Moses gegee; die genade en die waarheid het deur Jesus Christus gekom\" (1:17). \"Daar is die Lam van God wat die sonde van die wêreld wegneem!\" (1:29). \"Kom en kyk\" (1:39, 46). Natanael: \"Kan daar uit Nasaret iets goeds kom?\" (1:46). Die water word wyn (2:1–11). Maria: \"Wat Hy ook al vir julle sê, doen dit\" (2:5). Die tempelreiniging: \"Die ywer vir u huis het my verteer\" (2:17). \"Breek hierdie tempel af, en in drie dae sal Ek dit oprig\" (2:19).","bid":"Aanbid Jesus as die ewige Woord, God self wat mens geword het. Dank Hom dat ons deur geloof kinders van God word. Bid Maria se raad oor elkeen: \"Wat Hy ook al vir julle sê, doen dit.\"","vraag":"Johannes 1:14 sê God het kom \"tent opslaan\" onder ons. Wat beteken dit vir jou dat God mens geword het?","hoofstukke":[["Johannes","JHN",1],["Johannes","JHN",2]]},{"dag":310,"ref":"Johannes 3 – 4","titel":"Nikodemus en die Vrou by die Put","fase":6,"tydlyn":"c. 28 n.C. Jerusalem (snags), Judea, en Sigar in Samaria (by Jakob se put, naby die berg Gerisim).","agtergrond":"Nikodemus was 'n Fariseër, 'n lid van die Sanhedrin en 'n bekende leraar – die mees respektabele godsdienstige man denkbaar. Hy kom snags, moontlik uit vrees of om ongestoord te praat. Die Samaritaanse vrou was sy teenoorgestelde: 'n vrou (rabbi's het nie in die openbaar met vroue gepraat nie), 'n Samaritaan (Jode en Samaritane het mekaar gehaat), en iemand met 'n slegte reputasie wat in die hitte van die middag water kom skep het, waarskynlik om ander vroue te vermy. Jesus praat met albei. Samaritane het op die berg Gerisim aanbid, Jode in Jerusalem.","leer":"Geen mens – hoe vroom of hoe sondig ook al – kan sonder 'n nuwe geboorte deur God se Gees in Sy koninkryk ingaan nie. God het die wêreld so liefgehad dat Hy Sy Seun gegee het, sodat elkeen wat in Hom glo, die ewige lewe het. Jesus gee lewende water wat die diepste dors stil. God soek mense wat Hom in gees en waarheid aanbid. Wie Jesus ontmoet, vertel ander.","skrif":"\"Tensy iemand weer gebore word, kan hy die koninkryk van God nie sien nie\" (3:3). \"Tensy iemand gebore word uit water en Gees\" (3:5). \"Die wind waai waar hy wil\" (3:8). \"Soos Moses die slang in die woestyn verhoog het, so moet die Seun van die mens verhoog word\" (3:14). \"Want so lief het God die wêreld gehad, dat Hy sy eniggebore Seun gegee het, sodat elkeen wat in Hom glo, nie verlore mag gaan nie, maar die ewige lewe kan hê\" (3:16). \"God het sy Seun in die wêreld gestuur, nie om die wêreld te veroordeel nie, maar dat die wêreld deur Hom gered kan word\" (3:17). Johannes die Doper: \"Hy moet meer word, maar ek minder\" (3:30). \"Elkeen wat van hierdie water drink, sal weer dors kry; maar elkeen wat drink van die water wat Ek hom sal gee, sal in ewigheid nooit dors kry nie\" (4:13–14). \"God is Gees, en die wat Hom aanbid, moet in gees en waarheid aanbid\" (4:24). \"Ek is dit, wat met jou praat\" (4:26). Die vrou los haar waterkruik en vertel die hele dorp (4:28–29). \"Ons weet dat Hy waarlik die Christus is, die Saligmaker van die wêreld\" (4:42). Die amptenaar se seun genees (4:46–54).","bid":"Dank God vir Johannes 3:16 – lees dit saam en sit elkeen se naam in. Bid dat elkeen van ons weer gebore sal wees deur die Gees. Bid vir mense wat soos die Samaritaanse vrou dors na iets meer. Bid Johannes die Doper se gebed: \"Hy moet meer word, ek minder.\"","vraag":"Jesus het met 'n hoogaangeskrewe leraar en met 'n uitgeworpe vrou gepraat. Wat sê dit oor wie Jesus wil bereik?","hoofstukke":[["Johannes","JHN",3],["Johannes","JHN",4]]},{"dag":311,"ref":"Johannes 5 – 6","titel":"\"Ek is die Brood van die Lewe\"","fase":6,"tydlyn":"c. 28–29 n.C. Die bad van Betesda in Jerusalem (hoofstuk 5), en Galilea rondom die Paasfees (hoofstuk 6).","agtergrond":"Die bad van Betesda met sy vyf pilaargange is deur argeoloë naby die Skaapspoort van Jerusalem opgegrawe. Jesus genees 'n man wat 38 jaar lank verlam was – op 'n sabbat – en sê dan dat Hy werk soos Sy Vader werk, wat die leiers as 'n aanspraak op gelykheid met God verstaan (5:18). In hoofstuk 6 voed Jesus die vyfduisend, en die volgende dag sê Hy dat Hy die ware brood uit die hemel is, groter as die manna. Baie dissipels vind Sy woorde te hard en draai om.","leer":"Jesus is gelyk aan die Vader, en dié wat Sy woord hoor en glo, het reeds die ewige lewe. Die Skrif getuig van Hom. Jesus is die enigste werklike bevrediging vir ons siel – die brood van die lewe. Ons moet nie Jesus volg net vir wat Hy kan gee nie, maar vir wie Hy is. Wanneer ander weggaan, is Hy steeds die enigste een met die woorde van die ewige lewe.","skrif":"\"Wil jy gesond word?\" (5:6). \"Staan op, neem jou bed op en loop\" (5:8). \"My Vader werk tot nou toe, en Ek werk ook\" (5:17). \"Wie my woord hoor en Hom glo wat My gestuur het, het die ewige lewe... hy het oorgegaan uit die dood in die lewe\" (5:24). \"Julle ondersoek die Skrifte... en dit is die wat van My getuig\" (5:39). Die vyfduisend gevoed met vyf brode en twee vissies van 'n seuntjie (6:9–13). \"Ek is dit, moenie vrees nie\" – Jesus loop op die water (6:20). \"Werk nie vir die spys wat vergaan nie, maar vir die spys wat bly tot in die ewige lewe\" (6:27). \"Ek is die brood van die lewe. Wie na My toe kom, sal nooit honger kry nie; en wie in My glo, sal nooit dors kry nie\" (6:35). \"Hom wat na My toe kom, sal Ek nooit uitwerp nie\" (6:37). \"Wil julle ook nie weggaan nie?\" – Petrus: \"Here, na wie sal ons gaan? U het die woorde van die ewige lewe\" (6:67–68).","bid":"Dank Jesus dat Hy die Brood van die lewe is wat ons diepste honger stil. Dank Hom dat Hy niemand wat na Hom toe kom, uitwerp nie. Bid Petrus se belydenis saam: \"Here, na wie sal ons gaan? U het die woorde van die ewige lewe.\"","vraag":"Die seuntjie het sy klein middagete aan Jesus gegee, en Jesus het duisende daarmee gevoed. Wat \"kleins\" kan jy vir Jesus gee?","hoofstukke":[["Johannes","JHN",5],["Johannes","JHN",6]]},{"dag":312,"ref":"Johannes 7 – 8","titel":"\"Ek is die Lig van die Wêreld\"","fase":6,"tydlyn":"Die Huttefees (September/Oktober), c. 29 n.C. Die tempel in Jerusalem.","agtergrond":"By die Huttefees (Levitikus 23) was daar twee bekende seremonies: elke oggend het 'n priester water uit die bad van Siloam in 'n goue beker na die tempel gedra en by die altaar uitgegiet (wat herinner aan die water uit die rots en die belofte van Sagaria 14:8), en saans is groot kandelare in die voorhof van die vroue aangesteek sodat die hele stad verlig was. Juis by hierdie fees staan Jesus op en sê: \"As iemand dors het, laat hy na My toe kom en drink\", en \"Ek is die lig van die wêreld\". (Let wel: 7:53–8:11, die vrou wat in owerspel betrap is, kom nie in die oudste manuskripte voor nie; baie geleerdes glo dit is 'n ware verhaal wat later hier ingevoeg is. Jou Bybel dui dit dalk aan.)","leer":"Jesus is die vervulling van alles wat die feeste uitgebeeld het: die lewende water en die lig. Wie Hom volg, sal nie in die duisternis wandel nie. Jesus veroordeel nie die sondaar wat na Hom kom nie, maar Hy roep tot 'n nuwe lewe. Die waarheid van Jesus maak ons vry van die slawerny van sonde. Jesus is die ewige \"Ek is\".","skrif":"\"Selfs Sy broers het nie in Hom geglo nie\" (7:5). \"As iemand dors het, laat hy na My toe kom en drink. Wie in My glo... strome van lewende water sal uit sy binneste vloei\" (7:37–38). \"Nooit het 'n mens so gepraat soos hierdie man nie\" (7:46). \"Wie van julle sonder sonde is, laat hy die eerste klip op haar gooi\" (8:7). \"Ek veroordeel jou ook nie. Gaan heen en sondig nie meer nie\" (8:11). \"Ek is die lig van die wêreld; wie My volg, sal nooit in die duisternis wandel nie, maar sal die lig van die lewe hê\" (8:12). \"As julle in my woord bly... sal julle die waarheid ken, en die waarheid sal julle vrymaak\" (8:31–32). \"Elkeen wat die sonde doen, is 'n dienskneg van die sonde\" (8:34). \"As die Seun julle dan vrymaak, sal julle werklik vry wees\" (8:36). Die duiwel is \"'n leuenaar en die vader daarvan\" (8:44). \"Voordat Abraham was, is Ek\" (8:58).","bid":"Dank Jesus dat Hy die Lig is wat ons pad verlig. Bid vir mense wat in die duisternis van sonde vasgevang is, dat Jesus hulle sal vrymaak. Dank Hom dat Hy nie veroordeel nie, maar 'n nuwe begin gee – en bid vir die genade om \"nie meer te sondig nie\".","vraag":"Jesus sê \"die waarheid sal julle vrymaak\". Waarvan maak Jesus mense vry?","hoofstukke":[["Johannes","JHN",7],["Johannes","JHN",8]]},{"dag":313,"ref":"Johannes 9 – 10","titel":"\"Ek is die Goeie Herder\"","fase":6,"tydlyn":"Die herfs en winter van c. 29 n.C. Jerusalem; hoofstuk 10:22 by die Fees van die Tempelinwyding (Chanoeka, Desember).","agtergrond":"Die dissipels het, soos baie Jode, aanvaar dat iemand wat blind gebore is, of self of sy ouers moes gesondig het. Jesus wys dit af. Hy genees die man op 'n sabbat deur modder te maak – wat die Fariseërs as \"werk\" beskou het. Die man word uit die sinagoge gegooi, maar vind Jesus. Hoofstuk 10 sluit aan by Esegiël 34: die slegte herders (die Fariseërs) teenoor die Goeie Herder. 'n Skaapkraal het dikwels nie 'n deur gehad nie; die herder het self in die opening geslaap. Die Fees van die Tempelinwyding vier die herinwyding van die tempel deur die Makkabeërs (164 v.C.).","leer":"Lyding is nie altyd 'n gevolg van persoonlike sonde nie; God kan dit gebruik om Sy werke te openbaar. Geestelike blindheid is erger as fisiese blindheid. Jesus is die Goeie Herder wat Sy skape by die naam ken en Sy lewe vir hulle gee. Hy is die Deur na God. Niemand kan Sy skape uit Sy hand ruk nie.","skrif":"\"Nie hy het gesondig of sy ouers nie, maar die werke van God moet in hom geopenbaar word\" (9:3). \"Ek is die lig van die wêreld\" (9:5). \"Een ding weet ek: dat ek blind was en nou kan sien\" (9:25). \"Glo jy in die Seun van God?... Ek glo, Here! En hy het Hom aanbid\" (9:35–38). \"Ek is die deur\" (10:9). \"Die dief kom net om te steel en te slag en te verwoes; Ek het gekom, dat hulle lewe kan hê, en dit in oorvloed kan hê\" (10:10). \"Ek is die goeie herder. Die goeie herder lê sy lewe af vir die skape\" (10:11). \"Ek ken my eie en word deur my eie geken\" (10:14). \"Niemand neem dit van My weg nie, maar Ek lê dit van Myself af\" (10:18). \"My skape hoor my stem, en Ek ken hulle, en hulle volg My. En Ek gee hulle die ewige lewe... en niemand sal hulle uit my hand ruk nie\" (10:27–28). \"Ek en die Vader is een\" (10:30).","bid":"Dank Jesus dat Hy die Goeie Herder is wat elkeen van ons by die naam ken. Dank Hom dat niemand ons uit Sy hand kan ruk nie. Bid vir mense wat met siekte of gestremdheid leef. Bid dat ons Sy stem sal hoor en volg.","vraag":"Die blinde man het gesê: \"Een ding weet ek: ek was blind en nou sien ek.\" Wat het jy deur Jesus begin \"sien\" wat jy vroeër nie gesien het nie?","hoofstukke":[["Johannes","JHN",9],["Johannes","JHN",10]]},{"dag":314,"ref":"Johannes 11 – 12","titel":"\"Ek is die Opstanding en die Lewe\"","fase":6,"tydlyn":"c. 30 of 33 n.C., die laaste weke en dae voor die Paasfees. Betanië (sowat 3 km van Jerusalem) en Jerusalem.","agtergrond":"Lasarus en sy susters Marta en Maria was goeie vriende van Jesus. Jesus wag doelbewus twee dae voordat Hy gaan. Joodse oortuiging was dat die siel drie dae naby die liggaam bly; op die vierde dag was die dood finaal. Die opwekking van Lasarus is die sewende en grootste teken in Johannes, en dit lei direk tot die besluit van die Raad om Jesus dood te maak (11:53). In hoofstuk 12 salf Maria Jesus met kosbare nardus – 'n jaar se loon werd. Grieke (nie-Jode) kom vra om Jesus te sien – 'n teken dat Sy \"uur\" gekom het.","leer":"Jesus is die opstanding en die lewe; vir wie in Hom glo, is die dood nie die einde nie. Jesus is nie onaangeraak deur ons hartseer nie – Hy huil saam met ons, al weet Hy wat Hy gaan doen. God se vertragings is nie weierings nie. Ware aanbidding gee die beste aan Jesus. Soos 'n koringkorrel moet Jesus sterf om baie vrug te dra – en ons moet ook ons lewe aan Hom gee.","skrif":"\"Hierdie siekte is nie tot die dood nie, maar tot eer van God\" (11:4). \"Jesus het Marta en haar suster en Lasarus liefgehad\" (11:5). \"Ek is die opstanding en die lewe; wie in My glo, sal lewe al sterwe hy ook; en elkeen wat lewe en in My glo, sal nooit sterwe nie. Glo jy dit?\" (11:25–26). \"Ja, Here, ek glo dat U die Christus is, die Seun van God\" (11:27). \"Jesus het geween\" (11:35). \"Lasarus, kom uit!\" (11:43). Kajafas: \"Dit is vir ons nuttig dat een mens vir die volk sterwe\" (11:50). Maria salf Jesus se voete en die huis word vol van die reuk (12:3). Die intog (12:12–15). \"Ons wil Jesus graag sien\" (12:21). \"As die koringkorrel nie in die grond val en sterwe nie, bly dit alleen; maar as dit sterwe, dra dit veel vrug\" (12:24). \"En Ek, as Ek van die aarde verhoog is, sal almal na My trek\" (12:32). Sommige leiers glo, maar bely dit nie, \"want hulle het die eer van die mense liewer gehad as die eer van God\" (12:42–43).","bid":"Dank Jesus dat Hy die opstanding en die lewe is. Bid vir mense wat rou – Jesus huil saam met hulle. Bid vir geduld wanneer God \"laat\" lyk. Bid dat ons die eer van God bo die eer van mense sal soek.","vraag":"Jesus het geweet Hy gaan Lasarus opwek, en tog het Hy gehuil. Wat sê dit oor hoe Jesus oor ons hartseer voel?","hoofstukke":[["Johannes","JHN",11],["Johannes","JHN",12]]},{"dag":315,"ref":"Johannes 13 – 14","titel":"Jesus was Voete en \"Ek is die Weg\"","fase":6,"tydlyn":"Die laaste aand, Donderdag. Die bovertrek in Jerusalem.","agtergrond":"Johannes wy vyf hoofstukke (13–17) aan Jesus se laaste aand met Sy dissipels. Voete was was die werk van die laagste slaaf – Joodse slawe kon selfs nie gedwing word om dit te doen nie. Mense het in sandale op stowwerige paaie geloop, en by 'n maaltyd het hulle aan 'n lae tafel gelê, met hulle voete weg van die tafel. Dat die Here en Meester dit doen, was skokkend. In hoofstuk 14 troos Jesus Sy ontstelde dissipels: Hy gaan weg, maar Hy berei vir hulle 'n plek en sal die Heilige Gees (die \"Trooster\" of \"Helper\", Grieks Parakletos – iemand wat langs jou geroep word om te help) stuur.","leer":"Ware grootheid is nederige diens. Jesus se volgelinge word herken aan hulle liefde vir mekaar. Daar is net een weg na die Vader: Jesus. Wie Jesus gesien het, het die Vader gesien. Liefde vir Jesus word gewys in gehoorsaamheid. Hy laat ons nie as weeskinders agter nie, maar gee Sy Gees en Sy vrede.","skrif":"\"Hy het hulle liefgehad tot die einde toe\" (13:1). Jesus was die dissipels se voete (13:4–5). \"As Ek, die Here en die Meester, julle voete gewas het, behoort julle ook mekaar se voete te was\" (13:14). \"'n Nuwe gebod gee Ek julle, dat julle mekaar moet liefhê; soos Ek julle liefgehad het... Hieraan sal almal weet dat julle my dissipels is\" (13:34–35). \"Laat julle hart nie ontsteld word nie... In die huis van my Vader is baie wonings\" (14:1–2). \"Ek is die weg en die waarheid en die lewe. Niemand kom na die Vader behalwe deur My nie\" (14:6). \"Wie My gesien het, het die Vader gesien\" (14:9). \"As julle My liefhet, bewaar my gebooie\" (14:15). \"Ek sal die Vader bid, en Hy sal julle 'n ander Trooster gee om by julle te bly tot in ewigheid\" (14:16). \"Ek sal julle nie as wese agterlaat nie\" (14:18). \"Vrede laat Ek vir julle na, my vrede gee Ek vir julle\" (14:27).","bid":"Bid vir 'n nederige hart wat ander dien – ook in die huis (oorweeg om as gesin iets prakties vir mekaar te doen). Dank Jesus dat Hy die enigste Weg na die Vader is. Dank God vir die Heilige Gees, ons Trooster. Bid vir Jesus se vrede oor elke ontstelde hart.","vraag":"Jesus het die vuilste werk gedoen – voete was. Wat sou \"voete was\" in ons huis vandag beteken?","hoofstukke":[["Johannes","JHN",13],["Johannes","JHN",14]]},{"dag":316,"ref":"Johannes 15 – 17","titel":"Die Wingerdstok, die Gees en Jesus se Gebed vir Ons","fase":6,"tydlyn":"Die laaste aand, op pad na Getsémané (14:31; 18:1).","agtergrond":"Die wingerdstok was 'n bekende simbool van Israel (Psalm 80; Jesaja 5). Jesus sê Hy is die ware wingerdstok. Wingerdboere het dooie lote afgesny en vrugdraende lote teruggesnoei sodat hulle meer vrug dra. Jesus berei die dissipels voor op die haat van die wêreld en belowe die werk van die Heilige Gees. Hoofstuk 17 word Jesus se \"hoëpriesterlike gebed\" genoem: Hy bid vir Homself, vir Sy dissipels, en ook vir almal wat later deur hulle woord sal glo – dit sluit ons in (17:20).","leer":"Ons kan net vrug dra as ons in Jesus \"bly\" – in 'n lewende, daaglikse verhouding met Hom. Sonder Hom kan ons niks doen nie. God snoei ons om meer vrug te dra. Die grootste liefde is om jou lewe vir jou vriende te gee, en Jesus noem ons Sy vriende. Die wêreld sal ons haat soos dit Hom gehaat het, maar Hy het die wêreld oorwin. Jesus het vir ons gebid – vir eenheid en vir beskerming.","skrif":"\"Ek is die ware wingerdstok, en my Vader is die landbouer\" (15:1). \"Bly in My, soos Ek in julle... Ek is die wingerdstok, julle die lote. Wie in My bly en Ek in hom, dié dra veel vrug; want sonder My kan julle niks doen nie\" (15:4–5). \"Niemand het groter liefde as dít nie, dat iemand sy lewe vir sy vriende gee\" (15:13). \"Ek noem julle vriende\" (15:15). \"Julle het My nie uitverkies nie, maar Ek het julle uitverkies\" (15:16). \"As die wêreld julle haat, weet dat hy My voor julle gehaat het\" (15:18). Die Gees \"sal die wêreld oortuig van sonde en geregtigheid en oordeel\" (16:8). \"Hy sal julle in die hele waarheid lei\" (16:13). \"In die wêreld sal julle verdrukking hê; maar hou goeie moed, Ek het die wêreld oorwin\" (16:33). \"Dit is die ewige lewe, dat hulle U ken, die enige waaragtige God, en Jesus Christus\" (17:3). \"Ek bid nie dat U hulle uit die wêreld wegneem nie, maar dat U hulle van die Bose bewaar\" (17:15). \"Heilig hulle in u waarheid; u woord is die waarheid\" (17:17). \"En Ek bid nie alleen vir hulle nie, maar ook vir die wat deur hulle woord in My sal glo, dat hulle almal een mag wees\" (17:20–21).","bid":"Bid dat elkeen van ons in Jesus sal \"bly\" deur gebed en Sy Woord. Dank Hom dat Hy ons Sy vriende noem. Bid Jesus se gebed in 17:15 oor elke kind: \"Bewaar hulle van die Bose.\" Bid vir eenheid in ons gesin en kerk.","vraag":"Jesus sê \"sonder My kan julle niks doen nie\". Wat beteken dit prakties om elke dag in Jesus te \"bly\"?","hoofstukke":[["Johannes","JHN",15],["Johannes","JHN",16],["Johannes","JHN",17]]},{"dag":317,"ref":"Johannes 18 – 19","titel":"\"Dit is Volbring!\"","fase":6,"tydlyn":"Donderdagnag tot Vrydagmiddag. Getsémané, die huis van Annas en Kajafas, Pilatus se ampswoning (praetorium), Golgota en 'n nuwe graf in 'n tuin.","agtergrond":"Johannes was self by die kruis (19:26, 35). Hy noem besonderhede wat die ander evangelies nie noem nie: Jesus se \"Ek is\" in die tuin wat die soldate laat terugval, die verhoor voor Annas (die skoonpa van Kajafas en vorige hoëpriester), die lang gesprek met Pilatus oor koningskap en waarheid, die opskrif in drie tale (Hebreeus, Latyn en Grieks), Jesus wat Sy moeder aan Johannes toevertrou, en die bloed en water uit Sy sy. Volgens Johannes is Jesus gekruisig op die dag van voorbereiding vir die Pasga, die tyd toe die Paaslammers geslag is – Hy is die ware Paaslam (vgl. 1:29; 19:36 en Exodus 12:46).","leer":"Jesus het Sy lewe vrywillig afgelê; niemand het dit van Hom weggeneem nie. Sy koninkryk is nie van hierdie wêreld nie, maar Hy is waarlik Koning. Hy is die Paaslam wie se bloed ons red. Selfs aan die kruis het Hy vir ander gesorg. Met \"Dit is volbring!\" het Hy die volle prys vir ons sonde betaal – daar is niks wat ons nog daarby kan voeg nie.","skrif":"\"Wie soek julle?... Ek is dit\" – en hulle val agteroor op die grond (18:4–6). \"Steek jou swaard in die skede\" (18:11). Petrus se verloëning (18:15–27). \"My koninkryk is nie van hierdie wêreld nie\" (18:36). \"Elkeen wat uit die waarheid is, luister na my stem.\" – Pilatus: \"Wat is waarheid?\" (18:37–38). \"Ek vind geen skuld in Hom nie\" (18:38; 19:4, 6). \"Kyk, die mens!\" (19:5). \"Ons het geen koning behalwe die keiser nie\" (19:15). \"Jesus die Nasarener, die Koning van die Jode\" in drie tale (19:19–20). \"Vrou, daar is u seun... daar is jou moeder\" (19:26–27). \"Ek het dors\" (19:28). \"Dit is volbring!\" (19:30). Bloed en water uit Sy sy (19:34). Josef van Arimatea en Nikodemus begrawe Hom (19:38–42).","bid":"Dank Jesus dat Hy alles volbring het – daar is niks meer om te betaal nie. Dank Hom dat Hy vrywillig vir ons gesterf het. Bid vir moed om, anders as Pilatus, te staan vir die waarheid al kos dit iets. Dank God vir mense soos Nikodemus wat later moedig na vore gekom het.","vraag":"Jesus se laaste woord was \"Dit is volbring!\" Wat is volbring, en wat beteken dit vir jou?","hoofstukke":[["Johannes","JHN",18],["Johannes","JHN",19]]},{"dag":318,"ref":"Johannes 20 – 21","titel":"\"My Here en my God!\" – en \"Het jy My Lief?\"","fase":6,"tydlyn":"Die opstandingsondag en die week daarna (Jerusalem), en later by die See van Tiberias (Galilea).","agtergrond":"In die eerste eeu is die getuienis van vroue in Joodse howe dikwels nie as betroubaar aanvaar nie. Dat die evangelies Maria Magdalena as die eerste getuie van die opstanding noem, is 'n sterk aanduiding van eerlike geskiedskrywing – niemand wat 'n storie versin, sou dit so vertel het nie. Die doeke wat netjies in die graf gelê het, wys dat die liggaam nie gesteel is nie. Tomas wil fisiese bewys hê. Hoofstuk 21 is 'n \"naskrif\": by die see waar Petrus geroep is, herstel Jesus hom – drie keer vra Hy \"Het jy My lief?\", net soos Petrus Hom drie keer verloën het, en ook by 'n vuur (vgl. 18:18).","leer":"Jesus het liggaamlik uit die dood opgestaan. Hy roep ons by die naam, gee vrede, stuur ons soos die Vader Hom gestuur het, en gee Sy Gees. Twyfel kan in geloof verander wanneer ons Jesus ontmoet. Geseënd is dié wat glo sonder om te sien. Jesus herstel dié wat gefaal het, en roep hulle om Sy skape te versorg – liefde vir Jesus wys in diens.","skrif":"Maria Magdalena by die graf (20:1). Die doeke lê daar (20:6–7). \"Hy het gesien en geglo\" (20:8). \"Maria!\" – \"Rabboeni!\" (20:16). \"Vrede vir julle! Soos die Vader My gestuur het, stuur Ek julle ook\" (20:21). \"Ontvang die Heilige Gees\" (20:22). Tomas: \"As ek nie in sy hande die merk van die spykers sien nie... sal ek nooit glo nie\" (20:25). \"My Here en my God!\" (20:28). \"Salig is die wat nie gesien het nie en tog geglo het\" (20:29). \"Hierdie is beskrywe, sodat julle kan glo dat Jesus die Christus is, die Seun van God, en dat julle, deur te glo, die lewe kan hê in sy Naam\" (20:31). Die groot vangs vis (21:6). Ontbyt by die vuur (21:9–13). \"Simon, seun van Jonas, het jy My lief?... Laat my lammers wei\" (21:15–17). \"Volg jy My!\" (21:22).","bid":"Dank Jesus dat Hy opgestaan het en elkeen van ons by die naam roep. Bely Tomas se woorde saam: \"My Here en my God!\" Bid vir mense wat twyfel, dat hulle Jesus sal ontmoet. Dank Jesus dat Hy dié wat gefaal het herstel – en hoor Sy vraag aan elkeen van ons: \"Het jy My lief?\"","vraag":"Jesus het Petrus drie keer gevra \"Het jy My lief?\" Hoe sou jy daardie vraag vandag eerlik beantwoord?","hoofstukke":[["Johannes","JHN",20],["Johannes","JHN",21]]},{"dag":319,"ref":"Lukas 1","titel":"Twee Wonderbaarlike Swangerskappe","fase":6,"inleiding":["Die Evangelie volgens Lukas","Lukas was 'n geneesheer (Kolossense 4:14) en Paulus se reisgenoot. Hy was waarskynlik nie 'n Jood nie, en het nie self vir Jesus geken nie, maar hy het \"alles van voor af noukeurig nagegaan\" en ooggetuies ondervra (1:1–4). Hy skryf aan \"Teofilus\" ('n hooggeplaaste persoon; die naam beteken \"vriend van God\"). Lukas gee besondere aandag aan mense wat aan die kant was: vroue, armes, sondaars, Samaritane en nie-Jode. Hy vertel van gebed en die Heilige Gees, en hy het baie gelykenisse wat nêrens anders voorkom nie (die verlore seun, die barmhartige Samaritaan, die ryk man en Lasarus). Omdat ons reeds baie van Jesus se lewe in Markus, Matteus en Johannes gelees het, fokus die gids op wat Lukas eie aan homself vertel."],"tydlyn":"c. 7–5 v.C. \"In die dae van Herodes, die koning van Judea\" (1:5). Die tempel in Jerusalem, Nasaret in Galilea, en 'n dorp in die bergland van Juda.","agtergrond":"Sagaria was 'n priester van die afdeling van Abia (vgl. 1 Kronieke 24:10). Met duisende priesters in die 24 afdelings was dit 'n eenmalige voorreg om reukwerk in die Heilige te brand – die lot het hom getref. Hy en Elisabet was oud en kinderloos, soos Abraham en Sara. Maria was waarskynlik 'n tienermeisie, verloof aan Josef; verlowing was destyds wettig bindend. Swanger raak voor die huwelik kon haar eer en selfs haar lewe in gevaar stel. Maria se lofsang (die \"Magnificat\") herinner sterk aan Hanna se lied in 1 Samuel 2. Sagaria se lied (die \"Benedictus\") vat die hele Ou Testament se hoop saam.","leer":"Niks is vir God onmoontlik nie. God kies nederige mense en verhef hulle. Maria se antwoord is die model van geloof en oorgawe: \"Laat dit met my gaan volgens u woord.\" Twyfel (Sagaria) en geloof (Maria) word albei deur God hanteer. God is getrou aan Sy beloftes aan Abraham en Dawid, en Jesus kom as die Lig vir dié wat in duisternis sit.","skrif":"Sagaria en Elisabet \"was albei regverdig voor God\" (1:6). \"Jou gebed is verhoor\" (1:13). Johannes sal gaan \"in die gees en krag van Elia, om die harte van die vaders te bekeer tot die kinders\" (1:17; Maleagi 4:6). Sagaria word stom omdat hy nie glo nie (1:20). Die engel aan Maria: \"Wees gegroet, begenadigde! Die Here is met jou\" (1:28). \"Hy sal groot wees en die Seun van die Allerhoogste genoem word... en aan sy koninkryk sal daar geen einde wees nie\" (1:32–33). \"Hoe sal dit wees?\" (1:34). \"By God sal geen ding onmoontlik wees nie\" (1:37). \"Laat dit met my gaan volgens u woord\" (1:38). Johannes spring van blydskap in Elisabet se skoot (1:41). \"My siel maak groot die Here, en my gees verbly hom in God, my Saligmaker\" (1:46–47). \"Hy het magtiges van trone afgewerp en nederiges verhoog\" (1:52). \"Om te verskyn aan die wat in duisternis en die skaduwee van die dood sit\" (1:79).","bid":"Bid Maria se gebed oor elkeen van ons: \"Laat dit met my gaan volgens U woord.\" Dank God dat niks vir Hom onmoontlik is nie – bring een \"onmoontlike\" saak na Hom. Bid vir die dogter in ons gesin dat sy die geloof en moed van Maria sal hê, en vir die seuns in ons gesin dat hulle die integriteit van Josef sal hê.","vraag":"Maria was jonk, en die engel se boodskap sou haar lewe omkeer. Wat dink jy het dit van haar gevra om \"ja\" te sê vir God?","hoofstukke":[["Lukas","LUK",1]]},{"dag":320,"ref":"Lukas 2 – 3","titel":"Die Geboorte, die Tempel en Johannes die Doper","fase":6,"tydlyn":"c. 6–4 v.C. (geboorte); Jesus is 12 jaar oud (2:42), c. 7–8 n.C.; Johannes begin preek \"in die vyftiende jaar van die regering van keiser Tiberius\" (3:1), c. 28/29 n.C. Betlehem, Jerusalem, Nasaret en die Jordaan.","agtergrond":"Keiser Augustus het sensusse vir belasting laat hou. Die sensus onder Kwirinius (2:2) laat vrae oor datums ontstaan, aangesien 'n bekende sensus onder hom in 6 n.C. was; geleerdes bied verskillende verklarings. 'n \"Krip\" was 'n voerbak vir diere, en die \"herberg\" was waarskynlik 'n gastekamer in 'n familiehuis. Herders het 'n lae status gehad en kon nie in die hof getuig nie – en tog hoor hulle eerste. Simeon en Anna was ou, vroom mense wat op \"die vertroosting van Israel\" gewag het. Lukas 3:1–2 plaas Johannes se bediening presies in die wêreldgeskiedenis. Lukas se geslagsregister (3:23–38) gaan terug tot by Adam – Jesus is die Verlosser van die hele mensdom.","leer":"God kom in nederigheid, nie in mag nie – in 'n voerbak, aan herders. Die goeie nuus is vir die hele volk en vir die nasies. Jesus het gegroei soos elke mens – in wysheid, liggaam en guns. As jongmens het Hy reeds geweet Hy moet in die dinge van Sy Vader wees, en tog was Hy Sy ouers gehoorsaam. Ware bekering wys in eerlikheid, regverdigheid en vrygewigheid.","skrif":"\"Sy het haar eersgebore Seun gebaar... en Hom in 'n krip neergelê, omdat daar vir hulle geen plek in die herberg was nie\" (2:7). \"Ek bring julle 'n blye boodskap... vir die hele volk... vandag is vir julle in die stad van Dawid gebore die Saligmaker, Christus die Here\" (2:10–11). \"Eer aan God in die hoogste hemele, en vrede op aarde\" (2:14). \"Maria het al hierdie woorde bewaar en dit in haar hart oordink\" (2:19). Simeon: \"Nou laat U u dienaar gaan in vrede... want my oë het u heil gesien... 'n Lig tot verligting van die heidene\" (2:29–32). \"Het julle nie geweet dat Ek in die dinge van my Vader moet wees nie?\" (2:49). \"En Hy was aan hulle onderdanig\" (2:51). \"En Jesus het toegeneem in wysheid en grootte en guns by God en die mense\" (2:52). Johannes: \"Wie twee onderklere het, moet aan hom wat niks het nie, uitdeel\" (3:11). Aan tollenaars: \"Moenie meer invorder as wat vir julle bepaal is nie\"; aan soldate: \"Moet niemand afpers nie\" (3:13–14). \"...die seun van Adam, die seun van God\" (3:38).","bid":"Dank God dat Jesus nederig gekom het, vir gewone mense. Bid Lukas 2:52 oor ons gesin se kinders: dat hulle sal toeneem in wysheid, grootte, en guns by God en mense. Bid dat ons, soos Maria, God se woorde in ons harte sal bewaar en oordink.","vraag":"Jesus was op 12 al vol wysheid, en tog \"onderdanig\" aan Sy ouers. Wat leer dit tieners oor groei en gehoorsaamheid?","hoofstukke":[["Lukas","LUK",2],["Lukas","LUK",3]]},{"dag":321,"ref":"Lukas 4 – 5","titel":"Die Bediening Begin: Goeie Nuus vir die Armes","fase":6,"tydlyn":"c. 28–29 n.C. Die woestyn, Nasaret, Kapernaum en die See van Gennesaret (Galilea).","agtergrond":"Lukas plaas Jesus se preek in Nasaret aan die begin van Sy bediening as 'n soort \"missieverklaring\". In die sinagoge was dit gebruiklik dat 'n besoekende leraar uit die profete lees en dan, sittend, verduidelik. Jesus lees uit Jesaja 61 en stop doelbewus voor \"die dag van wraak\". Toe Hy die mense van Nasaret herinner dat Elia en Elisa na nie-Jode (die weduwee van Sarfat, Naäman die Siriër) gestuur is, wou hulle Hom van 'n krans afgooi. Petrus se roeping word deur Lukas met 'n wonderbaarlike vangs vis verbind.","leer":"Jesus het gekom om goeie nuus aan die armes te bring, gevangenes vry te maak en blindes te laat sien. Sy genade bereik buitestaanders, en dit kan godsdienstige mense kwaad maak. Wanneer ons Jesus se heiligheid sien, sien ons ons eie sonde – maar Hy sê: \"Moenie bang wees nie\" en roep ons om mense te vang. Jesus het gereeld afgesonder om te bid.","skrif":"Jesus word versoek (4:1–13). \"Die Gees van die Here is op My, omdat Hy My gesalf het om die evangelie aan die armes te bring\" (4:18). \"Vandag is hierdie Skrif in julle ore vervul\" (4:21). \"Geen profeet is aangenaam in sy vaderland nie\" (4:24). Hulle wou Hom van die krans afgooi (4:29–30). \"Ek moet ook aan die ander stede die evangelie van die koninkryk van God verkondig\" (4:43). Petrus: \"Meester, ons het die hele nag deur gewerk en niks gevang nie; maar op u woord sal ek die net uitgooi\" (5:5). \"Gaan weg van my, want ek is 'n sondige man, Here\" (5:8). \"Moenie vrees nie, van nou af sal jy mense vang\" (5:10). \"Hy het Hom gedurig afgesonder in die woestyne en gebid\" (5:16). Vier vriende laat die verlamde man deur die dak sak (5:18–19). \"Ek het nie gekom om regverdiges te roep nie, maar sondaars tot bekering\" (5:32).","bid":"Dank Jesus dat Hy goeie nuus vir die armes en gebrokenes bring. Bid soos Petrus: \"Op U woord sal ek dit doen\" – ook as ons moeg of ontmoedig is. Bid vir vriende wat ons, soos die vier mans, na Jesus kan \"dra\".","vraag":"Die vier vriende het 'n dak oopgebreek om hulle vriend by Jesus te kry. Vir watter vriend sou jy so moeite doen?","hoofstukke":[["Lukas","LUK",4],["Lukas","LUK",5]]},{"dag":322,"ref":"Lukas 6 – 7","titel":"Die Vlakterede, die Hoofman se Geloof en die Sondige Vrou","fase":6,"tydlyn":"c. 29 n.C. Galilea: 'n gelyk plek (6:17), Kapernaum, Nain en die huis van Simon die Fariseër.","agtergrond":"Lukas se \"vlakterede\" (6:20–49) is korter as Matteus se Bergrede, maar bevat ook \"wee\"-uitsprake vir die rykes en die versadigdes. Nain was 'n klein dorpie in Galilea; 'n weduwee wat haar enigste seun verloor, het nie net haar kind nie, maar ook haar enigste versorging verloor. By 'n maaltyd het gaste aan 'n lae tafel gelê met hulle voete na buite; mense van buite kon instap en luister. 'n Gasheer sou gewoonlik water vir voete, 'n soen en olie vir die kop gee – Simon het niks hiervan gedoen nie.","leer":"Jesus se koninkryk draai die wêreld se waardes om: die armes en die honger is geseënd. Ons moet ons vyande liefhê, sonder om iets terug te verwag, want so is God. Jesus voel diep medelye met mense in hulle verdriet. Wie besef hoeveel hulle vergewe is, het baie lief. Godsdienstige mense kan die genade van God mis omdat hulle nie besef hoe nodig hulle dit het nie.","skrif":"\"Salig is julle wat arm is\" (6:20). \"Wee julle wat ryk is\" (6:24). \"Het julle vyande lief, doen goed aan die wat vir julle haat\" (6:27). \"Wees dan barmhartig, soos julle Vader ook barmhartig is\" (6:36). \"Gee, en aan julle sal gegee word\" (6:38). \"Uit die oorvloed van die hart spreek sy mond\" (6:45). \"Waarom noem julle My: Here, Here! en doen nie wat Ek sê nie?\" (6:46). Die hoofman oor honderd wat die Jode liefhet (7:2–10). Die weduwee van Nain: \"Hy het innig jammer gevoel oor haar en vir haar gesê: Moenie huil nie\" (7:13). \"Jongman, Ek sê vir jou, staan op!\" (7:14). \"God het sy volk besoek\" (7:16). Die sondige vrou was Jesus se voete met haar trane (7:37–38). \"Haar sondes wat baie is, is vergewe, want sy het baie liefgehad; maar hy wie min vergewe word, het min lief\" (7:47). \"Jou geloof het jou gered; gaan in vrede\" (7:50).","bid":"Bid vir genade om ons vyande lief te hê en barmhartig te wees soos God. Bid vir weduwees en enkelouers. Dank Jesus dat Hy ons baie sondes vergewe het – en bid vir 'n hart wat Hom daarom baie liefhet.","vraag":"Jesus sê wie baie vergewe is, het baie lief. Hoe verander dit jou liefde vir Jesus wanneer jy besef hoeveel Hy jou vergewe het?","hoofstukke":[["Lukas","LUK",6],["Lukas","LUK",7]]},{"dag":323,"ref":"Lukas 8 – 9","titel":"Vroue wat Gedien het, en die Koste van Navolging","fase":6,"tydlyn":"c. 29 n.C. Galilea; die verheerliking; en die begin van die reis na Jerusalem (9:51).","agtergrond":"Lukas noem dat 'n groep vroue saam met Jesus gereis en Hom uit hulle eie middele ondersteun het (8:1–3) – iets wat in daardie kultuur ongewoon was. Johanna was die vrou van 'n bestuurder van Herodes Antipas – Jesus se boodskap het selfs die koninklike hof bereik. Hoofstuk 8–9 bevat baie gebeure wat ons uit Markus ken (die saaier, die storm, die besetene, Jaïrus en die vrou, die vyfduisend, Petrus se belydenis, die verheerliking). In 9:51 \"rig Jesus Sy aangesig vas om na Jerusalem te gaan\" – die begin van Lukas se lang reisverhaal (9:51–19:27) wat net in Lukas so voorkom.","leer":"Jesus het vroue gewaardeer en in Sy werk ingesluit. Wie Jesus volg, moet hulle kruis daagliks opneem. Dit kos iets om Hom te volg, en ons kan nie halfhartig of met verskonings kom nie. Jesus is vasberade om na die kruis te gaan vir ons, en ons moet net so vasberade wees om Hom te volg.","skrif":"Maria Magdalena, Johanna, Susanna \"en baie ander wat Hom uit hulle besittings gedien het\" (8:2–3). Die saad op die goeie grond: \"die wat die woord... in 'n edele en goeie hart bewaar en vrug dra met volharding\" (8:15). \"My moeder en my broers is hulle wat die woord van God hoor en doen\" (8:21). \"Waar is julle geloof?\" (8:25). \"Gaan terug na jou huis en vertel watter groot dinge God aan jou gedoen het\" (8:39). \"As iemand agter My aan wil kom, moet hy homself verloën en sy kruis elke dag opneem en My volg\" (9:23). Jesus bid, en Sy gelaat verander (9:28–29). \"Wie die minste onder julle almal is, hy sal groot wees\" (9:48). \"Hy het sy aangesig vas gerig om na Jerusalem te gaan\" (9:51). Die Samaritane wil Hom nie ontvang nie; Jakobus en Johannes wil vuur laat neerdaal, maar Jesus bestraf hulle (9:52–55). \"Niemand wat die hand aan die ploeg slaan en agtertoe kyk, is geskik vir die koninkryk van God nie\" (9:62).","bid":"Dank God vir die vroue wat Jesus gedien het, en vir die vroue wat vandag in die kerk dien. Bid dat ons ons kruis \"elke dag\" sal opneem. Bid vir 'n vasberade hart om Jesus te volg, sonder om \"agtertoe te kyk\".","vraag":"Jesus het gesê ons moet ons kruis \"elke dag\" opneem. Hoe lyk dit op 'n gewone skooldag?","hoofstukke":[["Lukas","LUK",8],["Lukas","LUK",9]]},{"dag":324,"ref":"Lukas 10 – 11","titel":"Die Barmhartige Samaritaan, Marta en Maria, en Leer ons Bid","fase":6,"tydlyn":"c. 29–30 n.C. Op pad na Jerusalem; Betanië.","agtergrond":"Die pad van Jerusalem na Jerigo daal sowat 1 000 m oor 27 km deur 'n rotsagtige woestyn – berug vir rowers. 'n Priester en Leviet sou dalk gevrees het om onrein te word as die man dood was. Samaritane en Jode het mekaar gehaat; om 'n Samaritaan die held te maak, was skokkend vir Jesus se Joodse luisteraars. In 10:38–42 sit Maria aan Jesus se voete – die posisie van 'n leerling by 'n rabbi, wat destyds net vir mans was. In hoofstuk 11 leer Jesus die \"Onse Vader\" en vertel 'n gelykenis oor 'n vriend wat om middernag aanhou klop.","leer":"Om jou naaste lief te hê, beteken om die een in nood te help, ongeag wie hy is – selfs 'n \"vyand\". Om aan Jesus se voete te sit en na Hom te luister, is die \"een ding wat nodig is\", belangriker as al ons besigheid vir Hom. God is 'n goeie Vader wat graag Sy Gees gee aan dié wat vra. Ons moet volhardend bid.","skrif":"\"Die oes is wel groot, maar die arbeiders is min\" (10:2). Die sewentig kom met blydskap terug, maar Jesus sê: \"Verbly julle eerder dat julle name in die hemel opgeskryf is\" (10:20). \"Wie is my naaste?\" (10:29). Die barmhartige Samaritaan (10:30–37). \"Gaan heen en doen jy net so\" (10:37). \"Marta, Marta, jy is besorg en ontsteld oor baie dinge, maar een ding is nodig, en Maria het die goeie deel gekies\" (10:41–42). \"Here, leer ons om te bid\" (11:1). Die \"Onse Vader\" (11:2–4). Die vriend om middernag (11:5–8). \"Bid, en vir julle sal gegee word\" (11:9). \"Hoeveel te meer sal die Vader wat uit die hemel is, die Heilige Gees gee aan die wat Hom bid?\" (11:13). \"Salig is hulle wat die woord van God hoor en dit bewaar\" (11:28). \"Van die bloed van Abel af tot die bloed van Sagaria\" (11:51).","bid":"Bid dat ons die \"naaste\" sal raaksien wat in nood is, ook iemand wat anders is as ons. Bid dat ons, soos Maria, tyd sal maak om aan Jesus se voete te sit. Bid saam die \"Onse Vader\", en bid volhardend vir een saak wat ons as gesin op die hart het.","vraag":"Marta was besig vir Jesus, Maria was by Jesus. Wanneer is jy meer soos Marta, en wanneer soos Maria?","hoofstukke":[["Lukas","LUK",10],["Lukas","LUK",11]]},{"dag":325,"ref":"Lukas 12 – 13","titel":"Moenie Bekommerd Wees nie – en Bekeer Julle","fase":6,"tydlyn":"c. 30 n.C. Op pad na Jerusalem.","agtergrond":"Iemand vra Jesus om in 'n erfenisdispuut in te gryp – rabbi's is dikwels so geraadpleeg. Jesus antwoord met die gelykenis van die ryk dwaas. In 13:1–5 verwys Jesus na twee onlangse rampe: Pilatus wat Galileërs by die offers laat doodmaak het, en 'n toring in Siloam wat op 18 mense geval het. Die mense het gedink sulke slagoffers moes groot sondaars gewees het. Die vyeboom in die wingerd (13:6–9) was 'n beeld van Israel. 'n Vrou wat 18 jaar lank krom was, word op 'n sabbat genees.","leer":"'n Mens se lewe bestaan nie uit sy besittings nie; ons moet ryk wees in God. Ons hoef nie bekommerd te wees nie, want ons Vader weet wat ons nodig het en gee ons graag die koninkryk. Waar ons skat is, is ons hart. Rampe is nie 'n maatstaf van wie die ergste sondaars is nie; dit is 'n oproep aan almal om ons te bekeer. God is geduldig, maar Sy geduld is nie oneindig nie.","skrif":"\"Pas op en wag julle vir die gierigheid; want iemand se lewe bestaan nie uit die oorvloed van sy besittings nie\" (12:15). Die ryk dwaas: \"Dwaas, in hierdie nag word jou siel van jou opgeëis\" (12:20). \"Kyk na die kraaie... kyk na die lelies\" (12:24, 27). \"Wees nie bevrees nie, klein kuddetjie, want dit het julle Vader behaag om julle die koninkryk te gee\" (12:32). \"Waar julle skat is, daar sal julle hart ook wees\" (12:34). \"Van elkeen aan wie veel gegee is, sal veel geëis word\" (12:48). \"Tensy julle julle bekeer, sal julle almal net so omkom\" (13:3, 5). Die vyeboom kry nog een jaar (13:8). Die krom vrou genees: \"Vrou, jy is verlos van jou swakheid\" (13:12). \"Strewe om in te gaan deur die nou poort\" (13:24). \"Jerusalem, Jerusalem... soos 'n hen haar kuikens onder haar vlerke\" (13:34).","bid":"Bring elke bekommernis na God – Hy weet wat ons nodig het. Bid dat ons \"ryk in God\" sal wees eerder as ryk in dinge. Bid vir slagoffers van rampe en ongelukke. Dank God vir Sy geduld en bid dat ons dit nie sal misbruik nie.","vraag":"Jesus sê \"waar jou skat is, daar sal jou hart ook wees\". As iemand na jou kalender en jou bankrekening kyk, waar sal hulle sê is jou skat?","hoofstukke":[["Lukas","LUK",12],["Lukas","LUK",13]]},{"dag":326,"ref":"Lukas 14 – 15","titel":"Die Groot Maaltyd en die Drie Verlore Dinge","fase":6,"tydlyn":"c. 30 n.C. Op pad na Jerusalem.","agtergrond":"Aan 'n maaltyd het sitplekke status gewys: die ereplekke was naby die gasheer. Om die armes, kreupeles en blindes te nooi, wat niks kon teruggee nie, was teen die kulturele gebruik van wederkerigheid. In hoofstuk 15 kla die Fariseërs dat Jesus met sondaars eet, en Jesus vertel drie gelykenisse. In die gelykenis van die verlore seun was dit 'n groot belediging vir 'n seun om sy erfdeel te vra terwyl sy pa nog leef – asof hy wens sy pa is dood. Varke oppas was vir 'n Jood die laagste vernedering. 'n Ryk, ou Midde-Oosterse man het nooit gehardloop nie – dit was onwaardig – maar hierdie vader hardloop na sy seun.","leer":"God nooi almal na Sy fees, veral die armes en die uitgeworpenes – en die verskonings waarom mense nie kom nie, is leeg. Om Jesus te volg, vra dat Hy die eerste plek in ons lewe het, selfs bo familie. God soek die verlorenes met passie, en die hemel is vol vreugde oor elke sondaar wat hom bekeer. Die Vader wag op elke verlore kind en ontvang hom met oop arms. Maar die oudste seun wys dat 'n mens ook \"verlore\" kan wees terwyl jy by die huis is – deur trots, selfgeregtigheid en 'n gebrek aan liefde.","skrif":"\"Elkeen wat homself verhoog, sal verneder word\" (14:11). \"Nooi armes, verminktes, kreupeles, blindes\" (14:13). Die groot maaltyd en die verskonings (14:16–24). \"Wie nie sy kruis dra en agter My aan kom nie, kan nie my dissipel wees nie\" (14:27). Bereken die koste (14:28–33). Die verlore skaap: \"Daar sal so blydskap in die hemel wees oor een sondaar wat hom bekeer\" (15:7). Die verlore muntstuk (15:8–10). Die verlore seun: \"Vader, gee my die deel van die goed\" (15:12). \"Toe hy tot homself gekom het...\" (15:17). \"Vader, ek het gesondig teen die hemel en voor u\" (15:18). \"Toe hy nog ver weg was, sien sy vader hom en kry innige ontferming; en hy hardloop, val hom om die hals en soen hom\" (15:20). \"Hierdie seun van my was dood en het weer lewend geword\" (15:24). Die oudste seun word kwaad (15:28–30). \"Kind, jy is altyd by my, en al wat myne is, is joune\" (15:31).","bid":"Dank God dat Hy, soos die vader, na ons toe hardloop wanneer ons terugkom. Bid vir \"verlore seuns en dogters\" wat ons ken – dat hulle \"tot hulself sal kom\" en huis toe sal kom. Bid dat ons nie soos die oudste seun sal wees nie – trots en ongenadig teenoor ander wat terugkom.","vraag":"Is jy soms meer soos die jongste of soos die oudste seun? Wat sê die vader vir elkeen van hulle?","hoofstukke":[["Lukas","LUK",14],["Lukas","LUK",15]]},{"dag":327,"ref":"Lukas 16 – 17","titel":"Geld, die Ryk Man en Lasarus, en Dankbaarheid","fase":6,"tydlyn":"c. 30 n.C. Op pad na Jerusalem, \"deur die middel van Samaria en Galilea\" (17:11).","agtergrond":"Die gelykenis van die onregverdige bestuurder (16:1–9) is moeilik: Jesus prys nie sy oneerlikheid nie, maar sy slimheid om vir die toekoms te beplan – en vra dat Sy volgelinge net so wys met geld sal wees vir die ewigheid. Die Fariseërs was \"geldgierig\" (16:14). In die gelykenis van die ryk man en Lasarus, het die ryk man daagliks fyn linne en purper (die duurste klere) gedra, terwyl Lasarus by sy hek gelê het. Lasarus is die enigste karakter in Jesus se gelykenisse met 'n naam (dit beteken \"God help\"). Melaatses het in groepe buite die dorpe gebly; die tien melaatses was 'n gemengde groep van Jode en 'n Samaritaan.","leer":"Ons kan nie God en geld dien nie. Hoe ons met geld werk, wys of ons betroubaar is met ware rykdom. Die keuses in hierdie lewe het ewige gevolge, en God se Woord (Moses en die profete) is genoeg om ons te waarsku. Ons moet vergewe, soveel keer as wat nodig is. Ware geloof is dankbaar – soos die een melaatse wat teruggekom het.","skrif":"\"Wie getrou is in die minste, is ook getrou in die meeste\" (16:10). \"Geen huiskneg kan twee here dien nie... Julle kan nie God dien en die Mammon nie\" (16:13). \"Wat onder die mense hoog is, is 'n gruwel voor God\" (16:15). Die ryk man en Lasarus (16:19–31). \"As hulle nie na Moses en die profete luister nie, sal hulle ook nie oortuig word as iemand uit die dode opstaan nie\" (16:31). \"As hy sewe maal op 'n dag teen jou sondig en sewe maal op 'n dag na jou terugkom en sê: Ek het berou – moet jy hom vergewe\" (17:4). \"Here, gee ons meer geloof\" (17:5). \"Ons is onnutte diensknegte; ons het gedoen wat ons verplig was om te doen\" (17:10). Tien melaatses gereinig; een, 'n Samaritaan, kom terug en dank (17:15–16). \"Is die tien nie gereinig nie? En waar is die nege?\" (17:17). \"Die koninkryk van God is binne-in julle\" (17:21). \"Dink aan die vrou van Lot\" (17:32).","bid":"Bid vir wysheid en getrouheid met geld – ook sakgeld. Bid dat ons nie God en geld sal probeer dien nie. Bid vir die \"Lasarusse\" by ons hek – mense in nood wat ons maklik ignoreer. Dank God vir drie spesifieke dinge – wees soos die een wat teruggekom het.","vraag":"Net een van die tien melaatses het teruggekom om dankie te sê. Waarvoor het jy nog nie vir God dankie gesê nie?","hoofstukke":[["Lukas","LUK",16],["Lukas","LUK",17]]},{"dag":328,"ref":"Lukas 18 – 19","titel":"Die Fariseër en die Tollenaar, en Saggeus","fase":6,"tydlyn":"c. 30 n.C. Op pad na Jerusalem, deur Jerigo; die laaste week begin.","agtergrond":"Die Fariseër in die gelykenis het meer gedoen as wat die wet vereis het (die wet het net een vasdag per jaar vereis, die Versoendag; hy het twee keer per week gevas). Die tollenaar staan op 'n afstand en kan nie eers sy oë opslaan nie. Jerigo was 'n belangrike handelstad op die roete van die Jordaan, en Saggeus was 'n \"hoof-tollenaar\" – iemand wat 'n distrik se belastinginvordering van Rome gehuur het en ryk geword het deur ander tollenaars onder hom te laat afpers. Om terug te betaal met vier keer die bedrag, was meer as wat die wet vereis het (vgl. Exodus 22:1; Levitikus 6:5).","leer":"God aanvaar nie die trotse wat op hulle eie geregtigheid vertrou nie, maar die nederige sondaar wat om genade roep. Ons moet aanhou bid en nie moedeloos word nie. Ons moet die koninkryk soos 'n kind ontvang. Rykdom kan 'n hindernis wees, maar by God is alles moontlik. Jesus het gekom om te soek en te red wat verlore is – en ware redding lei tot 'n veranderde lewe, ook met geld.","skrif":"Die weduwee en die onregverdige regter: \"Hulle moet altyd bid en nie moedeloos word nie\" (18:1). Die Fariseër: \"God, ek dank U dat ek nie is soos die ander mense nie\" (18:11). Die tollenaar: \"O God, wees my, sondaar, genadig!\" (18:13). \"Hierdie een het geregverdig na sy huis gegaan, en nie die ander een nie\" (18:14). \"Wie die koninkryk van God nie ontvang soos 'n kindjie nie, sal daar nooit ingaan nie\" (18:17). Die ryk owerste (18:18–27). Die blinde by Jerigo: \"Jesus, Seun van Dawid, ontferm U oor my!\" (18:38). Saggeus klim in 'n wildevyeboom (19:4). \"Saggeus, maak gou en kom af, want vandag moet Ek in jou huis bly\" (19:5). \"Die helfte van my goed gee ek aan die armes; en as ek van iemand iets deur bedrog geneem het, gee ek dit viervoudig terug\" (19:8). \"Vandag het daar heil gekom in hierdie huis\" (19:9). \"Want die Seun van die mens het gekom om te soek en te red wat verlore is\" (19:10). Die gelykenis van die ponde (19:11–27). Die intog; Jesus huil oor Jerusalem (19:41).","bid":"Bid die tollenaar se gebed saam: \"O God, wees my, sondaar, genadig.\" Bid vir mense soos Saggeus – wat ryk, gehaat of eensaam is – dat Jesus hulle sal \"roep by die naam\". Dank Jesus dat Hy gekom het om die verlorenes te soek.","vraag":"Saggeus het sy lewe dadelik verander toe Jesus na hom gekom het. Hoe wys 'n mens se lewe dat hy Jesus regtig ontmoet het?","hoofstukke":[["Lukas","LUK",18],["Lukas","LUK",19]]},{"dag":329,"ref":"Lukas 20 – 21","titel":"Strikvrae en die Weduwee se Twee Muntjies","fase":6,"tydlyn":"Die laaste week, c. 30 of 33 n.C. Die tempel in Jerusalem.","agtergrond":"Hierdie hoofstukke loop grootliks parallel met Markus 11–13 en Matteus 21–24. Jesus se gesag word bevraagteken, Hy vertel die gelykenis van die wynbouers, en beantwoord strikvrae oor belasting en die opstanding (die Sadduseërs se vraag oor 'n vrou wat sewe broers getrou het, verwys na die wet van die \"swaershuwelik\", Deuteronomium 25:5–6). Die \"twee muntjies\" (lepta) van die weduwee was die kleinste koper-muntstukke in omloop. Hoofstuk 21 bevat Jesus se woorde oor die verwoesting van Jerusalem, wat in 70 n.C. deur die Romeine gebeur het (21:20–24 beskryf leërs wat die stad omsingel).","leer":"God sien nie die grootte van die gawe nie, maar die hart en die opoffering daaragter. God is nie 'n God van dooies nie, maar van lewendes – die opstanding is werklik. Ons moet waaksaam lewe en volhard, en ons nie deur angs of die sorge van die lewe laat oorweldig nie. Jesus se woorde sal nooit verbygaan nie.","skrif":"\"Met watter gesag doen U hierdie dinge?\" (20:2). Die wynbouers (20:9–19). \"Gee dan aan die keiser wat die keiser s'n is, en aan God wat God s'n is\" (20:25). \"Hy is nie 'n God van dooies nie, maar van lewendes; want vir Hom lewe almal\" (20:38). \"Pas op vir die skrifgeleerdes wat... die huise van die weduwees opeet\" (20:46–47). \"Hierdie arm weduwee het meer ingegooi as almal... want sy het uit haar armoede al haar lewensmiddele ingegooi\" (21:3–4). \"Pas op dat julle nie mislei word nie\" (21:8). \"Deur julle volharding sal julle julle siele win\" (21:19). \"As julle Jerusalem deur leërs omsingel sien, weet dan dat sy verwoesting naby is\" (21:20). \"Die hemel en die aarde sal verbygaan, maar my woorde sal nooit verbygaan nie\" (21:33). \"Pas op vir julleself, sodat julle harte nie miskien beswaar word deur... die sorge van die lewe nie\" (21:34).","bid":"Bid dat ons, soos die weduwee, God met ons hele hart sal gee, al lyk dit min. Bid vir volharding vir Christene onder druk. Dank God dat Jesus se woorde nooit verbygaan nie. Bid teen angs en die \"sorge van die lewe\".","vraag":"Die weduwee het net twee klein muntjies gegee, maar Jesus sê sy het die meeste gegee. Hoe meet God ons gee?","hoofstukke":[["Lukas","LUK",20],["Lukas","LUK",21]]},{"dag":330,"ref":"Lukas 22","titel":"Die Nagmaal, die Stryd en die Verloëning","fase":6,"tydlyn":"Donderdag van die laaste week. Die bovertrek, die Olyfberg en die hoëpriester se huis in Jerusalem.","agtergrond":"Lukas vertel die laaste aand met besonderhede wat ander nie noem nie: die dissipels stry oor wie die grootste is (selfs by die Nagmaal!), Jesus bid spesifiek vir Petrus dat sy geloof nie sal beswyk nie, Jesus se sweet wat soos bloeddruppels word (as geneesheer noem Lukas dit – dit kan by uiterste angs gebeur), 'n engel wat Hom versterk, en Jesus wat die oor van die hoëpriester se slaaf genees. Ná die derde verloëning \"draai die Here om en kyk na Petrus\" (22:61).","leer":"Die Nagmaal herinner ons aan die nuwe verbond in Jesus se bloed. Ware leierskap in Jesus se koninkryk is diensbaarheid. Jesus bid vir ons wanneer die versoeking kom, en Hy het reeds 'n plan vir ons herstel. In Getsémané sien ons die werklike koste van ons redding. Selfs in Sy eie nood het Jesus Sy vyand genees.","skrif":"\"Ek het hartlik verlang om hierdie pasga saam met julle te eet voordat Ek ly\" (22:15). \"Dit is my liggaam wat vir julle gegee word; doen dit tot my gedagtenis\" (22:19). \"Hierdie beker is die nuwe testament in my bloed wat vir julle uitgestort word\" (22:20). Die stryd oor wie die grootste is (22:24). \"Ek is in julle midde soos een wat dien\" (22:27). \"Simon, Simon, kyk, die Satan het begeer om julle te sif soos koring; maar Ek het vir jou gebid dat jou geloof nie mag beswyk nie; en as jy eendag bekeer is, versterk jou broers\" (22:31–32). \"Vader, as U wil, neem hierdie beker van My weg; nogtans nie my wil nie, maar u wil\" (22:42). 'n Engel versterk Hom (22:43). \"Sy sweet het geword soos bloeddruppels\" (22:44). \"Bid dat julle nie in versoeking kom nie\" (22:46). Jesus genees die slaaf se oor (22:51). \"Die Here het omgedraai en Petrus aangekyk... en hy het bitterlik geween\" (22:61–62).","bid":"Dank Jesus vir Sy liggaam en bloed, gegee vir ons. Dank Hom dat Hy vir ons bid wanneer die Satan ons wil \"sif\" – en bid vir elkeen dat ons geloof nie sal beswyk nie. Bid Jesus se gebed: \"Nie my wil nie, maar U wil.\"","vraag":"Jesus het vir Petrus gesê: \"Ek het vir jou gebid... en as jy bekeer is, versterk jou broers.\" Hoe kan God ons foute gebruik om ander te help?","hoofstukke":[["Lukas","LUK",22]]},{"dag":331,"ref":"Lukas 23 – 24","titel":"Die Kruis, die Leë Graf en die Pad na Emmaus","fase":6,"tydlyn":"Vrydag tot Sondag, en 40 dae later die hemelvaart (Handelinge 1:3). Jerusalem, Golgota, die graf, en die pad na Emmaus (sowat 11 km van Jerusalem).","agtergrond":"Lukas noem besonderhede wat nie in die ander evangelies staan nie: Jesus word ook voor Herodes Antipas gebring; Pilatus en Herodes word vriende; vroue huil oor Jesus op pad na die kruis; Jesus bid vir die mense wat Hom kruisig; een van die misdadigers bekeer hom; Jesus se laaste woorde is 'n gebed uit Psalm 31. Die Emmaus-verhaal (24:13–35) is uniek aan Lukas. Lukas eindig met die hemelvaart en sluit direk aan by die begin van Handelinge – ons lees môre verder.","leer":"Jesus is onskuldig gekruisig, en tog bid Hy vir Sy vyande. Dit is nooit te laat om na Jesus te draai nie – selfs die misdadiger aan die kruis kry 'n belofte van die paradys. Jesus het werklik liggaamlik opgestaan. Die hele Ou Testament wys na Hom – Hy het dit self verduidelik. Hy maak ons harte brand wanneer Hy die Skrif vir ons oopmaak, en Hy stuur ons om bekering en vergewing aan al die nasies te verkondig.","skrif":"Jesus voor Herodes (23:8–11). \"Dogters van Jerusalem, moenie oor My ween nie, maar ween oor julleself en oor julle kinders\" (23:28). \"Vader, vergeef hulle, want hulle weet nie wat hulle doen nie\" (23:34). Die misdadiger: \"Here, dink aan my wanneer U in u koninkryk kom.\" – \"Voorwaar Ek sê vir jou, vandag sal jy saam met My in die paradys wees\" (23:42–43). \"Vader, in u hande gee Ek my gees oor\" (23:46; Psalm 31). \"Waarom soek julle die lewende onder die dode? Hy is nie hier nie, maar Hy het opgestaan\" (24:5–6). Die pad na Emmaus: \"Moes die Christus nie hierdie dinge ly en in sy heerlikheid ingaan nie? En Hy het begin van Moses en al die profete af en vir hulle uitgelê in al die Skrifte die dinge wat op Hom betrekking het\" (24:26–27). \"Het ons hart nie in ons gebrand toe Hy met ons op die pad gepraat en die Skrifte vir ons uitgelê het nie?\" (24:32). \"Kyk na my hande en my voete, dat Ek dit self is; voel aan My en kyk, want 'n gees het nie vlees en bene soos julle sien dat Ek het nie\" (24:39). \"Alles moet vervul word wat oor My geskrywe is in die wet van Moses en die profete en die psalms\" (24:44). \"Dat in sy Naam bekering en vergewing van sondes verkondig moet word onder al die nasies\" (24:47). Die hemelvaart (24:50–53).","bid":"Dank Jesus dat Hy vir Sy vyande gebid het – en vir ons. Dank Hom dat dit nooit te laat is om na Hom te draai nie; bid vir iemand wat ver van God af is. Dank Hom dat Hy die hele Bybel vir ons oopmaak en ons harte laat brand. Dank Hom dat ons nou die hele Ou Testament gelees het en kan sien hoe dit na Hom wys.","vraag":"Op pad na Emmaus het Jesus uit die hele Ou Testament verduidelik hoe dit oor Hom gaan. Noem twee plekke in die Ou Testament wat ons gelees het wat na Jesus wys.","hoofstukke":[["Lukas","LUK",23],["Lukas","LUK",24]]},{"dag":332,"ref":"Handelinge 1 – 2","titel":"Die Hemelvaart en Pinkster","fase":7,"tydlyn":"c. 30 of 33 n.C. Veertig dae ná die opstanding (die hemelvaart) en tien dae later (Pinkster). Die Olyfberg en Jerusalem.","agtergrond":"Pinkster (Grieks: \"vyftigste\") was die Joodse oesfees 50 dae ná die Pasga (Levitikus 23:15–21), en volgens latere Joodse oorlewering ook die herdenking van die gee van die wet by Sinai. Jode van oral in die Romeinse Ryk was in Jerusalem vir die fees. Die tale wat die dissipels praat, is werklike tale wat die besoekers verstaan (2:8–11) – 'n omkeer van Babel (Genesis 11). Petrus haal Joël 2 en Psalm 16 en 110 aan. Matthias word gekies in Judas se plek, sodat daar weer twaalf apostels is.","leer":"Die opgestane Jesus het opgevaar en regeer, en Hy sal net so terugkom. Die Heilige Gees is gegee om ons krag te gee om Jesus se getuies te wees. Die boodskap is: Jesus, wie julle gekruisig het, het God opgewek en Here en Christus gemaak – bekeer julle en word gedoop. Die eerste kerk het hulle toegewy aan die apostels se leer, gemeenskap, die breking van die brood en gebed.","skrif":"\"Julle sal krag ontvang wanneer die Heilige Gees oor julle kom, en julle sal my getuies wees in Jerusalem en in die hele Judea en Samaria en tot aan die uiterste van die aarde\" (1:8). \"Hierdie Jesus... sal net so kom soos julle Hom na die hemel sien opvaar het\" (1:11). \"Hulle het almal eendragtig volhard in die gebed\" (1:14). Die geluid soos 'n geweldige wind en tonge soos van vuur (2:2–3). \"Ons hoor hulle in ons tale die groot dade van God spreek\" (2:11). \"Hierdie Jesus het God opgewek, waarvan ons almal getuies is\" (2:32). \"God het Hom Here en Christus gemaak, hierdie Jesus wat julle gekruisig het\" (2:36). \"Hulle het 'n steek in die hart gekry... Wat moet ons doen?\" (2:37). \"Bekeer julle, en laat elkeen van julle gedoop word in die Naam van Jesus Christus tot vergewing van sondes, en julle sal die gawe van die Heilige Gees ontvang. Want vir julle is die belofte en vir julle kinders\" (2:38–39). Omtrent drie duisend siele (2:41). \"En hulle het volhard in die leer van die apostels en in die gemeenskap en in die breking van die brood en in die gebede\" (2:42). Hulle het alles gemeenskaplik gehad (2:44–47).","bid":"Dank God vir die gawe van die Heilige Gees. Bid dat elkeen van ons die krag sal ontvang om Jesus se getuie te wees – by die skool, op die sportveld, aanlyn. Dank God dat die belofte \"vir julle kinders\" is. Bid dat ons gesin, soos die eerste kerk, sal volhard in die Woord, gemeenskap en gebed.","vraag":"Handelinge 2:42 noem vier dinge waarin die eerste Christene volhard het. Watter een van die vier is die sterkste in ons gesin, en watter die swakste?","hoofstukke":[["Handelinge","ACT",1],["Handelinge","ACT",2]]},{"dag":333,"ref":"Handelinge 3 – 5","titel":"Vrymoedigheid, Vervolging en die Gevaar van Skynheiligheid","fase":7,"tydlyn":"c. 30–33 n.C. Die tempel in Jerusalem (die Skoonpoort en die Pilaargang van Salomo) en die Sanhedrin.","agtergrond":"Mense met gestremdhede het dikwels by die tempelpoorte gebedel, omdat gee aan armes 'n godsdienstige plig was. Die genesing lei tot die eerste vervolging: die Sadduseërs (wat nie in die opstanding geglo het nie) is kwaad dat die apostels die opstanding van Jesus verkondig. Petrus en Johannes was \"ongeletterde en eenvoudige mense\" – hulle het nie by rabbi's gestudeer nie. Ananias en Saffira se sonde was nie dat hulle nie alles gegee het nie (dit was hulle reg, 5:4), maar dat hulle gelieg het om geestelik indrukwekkend te lyk. Gamaliël was 'n bekende Fariseërleraar – Paulus se eie leermeester (22:3).","leer":"Die Naam van Jesus het krag. Daar is redding in niemand anders nie. Gewone mense wat by Jesus was, kan met vrymoedigheid praat. Wanneer ons gedreig word, bid ons nie om veiligheid nie, maar om vrymoedigheid. Ons moet God meer gehoorsaam as mense. God neem leuens en skynheiligheid in Sy kerk baie ernstig op.","skrif":"\"Silwer en goud het ek nie, maar wat ek het, dit gee ek jou: In die Naam van Jesus Christus die Nasarener, staan op en loop!\" (3:6). \"Bekeer julle dan en draai om, sodat julle sondes uitgedelg kan word\" (3:19). \"Daar is ook in niemand anders saligheid nie; want daar is onder die hemel geen ander naam wat onder die mense gegee is, waardeur ons gered moet word nie\" (4:12). \"Toe hulle die vrymoedigheid van Petrus en Johannes sien... het hulle hul verwonder, en hulle het hul herken dat hulle saam met Jesus was\" (4:13). \"Ons kan nie anders as om te spreek van wat ons gesien en gehoor het nie\" (4:20). Hulle gebed: \"Gee aan u diensknegte om met alle vrymoedigheid u woord te spreek\" (4:29). Ananias en Saffira lieg (5:1–11). \"'n Mens moet aan God meer gehoorsaam wees as aan die mense\" (5:29). Gamaliël: \"As hierdie werk uit God is, sal julle dit nie kan breek nie\" (5:38–39). \"Hulle het weggegaan... bly dat hulle waardig geag is om vir sy Naam smaadheid te ly\" (5:41).","bid":"Bid die eerste kerk se gebed (4:29): nie vir 'n maklike lewe nie, maar vir vrymoedigheid om van Jesus te praat. Bid dat mense aan ons sal sien dat ons \"saam met Jesus was\". Bid vir eerlikheid – dat ons nooit sal voorgee om meer geestelik te wees as wat ons is nie. Bid vir vervolgde Christene.","vraag":"Toe die eerste Christene gedreig is, het hulle nie vir veiligheid gebid nie, maar vir vrymoedigheid. Waarom dink jy het hulle so gebid?","hoofstukke":[["Handelinge","ACT",3],["Handelinge","ACT",4],["Handelinge","ACT",5]]},{"dag":334,"ref":"Handelinge 6 – 7","titel":"Stefanus: Die Eerste Martelaar","fase":7,"tydlyn":"c. 33–35 n.C. Jerusalem.","agtergrond":"Die kerk het uit twee groepe Joodse gelowiges bestaan: \"Hebreërs\" (Aramees-sprekende Jode van Palestina) en \"Grieke\" of Hellenistiese Jode (Griekssprekende Jode wat van elders gekom het). Die Griekssprekende weduwees is afgeskeep in die daaglikse uitdeling van kos. Sewe manne, almal met Griekse name, word aangestel om te dien – sodat die apostels hulle aan gebed en die bediening van die Woord kan wy. Stefanus is een van hulle. Sy toespraak (hoofstuk 7) is die langste in Handelinge: hy vertel Israel se geskiedenis om te wys dat God nooit aan een plek (die tempel) gebind was nie, en dat Israel altyd God se boodskappers verwerp het. 'n Jong man genaamd Saulus kyk toe.","leer":"Praktiese probleme in die kerk moet met wysheid en regverdigheid hanteer word, en elkeen het 'n bediening. God se volk het altyd die neiging gehad om Sy boodskappers te verwerp. Stefanus wys hoe 'n mens wat vol van die Heilige Gees is, sterf: met sy oë op Jesus, en terwyl hy vir sy moordenaars bid – soos Jesus. God werk selfs deur die dood van Sy kinders: Saulus het toegekyk.","skrif":"Die Griekssprekende weduwees word afgeskeep (6:1). \"Ons sal volhard in die gebed en die bediening van die woord\" (6:4). Sewe manne \"met 'n goeie getuienis, vol van die Heilige Gees en wysheid\" (6:3). \"Die woord van God het uitgebrei\" (6:7). Stefanus \"vol geloof en krag\" (6:8). \"Sy gesig was soos die gesig van 'n engel\" (6:15). Sy toespraak (7:2–53). \"Die Allerhoogste woon nie in tempels deur hande gemaak nie\" (7:48). \"Julle hardnekkiges... julle weerstaan altyd die Heilige Gees\" (7:51). \"Kyk, ek sien die hemele geopen en die Seun van die mens aan die regterhand van God staan\" (7:56). \"Here Jesus, ontvang my gees!\" (7:59). \"Here, reken hulle hierdie sonde nie toe nie!\" (7:60). Die getuies het hulle klere neergelê by die voete van 'n jongman met die naam Saulus (7:58).","bid":"Bid vir mense in die kerk wat agter die skerms in praktiese bediening dien. Bid vir Christene wat vandag vir hulle geloof gemartel word. Bid vir die genade van Stefanus – om, selfs wanneer mense ons seermaak, vir hulle te bid.","vraag":"Stefanus het vir die mense gebid wat hom doodgegooi het. Hoe is dit moontlik om so te reageer?","hoofstukke":[["Handelinge","ACT",6],["Handelinge","ACT",7]]},{"dag":335,"ref":"Handelinge 8 – 9","titel":"Die Evangelie na Samaria, 'n Etiopiër en Saulus se Bekering","fase":7,"tydlyn":"c. 33–35 n.C. Jerusalem, Samaria, die pad na Gasa, en die pad na Damaskus.","agtergrond":"Ná Stefanus se dood breek 'n groot vervolging uit en die gelowiges word verstrooi – en hulle neem die evangelie saam (8:4). Filippus (een van die sewe) preek in Samaria – die mense wat Jode gehaat het. Die Etiopiese hofbeampte was 'n eunug en die tesourier van die koningin (Kandake was 'n titel) van Kus (die gebied suid van Egipte); hy het na Jerusalem gegaan om te aanbid, maar as eunug sou hy nie in die binnehof toegelaat word nie (Deuteronomium 23:1). Hy lees Jesaja 53 – en Jesaja 56:3–5 belowe juis vir eunugs 'n plek. Saulus van Tarsus was 'n ywerige Fariseër wat met magtiging van die hoëpriester na Damaskus gaan om Christene in hegtenis te neem.","leer":"God gebruik selfs vervolging om die evangelie te versprei. Die evangelie breek oor elke grens – Samaritane, 'n Afrikaan, 'n eunug, en uiteindelik die grootste vyand van die kerk. Ons moet gehoorsaam wees wanneer God ons na een persoon stuur. Wanneer ons Christene vervolg, vervolg ons Jesus self. Niemand is te ver vir God se genade nie. God gebruik gewone gelowiges soos Ananias, wat bang is maar tog gaan.","skrif":"\"Die wat verstrooi was, het rondgegaan en die woord verkondig\" (8:4). \"En daar was groot blydskap in daardie stad\" (8:8). Simon die towenaar wil die Gees met geld koop (8:18–20). Filippus en die Etiopiër: \"Verstaan u wat u lees?\" (8:30). \"Hoe kan ek, as niemand my die weg wys nie?\" (8:31). \"Filippus... het, van hierdie Skrif af begin, aan hom Jesus verkondig\" (8:35). \"Hy het met blydskap sy weg gegaan\" (8:39). Saulus \"nog altyd dreigemente en moord teen die dissipels van die Here blasend\" (9:1). \"Saul, Saul, waarom vervolg jy My?... Ek is Jesus wat jy vervolg\" (9:4–5). Ananias is bang, maar gaan: \"Broeder Saul\" (9:13–17). \"Hierdie man is vir My 'n uitverkore werktuig om my Naam te dra voor die heidene en konings en die kinders van Israel\" (9:15). Saulus preek dadelik dat Jesus die Seun van God is (9:20). Barnabas (\"seun van vertroosting\") staan in vir Saulus (9:27). Petrus wek Tabita op (9:36–42).","bid":"Bid vir die moed van Filippus om met 'n vreemdeling oor Jesus te praat. Bid vir mense wat Christene vervolg – dat Jesus hulle, soos Saulus, sal ontmoet. Bid dat ons soos Ananias en Barnabas sal wees: gewillig om nuwe gelowiges te verwelkom en te ondersteun.","vraag":"Ananias was bang om na Saulus te gaan, maar het tog gegaan en hom \"broer\" genoem. Wie in jou lewe het so 'n \"Ananias\" of \"Barnabas\" nodig?","hoofstukke":[["Handelinge","ACT",8],["Handelinge","ACT",9]]},{"dag":336,"ref":"Handelinge 10 – 12","titel":"Die Evangelie vir die Nie-Jode, en Petrus Bevry","fase":7,"tydlyn":"c. 37–44 n.C. Joppe en Sesarea (aan die kus), Antiogië in Sirië, en Jerusalem. Herodes Agrippa I sterf in 44 n.C.","agtergrond":"Volgens die Joodse oorlewering het 'n Jood nie 'n nie-Jood se huis binnegegaan of saam met hom geëet nie, om nie onrein te word nie. Cornelius was 'n Romeinse offisier (hoofman oor honderd) wat God gevrees het. God gee Petrus 'n visioen van onrein diere en sê: \"Wat God gereinig het, moet jy nie onrein ag nie.\" In Antiogië (die derde grootste stad van die Romeinse Ryk) word die gelowiges die eerste keer \"Christene\" genoem. Herodes Agrippa I (kleinseun van Herodes die Grote) laat die apostel Jakobus (Johannes se broer) onthoof en Petrus gevange neem. Die Joodse geskiedskrywer Josefus beskryf ook Agrippa se skielike dood in 44 n.C. ná 'n toespraak in Sesarea.","leer":"God trek nie mense voor nie; in elke nasie is dié wat Hom vrees, vir Hom aanneemlik. Die evangelie is vir alle mense, en ons moet ons vooroordele laat vaar. Die Heilige Gees kom op nie-Jode, net soos op Jode. Wanneer die kerk bid, kan God tronkdeure oopmaak – al glo ons dit nie altyd wanneer dit gebeur nie. Trots wat God se eer steel, val.","skrif":"Cornelius \"het baie aalmoese aan die volk gegee en altyd tot God gebid\" (10:2). Petrus se visioen: \"Wat God gereinig het, moet jy nie onrein ag nie\" (10:15). \"God het my getoon dat ek geen mens onheilig of onrein moet noem nie\" (10:28). \"Nou begryp ek waarlik dat God geen aanneming van die persoon ken nie; maar in elke nasie is hy wat Hom vrees en geregtigheid doen, vir Hom aangenaam\" (10:34–35). Die Heilige Gees val op die nie-Jode (10:44). \"Dan het God ook aan die heidene die bekering gegee tot die lewe\" (11:18). \"In Antiogië is die dissipels die eerste keer Christene genoem\" (11:26). Herodes laat Jakobus doodmaak (12:2). \"Maar die gemeente het aanhoudend vir hom tot God gebid\" (12:5). Die engel bevry Petrus (12:7–10). Rode is so bly dat sy vergeet om die deur oop te maak; die biddende gelowiges glo haar nie (12:13–16). Herodes sterf \"omdat hy aan God nie die eer gegee het nie\" (12:23). \"Maar die woord van God het gegroei en vermeerder\" (12:24).","bid":"Bid dat ons geen mens as \"onrein\" of minder werd sal beskou nie – ongeag ras, taal of agtergrond. Bid vir mense wat soos Cornelius God soek, dat iemand hulle van Jesus sal vertel. Bid volhardend vir iets wat onmoontlik lyk – en verwag dat God kan antwoord.","vraag":"Die gelowiges het vir Petrus se vrylating gebid, maar toe hy by die deur klop, het hulle dit nie geglo nie. Wat sê dit oor ons gebede?","hoofstukke":[["Handelinge","ACT",10],["Handelinge","ACT",11],["Handelinge","ACT",12]]},{"dag":337,"ref":"Jakobus 1 – 2","titel":"Geloof wat Werk","fase":7,"tydlyn":"Moontlik die vroegste brief van die Nuwe Testament (c. 45–49 n.C., voor die vergadering in Jerusalem), hoewel sommige dit later dateer (voor 62 n.C.). Geskryf uit Jerusalem.","agtergrond":"Die skrywer is waarskynlik Jakobus, die broer van Jesus, wat eers nie in Hom geglo het nie (Johannes 7:5), maar ná die opstanding (1 Korintiërs 15:7) die leier van die kerk in Jerusalem geword het. Hy is in 62 n.C. deur die Joodse leiers tereggestel (soos Josefus vertel). Die brief is gerig aan \"die twaalf stamme wat in die verstrooiing is\" – Joodse Christene buite Israel, wat swaarkry en armoede beleef het. Dit is baie prakties en klink soos Spreuke en die Bergrede. Jakobus 2 en Paulus (Romeine 4) gebruik dieselfde voorbeeld (Abraham) verskillend, maar weerspreek mekaar nie: Paulus sê ons word nie deur werke gered nie; Jakobus sê ware geloof wys altyd in werke.","leer":"Beproewings kan ons geloof laat groei, en ons moet God om wysheid vra. Dit is nie genoeg om die Woord te hoor nie – ons moet dit doen. Ware godsdiens sorg vir weduwees en wese en bly onbesmet deur die wêreld. Ons mag nie mense voortrek op grond van rykdom of voorkoms nie. Geloof sonder werke is dood.","skrif":"\"Ag dit louter vreugde, my broeders, wanneer julle in allerhande versoekinge val, omdat julle weet dat die beproefdheid van julle geloof lydsaamheid bewerk\" (1:2–3). \"As iemand van julle wysheid kortkom, laat hy dit van God bid, wat aan almal eenvoudig gee\" (1:5). \"Elke goeie gawe en elke volmaakte geskenk is van bo\" (1:17). \"Laat elke mens gou wees om te hoor, stadig om te spreek, stadig tot toorn\" (1:19). \"En wees daders van die woord en nie net hoorders nie\" (1:22). \"Die suiwere en onbesmette godsdiens voor God... is dit: om wese en weduwees in hul verdrukking te besoek en jouself onbesmet van die wêreld te bewaar\" (1:27). Moenie die ryke bo die arme voortrek nie (2:1–9). \"Jy moet jou naaste liefhê soos jouself\" – die koninklike wet (2:8). \"Geloof, as dit geen werke het nie, is in sigself dood\" (2:17). \"Ook die duiwels glo, en bewe\" (2:19). Abraham en Ragab (2:21–25).","bid":"Bid vir wysheid in elke beproewing. Bid dat ons \"daders van die Woord\" sal wees, nie net hoorders nie. Bid vir weduwees en wese in ons omgewing en vra hoe ons kan help. Bid dat ons niemand sal voortrek op grond van geld of voorkoms nie.","vraag":"Jakobus sê \"wees gou om te hoor, stadig om te praat, stadig om kwaad te word\". Watter een van die drie is vir jou die moeilikste?","hoofstukke":[["Jakobus","JAS",1],["Jakobus","JAS",2]]},{"dag":338,"ref":"Jakobus 3 – 5","titel":"Die Tong, Wysheid van Bo, en die Gebed van 'n Regverdige","fase":7,"tydlyn":"c. 45–62 n.C. Geskryf uit Jerusalem.","agtergrond":"Jakobus gebruik beelde uit die daaglikse lewe: 'n perd se toom, 'n skip se roer, 'n klein vonkie wat 'n bos aan die brand steek, 'n fontein, 'n vyeboom. In hoofstuk 4 waarsku hy teen twis en wêreldsgesindheid, en in hoofstuk 5 teen ryk grondeienaars wat hulle werkers se lone terughou. Hy eindig met gebed vir siekes: die oudstes moet bid en die siekes met olie salf (olie was destyds ook medisyne, en 'n teken van God se seën en die Gees). Elia was \"'n mens net soos ons\", en tog het sy gebed die weer beïnvloed (1 Konings 17–18).","leer":"Ons tong is klein maar uiters kragtig – om te seën of te vervloek. Ware wysheid is rein, vreedsaam, sagmoedig en vol barmhartigheid. Twis kom uit selfsugtige begeertes in ons hart. God weerstaan die hoogmoediges, maar gee genade aan die nederiges. Ons moet ons planne met \"as die Here wil\" maak. Ons moet geduldig wees, vir mekaar bid en ons sondes aan mekaar bely – die gebed van 'n regverdige is kragtig.","skrif":"\"Die tong is 'n klein lid en roem tog groot dinge... 'n klein vuurtjie, hoe groot 'n bos steek dit aan die brand!\" (3:5). \"Uit dieselfde mond kom seën en vloek\" (3:10). \"Die wysheid wat van bo is, is in die eerste plek rein, verder vreedsaam, vriendelik, geseglik, vol barmhartigheid en goeie vrugte\" (3:17). \"Waar kom die oorloë en twiste onder julle vandaan? Nie hiervandaan nie – uit julle welluste?\" (4:1). \"God weerstaan die hoogmoediges, maar aan die nederiges gee Hy genade\" (4:6). \"Onderwerp julle dan aan God; weerstaan die duiwel, en hy sal van julle wegvlug. Nader tot God, en Hy sal tot julle nader\" (4:7–8). \"As die Here wil en ons lewe, sal ons dit of dat doen\" (4:15). \"Wie weet om goed te doen en dit nie doen nie, vir hom is dit sonde\" (4:17). Die lone van die werkers roep (5:4). \"Wees julle ook lankmoedig\" (5:8). \"Bely mekaar die misdade en bid vir mekaar, sodat julle gesond kan word. Die gebed van 'n regverdige het groot krag\" (5:16). Elia was 'n mens net soos ons (5:17).","bid":"Bid oor ons tonge: dat ons woorde in die huis sal seën en nie seermaak nie. Bid vir die \"wysheid van bo\" (3:17). Bid Jakobus 4:7–8 saam: \"Ons onderwerp ons aan God, ons weerstaan die duiwel, ons nader tot God.\" Bid vir siekes wat ons ken.","vraag":"Jakobus vergelyk die tong met 'n klein vonkie wat 'n hele bos aan die brand steek. Het jy al gesien hoe 'n paar woorde groot skade gedoen het – of groot goed?","hoofstukke":[["Jakobus","JAS",3],["Jakobus","JAS",4],["Jakobus","JAS",5]]},{"dag":339,"ref":"Handelinge 13 – 14","titel":"Die Eerste Sendingreis","fase":7,"tydlyn":"c. 46–48 n.C. Antiogië in Sirië, Ciprus, en die provinsie Galasië in die suide van die huidige Turkye (Antiogië in Pisidië, Ikonium, Listra en Derbe).","agtergrond":"Die gemeente in Antiogië (nie Jerusalem nie) word die basis vir sending na die nie-Jode. Barnabas en Saulus word deur die Heilige Gees afgesonder en uitgestuur, met die jong Johannes Markus (later die skrywer van Markus) as helper. Vanaf hierdie punt gebruik Lukas die Romeinse naam Paulus. Paulus se strategie was om eers in die sinagoges te preek, waar Jode en \"godvresende\" nie-Jode die Ou Testament geken het. In Listra dink die mense Barnabas en Paulus is die gode Zeus en Hermes – volgens 'n plaaslike legende het hierdie gode die gebied eens in menslike gedaante besoek.","leer":"Die Heilige Gees lei die kerk in sending, en die kerk moet bid, vas en uitstuur. Die evangelie gaan na Jode é

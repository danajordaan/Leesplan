2: \"Ek was bly toe hulle vir my sê: Laat ons gaan na die huis van die Here\"; \"Bid om die vrede van Jerusalem.\" Psalm 123: \"Soos die oë van die slawe op die hand van hulle here.\" Psalm 124: \"As dit nie die Here was wat by ons was nie...\"; \"Ons hulp is in die Naam van die Here.\" Psalm 125: \"Die wat op die Here vertrou, is soos die berg Sion wat nie wankel nie.\"","bid":"Bid Psalm 121 as 'n seën oor elke kind se \"uitgang en ingang\" – skool toe, sport toe, uit die huis. Dank God dat Hy nooit slaap nie. Bid vir vreugde om saam na God se huis te gaan.","vraag":"Psalm 121 sê God slaap nooit nie. Hoe help dit wanneer jy snags bekommerd is?","hoofstukke":[["Psalms","PSA",120],["Psalms","PSA",121],["Psalms","PSA",122],["Psalms","PSA",123],["Psalms","PSA",124],["Psalms","PSA",125]]},{"dag":273,"ref":"Psalms 126 – 131","titel":"Pelgrimsliedere (II): Huis, Gesin en 'n Stil Hart","fase":5,"tydlyn":"Pelgrimsliedere. Psalm 126 onthou die terugkeer uit ballingskap; Psalm 127 word aan Salomo toegeskryf.","agtergrond":"Psalm 126 vier die terugkeer uit ballingskap – dit was so wonderlik dat dit soos 'n droom gevoel het – en bid vir nog herstel, soos die droë riviere (wadi's) van die Negev in die suide wat skielik met reën vol water word. Psalm 127 en 128 handel oor huis en gesin: God moet die huis bou, en kinders is 'n geskenk van Hom. Psalm 130 is een van die boetepsalms. Psalm 131 is 'n kort psalm oor 'n stil en tevrede hart, soos 'n kind wat nie meer bors drink nie en net rustig by sy ma lê.","leer":"Wat God doen, maak ons bly, en wie in trane saai, sal met gejubel oes. 'n Gesin wat sonder God gebou word, bou tevergeefs. Kinders is 'n erfdeel en geskenk van God. By God is vergewing, en daarom kan ons op Hom hoop. 'n Hart wat nie alles hoef te verstaan of te beheer nie, kan rus vind in God.","skrif":"Psalm 126: \"Toe die Here die lot van Sion verander het, was ons soos die wat droom\"; \"Die wat met trane saai, sal met gejubel maai.\" Psalm 127: \"As die Here die huis nie bou nie, tevergeefs werk die wat daaraan bou\"; \"Kyk, kinders is 'n erfdeel van die Here; die vrug van die skoot is 'n beloning.\" Psalm 128: \"Welgeluksalig is elkeen wat die Here vrees\"; \"Jou kinders soos olyfplante rondom jou tafel.\" Psalm 129: \"Hulle het my nie oorwin nie.\" Psalm 130: \"Uit die dieptes roep ek U aan, o Here!\"; \"As U, Here, die ongeregtighede in ag neem, Here, wie sal bestaan? Maar by U is vergewing\"; \"My siel wag op die Here, meer as die wagters op die môre.\" Psalm 131: \"Waarlik, ek het my siel tot bedaring en stilte gebring, soos 'n gespeende kind by sy moeder.\"","bid":"Dank God vir ons gesin se kinders – 'n erfdeel en geskenk van die Here (Psalm 127). Bid dat God ons huis sal bou. Bid vir elkeen wat \"met trane saai\", dat hulle met vreugde sal oes. Bid vir 'n stil en tevrede hart.","vraag":"Psalm 127 sê as die Here die huis nie bou nie, werk die bouers verniet. Hoe \"bou die Here\" ons gesin?","hoofstukke":[["Psalms","PSA",126],["Psalms","PSA",127],["Psalms","PSA",128],["Psalms","PSA",129],["Psalms","PSA",130],["Psalms","PSA",131]]},{"dag":274,"ref":"Psalms 132 – 135","titel":"Pelgrimsliedere (III): Hoe Goed is Eenheid","fase":5,"tydlyn":"Die laaste pelgrimsliedere (132–134), en Psalm 135 (lof).","agtergrond":"Psalm 132 onthou Dawid se toewyding om 'n woonplek vir die ark te vind (2 Samuel 6–7) en God se belofte aan Dawid: 'n nakomeling op sy troon. Psalm 133 beskryf die skoonheid van eenheid met twee beelde: die kosbare salfolie wat oor Aäron se baard afloop (by sy inwyding as priester), en die dou van die hoë berg Hermon in die noorde wat op die berge van Sion neerdaal – iets wat nie natuurlik gebeur nie, dus 'n seën van God. Psalm 134 is die laaste pelgrimslied, 'n aandseën vir die priesters wat snags in die tempel diens doen.","leer":"God hou Sy beloftes aan Dawid – vervul in Jesus. Eenheid tussen broers en susters is kosbaar, mooi en 'n plek waar God Sy seën gebied. Ons moet God loof, ook in die nag. Die Here is groot, anders as afgode.","skrif":"Psalm 132: \"Die Here het aan Dawid gesweer... Een uit die vrug van jou liggaam sal Ek op jou troon sit\"; \"Daar sal Ek vir Dawid 'n horing laat uitspruit.\" Psalm 133: \"Kyk, hoe goed en hoe lieflik is dit as broers ook eendragtig saamwoon!\"; \"Want daar gebied die Here die seën, die lewe tot in ewigheid.\" Psalm 134: \"Kyk, loof die Here, al julle knegte van die Here wat in die nagte in die huis van die Here staan.\" Psalm 135: \"Loof die Here, want die Here is goed\"; \"Alles wat die Here behaag, doen Hy.\"","bid":"Bid vir eenheid tussen ons gesin se kinders – dat hulle mekaar se grootste ondersteuners sal wees, nou en wanneer hulle groot is. Bid vir eenheid in ons kerk. Dank God dat Hy Sy belofte aan Dawid in Jesus gehou het.","vraag":"Psalm 133 sê God gebied Sy seën waar daar eenheid is. Wat kan elkeen van ons doen om meer eenheid in ons gesin te bring?","hoofstukke":[["Psalms","PSA",132],["Psalms","PSA",133],["Psalms","PSA",134],["Psalms","PSA",135]]},{"dag":275,"ref":"Psalms 136 – 139","titel":"\"U het My Gevorm\" – God Ken My Deur en Deur","fase":5,"tydlyn":"Psalm 136 ('n beurtsang), 137 (in ballingskap in Babel), 138–139 (Dawid).","agtergrond":"Psalm 136 is 'n beurtsang: 'n voorsanger noem een van God se dade, en die volk antwoord elke keer: \"want sy goedertierenheid is tot in ewigheid\" (26 keer). Psalm 137 kom uit die ballingskap: by die riviere van Babel huil die ballinge en weier om die liedere van Sion vir hulle spotters te sing. Die laaste verse is 'n rou kreet om vergelding wat skok – dit wys die diepte van hulle pyn eerlik (verduidelik dat dit 'n gebed is wat oordeel aan God oorlaat, en dat Jesus ons leer om vir ons vyande te bid). Psalm 139 is een van die mees persoonlike psalms: God ken ons volkome en was by ons vorming in die moederskoot betrokke.","leer":"God se liefde is ewig en Hy het dit in die geskiedenis bewys. Ons mag ons diepste pyn en woede eerlik na God bring. God ken ons deur en deur – ons gedagtes, woorde en weë – en Hy het ons wonderlik gemaak. Daar is geen plek waar ons van God kan wegvlug nie. Elke mens, ook die ongeborene, is deur God gevorm en waardevol.","skrif":"Psalm 136: \"Loof die Here, want Hy is goed; want sy goedertierenheid is tot in ewigheid\" (refrein). Psalm 137: \"By die riviere van Babel, daar het ons gesit, ook geween as ons aan Sion dink\"; \"Hoe sou ons die lied van die Here sing in 'n vreemde land?\" Psalm 138: \"Die Here sal dit vir my voleindig.\" Psalm 139: \"Here, U deurgrond en ken my\"; \"Waar sou ek heengaan van u Gees, en waar sou ek heenvlug van u aangesig?\"; \"U het my niere gevorm, my in my moeder se skoot geweef\"; \"Ek loof U omdat ek so vreeslik wonderbaar is\"; \"U oë het my ongevormde klomp gesien; en in u boek was hulle almal opgeskrywe, die dae wat geformeer sou word\"; \"Deurgrond my, o God, en ken my hart... en kyk of daar by my 'n skadelike weg is, en lei my op die ewige weg.\"","bid":"Dank God dat elkeen van ons \"vreeslik wonderbaar\" gemaak is – lees Psalm 139:13–16 oor elke kind. Bid vir kinders en tieners wat met hulle selfbeeld sukkel. Bid Psalm 139:23–24 saam: \"Deurgrond my, o God.\"","vraag":"Psalm 139 sê God het jou in jou ma se skoot gevorm en jy is \"wonderbaar\" gemaak. Hoe verander dit die manier waarop jy oor jouself dink?","hoofstukke":[["Psalms","PSA",136],["Psalms","PSA",137],["Psalms","PSA",138],["Psalms","PSA",139]]},{"dag":276,"ref":"Psalms 140 – 144","titel":"\"Leer My om U Wil te Doen\"","fase":5,"tydlyn":"Psalms van Dawid, waarskynlik uit tye van gevaar. Psalm 142 se opskrif: \"toe hy in die spelonk was\" (vgl. 1 Samuel 22 of 24).","agtergrond":"Hierdie laaste groep Dawidspsalms kom uit tye van druk, vyandskap en vlug. Psalm 141 vra dat God 'n wag voor ons mond sal sit. Psalm 142 is 'n gebed uit 'n grot, waar Dawid voel niemand gee om nie. Psalm 143 is die laaste van die sewe boetepsalms en vra vir leiding. Psalm 144 dank God vir die krag vir die stryd en bid vir 'n gelukkige volk – met seuns soos plante wat groei en dogters soos hoekpilare.","leer":"God is ons skuilplek wanneer ons bedreig of eensaam voel. Ons moet ons woorde bewaak. Wanneer ons voel niemand gee om nie, gee God om. Ons moet God vra om ons te leer om Sy wil te doen, en ons laat lei deur Sy goeie Gees. Ons is maar 'n asem, maar God sien ons raak.","skrif":"Psalm 140: \"Red my, o Here, van die slegte mens.\" Psalm 141: \"Laat my gebed as reukwerk voor u aangesig staan\"; \"Here, sit 'n wag voor my mond, bewaar die deur van my lippe.\" Psalm 142: \"Daar is niemand wat my ken nie... niemand vra na my siel nie\"; \"U is my toevlug, my deel in die land van die lewendes.\" Psalm 143: \"Laat my in die môre u goedertierenheid hoor, want op U vertrou ek; maak my die weg bekend waarop ek moet gaan\"; \"Leer my om u welbehae te doen, want U is my God; laat u goeie Gees my lei op gelyk grond.\" Psalm 144: \"Geloofd sy die Here, my rots, wat my hande oefen vir die stryd\"; \"Here, wat is die mens dat U aan hom dink?... Die mens is soos 'n asem\"; \"Ons seuns soos plantjies wat groot geword het in hul jeug; ons dogters soos hoekpilare.\"","bid":"Bid Psalm 141:3 vir elkeen: \"Here, sit 'n wag voor my mond.\" Bid Psalm 143:10: \"Leer ons om U wil te doen.\" Bid Psalm 144:12 oor die seuns in ons gesin (\"soos plantjies wat groot word\") en oor die dogter in ons gesin (\"soos 'n hoekpilaar\").","vraag":"Psalm 142 is gebid toe Dawid gevoel het niemand gee om nie. Wat sou jy vir 'n vriend sê wat so voel?","hoofstukke":[["Psalms","PSA",140],["Psalms","PSA",141],["Psalms","PSA",142],["Psalms","PSA",143],["Psalms","PSA",144]]},{"dag":277,"ref":"Psalms 145 – 150","titel":"\"Laat Alles wat Asem Het, die Here Loof!\"","fase":5,"tydlyn":"Psalm 145 (Dawid) en die vyf slot-\"Halleluja\"-psalms (146–150), wat die hele Psalmboek afsluit.","agtergrond":"Psalm 145 is 'n alfabetiese lofpsalm van Dawid – die laaste met sy naam. Psalms 146–150 begin en eindig almal met \"Halleluja\" (Hebreeus: \"Loof die Here\"). Die boek Psalms beweeg van klagte na lof: dit begin met die mens wat op God se Woord let (Psalm 1) en eindig met \"alles wat asem het\" wat God loof (Psalm 150). Psalm 150 noem al die instrumente van die tyd – basuin, harp, lier, tamboeryn, snare, fluit en simbale – en roep die hele skepping op om saam te loof.","leer":"God is groot, goed, genadig en getrou – en Hy is naby almal wat Hom in waarheid aanroep. Ons hoop moet nie op mense (prinse) wees nie, maar op God. Hy sorg vir die verdruktes, die honger, die gevangenes, die blindes, die vreemdelinge, die wees en die weduwee. Hy genees die gebrokenes van hart en ken elke ster by die naam. Die doel van alles is lof aan God.","skrif":"Psalm 145: \"Een geslag sal u werke roem by die ander\"; \"Die Here is genadig en barmhartig, lankmoedig en groot van goedertierenheid. Die Here is goed vir almal\"; \"Die Here ondersteun almal wat val\"; \"Die Here is naby almal wat Hom aanroep.\" Psalm 146: \"Vertrou nie op prinse nie\"; \"Die Here ontsluit die oë van die blindes... die Here bewaar die vreemdelinge.\" Psalm 147: \"Hy genees die wat gebroke is van hart en verbind hulle wonde. Hy tel die getal van die sterre; Hy gee hulle almal name.\" Psalm 148: die hele skepping – engele, son, maan, sterre, see, berge, diere, konings, jongmanne en jongmeisies, oumense en kinders – loof die Here. Psalm 149: \"Die Here het 'n welbehae in sy volk.\" Psalm 150: \"Laat alles wat asem het, die Here loof! Halleluja!\"","bid":"Loof God saam vir alles wat ons die afgelope maande in die Ou Testament oor Hom geleer het. Laat elkeen een ding noem waarvoor hy of sy God loof. Sluit af met Psalm 150:6: \"Laat alles wat asem het, die Here loof! Halleluja!\"","vraag":"Psalm 145:4 sê \"een geslag sal U werke roem by die ander\". Wat het jy oor God geleer wat jy eendag vir jou kinders wil vertel?","hoofstukke":[["Psalms","PSA",145],["Psalms","PSA",146],["Psalms","PSA",147],["Psalms","PSA",148],["Psalms","PSA",149],["Psalms","PSA",150]]},{"dag":278,"ref":"1 Kronieke 1 – 4","titel":"Name met 'n Doel – en die Gebed van Jabes","fase":5,"inleiding":["1 en 2 Kronieke: Die Geskiedenis Oorvertel vir 'n Nuwe Begin","Kronieke vertel die geskiedenis van Adam tot by Kores se dekreet, maar vanuit 'n ander hoek as Samuel en Konings. Dit is geskryf ná die ballingskap (waarskynlik c. 450–400 v.C.; Joodse oorlewering noem Esra as skrywer) vir die volk wat teruggekeer het en wonder: Is ons nog God se volk? Is God se beloftes aan Dawid nog geldig? Die Kroniekskrywer antwoord: ja! Hy fokus op Juda, Dawid se huis, die tempel, die aanbidding, en op hoe God reageer wanneer konings Hom soek of verlaat. Hy laat baie van Dawid en Salomo se sondes uit – nie om dit weg te steek nie (die lesers het Samuel en Konings geken), maar om op God se beloftes te fokus.","In die Hebreeuse Bybel is Kronieke die laaste boek, en dit eindig met Kores se uitnodiging: \"Wie onder julle... laat hy optrek!\" Jesus se uitdrukking \"van die bloed van Abel tot die bloed van Sagaria\" (Lukas 11:51) beteken waarskynlik \"van die eerste tot die laaste moord in die Skrif\" – van Genesis 4 tot 2 Kronieke 24.","Omdat ons baie van hierdie gebeure reeds gelees het, fokus die gids op wat Kronieke nuut of anders vertel. Die geslagsregisters (1 Kronieke 1–9) kan vinniger gelees word."],"tydlyn":"Van Adam tot ná die ballingskap – die geslagsregisters.","agtergrond":"Vir die teruggekeerde ballinge was geslagsregisters lewensbelangrik: dit het gewys wie aan watter stam behoort, wie priesters mag wees (Esra 2:62), en dat hulle verbind is aan God se beloftes van die begin af. Kronieke begin by Adam – die hele mensdom – en vernou dan na Abraham, Israel en Juda, en uiteindelik na Dawid (hoofstuk 3), wie se lyn tot ná die ballingskap gevolg word (Serubbabel, 3:19). In die middel van 'n lys van name staan skielik Jabes en sy gebed (4:9–10).","leer":"God ken elke naam en elke familie; elkeen het 'n plek in Sy verhaal. Die lyn van Dawid – waaruit Jesus kom – is deur alle omstandighede bewaar. Selfs 'n mens wie se naam \"pyn\" beteken, kan God aanroep vir 'n ander toekoms – en God antwoord.","skrif":"\"Adam, Set, Enos\" (1:1) – die begin van die mensdom. Abraham, Isak en Israel (1:28–34). Die seuns van Juda (2:3). Die seuns van Dawid wat in Hebron en Jerusalem gebore is (3:1–9). Die koningslyn van Salomo tot Jojagin en Serubbabel (3:10–19). \"Jabes was meer geëerd as sy broers; en sy moeder het hom Jabes genoem en gesê: Want ek het hom met smart gebaar. En Jabes het die God van Israel aangeroep en gesê: Ag, as U my ryklik seën en my grondgebied vergroot, en u hand met my is... En God het laat kom wat hy gevra het\" (4:9–10).","bid":"Dank God dat Hy elkeen van ons by die naam ken en dat ons deel is van Sy groot verhaal. Bid vir enigiemand wat voel hulle verlede of naam bepaal hulle toekoms. Bid Jabes se gebed vir ons gesin: dat God se hand met ons sal wees en ons van die kwaad bewaar.","vraag":"Jabes se naam het \"pyn\" beteken, maar hy het God gevra vir 'n ander toekoms. Wat sê dit vir iemand wat dink sy verlede bepaal sy toekoms?","hoofstukke":[["1 Kronieke","1CH",1],["1 Kronieke","1CH",2],["1 Kronieke","1CH",3],["1 Kronieke","1CH",4]]},{"dag":279,"ref":"1 Kronieke 5 – 9","titel":"Die Stamme, die Priesters en die Teruggekeerdes","fase":5,"tydlyn":"Die stamme van Israel, en (hoofstuk 9) die eerste inwoners van Jerusalem ná die ballingskap.","agtergrond":"Die registers gaan voort met die stamme oos van die Jordaan (Ruben, Gad, halwe Manasse), wat weggevoer is omdat hulle ontrou was (5:25–26). Hoofstuk 6 gee die geslagsregister van Levi en die priesters – belangrik vir die tempeldiens – en noem die sangers wat Dawid aangestel het (Heman, Asaf, Etan – name wat ons uit die Psalms ken). Hoofstuk 9 lys die mense wat ná die ballingskap in Jerusalem gaan woon het: die geskiedenis is nie verby nie, God se volk is terug.","leer":"God beloon geloof en straf ontrouheid. Hy het 'n plek vir elke diens in Sy huis – ook vir die sangers, poortwagters en dié wat die gereedskap versorg. Ons is deel van 'n lang ketting van getroues wat God gedien het, en ons moet die fakkel verder dra.","skrif":"Die stamme oos van die Jordaan \"het tot God geroep in die oorlog, en Hy het Hom deur hulle laat verbid, omdat hulle op Hom vertrou het\" (5:20). Maar hulle \"het ontrou geword aan die God van hulle vaders\" (5:25). Die sangers wat Dawid aangestel het (6:31–33). Die stamme Benjamin, Naftali, Manasse, Efraim, Aser (7–8). \"En die hele Israel is in geslagsregisters opgeskrywe... en Juda is weggevoer na Babel weens hulle ontrou\" (9:1). Die eerste inwoners wat teruggekeer het (9:2–34). Die poortwagters en die Leviete wat \"dag en nag in hulle werk was\" (9:33).","bid":"Dank God vir die mense voor ons wat getrou was en ons die geloof oorgedra het – ouers, grootouers, kerkleiers. Bid dat ons die fakkel getrou verder sal dra. Bid vir dié wat in die kerk agter die skerms dien.","vraag":"Wie in ons familie se geskiedenis het die geloof aan ons oorgedra? Wat weet ons van hulle?","hoofstukke":[["1 Kronieke","1CH",5],["1 Kronieke","1CH",6],["1 Kronieke","1CH",7],["1 Kronieke","1CH",8],["1 Kronieke","1CH",9]]},{"dag":280,"ref":"1 Kronieke 10 – 12","titel":"Saul se Einde en Dawid se Helde","fase":5,"tydlyn":"c. 1010–1003 v.C. Die gebergte Gilboa, Hebron en Jerusalem.","agtergrond":"Kronieke slaan Saul se regering grotendeels oor en begin met sy dood, met 'n duidelike verklaring van die rede (10:13–14). Dan spring dit na Dawid wat deur \"die hele Israel\" as koning gesalf word. Hoofstuk 11–12 lys die helde en mense wat by Dawid aangesluit het – selfs tydens sy vlug vir Saul – uit al die stamme. Die manne van Issaskar word beskryf as mense \"wat verstand gehad het van die tye, om te weet wat Israel moes doen\" (12:32).","leer":"Ontrouheid aan God en die raadpleeg van ander bronne het gevolge. God bou Sy koninkryk deur mense wat Hom en Sy gesalfde koning met hulle hele hart dien. Ons het mense nodig wat die tye verstaan en weet wat om te doen, en mense wat met 'n \"onverdeelde hart\" toegewyd is. Lojaliteit en opoffering vir 'n goeie leier is 'n deug.","skrif":"\"So het Saul gesterwe weens sy ontrouheid... en ook omdat hy 'n dodebesweerder geraadpleeg het... en die Here nie geraadpleeg het nie\" (10:13–14). \"Toe het die hele Israel... na Dawid in Hebron gekom\" (11:1). \"Dawid het al groter geword, want die Here van die leërskare was met hom\" (11:9). Die drie helde wat deur die vyand se laer breek om vir Dawid water uit die put van Betlehem te haal, en hy giet dit uit vir die Here (11:17–19). \"Joune is ons, o Dawid... vrede, vrede vir jou\" (12:18). Die manne van Issaskar \"wat verstand gehad het van die tye\" (12:32). Hulle het gekom \"met 'n volkome hart\" (12:38).","bid":"Bid vir wysheid vir ons gesin se kinders om \"die tye te verstaan\" – om die wêreld waarin hulle leef met God se oë te sien en te weet wat om te doen. Bid vir 'n onverdeelde hart vir God. Dank Jesus, ons Koning, vir wie dit die moeite werd is om alles te gee.","vraag":"Die manne van Issaskar het \"die tye verstaan\". Wat moet 'n Christen-tiener vandag van ons tye verstaan om reg te kan optree?","hoofstukke":[["1 Kronieke","1CH",10],["1 Kronieke","1CH",11],["1 Kronieke","1CH",12]]},{"dag":281,"ref":"1 Kronieke 13 – 16","titel":"Die Ark Kom na Jerusalem – met Lof en Danklied","fase":5,"tydlyn":"c. 1000 v.C. Kirjat-Jearim en Jerusalem.","agtergrond":"Kronieke gee baie meer aandag as Samuel aan die koms van die ark na Jerusalem. Die eerste poging misluk wanneer Ussa sterf (13), omdat hulle nie die ark gedra het soos God beveel het nie. Die tweede keer doen Dawid dit reg: die Leviete dra die ark met stokke op hulle skouers (15:13–15), met groot vreugde, musiek en sang. Dawid stel Leviete aan om voortdurend die Here te loof. Die danklied in 16:8–36 is saamgestel uit gedeeltes van Psalm 105, 96 en 106.","leer":"Ons moet God aanbid met vreugde én met eerbied, op Sy manier. Om God se riglyne te soek, is noodsaaklik; goeie bedoelings is nie genoeg nie. Lof en danksegging is 'n wesenlike deel van ons verhouding met God. Ons moet God se dade onthou en dit aan die nasies verkondig.","skrif":"Ussa sterf (13:9–10). \"Die Here onse God het 'n bres onder ons geslaan, omdat ons Hom nie gesoek het soos dit behoort nie\" (15:13). Die Leviete dra die ark op hulle skouers met die stokke (15:15). Musiek met harpe, siters, simbale en basuine (15:16, 28). Dawid stel Leviete aan om \"die Here... te prys en te loof\" (16:4). \"Loof die Here, roep sy Naam aan, maak onder die volke sy dade bekend\" (16:8). \"Soek die Here en sy sterkte, soek gedurigdeur sy aangesig\" (16:11). \"Gee aan die Here die eer van sy Naam... aanbid die Here in heilige sieraad\" (16:29). \"Loof die Here, want Hy is goed, want sy goedertierenheid is tot in ewigheid\" (16:34).","bid":"Bid saam die danklied van 1 Kronieke 16:8–12. Dank God vir musiek en lofprysing. Bid dat ons God altyd met vreugde én eerbied sal aanbid, volgens Sy Woord.","vraag":"Die eerste poging om die ark te bring was vol vreugde, maar verkeerd gedoen. Wat leer dit ons oor hoe ons God aanbid?","hoofstukke":[["1 Kronieke","1CH",13],["1 Kronieke","1CH",14],["1 Kronieke","1CH",15],["1 Kronieke","1CH",16]]},{"dag":282,"ref":"1 Kronieke 17 – 20","titel":"God se Belofte aan Dawid en sy Oorwinnings","fase":5,"tydlyn":"c. 1000–990 v.C. Jerusalem en die buurvolke.","agtergrond":"Hoofstuk 17 is Kronieke se weergawe van God se verbond met Dawid (vgl. 2 Samuel 7) – die hart van die boek. Dit was vir die teruggekeerde volk, sonder 'n koning, die grond van hulle hoop: God het belowe dat Dawid se troon vir ewig sal staan. Hoofstuk 18–20 vat Dawid se oorwinnings saam. Let op wat Kronieke uitlaat: die verhaal van Batseba en Uria (2 Samuel 11–12) word nie vertel nie. Hoofstuk 20:1 sê net \"Dawid het in Jerusalem gebly\" – die lesers sou die res van die verhaal geken het.","leer":"God se beloftes is die fondament van ons hoop, selfs wanneer omstandighede donker lyk. Hy bou 'n \"huis\" – 'n ewige koninkryk – wat in Jesus vervul word. Ons reaksie is nederige verwondering en dankbare gebed. God gee oorwinning aan dié wat Hy kies.","skrif":"\"Ek sal jou nakomeling ná jou verwek... en Ek sal sy troon vir ewig bevestig. Ek sal vir hom 'n Vader wees, en hy sal vir My 'n seun wees\" (17:11–13; vgl. Hebreërs 1:5). \"Ek sal my goedertierenheid nie van hom laat wyk nie\" (17:13). \"Ek sal hom in my huis en in my koninkryk vir ewig laat bestaan\" (17:14). \"Wie is ek, Here God, en wat is my huis, dat U my tot hiertoe gebring het?\" (17:16). \"Here, daar is niemand soos U nie\" (17:20). \"Die Here het Dawid verlos oral waar hy gegaan het\" (18:6, 13). Dawid \"het reg en geregtigheid gedoen vir sy hele volk\" (18:14).","bid":"Dank God vir Sy ewige belofte, vervul in Jesus die Seun van Dawid. Bid Dawid se gebed: \"Wie is ons, Here, dat U ons gesin tot hiertoe gebring het?\" Dank God vir oorwinnings in ons lewe.","vraag":"Waarom dink jy het hierdie belofte aan Dawid so baie vir die volk ná die ballingskap beteken?","hoofstukke":[["1 Kronieke","1CH",17],["1 Kronieke","1CH",18],["1 Kronieke","1CH",19],["1 Kronieke","1CH",20]]},{"dag":283,"ref":"1 Kronieke 21 – 22","titel":"Die Sensus, die Dorsvloer en die Opdrag aan Salomo","fase":5,"tydlyn":"Laat in Dawid se regering, c. 975–970 v.C. Jerusalem: die dorsvloer van Ornan (Arauna) op die berg Moria.","agtergrond":"2 Samuel 24:1 sê die Here het Dawid aangehits om die volk te tel; 1 Kronieke 21:1 sê \"die Satan\" het dit gedoen. Albei is waar vanuit verskillende perspektiewe: God het toegelaat dat Satan Dawid versoek, as deel van Sy oordeel (vgl. Job 1–2). Die sonde was om in getalle (militêre sterkte) te vertrou. Die plek waar die plaag stop, word die terrein van die tempel – op die berg Moria, waar Abraham Isak sou offer (2 Kronieke 3:1). In hoofstuk 22 begin Dawid met groot voorbereidings vir die tempel en gee hy die opdrag aan Salomo.","leer":"Om op ons eie sterkte te vertrou, is sonde. Ware berou erken sonde ten volle en vra om self die gevolge te dra eerder as ander. God se genade verander die plek van oordeel in 'n plek van aanbidding – soos die kruis. Ouers moet die volgende geslag toerus en aanmoedig om God se werk voort te sit.","skrif":"\"Toe het die Satan teen Israel opgestaan en Dawid aangehits om Israel te tel\" (21:1). \"Ek het swaar gesondig\" (21:8). \"Laat my tog in die hand van die Here val, want sy barmhartighede is baie groot\" (21:13). Dawid: \"Is ek nie die een wat gesê het om die volk te tel nie?... Maar hierdie skape, wat het hulle gedoen?\" (21:17). \"Ek sal nie... brandoffers bring wat my niks kos nie\" (21:24). God antwoord met vuur uit die hemel (21:26). \"Hier sal die huis van die Here God wees\" (22:1). \"My seun Salomo is jonk en teer\" (22:5). \"Wees sterk en hou moed; wees nie bevrees en wees nie verskrik nie\" (22:13). \"Staan dan op en doen dit, en die Here sal met jou wees\" (22:16).","bid":"Bid teen die versoeking om op ons eie sterkte te vertrou. Bid vir harte wat werklik berou het. Bid vir Pappa en Mamma om ons gesin se kinders goed toe te rus vir die werk wat God vir hulle het. Bid 1 Kronieke 22:13 oor elke kind.","vraag":"Dawid het baie voorberei sodat Salomo die tempel kon bou. Hoe berei ouers hulle kinders voor vir wat God vir hulle het?","hoofstukke":[["1 Kronieke","1CH",21],["1 Kronieke","1CH",22]]},{"dag":284,"ref":"1 Kronieke 23 – 27","titel":"Orde in God se Huis: Elkeen 'n Plek en 'n Taak","fase":5,"tydlyn":"Laat in Dawid se regering. Jerusalem.","agtergrond":"Dawid organiseer die Leviete, priesters, sangers, poortwagters, skatbewaarders, regters en leërbevelvoerders. Die priesters word in 24 afdelings ingedeel wat in beurte in die tempel dien (24:7–19). Hierdie stelsel het tot in die tyd van Jesus bestaan: Sagaria, die vader van Johannes die Doper, was \"van die afdeling van Abia\" (Lukas 1:5; vgl. 24:10) en het in die tempel gedien toe die engel aan hom verskyn het. Die sangers het \"geprofeteer met siters, harpe en simbale\" (25:1). (Lees die name gerus vinniger.)","leer":"God is 'n God van orde, en daar is 'n plek vir elkeen in Sy diens – ook vir die musikante, poortwagters, administrateurs en bestuurders. Musiek en lof is 'n roeping. Klein en groot, onderwyser en leerling, het almal 'n deel. Getroue diens in beurte, ook wanneer dit roetine is, kan die plek wees waar God Hom openbaar.","skrif":"Die Leviete \"om die Here te loof en te prys, elke môre... en net so in die aand\" (23:30). Die 24 afdelings van die priesters (24:1–19), waaronder Abia (24:10). Die sangers wat \"geprofeteer het met siters\" (25:1). \"Klein sowel as groot, die onderwyser saam met die leerling\" (25:8). Die poortwagters (26). Die leërafdelings en die amptenare oor die koning se besittings (27).","bid":"Dank God vir elkeen se plek en taak in ons gesin en in die kerk. Bid vir die musikante en dié wat in die kerk dien. Bid vir getrouheid in die gewone, roetine take.","vraag":"Sagaria het in sy beurt in die tempel gedien toe die engel gekom het. Wat leer dit ons oor getrouheid in gewone take?","hoofstukke":[["1 Kronieke","1CH",23],["1 Kronieke","1CH",24],["1 Kronieke","1CH",25],["1 Kronieke","1CH",26],["1 Kronieke","1CH",27]]},{"dag":285,"ref":"1 Kronieke 28 – 29","titel":"Dawid se Laaste Woorde: \"Ken die God van Jou Vader\"","fase":5,"tydlyn":"c. 970 v.C. Jerusalem. Dawid se laaste openbare toesprake en sy dood.","agtergrond":"Dawid roep al die leiers van Israel bymekaar en gee die tempelplan – wat hy \"deur die hand van die Here\" ontvang het – aan Salomo. Dan gee die koning, die leiers en die volk ruim en met blydskap vir die tempel. Dawid se gebed in 29:10–19 is een van die mooiste gebede in die Bybel; die bekende slotwoorde van die \"Onse Vader\" in sommige weergawes (\"want aan U behoort die koninkryk en die krag en die heerlikheid\") is waarskynlik geïnspireer deur 29:11.","leer":"Die belangrikste ding wat 'n vader aan sy kinders kan oordra, is om die God van hulle vader persoonlik te ken en Hom met 'n volkome hart en gewillige siel te dien. God deurgrond elke hart. Alles wat ons het, kom van God, en wat ons gee, is maar om aan Hom terug te gee uit Sy hand. Vrygewigheid bring vreugde.","skrif":"\"En jy, my seun Salomo, ken die God van jou vader en dien Hom met 'n volkome hart en met 'n gewillige siel; want die Here deurgrond al die harte... As jy Hom soek, sal Hy Hom deur jou laat vind\" (28:9). \"Wees sterk en moedig en voer dit uit... want die Here God, my God, is met jou; Hy sal jou nie begewe en jou nie verlaat nie\" (28:20). Die volk gee met 'n volkome hart, en \"die volk was bly\" (29:9). \"Aan U, Here, kom toe die grootheid en die mag en die roem en die glorie en die majesteit... aan U, Here, kom toe die koninkryk\" (29:11). \"Want wie is ek, en wat is my volk, dat ons in staat sou wees om so gewillig te gee? Want alles kom van U, en uit u hand het ons dit aan U gegee\" (29:14). \"Ons is vreemdelinge voor u aangesig... ons dae op die aarde is soos 'n skaduwee\" (29:15). Dawid sterf \"in 'n goeie ouderdom, versadig van dae\" (29:28).","bid":"Pappa: bid 1 Kronieke 28:9 oor ons gesin se kinders – dat elkeen die God van hulle vader persoonlik sal ken en Hom met 'n volkome hart sal dien. Bid Dawid se lofgebed (29:10–13) saam. Dank God dat alles wat ons het, uit Sy hand kom.","vraag":"Dawid sê vir Salomo: \"Ken die God van jou vader.\" Wat is die verskil tussen God ken omdat jou pa Hom ken, en Hom self ken?","hoofstukke":[["1 Kronieke","1CH",28],["1 Kronieke","1CH",29]]},{"dag":286,"ref":"2 Kronieke 1 – 5","titel":"Salomo se Wysheid en die Bou van die Tempel","fase":5,"tydlyn":"c. 970–959 v.C. Gibeon en Jerusalem.","agtergrond":"Kronieke vertel Salomo se regering grotendeels as 'n goue era, met die tempel in die middelpunt (hoofstuk 2–7 handel oor die tempel). 2 Kronieke 3:1 gee 'n detail wat nêrens anders staan nie: die tempel is gebou op die berg Moria, op die dorsvloer van Ornan – dieselfde plek waar Abraham Isak sou offer (Genesis 22:2). Die tempel verbind dus die hele verhaal: Abraham se offer, Dawid se berou, en die plek waar God se volk Hom eeue lank sou ontmoet – in die stad waar Jesus later gekruisig sou word.","leer":"Om God te dien, begin met om Hom om wysheid te vra. God verdien ons beste. Die tempel was 'n plek waar die verhaal van God se voorsiening (Abraham), genade (Dawid) en teenwoordigheid bymekaarkom – 'n prentjie van Jesus, in wie God by ons woon. Wanneer God se volk Hom eendragtig loof, kom Sy heerlikheid.","skrif":"\"Gee my nou wysheid en kennis\" (1:10). \"Die huis wat ek gaan bou, is groot, want onse God is groter as al die gode\" (2:5). \"Maar wie het die krag om vir Hom 'n huis te bou, terwyl die hemel, ja, die hemel van die hemele Hom nie kan bevat nie?\" (2:6). \"Salomo het begin om die huis van die Here te bou in Jerusalem op die berg Moria... op die plek wat Dawid gereed gemaak het, op die dorsvloer van Ornan\" (3:1). Die ark word in die Allerheiligste gebring (5:7). Die sangers en musikante \"soos een man\" (5:13). \"Want Hy is goed, want sy goedertierenheid is tot in ewigheid\" – en die huis word met 'n wolk vervul (5:13–14).","bid":"Bid vir wysheid en kennis vir elkeen in hulle take. Dank God dat Hy, so groot dat die hemel Hom nie kan bevat nie, by ons wil woon. Bid vir eenheid in ons gesin se aanbidding – \"soos een man\".","vraag":"2 Kronieke 3:1 sê die tempel is gebou op die plek waar Abraham Isak sou offer. Hoe verbind dit die verhaal van Abraham met Jesus?","hoofstukke":[["2 Kronieke","2CH",1],["2 Kronieke","2CH",2],["2 Kronieke","2CH",3],["2 Kronieke","2CH",4],["2 Kronieke","2CH",5]]},{"dag":287,"ref":"2 Kronieke 6 – 7","titel":"Salomo se Gebed en God se Belofte: \"As My Volk...\"","fase":5,"tydlyn":"c. 959 v.C. Die inwyding van die tempel, tydens die Huttefees.","agtergrond":"Salomo se gebed (hoofstuk 6) is ook in 1 Konings 8 opgeteken. Kronieke voeg twee dinge by: vuur uit die hemel wat die offers verteer (7:1), en God se antwoord in 7:12–22, wat die bekende 7:14 insluit. Vir die teruggekeerde volk was dit 'n sleutelvers: ná die verwoesting en ballingskap het God belowe dat Hy sal hoor en herstel wanneer Sy volk hulle verootmoedig, bid, Hom soek en hulle bekeer. Dit is spesifiek aan God se verbondsvolk gerig, en word vandag deur Christene gebruik as 'n oproep tot gebed vir hulle land.","leer":"God hoor die gebede van Sy volk. Herstel begin by God se eie volk – nie by die wêreld nie: wanneer ons ons verootmoedig, bid, Sy aangesig soek en ons van ons sonde bekeer. God belowe om dan te hoor, te vergewe en te genees. Maar Hy waarsku ook ernstig teen afvalligheid.","skrif":"\"Want daar is geen mens wat nie sondig nie\" (6:36). \"As hulle tot inkeer kom in die land waarheen hulle weggevoer is, en hulle bekeer\" (6:37–38). \"Staan dan nou op, Here God, na u rusplek\" (6:41). Vuur kom uit die hemel en die heerlikheid vul die huis (7:1). Die volk kniel: \"want Hy is goed, want sy goedertierenheid is tot in ewigheid\" (7:3). \"As my volk oor wie my Naam uitgeroep is, hulle verootmoedig en bid en my aangesig soek en hulle van hul verkeerde weë bekeer, dan sal Ek uit die hemel hoor en hulle sonde vergewe en hulle land genees\" (7:14). \"Nou sal my oë oop wees en my ore luister na die gebed op hierdie plek\" (7:15). Die waarskuwing as hulle afwyk (7:19–22).","bid":"Bid 2 Kronieke 7:14 vir Suid-Afrika: dat Christene hulle sal verootmoedig, bid, God se aangesig soek en hulle bekeer – en dat God ons land sal genees. Begin by onsself: bely as gesin enige sonde.","vraag":"2 Kronieke 7:14 begin met \"my volk\" – nie die regering of die wêreld nie. Waarom dink jy begin herstel by God se eie mense?","hoofstukke":[["2 Kronieke","2CH",6],["2 Kronieke","2CH",7]]},{"dag":288,"ref":"2 Kronieke 8 – 9","titel":"Salomo se Glorie","fase":5,"tydlyn":"c. 959–930 v.C. Jerusalem en die ryk van Salomo.","agtergrond":"Kronieke beskryf Salomo se bouprojekte, sy handel (met skepe na Ofir), die besoek van die koningin van Skeba en sy groot rykdom. Anders as 1 Konings 11, vertel Kronieke nie van Salomo se vroue en afgodery nie – die fokus is op God se belofte wat in Salomo vervul is. Die lesers sou die volle verhaal geken het. Die beeld van nasies wat met geskenke na Jerusalem kom om die wysheid wat God gegee het te hoor, wys vorentoe na die wyse manne wat na Jesus gekom het (Matteus 2:11) en na die nasies wat na God se lig kom (Jesaja 60).","leer":"God se seën is werklik en kan oorvloedig wees. Maar alle aardse glorie is tydelik. Jesus het gesê: \"Hier is meer as Salomo\" (Matteus 12:42) – die ware Koning wie se wysheid en heerlikheid nie verbygaan nie. God gee wysheid sodat ons reg en geregtigheid kan doen.","skrif":"Salomo bring die offers volgens die gebod van Moses (8:13). Die koningin van Skeba kom met harde vrae (9:1). \"Die helfte van die grootheid van jou wysheid is my nie meegedeel nie\" (9:6). \"Geseënd is die Here jou God... wat jou tot koning aangestel het om reg en geregtigheid te doen\" (9:8). \"Koning Salomo was groter as al die konings van die aarde in rykdom en wysheid\" (9:22). \"En al die konings van die aarde het die aangesig van Salomo gesoek om sy wysheid te hoor wat God in sy hart gegee het\" (9:23). Salomo sterf ná 40 jaar (9:30–31).","bid":"Dank God vir Sy seëninge oor ons gesin. Bid dat ons nooit die Gewer vir die gawes sal vergeet nie. Dank Jesus dat Hy \"meer as Salomo\" is.","vraag":"Die koningin van Skeba het van ver af gekom om Salomo se wysheid te hoor. Hoe ver sou jy gaan om Jesus te leer ken?","hoofstukke":[["2 Kronieke","2CH",8],["2 Kronieke","2CH",9]]},{"dag":289,"ref":"2 Kronieke 10 – 13","titel":"Die Skeuring en Abia se Toespraak","fase":5,"tydlyn":"c. 930–910 v.C. Sigem en Jerusalem; die berg Semaraim.","agtergrond":"Kronieke vertel die verdeling van die ryk, maar volg daarna net die konings van Juda (Dawid se lyn) – die noordelike konings word net genoem waar hulle met Juda te make het. Rehabeam verlaat God se wet sodra hy sterk is, maar verootmoedig hom wanneer Sisak inval (12:6–7). Abia (in 1 Konings \"Abiam\") se toespraak in hoofstuk 13 vat Kronieke se teologie saam: God het die koninkryk aan Dawid se huis gegee, en Hy is met dié wat Hom nie verlaat nie. Hy wen 'n geveg teen 'n twee keer groter leër omdat hulle op die Here vertrou het.","leer":"Wanneer ons sterk en gemaklik word, is ons in gevaar om God te vergeet. Maar wanneer ons ons verootmoedig, is God genadig. Dié wat die Here soek, kom uit al die stamme na Jerusalem – getrouheid aan God gaan bo politieke grense. Om op die Here te steun, gee oorwinning teen 'n groter oormag.","skrif":"Rehabeam volg die jongmanne se raad (10:13–14). Die Leviete en ander uit die noorde kom na Juda \"wat hul hart daarop gerig het om die Here... te soek\" (11:16). \"Toe die koningskap van Rehabeam bevestig was... het hy die wet van die Here verlaat\" (12:1). Rehabeam en die leiers verootmoedig hulle: \"Die Here is regverdig\" (12:6). \"Hy het gedoen wat verkeerd was, want hy het sy hart nie daarop gerig om die Here te soek nie\" (12:14). Abia se toespraak: \"Ons – die Here is onse God, en ons het Hom nie verlaat nie\" (13:10). \"Kyk, God is met ons aan die hoof\" (13:12). \"Die kinders van Juda het die oorhand gekry, omdat hulle op die Here... gesteun het\" (13:18).","bid":"Bid dat ons nie God sal vergeet wanneer dit goed gaan nie. Bid dat ons harte \"daarop gerig sal wees om die Here te soek\" (12:14). Dank God vir die oorwinnings wat Hy gee wanneer ons op Hom steun.","vraag":"2 Kronieke 12:14 sê Rehabeam het gesondig omdat hy sy hart nie gerig het om die Here te soek nie. Wat beteken dit om jou hart daarop te \"rig\"?","hoofstukke":[["2 Kronieke","2CH",10],["2 Kronieke","2CH",11],["2 Kronieke","2CH",12],["2 Kronieke","2CH",13]]},{"dag":290,"ref":"2 Kronieke 14 – 16","titel":"Asa: Goeie Begin, Swak Einde","fase":5,"tydlyn":"Asa regeer 911–870 v.C. Juda.","agtergrond":"Kronieke gee baie meer detail oor Asa as Konings. Hy begin uitstekend: hy verwyder die afgode, bid in 'n krisis teen 'n reuse Kusitiese leër, en lei die volk in 'n verbond om God met hulle hele hart te soek. Die profeet Asarja moedig hom aan. Maar in sy 36ste jaar, wanneer Israel hom bedreig, koop hy hulp by die koning van Aram met die skatte van die tempel. Wanneer die siener Hanani hom teregwys, gooi Asa hom in die tronk. Selfs in sy siekte soek hy nie die Here nie.","leer":"Dit is nie genoeg om goed te begin nie – ons moet goed eindig. God se oë soek mense wie se harte volkome aan Hom gewy is. Om in 'n krisis op mense eerder as op God te steun, is 'n verval van geloof. Wanneer ons teregwys word, moet ons nederig luister, nie kwaad word nie.","skrif":"Asa se gebed: \"Here, by U is daar geen onderskeid om te help... help ons, Here onse God, want op U steun ons\" (14:11). \"Die Here is met julle as julle met Hom is; en as julle Hom soek, sal Hy Hom deur julle laat vind\" (15:2). \"Maar julle, wees sterk en laat julle hande nie slap word nie, want daar is loon vir julle arbeid\" (15:7). Die verbond om die Here te soek \"met hulle hele hart\" (15:12, 15). Asa koop hulp by Aram (16:2–3). \"Want die oë van die Here gaan oor die hele aarde, om Hom sterk te betoon aan dié wie se hart volkome na Hom uitgaan\" (16:9). Asa word kwaad vir die siener (16:10). In sy siekte \"het hy nie die Here gesoek nie, maar die geneeshere\" (16:12).","bid":"Bid vir 'n lewe wat goed eindig, nie net goed begin nie. Bid 2 Kronieke 16:9 oor ons gesin: dat ons harte volkome na God sal uitgaan. Bid vir nederigheid wanneer ons teregwys word.","vraag":"Asa het in 'n groot krisis op God vertrou, maar later in 'n kleiner krisis op mense. Waarom dink jy het hy so verander?","hoofstukke":[["2 Kronieke","2CH",14],["2 Kronieke","2CH",15],["2 Kronieke","2CH",16]]},{"dag":291,"ref":"2 Kronieke 17 – 20","titel":"Josafat: \"Ons Oë is op U\"","fase":5,"tydlyn":"Josafat regeer c. 872–848 v.C. Juda; die woestyn van Tekoa.","agtergrond":"Josafat stuur leiers en Leviete deur die land om die volk uit die wetboek te leer (17:7–9), en stel regters aan. Sy swak punt was sy alliansie met die goddelose Agab van Israel (hy het selfs sy seun met Agab se dogter laat trou, 18:1; 21:6). In hoofstuk 20 val 'n groot koalisie van Moab, Ammon en Meunieters aan. Josafat se reaksie is 'n model: hy roep 'n vas uit, staan voor die volk en bid, en erken dat hulle nie weet wat om te doen nie. Hy stuur die sangers voor die leër uit – en God verwar die vyand sodat hulle mekaar doodmaak.","leer":"'n Goeie leier sorg dat God se Woord geleer word. Alliansies met mense wat God nie volg nie, bring ons in gevaar. Wanneer ons nie weet wat om te doen nie, is die regte reaksie om ons oë op God te rig. Die stryd behoort aan die Here. Lof en vertroue kan die eerste \"wapen\" wees in 'n krisis.","skrif":"Josafat \"het die God van sy vader gesoek\" (17:4). Die Leviete leer die volk uit die wetboek (17:9). Josafat sluit 'n alliansie met Agab (18:1). Die siener Jehu: \"Moet jy die goddelose help en die wat die Here haat, liefhê?\" (19:2). \"Let op wat julle doen, want julle oordeel nie vir 'n mens nie, maar vir die Here\" (19:6). \"Ons weet nie wat ons moet doen nie, maar ons oë is op U\" (20:12). \"Wees nie bevrees nie... want die stryd is nie julle s'n nie, maar God s'n\" (20:15). \"Staan, en aanskou die verlossing van die Here\" (20:17). \"Glo in die Here julle God, dan sal julle bevestig word\" (20:20). Die sangers gaan voor die leër uit: \"Loof die Here, want sy goedertierenheid is tot in ewigheid\" (20:21–22).","bid":"Bid vir elke situasie waar ons nie weet wat om te doen nie: \"Here, ons weet nie wat om te doen nie, maar ons oë is op U\" (20:12). Dank God dat die stryd aan Hom behoort. Bid vir wysheid in vriendskappe en verhoudings.","vraag":"Josafat het gebid \"ons weet nie wat om te doen nie, maar ons oë is op U\". Wanneer laas het jy so gevoel? Wat het jy gedoen?","hoofstukke":[["2 Kronieke","2CH",17],["2 Kronieke","2CH",18],["2 Kronieke","2CH",19],["2 Kronieke","2CH",20]]},{"dag":292,"ref":"2 Kronieke 21 – 24","titel":"Joas en die Martelaar Sagaria","fase":5,"tydlyn":"c. 848–796 v.C. Juda en Jerusalem.","agtergrond":"Joram trou met Agab se dogter Atalia en volg Agab se weë; hy vermoor sy broers. Ná sy dood neem Atalia die troon oor en probeer die koninklike lyn uitroei – maar die baba Joas word in die tempel weggesteek (soos 2 Konings 11). Kronieke voeg 'n belangrike detail by oor Joas se latere jare: ná die dood van die priester Jojada, wat sy mentor was, draai Joas na afgode. Wanneer Jojada se seun, die profeet Sagaria, die volk teregwys, laat die koning hom in die voorhof van die tempel stenig. Jesus verwys hierna in Lukas 11:51 en Matteus 23:35.","leer":"Geloof wat op 'n mentor leun en nie eie wortel het nie, kan verwelk wanneer die mentor weg is. Ondankbaarheid is 'n verskriklike sonde: Joas vermoor die seun van die man wat sy lewe gered het. Om God se woord te bring, kan die hoogste prys kos. God se plan (die lyn van Dawid) word deur moedige mense bewaar.","skrif":"Joram \"het gewandel in die weg van die konings van Israel... want die dogter van Agab was sy vrou\" (21:6). \"Ter wille van die verbond wat Hy met Dawid gesluit het\" spaar God die huis van Dawid (21:7). Joseba red Joas (22:11). \"Joas het gedoen wat reg was in die oë van die Here al die dae van die priester Jojada\" (24:2). Ná Jojada se dood luister die koning na die leiers en dien afgode (24:17–18). Sagaria: \"Waarom oortree julle die gebooie van die Here?... Omdat julle die Here verlaat het, het Hy julle verlaat\" (24:20). Hulle stenig hom op die koning se bevel (24:21). \"Koning Joas het nie gedink aan die guns wat sy vader Jojada aan hom bewys het nie\" (24:22). Sagaria se laaste woorde: \"Mag die Here dit sien en vergeld!\" (24:22).","bid":"Bid dat elkeen van ons kinders se geloof hulle eie sal wees, met diep wortels, sodat dit bly staan ook wanneer Pappa en Mamma nie daar is nie. Bid vir dankbare harte. Bid vir vervolgde gelowiges wat hulle lewe vir hul getuienis waag.","vraag":"Joas het God gedien solank sy mentor geleef het. Hoe kan jy seker maak jou geloof is jou eie en nie net jou ouers s'n nie?","hoofstukke":[["2 Kronieke","2CH",21],["2 Kronieke","2CH",22],["2 Kronieke","2CH",23],["2 Kronieke","2CH",24]]},{"dag":293,"ref":"2 Kronieke 25 – 28","titel":"Hoogmoed kom voor die Val: Ussia en Agas","fase":5,"tydlyn":"c. 796–715 v.C. Juda. Ussia regeer 52 jaar (792–740 v.C.).","agtergrond":"Amasia gehoorsaam God halfhartig, en aanbid later die gode van die Edomiete wat hy verslaan het – wat vir die profeet absurd was (25:15). Ussia (ook Asarja genoem) was een van Juda se suksesvolste konings: hy het die leër versterk, torings gebou, landbou ontwikkel en uitvindings gebruik. Hy het die Here gesoek \"in die dae van Sagaria\" (nie dieselfde as die martelaar of die latere profeet nie). Maar sy sukses maak hom trots, en hy gaan die tempel binne om self reukwerk te brand – 'n taak net vir priesters. Hy word melaats en woon tot sy dood afgesonder. Jotam was goed; Agas was een van die slegste konings en het sy seuns aan Molog geoffer en die tempel gesluit.","leer":"God se seën kan ons trots maak as ons vergeet dat dit van Hom kom. Hoogmoed wat oor God se grense gaan, bring 'n val. Om die Here te soek, bring voorspoed; om Hom in nood te verlaat in plaas van na Hom te draai, maak dinge net erger. Die goedheid van een geslag (Jotam) waarborg nie die volgende s'n (Agas) nie.","skrif":"Amasia \"het gedoen wat reg was... maar nie met 'n volkome hart nie\" (25:2). \"God het mag om te help en om te laat struikel\" (25:8). Ussia \"het die Here gesoek in die dae van Sagaria... en so lank as hy die Here gesoek het, het God hom voorspoedig gemaak\" (26:5). \"Hy is wonderbaar gehelp totdat hy sterk geword het\" (26:15). \"Maar toe hy sterk geword het, het sy hart hoog geword tot sy verderf\" (26:16). Ussia word melaats in die tempel (26:19–21). Jotam \"het sy weë vasgestel voor die aangesig van die Here sy God\" (27:6). Agas offer sy seuns (28:3). \"In die tyd van sy benoudheid het hy nog meer ontrou geword aan die Here – dieselfde koning Agas\" (28:22).","bid":"Bid dat sukses ons nooit trots sal maak nie. Bid vir 'n volkome hart, nie 'n halwe nie. Bid dat ons in tye van nood na God toe sal draai, nie van Hom af weg nie.","vraag":"Ussia is \"wonderbaar gehelp totdat hy sterk geword het\" (26:15). Waarom maak sukses dit soms moeiliker om op God te vertrou?","hoofstukke":[["2 Kronieke","2CH",25],["2 Kronieke","2CH",26],["2 Kronieke","2CH",27],["2 Kronieke","2CH",28]]},{"dag":294,"ref":"2 Kronieke 29 – 32","titel":"Hiskia: Herlewing en 'n Paasfees vir Almal","fase":5,"tydlyn":"Hiskia regeer c. 715–686 v.C. Jerusalem. Die noordryk het in 722 v.C. geval.","agtergrond":"Kronieke gee baie meer aandag aan Hiskia se geestelike hervorming as 2 Konings (waar die fokus op Sanherib se inval val). In die eerste maand van sy regering maak Hiskia die tempeldeure oop wat sy vader Agas gesluit het, laat die tempel reinig, en herstel die aanbidding met musiek. Merkwaardig: hy stuur boodskappers deur die hele land – ook na die oorblyfsel van die noordelike stamme ná die val van Samaria – om almal na Jerusalem te nooi vir die Paasfees. Baie lag vir die boodskappers, maar party kom. Hiskia bid vir dié wat nie volgens die reëls rein was nie, en God genees die volk.","leer":"Herlewing begin by die huis van God: deur die deure oop te maak, die sonde uit te dra, en God weer te aanbid. God se uitnodiging is vir almal, selfs vir die \"vyand\" in die noorde. God kyk na die hart meer as na die korrekte uitvoering van rituele. Vreugde volg wanneer God se volk weer na Hom terugkeer.","skrif":"\"In die eerste jaar van sy regering, in die eerste maand, het hy die deure van die huis van die Here oopgemaak\" (29:3). \"Julle moet nou nie nalatig wees nie, want die Here het julle uitverkies\" (29:11). Lof met musiek terwyl die brandoffer gebring word (29:27–28). \"Julle kinders van Israel, bekeer julle tot die Here... want die Here julle God is genadig en barmhartig, en Hy sal sy aangesig nie van julle afwend as julle julle tot Hom bekeer nie\" (30:9). Hulle lag en spot met die boodskappers, maar sommige verootmoedig hulle en kom (30:10–11). \"Die goeie Here doen versoening vir elkeen wat sy hart daarop gerig het om God te soek\" (30:18–19). \"En daar was groot blydskap in Jerusalem\" (30:26). Hiskia \"het dit met sy hele hart gedoen en was voorspoedig\" (31:21). Teen Sanherib: \"Met hom is 'n arm van vlees, maar met ons is die Here onse God om ons te help en ons oorloë te voer\" (32:8).","bid":"Bid vir herlewing in ons kerk en land – dat die \"deure\" van God se huis oopgemaak sal word en Sy volk na Hom sal terugkeer. Bid vir mense wat lag wanneer ons hulle nooi; bid dat sommige sal kom. Dank God dat Hy na die hart kyk.","vraag":"Hiskia het selfs mense uit die noordryk – die \"vyand\" – na die fees genooi. Wie sou jy na die kerk of na Jesus wil nooi, al dink jy hulle sal dalk lag?","hoofstukke":[["2 Kronieke","2CH",29],["2 Kronieke","2CH",30],["2 Kronieke","2CH",31],["2 Kronieke","2CH",32]]},{"dag":295,"ref":"2 Kronieke 33 – 36","titel":"Manasse se Berou, Josia, die Val, en Kores se Uitnodiging","fase":5,"tydlyn":"Manasse 697–642 v.C.; Josia 640–609 v.C.; die val van Jerusalem 586 v.C.; Kores se dekreet 538 v.C.","agtergrond":"Kronieke vertel iets oor Manasse wat Konings nie vertel nie: nadat hy deur die Assiriërs met hake na Babel weggevoer is, verootmoedig hy hom, bid, en God bring hom terug. Hy verwyder daarna die afgode. Dit is een van die grootste voorbeelde van God se genade in die Bybel – selfs die slegste koning kan berou hê en vergewe word. Josia se hervorming en sy dood by Megiddo word vertel (Jeremia het oor hom 'n klaaglied gemaak, 35:25). Die boek eindig met die val van Jerusalem, die 70 jaar van Jeremia, en Kores se dekreet – die einde van die Hebreeuse Bybel is 'n uitnodiging om op te trek.","leer":"Geen mens is te sleg vir God se genade as hy hom werklik verootmoedig en bekeer nie. God stuur telkens Sy boodskappers uit ontferming, maar daar kom 'n punt waar Sy geduld met volgehoue spot en verwerping ophou. Selfs in oordeel het God 'n tydsplan en 'n plan vir herstel. Die Ou Testament eindig met 'n uitnodiging – en wag op die Een wat sal kom.","skrif":"Manasse word met hake na Babel weggevoer (33:11). \"Toe hy in benoudheid was, het hy die Here sy God gesmeek en hom diep verootmoedig... en hy het tot Hom gebid, en Hy het Hom deur hom laat verbid... en Manasse het erken dat die Here God is\" (33:12–13). Josia: \"Terwyl hy nog jonk was, het hy begin om die God van sy vader Dawid te soek\" (34:3). Die wetboek gevind (34:14–21). Josia se Paasfees (35:1–19). \"Die Here... het vroeg en laat na hulle gestuur deur sy boodskappers, want Hy het Hom ontferm oor sy volk... Maar hulle het die boodskappers van God bespot... totdat die grimmigheid van die Here teen sy volk opgeklim het, sodat daar geen genesing meer was nie\" (36:15–16). Die land het sy sabbatte gevier totdat sewentig jaar vol was (36:21). \"So sê Kores, die koning van Persië: Al die koninkryke van die aarde het die Here, die God van die hemel, aan my gegee, en Hy het my opgedra om vir Hom 'n huis te bou in Jerusalem... Wie onder julle uit sy hele volk is, die Here sy God sy met hom, en laat hy optrek!\" (36:23).","bid":"Dank God dat Sy genade groot genoeg was selfs vir Manasse – en vir elkeen van ons. Bid vir mense wat dink hulle is \"te sleg\" vir God. Bid dat ons nie God se boodskappers sal bespot nie. Dank God dat die Ou Testament eindig met hoop en 'n uitnodiging – wat in Jesus vervul word.","vraag":"Manasse was die slegste koning, en tog het God hom vergewe toe hy berou gehad het. Wat leer dit jou oor God se genade?","hoofstukke":[["2 Kronieke","2CH",33],["2 Kronieke","2CH",34],["2 Kronieke","2CH",35],["2 Kronieke","2CH",36]]},{"dag":296,"ref":"Matteus 1 – 2","titel":"Die Koning word Gebore","fase":6,"tydlyn":"c. 6–4 v.C. (Jesus is gebore voor die dood van Herodes die Grote in 4 v.C.). Betlehem, Jerusalem, Egipte en Nasaret.","agtergrond":"Matteus begin met 'n geslagsregister wat Jesus as \"seun van Dawid, seun van Abraham\" voorstel – die erfgenaam van albei groot beloftes. Die register is in drie groepe van 14 geslagte georden, en noem vyf vroue (Tamar, Ragab, Rut, \"die vrou van Uria\" en Maria) – onder wie buitelanders en mense met 'n skandelike verlede. Die \"wyse manne\" (Grieks: magoi) was sterrekundiges/geleerdes uit die Ooste, waarskynlik Persië of Babilonië. Herodes die Grote was berug vir sy paranoïa – hy het selfs drie van sy eie seuns laat doodmaak – so die moord op die seuntjies van Betlehem pas by sy karakter.","leer":"Jesus is die vervulling van God se beloftes aan Abraham en Dawid. God se genade sluit buitestaanders en sondaars in Sy plan in. Jesus is \"Immanuel\" – God met ons – en Hy kom om \"sy volk van hulle sondes te verlos\". Sommige (die wyse manne) soek en aanbid Hom; ander (Herodes) sien Hom as 'n bedreiging. Josef wys hoe 'n regverdige man God gehoorsaam.","skrif":"\"Die geslagsregister van Jesus Christus, die seun van Dawid, die seun van Abraham\" (1:1). \"En jy moet hom Jesus noem, want dit is Hy wat sy volk van hulle sondes sal verlos\" (1:21). \"Kyk, die maagd sal swanger word en 'n seun baar, en hulle sal hom Immanuel noem, wat beteken: God met ons\" (1:23; Jesaja 7:14). Josef doen \"soos die engel van die Here hom beveel het\" (1:24). \"Waar is die Koning van die Jode wat gebore is?\" (2:2). Betlehem uit Miga 5 (2:6). Goud, wierook en mirre (2:11). \"Uit Egipte het Ek my Seun geroep\" (2:15; Hosea 11:1). Ragel ween oor haar kinders (2:18; Jeremia 31:15). Hy sal 'n Nasarener genoem word (2:23).","bid":"Dank God dat Jesus Immanuel is – God met ons. Dank Hom dat Sy genade buitestaanders en sondaars insluit. Bid dat ons, soos die wyse manne, Jesus sal soek en Hom ons beste sal gee. Bid vir pa's om soos Josef gehoorsaam en beskermend te wees.","vraag":"Die wyse manne het van ver af gekom om Jesus te aanbid, maar Herodes, wat naby was, wou Hom doodmaak. Waarom dink jy reageer mense so verskillend op Jesus?","hoofstukke":[["Matteus","MAT",1],["Matteus","MAT",2]]},{"dag":297,"ref":"Matteus 3 – 4","titel":"Die Doop en die Versoeking","fase":6,"tydlyn":"c. 27–29 n.C. Die Jordaanrivier, die woestyn van Judea, en Galilea (Kapernaum).","agtergrond":"Johannes die Doper vervul Jesaja 40:3 en Maleagi 3:1. Hy het soos Elia geklee gegaan (vgl. 2 Konings 1:8). Jesus word gedoop, nie omdat Hy gesondig het nie, maar om \"alle geregtigheid te vervul\" – Hy identifiseer Hom met die sondaars wat Hy kom red. By die doop is die Vader, Seun en Gees teenwoordig. Dan word Jesus 40 dae in die woestyn versoek – soos Israel 40 jaar in die woestyn versoek is en gefaal het. Jesus antwoord al drie versoekings met aanhalings uit Deuteronomium 6–8.","leer":"Ware bekering wys in die vrugte van 'n veranderde lewe. Jesus is die geliefde Seun in wie die Vader 'n welbehae het. Waar Israel (en Adam) gefaal het, het Jesus gehoorsaam gebly. Ons kan versoeking weerstaan met God se Woord. Jesus roep gewone mense om Hom te volg en \"vissers van mense\" te word.","skrif":"\"Bekeer julle, want die koninkryk van die hemele het naby gekom\" (3:2). \"Lewer dan vrugte wat by die bekering pas\" (3:8). \"Laat dit nou toe, want so pas dit ons om alle geregtigheid te vervul\" (3:15). \"Dit is my geliefde Seun in wie Ek 'n welbehae het\" (3:17). \"As U die Seun van God is...\" (4:3, 6). \"Die mens sal nie van brood alleen lewe nie\" (4:4; Deut. 8:3). \"Jy mag die Here jou God nie versoek nie\" (4:7; Deut. 6:16). \"Die Here jou God moet jy aanbid en Hom alleen dien\" (4:10; Deut. 6:13). \"Kom agter My aan, en Ek sal julle vissers van mense maak\" (4:19).","bid":"Bid dat ons lewe \"vrugte van bekering\" sal toon. Dank God dat Jesus waar ons gefaal het, volmaak gehoorsaam was. Bid dat ons God se Woord so goed sal ken dat ons versoekings daarmee kan beantwoord – leer as gesin een vers uit Deuteronomium 6–8 uit die kop.","vraag":"Die duiwel het Jesus versoek om sy identiteit te \"bewys\" (\"As U die Seun van God is...\"). Hoe probeer die wêreld ons soms laat \"bewys\" wie ons is?","hoofstukke":[["Matteus","MAT",3],["Matteus","MAT",4]]},{"dag":298,"ref":"Matteus 5 – 7","titel":"Die Bergrede: Die Lewe in die Koninkryk","fase":6,"tydlyn":"c. 28 n.C. Op 'n berg in Galilea, naby die See van Galilea.","agtergrond":"Die Bergrede is Jesus se langste toespraak en die \"grondwet\" van Sy koninkryk. Soos Moses die wet van 'n berg (Sinai) gegee het, leer Jesus nou van 'n berg – maar met 'n gesag wat die skrifgeleerdes nie gehad het nie: \"Julle het gehoor... maar Ek sê vir julle.\" Hy kom nie om die wet af te skaf nie, maar om dit te vervul en die ware bedoeling daarvan te wys: dit gaan oor die hart, nie net uiterlike optrede nie. (Dit is drie hoofstukke; julle kan dit gerus oor 'n paar sessies versprei of op een deel fokus.)","leer":"Die burgers van Jesus se koninkryk is geseënd – nie omdat hulle sterk en gewild is nie, maar omdat hulle arm van gees, sagmoedig en hongerig na geregtigheid is. Ons moet sout en lig in die wêreld wees. God kyk na die hart: woede, wellus, wraak en skynheiligheid is ook sonde. Ons moet eerste die koninkryk van God soek, en dan nie bekommerd wees nie. Wie Jesus se woorde hoor en doen, bou op die rots.","skrif":"Die saligsprekinge: \"Salig is die wat arm van gees is, want aan hulle behoort die koninkryk van die hemele\" (5:3–12). \"Julle is die sout van die aarde... julle is die lig van die wêreld\" (5:13–14). \"Ek het nie gekom om te ontbind nie, maar om te vervul\" (5:17). Woede (5:21–22), wellus in die hart (5:27–28), \"Het julle vyande lief en bid vir die wat julle vervolg\" (5:44). Gee, bid en vas in die verborgene (6:1–18). Die \"Onse Vader\" (6:9–13). \"Waar julle skat is, daar sal julle hart ook wees\" (6:21). \"Wees nie besorg nie... Kyk na die voëls\" (6:25–26). \"Soek eers die koninkryk van God en sy geregtigheid, en al hierdie dinge sal vir julle bygevoeg word\" (6:33). \"Oordeel nie, sodat julle nie geoordeel word nie\" (7:1). \"Bid, en vir julle sal gegee word; soek, en julle sal vind\" (7:7). \"Alles dan wat julle wil hê dat die mense aan julle moet doen, net so moet julle ook aan hulle doen\" (7:12). Die nou poort (7:13–14). Die huis op die rots (7:24–27).","bid":"Bid die \"Onse Vader\" saam, stadig, en gesels oor elke deel. Bid dat ons sout en lig sal wees in ons skool en omgewing. Bid vir genade om ons vyande lief te hê en nie bekommerd te wees nie.","vraag":"Watter een van die saligsprekinge (5:3–12) is vir jou die moeilikste om te verstaan of te leef? Waarom?","hoofstukke":[["Matteus","MAT",5],["Matteus","MAT",6],["Matteus","MAT",7]]},{"dag":299,"ref":"Matteus 8 – 9","titel":"Jesus se Gesag oor Siekte, Natuur, Demone en Sonde","fase":6,"tydlyn":"c. 28 n.C. Kapernaum en die See van Galilea.","agtergrond":"Ná die Bergrede (Jesus se gesag in woorde) wys Matteus Jesus se gesag in dade – tien wonderwerke in twee hoofstukke. 'n Romeinse offisier ('n hoofman oor honderd) wat 'n nie-Jood was, se geloof oortref dié van Israel. Melaatses was uitgesluit en onrein, maar Jesus raak hulle aan. Matteus vertel ook van sy eie roeping: hy was 'n tollenaar, deur die Jode verag as verraaier en sondaar.","leer":"Jesus het gesag oor alles – siekte, die natuur, die bose en selfs sonde. Geloof is om Hom op Sy woord te neem. Om Jesus te volg kos iets, en Hy is nie tevrede met halfhartige navolging nie. Hy het gekom vir sondaars, nie vir dié wat dink hulle is regverdig nie. Die oes is groot – ons moet bid vir werkers.","skrif":"Jesus raak die melaatse aan: \"Ek wil; word gereinig\" (8:3). Die hoofman oor honderd: \"Spreek net 'n woord\" – \"Selfs in Israel het Ek nie so 'n groot geloof gevind nie\" (8:8–10). \"Die Seun van die mens het nie 'n plek waar Hy sy hoof kan neerlê nie\" (8:20). \"Volg My, en laat die dooies hulle dooies begrawe\" (8:22). Hy bedaar die storm: \"Waarom is julle so bang, kleingelowiges?\" (8:26). Die besetenes van Gadara (8:28–34). \"Seun, jou sondes is jou vergewe\" (9:2). Matteus word geroep (9:9). \"Dit is nie die gesondes wat 'n geneesheer nodig het nie, maar die sieke... Ek het gekom om sondaars tot bekering te roep\" (9:12–13). Die vrou met die bloedvloeiing en Jaïrus se dogter (9:18–26). \"Hy het innig jammer gevoel vir hulle, omdat hulle uitgeput en verstrooid was soos skape wat geen herder het nie\" (9:36). \"Die oes is wel groot, maar die arbeiders is min. Bid dan die Here van die oes\" (9:37–38).","bid":"Dank Jesus vir Sy gesag oor alles in ons lewe. Bid vir siekes wat ons ken. Bid vir mense wat \"uitgeput en verstrooid\" is. Bid die Here van die oes om werkers – en vra of Hy een van ons wil stuur.","vraag":"Jesus het geëet met tollenaars en sondaars. Wie is die \"tollenaars en sondaars\" in jou skool, en hoe sou Jesus hulle behandel?","hoofstukke":[["Matteus","MAT",8],["Matteus","MAT",9]]},{"dag":300,"ref":"Matteus 10 – 11","titel":"Uitgestuur, en die Uitnodiging tot Rus","fase":6,"tydlyn":"c. 28–29 n.C. Galilea.","agtergrond":"Jesus stuur die twaalf apostels (\"gestuurdes\") uit om dieselfde boodskap te preek en dieselfde werke te doen as Hy. Hy waarsku dat hulle teenstand en vervolging sal kry – selfs van familie. In hoofstuk 11 twyfel Johannes die Doper, nou in die tronk van Herodes, of Jesus regtig die Messias is; Jesus antwoord met die woorde van Jesaja 35 en 61. Die stede waar Jesus die meeste wonders gedoen het (Chorasin, Betsaida, Kapernaum), het hulle nie bekeer nie. Die hoofstuk eindig met een van Jesus se teerste uitnodigings. 'n \"Juk\" was 'n houtbalk wat twee osse saam laat trek het; rabbi's het van die \"juk van die wet\" gepraat.","leer":"Jesus stuur Sy volgelinge uit met Sy gesag en Sy boodskap. Ons hoef nie mense te vrees nie, want God sorg vir elke mossie en het elke haar op ons kop getel. Om Jesus te volg, kan ons iets kos, ook in ons verhoudings. Selfs groot geloofshelde twyfel soms, en Jesus antwoord hulle met liefde. Jesus nooi die moeë en belaste om by Hom rus te vind.","skrif":"\"Gratis het julle ontvang, gratis moet julle gee\" (10:8). \"Wees dan verstandig soos die slange en opreg soos die duiwe\" (10:16). \"Vrees nie die wat die liggaam doodmaak... vrees eerder Hom\" (10:28). \"Word nie twee mossies vir 'n duit verkoop nie?... Selfs die hare van julle hoof is almal getel\" (10:29–30). \"Elkeen dan wat My sal bely voor die mense, hom sal Ek ook bely voor my Vader\" (10:32). \"Wie sy lewe vind, sal dit verloor; en wie sy lewe verloor om My ontwil, sal dit vind\" (10:39). 'n Beker koue water (10:42). Johannes vra: \"Is U die Een wat sou kom?\" (11:3). \"Blindes sien weer en kreupeles loop\" (11:5). \"Kom na My toe, almal wat vermoeid en belas is, en Ek sal julle rus gee. Neem my juk op julle... want Ek is sagmoedig en nederig van hart, en julle sal rus vind vir julle siele\" (11:28–29).","bid":"Bid vir moed om Jesus voor mense te bely. Dank God dat Hy selfs die hare op ons kop getel het. Bring elkeen se \"vermoeidheid en las\" na Jesus – skoolstres, bekommernisse, verhoudings – en ontvang Sy rus.","vraag":"Johannes die Doper het getwyfel. Hoe het Jesus op sy twyfel gereageer? Wat sê dit vir jou as jy twyfel?","hoofstukke":[["Matteus","MAT",10],["Matteus","MAT",11]]},{"dag":301,"ref":"Matteus 12 – 13","titel":"Die Here van die Sabbat en die Gelykenisse van die Koninkryk","fase":6,"tydlyn":"c. 29 n.C. Galilea en by die See van Galilea.","agtergrond":"Die Fariseërs het baie reëls oor die sabbat gemaak, soos 39 kategorieë werk wat verbode was (selfs om koring te pluk en te vryf, het as oes en dors gegeld). Jesus se konflik met hulle word skerper; hulle beskuldig Hom dat Hy demone uitdryf deur Beëlsebul (Satan). In hoofstuk 13 begin Jesus in gelykenisse leer: alledaagse verhale (saai, onkruid, mosterdsaad, suurdeeg, skatte, visnette) wat die geheimenisse van die koninkryk openbaar aan dié wat wil hoor.","leer":"Jesus is Here van die sabbat; die sabbat is gegee om goed te doen en mense te seën, nie om hulle te belas nie. Jesus se familie is dié wat God se wil doen. Ons woorde wys wat in ons hart is. God se koninkryk begin klein, groei onopvallend, en is meer werd as alles. Hoe ons die Woord hoor (die grond van ons hart), bepaal of dit vrug dra.","skrif":"\"Die Seun van die mens is Here ook van die sabbat\" (12:8). \"Dit is geoorloof om op die sabbat goed te doen\" (12:12). Jesaja se Kneg: \"Die geknakte riet sal Hy nie verbreek nie\" (12:20). \"Wie nie met My is nie, is teen My\" (12:30). \"Uit die oorvloed van die hart praat die mond\" (12:34). Die teken van Jona (12:39–41). \"Wie die wil doen van my Vader... dit is my broer en suster en moeder\" (12:50). Die saaier (13:3–23). Die onkruid tussen die koring (13:24–30). Die mosterdsaad en die suurdeeg (13:31–33). \"Die koninkryk van die hemele is soos 'n skat wat in die land verborge is... en hy gaan van blydskap daaroor en verkoop alles wat hy het\" (13:44). Die pêrel van groot waarde (13:45–46). In Nasaret word Hy verwerp (13:57).","bid":"Bid dat ons harte \"goeie grond\" sal wees. Bid dat ons woorde sal wys dat ons harte vol van God is. Bid dat ons die koninkryk sal sien as die skat wat meer werd is as alles.","vraag":"In die gelykenis verkoop die man alles vir die skat \"van blydskap\". Wat beteken dit dat om Jesus te volg nie net 'n opoffering is nie, maar 'n vreugde?","hoofstukke":[["Matteus","MAT",12],["Matteus","MAT",13]]},{"dag":302,"ref":"Matteus 14 – 16","titel":"\"U is die Christus\" – en die Kruis","fase":6,"tydlyn":"c. 29 n.C. Galilea, die See van Galilea, die gebied van Tirus en Sidon, en Sesarea Filippi.","agtergrond":"Hierdie hoofstukke loop parallel met Markus 6–8 (wat ons op Dag 3 gelees het), maar Matteus voeg besonderhede by: Petrus wat op die water na Jesus loop, en Jesus se woorde aan Petrus ná sy belydenis. \"Petrus\" (Grieks Petros) beteken \"rots\" (petra). Christene verstaan 16:18 verskillend: dat die kerk gebou word op Petrus as die eerste apostel, of op sy belydenis van Jesus as die Christus, of op Christus self. Almal stem saam dat Jesus Sy kerk bou en dat die poorte van die doderyk dit nie sal oorweldig nie.","leer":"Jesus het mag oor die natuur en voorsien vir ons behoeftes. Wanneer ons ons oë op Jesus hou, kan ons oor die storms loop; wanneer ons na die wind kyk, sink ons – maar Hy gryp ons. Die belangrikste vraag in die lewe is: \"Wie sê jy is Ek?\" Ware navolging beteken om onsself te verloën en ons kruis op te neem.","skrif":"Johannes die Doper word onthoof (14:1–12). Die vyfduisend gevoed (14:13–21). Petrus loop op die water: \"Here, as dit U is, beveel my om na U op die water te kom\" (14:28). \"Toe hy die sterk wind sien, het hy bang geword en begin sink... Here, red my!\" (14:30). \"Kleingelowige, waarom het jy getwyfel?\" (14:31). \"Waarlik, U is die Seun van God\" (14:33). Die Kananese vrou se geloof (15:21–28). \"U is die Christus, die Seun van die lewende God\" (16:16). \"Vlees en bloed het dit nie aan jou geopenbaar nie, maar my Vader\" (16:17). \"Op hierdie rots sal Ek my gemeente bou, en die poorte van die doderyk sal dit nie oorweldig nie\" (16:18). \"Gaan weg agter My, Satan!\" (16:23). \"As iemand agter My aan wil kom, moet hy homself verloën en sy kruis opneem en My volg\" (16:24). \"Wat sal dit 'n mens help as hy die hele wêreld win, maar skade ly aan sy siel?\" (16:26).","bid":"Bid dat ons ons oë op Jesus sal hou in die storms van die lewe. Bid Petrus se kort gebed wanneer ons sink: \"Here, red my!\" Laat elkeen self sê wie Jesus vir hom of haar is.","vraag":"Petrus het gesink toe hy na die wind gekyk het. Wat is die \"wind\" wat jou aandag van Jesus af wegtrek?","hoofstukke":[["Matteus","MAT",14],["Matteus","MAT",15],["Matteus","MAT",16]]},{"dag":303,"ref":"Matteus 17 – 18","titel":"Die Verheerliking en die Kinders van die Koninkryk","fase":6,"tydlyn":"c. 29 n.C. 'n Hoë berg (tradisioneel Tabor, of moontlik Hermon) en Kapernaum.","agtergrond":"Ná die verheerliking (soos Markus 9) leer Jesus oor geloof (soos 'n mosterdsaad) en betaal Hy die tempelbelasting op 'n wonderbaarlike manier. Hoofstuk 18 is 'n toespraak oor die lewe in die gemeenskap van Sy volgelinge: wie die grootste is, die waarde van \"klein\" mense, die verlore skaap, hoe om konflik te hanteer (18:15–17), en vergifnis. 'n Talent was gelykstaande aan sowat 20 jaar se loon vir 'n arbeider; 10 000 talente was 'n onmoontlike skuld. 'n Denarie was een dag se loon.","leer":"Ons moet word soos kinders – nederig en afhanklik – om die koninkryk in te gaan. God gee baie om oor die \"kleintjies\" en gaan elke verlore skaap soek. Ons moet ernstig wees met sonde, en konflik eerlik en persoonlik hanteer. Omdat God ons 'n onbetaalbare skuld vergewe het, moet ons ander onbeperk vergewe.","skrif":"\"Dit is my geliefde Seun... luister na Hom!\" (17:5). \"As julle geloof het soos 'n mosterdsaad... sal niks vir julle onmoontlik wees nie\" (17:20). \"Tensy julle verander en word soos die kindertjies, sal julle nooit in die koninkryk van die hemele ingaan nie\" (18:3). \"Wie een van hierdie kleintjies wat in My glo, laat struikel...\" (18:6). Die verlore skaap: \"dit is nie die wil van julle Vader... dat een van hierdie kleintjies verlore gaan nie\" (18:12–14). As jou broer teen jou sondig, gaan wys hom tussen jou en hom alleen (18:15). \"Waar twee of drie in my Naam vergader, daar is Ek in hulle midde\" (18:20). \"Hoeveel maal moet ek my broer vergewe?... nie tot sewe maal nie, maar tot sewentig maal sewe maal\" (18:21–22). Die onbarmhartige dienskneg (18:23–35).","bid":"Bid vir 'n kinderlike, nederige geloof. Bid vir kinders wat seergemaak of misbruik word. Bid vir genade om mekaar in die huis onbeperk te vergewe. Bid vir moed om konflik eerlik en persoonlik aan te spreek, nie agter mense se rug nie.","vraag":"Jesus sê ons moet \"sewentig maal sewe\" vergewe. Wat maak dit moeilik om iemand weer en weer te vergewe? Wat help?","hoofstukke":[["Matteus","MAT",17],["Matteus","MAT",18]]},{"dag":304,"ref":"Matteus 19 – 20","titel":"Huwelik, Kinders, Rykdom en Ware Grootheid","fase":6,"tydlyn":"c. 30 n.C. Op pad van Galilea na Jerusalem, deur Perea en Jerigo.","agtergrond":"Rabbi's het oor die gronde vir egskeiding gestry: die skool van Sjammai het dit net vir ontrouheid toegelaat, die skool van Hillel vir byna enige rede. Jesus gaan terug na God se oorspronklike plan in Genesis 1–2. Die gelykenis van die arbeiders in die wingerd (hoofstuk 20) sou die luisteraars geskok het: die werkers wat net een uur gewerk het, kry dieselfde loon (een denarie, 'n dagloon) as dié wat die hele dag gewerk het. Die ma van Jakobus en Johannes vra vir die ereplekke vir haar seuns.","leer":"God se plan vir die huwelik is een man en een vrou vir die lewe. Kinders is vir Jesus belangrik. Rykdom kan 'n groot hindernis wees om God te volg, maar by God is alle dinge moontlik. God se genade is nie loon vir ons werk nie, maar 'n vrygewige geskenk. Ware grootheid in Jesus se koninkryk is om te dien, soos Hy gekom het om te dien en Sy lewe as losprys te gee.","skrif":"\"Het julle nie gelees dat Hy wat hulle in die begin gemaak het, hulle man en vrou gemaak het?... Wat God dan saamgevoeg het, mag die mens nie skei nie\" (19:4–6). \"Laat die kindertjies staan, en verhinder hulle nie om na My te kom nie\" (19:14). Die ryk jongman (19:16–22). \"Dit is makliker vir 'n kameel om deur die oog van 'n naald te gaan as vir 'n ryk man om in die koninkryk van God in te gaan\" (19:24). \"By die mense is dit onmoontlik, maar by God is alle dinge moontlik\" (19:26). \"Baie wat eerste is, sal die laaste wees\" (19:30). Die arbeiders in die wingerd (20:1–16). \"Is jou oog nydig omdat ek goed is?\" (20:15). \"Wie onder julle groot wil word, moet julle dienaar wees\" (20:26). \"Die Seun van die mens het nie gekom om gedien te word nie, maar om te dien en sy lewe te gee as 'n losprys vir baie\" (20:28). Twee blindes by Jerigo (20:29–34).","bid":"Bid vir die huwelike in ons familie en vir die toekomstige huwelike van ons gesin se kinders. Bid dat geld nooit ons hart van God sal wegtrek nie. Dank God dat Sy genade 'n geskenk is. Bid vir 'n hart wat dien.","vraag":"In die gelykenis kry almal dieselfde loon. Waarom dink jy was dit vir die eerste werkers onregverdig, en wat leer dit ons oor God se genade?","hoofstukke":[["Matteus","MAT",19],["Matteus","MAT",20]]},{"dag":305,"ref":"Matteus 21 – 22","titel":"Die Koning in Jerusalem: Konfrontasie in die Tempel","fase":6,"tydlyn":"Die laaste week, c. 30 of 33 n.C. Jerusalem en die tempel.","agtergrond":"Hierdie hoofstukke volg die intog en die tempelreiniging (soos Markus 11–12), maar Matteus voeg drie gelykenisse by wat teen die godsdienstige leiers gerig is: die twee seuns, die wynbouers, en die huweliksfees. In die antieke wêreld is gaste vir 'n groot fees vooraf uitgenooi en dan op die dag geroep. Om die uitnodiging van 'n koning te verwerp, was 'n groot belediging. Die leiers probeer Jesus met strikvrae vang: oor belasting (Fariseërs en Herodiane), oor die opstanding (Sadduseërs), en oor die grootste gebod.","leer":"Jesus is die nederige Koning wat in Jerusalem inry. God wil nie net woorde nie, maar gehoorsaamheid (die twee seuns). Wie Jesus verwerp, verwerp God. God se uitnodiging is vir almal, maar ons moet daarop reageer en \"klere\" van geregtigheid aanhê. Die hele wet hang aan twee gebooie: liefde vir God en liefde vir ons naaste.","skrif":"\"Hosanna vir die Seun van Dawid! Geseënd is Hy wat kom in die Naam van die Here\" (21:9). \"My huis sal 'n huis van gebed genoem word\" (21:13). Uit die mond van kindertjies het U lof berei (21:16). Die twee seuns: \"Ek gaan, heer – en hy het nie gegaan nie\" (21:28–31). Die tollenaars en hoere gaan voor julle in die koninkryk in (21:31). Die wynbouers (21:33–44). \"Die steen wat die bouers verwerp het, dit het 'n hoeksteen geword\" (21:42). Die huweliksfees (22:1–14). \"Baie is geroep, maar min uitverkies\" (22:14). \"Betaal dan aan die keiser wat die keiser s'n is, en aan God wat God s'n is\" (22:21). \"Jy moet die Here jou God liefhê met jou hele hart en met jou hele siel en met jou hele verstand... en jou naaste soos jouself. Aan hierdie twee gebooie hang die hele wet\" (22:37–40).","bid":"Bid dat ons nie net \"ja\" vir God sal sê nie, maar ook sal doen. Dank God vir Sy uitnodiging na Sy fees. Bid die twee groot gebooie oor elkeen se lewe.","vraag":"In die gelykenis van die twee seuns, watter seun is jy die meeste soos? Waarom?","hoofstukke":[["Matteus","MAT",21],["Matteus","MAT",22]]},{"dag":306,"ref":"Matteus 23 – 25","titel":"Wee julle, Skynheiliges – en Wees Gereed","fase":6,"tydlyn":"Die laaste week, c. 30 of 33 n.C. Die tempel en die Olyfberg.","agtergrond":"In hoofstuk 23 spreek Jesus 'n reeks \"wee\"-uitsprake uit oor die skrifgeleerdes en Fariseërs. \"Skynheilige\" (Grieks hypokrites) was die woord vir 'n toneelspeler wat 'n masker dra. Graftes is jaarliks witgeverf sodat pelgrims nie per ongeluk daaraan raak en onrein word nie – mooi van buite, dood van binne. Hoofstuk 24–25 is die \"Olyfbergrede\" oor die verwoesting van die tempel (70 n.C.) en Jesus se wederkoms – Christene verstaan verskillend watter dele oor 70 n.C. en watter oor die eindtyd gaan. Dit eindig met drie gelykenisse oor gereedheid: die tien maagde, die talente en die oordeel van die nasies (skape en bokke).","leer":"God haat godsdienstige skynheiligheid – om goed te lyk sonder 'n veranderde hart, en om ander te belas terwyl ons self nie leef wat ons preek nie. Jesus kom weer, op 'n onverwagte tyd, en ons moet gereed wees en getrou werk met wat God ons gegee het. Wat ons vir die minste van Sy broers doen, doen ons vir Hom.","skrif":"\"Hulle sê, maar doen nie\" (23:3). \"Die grootste onder julle moet julle dienaar wees\" (23:11). \"Julle gee tiendes van kruisement... en julle laat na die gewigtigste dinge van die wet: die reg en die barmhartigheid en die trou\" (23:23). \"Julle is soos witgepleisterde grafte\" (23:27). \"Jerusalem, Jerusalem... hoe dikwels wou Ek jou kinders bymekaarmaak soos 'n hen haar kuikens\" (23:37). \"Hier sal nie een klip op die ander gelaat word nie\" (24:2). \"Wie volhard tot die einde, hy sal gered word\" (24:13). \"Hierdie evangelie van die koninkryk sal in die hele wêreld verkondig word\" (24:14). \"Maar van daardie dag en uur weet niemand nie\" (24:36). \"Waak dan\" (24:42). Die tien maagde (25:1–13). Die talente: \"Mooi so, goeie en getroue dienskneg\" (25:21). Die skape en die bokke: \"Ek was honger, en julle het My te ete gegee... vir sover julle dit gedoen het aan een van die geringste van hierdie broeders van My, het julle dit aan My gedoen\" (25:35–40).","bid":"Bid dat ons geloof eg sal wees, van binne na buite, en nie 'n masker nie. Bid dat ons gereed sal wees vir Jesus se koms. Bid dat ons die talente wat God gegee het, getrou sal gebruik. Bid vir die honger, dakloses, siekes en gevangenes – en vra God wie ons kan help.","vraag":"Volgens Matteus 25 doen ons iets vir Jesus as ons dit vir \"die geringste\" doen. Wie is \"die geringste\" in jou omgewing?","hoofstukke":[["Matteus","MAT",23],["Matteus","MAT",24],["Matteus","MAT",25]]},{"dag":307,"ref":"Matteus 26","titel":"Die Laaste Nag: Nagmaal, Getsémané en Verraad","fase":6,"tydlyn":"Die nag voor die kruisiging, Donderdag. Betanië, die bovertrek in Jerusalem, Getsémané (op die Olyfberg) en die huis van die hoëpriester Kajafas.","agtergrond":"Hierdie hoofstuk loop grootliks parallel met Markus 14 (Dag 6). Matteus noem dat Judas vir 30 silwerstukke verraai het – die prys van 'n slaaf (Exodus 21:32), en 'n vervulling van Sagaria 11:12. \"Getsémané\" beteken \"olyfpers\" – 'n gepaste naam vir die plek waar Jesus onder die gewig van die beker van God se toorn \"geperk\" is. Kajafas was hoëpriester van 18 tot 36 n.C.; sy familiegraf met 'n beenkis met sy naam is in 1990 in Jerusalem ontdek.","leer":"Jesus het vrywillig na die kruis gegaan, as deel van God se plan. Die Nagmaal herinner ons aan Sy liggaam en bloed wat vir ons gegee is, en wys vorentoe na die fees in Sy koninkryk. In Getsémané sien ons Jesus se ware menslikheid en volmaakte gehoorsaamheid. Selfs Sy naaste vriende het Hom in die steek gelaat – maar Hy het nie hulle in die steek gelaat nie.","skrif":"Die vrou salf Jesus met kosbare salf (26:6–13). \"Wat wil julle my gee?\" – dertig silwerstukke (26:15). \"Een van julle sal My verraai\" (26:21). \"Neem, eet, dit is my liggaam... Drink almal daaruit, want dit is my bloed, die bloed van die nuwe testament, wat vir baie uitgestort word tot vergewing van sondes\" (26:26–28). \"Al sou almal aan U aanstoot neem, ek sal nooit aanstoot neem nie\" (26:33). \"My Vader, as dit moontlik is, laat hierdie beker by My verbygaan; nogtans nie soos Ek wil nie, maar soos U wil\" (26:39). \"Die gees is wel gewillig, maar die vlees is swak\" (26:41). Judas se soen (26:49). \"Steek jou swaard terug\" (26:52). \"Toe het al die dissipels Hom verlaat en gevlug\" (26:56). \"Is U die Christus, die Seun van God?\" – \"U het dit gesê\" (26:63–64). Petrus verloën Hom drie keer en huil bitterlik (26:69–75).","bid":"Dank Jesus vir Sy liggaam en bloed wat vir ons gegee is. Dank Hom dat Hy die beker gedrink het sodat ons dit nie hoef te doen nie. Bid Jesus se gebed: \"Nie soos ek wil nie, maar soos U wil.\" Bid vir mense wat soos Petrus gefaal het en bitterlik huil.","vraag":"Petrus het gesê hy sal Jesus nooit verloën nie, en het dit tog gedoen. Waarom is dit gevaarlik om te dink ons is te sterk om te val?","hoofstukke":[["Matteus","MAT",26]]},{"dag":308,"ref":"Matteus 27 – 28","titel":"Gekruisig, Opgestaan, en die Groot Opdrag","fase":6,"tydlyn":"Vrydag tot Sondag, c. 30 of 33 n.C. Pilatus se hof, Golgota, die graf, en later 'n berg in Galilea.","agtergrond":"Matteus voeg besonderhede by wat in die ander evangelies ontbreek: Judas se berou en dood, Pilatus se vrou se droom, Pilatus wat sy hande was, die volk se woorde \"sy bloed kom oor ons\", 'n aardbewing en die opstanding van heiliges, die wag by die graf, en die omkoopgeld vir die soldate se storie dat die liggaam gesteel is. Dit eindig met die Groot Opdrag op 'n berg in Galilea. Die oortuiging dat Jesus fisies opgestaan het, het die bang dissipels verander in vrymoed

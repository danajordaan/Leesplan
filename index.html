es georden nie, maar volgens temas. Die gids gee telkens aan wanneer 'n gedeelte afspeel. Ons lees Jeremia ná die val van Jerusalem (2 Konings 25), sodat ons kan sien hoe getrou God gewaarsku het."],"tydlyn":"Jeremia word geroep in die 13de jaar van koning Josia, 627/626 v.C. (1:2). Anatot en Jerusalem.","agtergrond":"Jeremia was waarskynlik 'n tiener of jong man toe hy geroep is (\"ek is te jonk\", 1:6). Die amandelboom (Hebreeus shaqed) is 'n woordspel met \"waak\" (shoqed): God waak oor Sy woord. Die kookpot uit die noorde verwys na die inval van Babel. In hoofstuk 2–3 gebruik God, soos Hosea, die beeld van 'n huwelik: Israel was eers soos 'n toegewyde bruid, maar het ontrou geword. 'n Fontein met \"lewende water\" (vars, vloeiende water) is baie beter as 'n uitgekapte reënwatertenk wat lek.","leer":"God ken en roep ons al voor ons gebore is. Jeugdigheid is nie 'n verskoning nie, want God gee die woorde en is met ons. Sonde is om die Bron van lewe te verlaat en ons eie stukkende \"waterbakke\" te grawe – dinge wat ons nie kan bevredig nie. Maar God roep die afvallige terug: \"Keer terug.\"","skrif":"\"Voordat Ek jou in die moederskoot gevorm het, het Ek jou geken; en voordat jy uit die moederskoot uitgekom het, het Ek jou geheilig\" (1:5). \"Ag, Here Here, kyk, ek kan nie spreek nie, want ek is jonk\" (1:6). \"Moenie sê: Ek is jonk nie... Wees nie bevrees nie... want Ek is met jou\" (1:7–8). \"Ek lê my woorde in jou mond\" (1:9). Die amandeltak en die kookpot (1:11–14). \"Ek dink aan die toegeneentheid van jou jeug, die liefde van jou bruidstyd\" (2:2). \"My volk het 'n dubbele kwaad gedoen: My, die fontein van lewende water, het hulle verlaat om vir hulle bakke uit te kap, stukkende bakke wat geen water hou nie\" (2:13). \"Keer terug, afvallige Israel... want Ek is goedertieren\" (3:12). \"Ek sal julle herders gee na my hart\" (3:15).","bid":"Dank God dat Hy ons gesin se kinders geken het nog voor hulle gebore is, en dat Hy 'n plan vir elkeen het. Bid dat hulle nie hulle jeug as 'n verskoning sal gebruik om nie vir God te leef nie. Bid dat ons die Fontein van lewende water bo die \"stukkende waterbakke\" van die wêreld sal kies.","vraag":"Wat is die \"stukkende waterbakke\" waarin mense vandag hulle vreugde en sin soek?","hoofstukke":[["Jeremia","JER",1],["Jeremia","JER",2],["Jeremia","JER",3]]},{"dag":199,"ref":"Jeremia 4 – 6","titel":"\"Vra na die Ou Paaie\"","fase":5,"tydlyn":"Vroeë preke van Jeremia, waarskynlik in Josia se tyd (627–609 v.C.).","agtergrond":"Jeremia waarsku teen 'n vyand uit die noorde (Babel) wat soos 'n leeu en 'n warm woestynwind sal kom. In 5:1 word die profeet uitgestuur om net een regverdige mens in Jerusalem te soek – soos Abraham se pleit vir Sodom. Die volk het 'n vals sekuriteit gehad: valse profete en priesters het \"vrede, vrede\" gesê terwyl daar geen vrede was nie. Die \"ou paaie\" verwys na die weg van God se verbond wat die vaders gegaan het.","leer":"Uiterlike besnydenis of godsdiens beteken niks sonder 'n veranderde hart nie. Valse leraars wat net goeie nuus sonder bekering preek, genees die wond van die volk oppervlakkig. Wanneer ons by 'n kruispad staan, moet ons vra na die goeie, beproefde weg van God – daar is rus.","skrif":"\"Breek vir julle 'n nuwe land om en saai nie onder die dorings nie. Besny julle vir die Here\" (4:3–4). \"My volk is dwaas, hulle ken My nie... hulle is wys om kwaad te doen\" (4:22). \"Gaan rond in die strate van Jerusalem... of daar iemand is wat reg doen\" (5:1). \"Die profete profeteer valslik... en my volk het dit graag so\" (5:31). \"Hulle genees die verbreking van my volk op lighartige wyse deur te sê: Vrede, vrede! terwyl daar geen vrede is nie\" (6:14). \"Hulle weet nie eens hoe om te bloos nie\" (6:15). \"Gaan staan op die paaie en kyk, en vra na die ou paaie, waar tog die goeie weg is, en wandel daarin; dan sal julle rus vind vir julle siel\" (6:16).","bid":"Bid vir harte wat werklik \"besny\" is – aan God oorgegee. Bid vir pastore wat die waarheid in liefde preek, nie net wat mense wil hoor nie. Bid dat ons kinders, wanneer hulle by kruispaaie staan, die \"goeie weg\" sal kies.","vraag":"Jeremia 6:15 sê die volk het nie meer geweet hoe om te bloos nie. Wat gebeur wanneer mense nie meer skaam is vir sonde nie?","hoofstukke":[["Jeremia","JER",4],["Jeremia","JER",5],["Jeremia","JER",6]]},{"dag":200,"ref":"Jeremia 7 – 9","titel":"Die Tempelpreek: Vals Sekuriteit","fase":5,"tydlyn":"\"In die begin van die regering van Jojakim\" (26:1), 609/608 v.C. By die poort van die tempel in Jerusalem.","agtergrond":"Die volk het geglo dat Jerusalem nooit kan val nie, omdat die tempel daar is – God sal tog nie Sy eie huis laat verwoes nie (vgl. die redding in Hiskia se tyd, 701 v.C.). Jeremia gaan staan by die tempelpoort en sê: moenie op die tempel vertrou terwyl julle steel, moor, egbreuk pleeg en Baäl aanbid nie. Hy herinner hulle aan Silo, waar die tabernakel eens gestaan het en wat God verwoes het (1 Samuel 4). Jesus haal 7:11 aan by die tempelreiniging (Markus 11:17). Hoofstuk 26 vertel hoe Jeremia amper vir hierdie preek doodgemaak is.","leer":"Ons kan nie op godsdienstige simbole of 'n kerkgebou vertrou terwyl ons lewe in sonde nie. God sien wat ons agter die skerms doen. Ons moet nie roem in wysheid, krag of rykdom nie, maar daarin dat ons God ken – wat goedertierenheid, reg en geregtigheid doen.","skrif":"\"Vertrou nie op leuenagtige woorde as hulle sê: Die tempel van die Here, die tempel van die Here, die tempel van die Here is dit!\" (7:4). \"Steel, moor, egbreuk pleeg... en dan kom en voor my aangesig staan in hierdie huis en sê: Ons is gered!\" (7:9–10). \"Is hierdie huis... in julle oë 'n rowerspelonk?\" (7:11). \"Gaan tog na my plek in Silo\" (7:12). Die kinders maak koeke vir die \"koningin van die hemel\" (7:18). \"Luister na my stem, dan sal Ek vir julle 'n God wees\" (7:23). \"Is daar geen balsem in Gilead nie?\" (8:22). \"Ag, was my hoof maar water en my oog 'n fontein van trane\" (9:1). \"Laat die wyse nie roem in sy wysheid nie... maar laat hom wat roem, daarin roem dat hy verstand het en My ken\" (9:23–24).","bid":"Bid dat ons geloof nie 'n uiterlike skyn sal wees nie, maar in ons hele lewe gesien sal word. Bid dat ons roem sal wees dat ons God ken, nie in ons punte, sporttalente of besittings nie. Bid vir mense wat soos Jeremia oor ander huil.","vraag":"Jeremia 9:23–24 sê ons moet nie in wysheid, krag of rykdom roem nie. Waarop roem tieners vandag? Waarop sou jy wil roem?","hoofstukke":[["Jeremia","JER",7],["Jeremia","JER",8],["Jeremia","JER",9]]},{"dag":201,"ref":"Jeremia 10 – 12","titel":"Die Ware God en die Profeet onder Druk","fase":5,"tydlyn":"Verskillende preke, waarskynlik in Jojakim se tyd (609–598 v.C.). Anatot en Jerusalem.","agtergrond":"Hoofstuk 10 lewer 'n skerp kritiek op afgode: 'n boom word afgekap, versier met silwer en goud, en vasgespyker sodat dit nie omval nie – \"soos 'n voëlverskrikker in 'n komkommerland\". (10:11 is die enigste vers in Jeremia in Aramees – die taal van Babel – sodat die Jode dit vir die Babiloniërs kan sê.) In hoofstuk 11 herinner Jeremia die volk aan die verbond; die mense van sy eie dorp, Anatot, beplan om hom dood te maak. In hoofstuk 12 kla Jeremia: waarom gaan dit goed met die goddeloses?","leer":"Daar is net een ware en lewende God; afgode is magteloos. Om God te dien, kan teenstand selfs van ons eie familie en mense bring. Ons mag ons kla na God bring, maar God roep ons soms om sterker te word: \"As jy met voetgangers geloop het en hulle het jou moeg gemaak, hoe sal jy dan met perde wedywer?\"","skrif":"\"Hulle is soos 'n voëlverskrikker in 'n komkommerland en kan nie praat nie\" (10:5). \"Maar die Here is God in waarheid; Hy is die lewende God en 'n ewige Koning\" (10:10). \"Ek weet, Here, dat die weg van die mens nie in sy mag is nie; dit is nie in die mag van die man wat loop om sy voetstappe te rig nie\" (10:23). \"Ek was soos 'n mak lam wat gelei word om geslag te word\" (11:19). \"Waarom is die weg van die goddelose voorspoedig?\" (12:1). \"As jy met voetgangers geloop het en hulle jou moeg gemaak het, hoe sal jy dan met perde wedywer?\" (12:5). \"Ek sal My weer oor hulle ontferm\" (12:15).","bid":"Dank God dat Hy die lewende God is. Bid vir Christene wat deur hulle eie familie of gemeenskap teengestaan word. Bid vir veerkrag en uithouvermoë vir ons kinders in hulle geloof – dat God hulle sal voorberei om \"met perde te hardloop\".","vraag":"Jeremia 10:23 sê ons kan nie self ons voetstappe rig nie. Hoe help dit jou om God se leiding te vra?","hoofstukke":[["Jeremia","JER",10],["Jeremia","JER",11],["Jeremia","JER",12]]},{"dag":202,"ref":"Jeremia 13 – 15","titel":"Die Linnegordel en Jeremia se Klag","fase":5,"tydlyn":"Waarskynlik in Jojakim se tyd (609–598 v.C.), ook in 'n tyd van droogte (14:1).","agtergrond":"God gebruik dikwels gedramatiseerde gelykenisse deur Jeremia: hy dra 'n linnegordel, begrawe dit by die Eufraat (of by Parah, 'n plek naby Anatot met dieselfde Hebreeuse naam), en gaan haal dit later verrot. Net so was Israel bedoel om naby aan God te wees, maar het \"verrot\" deur hoogmoed. In 'n tyd van droogte bid Jeremia vir die volk, maar God sê dat selfs Moses en Samuel nie die oordeel sal kan afweer nie. In hoofstuk 15 stort Jeremia sy hart uit – hy voel God is soos 'n onbetroubare stroom – en God roep hom terug.","leer":"God se doel is dat ons naby aan Hom sal \"kleef\" soos 'n gordel. Hoogmoed maak ons waardeloos vir Sy doel. Wanneer ons moedeloos word in ons diens aan God, roep Hy ons terug na bekering en belowe om met ons te wees. God se Woord kan vir ons vreugde wees, ook in swaarkry.","skrif":"Die verrotte gordel (13:1–11). \"Kan 'n Kusiet sy vel verander, of 'n luiperd sy kolle? Dan sou julle ook kan goed doen wat gewoond is om kwaad te doen\" (13:23). Die droogte (14:1–6). \"Al het ons ongeregtighede teen ons getuig, Here, handel tog om u Naam ontwil\" (14:7). \"As Moses en Samuel voor my aangesig staan...\" (15:1). \"Toe u woorde gevind is, het ek dit ingesluk, en u woorde was vir my 'n vreugde en die blydskap van my hart\" (15:16). \"Waarom is my pyn nimmereindigend?... sal U vir my soos 'n bedrieglike stroom wees?\" (15:18). \"As jy terugkeer, sal Ek jou laat terugkeer... Ek is met jou om jou te verlos\" (15:19–20).","bid":"Bid dat ons naby aan God sal \"kleef\" soos 'n gordel. Bid vir 'n honger na God se Woord – dat dit vir ons \"'n vreugde en blydskap\" sal wees (15:16). Bid vir mense wat moedeloos geword het in hulle diens vir God.","vraag":"Jeremia sê God se woorde was vir hom 'n vreugde (15:16). Wat sou help dat die Bybel vir jou meer van 'n vreugde word?","hoofstukke":[["Jeremia","JER",13],["Jeremia","JER",14],["Jeremia","JER",15]]},{"dag":203,"ref":"Jeremia 16 – 18","titel":"Die Hart is Bedrieglik, en die Pottebakker","fase":5,"tydlyn":"Jojakim se tyd (609–598 v.C.). Jerusalem en die pottebakker se werkplek.","agtergrond":"God vra Jeremia om nie te trou of kinders te hê nie – sy enkellopende lewe was 'n teken van die komende verwoesting (16:1–4). Hoofstuk 17 kontrasteer die mens wat op mense vertrou met die mens wat op God vertrou (vgl. Psalm 1). In hoofstuk 18 gaan Jeremia na 'n pottebakker se huis. 'n Pottebakker werk met klei op 'n draaiwiel; as die pot skeef vorm, druk hy dit in en vorm dit weer, solank die klei nog nat is.","leer":"Ons eie harte is bedrieglik, en net God ken hulle werklik. Wie op God vertrou, is soos 'n boom by die water wat selfs in droogte vrug dra. God is die Pottebakker – Hy het die reg en die mag om ons te vorm. Sy oordeel is nie blind nie: wanneer 'n volk hom bekeer, reageer God met genade.","skrif":"\"Jy mag vir jou geen vrou neem nie\" (16:2). \"Vervloek is die man wat op 'n mens vertrou\" (17:5). \"Geseënd is die man wat op die Here vertrou... Want hy sal wees soos 'n boom wat by die water geplant is... en in 'n jaar van droogte is hy nie besorg nie\" (17:7–8). \"Bedrieglik is die hart bo alle dinge, ja, dit is ongeneeslik; wie kan dit ken? Ek, die Here, deurgrond die hart\" (17:9–10). \"Genees my, Here, dan sal ek genees wees\" (17:14). Hou die sabbat heilig (17:21–27). \"Toe het die voorwerp... misluk in die hand van die pottebakker; en hy het weer 'n ander voorwerp daarvan gemaak\" (18:4). \"Soos die klei in die hand van die pottebakker, so is julle in my hand\" (18:6). As 'n volk hom bekeer, \"sal Ek berou hê oor die onheil\" (18:8).","bid":"Bid Jeremia 17:14: \"Genees ons, Here, dan sal ons genees wees.\" Bid dat ons op God sal vertrou, nie op mense nie. Gee ons lewe as klei in God se hande, en vra Hom om ons te vorm – selfs as dit beteken om van voor af te begin.","vraag":"As God die Pottebakker is en jy die klei, wat beteken dit wanneer iets in jou lewe \"misluk\"?","hoofstukke":[["Jeremia","JER",16],["Jeremia","JER",17],["Jeremia","JER",18]]},{"dag":204,"ref":"Jeremia 19 – 21","titel":"Die Gebreekte Kruik en 'n Vuur in die Gebeente","fase":5,"tydlyn":"Jojakim se tyd, en hoofstuk 21 in Sedekia se tyd (c. 588 v.C., tydens die beleg). Die dal van Ben-Hinnom en die tempel.","agtergrond":"In die dal van Ben-Hinnom (suid van Jerusalem, ook Tofet genoem) is kinders aan Molog geoffer. Later het die naam van die dal (in Grieks \"Gehenna\") 'n woord vir die hel geword. Jeremia breek daar 'n erdekruik as teken dat Jerusalem gebreek sal word – en 'n gebakte kruik kan, anders as nat klei, nie herstel word nie. Pashur, die tempelopsigter, laat Jeremia slaan en in die blok sit. Hoofstuk 20 bevat Jeremia se diepste klag – hy vervloek selfs die dag van sy geboorte – maar ook die uitspraak dat God se woord soos 'n vuur in sy gebeente brand.","leer":"Daar kom 'n punt waar volhardende verharding onherstelbaar word. Om God se boodskapper te wees, kan baie pyn bring – en God laat eerlike klag toe. Maar God se woord in 'n mens se hart kan nie stilgemaak word nie. Die Here is soos 'n geweldige held aan die kant van Sy dienaars.","skrif":"Die kinderoffers in Tofet (19:4–5). Jeremia breek die kruik (19:10–11). Pashur slaan Jeremia en sit hom in die blok (20:1–2). \"U het my oorreed, Here, en ek het my laat oorreed\" (20:7). \"As ek sê: Ek sal aan Hom nie dink nie en nie meer in sy Naam spreek nie – dan word dit in my hart soos 'n brandende vuur, opgesluit in my gebeente\" (20:9). \"Maar die Here is met my soos 'n geweldige held\" (20:11). \"Vervloek is die dag waarop ek gebore is\" (20:14). \"Kyk, Ek lê voor julle die weg van die lewe en die weg van die dood\" (21:8).","bid":"Bid vir Christene wat vir hulle geloof vervolg word. Bid dat God se woord soos 'n vuur in ons harte sal brand. Bid vir mense wat in diep moedeloosheid is – dat hulle, soos Jeremia, steeds na God sal roep.","vraag":"Jeremia wou ophou om oor God te praat, maar kon nie. Het jy al iets so belangrik gevind dat jy nie kon stilbly daaroor nie?","hoofstukke":[["Jeremia","JER",19],["Jeremia","JER",20],["Jeremia","JER",21]]},{"dag":205,"ref":"Jeremia 22 – 24","titel":"Slegte Herders en die Regverdige Spruit","fase":5,"tydlyn":"Oor die laaste konings van Juda (609–586 v.C.) – Joahas (Sallum), Jojakim en Jojagin (Konja). Hoofstuk 24: ná 597 v.C.","agtergrond":"Jeremia spreek die koninklike paleis direk aan. Jojakim het vir hom 'n luukse paleis gebou met dwangarbeid sonder om die werkers te betaal, terwyl sy vader Josia reg gedoen het. Oor Jojagin (Konja) word gesê dat geen nakomeling van hom op Dawid se troon sal sit nie (22:30) – interessant genoeg kom Jesus se wettige stamboom in Matteus deur Jojagin (Matteus 1:11–12), maar Jesus was nie Josef se biologiese seun nie. Die \"herders\" is die leiers. Hoofstuk 23 belowe 'n regverdige \"Spruit\" uit Dawid. Die twee mandjies vye (hoofstuk 24) vergelyk die ballinge in Babel (goed) met dié wat in Jerusalem agtergebly het (sleg).","leer":"God oordeel leiers wat hul mag vir hulleself gebruik en die armes uitbuit. Om God te ken, beteken om reg te doen aan die ellendige en behoeftige. God sal self 'n regverdige Koning (Jesus) gee – \"Die Here ons Geregtigheid\". Valse profete wat hul eie drome as God se woord voorhou, is gevaarlik.","skrif":"\"Doen reg en geregtigheid, en red die beroofde uit die hand van die verdrukker\" (22:3). \"Wee hom wat sy huis bou met ongeregtigheid... wat sy naaste verniet laat werk\" (22:13). Josia \"het die saak van die ellendige en behoeftige bepleit... Is dit nie om My te ken nie?\" (22:16). \"Wee die herders wat die skape van my weiding verlore laat gaan\" (23:1). \"Ek sal vir Dawid 'n regverdige Spruit verwek... en dit is sy Naam waarmee hy genoem sal word: DIE HERE ONS GEREGTIGHEID\" (23:5–6). \"Is my woord nie soos 'n vuur... en soos 'n hamer wat die rots vergruis?\" (23:29). Die twee mandjies vye (24:1–10). \"Ek sal hulle 'n hart gee om My te ken\" (24:7).","bid":"Bid vir leiers wat dien en nie uitbuit nie – in die regering, besighede en kerke. Dank God vir Jesus, die Here ons Geregtigheid. Bid dat ons God se Woord as 'n hamer en 'n vuur sal ervaar wat ons verander.","vraag":"Jeremia 22:16 sê om reg te doen aan die armes is \"om My te ken\". Hoe hang God ken en die armes help saam?","hoofstukke":[["Jeremia","JER",22],["Jeremia","JER",23],["Jeremia","JER",24]]},{"dag":206,"ref":"Jeremia 25 – 27","titel":"Sewentig Jaar en die Juk van Babel","fase":5,"tydlyn":"605 v.C. (25:1 – die eerste jaar van Nebukadnesar), 609 v.C. (hoofstuk 26), en c. 594 v.C. (hoofstuk 27, in Sedekia se tyd).","agtergrond":"Jeremia het 23 jaar lank gepreek sonder dat die volk luister (25:3). Hy voorspel dat die ballingskap 70 jaar sal duur – 'n getal wat Daniël later lees en waaroor hy bid (Daniël 9:2). (Van die eerste wegvoering in 605 v.C. tot die terugkeer in 538/536 v.C. is ongeveer 70 jaar; van die verwoesting van die tempel in 586 tot die voltooiing van die nuwe tempel in 516/515 v.C. is ook sowat 70 jaar.) In hoofstuk 26 word Jeremia amper doodgemaak vir sy tempelpreek, en die oudstes onthou Miga se woorde. In hoofstuk 27 dra Jeremia 'n houtjuk om sy nek as teken dat die nasies hulle aan Babel moet onderwerp.","leer":"God is geduldig en waarsku herhaaldelik voordat Hy oordeel. Sy tydsberekening is presies. Om God se boodskap getrou te bring, kan lewensgevaarlik wees, maar God beskerm Sy dienaars deur mense soos Ahikam. Soms is die weg van gehoorsaamheid om 'n moeilike situasie te aanvaar eerder as om daarteen te veg.","skrif":"\"Van die dertiende jaar van Josia af... het ek vroeg en laat gespreek, maar julle het nie geluister nie\" (25:3). \"Hierdie nasies sal die koning van Babel sewentig jaar dien\" (25:11). Die beker van God se toorn vir die nasies (25:15–29). \"Miskien sal hulle luister en hulle bekeer\" (26:3). \"Hierdie man verdien die dood\" (26:11). Die oudstes onthou Miga (26:17–19). Ahikam beskerm Jeremia (26:24). Jeremia se juk (27:2). \"Bring julle nekke onder die juk van die koning van Babel... en bly lewe\" (27:12).","bid":"Dank God vir Sy geduld met ons. Bid vir mense wat soos Ahikam opstaan om ander te beskerm. Bid vir wysheid om te weet wanneer om te veg en wanneer om 'n moeilike situasie te aanvaar.","vraag":"Jeremia het 23 jaar lank gepreek en niemand het geluister nie. Hoe hou 'n mens aan om reg te doen as niemand dit raaksien nie?","hoofstukke":[["Jeremia","JER",25],["Jeremia","JER",26],["Jeremia","JER",27]]},{"dag":207,"ref":"Jeremia 28 – 30","titel":"\"Soek die Vrede van die Stad\" – 'n Brief aan die Ballinge","fase":5,"tydlyn":"c. 594–593 v.C. Jerusalem; die brief word na die ballinge in Babel gestuur wat in 597 v.C. weggevoer is.","agtergrond":"Die valse profeet Hananja breek Jeremia se houtjuk en voorspel dat die ballinge binne twee jaar sal terugkom. Jeremia antwoord dat God 'n juk van yster sal stuur, en Hananja sterf binne die jaar. Hoofstuk 29 is 'n brief aan die ballinge in Babel: hulle moenie wag op 'n vinnige terugkeer nie, maar huise bou, tuine plant, trou en kinders hê, en bid vir die stad waar hulle is. Die bekende 29:11 is aan 'n volk gerig wat 70 jaar in ballingskap sou wees – God se goeie plan was nie 'n vinnige uitkoms nie, maar 'n toekoms en hoop ná die swaarkry. Hoofstuk 30 begin die \"Boek van Vertroosting\" (hoofstuk 30–33).","leer":"Valse hoop is gevaarlik, al klink dit goed. God roep Sy volk om getrou en vrugbaar te leef waar Hy hulle geplaas het – ook in 'n vreemde, moeilike plek – en om te bid vir die welvaart van hulle omgewing. God se planne vir Sy kinders is goed, maar Hy werk dit op Sy tyd uit. Wie God met die hele hart soek, sal Hom vind.","skrif":"Hananja breek die juk (28:10–11). \"Die Here het jou nie gestuur nie, maar jy laat hierdie volk op 'n leuen vertrou\" (28:15). \"Bou huise en woon daarin, en plant tuine\" (29:5). \"Soek die vrede van die stad waarheen Ek julle weggevoer het, en bid vir hom tot die Here; want in sy vrede sal julle vrede hê\" (29:7). \"As vir Babel sewentig jaar vol is, sal Ek op julle ag gee\" (29:10). \"Want Ek weet watter gedagtes Ek oor julle koester, spreek die Here, gedagtes van vrede en nie van onheil nie, om julle 'n hoopvolle toekoms te gee\" (29:11). \"En julle sal My soek en vind as julle na My vra met julle hele hart\" (29:13). \"Ek sal jou genesing laat opkom\" (30:17). \"Julle sal vir My 'n volk wees, en Ek sal vir julle 'n God wees\" (30:22).","bid":"Bid vir ons stad, ons skool en ons land – dat ons die \"vrede van die stad\" sal soek waar God ons geplaas het. Dank God vir Sy goeie planne vir ons gesin se kinders, en bid dat hulle Hom met hul hele hart sal soek. Bid vir geduld in moeilike seisoene.","vraag":"Jeremia 29:11 is aan mense gesê wat 70 jaar in ballingskap sou wees. Hoe verander dit die manier waarop ons hierdie bekende vers verstaan?","hoofstukke":[["Jeremia","JER",28],["Jeremia","JER",29],["Jeremia","JER",30]]},{"dag":208,"ref":"Jeremia 31 – 33","titel":"Die Nuwe Verbond","fase":5,"tydlyn":"c. 588–587 v.C., terwyl Jerusalem deur Babel beleër word en Jeremia gevange is in die wagtershof (32:1–2).","agtergrond":"In die donkerste uur – die stad op die punt om te val – bring Jeremia die grootste hoopboodskap van die Ou Testament: 'n nuwe verbond. Die ou verbond by Sinai was op klipblaaie geskryf; die nuwe verbond word op die hart geskryf, met volle vergifnis. Jesus het die beker by die Nagmaal \"die nuwe testament (verbond) in my bloed\" genoem (Lukas 22:20), en Hebreërs 8:8–12 haal hierdie gedeelte volledig aan. In hoofstuk 32 koop Jeremia 'n stuk grond in Anatot – grond wat reeds deur die vyand beset is – as daad van geloof dat God die volk sal terugbring. Ragel wat oor haar kinders huil (31:15) word in Matteus 2:18 aangehaal.","leer":"God se liefde vir Sy volk is ewig. Hy belowe 'n nuwe verhouding waarin Hy Sy wet op ons harte skryf en ons sonde vergeet – dit is wat Jesus vir ons bewerk het. Geloof belê in God se beloftes, selfs wanneer die omstandighede sê dit is waansinnig. Niks is vir God te wonderlik nie.","skrif":"\"Ek het jou liefgehad met 'n ewige liefde; daarom het Ek jou getrek in goedertierenheid\" (31:3). \"'n Stem word gehoor in Rama... Ragel ween oor haar kinders\" (31:15). \"Kyk, daar kom dae... dat Ek met die huis van Israel en met die huis van Juda 'n nuwe verbond sal sluit\" (31:31). \"Ek gee my wet in hulle binneste en skryf dit op hulle hart; en Ek sal vir hulle 'n God wees, en hulle sal vir My 'n volk wees... want Ek sal hulle ongeregtigheid vergewe en aan hulle sonde nie meer dink nie\" (31:33–34). Jeremia koop die grond (32:6–15). \"Ag, Here Here!... vir U is geen ding te wonderlik nie\" (32:17). \"Ek sal hulle een hart en een weg gee\" (32:39). \"Roep My aan, en Ek sal jou antwoord en jou groot en ontoeganklike dinge te kenne gee wat jy nie weet nie\" (33:3). Die Spruit van Dawid (33:15–16).","bid":"Dank Jesus vir die nuwe verbond in Sy bloed – dat God ons sonde nie meer onthou nie. Bid dat God Sy wet op elkeen van ons se harte sal skryf. Bid Jeremia 33:3 – roep God aan vir die \"groot en ontoeganklike dinge\".","vraag":"Wat is die verskil tussen 'n wet op klipblaaie en 'n wet op jou hart?","hoofstukke":[["Jeremia","JER",31],["Jeremia","JER",32],["Jeremia","JER",33]]},{"dag":209,"ref":"Jeremia 34 – 36","titel":"Gehoorsame Rekabiete en 'n Verbrande Boekrol","fase":5,"tydlyn":"Hoofstuk 34: c. 588 v.C. (tydens die beleg). Hoofstuk 35–36: in Jojakim se tyd, c. 605–601 v.C.","agtergrond":"Tydens die beleg laat die rykes van Jerusalem hulle Hebreeuse slawe vry (soos die wet van Exodus 21 vereis), maar neem hulle terug sodra die Babiloniërs tydelik onttrek. Die Lakis-briewe (potskerwe met briewe uit c. 588 v.C., gevind by Lakis) praat van die vuurseine van Lakis en Aseka – presies die twee stede wat in 34:7 as die laaste oorlewendes genoem word. Die Rekabiete was 'n familie wat 250 jaar lank getrou hul voorvader se bevel gehoorsaam het om geen wyn te drink en in tente te woon nie. In hoofstuk 36 dikteer Jeremia sy profesieë aan sy skrywer Barug, en koning Jojakim sny die boekrol stuk vir stuk af en gooi dit in die vuur.","leer":"Ons beloftes aan God en mense moet nie verbreek word sodra die druk af is nie. Die Rekabiete se gehoorsaamheid aan 'n mens beskaam Israel se ongehoorsaamheid aan God. Mense kan God se Woord probeer vernietig, maar dit kan nie uitgewis word nie – Jeremia skryf dit net weer, met meer daarby.","skrif":"Die slawe word vrygelaat en weer teruggeneem (34:8–11). \"Julle het vrylating uitgeroep... en julle het weer omgedraai\" (34:15–16). Die Rekabiete weier die wyn: \"Ons sal geen wyn drink nie\" (35:6). \"Die woorde van Jonadab... word gehou; maar julle het na My nie geluister nie\" (35:14). Barug skryf die boekrol (36:4). Jojakim sny die rol en verbrand dit in die vuurpot (36:23). \"Hulle het nie geskrik nie, en hulle klere nie geskeur nie\" (36:24). Jeremia laat dit weer skryf, en baie woorde word bygevoeg (36:32).","bid":"Bid dat ons ons woord sal hou, ook wanneer dit nie meer maklik is nie. Dank God dat Sy Woord nie vernietig kan word nie. Bid vir Christene wat onder vervolging Bybels bewaar en versprei. Bid vir harte wat \"skrik\" en reageer wanneer God praat.","vraag":"Koning Jojakim het die boekrol verbrand, maar God se woord het oorleef. Waar sien jy vandag dat mense God se Woord probeer \"verbrand\" of ignoreer?","hoofstukke":[["Jeremia","JER",34],["Jeremia","JER",35],["Jeremia","JER",36]]},{"dag":210,"ref":"Jeremia 37 – 39","titel":"In die Put – en die Val van Jerusalem","fase":5,"tydlyn":"588–586 v.C. Jerusalem tydens die finale beleg en val.","agtergrond":"Koning Sedekia was swak – hy het Jeremia in die geheim geraadpleeg, maar te bang vir sy amptenare om na hom te luister. Die amptenare gooi Jeremia in 'n leë sisterne (put) vol modder om te sterf. Ebed-Meleg, 'n Kusiet (Afrikaan uit die gebied suid van Egipte) en 'n hofamptenaar, pleit vir hom en red hom met ou lappe en toue. Jerusalem val in die vierde maand van die elfde jaar van Sedekia (586 v.C.). Sedekia se seuns word voor sy oë doodgemaak, dan word sy oë uitgesteek en hy word geboei na Babel geneem. Nebukadnesar beveel dat Jeremia goed behandel moet word.","leer":"Om God se waarheid te praat, kan lyding bring, maar God sien en beskerm. 'n Leier wat te bang vir mense is om God te gehoorsaam, bring ramp oor homself en ander. God gebruik 'n buitestaander (Ebed-Meleg) wat met moed en sagtheid optree – en beloon hom omdat hy op God vertrou het.","skrif":"Jeremia word gevange geneem as \"verraaier\" (37:11–15). Sedekia vra in die geheim: \"Is daar 'n woord van die Here?\" (37:17). Jeremia word in die put gegooi en sak in die modder (38:6). Ebed-Meleg pleit en red hom met toue en ou lappe (38:7–13). Sedekia: \"Ek is bang vir die Jode\" (38:19). \"Luister tog na die stem van die Here... dan sal dit met jou goed gaan\" (38:20). Die val van Jerusalem (39:1–10). God belowe Ebed-Meleg: \"Ek sal jou sekerlik red... omdat jy op My vertrou het\" (39:18).","bid":"Bid vir moed om nie uit vrees vir mense God ongehoorsaam te wees nie. Bid dat ons, soos Ebed-Meleg, sal opstaan vir mense wat onregverdig behandel word. Bid vir mense wat in 'n \"put\" sit – depressie, eensaamheid, swaarkry.","vraag":"Ebed-Meleg het 'n groot risiko geneem om Jeremia te red. Wat sou jy doen as jy sien iemand word onregverdig behandel?","hoofstukke":[["Jeremia","JER",37],["Jeremia","JER",38],["Jeremia","JER",39]]},{"dag":211,"ref":"Jeremia 40 – 42","titel":"Ná die Val: Gedalja en die Vraag om Leiding","fase":5,"tydlyn":"586–582 v.C. Mispa (die setel van die goewerneur), Bet-Lehem en die pad na Egipte.","agtergrond":"Ná die val word Gedalja (seun van Ahikam, wat Jeremia vroeër beskerm het) as goewerneur oor die armes wat in die land agterbly, aangestel. Jeremia kies om by hulle te bly eerder as om in Babel 'n gemaklike lewe te hê. Ismael, 'n lid van die koninklike familie, vermoor Gedalja. Die oorblyfsel is bang vir Babiloniese wraak en vra Jeremia om vir hulle God se wil te vra – en belowe om te gehoorsaam, wat ook al God sê. God sê: bly in die land. Maar hulle het reeds hulle besluit geneem om na Egipte te gaan.","leer":"Dit is gevaarlik om God se wil te \"vra\" terwyl ons reeds besluit het wat ons gaan doen. Gehoorsaamheid aan God beteken om Sy antwoord te aanvaar, al is dit nie wat ons wou hoor nie. Vrees vir mense en omstandighede lei ons weg van God se veiligheid. Leiers wat waarskuwings ignoreer (Gedalja), kan tragiese gevolge oor hulle bring.","skrif":"Jeremia kies om in die land te bly (40:1–6). Gedalja: \"Moenie bang wees nie... bly in die land en dien die koning van Babel\" (40:9). Gedalja glo nie die waarskuwing oor Ismael nie (40:13–16). Ismael vermoor Gedalja (41:2). \"Bid vir ons tot die Here jou God... sodat die Here jou God ons kan bekend maak die weg waarop ons moet gaan\" (42:2–3). \"Of dit goed of kwaad is, ons sal luister na die stem van die Here onse God\" (42:6). God sê: bly in die land, moenie na Egipte gaan nie (42:10–19). \"Julle het julleself bedrieg\" (42:20).","bid":"Bid vir eerlike harte wat God se wil werklik wil weet, nie net Sy goedkeuring van ons planne nie. Bid vir die moed om Sy antwoord te gehoorsaam. Bid vir leiers om wyse waarskuwings te aanvaar.","vraag":"Die volk het God se leiding gevra, maar het reeds besluit. Hoe weet ons of ons God se wil regtig wil hê of net ons eie?","hoofstukke":[["Jeremia","JER",40],["Jeremia","JER",41],["Jeremia","JER",42]]},{"dag":212,"ref":"Jeremia 43 – 45","titel":"Ongehoorsaamheid in Egipte en 'n Woord vir Barug","fase":5,"tydlyn":"c. 582–570 v.C. Tagpanhes in Egipte (aan die oostelike grens van die Nyldelta). Hoofstuk 45 dateer van 605 v.C.","agtergrond":"Die oorblyfsel gaan na Egipte en neem Jeremia en Barug teen hulle wil saam. In Egipte begin hulle weer die \"koningin van die hemel\" aanbid – 'n vrugbaarheidsgodin (waarskynlik Astarte of Isjtar). Hulle sê dit het beter met hulle gegaan toe hulle haar aanbid het. Jeremia sterf waarskynlik in Egipte. Hoofstuk 45 is 'n kort, persoonlike boodskap aan Barug, Jeremia se skrywer, wat moeg en moedeloos was. Nebukadnesar het Egipte inderdaad in 568/567 v.C. aangeval, soos Jeremia voorspel het.","leer":"Mense kan God se oordeel heeltemal verkeerd verstaan, en dink hulle swaarkry kom omdat hulle opgehou het met afgodery. Om God se pad te verlaat, lei nie na veiligheid nie. God sien ook die \"agter-die-skerms\"-dienaars soos Barug, en Hy roep ons om nie groot dinge vir onsself te soek nie, maar tevrede te wees met Sy beskerming.","skrif":"Die oorblyfsel gaan na Egipte \"omdat hulle nie geluister het na die stem van die Here nie\" (43:7). Jeremia begrawe klippe by Farao se paleis as teken (43:8–13). Die vroue en mans: \"Ons sal nie na jou luister nie... ons wil aan die koningin van die hemel offer\" (44:16–17). \"Toe was ons versadig van brood, en dit het goed met ons gegaan\" (44:17). God se antwoord (44:20–30). Barug se klag: \"Wee my nou, want die Here het kommer by my smart gevoeg\" (45:3). \"En jy, soek jy vir jou groot dinge? Soek dit nie... maar Ek sal jou jou lewe tot 'n buit gee\" (45:5).","bid":"Bid dat ons nie swaarkry sal gebruik as rede om van God weg te draai nie. Dank God vir die \"Barugs\" – die mense wat agter die skerms vir God werk. Bid vir 'n hart wat nie \"groot dinge vir onsself\" soek nie, maar God se eer.","vraag":"God sê vir Barug: \"Soek jy vir jou groot dinge? Soek dit nie.\" Wat bedoel God, en is dit verkeerd om drome te hê?","hoofstukke":[["Jeremia","JER",43],["Jeremia","JER",44],["Jeremia","JER",45]]},{"dag":213,"ref":"Jeremia 46 – 48","titel":"God se Woord oor Egipte, die Filistyne en Moab","fase":5,"tydlyn":"Hoofstuk 46: die slag van Karkemis, 605 v.C. Ander profesieë uit verskillende tye.","agtergrond":"Hoofstukke 46–51 is profesieë oor die nasies (soos in Jesaja 13–23). Die slag by Karkemis (aan die Eufraat, in die huidige Sirië/Turkye) in 605 v.C., waar Nebukadnesar farao Nego van Egipte verslaan het, was een van die beslissende gevegte van die antieke wêreld: dit het Babel die wêreldmag gemaak. Die Filistyne en Moab was ou vyande van Israel. Moab was trots op sy god Kamos en op sy rykdom.","leer":"God is nie net Israel se God nie; Hy regeer oor die geskiedenis van alle nasies. Trots en vertroue op eie krag of gode lei tot 'n val. Selfs in oordeel oor vyande is daar 'n hart van ontferming (48:31, 36) en 'n belofte van herstel (48:47). God bly met Sy volk, selfs in hulle straf.","skrif":"Egipte se nederlaag by Karkemis (46:2–12). \"Jakob, my kneg, wees nie bevrees nie... want Ek is met jou\" (46:27–28). Oordeel oor die Filistyne (47). \"Moab was gerus van sy jeug af\" (48:11). Moab se trots: \"Ons het gehoor van die trotsheid van Moab, die baie trotse\" (48:29). \"Daarom wil ek oor Moab huil\" (48:31). \"Maar Ek sal die lot van Moab verander in die laaste dae\" (48:47).","bid":"Bid vir die nasies van die wêreld wat nog in trots en afgodery leef. Dank God dat Hy die geskiedenis regeer. Dank Hom dat Hy, selfs in oordeel, ontferming toon.","vraag":"God sê Hy wil oor Moab, 'n vyand, huil. Wat leer dit ons oor hoe ons oor ons \"vyande\" moet voel?","hoofstukke":[["Jeremia","JER",46],["Jeremia","JER",47],["Jeremia","JER",48]]},{"dag":214,"ref":"Jeremia 49 – 50","titel":"Edom, die Nasies en die Val van Babel","fase":5,"tydlyn":"Verskillende profesieë. Hoofstuk 50 voorspel die val van Babel (wat in 539 v.C. gebeur het).","agtergrond":"Jeremia spreek oor Ammon, Edom, Damaskus, Kedar (Arabiese stamme) en Elam (oos van Babel, die huidige Iran). Die profesie oor Edom (49:7–22) is baie soortgelyk aan Obadja. Hoofstuk 50 begin die lang profesie oor Babel: die nasie wat God as instrument van oordeel gebruik het, sal self geoordeel word vir haar trots en wreedheid. Babel is in 539 v.C. deur die Perse en Mede onder Kores verower.","leer":"Die nasie wat God gebruik om te straf, word nie daardeur onskuldig nie; elke nasie is verantwoordelik vir sy dade. God se volk sal huil en die Here soek, en terugkeer met 'n ewige verbond. God is die sterk Verlosser van Sy volk – Hy pleit self hulle saak.","skrif":"Edom se trots: \"Al maak jy jou nes so hoog soos die arend, Ek sal jou daarvandaan neerwerp\" (49:16). \"Laat jou weeskinders oor, Ek sal hulle in die lewe hou\" (49:11). \"Gevalle is Babel... want dit is die wraak van die Here\" (50:2, 15). \"In dié dae... sal die kinders van Israel kom... al wenende sal hulle gaan en die Here hulle God soek... in 'n ewige verbond wat nie vergeet sal word nie\" (50:4–5). \"My volk was verlore skape; hulle herders het hulle laat dwaal\" (50:6). \"Hulle Verlosser is sterk; Here van die leërskare is sy Naam; Hy sal hulle regsaak deeglik bepleit\" (50:34).","bid":"Dank God dat Hy ons sterk Verlosser is wat ons saak pleit. Bid vir weeskinders en weduwees, wat God belowe om te versorg (49:11). Bid vir verlore \"skape\" wat deur slegte leiers laat dwaal is.","vraag":"God noem Homself die \"sterk Verlosser\" wat ons saak pleit (50:34). Wat beteken dit vir jou dat Jesus jou Voorspraak is?","hoofstukke":[["Jeremia","JER",49],["Jeremia","JER",50]]},{"dag":215,"ref":"Jeremia 51 – 52","titel":"Babel sal Sink – en die Val van Jerusalem Onthou","fase":5,"tydlyn":"Hoofstuk 51: c. 594 v.C. (51:59). Hoofstuk 52: 'n historiese aanhangsel oor 586 v.C. en 561 v.C.","agtergrond":"Jeremia gee die profesie oor Babel aan Seraja (Barug se broer), wat saam met koning Sedekia na Babel gaan. Hy moet dit voorlees, 'n klip daaraan vasmaak en dit in die Eufraat gooi: so sal Babel sink. Hoofstuk 52 herhaal grootliks 2 Konings 24:18–25:30: die val van Jerusalem, die verwoesting van die tempel en die vrylating van Jojagin. Dit bevestig dat Jeremia se woorde presies uitgekom het.","leer":"Geen menslike ryk, hoe magtig ook al, staan vir ewig nie – net God se koninkryk. Babel word in die Bybel die simbool van die wêreld se trots teen God (Openbaring 18 gebruik dieselfde beeld van 'n klip wat in die see gegooi word). Ons moet \"uit Babel uitgaan\" – ons nie aan die wêreld se waardes vasbind nie. God se woord word altyd vervul.","skrif":"\"Vlug uit die midde van Babel... want dit is die tyd van die wraak van die Here\" (51:6). \"Hy het die aarde gemaak deur sy krag... en deur sy verstand die hemel uitgesprei\" (51:15). \"Gaan uit haar midde uit, my volk, en red elkeen sy lewe\" (51:45). Die boekrol in die Eufraat: \"So sal Babel sink en nie weer opkom nie\" (51:63–64). \"Tot hiertoe is die woorde van Jeremia\" (51:64). Die val van Jerusalem (52:4–16). Die tempel se bronspilare en skatte weggevoer (52:17–23). Jojagin word vrygelaat (52:31–34).","bid":"Dank God dat Sy koninkryk vir ewig staan. Bid dat ons nie aan die \"Babel\" van ons tyd – die wêreld se waardes – vasgebind sal raak nie. Dank God dat Sy woord altyd waar word.","vraag":"Wat is die \"Babel\" van ons tyd – die waardes van die wêreld waarvan ons moet \"uitgaan\"?","hoofstukke":[["Jeremia","JER",51],["Jeremia","JER",52]]},{"dag":216,"ref":"Klaagliedere 1 – 2","titel":"Jerusalem in Rou","fase":5,"tydlyn":"Kort ná die val van Jerusalem in 586 v.C. Tradisioneel aan Jeremia toegeskryf (die boek self noem nie die skrywer nie).","agtergrond":"Klaagliedere bestaan uit vyf gedigte oor die verwoesting van Jerusalem. Hoofstukke 1, 2 en 4 is alfabetiese gedigte (elke vers begin met die volgende letter van die 22 Hebreeuse letters); hoofstuk 3 het drie verse per letter (66 verse). Die alfabetiese vorm gee orde aan oorweldigende hartseer – \"van A tot Z\" word die rou uitgespreek. Jerusalem word voorgestel as 'n weduwee wat huil, sonder iemand om haar te troos. Jode lees dit tot vandag toe op Tisja b'Av, die dag waarop die verwoesting van die tempel herdenk word.","leer":"Sonde het werklike en pynlike gevolge, en dit is reg om daaroor te rou. Klaagliedere leer ons om ons pyn eerlik voor God uit te stort. Dit erken dat God regverdig is in Sy oordeel, maar roep tog na Hom vir ontferming. Rou is deel van die geloofslewe.","skrif":"\"Hoe sit die stad eensaam wat so vol mense was! Sy het soos 'n weduwee geword\" (1:1). \"Daar is niemand om haar te troos nie\" (1:2, 9, 17, 21). \"Is dit niks vir julle, almal wat op die pad verbygaan? Aanskou en sien of daar 'n smart is soos my smart\" (1:12). \"Die Here is regverdig, want ek was wederstrewig teen sy mond\" (1:18). \"My oë versmag van trane\" (2:11). \"Jou profete het vir jou leuens en dwaasheid gesien... en het jou ongeregtigheid nie ontbloot nie\" (2:14). \"Stort jou hart uit soos water voor die aangesig van die Here\" (2:19).","bid":"Bid vir mense wat rou – oor verlies, verwoesting of die gevolge van sonde. Stort julle harte voor die Here uit oor dinge wat ons hartseer maak. Bid vir lande wat deur oorlog verwoes is.","vraag":"Klaagliedere wys dat dit reg is om voor God te huil. Waarom dink jy is dit belangrik om eerlik voor God te rou eerder as om te maak of alles reg is?","hoofstukke":[["Klaagliedere","LAM",1],["Klaagliedere","LAM",2]]},{"dag":217,"ref":"Klaagliedere 3 – 5; Obadja 1","titel":"\"Groot is U Trou\" – en Edom se Verraad","fase":5,"tydlyn":"Ná 586 v.C. Obadja: waarskynlik kort ná 586 v.C., oor Edom se optrede tydens die val van Jerusalem (Obadja se datum word ook vroeër geplaas).","agtergrond":"Klaagliedere 3 is die hart van die boek: in die middel van die diepste donker staan een van die grootste geloofsbelydenisse in die Bybel. Hoofstuk 5 eindig met 'n gebed wat nie opgelos is nie – die volk wag steeds. Obadja is die kortste boek in die Ou Testament (21 verse). Edom (nakomelinge van Esau, Jakob se broer) het vanuit hulle rotsvestings (bv. die gebied rondom die latere Petra) toegekyk, gejuig, geplunder en selfs vlugtelinge van Juda aan die Babiloniërs uitgelewer. Ps 137:7 onthou hoe hulle geskreeu het: \"Breek af, breek af!\"","leer":"Selfs in die donkerste tye is God se goedertierenheid nie uitgeput nie – dit is elke môre nuut. Ons kan stil wag op Sy redding. Maar wie toekyk en lag wanneer ander (veral familie) ly, of selfs van hulle swaarkry voordeel trek, sal deur God geoordeel word. God se koninkryk sal uiteindelik oorwin.","skrif":"\"Ek is die man wat ellende gesien het\" (Klaagl. 3:1). \"Dit is die goedertierenheid van die Here dat ons nie omgekom het nie, want sy barmhartighede is nie uitgeput nie; elke môre is dit nuut; groot is u trou!\" (3:22–23). \"Die Here is my deel, sê my siel; daarom sal ek op Hom hoop\" (3:24). \"Dit is goed om stil te wag op die redding van die Here\" (3:26). \"Laat ons ons weë ondersoek... en ons tot die Here bekeer\" (3:40). \"Bring ons terug tot U, o Here, dat ons kan terugkeer; vernuwe ons dae soos voorheen\" (5:21). Obadja: \"Die trotsheid van jou hart het jou bedrieg, jy wat in die klopskeure woon\" (Obadja 1:3). \"Weens die geweld aan jou broer Jakob... sal skaamte jou bedek\" (1:10). \"Jy moes nie met leedvermaak gekyk het nie\" (1:12). \"Soos jy gedoen het, sal aan jou gedoen word\" (1:15). \"Die koningskap sal aan die Here behoort\" (1:21).","bid":"Dank God dat Sy barmhartighede elke môre nuut is – sing of sê saam \"Groot is U trou\". Bid dat ons nooit met leedvermaak na ander se swaarkry sal kyk nie, maar sal help. Bid vir broers en susters om mekaar te ondersteun, nie teen mekaar te draai nie.","vraag":"Klaagliedere 3:22–23 is geskryf in die middel van verwoesting. Wat beteken dit vir jou dat God se genade \"elke môre nuut\" is?","hoofstukke":[["Klaagliedere","LAM",3],["Klaagliedere","LAM",4],["Klaagliedere","LAM",5],["Obadja","OBA",1]]},{"dag":218,"ref":"Psalms 73 – 75","titel":"\"Totdat Ek in die Heiligdomme van God Ingegaan het\"","fase":5,"inleiding":["Psalms 73–89 (Boek III): Geloof wanneer Alles Verlore Lyk","Boek III van die Psalms bevat veral psalms van Asaf (73–83) en die seuns van Korag (84–88). Baie van hierdie psalms worstel met die vraag hoe God se beloftes waar kan wees wanneer die tempel verwoes is en die volk ly (bv. Psalm 74, 79 en 89). Daarom lees ons dit ná die val van Jerusalem. Boek III eindig met Psalm 89, wat God se belofte aan Dawid besing – en dan vra waarom dit lyk of die belofte gebreek is. Die antwoord kom eers in Jesus, die Seun van Dawid."],"tydlyn":"Psalms van Asaf. Psalm 74 beskryf die verwoesting van die heiligdom (waarskynlik 586 v.C.).","agtergrond":"Asaf was 'n Levitiese musikant in Dawid se tyd, en sy familie (\"die seuns van Asaf\") het eeue lank in die tempel gesing; sommige psalms met sy naam kom uit later tye. Psalm 73 is een van die eerlikste psalms: die skrywer was amper jaloers op die voorspoed van goddelose mense, totdat hy in God se teenwoordigheid kom en die einde van die saak sien. Psalm 74 is 'n klaaglied oor die verwoeste tempel. Psalm 75 antwoord: God bepaal die tyd van oordeel.","leer":"Wanneer dit lyk of dit beter gaan met mense wat God nie volg nie, moet ons ons perspektief in God se teenwoordigheid kry. Die grootste skat is nie wat die goddeloses het nie, maar God self. Selfs wanneer dit lyk of God stil is oor 'n verwoesting, bly Hy Koning, en Hy oordeel op Sy bestemde tyd.","skrif":"Psalm 73: \"Ek was afgunstig op die grootpraters, toe ek die voorspoed van die goddelose sien\"; \"totdat ek in die heiligdomme van God ingegaan en op hulle einde gelet het\"; \"Wie het ek behalwe U in die hemel? Buiten U begeer ek ook niks op die aarde nie\"; \"Al beswyk my vlees en my hart, God is die rots van my hart en my deel tot in ewigheid\"; \"Maar wat my aangaan, dit is vir my goed om naby God te wees.\" Psalm 74: \"O God, waarom verstoot U vir altyd?\"; hulle het u heiligdom aan die brand gesteek; \"Tog is God my Koning van ouds af.\" Psalm 75: \"Wanneer Ek die bestemde tyd bereik, sal Ek regverdig oordeel.\"","bid":"Bid dat ons nie jaloers sal wees op mense wat dit goed het sonder God nie. Bid Psalm 73 se gebed: \"Buiten U begeer ek niks op die aarde nie.\" Dank God dat dit goed is om naby Hom te wees.","vraag":"Wat het die skrywer van Psalm 73 se perspektief verander? Wat help jou om perspektief te kry as jy jaloers voel?","hoofstukke":[["Psalms","PSA",73],["Psalms","PSA",74],["Psalms","PSA",75]]},{"dag":219,"ref":"Psalms 76 – 78","titel":"Onthou God se Wonders – en Vertel dit aan die Kinders","fase":5,"tydlyn":"Psalms van Asaf. Psalm 78 vertel die geskiedenis van die uittog tot by Dawid.","agtergrond":"Psalm 76 vier God as oorwinnaar (moontlik oor Sanherib in 701 v.C.). Psalm 77 begin met diepe angs in die nag, maar draai om wanneer die skrywer besluit om God se dade in die verlede te onthou. Psalm 78 is 'n lang geskiedenisles in poësie: van die uittog, deur die woestyn, tot by Dawid – met die doel dat die volgende geslag nie die vaders se foute sal herhaal nie. Matteus haal 78:2 aan oor Jesus se gelykenisse (Matteus 13:35).","leer":"Wanneer ons in die donker is, help dit om God se dade in die verlede te onthou. Elke geslag het die plig om God se dade aan die volgende geslag te vertel, sodat hulle op God sal vertrou en nie Sy werke vergeet nie. Die geskiedenis wys hoe dikwels God se volk vergeet het – en hoe getrou Hy steeds was.","skrif":"Psalm 76: \"God is bekend in Juda.\" Psalm 77: \"Sal die Here vir ewig verstoot?\"; \"Ek wil die dade van die Here vermeld; ja, ek wil dink aan u wonders van ouds af\"; \"O God, u weg is in heiligheid.\" Psalm 78: \"Ons wil dit nie voor hulle kinders verberg nie, maar aan die volgende geslag vertel die roemryke dade van die Here... sodat hulle op God hul vertroue kan stel en die dade van God nie vergeet nie\"; \"Hulle het die woestyn ingegaan en Hom versoek\"; \"Hy het gedink dat hulle vlees was\"; \"Hy het sy kneg Dawid verkies... om Jakob, sy volk, te laat wei.\"","bid":"Dank God vir die dinge wat Hy in ons familie se geskiedenis gedoen het – vertel 'n storie van God se trou in ons familie. Bid dat ons kinders hulle eendag aan hulle kinders sal vertel. Bid dat ons nie God se dade sal vergeet nie.","vraag":"Psalm 78 sê ouers moet God se dade aan die volgende geslag vertel. Watter storie van God se trou in ons familie moet jy eendag aan jou kinders vertel?","hoofstukke":[["Psalms","PSA",76],["Psalms","PSA",77],["Psalms","PSA",78]]},{"dag":220,"ref":"Psalms 79 – 82","titel":"\"Herstel Ons, o God\"","fase":5,"tydlyn":"Psalms van Asaf. Psalm 79 beskryf Jerusalem in puin (waarskynlik ná 586 v.C.). Psalm 80 pleit vir die noordelike stamme (moontlik ná 722 v.C.).","agtergrond":"Psalm 79 is 'n klaaglied: die nasies het in God se erfdeel ingekom en die tempel verontreinig. Psalm 80 gebruik die beeld van Israel as 'n wingerdstok wat God uit Egipte gehaal en geplant het, maar wat nou afgebrand is. Die refrein herhaal drie keer: \"O God, bring ons terug.\" Psalm 81 is 'n feeslied wat die volk aanmoedig om na God te luister. In Psalm 82 oordeel God die \"gode\" – waarskynlik onregverdige regters of geestelike magte; Jesus haal dit aan in Johannes 10:34.","leer":"In tye van verwoesting kan ons God vra om Sy eie Naam se ontwil te help. Ware herstel kom wanneer God Sy aangesig oor ons laat lig. God wil ons met die beste voed, maar ons moet na Hom luister. God sal alle onregverdige regters en magte oordeel en reg doen aan die armes en weeskinders.","skrif":"Psalm 79: \"Help ons, o God van ons heil, ter wille van die eer van u Naam.\" Psalm 80: \"O God, bring ons terug, en laat u aangesig lig, dan sal ons verlos wees\"; \"U het 'n wingerdstok uit Egipte uitgetrek.\" Psalm 81: \"Doen jou mond wyd oop, en Ek sal hom vul\"; \"Ag, as my volk maar na My wou luister!\" Psalm 82: \"Doen reg aan die geringe en die wees; laat die ellendige en die arme reg wedervaar\"; \"Staan op, o God, oordeel die aarde.\"","bid":"Bid Psalm 80 se refrein vir ons land: \"O God, bring ons terug, laat U aangesig lig, dan sal ons verlos wees.\" Bid vir regters en howe in ons land om reg te doen aan die armes. Bid dat ons na God sal luister.","vraag":"Psalm 81 sê God wil ons mond vul as ons dit oopmaak. Wat beteken dit om na God te luister en van Hom te ontvang?","hoofstukke":[["Psalms","PSA",79],["Psalms","PSA",80],["Psalms","PSA",81],["Psalms","PSA",82]]},{"dag":221,"ref":"Psalms 83 – 86","titel":"\"Hoe Lieflik is U Wonings\"","fase":5,"tydlyn":"Psalm 83 (Asaf), 84–85 (seuns van Korag), 86 (Dawid).","agtergrond":"Psalm 83 is 'n gebed teen 'n koalisie van nasies wat Israel wil uitwis. Psalm 84 is 'n pelgrimslied: die verlange om na God se huis in Jerusalem te gaan vir die feeste; die \"dal van Baka\" (dal van trane of droë balsembome) was 'n dor plek op die pad. Psalm 85 bid vir herstel ná die ballingskap (\"U het die lot van Jakob verander\"). Psalm 86 is Dawid se gebed in nood, met verwysings na God se Naam uit Exodus 34:6.","leer":"God se teenwoordigheid is die beste plek om te wees – een dag daar is beter as duisend elders. Pelgrims wat op God vertrou, maak selfs dor plekke vrugbaar. Wanneer God herstel, ontmoet goedertierenheid en trou mekaar. Ons kan in nood vra: \"Leer my u weg, Here; verenig my hart om u Naam te vrees.\"","skrif":"Psalm 83: \"O God, swyg nie.\" Psalm 84: \"Hoe lieflik is u wonings, o Here van die leërskare! My siel verlang... na die voorhowe van die Here\"; \"Welgeluksalig is die mens wie se sterkte in U is, in wie se hart die gebaande weë is. As hulle deur die dal van Baka trek, maak hulle dit tot 'n fontein\"; \"Want een dag in u voorhowe is beter as duisend elders\"; \"Die Here God is 'n son en skild.\" Psalm 85: \"Sal U ons nie weer lewend maak nie, sodat u volk hom in U kan verheug?\"; \"Goedertierenheid en trou sal mekaar ontmoet; geregtigheid en vrede sal mekaar kus.\" Psalm 86: \"Leer my u weg, o Here... verenig my hart om u Naam te vrees.\"","bid":"Bid dat ons, soos die psalmdigter, sal verlang na God se teenwoordigheid. Bid Psalm 86: \"Verenig ons harte om U Naam te vrees\" – dat ons nie verdeelde harte sal hê nie. Bid vir herlewing in ons land (Psalm 85).","vraag":"Psalm 84 sê een dag by God is beter as duisend elders. Wat is vir jou die mooiste \"plek\" of tyd waar jy God se nabyheid voel?","hoofstukke":[["Psalms","PSA",83],["Psalms","PSA",84],["Psalms","PSA",85],["Psalms","PSA",86]]},{"dag":222,"ref":"Psalms 87 – 89","titel":"Die Donkerste Psalm en God se Belofte aan Dawid","fase":5,"tydlyn":"Psalms 87–88 (seuns van Korag; 88 ook aan Heman), 89 (Etan die Esragiet). Psalm 89 is waarskynlik ná die val van Dawid se koningshuis (586 v.C.) geskryf, en sluit Boek III af.","agtergrond":"Psalm 87 is 'n verrassende visioen: nasies soos Egipte (Rahab), Babel, Filistea en Kus word as burgers van Sion ingeskryf – 'n voorafskaduwing van die kerk uit alle nasies. Psalm 88 is die enigste psalm wat sonder 'n sigbare lig van hoop eindig: \"duisternis is my bekende\". Psalm 89 besing die ewige verbond met Dawid (2 Samuel 7) in die eerste deel, maar vra dan in die tweede deel hoe God die kroon van Dawid in die stof kon laat val.","leer":"God se koninkryk is vir mense uit alle nasies. Die Bybel is eerlik genoeg om ook die donkerste gevoelens in te sluit – selfs wanneer ons niks anders kan sê nie, kan ons nog steeds na God roep, want Psalm 88 is 'n gebed. God se beloftes lyk soms gebreek, maar Hy hou dit: Jesus is die Seun van Dawid wie se troon vir ewig staan (Lukas 1:32–33).","skrif":"Psalm 87: \"Hierdie een is daar gebore\"; \"Al my fonteine is in jou.\" Psalm 88: \"O Here, God van my heil, bedags en snags roep ek voor U\"; \"U het vriend en metgesel ver van my verwyder; duisternis is my bekende.\" Psalm 89: \"Ek wil die goedertierenhede van die Here vir ewig besing\"; \"Ek het 'n verbond gesluit met my uitverkorene, aan Dawid my kneg gesweer: Ek sal jou nageslag vir ewig bevestig\"; \"Ek sal my verbond nie ontheilig nie\"; en dan die vraag: \"U het sy kroon tot op die aarde ontheilig\"; \"Waar is u vorige goedertierenhede, Here?\"; en tog die slot: \"Geloofd sy die Here tot in ewigheid! Amen, ja amen.\"","bid":"Bid vir mense wat in diepe duisternis is – depressie, rou, eensaamheid – dat hulle sal bly roep en dat iemand naby hulle sal kom. Dank God dat Sy belofte aan Dawid in Jesus vervul is. Dank Hom dat Sy kerk mense uit alle nasies insluit.","vraag":"Psalm 88 eindig sonder 'n antwoord. Waarom dink jy het God so 'n donker psalm in die Bybel ingesluit?","hoofstukke":[["Psalms","PSA",87],["Psalms","PSA",88],["Psalms","PSA",89]]},{"dag":223,"ref":"Esegiël 1 – 3","titel":"Die Heerlikheid van God by die Rivier Kebar","fase":5,"inleiding":["Die Ballingskap: Esegiël, Daniël en Psalms 90–106","Terwyl Jeremia in Jerusalem gepreek het, het God ook profete onder die ballinge in Babel geroep. Esegiël, 'n priester, is in 597 v.C. saam met koning Jojagin weggevoer en het by die Kebarkanaal naby Babel gewoon. Daniël is reeds in 605 v.C. as jong man weggevoer en het in die koninklike hof van Babel en later Persië gedien. Albei leer dat God nie in Jerusalem ingeperk is nie: Hy regeer ook in Babel, en Hy sal Sy volk herstel.","Boek IV van die Psalms (Psalm 90–106) begin met 'n gebed van Moses en verkondig herhaaldelik \"Die Here regeer!\" – 'n boodskap wat die ballinge nodig gehad het toe daar geen koning uit Dawid op die troon was nie. Dit eindig met die gebed: \"Verlos ons, o Here onse God, en versamel ons uit die nasies\" (106:47)."],"tydlyn":"Die vyfde jaar van die ballingskap van koning Jojagin, 593 v.C. (1:2). \"die dertigste jaar\" (1:1) verwys waarskynlik na Esegiël se ouderdom – die ouderdom waarop 'n priester sy diens sou begin. By die Kebarkanaal in Babilonië.","agtergrond":"Esegiël was 'n priester wat nooit in die tempel sou kon dien nie, want hy was in ballingskap. Maar God kom na hom toe, ver van Jerusalem af, in 'n oorweldigende visioen: lewende wesens, wiele vol oë wat in alle rigtings kan beweeg, en bo-oor 'n troon met Iemand wat soos 'n mens lyk, omring deur 'n reënboog. God se troon is mobiel – Hy is nie aan een plek gebonde nie. Esegiël moet 'n boekrol eet en word as \"wagter\" vir Israel aangestel.","leer":"God se heerlikheid is groter as ons kan beskryf, en Hy is ook teenwoordig in die \"ballingskap\" – die vreemde, moeilike plekke van ons lewe. Wie God se Woord bring, moet dit eers self \"eet\" – dit moet deel van hom word. God roep Sy dienaars om getrou te waarsku, of mense luister of nie. Ons is verantwoordelik om te praat; hulle reaksie is hulle verantwoordelikheid.","skrif":"\"Die hemel het oopgegaan, en ek het gesigte van God gesien\" (1:1). Die vier lewende wesens en die wiele (1:4–21). \"Soos die voorkoms van die reënboog... so was die voorkoms van die glans rondom. Dit was die voorkoms van die gestalte van die heerlikheid van die Here\" (1:28). \"Mensekind, staan op jou voete\" (2:1). \"Of hulle luister of nie... hulle sal weet dat daar 'n profeet onder hulle was\" (2:5). Hy eet die boekrol, en dit is soet soos heuning (3:1–3). \"Mensekind, Ek het jou as wagter oor die huis van Israel aangestel\" (3:17). \"As jy die goddelose waarsku... het jy jou siel gered\" (3:19).","bid":"Aanbid God vir Sy heerlikheid wat oral teenwoordig is. Bid dat ons God se Woord sal \"eet\" – dit diep in ons sal laat insink. Bid vir moed om vriende te \"waarsku\" en van Jesus te vertel, ongeag hoe hulle reageer.","vraag":"Esegiël moes die boekrol eet voor hy dit kon preek. Wat beteken dit om God se Woord \"te eet\"?","hoofstukke":[["Esegiël","EZK",1],["Esegiël","EZK",2],["Esegiël","EZK",3]]},{"dag":224,"ref":"Esegiël 4 – 7","titel":"Profetiese Dramas: Die Beleg van Jerusalem","fase":5,"tydlyn":"593–592 v.C. By die ballinge in Babilonië, terwyl Jerusalem nog staan.","agtergrond":"Die ballinge het gehoop dat Jerusalem nie sal val nie en dat hulle binnekort sal terugkeer. Esegiël voer opvallende \"straatteater\" op om die boodskap van die komende beleg te wys: hy bou 'n model van Jerusalem met 'n kleisteen, lê vir 390 dae op sy linkersy en 40 dae op sy regtersy, eet karige rantsoene, en skeer sy hare af en verdeel dit in drie (wat die lot van die inwoners verbeeld). Hoofstuk 6–7 kondig die einde aan vir die hele land weens die afgodery op die berge.","leer":"God kommunikeer op kreatiewe maniere sodat mense kan verstaan. Sy oordeel oor volgehoue sonde is seker. Die refrein \"julle sal weet dat Ek die Here is\" (meer as 60 keer in Esegiël) wys die doel: dat mense God sal ken – deur oordeel of deur redding. Afgode stel ons uiteindelik teleur.","skrif":"Die model van die beleg (4:1–3). Esegiël dra die skuld van die volk deur op sy sy te lê (4:4–6). Brood gebak op mis as teken van onreinheid in ballingskap (4:12–15). Die hare in drie verdeel (5:1–4). \"Ek sal julle oordeel... en julle sal weet dat Ek die Here is\" (5:13; 6:7). \"Ek is gebreek deur hulle hoereragtige hart wat van My afgewyk het\" (6:9). \"Die einde kom!\" (7:2–6). \"Hulle silwer en goud sal hulle nie kan red in die dag van die grimmigheid van die Here nie\" (7:19).","bid":"Bid dat ons gesin God sal ken – nie deur harde lesse nie, maar deur ons ore oop te maak vir Hom. Bid vir mense wat vals hoop koester. Dank God dat Hy op baie maniere met ons praat.","vraag":"God sê telkens \"julle sal weet dat Ek die Here is\". Wat dink jy is God se uiteindelike doel met alles wat gebeur?","hoofstukke":[["Esegiël","EZK",4],["Esegiël","EZK",5],["Esegiël","EZK",6],["Esegiël","EZK",7]]},{"dag":225,"ref":"Esegiël 8 – 11","titel":"Die Heerlikheid Verlaat die Tempel – en 'n Nuwe Hart","fase":5,"tydlyn":"Die sesde jaar, 592 v.C. (8:1). In 'n visioen word Esegiël na Jerusalem geneem.","agtergrond":"In 'n visioen sien Esegiël wat in die tempel in Jerusalem gebeur: 'n afgodsbeeld by die noordpoort, die oudstes wat in die geheim diere en kruipende diere op die mure aanbid (soos in Egipte), vroue wat huil oor Tammuz (die Mesopotamiese god van die plantegroei wat elke jaar \"sterf\"), en manne wat met hul rug na die tempel die son aanbid. Dan sien hy hoe die heerlikheid van die Here stap vir stap die tempel verlaat – na die drumpel, na die oostepoort, en dan na die Olyfberg oos van die stad. Dit is een van die hartseerste oomblikke in die Ou Testament. (In Esegiël 43 keer die heerlikheid terug.)","leer":"God sien wat ons in die geheim doen. Ons kan God se teenwoordigheid deur volgehoue sonde verdryf – Hy bly nie waar Hy nie welkom is nie. Maar God beskerm die getroues wat oor die sonde treur. En Hy belowe om ons klipharte met harte van vlees te vervang – iets wat net Hy kan doen.","skrif":"\"Sien jy wat hulle doen? Groot gruwels\" (8:6). \"Die Here sien ons nie, die Here het die land verlaat\" (8:12). Die vroue wat oor Tammuz huil (8:14). Die manne wat die son aanbid (8:16). 'n Merk op die voorhoofde van dié wat sug oor die gruwels (9:4). Die heerlikheid gaan na die drumpel (10:4), na die oostepoort (10:18–19), na die berg oos van die stad (11:23). \"Ek sal vir hulle 'n sagte hart gee, en 'n nuwe gees sal Ek in hulle binneste gee; en Ek sal die klipperige hart uit hulle vlees uithaal en hulle 'n hart van vlees gee\" (11:19).","bid":"Bid dat God se teenwoordigheid altyd in ons huis welkom sal wees. Bid vir harte wat treur oor sonde, nie onverskillig is nie. Vra God om enige \"klipharte\" in ons met harte van vlees te vervang.","vraag":"Die mense het gesê \"die Here sien ons nie\". Hoe verander dit jou keuses as jy onthou dat God alles sien?","hoofstukke":[["Esegiël","EZK",8],["Esegiël","EZK",9],["Esegiël","EZK",10],["Esegiël","EZK",11]]},{"dag":226,"ref":"Esegiël 12 – 14","titel":"Valse Profete en Afgode in die Hart","fase":5,"tydlyn":"592–591 v.C. By die ballinge in Babilonië.","agtergrond":"Esegiël pak sy goed soos 'n vlugteling en grawe 'n gat deur die muur in die aand – 'n teken dat Sedekia en die inwoners van Jerusalem in ballingskap sal gaan (vgl. 2 Konings 25:4–7, waar Sedekia snags vlug en sy oë uitgesteek word, sodat hy Babel nie sien nie – 12:13). Valse profete het \"vrede\" voorspel en die muur met kalk wit gesmeer in plaas daarvan om dit te herstel. In hoofstuk 14 kom oudstes na Esegiël om God te raadpleeg, maar God sê hulle het \"afgode in hulle hart\". Noag, Daniël en Job word genoem as voorbeelde van baie regverdige mense.","leer":"God se woord sal nie uitgestel word nie. Valse leraars bedek probleme met mooi woorde in plaas daarvan om dit reg te stel. Afgodery begin in die hart, lank voordat dit sigbaar word. Ons kan nie op ander se geloof staatmaak vir ons eie redding nie – elkeen staan self voor God.","skrif":"Esegiël pak soos 'n balling (12:3–7). \"Hy sal Babel nie sien nie, en tog sal hy daar sterwe\" (12:13). \"Geen woord van My sal meer uitgestel word nie\" (12:28). \"Wee die dwase profete wat hulle eie gees volg\" (13:3). \"Hulle verlei my volk deur te sê: Vrede! terwyl daar geen vrede is nie... en hulle smeer dit met kalk\" (13:10). \"Hierdie manne het hulle afgode in hul hart opgeneem\" (14:3). \"Al was hierdie drie manne daarin: Noag, Daniël en Job, hulle sou deur hul geregtigheid net hulle eie lewe red\" (14:14).","bid":"Vra God om ons harte te deursoek vir enige \"afgode\" – dinge wat ons meer liefhet as Hom. Bid vir leiers wat die waarheid praat in plaas van probleme \"wit te smeer\". Bid dat elke kind 'n persoonlike geloof sal hê.","vraag":"God sê afgode kan \"in die hart\" wees. Hoe lyk 'n afgod van die hart vandag?","hoofstukke":[["Esegiël","EZK",12],["Esegiël","EZK",13],["Esegiël","EZK",14]]},{"dag":227,"ref":"Esegiël 15 – 17","titel":"Die Nuttelose Wingerd, die Ontroue Bruid en die Seder-Takkie","fase":5,"tydlyn":"c. 591 v.C. By die ballinge.","agtergrond":"Hoofstuk 15: hout van 'n wingerdstok is nutteloos as dit nie vrug dra nie – dit kan net verbrand word. Hoofstuk 16 is 'n lang en baie skerp gelykenis (let wel: volwasse temas – gesels ouderdomsgepas): God het Jerusalem gevind soos 'n weggegooide baba, haar grootgemaak, met haar getrou en haar pragtig gemaak, maar sy het met haar skoonheid gehoereer agter afgode en nasies aan. Tog eindig dit met 'n ewige verbond en versoening. Hoofstuk 17 is 'n raaisel oor arende en 'n seder (Babel, Egipte en Sedekia), wat eindig met God wat self 'n teer takkie van die seder plant – 'n Messiaanse beeld.","leer":"Ons bestaan om vrug vir God te dra. Alles wat ons is en het, is God se genade aan ons – om dit teen Hom te gebruik, is diep ondankbaarheid. God se liefde is so groot dat Hy, ná die oordeel, 'n ewige verbond sluit en versoening doen. God self sal 'n nuwe Koning plant wat groot sal word.","skrif":"Die hout van die wingerdstok (15:2–6). God vind die baba in haar bloed: \"Lewe!\" (16:6). \"Ek het met jou 'n verbond gesluit... en jy het myne geword\" (16:8). \"Jy het op jou skoonheid vertrou en gehoereer\" (16:15). \"Dit was die ongeregtigheid van Sodom... hoogmoed, oorvloed van brood en sorgelose rus... maar die hand van die ellendige en behoeftige het sy nie versterk nie\" (16:49). \"Ek sal vir jou 'n ewige verbond oprig\" (16:60). \"Ek sal self van die top van die hoë seder neem... 'n teer takkie... en dit plant op 'n hoë berg\" (17:22).","bid":"Dank God vir alles wat Hy uit genade aan ons gegee het. Bid dat ons Sy gawes (skoonheid, talente, geld) tot Sy eer sal gebruik. Bid teen die sondes van Sodom in ons eie lewe: hoogmoed, oorvloed en onverskilligheid teenoor die armes (16:49).","vraag":"Esegiël 16:49 sê die sonde van Sodom was ook hoogmoed, oorvloed en onverskilligheid teenoor die armes. Waarom dink jy noem God dit?","hoofstukke":[["Esegiël","EZK",15],["Esegiël","EZK",16],["Esegiël","EZK",17]]},{"dag":228,"ref":"Esegiël 18 – 20","titel":"Elkeen is Verantwoordelik – God Wil nie die Dood van die Sondaar nie","fase":5,"tydlyn":"591–590 v.C. By die ballinge (20:1 – die sewende jaar).","agtergrond":"Die ballinge het 'n spreekwoord gehad: \"Die vaders het suur druiwe geëet, en die tande van die kinders word stomp\" – met ander woorde, ons ly vir ons voorouers se sonde, dit is nie ons skuld nie. God verwerp die spreekwoord. Hoofstuk 18 leer dat elke mens self verantwoordelik is voor God, en dat 'n mens kan omdraai. Hoofstuk 19 is 'n klaaglied oor die konings van Juda. Hoofstuk 20 gaan deur Israel se geskiedenis van opstand, en wys dat God telkens om Sy Naam se ontwil genadig was.","leer":"Ons kan nie ons ouers, ons omstandighede of ons verlede blameer vir ons eie keuses nie. Elkeen is persoonlik verantwoordelik voor God. Maar dit beteken ook dat niemand vasgevang is in die patroon van die vorige geslag nie – elkeen kan omdraai en lewe. God het geen behae in die dood van die goddelose nie; Hy smeek: \"Bekeer julle en lewe!\"","skrif":"\"Die vaders het suur druiwe geëet, en die tande van die kinders word stomp\" (18:2). \"Die siel wat sondig, dit sal sterwe\" (18:4, 20). \"Die seun sal nie die ongeregtigheid van die vader dra nie\" (18:20). \"Het Ek enigsins behae in die dood van die goddelose... en nie veel eerder daarin dat hy hom bekeer van sy weë en lewe nie?\" (18:23). \"Werp al julle oortredinge van julle af... en maak vir julle 'n nuwe hart en 'n nuwe gees\" (18:31). \"Want Ek het geen behae in die dood van hom wat sterwe nie... bekeer julle dan en lewe!\" (18:32). \"Ek het gehandel om my Naam ontwil\" (20:9, 14, 22, 44).","bid":"Dank God dat elkeen van ons 'n nuwe begin kan hê, ongeag ons familiegeskiedenis. Bid vir die moed om verantwoordelikheid vir ons eie keuses te neem. Bid vir mense wat vasgevang voel in 'n familiepatroon van sonde, dat hulle in Christus vry sal word.","vraag":"Esegiël 18 sê ons kan nie ons ouers blameer vir ons sonde nie, maar ons is ook nie vasgevang in hulle foute nie. Waarom is albei hierdie waarhede goeie nuus?","hoofstukke":[["Esegiël","EZK",18],["Esegiël","EZK",19],["Esegiël","EZK",20]]},{"dag":229,"ref":"Esegiël 21 – 23","titel":"Die Swaard van Babel en Iemand om in die Bres te Staan","fase":5,"tydlyn":"c. 590–588 v.C. By die ballinge, net voor die finale beleg van Jerusalem.","agtergrond":"Hoofstuk 21 beskryf Nebukadnesar by 'n kruispad, waar hy deur waarsêery (pyle skud, die huisgode raadpleeg, na 'n lewer kyk) besluit of hy eers Jerusalem of Rabba (Ammon) gaan aanval – maar God bepaal die uitkoms. 21:27 is 'n Messiaanse belofte: die kroon sal bly tot Hy kom \"wat die reg het\". Hoofstuk 22 lys die sondes van Jerusalem se leiers. Hoofstuk 23 is 'n gelykenis van twee susters, Ohola (Samaria) en Oholiba (Jerusalem), wat ontrou was (let wel: volwasse taal; gesels ouderdomsgepas).","leer":"God gebruik selfs heidense konings se besluite vir Sy doel. Die koningskap van Dawid sal oorleef totdat die regmatige Koning, Jesus, kom. God soek mense wat in die \"bres\" (die gat in die muur) sal staan – mense wat vir hulle land bid en vir reg opstaan. Om uit ander se foute te leer, is wys; om dit te herhaal, is erger.","skrif":"Die swaard is geslyp (21:9–11). Nebukadnesar by die kruispad (21:21–22). \"Omkeer, omkeer, omkeer sal Ek dit maak... totdat Hy kom wat die reg het, aan wie Ek dit sal gee\" (21:27). Die sondes van Jerusalem se leiers, priesters en profete (22:6–29). \"Ek het onder hulle gesoek na 'n man wat 'n muur sou bou en in die bres voor my aangesig sou staan vir die land... maar Ek het niemand gevind nie\" (22:30). Die twee susters (23:1–49).","bid":"Bid dat elkeen van ons 'n mens sal wees wat \"in die bres staan\" – vir ons land, ons skool, ons familie. Dank Jesus dat Hy die Koning is \"wat die reg het\". Bid dat ons uit ander se foute sal leer.","vraag":"God het iemand gesoek om \"in die bres te staan\" en niemand gevind nie (22:30). Hoe kan 'n tiener vandag in die bres staan vir ander?","hoofstukke":[["Esegiël","EZK",21],["Esegiël","EZK",22],["Esegiël","EZK",23]]},{"dag":230,"ref":"Esegiël 24 – 26","titel":"Die Begin van die Beleg en die Oordeel oor die Nasies","fase":5,"tydlyn":"Die negende jaar, tiende maand, tiende dag (24:1) – Januarie 588 v.C., die dag waarop Nebukadnesar se beleg van Jerusalem begin het (vgl. 2 Konings 25:1). Hoofstuk 26: 587/586 v.C.","agtergrond":"Op dieselfde dag wat die beleg begin, kry Esegiël, honderde kilometers ver, die opdrag om dit op te teken. Dan sterf sy vrou, \"die lus van sy oë\", en God beveel hom om nie openlik te rou nie – as teken vir die ballinge dat hulle so geskok sal wees oor die verlies van die tempel en hulle kinders in Jerusalem dat hulle nie eers sal kan rou nie. Hoofstukke 25–32 bevat oordele oor die nasies rondom (Ammon, Moab, Edom, Filistea, Tirus, Sidon, Egipte). Tirus was 'n ryk eilandstad aan die kus; Nebukadnesar het dit 13 jaar beleër, en Alexander die Grote het dit in 332 v.C. verower deur 'n dam na die eiland te bou.","leer":"God se profete betaal soms 'n hoë persoonlike prys. God se oordeel begin by Sy eie huis, maar die nasies wat oor Israel se val gejuig het, sal ook verantwoording doen. Om bly te wees oor ander se ongeluk, is sonde voor God.","skrif":"\"Skryf vir jou die naam van die dag op, net hierdie dag\" (24:2). \"Mensekind, kyk, Ek neem die lus van jou oë van jou weg\" (24:16). \"En ek het die môre met die volk gespreek, en die aand het my vrou gesterwe\" (24:18). \"So sal Esegiël vir julle 'n teken wees\" (24:24). Oordeel oor Ammon wat in die hande geklap het oor Israel se val (25:6). Oordeel oor Edom en Filistea (25:12–17). Tirus: \"Ek sal jou 'n kaal rots maak; 'n droogplek van nette sal jy wees\" (26:14).","bid":"Bid vir mense wat 'n geliefde verloor het. Dank God vir mense wat vir hulle geloof 'n prys betaal. Bid dat ons nooit bly sal wees oor ander se swaarkry nie.","vraag":"Esegiël het selfs met sy vrou se dood God gehoorsaam. Wat leer dit jou oor wat dit kan kos om God te volg?","hoofstukke":[["Esegiël","EZK",24],["Esegiël","EZK",25],["Esegiël","EZK",26]]},{"dag":231,"ref":"Esegiël 27 – 29","titel":"Die Trotse Koning van Tirus en Egipte","fase":5,"tydlyn":"c. 587–571 v.C. (29:17 is die laaste gedateerde profesie in die boek, die 27ste jaar, 571 v.C.).","agtergrond":"Hoofstuk 27 beskryf Tirus as 'n pragtige skip, gelaai met handelsware van oor die hele bekende wêreld, wat sink. Hoofstuk 28 rig hom tot die koning van Tirus, wat gesê het \"ek is 'n god\". Die beskrywing van iemand wat in Eden was, 'n gesalfde gerub, volmaak geskape totdat ongeregtigheid in hom gevind is, word deur baie Christene ook gesien as 'n beeld van die val van Satan agter die trotse koning (vgl. Jesaja 14). Die teks se direkte onderwerp bly die koning van Tirus. Hoofstuk 29 begin die oordeel oor Egipte, wat Israel soos 'n \"rietstaf\" teleurgestel het.","leer":"Rykdom, handel en sukses kan 'n hart trots maak sodat dit dink \"ek is 'n god\". Hoogmoed was die oorsprong van die kwaad. Ons moet nie op wêreldse magte steun wat ons sal teleurstel nie (Egipte se rietstaf) – net op God.","skrif":"Tirus soos 'n pragtige skip (27:3–9). \"Jy het gesê: Ek is volkome in skoonheid\" (27:3). \"Omdat jou hart hoog is, en jy sê: Ek is 'n god\" (28:2). \"Deur jou groot wysheid in jou handel het jy jou rykdom vermeerder, en jou hart het hoog geword\" (28:5). \"Jy was in Eden, die tuin van God... jy was 'n gesalfde gerub... volkome was jy in jou weë van die dag af dat jy geskape is totdat ongeregtigheid in jou gevind is\" (28:13–15). \"Jou hart het hoog geword weens jou skoonheid\" (28:17). Egipte was vir Israel \"'n rietstaf\" (29:6–7).","bid":"Bid teen hoogmoed in ons harte, veral wanneer dit goed gaan. Bid dat ons nie op mense of magte sal vertrou wat soos 'n \"rietstaf\" breek nie. Bid vir besigheidsleiers om eerlik en nederig te bly.","vraag":"Die koning van Tirus het gedink hy is 'n god omdat hy so suksesvol was. Hoe kan sukses 'n mens se hart trots maak?","hoofstukke":[["Esegiël","EZK",27],["Esegiël","EZK",28],["Esegiël","EZK",29]]},{"dag":232,"ref":"Esegiël 30 – 32","titel":"Die Val van Farao","fase":5,"tydlyn":"c. 587–585 v.C. Profesieë oor Egipte.","agtergrond":"Egipte was vir eeue die simbool van menslike mag en grootheid – met sy piramides, die Nyl en farao's wat as gode beskou is. Esegiël beskryf farao as 'n groot krokodil (Hebreeus: \"draak/seemonster\") in die Nyl, en vergelyk Egipte met 'n reusagtige seder wat omgekap word – soos Assirië, wat ook trots was en geval het. Hoofstuk 32 eindig met 'n klaaglied: al die trotse nasies lê saam in die doderyk. Nebukadnesar het Egipte inderdaad in 568/567 v.C. aangeval.","leer":"Geen mag op aarde is groot genoeg om teen God te staan nie. Die groot ryke van die geskiedenis het almal gekom en gegaan – Assirië, Egipte, Babel – maar God se koninkryk bly. In die dood is alle mense gelyk, ongeag hulle aardse mag.","skrif":"\"Die dag van die Here is naby\" (30:3). \"Ek sal die arms van Farao breek\" (30:21). \"Kyk, Assur was 'n seder op die Libanon\" (31:3). \"Omdat hy hom verhef het in hoogte... het Ek hom oorgegee\" (31:10–11). Farao soos 'n \"seemonster\" in die riviere (32:2). Die nasies in die doderyk: Assur, Elam, Meseg, Edom (32:22–30).","bid":"Dank God dat Sy koninkryk vir ewig staan terwyl menslike ryke val. Bid vir nederigheid vir wêreldleiers. Bid dat ons ons sekuriteit in God sal soek, nie in menslike mag nie.","vraag":"Egipte het gedink dit sal altyd groot wees. Watter \"groot magte\" vertrou mense vandag op?","hoofstukke":[["Esegiël","EZK",30],["Esegiël","EZK",31],["Esegiël","EZK",32]]},{"dag":233,"ref":"Esegiël 33 – 35","titel":"Die Nuus van Jerusalem se Val en die Goeie Herder","fase":5,"tydlyn":"Die twaalfde jaar, tiende maand, vyfde dag (33:21) – Januarie 585 v.C. Die nuus van Jerusalem se val (Julie/Augustus 586) bereik die ballinge.","agtergrond":"Hoofstuk 33 herhaal Esegiël se roeping as wagter. Dan kom 'n vlugteling met die nuus: \"Die stad is ingeneem!\" Esegiël se boodskap verander van oordeel na hoop. Die ballinge het hom soos 'n mooi sanger behandel – hulle het graag geluister, maar niks gedoen nie (33:31–32). Hoofstuk 34 veroordeel die \"herders\" (leiers) wat hulleself gevoed het in plaas van die skape, en God belowe dat Hy self die Herder sal wees, met \"my kneg Dawid\" as herder. Jesus sê: \"Ek is die goeie Herder\" (Johannes 10:11) en het gekom \"om die verlorene te soek\" (Lukas 19:10; vgl. 34:16).","leer":"Dit is nie genoeg om God se woord graag te hoor nie – ons moet dit doen. Leiers moet dien, nie hulleself verryk nie. God self soek Sy verlore skape, verbind die gewondes en versterk die swakkes. Jesus is die Goeie Herder wat die beloftes van Esegiël 34 vervul.","skrif":"\"Mensekind, Ek het jou as wagter aangestel\" (33:7). \"So waar as Ek leef... Ek het geen behae in die dood van die goddelose nie... Bekeer julle, bekeer julle\" (33:11). \"Die stad is ingeneem!\" (33:21). \"Kyk, jy is vir hulle soos 'n liefdeslied... hulle hoor jou woorde, maar doen dit nie\" (33:32). \"Wee die herders... wat hulleself wei! Moet die herders nie die skape wei nie?\" (34:2). \"Ek self sal my skape wei\" (34:15). \"Die verlorene sal Ek soek, en die weggedrewene sal Ek terugbring, en die gewonde sal Ek verbind, en die siekes sal Ek versterk\" (34:16). \"Ek sal oor hulle een herder verwek... my kneg Dawid\" (34:23). Edom (berg Seïr) se oordeel (35).","bid":"Dank Jesus dat Hy die Goeie Herder is wat ons soek wanneer ons verdwaal. Bid vir leiers in die kerk om goeie herders te wees. Bid dat ons nie net \"hoorders\" van die Woord sal wees nie, maar \"doeners\" (Jakobus 1:22).","vraag":"Die mense het van Esegiël se preke gehou soos van 'n mooi liedjie, maar niks gedoen nie. Hoe kan ons seker maak dat ons nie net luister nie, maar ook doen?","hoofstukke":[["Esegiël","EZK",33],["Esegiël","EZK",34],["Esegiël","EZK",35]]},{"dag":234,"ref":"Esegiël 36 – 37","titel":"'n Nuwe Hart en die Vallei van Droë Bene","fase":5,"tydlyn":"c. 585 v.C. en later. By die ballinge in Babel.","agtergrond":"Die ballinge het gevoel soos \"droë bene\" – hulle hoop was dood (37:11). In hoofstuk 36 belowe God om Sy volk terug te bring, hulle met skoon water te reinig, en hulle 'n nuwe hart en Sy eie Gees te gee – nie omdat hulle dit verdien nie, maar om Sy heilige Naam se ontwil. In hoofstuk 37 sien Esegiël 'n vallei vol droë bene. In Hebreeus beteken dieselfde woord (ruach) \"asem\", \"wind\" en \"gees\". Jesus se gesprek met Nikodemus oor \"gebore uit water en Gees\" (Johannes 3:5) gryp waarskynlik terug na Esegiël 36.","leer":"God kan lewe gee waar alles dood is – selfs droë bene. Hy doen dit deur Sy Woord en Sy Gees. Die nuwe hart en die Gees wat God belowe, word aan elke gelowige in Jesus gegee. Ware vernuwing kom van God, nie van menslike pogings nie. God sal Sy volk weer verenig onder een Koning.","skrif":"\"Nie om julle ontwil doen Ek dit nie... maar om my heilige Naam ontwil\" (36:22). \"Ek sal skoon water op julle sprinkel, sodat julle rein word\" (36:25). \"Ek sal julle 'n nuwe hart gee en 'n nuwe gees in julle binneste gee; en Ek sal die hart van klip uit julle vlees wegneem en julle 'n hart van vlees gee. En Ek sal my Gees in julle binneste gee\" (36:26–27). \"Mensekind, sal hierdie bene lewend word?\" – \"Here Here, U weet dit\" (37:3). \"Profeteer oor hierdie bene... Droë bene, hoor die woord van die Here!\" (37:4). \"Kom uit die vier windstreke, o gees, en blaas in hierdie gesneuweldes, dat hulle lewend kan word\" (37:9). \"Ons bene is verdor, en ons verwagting is vergaan\" (37:11). Die twee stokke word een (37:15–22). \"My kneg Dawid sal koning oor hulle wees\" (37:24).","bid":"Bid vir \"droë bene\" in ons lewe, kerk en land – plekke waar die hoop dood is – dat God se Gees nuwe lewe sal gee. Dank God vir die nuwe hart en die Heilige Gees wat Hy in Jesus aan ons gee. Bid vir herlewing.","vraag":"Watter \"droë bene\" sien jy rondom jou – mense of situasies waar dit lyk of daar geen hoop is nie? Hoe kan ons daarvoor bid?","hoofstukke":[["Esegiël","EZK",36],["Esegiël","EZK",37]]},{"dag":235,"ref":"Esegiël 38 – 39","titel":"Gog en Magog: God Beskerm Sy Volk","fase":5,"tydlyn":"Profesie oor 'n toekomstige tyd (\"aan die einde van die jare\", 38:8).","agtergrond":"Gog uit die land Magog lei 'n groot koalisie van nasies uit die noorde en die verre streke teen God se herstelde volk wat in vrede lewe. God self gryp in en vernietig hulle. Die identiteit van Gog word baie verskillend verklaar: 'n historiese figuur, 'n simbool van al die magte wat teen God se volk opstaan, of 'n eindtydse vyand. Openbaring 20:8 gebruik \"Gog en Magog\" as simbool van die finale opstand van die nasies teen God. Wees versigtig met spekulasie wat dit direk aan moderne lande koppel – die teks se hoofpunt is God se oorwinning.","leer":"God beskerm Sy volk teen alle vyande. Selfs die magtigste koalisie van nasies kan nie God se planne omverwerp nie. Die doel van God se ingryping is dat die nasies Hom sal ken en dat Hy Sy Gees oor Sy volk sal uitstort. Ons kan in vrede leef, want die toekoms is in God se hand.","skrif":"Gog trek op teen 'n land van \"onbeskermde dorpe... wat in rus woon\" (38:11). \"Sodat die nasies My kan ken\" (38:16). \"Ek sal My groot en heilig maak en My bekend maak voor die oë van baie nasies; en hulle sal weet dat Ek die Here is\" (38:23). God vernietig die leërs (39:1–6). \"Ek sal my heilige Naam bekend maak onder my volk Israel\" (39:7). \"Ek sal my aangesig nie meer vir hulle verberg nie, wanneer Ek my Gees uitgestort het oor die huis van Israel\" (39:29).","bid":"Dank God dat Hy Sy volk beskerm teen alle vyande. Bid vir vervolgde Christene regoor die wêreld. Bid dat ons nie bang sal wees vir die toekoms nie, want God regeer.","vraag":"Baie mense spekuleer oor die eindtyd. Wat is volgens hierdie hoofstukke die belangrikste ding om te weet oor die toekoms?","hoofstukke":[["Esegiël","EZK",38],["Esegiël","EZK",39]]},{"dag":236,"ref":"Esegiël 40 – 42","titel":"Die Visioen van die Nuwe Tempel","fase":5,"tydlyn":"Die 25ste jaar van die ballingskap, 573 v.C. – \"in die veertiende jaar nadat die stad verwoes was\" (40:1).","agtergrond":"Veertien jaar ná die verwoesting van die tempel sien Esegiël in 'n visioen 'n nuwe tempel op 'n hoë berg. 'n Man met 'n meetlyn en me

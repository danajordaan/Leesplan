<style>
/* Layout: one-column phone app, sticky bottom tab bar; night-sky header with a lamp glow (Ps 119:105) */
:root{
  --bg:#eef3fa; --card:#ffffff; --ink:#1f2547; --muted:#5d6687; --line:#d8e0ee;
  --night:#232a52; --night2:#33407a; --lamp:#f2b544; --lamp-soft:#fdf0cf;
  --sea:#2f7f8a; --sea-soft:#dcefef; --coral:#d9684e; --coral-soft:#fbe5df; --leaf:#4f8a3c; --leaf-soft:#e3f0dc;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito", "Avenir", system-ui, -apple-system, sans-serif;
  --r:18px; --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141831; --card:#1e2446; --ink:#eef0fb; --muted:#a7aecd; --line:#2f3762;
  --night:#0f1330; --night2:#252e63; --lamp:#f5c060; --lamp-soft:#3a3324;
  --sea:#62b6c0; --sea-soft:#1c3a42; --coral:#ef8a72; --coral-soft:#43282a; --leaf:#86c46f; --leaf-soft:#22372a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141831; --card:#1e2446; --ink:#eef0fb; --muted:#a7aecd; --line:#2f3762;
  --night:#0f1330; --night2:#252e63; --lamp:#f5c060; --lamp-soft:#3a3324;
  --sea:#62b6c0; --sea-soft:#1c3a42; --coral:#ef8a72; --coral-soft:#43282a; --leaf:#86c46f; --leaf-soft:#22372a; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.55;-webkit-text-size-adjust:100%}
body.groot{--fs:18.5px}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
.top{background:radial-gradient(120% 90% at 85% 0%,#4a4f8f 0%,transparent 60%),linear-gradient(180deg,var(--night) 0%,var(--night2) 100%);color:#f6f2e6;padding:22px 16px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top .in{max-width:640px;margin:0 auto;position:relative;z-index:1}
.top .stars{position:absolute;inset:0;opacity:.55}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.75}
.top h1{font-size:28px;margin-top:4px}
.top p{margin:6px 0 0;opacity:.85}
.lampglow{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(242,181,68,.55),transparent 65%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.8}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:16px;border:1px solid var(--line)}
.today{padding:0;overflow:hidden}
.today .art{display:block;width:100%;aspect-ratio:400/260;max-width:100%;background:var(--sea-soft)}
.today .art svg{display:block;width:100%;height:100%}
.today .body{padding:16px}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sea);background:var(--sea-soft);padding:4px 10px;border-radius:99px}
.refs{font-weight:800;color:var(--muted);margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;cursor:pointer;text-decoration:none;min-height:48px}
.btn.primary{background:var(--lamp);color:#2a1f05}
.btn.dark{background:var(--night2);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--sea-soft);color:var(--ink)}
.btn.block{width:100%}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
/* day view */
.back{background:none;border:0;color:#f6f2e6;font-weight:800;padding:0;cursor:pointer;margin-bottom:8px;min-height:32px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.chap{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:14px;background:var(--sea-soft);color:var(--ink);text-decoration:none;font-weight:800;border:1.5px solid transparent}
.chap small{font-weight:600;color:var(--muted);font-size:12px}
.chap.seen{border-color:var(--leaf)}
.pillar{border-radius:var(--r);margin-top:12px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pillar summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.pillar summary::-webkit-details-marker{display:none}
.pillar summary .ic{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px}
.pillar summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.pillar[open] summary::after{transform:rotate(-135deg)}
.pillar .pb{padding:0 16px 16px;max-width:65ch}
.q{background:var(--lamp-soft);border-radius:var(--r);padding:16px;margin-top:12px}
.q h3{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);opacity:.8}
.q p{margin:6px 0 0;font-weight:700;font-size:1.08em}
label.f{display:block;font-weight:800;margin-top:14px}
label.f span{display:block;font-weight:600;color:var(--muted);font-size:14px}
textarea,input[type=text],input[type=tel]{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;margin-top:6px;resize:vertical}
textarea{min-height:84px}
.done-banner{display:flex;gap:12px;align-items:center;background:var(--leaf-soft);border-radius:var(--r);padding:14px 16px;margin-top:12px;font-weight:800}
.intro{background:var(--card);border-left:0;border-radius:var(--r);padding:16px;margin-top:16px;border:1px dashed var(--line)}
.intro h3{font-size:18px}
/* lists */
.list{display:grid;gap:10px;margin-top:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item .t{min-width:0;flex:1}
.item .t p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-weight:900;color:#fff}
.check.on{background:var(--leaf);border-color:var(--leaf)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
/* progress */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lamp);border-radius:99px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:12px}
.bk{font-size:11.5px;font-weight:800;text-align:center;padding:8px 2px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.bk.part{background:var(--lamp-soft);color:var(--ink)}
.bk.full{background:var(--lamp);color:#2a1f05;border-color:var(--lamp)}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.dg{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.dg.done{background:var(--leaf);border-color:var(--leaf);color:#fff}
.dg.cur{outline:2.5px solid var(--lamp)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .tin{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;width:100%}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);padding:6px 2px;cursor:pointer;border-radius:12px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink);background:var(--lamp-soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;max-width:90vw}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:20px;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--leaf-soft);color:var(--leaf)}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.confirm{background:var(--coral-soft);border-radius:14px;padding:12px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.today,.card{animation:rise .35s ease both}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script id="plans" type="application/json">[{"id":"hele-bybel-401","naam":"Die hele Bybel in 401 dae","beskrywing":"Al 66 boeke in logiese, historiese volgorde – begin by Jesus in Markus.","fases":[{"n":1,"title":"Jesus die Messias – die Evangelie volgens Markus","intro":["Ons begin by Jesus, want Hy is die middelpunt van die hele Bybel. Markus is die kortste en vinnigste evangelie – die woord \"dadelik\" kom tientalle kere voor. Vroeë kerkleiers (Papias, c. 120 n.C.) skryf dat Markus die prediking van die apostel Petrus opgeteken het. Dit is waarskynlik c. 55–70 n.C. geskryf, moontlik in Rome, vir gelowiges wat vervolging beleef het.","Markus se boek draai om twee vrae: Wie is Jesus? (antwoord in 8:29 – \"U is die Christus\") en Wat beteken dit om Hom te volg? (8:34 – \"laat hy homself verloën en sy kruis opneem en My volg\"). Hou hierdie twee vrae deur die hele fase voor die kinders."]},{"n":2,"title":"Die Begin en die Belofte – Genesis en Job","intro":["Nadat ons Jesus in Markus leer ken het, gaan ons terug na die begin. Genesis (\"oorsprong\") verduidelik waarom die wêreld Jesus nodig het: God skep alles goed; die mens sondig; en God begin dadelik met Sy reddingsplan. Genesis 1–11 handel oor die hele mensdom; Genesis 12–50 oor een familie – Abraham, Isak, Jakob en Josef – deur wie God al die nasies wil seën (Genesis 12:3; Galasiërs 3:8).","Volgens Joodse en Christelike oorlewering het Moses Genesis saamgestel (vgl. Johannes 5:46). Die boek Job word aan die einde van hierdie fase gelees, omdat die verhaal waarskynlik in die tyd van die aartsvaders afspeel (Job tree self as priester vir sy familie op, en sy rykdom word in vee getel). Die skrywer en datum van Job is onbekend."]},{"n":3,"title":"Verlossing en Verbond – Exodus tot Deuteronomium","intro":["Genesis eindig met Israel se familie in Egipte. Exodus begin sowat 400 jaar later: die familie het 'n volk geword, maar hulle is slawe. God verlos hulle deur Moses, sluit by die berg Sinai 'n verbond met hulle, gee Sy wet en kom woon tussen hulle in die tabernakel. Levitikus leer hoe 'n heilige God tussen sondige mense kan woon. Numeri vertel van die veertig jaar in die woestyn, en Deuteronomium is Moses se laaste preke voordat Israel die beloofde land binnegaan.","Datum van die uittog: 1 Konings 6:1 sê die tempel is 480 jaar ná die uittog begin bou (c. 966 v.C.), wat die uittog op c. 1446 v.C. plaas. Baie geleerdes verkies 'n datum van c. 1270–1260 v.C. (onder farao Ramses II), onder meer omdat Exodus 1:11 die stad \"Raämses\" noem. Albei standpunte word deur Bybelgetroue geleerdes gehuldig. Hierdie gids noem albei. Die boeke word tradisioneel aan Moses toegeskryf (Jesus noem dit \"die wet van Moses\", Lukas 24:44).","Hierdie fase is uiters belangrik om Jesus te verstaan: Hy is die Paaslam (1 Korintiërs 5:7), die nuwe Moses, die ware Hoëpriester en die volmaakte offer (Hebreërs). Die Nuwe Testament gebruik die uittog as prentjie van ons verlossing uit die slawerny van sonde."]},{"n":4,"title":"Die Land en die Koninkryk – Josua tot Salomo","intro":["Ná Moses se dood lei Josua die volk die beloofde land in. Die tyd van die rigters wys wat gebeur wanneer elkeen doen \"wat reg is in sy eie oë\": 'n kringloop van sonde, verdrukking, gebed en redding. Rut wys God se genade in 'n donker tyd, en lei na koning Dawid. Samuel is die laaste rigter en die eerste groot profeet; hy salf Saul en daarna Dawid. Dawid, \"'n man na God se hart\", word die model-koning, en God belowe dat sy troon vir ewig sal bestaan (2 Samuel 7) – 'n belofte wat in Jesus, die Seun van Dawid, vervul word.","Ná 2 Samuel lees ons Psalms 1–72 (Boek I en II van die Psalms, grootliks aan Dawid toegeskryf), dan koning Salomo (1 Konings 1–11), en die wysheidsboeke wat met hom verbind word: Spreuke, Hooglied en Prediker.","Tydlyn: Die inname van Kanaän c. 1400 v.C. (vroeë datum) of c. 1230 v.C. (laat datum). Die rigters c. 1380/1200–1050 v.C. Saul c. 1050–1010 v.C. Dawid c. 1010–970 v.C. Salomo c. 970–930 v.C. Die bestaan van Dawid se dinastie word buite die Bybel bevestig deur die Tel Dan-inskripsie (9de eeu v.C.), wat die \"huis van Dawid\" noem."]},{"n":5,"title":"Die Verdeelde Koninkryk, die Profete, die Ballingskap en die Terugkeer","intro":["Ná Salomo se dood (c. 930 v.C.) skeur die koninkryk: tien stamme in die noorde vorm \"Israel\" (hoofstad later Samaria), en Juda en Benjamin in die suide vorm \"Juda\" (hoofstad Jerusalem, met Dawid se nakomelinge as konings). Die noordryk het van die begin af afgode aanbid en het nie een goeie koning gehad nie; dit val in 722 v.C. teen Assirië. Juda het goeie en slegte konings gehad, en val in 586 v.C. teen Babilonië. Die tempel word verwoes en die volk word in ballingskap weggevoer.","In hierdie donker eeue stuur God profete: Elia en Elisa (wat nie boeke geskryf het nie), en daarna die skrywende profete. Ons lees hulle boeke op die plek waar hulle in die geskiedenis inpas, sodat ons kan verstaan met wie en waaroor hulle praat. Die profete het die volk geroep om terug te keer na die verbond, gewaarsku oor oordeel, en hoop gegee: God sal 'n nuwe Koning uit Dawid stuur, 'n nuwe verbond sluit en Sy Gees uitstort. Dit word alles in Jesus vervul.","Na 70 jaar laat die Persiese koning Kores die Jode toe om terug te keer (538 v.C.). Hulle herbou die tempel en die mure van Jerusalem, maar wag steeds op die belofte. Ons sluit die Ou Testament af met Maleagi, die laaste Psalms (107–150), en die boeke Kronieke – die geskiedenis oorvertel vir die teruggekeerde volk.","Tydlyn (by benadering, volgens die algemeen gebruikte chronologie van E. R. Thiele): Verdeling 930 v.C.; Elia c. 860–850; Elisa c. 850–795; Jona, Amos, Hosea c. 790–725; val van Samaria 722; Jesaja c. 740–700; Josia 640–609; Jeremia 627–c. 580; eerste wegvoering na Babel 605; val van Jerusalem 586; Kores se dekreet 538; tempel herbou 520–516; Ester c. 483–473; Esra 458; Nehemia 445; Maleagi c. 430."]},{"n":6,"title":"Die Messias het Gekom – Matteus, Johannes en Lukas","intro":["Ons het die Ou Testament klaar gelees en gesien hoe alles na een Persoon uitwys: die nakomeling van die vrou wat die slang se kop sal vermorsel, die seën vir al die nasies deur Abraham, die Profeet soos Moses, die Paaslam, die Seun van Dawid wat vir ewig sal regeer, die Kneg van die Here wat vir ons sonde ly, die Seun van die mens, die nuwe verbond. Nou lees ons hoe dit in Jesus vervul is. Ons het met Markus begin; nou lees ons die ander drie evangelies.","Die \"stil jare\" tussen die testamente (c. 430–5 v.C.)","Ná Maleagi was daar sowat 400 jaar lank geen profeet in Israel nie. Maar baie het gebeur wat ons help om die Nuwe Testament te verstaan:","-   Persiese tyd (tot 332 v.C.): Die Jode woon in Judea onder Persiese heerskappy. Die sinagoge (plaaslike vergaderplek om die Skrif te lees en te bid) ontwikkel waarskynlik in hierdie tyd en in die ballingskap.","-   Griekse tyd (332–167 v.C.): Alexander die Grote verower die hele Ooste. Grieks word die gemeenskaplike taal van die wêreld – daarom is die Nuwe Testament in Grieks geskryf. Die Ou Testament word in Egipte in Grieks vertaal (die Septuagint, vanaf c. 250 v.C.). Ná Alexander se dood veg die Ptolemeërs (Egipte) en Seleukiede (Sirië) oor Israel (vgl. Daniël 11).","-   Die Makkabeërs (167–63 v.C.): Die Seleukiedekoning Antiochus IV Epifanes verbied die Joodse godsdiens en ontheilig die tempel (167 v.C.). Die priesterfamilie van die Makkabeërs kom in opstand en reinig die tempel in 164 v.C. – die oorsprong van die Fees van die Tempelinwyding (Chanoeka), wat Jesus bygewoon het (Johannes 10:22). Daarna regeer Joodse konings (die Hasmoneërs) vir sowat 'n eeu.","-   Romeinse tyd (vanaf 63 v.C.): Die Romeinse generaal Pompeius verower Jerusalem. Rome stel Herodes die Grote (37–4 v.C.), 'n Idumeër (afstammeling van Edom), as koning aan. Hy brei die tempel uitgebreid uit, maar is berug vir sy wreedheid. Ná sy dood word sy koninkryk tussen sy seuns verdeel (Archelaus in Judea, Herodes Antipas in Galilea, Filippus in die noordooste), en later regeer Romeinse goewerneurs (soos Pontius Pilatus) oor Judea.","-   Groepe in Jesus se tyd: Fariseërs (ywerig vir die wet en hulle mondelinge oorleweringe; geglo in die opstanding), Sadduseërs (die priesterlike elite wat die tempel beheer het; net die vyf boeke van Moses as gesaghebbend aanvaar; nie in die opstanding geglo nie), skrifgeleerdes (kenners van die wet), Seloté (wou Rome met geweld verdryf), Esseners (afgesonderde groep, verbind met die Dooie See-rolle), tollenaars (Jode wat vir Rome belasting ingevorder het en as verraaiers beskou is), en Samaritane (afstammelinge van die volke wat in 722 v.C. in Israel gevestig is, met hul eie tempel en net die vyf boeke van Moses).","Die drie evangelies in hierdie fase","Matteus (tradisioneel deur die tollenaar en apostel Matteus/Levi geskryf; datum c. 60–80 n.C.) skryf veral vir Joodse lesers: hy haal die Ou Testament gereeld aan (\"sodat vervul sou word wat gespreek is\") en wys Jesus as die beloofde Koning, die Seun van Dawid. Johannes (die apostel, \"die dissipel vir wie Jesus liefgehad het\"; c. 90 n.C.) skryf \"sodat julle kan glo dat Jesus die Christus is, die Seun van God, en dat julle, deur te glo, die lewe kan hê in sy Naam\" (Johannes 20:31). Lukas (die geneesheer en reisgenoot van Paulus; c. 60–80 n.C.) het alles \"van voor af noukeurig nagegaan\" en skryf 'n ordelike verslag; sy evangelie is deel een van 'n tweedelige werk, saam met Handelinge. Daarom lees ons Lukas laaste, direk voor Handelinge."]},{"n":7,"title":"Die Kerk, die Briewe en die Voleinding – Handelinge tot Openbaring","intro":["Lukas se tweede boek, Handelinge, vertel hoe die opgestane Jesus deur Sy Heilige Gees Sy kerk bou: \"Julle sal my getuies wees in Jerusalem en in die hele Judea en Samaria en tot aan die uiterste van die aarde\" (Handelinge 1:8). Die boek volg hierdie patroon – van Jerusalem (hoofstuk 1–7), na Judea en Samaria (8–12), en dan deur Paulus se sendingreise tot in Rome, die hoofstad van die wêreld (13–28).","Die briewe in die Nuwe Testament is geskryf aan kerke en persone wat ons in Handelinge ontmoet. Daarom lees ons elke brief op die plek in die verhaal waar dit (waarskynlik) geskryf is. So verstaan ons beter waarom Paulus en die ander apostels skryf wat hulle skryf. Die presiese datums en volgorde van die briewe word deur geleerdes bespreek; die gids volg 'n algemeen aanvaarde volgorde en sê waar daar verskil is.","Tydlyn (by benadering): Pinkster c. 30/33 n.C.; Stefanus se dood en Paulus se bekering c. 33–35; Paulus se eerste sendingreis c. 46–48; die vergadering in Jerusalem c. 49; tweede reis c. 49–52 (Paulus in Korinte terwyl Gallio goewerneur was – 'n inskripsie in Delfi dateer Gallio se ampstermyn op 51–52 n.C.); derde reis c. 52–57; Paulus gevange in Sesarea c. 57–59 en in Rome c. 60–62; die vervolging onder keiser Nero ná die brand van Rome in 64; Paulus en Petrus waarskynlik in die middel-60's in Rome tereggestel; Jerusalem en die tempel verwoes in 70 n.C.; Johannes se laaste geskrifte c. 90–95."]}],"dae":[{"dag":1,"ref":"Markus 1 – 3","titel":"Die Gesag en die Roeping","fase":1,"tydlyn":"c. 27–30 n.C. Galilea, in die noorde van Israel, onder Romeinse oorheersing. Herodes Antipas regeer Galilea namens Rome.","agtergrond":"Johannes die Doper preek in die woestyn by die Jordaan en roep Israel tot bekering, soos Jesaja en Maleagi voorspel het (Markus 1:2–3). Jesus begin dan Sy bediening rondom die See van Galilea, waar vissery 'n belangrike bedryf was – swaar belas deur Herodes en Rome. Die Fariseërs was 'n godsdienstige beweging wat die wet en hul eie oorleweringe streng nagekom het; die Herodiane was ondersteuners van die Herodes-familie. Hierdie twee groepe het normaalweg nie saamgestem nie, maar hulle span saam teen Jesus (3:6).","leer":"Jesus kom met die gesag van God self. Hy het gesag oor bose geeste, oor siekte en selfs om sondes te vergewe – iets wat net God kan doen. Sy oproep is: \"Bekeer julle en glo die evangelie\" (1:15), en \"Kom agter My aan\" (1:17). Om Jesus te volg is 'n persoonlike, volle oorgawe, selfs wanneer dit teen die stroom ingaan.","skrif":"Die Vader verklaar by die doop: \"U is my geliefde Seun\" (1:11). Simon, Andreas, Jakobus en Johannes los \"dadelik\" hul nette en volg Hom (1:18–20). Jesus dryf 'n onreine gees uit en die mense is verbaas oor Sy gesag (1:27). Hy raak 'n melaatse aan en maak hom rein (1:41). Hy vergewe die verlamde man se sondes en genees hom as bewys dat Hy die gesag het om sondes te vergewe (2:5–12). Hy roep Levi, 'n tollenaar, en eet saam met sondaars (2:14–17). Hy noem Homself \"Here van die sabbat\" (2:28). Hy kies die twaalf (3:13–19), en sê wie die wil van God doen, is Sy familie (3:35).","bid":"Dank die Here dat Jesus nie ver weg is nie, maar mense roep om naby Hom te wees. Bid dat elkeen in ons gesin Sy stem sal hoor en \"dadelik\" sal volg, ook wanneer vriende of die kultuur iets anders sê. Bely sonde en dank Hom dat Hy die gesag het om te vergewe.","vraag":"Wat moes die vissers agterlaat om Jesus te volg? Wat sou dit vir jou beteken om jou \"nette\" te los?","hoofstukke":[["Markus","MRK",1],["Markus","MRK",2],["Markus","MRK",3]]},{"dag":2,"ref":"Markus 4 – 5","titel":"Die Gesaaide Woord en Jesus se Mag oor Chaos","fase":1,"tydlyn":"c. 28–29 n.C. Rondom die See van Galilea, en aan die oostekant in die gebied van die Gadareners (Dekapolis – tien Griekse stede).","agtergrond":"Die See van Galilea lê sowat 200 m onder seevlak, omring deur heuwels. Koue lug wat van die berge afstroom, kan skielik hewige storms veroorsaak. Die oostekant van die see was hoofsaaklik nie-Joods (Grieks-Romeins); daarom was daar 'n trop varke – diere wat vir Jode onrein was. 'n Vrou met 'n bloedvloeiing was volgens die wet onrein (Levitikus 15:25) en sou uit die samelewing uitgesluit gewees het. Gelykenisse was alledaagse verhale met 'n geestelike waarheid: dit openbaar die waarheid aan dié wat wil hoor, en verberg dit vir dié wat nie wil nie.","leer":"God se Woord werk soos saad: hoe ons dit ontvang, bepaal of dit vrug dra. En die Jesus wie se woord ons ontvang, is die Here oor elke vorm van chaos – die natuur, die bose, siekte en selfs die dood. Daarom roep Hy ons op tot geloof in plaas van vrees (4:40; 5:36).","skrif":"Die gelykenis van die saaier en die vier soorte grond (4:1–20); die mosterdsaad (4:30–32). Jesus bestraf die wind en sê vir die see: \"Swyg, wees stil!\" en die dissipels vra: \"Wie is Hy tog?\" (4:39–41). Hy bevry die besete man met die \"legioen\" geeste, wat daarna in die Dekapolis van Jesus vertel (5:1–20). Die vrou word gesond deur Sy kleed aan te raak, en Jesus noem haar \"dogter\" (5:25–34). Vir Jaïrus sê Hy: \"Moenie vrees nie, glo net\" en wek sy dogtertjie op: \"Talita koemi\" (5:36–42).","bid":"Bid dat ons harte goeie grond sal wees vir God se Woord – dat die besigheid van skool, sport en fone dit nie sal verstik nie. Bring elkeen se eie \"storms\" (vrese, druk, siekte) na Jesus en bid vir geloof in plaas van vrees.","vraag":"Watter soort grond in die gelykenis lyk die meeste soos jou hart op die oomblik? Waarom?","hoofstukke":[["Markus","MRK",4],["Markus","MRK",5]]},{"dag":3,"ref":"Markus 6 – 8","titel":"Wie is Jesus? Die Groot Belydenis","fase":1,"tydlyn":"c. 29 n.C. Galilea, Tirus en Sidon (Fenisië), die Dekapolis, en Sesarea Filippi, uiterste noorde van Israel.","agtergrond":"Herodes Antipas (seun van Herodes die Grote) laat Johannes die Doper onthoof (6:14–29). Jesus beweeg daarna ook buite Joodse gebied. Sesarea Filippi was 'n heidense sentrum: daar was 'n heiligdom vir die Griekse god Pan by 'n grot, en Herodes die Grote het daar 'n tempel vir keiser Augustus gebou. Juis daar vra Jesus: \"Wie sê julle is Ek?\" Die Fariseërs het baie mensgemaakte reëls oor rituele reiniging gehad (7:1–13).","leer":"Jesus is die Christus (die Messias, die Gesalfde Koning wat God beloof het). Maar Sy koningskap lyk anders as wat mense verwag het: Hy gaan ly, sterf en opstaan. Wie Hom volg, moet homself verloën en sy kruis opneem. Ware reinheid kom van binne, uit 'n hart wat deur God verander is, nie uit uiterlike rituele nie.","skrif":"Die dood van Johannes die Doper (6:14–29). Jesus voed die vyfduisend (6:30–44) en loop op die water (6:45–52). Hy leer dat dit wat uit die hart kom, 'n mens onrein maak (7:20–23). Die Sirofenisiese vrou se geloof (7:24–30). Hy voed die vierduisend, waarskynlik in nie-Joodse gebied (8:1–10). Petrus bely: \"U is die Christus\" (8:29). Dadelik voorspel Jesus Sy lyding, dood en opstanding (8:31), en sê: \"As iemand agter My aan wil kom, laat hy homself verloën en sy kruis opneem en My volg\" (8:34).","bid":"Bid dat elkeen van ons persoonlik sal kan sê: \"U is die Christus.\" Bid vir moed om onsself te verloën – om Jesus se wil bo ons eie gemak, gewildheid of planne te stel. Vra die Here om ons harte van binne af rein te maak.","vraag":"As Jesus vandag vir jou vra: \"Wie sê jy is Ek?\" – wat sou jy eerlik antwoord?","hoofstukke":[["Markus","MRK",6],["Markus","MRK",7],["Markus","MRK",8]]},{"dag":4,"ref":"Markus 9 – 10","titel":"Ware Grootheid: Dien, nie Heers nie","fase":1,"tydlyn":"c. 29–30 n.C. Van Galilea op pad suid na Jerusalem, deur Perea (oos van die Jordaan) en Jerigo.","agtergrond":"Op die berg van die verheerliking verskyn Moses (wat die Wet verteenwoordig) en Elia (wat die Profete verteenwoordig) saam met Jesus – die hele Ou Testament getuig van Hom. In die Romeinse wêreld is mag, eer en rykdom as die hoogste waardes beskou. Kinders het geen status gehad nie. Die rykdom van die ryk jongman sou in sy tyd as 'n teken van God se seën beskou word; daarom is die dissipels so verbaas oor Jesus se woorde.","leer":"In God se koninkryk word grootheid gemeet aan diensbaarheid. Jesus het gekom om te dien en Sy lewe te gee as losprys vir baie. Om Hom te volg beteken om nederig soos 'n kind te ontvang, om niks – ook nie besittings nie – bo Hom te stel nie, en om ander te dien.","skrif":"Die verheerliking: \"Dit is my geliefde Seun, luister na Hom\" (9:7). Die vader van die besete seun: \"Ek glo, Here, kom my ongeloof te hulp\" (9:24). Jesus neem 'n kindjie in hul midde (9:36–37). Hy seën die kinders (10:13–16). Die ryk jongman gaan bedroef weg, want hy het baie besittings gehad (10:17–22). \"Die Seun van die mens het nie gekom om gedien te word nie, maar om te dien en sy lewe te gee as 'n losprys vir baie\" (10:45). Blinde Bartiméus roep: \"Seun van Dawid, ontferm U oor my\" en volg Jesus (10:46–52).","bid":"Bid dat ons as gesin mekaar sal dien, nie probeer wen nie. Bid dat ons kinders hulle waarde sal vind in God se liefde, nie in status, gewildheid of besittings nie. Bid ook die eerlike gebed van 9:24: \"Here, help my ongeloof.\"","vraag":"Waar sien jy in jou skool of vriendekring die \"wêreld se\" idee van grootheid? Hoe sou Jesus se idee daar lyk?","hoofstukke":[["Markus","MRK",9],["Markus","MRK",10]]},{"dag":5,"ref":"Markus 11 – 13","titel":"Die Koning kom na Jerusalem","fase":1,"tydlyn":"Die laaste week voor die kruisiging, c. 30 of 33 n.C. Jerusalem en die tempel, tydens die Paasfees.","agtergrond":"Met Paasfees het honderdduisende pelgrims na Jerusalem gekom. Jesus ry op 'n eselsvul die stad binne en vervul Sagaria 9:9 – 'n koning wat nederig en vreedsaam kom. Die tempel is beheer deur die hoëpriesters (meestal uit die Sadduseërs), en handel en geldwisseling het in die voorhof van die heidene plaasgevind – juis die plek waar nie-Jode moes kon bid. Die tempel is in 70 n.C. deur die Romeine onder Titus verwoes, net soos Jesus voorspel het.","leer":"God soek egte geloof, opregte aanbidding en vrug – nie net 'n godsdienstige buitekant nie. Jesus is die Koning en Seun wat die vrug kom haal. Hy roep ons ook om waaksaam te bly en te leef in die lig van Sy wederkoms.","skrif":"Die skare roep \"Hosanna!\" (11:9–10). Die vyeboom met blare maar sonder vrug (11:12–14, 20–21) omraam die tempelreiniging: \"My huis sal 'n huis van gebed genoem word vir al die nasies\" (11:17). Die gelykenis van die wynbouers wat die seun doodmaak (12:1–12). Die vraag oor belasting deur Fariseërs en Herodiane: \"Gee aan die keiser wat aan die keiser behoort, en aan God wat aan God behoort\" (12:17). Die grootste gebod: liefde vir God en jou naaste (12:29–31). Die arm weduwee gee alles (12:41–44). Jesus voorspel die verwoesting van die tempel (13:2) en sê: \"Waak!\" (13:37).","bid":"Bid dat ons geloof eg sal wees en vrug sal dra – nie net \"blare\" wat goed lyk nie. Bid dat ons God met ons hele hart sal liefhê en ons naaste soos onsself. Bid vir 'n wakker, gereed lewe wat op Jesus se koms wag.","vraag":"Wat is die verskil tussen 'n \"vyeboom met blare\" en 'n \"vyeboom met vrugte\" in 'n Christen se lewe?","hoofstukke":[["Markus","MRK",11],["Markus","MRK",12],["Markus","MRK",13]]},{"dag":6,"ref":"Markus 14 – 16","titel":"Die Kruis en die Leë Graf","fase":1,"tydlyn":"Paasfees, c. 30 of 33 n.C. Betanië, die bovertrek, Getsémané, die hoëpriester se huis, Pilatus se hof, Golgota en die graf.","agtergrond":"Die Paasmaaltyd het Israel se verlossing uit Egipte herdenk (Exodus 12). Die Sanhedrin (die Joodse raad van 71 lede) het Jesus snags verhoor. Latere Joodse regsreëls (in die Misjna, c. 200 n.C. opgeteken) verbied onder meer verhore oor halsmisdade in die nag; of dié reëls reeds in Jesus se tyd gegeld het, is nie seker nie, maar die verhoor was duidelik onregverdig, met valse getuies (14:56). Net die Romeinse goewerneur, Pontius Pilatus (26–36 n.C.), kon die doodstraf oplê. Kruisiging was die Romeinse straf vir slawe en opstandelinge. Let wel: die oudste manuskripte van Markus eindig by 16:8; verse 9–20 is waarskynlik later bygevoeg (jou Bybel dui dit dikwels aan). Die opstanding self word in 16:1–8 en in al vier evangelies duidelik geleer.","leer":"Jesus se dood was nie 'n ongeluk nie, maar die losprys waarvan Hy gepraat het (10:45). Hy het in ons plek gesterf, en die tempelvoorhangsel wat skeur wys dat die weg na God nou oop is. Sy liggaamlike opstanding bewys dat Hy die dood oorwin het. Selfs dissipels wat Hom in die steek gelaat het (Petrus), word deur Hom teruggeroep.","skrif":"Die vrou salf Jesus by voorbaat vir Sy begrafnis (14:3–9). Die Nagmaal: \"Dit is my bloed, die bloed van die nuwe testament, wat vir baie uitgestort word\" (14:24). Getsémané: \"Nogtans nie wat Ek wil nie, maar wat U wil\" (14:36). Jesus bely voor die Sanhedrin dat Hy die Christus is (14:61–62). Petrus verloën Hom drie keer (14:66–72). Die kruisiging (15:24), \"My God, my God, waarom het U My verlaat?\" (15:34, uit Psalm 22). Die voorhangsel skeur van bo na onder (15:38), en die Romeinse offisier sê: \"Waarlik, hierdie man was die Seun van God\" (15:39). Die engel by die leë graf: \"Hy het opgestaan... gaan sê vir sy dissipels en vir Petrus\" (16:6–7).","bid":"Dank Jesus dat Hy in ons plek gesterf het en dat ons sonde vergewe kan word. Dank Hom vir die leë graf. Bid vir elkeen wat soos Petrus gefaal het, dat hulle sal weet die Here roep hulle terug. Bid dat ons sal leef in die krag van die opstanding.","vraag":"Waarom dink jy noem die engel spesifiek vir Petrus by die naam (16:7)?","hoofstukke":[["Markus","MRK",14],["Markus","MRK",15],["Markus","MRK",16]]},{"dag":7,"ref":"Genesis 1 – 3","titel":"Die Skepping, die Mens en die Sondeval","fase":2,"tydlyn":"Die begin. Die Bybel gee nie 'n datum nie.","agtergrond":"Die volke rondom Israel het skeppingsverhale gehad waarin die wêreld uit 'n stryd tussen gode ontstaan het (bv. die Babiloniese Enuma Elisj, waar die god Mardoek die wêreld uit die liggaam van die godin Tiamat maak) en waarin mense geskep is om slawe vir die gode te wees. Genesis is heeltemal anders: daar is net een God; Hy skep met Sy woord, ordelik en sonder stryd; die son en maan is nie gode nie, maar ligte wat Hy gemaak het; en die mens is na God se beeld geskep, met waardigheid en 'n taak om die aarde te bewerk en te bewaar.","leer":"God is die Skepper en Eienaar van alles, en alles wat Hy gemaak het, was \"baie goed\". Elke mens – man en vrou – dra Sy beeld en het dus waarde. Sonde begin wanneer ons God se woord betwyfel en self wil besluit wat goed en kwaad is. Sonde het werklike gevolge: skaamte, skuld, verwyt, gebroke verhoudings en die dood. Maar God soek die mens op (\"Waar is jy?\") en belowe reeds 'n Verlosser.","skrif":"\"In die begin het God die hemel en die aarde geskape\" (1:1). God skep die mens na Sy beeld, man en vrou (1:27), en sien dat alles baie goed is (1:31). God gee een verbod (2:16–17). Die slang vra: \"Is dit ook so dat God gesê het...?\" (3:1). Adam en Eva eet, hul oë gaan oop en hulle kruip weg (3:6–8). Adam blameer Eva, Eva blameer die slang (3:12–13). God belowe dat die nakomeling van die vrou die slang se kop sal vermorsel (3:15) – die eerste belofte van Christus. God maak vir hulle velklere (3:21).","bid":"Loof God as Skepper. Dank Hom dat elkeen van ons na Sy beeld gemaak is en waarde het. Bid dat ons nie na stemme sal luister wat God se woord betwyfel nie. Bely eerlik ons sonde, sonder om ander te blameer, en dank Hom vir die belofte van Jesus.","vraag":"Die slang het nie gesê \"God bestaan nie\", maar \"Het God regtig gesê...?\" Hoe hoor ons vandag dieselfde vraag?","hoofstukke":[["Genesis","GEN",1],["Genesis","GEN",2],["Genesis","GEN",3]]},{"dag":8,"ref":"Genesis 4 – 7","titel":"Sonde Versprei en die Vloed Kom","fase":2,"tydlyn":"Die vroeë mensdom, voor die vloed. Die Bybel gee nie datums nie.","agtergrond":"Die geslagsregister in hoofstuk 5 dra die verhaal van Adam tot Noag en wys dat die belofte van 3:15 deur Set se lyn voortgaan. Die lang ouderdomme is 'n kenmerk van hierdie periode; dit word ná die vloed al korter. Die uitdrukking \"seuns van God\" in 6:2 word verskillend verklaar (engele, of Set se nakomelinge); die punt is dat die mensdom se korrupsie volkome geword het. Ook ander antieke volke het vloedverhale gehad (bv. die Gilgamesj-epos), maar net in die Bybel is die vloed 'n regverdige oordeel oor sonde, met genade vir wie God vertrou.","leer":"Sonde groei as dit nie bemeester word nie – van 'n verkeerde hart, na jaloesie, na moord, na 'n hele samelewing vol geweld. God neem sonde ernstig op en oordeel dit regverdig. Maar Hy bewaar ook dié wat Hom vertrou: Noag het genade gevind in die oë van die Here, en het in geloof gehoorsaam.","skrif":"God waarsku Kain: \"die sonde lê en loer by die deur... maar jy moet daaroor heers\" (4:7). Kain vermoor Abel en vra: \"Is ek my broer se oppasser?\" (4:9). Lameg spog met wraak (4:23–24). \"Toe het hulle begin om die Naam van die Here aan te roep\" (4:26). Henog het met God gewandel (5:24). Die aarde was vol geweld en elke versinsel van die mens se hart was net sleg (6:5, 11). \"Maar Noag het genade gevind in die oë van die Here\" (6:8). Noag doen alles soos God beveel (6:22; 7:5). God sluit self die deur van die ark (7:16).","bid":"Bid dat ons die \"sonde wat by die deur lê\" vroeg sal raaksien en daaroor sal heers met God se hulp – veral jaloesie en woede. Bid dat ons soos Henog met God sal wandel, en soos Noag gehoorsaam sal wees, al lag die wêreld.","vraag":"Kain was jaloers op sy broer. Hoe kan jaloesie in 'n gesin of tussen vriende begin, en wat doen ons daarmee?","hoofstukke":[["Genesis","GEN",4],["Genesis","GEN",5],["Genesis","GEN",6],["Genesis","GEN",7]]},{"dag":9,"ref":"Genesis 8 – 11","titel":"'n Nuwe Begin, die Volke en Babel","fase":2,"tydlyn":"Ná die vloed. Hoofstuk 11 eindig by Abram, wat ons by c. 2000 v.C. bring.","agtergrond":"Ná die vloed sluit God 'n verbond met Noag en die hele skepping, met die reënboog as teken. Hoofstuk 10 (\"die tafel van die nasies\") gee 'n oorsig van volke wat uit Noag se seuns Sem, Gam en Jafet ontstaan het. Babel was in Sinear (Mesopotamië, die gebied van die Eufraat en Tigris). Mesopotamiese stede het groot trappiramides (ziggoerats) gebou – tempeltorings wat as 'n \"trap\" tussen hemel en aarde beskou is. Die bouers wou 'n naam vir hulleself maak en nie oor die aarde versprei nie, terwyl God beveel het dat hulle die aarde moes vul (9:1).","leer":"God is getrou aan Sy beloftes, selfs al bly die mens se hart sondig (8:21). Hoogmoed – om 'n naam vir onsself te maak sonder God – lei tot verwarring en verdeeldheid. Maar God se plan gaan voort: uit al die volke kies Hy een man, Abram, deur wie Hy die volke weer gaan seën.","skrif":"God dink aan Noag (8:1). Noag bou 'n altaar en offer (8:20). God belowe: \"solank as die aarde bestaan, sal saaityd en oestyd... nie ophou nie\" (8:22). Die mens is na God se beeld gemaak, daarom is menselewe heilig (9:6). Die reënboog as teken van die verbond (9:12–17). Noag se dronkenskap en Gam se oneerbiedigheid (9:20–27) wys dat sonde voortduur. \"Kom, laat ons vir ons 'n stad bou en 'n toring... en laat ons vir ons 'n naam maak\" (11:4). God verwar hulle taal (11:7–9). Die geslagslyn van Sem eindig by Abram en Sarai, wat onvrugbaar was (11:26–30).","bid":"Dank God dat Hy Sy beloftes hou, soos die reënboog ons herinner. Bid dat ons nie vir onsself 'n naam sal probeer maak nie, maar Sy Naam groot sal maak – op skool, op die sportveld en aanlyn. Bid vir eenheid in ons gesin, gebou op God.","vraag":"Wat is die verskil tussen hard werk om iets goeds te bereik, en \"vir jouself 'n naam maak\" soos by Babel?","hoofstukke":[["Genesis","GEN",8],["Genesis","GEN",9],["Genesis","GEN",10],["Genesis","GEN",11]]},{"dag":10,"ref":"Genesis 12 – 14","titel":"Die Roeping van Abram","fase":2,"tydlyn":"c. 2000 v.C. (by benadering). Van Ur en Haran (Mesopotamië) na Kanaän en Egipte.","agtergrond":"Ur was 'n welvarende stad in suidelike Mesopotamië waar die maangod aanbid is; Josua 24:2 sê Abram se familie het ander gode gedien. Kanaän (later Israel) was 'n strook land tussen die groot ryke Egipte en Mesopotamië, met stadstate en hul eie konings. Hongersnood het mense dikwels na Egipte laat trek, waar die Nyl betroubare oeste gegee het. Melgisedek was koning van Salem (later Jerusalem) en priester van God die Allerhoogste – 'n geheimsinnige figuur wat in Psalm 110 en Hebreërs 7 na Christus wys.","leer":"God se reddingsplan begin met 'n persoonlike roeping en 'n belofte: land, nageslag en seën – en deur Abram sal al die geslagte van die aarde geseën word. Geloof beteken om God op Sy woord te neem en te gaan, al weet jy nie presies waarheen nie. Selfs mense van geloof faal (Abram lieg oor Sarai), maar God bly getrou.","skrif":"\"Gaan uit jou land... en in jou sal al die geslagte van die aarde geseën word\" (12:1–3). Abram gaan soos die Here gesê het (12:4) en bou altare (12:7–8). Uit vrees lieg hy in Egipte oor Sarai (12:10–20). Hy laat Lot eerste kies, en Lot kies die vrugbare vlakte naby Sodom (13:8–13). God herhaal die belofte (13:14–17). Abram red Lot (14:14–16). Melgisedek seën Abram en Abram gee hom 'n tiende (14:18–20). Abram weier om iets van die koning van Sodom te neem (14:22–23).","bid":"Dank God dat Hy mense roep en Sy plan deur gewone gesinne uitwerk. Bid vir geloof om God te gehoorsaam as die pad nie duidelik is nie. Bid dat ons gesin 'n seën vir ander sal wees, en dat ons nie uit vrees sal lieg nie.","vraag":"Lot het gekies wat die beste gelyk het. Hoe besluit ons waar ons tyd, vriende en keuses heen gaan?","hoofstukke":[["Genesis","GEN",12],["Genesis","GEN",13],["Genesis","GEN",14]]},{"dag":11,"ref":"Genesis 15 – 17","titel":"Die Verbond: Geloof en Wag","fase":2,"tydlyn":"c. 2000 v.C. Abram is sowat 85–99 jaar oud (16:16; 17:1). Kanaän.","agtergrond":"In die antieke wêreld is verbonde (ooreenkomste) soms gesluit deur diere te slag en tussen die helftes deur te loop: die een wat deurloop, sê in effek \"laat met my gebeur soos met hierdie diere as ek die verbond verbreek\" (vgl. Jeremia 34:18). In Genesis 15 loop net God (as 'n rokende oond en vuurfakkel) tussen die stukke deur – Hy neem die verpligting op Homself. Volgens destydse gebruik kon 'n onvrugbare vrou haar slavin aan haar man gee om vir haar kinders te hê; dit was sosiaal aanvaar, maar nie God se plan nie.","leer":"'n Mens word reg voor God deur geloof – deur Hom te glo – nie deur eie prestasie nie. God hou Sy beloftes, maar Sy tydsberekening is nie altyd ons s'n nie. Wanneer ons probeer om God se beloftes met ons eie planne \"te help\", lei dit dikwels tot pyn. God gee nuwe name as teken van 'n nuwe identiteit.","skrif":"\"En hy het in die Here geglo, en Hy het hom dit tot geregtigheid gereken\" (15:6; aangehaal in Romeine 4:3). God alleen gaan tussen die stukke deur (15:17–18). Sarai gee Hagar aan Abram; spanning en pyn volg (16:1–6). God sien en hoor Hagar in die woestyn – \"U is 'n God wat sien\" (16:13). God noem Homself die Almagtige en verander Abram se naam na Abraham (\"vader van 'n menigte\") en Sarai s'n na Sara (17:1–5, 15). Die besnydenis as teken van die verbond (17:10–11). Abraham lag oor 'n seun op 100 (17:17).","bid":"Dank God dat ons gered word deur geloof in Jesus, nie deur goed genoeg te wees nie. Bid vir geduld wanneer God se antwoorde lank neem. Dank Hom dat Hy, soos vir Hagar, die God is wat elkeen van ons sien – ook wanneer ons alleen of verwerp voel.","vraag":"Wanneer was dit vir jou moeilik om op God te wag? Wat het jy gedoen?","hoofstukke":[["Genesis","GEN",15],["Genesis","GEN",16],["Genesis","GEN",17]]},{"dag":12,"ref":"Genesis 18 – 20","titel":"Die Regter van die Aarde en die Oordeel oor Sodom","fase":2,"tydlyn":"c. 2000 v.C. Die eikebome van Mamre by Hebron, en die Jordaanvlakte (Sodom en Gomorra, suid van die Dooie See).","agtergrond":"Gasvryheid was 'n heilige plig in die Ooste: Abraham bedien die drie besoekers ruim. Een van die drie is die Here self (18:1, 13). Sodom en Gomorra was ryk stede in die vrugbare vlakte, maar volgens Esegiël 16:49 ook trots, oorvloedig en sonder sorg vir die armes, en Genesis 19 wys hul seksuele geweld. Let wel: hoofstuk 19 bevat volwasse temas (seksuele geweld en bloedskande); gesels ouderdomsgepas daaroor. Abimelek was 'n koning in Gerar, in die suide.","leer":"Niks is vir die Here te wonderlik nie. God is regverdig en oordeel sonde, maar Hy luister ook na voorbidding en red dié wat Syne is. Ons kan soos Abraham vrymoedig vir ander pleit. Lot se vrou wys die gevaar van 'n hart wat aan die wêreld vashou.","skrif":"\"Sou daar vir die Here iets te wonderlik wees?\" (18:14). God het Abraham uitverkies sodat hy sy kinders sal beveel om die weg van die Here te hou (18:19). Abraham pleit vir Sodom: \"Sal die Regter van die ganse aarde nie reg doen nie?\" (18:25, 23–32). Die mans van Sodom se goddeloosheid (19:4–11). Die engele trek die talmende Lot aan die hand uit (19:16). Lot se vrou kyk om (19:26; vgl. Lukas 17:32). Abraham lieg weer oor Sara (20:2), maar God beskerm Sy belofte.","bid":"Bid soos Abraham vir ons stad, ons land en vriende wat God nie ken nie. Bid dat ons as gesin \"die weg van die Here\" sal hou (18:19). Bid dat ons harte nie aan die wêreld sal vashou nie, en dat ons sonde ernstig sal opneem.","vraag":"Waarvoor sou jy, soos Abraham, vir ander mense by God pleit?","hoofstukke":[["Genesis","GEN",18],["Genesis","GEN",19],["Genesis","GEN",20]]},{"dag":13,"ref":"Genesis 21 – 23","titel":"Isak en die Toets op die Berg","fase":2,"tydlyn":"c. 2000–1900 v.C. Berseba (in die suide) en die berg Moria (later die tempelberg in Jerusalem, 2 Kronieke 3:1).","agtergrond":"Isak se naam beteken \"hy lag\" – die ongeloof-lag van Abraham en Sara (17:17; 18:12) word 'n vreugde-lag (21:6). In die Kanaänitiese wêreld is kinders soms aan gode geoffer; God sou dit later streng verbied (Levitikus 18:21). Daarom is Genesis 22 nie 'n opdrag om kinders te offer nie, maar 'n toets van Abraham se vertroue, waarin God self die offer voorsien. Die grot van Makpela by Hebron was die eerste stukkie van die beloofde land wat Abraham wettig besit het.","leer":"God hou Sy belofte op Sy tyd. Ware geloof hou niks terug van God nie – selfs nie die beste geskenk wat Hy gegee het nie – omdat ons vertrou dat Hy goed is. God sal self voorsien: op dieselfde berggebied het God eeue later Sy eie Seun as offer gegee.","skrif":"Die Here besoek Sara soos Hy gesê het (21:1–2). God hoor die seun Ismael se stem en sorg vir hom en Hagar (21:17–19). \"God het Abraham op die proef gestel\" (22:1). \"Neem nou jou seun, jou enigste, wat jy liefhet, Isak\" (22:2). \"God sal vir Hom die lam vir die brandoffer voorsien, my seun\" (22:8). Die ram in die bos in Isak se plek (22:13). Abraham noem die plek \"Die Here sal voorsien\" (22:14). Hebreërs 11:17–19 sê Abraham het geglo God kan selfs uit die dood opwek. Abraham koop die grafplek vir Sara (23:16–20).","bid":"Dank die Vader dat Hy Sy enigste Seun, wat Hy liefhet, vir ons gegee het (Johannes 3:16). Bid dat niks in ons lewe vir ons belangriker word as God nie – nie sport, punte, vriende of skerms nie. Bid vir vertroue dat God sal voorsien.","vraag":"Wat in jou lewe sou vir jou die moeilikste wees om in God se hande te los?","hoofstukke":[["Genesis","GEN",21],["Genesis","GEN",22],["Genesis","GEN",23]]},{"dag":14,"ref":"Genesis 24 – 26","titel":"God se Leiding: Rebekka, Jakob en Esau","fase":2,"tydlyn":"c. 1950–1850 v.C. Van Kanaän na Aram-Naharaim (Noord-Mesopotamië, waar Abraham se familie gebly het) en terug.","agtergrond":"Huwelike is destyds deur families gereël. Abraham wou nie hê Isak moes met 'n Kanaänitiese vrou trou wat ander gode dien nie, maar ook nie dat hy na Mesopotamië terugkeer nie. Die eersgeboortereg het die oudste seun 'n dubbele erfdeel en leierskap van die familie gegee – en in hierdie familie ook die verbondsbelofte. Om dit vir 'n bord kos te verkoop, wys hoe min Esau dit op prys gestel het (vgl. Hebreërs 12:16). Putte was lewensbelangrik in die droë suide en het dikwels tot twis gelei.","leer":"God lei dié wat Hom in gebed soek, ook in die groot keuses van die lewe soos 'n huweliksmaat. Ons moet waardeer wat God ons gegee het, en nie geestelike seëninge vir onmiddellike begeertes verruil nie. God se beloftes gaan oor na die volgende geslag – dit word nie geërf deur verdienste nie, maar deur genade.","skrif":"Abraham se dienaar bid vir leiding (24:12–14), en die antwoord kom nog voor hy klaar gebid het (24:15). Hy aanbid die Here vir Sy trou (24:27). Rebekka kies self om te gaan: \"Ek sal gaan\" (24:58). Isak het Rebekka liefgehad (24:67). Die tweeling stoei in die moederskoot; \"die oudste sal die jongste dien\" (25:23). Esau verkoop sy eersgeboortereg (25:29–34). God herhaal aan Isak die belofte aan Abraham (26:3–5, 24). Isak herhaal sy pa se fout en lieg oor Rebekka (26:7). Isak gee pad liewer as om te baklei oor putte, en die Here gee ruimte (26:22).","bid":"Bid nou al vir die toekomstige huweliksmaats van ons gesin se kinders – dat God hulle sal lei en dat hulle met mense sal trou wat die Here liefhet. Bid dat ons nie God se seëninge sal ruil vir iets wat net nou lekker is nie.","vraag":"Wat is 'n voorbeeld van \"die eersgeboortereg verkoop vir 'n bord kos\" in 'n tiener se lewe vandag?","hoofstukke":[["Genesis","GEN",24],["Genesis","GEN",25],["Genesis","GEN",26]]},{"dag":15,"ref":"Genesis 27 – 29","titel":"Bedrog, die Leer na die Hemel en 'n Bedrieër Bedrieg","fase":2,"tydlyn":"c. 1900–1850 v.C. Berseba, Bet-el (noord van Jerusalem) en Haran.","agtergrond":"'n Vader se seën voor sy dood is as bindend en profeties beskou – dit kon nie teruggetrek word nie. Jakob se naam word verbind met \"hakskeen\" en \"bedrieg\" (27:36). Die \"leer\" in Jakob se droom het moontlik gelyk soos 'n trap of ziggoerat tussen hemel en aarde. Bet-el beteken \"huis van God\". Laban gebruik die destydse gebruik van sluiers en die feestelike huweliksaand om Jakob te bedrieg.","leer":"Bedrog bring pyn en verdeeldheid, selfs wanneer dit 'n goeie doel lyk te dien. Tog kom God na Jakob op die vlug – nie omdat Jakob dit verdien nie, maar uit genade – en belowe om met hom te wees. Ons oes wat ons saai: die bedrieër word self bedrieg. God sien die ongeliefde (Lea) raak.","skrif":"Rebekka en Jakob bedrieg die blinde Isak (27:5–29). Esau se bitter geween en haat (27:34, 41). Jakob se droom: engele klim op en af; God sê: \"Ek is met jou en sal jou bewaar oral waar jy gaan\" (28:12–15). \"Waarlik, die Here is op hierdie plek, en ek het dit nie geweet nie\" (28:16). Jakob werk sewe jaar vir Ragel – \"en dit was in sy oë soos 'n paar dae\" (29:20). Laban bedrieg hom met Lea (29:25). \"Toe die Here sien dat Lea geminag word...\" (29:31). Lea se vierde seun Juda: \"Hierdie keer sal ek die Here loof\" (29:35) – die stam waaruit Jesus kom.","bid":"Bid dat ons eerlik sal wees met mekaar, selfs wanneer 'n leuen makliker lyk. Dank God dat Hy ook na ons kom wanneer ons op ons swakste is. Bid vir enigiemand wat ons ken wat \"ongesien\" of minder geliefd voel, en dat ons hulle sal raaksien soos God.","vraag":"Jesus verwys in Johannes 1:51 na Jakob se leer. Wat sê dit oor wie Jesus is?","hoofstukke":[["Genesis","GEN",27],["Genesis","GEN",28],["Genesis","GEN",29]]},{"dag":16,"ref":"Genesis 30 – 32","titel":"Jakob Worstel met God","fase":2,"tydlyn":"c. 1880–1850 v.C. Twintig jaar in Haran (31:38), dan terug na Kanaän: Gilead en Pniël by die Jabbok-rivier, oos van die Jordaan.","agtergrond":"Die wedywering tussen Lea en Ragel wys die pyn van poligamie (meer as een vrou) – die Bybel beskryf dit eerlik, maar keur dit nie goed nie (Genesis 2:24). Huisgode (terafim) was klein beeldjies wat verband gehou het met familie-erfenis en bygeloof. Jakob se tegniek met die gestreepte stokke (30:37–43) weerspieël destydse idees; 31:9–12 maak dit duidelik dat dit eintlik God was wat hom geseën het.","leer":"God bly getrou aan 'n gebroke familie en lei Jakob terug soos Hy belowe het. Ware verandering kom wanneer ons ophou om in eie krag te veg, en aan God vasklou vir Sy seën. Jakob word Israel – iemand wat met God geworstel en oorwin het – maar hy loop daarna mank, as herinnering aan sy afhanklikheid.","skrif":"Ragel en Lea se wedywering oor kinders (30:1–24); God dink aan Ragel en Josef word gebore (30:22–24). Die Here sê vir Jakob: \"Gaan terug... en Ek sal met jou wees\" (31:3). Laban en Jakob sluit 'n verbond by Mispa (31:49). Jakob se gebed: \"Ek is te gering vir al die goedertierenhede\" (32:10). Die worsteling in die nag: \"Ek sal U nie laat gaan nie, tensy U my seën\" (32:26). \"Jou naam sal voortaan nie Jakob wees nie, maar Israel\" (32:28). Hy noem die plek Pniël – \"ek het God gesien van aangesig tot aangesig\" (32:30).","bid":"Bid vir ons gesin dat ons nie met mekaar sal wedywer nie, maar mekaar sal opbou. Bid dat ons God se seën sal soek met dieselfde vasberadenheid as Jakob. Dank Hom vir die \"mank-loop\"-oomblikke wat ons van Hom afhanklik hou.","vraag":"Jakob het sy hele lewe in eie krag \"geworstel\". Wat het in die nag by die Jabbok verander?","hoofstukke":[["Genesis","GEN",30],["Genesis","GEN",31],["Genesis","GEN",32]]},{"dag":17,"ref":"Genesis 33 – 36","titel":"Versoening, Skande en Terugkeer na Bet-el","fase":2,"tydlyn":"c. 1850 v.C. Sigem, Bet-el, Betlehem (Efrata) en Hebron in Kanaän; Edom (suidoos van die Dooie See).","agtergrond":"Esau se nakomelinge word die Edomiete (hoofstuk 36), wat later dikwels Israel se vyande was. Let wel: hoofstuk 34 vertel van die verkragting van Dina en die wrede wraak van haar broers Simeon en Levi – gesels ouderdomsgepas daaroor. Die besnydenis, 'n heilige teken van God se verbond, is deur Jakob se seuns misbruik as 'n wapen van bedrog. In 49:5–7 veroordeel Jakob hulle geweld. Hoofstuk 36 is 'n geslagsregister – dit wys dat God ook Sy belofte aan Esau (25:23; 27:39–40) nagekom het.","leer":"Versoening is moontlik wanneer ons nederig na mense gaan wat ons seergemaak het. Sonde in 'n gesin – onreg én wraak – het verwoestende gevolge. God roep Jakob se huis tot vernuwing: \"verwyder die vreemde gode, reinig julle\" en gaan terug na die plek waar God met jou gepraat het.","skrif":"Esau hardloop Jakob tegemoet, omhels hom en hulle huil (33:4). Jakob bou 'n altaar: \"God, die God van Israel\" (33:20). Dina se verkragting (34:2) en die broers se bedrog en slagting (34:13, 25). Jakob se reaksie toon meer vrees as geregtigheid (34:30). \"Verwyder die vreemde gode wat onder julle is, en reinig julle\" (35:2). God bevestig die naam Israel en die belofte (35:10–12). Ragel sterf by Benjamin se geboorte (35:16–19). Isak sterf; Esau en Jakob begrawe hom saam (35:29).","bid":"Bid vir versoening in enige gebroke verhouding in ons familie of vriendekring. Bid vir beskerming vir die dogter in ons gesin en vir alle dogters en vroue, en dat ons seuns mans sal wees wat beskerm en nie misbruik nie. Bid dat ons \"vreemde gode\" – dinge wat God se plek inneem – uit ons huis sal verwyder.","vraag":"Wat het Jakob nodig gehad om na Esau te gaan? Is daar iemand met wie jy vrede moet maak?","hoofstukke":[["Genesis","GEN",33],["Genesis","GEN",34],["Genesis","GEN",35],["Genesis","GEN",36]]},{"dag":18,"ref":"Genesis 37 – 39","titel":"Josef: Verraai, Verkoop, maar nie Verlaat nie","fase":2,"tydlyn":"c. 1900–1880 v.C. (by benadering). Hebron, Dotan, en Egipte (waarskynlik die Middelryk-periode).","agtergrond":"Die kleed met lang moue (of \"veelkleurige rok\") was 'n teken van voorkeur – Jakob het dieselfde fout as sy ouers gemaak deur een kind voor te trek. Handelaars-karavane het speserye en slawe tussen Gilead en Egipte vervoer; 20 sikkels silwer was 'n bekende prys vir 'n slaaf in hierdie periode. Let wel: hoofstuk 38 vertel van Juda en Tamar (met volwasse temas). Dit wys Juda se morele verval, maar uit hierdie verhouding kom Peres, 'n voorvader van Dawid en Jesus (Rut 4:18–22; Matteus 1:3). Potifar was 'n hoë amptenaar van die farao.","leer":"God is met Sy kinders ook in die put, in slawerny en in die tronk. Jaloesie en voortrekkery verwoes gesinne. God se genade bereik selfs dié wat skandelik gesondig het (Juda en Tamar). Josef wys hoe 'n jong man – ver van sy pa se huis, waar niemand kyk nie – trou bly aan God en wegvlug van versoeking.","skrif":"Jakob het Josef meer liefgehad en die broers haat hom (37:3–4). Die drome van die gerwe en sterre (37:5–11). Die broers gooi hom in 'n put en verkoop hom (37:24–28). Jakob se rou (37:34–35). Tamar: \"Sy is meer regverdig as ek\" (38:26). \"Maar die Here was met Josef\" (39:2, 21, 23). Josef weier Potifar se vrou: \"Hoe kan ek dan hierdie groot kwaad doen en teen God sondig?\" (39:9). Hy vlug en los sy kleed (39:12). Hy word onregverdig in die tronk gegooi, maar die Here betoon hom guns (39:20–21).","bid":"Bid dat ons gesin nooit voortrekkery of jaloesie sal toelaat nie. Bid vir ons gesin se kinders se suiwerheid – dat hulle soos Josef sal \"vlug\" van seksuele versoeking en verkeerde inhoud, ook wanneer niemand kyk nie. Dank God dat Hy met ons is, ook in onregverdige omstandighede.","vraag":"Josef het gesê: \"Hoe kan ek... teen God sondig?\" Waarom het hy dit as 'n sonde teen God gesien, en nie net teen Potifar nie?","hoofstukke":[["Genesis","GEN",37],["Genesis","GEN",38],["Genesis","GEN",39]]},{"dag":19,"ref":"Genesis 40 – 42","titel":"Van die Tronk na die Paleis","fase":2,"tydlyn":"c. 1880–1870 v.C. Egipte. Josef is 30 jaar oud wanneer hy voor die farao staan (41:46).","agtergrond":"Egiptenare het drome as boodskappe van die gode beskou en het professionele \"towenaars\" en drome-uitleggers by die hof gehad. Die Nyl se jaarlikse oorstroming het bepaal of daar oorvloed of hongersnood sou wees. Egipte het groot graanskure gehad, en in tye van hongersnood het volke uit Kanaän daar kos kom koop. Josef skeer hom voordat hy voor die farao verskyn – 'n Egiptiese gebruik (41:14).","leer":"God se tydsberekening is perfek, al voel die wag lank (twee volle jare, 41:1). Gawes kom van God, en ons moet Hom die eer gee. Wanneer God ons in 'n posisie van invloed plaas, is dit om ander te dien en te red. God gebruik moeilike omstandighede om skuldige harte tot berou te bring.","skrif":"\"Is die uitleggings nie God s'n nie?\" (40:8). Die skinker vergeet van Josef (40:23). Josef vir farao: \"Dit is buiten my; God sal 'n antwoord gee\" (41:16). Die sewe vet en sewe maer koeie (41:25–32). Farao: \"Sou ons iemand soos hierdie kan vind, 'n man in wie die Gees van God is?\" (41:38). Josef se seuns se name: Manasse (\"God het my laat vergeet\") en Efraim (\"God het my vrugbaar gemaak in die land van my ellende\") (41:51–52). Die broers buig voor Josef (42:6). Hulle erken: \"Waarlik, ons is skuldig oor ons broer\" (42:21).","bid":"Bid vir geduld wanneer ons drome en planne lank neem. Dank God vir elkeen se gawes, en bid dat ons Hom die eer sal gee. Bid dat ons, as ons mag of invloed kry, dit sal gebruik om ander te dien.","vraag":"Josef het 13 jaar lank swaargekry voor hy verhoog is. Wat het God in daardie jare in hom gevorm?","hoofstukke":[["Genesis","GEN",40],["Genesis","GEN",41],["Genesis","GEN",42]]},{"dag":20,"ref":"Genesis 43 – 45","titel":"Berou, Vergifnis en God se Groter Plan","fase":2,"tydlyn":"c. 1870 v.C. Egipte en Kanaän, in die tweede jaar van die hongersnood (45:6).","agtergrond":"Egiptenare het nie saam met Hebreërs geëet nie (43:32) – kulturele afstand was groot. 'n Silwerbeker is gebruik vir drink en is in die antieke wêreld soms ook vir waarsêery gebruik (44:5); Josef speel hier 'n rol om sy broers te toets. Die vraag is: Sal die broers nou vir die jongste gunsteling-seun (Benjamin) opstaan, waar hulle Josef 22 jaar vroeër verkoop het?","leer":"Ware berou word gesien in 'n veranderde lewe: Juda, wat voorgestel het om Josef te verkoop, bied homself aan as slaaf in Benjamin se plek. Vergifnis is moontlik wanneer ons God se hand in ons lewe raaksien. God werk selfs deur mense se sonde om Sy goeie plan uit te voer – sonder dat dit die sonde minder sondig maak.","skrif":"Juda neem verantwoordelikheid vir Benjamin (43:8–9). Josef huil in die geheim (43:30). Die beker in Benjamin se sak (44:12). Juda: \"Laat u dienaar tog in die plek van die seun... bly\" (44:33). Josef maak hom bekend: \"Ek is Josef, julle broer, wat julle na Egipte verkoop het\" (45:4). \"God het my voor julle uit gestuur om lewe te behou\" (45:5). \"Nie julle het my hierheen gestuur nie, maar God\" (45:8). Josef soen sy broers en huil (45:15).","bid":"Bid vir harte wat werklik berou het, en wat bereid is om ander te vergewe. Bid dat ons, soos Juda, bereid sal wees om vir ander in te staan. Dank Jesus, wat as die ware \"Juda-seun\" Homself in ons plek gegee het.","vraag":"Hoe kon Josef sy broers vergewe? Wat help jou om iemand te vergewe wat jou seergemaak het?","hoofstukke":[["Genesis","GEN",43],["Genesis","GEN",44],["Genesis","GEN",45]]},{"dag":21,"ref":"Genesis 46 – 48","titel":"Israel trek na Egipte","fase":2,"tydlyn":"c. 1876 v.C. volgens die vroeë chronologie (Exodus 12:40 noem 430 jaar in Egipte). Gosen, 'n vrugbare streek in die noordooste van die Nyldelta.","agtergrond":"Sewentig persone van Jakob se familie trek na Egipte (46:27). Egiptenare het skaapwagters verag (46:34), daarom woon Israel apart in Gosen – wat hulle as volk bymekaar hou en hulle help om nie in Egipte te verdwyn nie. Josef se ekonomiese beleid (47:13–26) het die farao baie mag gegee; dit weerspieël Egiptiese praktyke. Die seën van die kleinseuns, waar die jongste (Efraim) voor die oudste (Manasse) gestel word, herhaal 'n patroon in Genesis: God kies uit genade, nie volgens menslike rangorde nie.","leer":"God lei Sy volk stap vir stap, ook na plekke wat vreemd en vreesaanjaend lyk (\"Moenie bang wees om na Egipte af te trek nie\", 46:3). Hy is die God wat ons ons hele lewe lank lei (\"my Herder\", 48:15). Om 'n vreemdeling op aarde te wees, is deel van die geloofspad (47:9; Hebreërs 11:13).","skrif":"God sê vir Jakob: \"Ek self sal saam met jou na Egipte aftrek\" (46:3–4). Josef en Jakob se hereniging (46:29–30). Jakob seën die farao (47:7, 10). \"Die dae van die jare van my vreemdelingskap... was min en ongelukkig\" (47:9). Jakob laat Josef sweer om hom in Kanaän te begrawe (47:29–31). \"Die God wat my opgepas het van my bestaan af tot vandag toe\" (48:15). Hy kruis sy hande en seën Efraim bo Manasse (48:14, 19).","bid":"Dank God as die Herder van ons gesin, wat ons al die jare lei. Bid vir enige verandering of trek wat ons gesin of familie in die gesig staar. Bid dat ons as vreemdelinge op aarde sal leef, met ons oë op God se ewige belofte.","vraag":"Waar het jy al gesien dat God jou \"opgepas het\" in jou lewe tot nou toe?","hoofstukke":[["Genesis","GEN",46],["Genesis","GEN",47],["Genesis","GEN",48]]},{"dag":22,"ref":"Genesis 49 – 50","titel":"Die Koning uit Juda en God se Goeie Bedoeling","fase":2,"tydlyn":"c. 1859 v.C. (Jakob sterf op 147, 47:28) en later Josef op 110. Egipte en die begrafnis in Makpela, Kanaän.","agtergrond":"'n Sterwende vader se laaste woorde was profeties en het die toekoms van elke stam bepaal. Juda kry die koninklike belofte – die septer (staf van 'n koning) sal nie van hom wyk nie. Egiptenare het hulle dooies gebalsem (gemummifiseer), wat 40 dae geneem het (50:3). Josef vra dat sy beendere saamgeneem word wanneer God die volk uit Egipte lei – wat Moses later doen (Exodus 13:19).","leer":"Uit Juda sal 'n Koning kom aan wie die volke gehoorsaam sal wees: dit is Jesus, \"die Leeu uit die stam van Juda\" (Openbaring 5:5). God is soewerein: wat mense ten kwade bedoel, kan Hy ten goede omdraai. Geloof kyk vorentoe na God se beloftes, selfs op die sterfbed.","skrif":"Ruben, Simeon en Levi verloor voorrang weens hul sonde (49:3–7). \"Die septer sal van Juda nie wyk nie... totdat Silo kom; en aan hom sal die volke gehoorsaam wees\" (49:10). Jakob sterf en word in Kanaän begrawe (49:33; 50:13). Die broers is bang vir wraak (50:15). Josef: \"Is ek dan in die plek van God? Julle het wel kwaad teen my bedink, maar God het dit ten goede gedink\" (50:19–20). \"God sal julle sekerlik besoek en julle uit hierdie land laat optrek\" (50:24). Hebreërs 11:22 noem dit 'n daad van geloof.","bid":"Dank God dat Hy alle dinge, ook seer en onreg, ten goede kan laat meewerk vir dié wat Hom liefhet (Romeine 8:28). Bid vir enige situasie waar iemand ons kwaad aangedoen het, dat ons God se hand daarin sal sien en nie wraak sal soek nie. Loof Jesus as die Koning uit Juda.","vraag":"Josef sê: \"Is ek dan in die plek van God?\" Wat bedoel hy, en hoe help dit ons om nie wraak te neem nie?","hoofstukke":[["Genesis","GEN",49],["Genesis","GEN",50]]},{"dag":23,"ref":"Job 1 – 3","titel":"Wanneer die Regverdige Ly","fase":2,"tydlyn":"Onbekend; die verhaal speel waarskynlik af in die tyd van die aartsvaders (c. 2000–1800 v.C.). Us, waarskynlik oos van Israel, naby Edom of Arabië.","agtergrond":"Job is nie 'n Israeliet nie, maar 'n man uit die Ooste wat God gevrees het. Die boek is grootliks Hebreeuse poësie, en een van die oudste wysheidsgeskrifte. Die leser kry 'n blik \"agter die skerms\" (die hemelse raad in hoofstuk 1–2) wat Job self nooit te sien kry nie. \"Die Satan\" beteken \"die aanklaer\" of \"teëstander\". Die algemene oortuiging destyds was: as jy ly, het jy gesondig – die boek bevraagteken dit sterk.","leer":"Lyding is nie altyd 'n straf vir sonde nie. Die Satan beweer dat mense God net dien vir wat hulle kan kry; Job se lewe bewys dat 'n mens God om Homself kan liefhê. God is in beheer, selfs van die Satan se grense. Eerlike klag voor God is nie ongeloof nie – Job praat met God, nie weg van Hom nie.","skrif":"Job was vroom en opreg, het God gevrees en die kwaad vermy (1:1). Die Satan: \"Is dit verniet dat Job God vrees?\" (1:9). God stel grense (1:12; 2:6). Job verloor alles en sê: \"Die Here het gegee, en die Here het geneem; laat die Naam van die Here geloofd wees\" (1:21). \"Sou ons die goeie van God ontvang en die kwaad nie ontvang nie?\" (2:10). Die vriende sit sewe dae lank stil by hom (2:13) – hul beste oomblik. Job vervloek die dag van sy geboorte (3:1–3).","bid":"Bid vir mense wat ons ken wat swaarkry – siekte, verlies of rou. Bid dat ons God sal liefhê om wie Hy is, nie net vir wat Hy gee nie. Bid dat ons, soos Job se vriende in hoofstuk 2, sal weet hoe om net by iemand te wees wat seer het.","vraag":"Waarom dink jy was die vriende se stilte (2:13) beter as die woorde wat daarna kom?","hoofstukke":[["Job","JOB",1],["Job","JOB",2],["Job","JOB",3]]},{"dag":24,"ref":"Job 4 – 7","titel":"Elifas se Goedbedoelde maar Verkeerde Raad","fase":2,"tydlyn":"Die gesprekke van Job en sy drie vriende (eerste rondte).","agtergrond":"Die boek is opgebou in drie rondtes gesprekke: Elifas, Bildad en Sofar praat elkeen, en Job antwoord elkeen. Die vriende praat baie dinge wat op sigself waar klink, maar hulle pas dit verkeerd toe. Aan die einde sê God dat hulle nie reg van Hom gespreek het nie (42:7). Daarom moet ons die toesprake van die vriende versigtig lees: dit is betroubaar opgeteken, maar nie alles wat hulle sê, is God se boodskap nie.","leer":"Die waarheid kan wreed word as dit sonder liefde en sonder volle kennis toegepas word. Ons moet versigtig wees om te dink ons weet waarom iemand anders ly. Job se eerlike klagtes (hoofstuk 6–7) wys dat God genoeg ruimte het vir ons diepste pyn en vrae.","skrif":"Elifas: \"Wie het ooit as onskuldige omgekom?\" (4:7) – met ander woorde, Job moet gesondig het. Elifas beroep hom op 'n geheimsinnige nagtelike visioen (4:12–17). \"Salig is die mens wat God bestraf\" (5:17) – waar, maar verkeerd toegepas. Job: \"Vir hom wat beswyk, behoort daar liefde te wees van sy vriend\" (6:14). Sy vriende is soos 'n droë spruit (6:15–20). Job kla eerlik teenoor God: \"Wat is die mens dat U hom so hoog ag?\" (7:17).","bid":"Bid vir wysheid om vriende in moeilike tye met liefde te ondersteun, sonder vinnige oordele of maklike antwoorde. Dank God dat ons eerlik met Hom kan wees oor ons gevoelens en vrae.","vraag":"Wanneer 'n vriend swaarkry, wat is die mees ondersteunende ding wat jy kan sê of doen?","hoofstukke":[["Job","JOB",4],["Job","JOB",5],["Job","JOB",6],["Job","JOB",7]]},{"dag":25,"ref":"Job 8 – 10","titel":"Bildad en Job se Soeke na 'n Middelaar","fase":2,"tydlyn":"Die eerste rondte gaan voort.","agtergrond":"Bildad beroep hom op die tradisie en wysheid van die vorige geslagte. Sy redenasie is eenvoudig: God is regverdig, dus het Job se kinders gesterf weens hul sonde (8:4) – 'n uiters wrede opmerking. Job worstel in hoofstuk 9–10 met die vraag hoe 'n mens ooit reg kan wees voor 'n heilige God, en verlang na 'n skeidsregter (middelaar) tussen hom en God.","leer":"Ons kan nie uit eie krag reg voor God staan nie. Job se verlange na 'n middelaar wat \"sy hand op ons albei kan lê\" (9:33) word vervul in Jesus, die enigste Middelaar tussen God en mense (1 Timoteus 2:5). Ons moet ook versigtig wees om nie God se regverdigheid as 'n wapen teen mense wat ly te gebruik nie.","skrif":"Bildad: \"Sal God die reg verdraai?\" (8:3), en hy suggereer dat Job se kinders vir hul sonde gesterf het (8:4). Job: \"Hoe kan 'n mens regverdig wees by God?\" (9:2). God se grootheid in die skepping (9:8–10). \"Daar is tussen ons geen skeidsregter wat sy hand op ons albei kan lê nie\" (9:33). Job erken dat God hom gemaak het: \"U hande het my gevorm en gemaak\" (10:8).","bid":"Dank God vir Jesus, die Middelaar waarna Job verlang het. Bid vir mense wat voel God is ver of teen hulle. Bid dat ons nooit God se waarheid sonder liefde sal gebruik nie.","vraag":"Hoe beantwoord Jesus Job se vraag in 9:33?","hoofstukke":[["Job","JOB",8],["Job","JOB",9],["Job","JOB",10]]},{"dag":26,"ref":"Job 11 – 14","titel":"Sofar en Job se Vraag oor die Dood","fase":2,"tydlyn":"Die eerste rondte eindig.","agtergrond":"Sofar is die skerpste van die drie vriende. Hy sê dat Job eintlik minder straf kry as wat hy verdien (11:6). In hoofstuk 12–14 antwoord Job lank: hy weet net so veel van God se grootheid soos hulle, maar hulle verdedig God met leuens (13:7). In die Ou Testament is daar nog nie volle lig oor die lewe ná die dood nie; Job worstel met die vraag of 'n mens wat sterf, weer sal lewe (14:14).","leer":"God se wysheid is groter as ons s'n, en ons kan nie Sy weë verklaar met eenvoudige formules nie. Selfs in die donkerste tye kan ons, soos Job, aan God vasklou. Job se vraag oor lewe ná die dood word deur Jesus se opstanding beantwoord.","skrif":"Sofar: \"Kan jy die diepte van God uitvind?\" (11:7). Job: \"In sy hand is die siel van al wat lewe\" (12:10). \"Kyk, al sou Hy my doodmaak, ek sal op Hom wag\" (13:15). Hy wil sy saak voor God self stel (13:3). \"As 'n man sterwe, sal hy weer lewe?\" (14:14).","bid":"Dank God dat Jesus die opstanding en die lewe is (Johannes 11:25) en die antwoord op Job se vraag. Bid vir ons as gesin om aan God vas te hou al verstaan ons nie altyd wat Hy doen nie.","vraag":"Job sê: \"Al sou Hy my doodmaak, ek sal op Hom wag.\" Wat beteken dit om God só te vertrou?","hoofstukke":[["Job","JOB",11],["Job","JOB",12],["Job","JOB",13],["Job","JOB",14]]},{"dag":27,"ref":"Job 15 – 17","titel":"Die Tweede Rondte: Moeilike Vriende","fase":2,"tydlyn":"Die tweede rondte gesprekke begin.","agtergrond":"In die tweede rondte word die vriende harder en beskryf hulle die lot van \"die goddelose\" in die hoop dat Job homself daarin sal herken. Job noem hulle \"moeilike trooster\" (16:2). Tog sien Job in sy pyn 'n getuie vir hom in die hemel (16:19) – 'n diep geloofsoomblik.","leer":"Woorde kan seermaak of genees. Wanneer mense ons verkeerd verstaan, kan ons ons saak aan God toevertrou, wat ons harte ken. Job se geloof dat daar 'n getuie en voorspraak in die hemel is, wys vorentoe na Christus wat vir ons intree (Hebreërs 7:25; 1 Johannes 2:1).","skrif":"Elifas beskuldig Job dat hy die vrees vir God vernietig (15:4). Job: \"Moeilike trooster is julle almal\" (16:2). \"As ek in julle plek was... ek sou julle versterk met my mond\" (16:4–5). \"Selfs nou, kyk, in die hemel is my getuie\" (16:19). Job is 'n spotwoord vir die mense (17:6).","bid":"Bid dat ons woorde opbouend sal wees – teenoor mekaar in die huis en teenoor vriende. Dank Jesus dat Hy ons Voorspraak by die Vader is. Bid vir enigiemand wat ons ken wat verkeerd verstaan of geskinder word.","vraag":"Dink aan 'n keer toe iemand se woorde jou regtig getroos het. Wat het hulle gesê of gedoen?","hoofstukke":[["Job","JOB",15],["Job","JOB",16],["Job","JOB",17]]},{"dag":28,"ref":"Job 18 – 21","titel":"\"Ek Weet: My Verlosser Leef\"","fase":2,"tydlyn":"Die tweede rondte gaan voort.","agtergrond":"Bildad beskryf weer die einde van die goddelose. Job voel verlaat deur familie, vriende en selfs bediendes (19:13–19). Tog kom een van die hoogtepunte van die Ou Testament: Job se belydenis dat sy \"Losser\" (Hebreeus go'el – 'n familielid wat 'n verarmde of gevange familielid vrykoop en vir hom opkom) lewe. In hoofstuk 21 weerlê Job die vriende se teorie: in die werklikheid gaan dit dikwels goed met goddeloses.","leer":"Selfs in totale verlatenheid kan geloof sê: \"Ek weet my Verlosser leef.\" Hierdie hoop word volledig vervul in Jesus, ons Losser wat ons vrygekoop het en weer sal kom. Die wêreld se voorspoed of teëspoed is nie 'n betroubare maatstaf van wie reg is voor God nie.","skrif":"Bildad oor die goddelose se lot (18:5–21). Job: \"Ontferm julle oor my, o my vriende, want die hand van God het my getref\" (19:21). \"Maar ek weet: my Verlosser leef, en as die laaste sal Hy oor die stof opstaan... en uit my vlees sal ek God aanskou\" (19:25–26). Sofar oor die korte vreugde van die goddelose (20:5). Job: \"Waarom bly die goddelose lewe, word oud?\" (21:7).","bid":"Dank Jesus as ons lewende Verlosser. Bid vir ons kinders dat hierdie sekerheid – \"ek weet\" – hulle eie sal wees. Bid vir mense wat verlate voel, dat hulle die Verlosser sal leer ken.","vraag":"Hoe kon Job sê \"ek weet my Verlosser leef\" toe hy alles verloor het?","hoofstukke":[["Job","JOB",18],["Job","JOB",19],["Job","JOB",20],["Job","JOB",21]]},{"dag":29,"ref":"Job 22 – 24","titel":"Die Derde Rondte: Waar is God?","fase":2,"tydlyn":"Die derde rondte gesprekke begin.","agtergrond":"Elifas beskuldig Job nou van spesifieke sondes, sonder enige bewys (22:5–9). Job reageer nie meer direk op sy vriende nie, maar soek God self: hy wil hê God moet hom antwoord. Hoofstuk 24 beskryf die onreg in die wêreld: die armes word uitgebuit en dit lyk of God niks doen nie.","leer":"Wanneer God stil lyk, is Hy nie afwesig nie. Job weet dat God sy pad ken, al kan hy God nie sien nie. Beproewing kan soos 'n vuur wees wat goud suiwer. Ons mag eerlik met God wees oor onreg in die wêreld.","skrif":"Elifas: \"Is jou boosheid nie groot nie?\" (22:5). \"Gaan tog met Hom om en hou vrede\" (22:21) – 'n goeie raad, verkeerd toegepas. Job: \"Ag, as ek maar wis hoe om Hom te vind!\" (23:3). \"Want Hy ken die weg wat by my is; as Hy my toets, sal ek soos goud uitkom\" (23:10). \"Ek het die woorde van sy mond meer bewaar as my eie voorneme\" (23:12). Die onreg teenoor die armes (24:2–12).","bid":"Bid vir mense wat onreg ly – armes, uitgebuites, vervolgde Christene. Bid dat ons God sal vertrou wanneer Hy stil lyk, en dat beproewings ons sal suiwer soos goud.","vraag":"Job sê God ken sy weg, al kan hy God nie sien nie. Hoe help dit jou wanneer God ver voel?","hoofstukke":[["Job","JOB",22],["Job","JOB",23],["Job","JOB",24]]},{"dag":30,"ref":"Job 25 – 28","titel":"Waar Word Wysheid Gevind?","fase":2,"tydlyn":"Die gesprekke eindig.","agtergrond":"Bildad se laaste toespraak is baie kort (hoofstuk 25) en Sofar praat glad nie meer nie – die vriende het niks meer om te sê nie. Job hou vas aan sy onskuld (hoofstuk 27). Hoofstuk 28 is 'n pragtige gedig oor wysheid: in die antieke wêreld het mense diep myne gegrawe vir silwer, goud, yster en edelstene, maar wysheid kan nie uitgegrawe of gekoop word nie.","leer":"Ware wysheid kom nie uit menslike vernuf, rykdom of tegnologie nie, maar van God. Die begin van wysheid is om die Here te vrees (diep eerbied en ontsag vir Hom) en van die kwaad af te wyk. Dit is 'n lewensles vir tieners in 'n wêreld vol inligting.","skrif":"\"Hoe kan die mens dan regverdig wees by God?\" (25:4). God se grootheid in die skepping: \"Kyk, dit is maar die soom van sy weë\" (26:14). Job hou vas aan sy opregtheid (27:5–6). Die mynwerker grawe diep in die aarde (28:1–11). \"Maar die wysheid – waar word dit gevind?\" (28:12). Dit kan nie met goud gekoop word nie (28:15–19). \"God ken die weg daarheen\" (28:23). \"Kyk, die vrees van die Here – dit is wysheid; en om van die kwaad af te wyk, is verstand\" (28:28).","bid":"Bid vir ware wysheid vir ons gesin se kinders – in hul keuses, vriendskappe en toekoms. Bid dat hulle God se wysheid bo die wêreld se kennis sal soek. Bid dat ons as gesin die Here met eerbied sal vrees en van die kwaad sal wegdraai.","vraag":"Wat is die verskil tussen baie kennis hê (inligting) en wys wees?","hoofstukke":[["Job","JOB",25],["Job","JOB",26],["Job","JOB",27],["Job","JOB",28]]},{"dag":31,"ref":"Job 29 – 31","titel":"Job se Laaste Verdediging","fase":2,"tydlyn":"Job se slottoespraak.","agtergrond":"Job kyk terug na sy vorige lewe van eer, toe hy die armes, weduwees en wese gehelp het (hoofstuk 29). Hy vergelyk dit met sy huidige vernedering (hoofstuk 30). In hoofstuk 31 sweer hy 'n reeks ede van onskuld: \"As ek dit gedoen het, laat dit en dat met my gebeur.\" Dit was 'n wettige manier om sy saak te stel en God uit te daag om te antwoord.","leer":"Job se lewe van integriteit is 'n model: reinheid van gedagtes, eerlikheid, regverdigheid teenoor werkers, sorg vir die armes, geen afgodery van geld nie. Integriteit begin in die hart en die oë, nie net by uiterlike dade nie. Maar selfs 'n regverdige mens kan nie God dwing om te antwoord nie.","skrif":"Job het die arme gered en die wees gehelp (29:12–16). \"Ek was oë vir die blinde en voete vir die kreupele\" (29:15). Sy vernedering: \"Nou lag hulle oor my wat jonger is as ek\" (30:1). \"Ek het 'n verbond gesluit met my oë; hoe sou ek dan op 'n jongmeisie let?\" (31:1). Hy het nie sy vertroue op goud gestel nie (31:24–28). Hy het nie oor sy vyand se ongeluk gejuig nie (31:29).","bid":"Bid dat ons, soos Job, \"'n verbond met ons oë\" sal sluit – veral in 'n wêreld van skerms en sosiale media. Bid vir integriteit in die klein dinge. Bid dat ons gesin oë vir die blindes en voete vir die kreupeles sal wees.","vraag":"Wat beteken dit prakties om \"'n verbond met jou oë\" te sluit as tiener vandag?","hoofstukke":[["Job","JOB",29],["Job","JOB",30],["Job","JOB",31]]},{"dag":32,"ref":"Job 32 – 34","titel":"Elihu, die Jong Man, Praat","fase":2,"tydlyn":"'n Nuwe stem tree op.","agtergrond":"Elihu is 'n jonger man wat respekvol gewag het terwyl die ouer manne praat. Hy is kwaad vir Job omdat Job homself regverdiger as God hou, en kwaad vir die vriende omdat hulle nie 'n antwoord gevind het nie. Uitleggers verskil oor Elihu: sommige sien hom as 'n voorbereiding vir God se toespraak, ander as nog 'n trotse stem. God kritiseer hom aan die einde nie, maar ook nie Job se antwoord op hom nie.","leer":"Wysheid kom nie outomaties met ouderdom nie, maar deur God se Gees (32:8). Elihu bring 'n nuwe insig: God kan lyding gebruik om mense te leer en te bewaar, nie net om hulle te straf nie. Jongmense kan 'n waardevolle stem hê wanneer hulle met respek en nederigheid praat.","skrif":"Elihu wag uit respek vir die ouer manne (32:4–6). \"Dit is die gees in die mens en die asem van die Almagtige wat hulle verstandig maak\" (32:8). God praat op verskillende maniere, ook deur pyn, om 'n mens van sy weg af terug te bring (33:14–30). \"Dit is ver van God om goddeloos te handel\" (34:10).","bid":"Bid vir ons gesin se kinders dat hulle met respek sal praat en luister, maar ook die moed sal hê om die waarheid in liefde te praat. Bid dat God lyding in ons lewe sal gebruik om ons nader aan Hom te bring.","vraag":"Elihu het gewag voor hy gepraat het. Wanneer is dit wys om eers te luister en wanneer om te praat?","hoofstukke":[["Job","JOB",32],["Job","JOB",33],["Job","JOB",34]]},{"dag":33,"ref":"Job 35 – 37","titel":"God se Grootheid in die Storm","fase":2,"tydlyn":"Elihu se toespraak eindig.","agtergrond":"Elihu beskryf die grootheid van God in die natuur – reën, weerlig, donderstorms, sneeu en wolke. In die antieke wêreld is storms dikwels aan gode toegeskryf (soos die Kanaänitiese stormgod Baäl), maar die Bybel sê die Here alleen regeer daaroor. Terwyl Elihu oor die storm praat, berei dit die toneel voor vir God wat \"uit die storm\" gaan praat (38:1).","leer":"God
